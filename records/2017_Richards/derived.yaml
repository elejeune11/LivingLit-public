    group: isoproterenol
    formula: not stated
    anchor: not stated
    no_formula: the measure is 'normalized beat rate' but neither the normalisation nor its reference is stated
    alternatives:
    - label: ratio to the same organoid's pre-treatment beat rate (as for F/F0)
      formula: r = f/fb
    - label: ratio to the baseline group mean
      formula: r = f/mb
    aggregation: not stated
  F4C_il6.expression:
    item: F4C_il6
    formula: e = 2^(-dct)
    anchor: &id001
      quote: Data was normalized as the change in cycle threshold (Ct) to the geometric mean of GAPDH and ACTB (dCt) and analyzed using,
        mRNA expression
      where: Methods (qRT-PCR)
      file: journal_version.pdf
    library:
      formula: ddct_relative_expression
      vars:
        r: e
        ddct: dct
    inputs:
      dct:
        not_stated: true
        kind: per sample
        note: Ct of the target minus the 'geometric mean of GAPDH and ACTB'; Ct values not printed
    alternatives:
    - label: reference = geometric mean of the two reference Ct values
      formula: dct = ct - sqrt(cg*ca)
    - label: reference = arithmetic mean of the reference Ct values (geometric mean of their quantities)
      formula: dct = ct - (cg + ca)/2
    aggregation: mean of per-sample
    note: No calibrator sample, so the model's ddct is the paper's dCt; 'Data was then averaged across n=3 experiments' gives the aggregation.
      Whether F7E/S12 bars are further normalised to control is not stated.
  S5_vegfa_org_vs_cm.expression:
    item: S5_vegfa_org_vs_cm
    formula: e = 2^(-dct)
    anchor: *id001
