3' fill='#d4553f'/><path d='M136.0 388.3 L168.0 388.3' fill='none' stroke='#1f2328' stroke-width='1.6' stroke-linejoin='round'/><path d='M152.0 396.7 L152.0 379.9' fill='none' stroke='#1f2328' stroke-width='1.2' stroke-linejoin='round'/><rect x='240' y='80' width='312' height='124' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='252.0' y='102.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Vector figure: the code uses the PDF&#x27;s objects</text><text x='252.0' y='122.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>every marker, bar and cap is a separate object:</text><text x='252.0' y='138.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>exact coordinates, even when markers overlap;</text><text x='252.0' y='154.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>tick marks and their labels calibrate the axis</text><text x='252.0' y='170.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='bold' text-anchor='start'>counts: exact</text><text x='252.0' y='186.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='bold' text-anchor='start'>uncertainty (measured): ≤ 0.5 pt</text><rect x='566' y='80' width='310' height='124' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='578.0' y='102.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Raster figure: the code uses the image</text><text x='578.0' y='122.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>axis and ticks found in the image; the reader</text><text x='578.0' y='138.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>transcribes tick labels, code fits even spacing;</text><text x='578.0' y='154.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>markers found by colour, error bars removed</text><text x='578.0' y='170.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='bold' text-anchor='start'>counts: only if every marker stands alone</text><text x='578.0' y='186.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='bold' text-anchor='start'>uncertainty (measured, 300 ppi): ≤ 0.6 px</text><rect x='240' y='218' width='312' height='70' rx='8' fill='#e6ecf7' stroke='#2a5ab0' stroke-width='1.6'/><text x='252.0' y='240.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#2a5ab0' font-weight='bold' text-anchor='start'>The reader&#x27;s code, kept with the record</text><text x='252.0' y='260.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>figures/fig2c.py: each point with an interval,</text><text x='252.0' y='276.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>its page position, and whether it may be counted</text><rect x='566' y='218' width='310' height='70' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='578.0' y='240.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Calibration sets the uncertainty</text><text x='578.0' y='260.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>figures with released data are read blind, then</text><text x='578.0' y='276.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>compared; the worst error per method is the floor</text><text x='240.0' y='316.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>What a reading enables</text><rect x='240' y='328' width='204' height='140' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='252.0' y='350.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Count n</text><text x='252.0' y='370.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>plotted: 10 and 9</text><text x='252.0' y='386.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>legend: 12 and 11</text><rect x='252' y='412' width='108' height='24' rx='12' fill='#f8e3e1' stroke='#c8402f' stroke-width='1.6'/><text x='306.0' y='428.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>inconsistent</text><text x='252.0' y='454.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start' font-style='italic'>n differs from the legend</text><rect x='454' y='328' width='204' height='140' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='466.0' y='350.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Recompute P as an interval</text><text x='466.0' y='370.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>printed: P = 0.001</text><text x='466.0' y='386.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>from the points, ±0.5 pt:</text><text x='466.0' y='402.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>P = 0.0002–0.0004</text><rect x='466' y='412' width='108' height='24' rx='12' fill='#f8e3e1' stroke='#c8402f' stroke-width='1.6'/><text x='520.0' y='428.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>inconsistent</text><text x='466.0' y='454.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start' font-style='italic'>printed P outside the interval</text><rect x='668' y='328' width='204' height='140' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='680.0' y='350.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>n implied by the error bar</text><text x='680.0' y='370.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>(SD of points ÷ SEM bar)²</text><text x='680.0' y='386.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>= 10.1 and 8.9</text><text x='680.0' y='402.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>matches the plotted points</text><rect x='680' y='412' width='94' height='24' rx='12' fill='#e3f1e8' stroke='#2f8f57' stroke-width='1.6'/><text x='727.0' y='428.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>consistent</text><text x='680.0' y='454.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start' font-style='italic'>bar computed from what is plotted</text><text x='240.0' y='500.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>Every value read from a figure is labelled “read”, with its method and uncertainty. A check on read values</text><text x='240.0' y='516.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>passes as “consistent within reading” and fails only when the difference is larger than the reading explains.</text></svg>
