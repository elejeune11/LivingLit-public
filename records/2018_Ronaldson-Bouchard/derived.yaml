    library:
      formula: frequency_def
      vars:
        f: f
        T: T
    inputs:
      T:
        not_stated: true
        kind: per sample
        note: beat period between pairs of local maxima; not printed
    alternatives:
    - label: mean of per-beat inverse periods vs inverse of the mean period (not stated)
