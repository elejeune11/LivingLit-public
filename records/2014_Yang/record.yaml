    quote: and also an enhancement in contractile kinetics
    where: Abstract
    direction: contraction and relaxation times down
    asserts_direction: down
    rests_on: [F3D_time_to_peak, F3E_time_to_90_relaxation, F3F_total_twitch_time]
    judgement: *cells
  abs_calcium:
    kind: stated
    quote: This improvement in force generation was accompanied by an increase in rates of calcium release and reuptake
    where: Abstract
    direction: upstroke and decay velocities up
    asserts_direction: up
    rests_on: [F4C_upstroke, F4D_decay_velocity]
    judgement: *cells
  abs_serca:
    kind: stated
    quote: along with a significant increase in sarcoendoplasmic reticulum ATPase expression
    where: Abstract
    direction: SERCA2a expression up
    asserts_direction: up
    rests_on: [F1F_serca]
    judgement: {direction: follows, support: does not follow, comparison: follows, scope: follows, replication: cannot judge, strength: follows,
      presence: follows}
