record: 2015_Guyette
formula_library_version: 20
agent:
  model: llm
  instructions: formulas_v3
derived:
  F1B_dna.reduction:
    item: F1B_dna
    measure: double-stranded DNA content
    formula: R = (pre - post)/pre
    anchor:
      quote: demonstrated a 99.05% reduction in double-stranded DNA (3.27±3.12 ng/mg wet tissue; P<0.05)
      where: Results, Perfusion-Decellularization
    library:
      formula: relative_decrease
      vars:
        s: R
        x0: pre
        x: post
    inputs:
      pre:
        value: F1B_dna.values.pre
        part: mean
        kind: per sample
      post:
        value: F1B_dna.values.post
        part: mean
        kind: per sample
    output: F1B_dna.values.reduction
    aggregation: not stated
    note: a reduction from the pre to the post mean (n=3 hearts); whether per heart or of means is not stated
  F1D_total.reduction_text:
    item: F1D_total
    measure: number of unique proteins
    formula: R = (C - D)/C
    anchor:
      quote: Proteomics analysis indicated an 89.14% reduction of the cadaveric cardiac proteome (967 proteins)
      where: Results, Perfusion-Decellularization
    library:
      formula: relative_decrease
      vars:
        s: R
        x0: C
        x: D
    inputs:
      C:
        value: F1D_total.values.C_text
        kind: constant
      D:
        value: F1D_total.values.D_text
        kind: constant
    output: F1D_total.values.reduction_text
    note: counts of unique proteins in the pooled cadaveric and decellularized lists
  F1D_total.reduction_discussion:
    item: F1D_total
    measure: number of unique proteins
    formula: R = (C - D)/C
    anchor:
      quote: revealed an 89.14% reduction of total protein content to 105 proteins
      where: Discussion
    library:
      formula: relative_decrease
      vars:
        s: R
        x0: C
        x: D
    inputs:
      C:
        value: F1D_total.values.C_text
        kind: constant
      D:
        value: F1D_total.values.D_discussion
        kind: constant
    output: F1D_total.values.reduction_discussion
    note: counts of unique proteins in the pooled cadaveric and decellularized lists
  F5F_slice_murine.pct:
    item: F5F_slice_murine
    measure: contractile force amplitude
    formula: pct = Fs/Fm
    anchor:
      quote: achieving 33.8% of native murine embryonic heart tissue (53.0±15.5 µN)
      where: Results, Recellularization of Myocardial Slices and Fibers
    library:
      formula: ratio_def
      vars:
        r: pct
        a: Fs
        b: Fm
    inputs:
      Fs:
        value: F5F_slice_murine.values.s
        part: mean
        kind: constant
      Fm:
        value: F5F_slice_murine.values.ref
        part: mean
        kind: constant
        note: a cited value (ref. 31), printed in this paper
    output: F5F_slice_murine.values.pct
    alternatives:
    - label: paced slices (2 Hz) over the murine reference
      formula: pct = Fp/Fm
      note: Fp = F5F_slice_2Hz.values.Hz2 (10.30 µN)
    note: the sentence follows the unpaced slice force (14.93 µN); which slice force was divided is not stated
  F1H_C_zero.anisotropy:
    item: F1H_C_zero
    group: C
    measure: anisotropy ratio
    formula: AR = Abs(Ex - Ey)/(Ex + Ey)
    anchor: &id001
      quote: anisotropy ratio = |Ex – Ey| / (Ex + Ey)
      where: Online Methods, Biaxial Mechanical Testing
      file: NIHMS733623-supplement-306874DR2_Online_Data_Supplement.pdf
    library:
      formula: normalized_absolute_difference
      vars:
        r: AR
        a: Ex
        b: Ey
    inputs:
      Ex:
        item: F1G_SFW
        part: mean
        kind: per sample
        note: which orthogonal axis is x is not stated; the formula is symmetric
      Ey:
        item: F1G_BA
        part: mean
        kind: per sample
    output: F1H_C_zero.values.C
    aggregation: mean of per-sample
    note: '''an anisotropy ratio was calculated for each tissue sample''; per-sample moduli are not released'
