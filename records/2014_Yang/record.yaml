    compares: [t3, control]
    n:
      printed: N = 44 for control hiPSC-CMs and N = 66 for T3-treated hiPSC-CMs
      counts: cells
      per_group: {control: '44', t3: '66'}
    values:
      force_control_text: {printed: '7.5', unit: nN/cell, kind: mean, group: control, spread: SEM, spread_source: methods}
      force_control_sem_text: {printed: '0.4', unit: nN/cell, kind: sem, group: control}
      force_t3_text: {printed: '12.3', unit: nN/cell, kind: mean, group: t3, spread: SEM, spread_source: methods}
      force_t3_sem_text: {printed: '0.7', unit: nN/cell, kind: sem, group: t3}
      force_control_discussion: {printed: ~7.5, unit: nN/cell, kind: mean, group: control, spread: not stated}
      force_t3_discussion: {printed: ~12.3, unit: nN/cell, kind: mean, group: t3, spread: not stated}
    stats:
      test: ANOVA with Student–Newman–Keuls post hoc testing
      p: P < 0.001
      p_values:
      - p: '#P < 0.001 vs. control'
        anchor: {quote: '# P<0.001 vs. control. N=44 for control hiPSC-CMs and N=66 for T3-treated hiPSC-CMs', where: Fig. 3 legend,
          file: nihms-586803.pdf}
    suspected_error:
      what: Fig. 3C bars look lower than the text means (by eye roughly 6.3 and 10.3 nN/cell against 7.5 and 12.3)
      why: the text cites Fig. 3C for 7.5 ± 0.4 nN/cell; a look at the panel suggests different bar heights; not read by code here,
        flagged for the figures reader
    anchor:
      quote: Control hiPSC-CMs exhibited a twitch force of 7.5 ± 0.4 nN/cell (Fig. 3C). T3-treated hiPSC-CMs exhibited a significantly
        higher twitch force of 12.3 ± 0.7 nN/cell
      where: Results 3.3 (repeated in the Discussion)
