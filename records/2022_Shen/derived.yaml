  S2_pca.pc1_pc3:
    item: S2_pca
    formula: c = pc1 + pc3
    anchor:
      quote: 'PC1-PC3: 67% Variation'
      where: Figure S2B
      file: mmc1.pdf
      kind: figure text
    library:
      formula: cumulative_variance_explained_two
