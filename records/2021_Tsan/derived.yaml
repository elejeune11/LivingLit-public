  F5e_HOPX_deseq.fold:
    item: F5e_HOPX_deseq
    formula: fold = 2**(l1 - l0)
    anchor:
      quote: we observed a 12-fold increase in HOPX in 2DMBs
      where: Results, p. 8
    library:
      formula: ratio_from_log2_values
      vars:
        r: fold
        la: l1
        lb: l0
    inputs:
      l1:
        data: F5e_HOPX_mb/mb
        kind: per sample
        note: 2DMB replicate log2 fold changes (Fig. 5e source data)
      l0:
        data: F5e_HOPX_mb/mono
        kind: per sample
        note: monolayer replicate log2 fold changes
    output: F5e_HOPX_deseq.values.fold
    alternatives:
    - label: DESeq2 GLM estimate (by reference, c44)
      note: the printed fold is DESeq2's estimate from counts; 2 to the difference of mean log2 values is a ratio of geometric means
