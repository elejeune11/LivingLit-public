name: ci
# The tests that need no papers and no ontology files (those that do are skipped).
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install (the exact versions in uv.lock)
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Tests
        run: uv run pytest -q
