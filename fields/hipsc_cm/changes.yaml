    id: measure:protein_phosphorylation_level
    label: total protein phosphorylation (Ptotal)
    parent: measure:phosphorylated_protein_fraction
    dimension: dimensionless
    definition: Phosphate per molecule of a stated protein (qualifier protein), summed over its phosphorylated species weighted
      by their relative abundance in top-down mass spectrometry.
    scope: Phosphates per molecule summed over species (can exceed one); the parent is the ratio of phosphorylated to total
      protein.
