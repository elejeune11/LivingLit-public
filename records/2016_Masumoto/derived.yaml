- {item: F1a_cmratio_cem_vs_ce, value: F1a_cmratio_cem_vs_ce.values.cmratio_ce, formula: fraction_bounds}
- {item: F1a_cmratio_cem_vs_ce, value: F1a_cmratio_cem_vs_ce.values.cmratio_cem, formula: fraction_bounds}
- {item: F1a_cmratio_cm_vs_ce, value: F1a_cmratio_cm_vs_ce.values.cmratio_cm, formula: fraction_bounds}
- {item: TXT1_tra160, value: TXT1_tra160.values.tra_ce, formula: fraction_bounds}
- {item: TXT1_tra160, value: TXT1_tra160.values.tra_cm, formula: fraction_bounds}
- {item: TXT1_tra160, value: TXT1_tra160.values.tra_cem, formula: fraction_bounds}
