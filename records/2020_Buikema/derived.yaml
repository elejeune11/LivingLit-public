proposals:
- formula: product_of_three_ratios
  kind: derived
  statement: A fold over three successive stages is the product of the per-stage folds, N3/N0 = (N1/N0)*(N2/N1)*(N3/N2); e.g. overall
    expansion over three passages.
  equations:
  - R = r1*r2*r3
  variables:
    R: dimensionless
    r1: dimensionless
    r2: dimensionless
    r3: dimensionless
    N0: D
    N1: D
    N2: D
    N3: D
  uses:
  - formula: ratio_def
    subs:
      r: r1
      a: N1
      b: N0
  - formula: ratio_def
    subs:
      r: r2
      a: N2
      b: N1
  - formula: ratio_def
    subs:
      r: r3
      a: N3
      b: N2
  - formula: ratio_def
    subs:
      r: R
      a: N3
      b: N0
  does_not_apply: a sum of per-stage folds, or folds each taken over the same start (cumulative folds)
  tests:
  - given:
      r1: 8.0
      r2: 8.0
      r3: 4.0
    expect:
      R: 256.0
  - given:
      r1: 8.0
      r2: 8.0
      r3: 4.0
    does_not_apply: 'sum of the folds: 20, not 256'
- formula: force_from_strain_modulus_area
  kind: derived
  statement: For a linear elastic specimen of Young's modulus E and area A, elongated by d over length L (strain d/L), the normal force
    is F = E*A*d/L.
  equations:
  - F = E*A*d/L
  variables:
    F: force
    E: modulus
    A: area
    d: length
    L: length
    sigma: stress
    eps: dimensionless
  assumes:
  - eps = d/L
  uses:
  - formula: stress_def
    subs:
      sigma: sigma
      F: F
      A: A
  - formula: linear_elastic_stress_strain
    subs:
      sigma: sigma
      E: E
      eps: eps
  does_not_apply: a nonlinear material or large strains; an area other than the one carrying the force; a modulus of a body other than
    the one strained
  tests:
  - given:
      E: 10.0
      A: 2.0
      d: 1.0
      L: 4.0
    expect:
      F: 5.0
  - given:
      E: 10.0
      A: 2.0
      d: 1.0
      L: 4.0
    does_not_apply: 'strain taken as d/(L + d) (true length): 4.0, not 5.0'
