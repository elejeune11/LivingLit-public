proposals:
- formula: sum_of_parts
  kind: definition
  statement: A whole made of two non-overlapping parts of the same kind is the sum of the parts; a difference (change, consumption, production)
    is that sum solved for one part.
  equations:
  - t = a + b
  variables:
    t: D
    a: D
    b: D
  does_not_apply: overlapping parts (an item counted in both), or quantities of different kinds or units
  tests:
  - given:
      a: 133.0
      b: 123.0
    expect:
      t: 256.0
  - given:
      a: 0.5
      b: 0.25
    expect:
      t: 0.75
  - given:
      a: 133.0
      b: 123.0
    does_not_apply: 'overlapping parts: 10 items in both give a whole of 246, not 256'
  cites:
    text: 'ISO 80000-1:2022 Quantities and units, Part 1: General (quantities of the same kind can be added; the sum is a quantity of that kind)'
    url: https://www.iso.org/standard/76921.html
- formula: sum_of_three_parts
  kind: derived
  statement: A whole made of three non-overlapping parts of the same kind is the sum of the three parts.
  equations:
  - t = a + b + c
  variables:
    t: D
    a: D
    b: D
    c: D
    u: D
  uses:
  - formula: sum_of_parts
    subs:
      t: u
      a: a
      b: b
  - formula: sum_of_parts
    subs:
      t: t
      a: u
      b: c
  does_not_apply: overlapping parts, or a part counted twice
  tests:
  - given:
      a: 228.0
      b: 51.0
      c: 12.0
    expect:
      t: 291.0
  - given:
      a: 1.0
      b: 2.0
      c: 3.0
    does_not_apply: 'b counted twice: 8, not 6'
- formula: proportional_amount
  kind: derived
  statement: A quantity in a fixed proportion a:b to another quantity Q is Q times a/b (amount metabolised from the fraction of label recovered;
    product from a stoichiometric yield; a unit conversion by a factor).
  equations:
  - q = Q*a/b
  variables:
    q: D
    Q: D
    a: D2
    b: D2
    y: dimensionless
  uses:
  - formula: ratio_def
    subs:
      r: y
      a: q
      b: Q
  - formula: ratio_def
    subs:
      r: y
      a: a
      b: b
  assumes:
  - the proportion a to b holds for every part of Q
  does_not_apply: a proportion that changes across Q (label not equilibrated with the unlabelled pool; incomplete conversion), or an offset added
    to the product
  tests:
  - given:
      Q: 2.0
      a: 33.0
      b: 1.0
    expect:
      q: 66.0
  - given:
      Q: 280.0
      a: 2.0
      b: 2.0
    expect:
      q: 280.0
  - given:
      Q: 10.0
      a: 1.0
      b: 4.0
    expect:
      q: 2.5
  - given:
      Q: 2.0
      a: 33.0
      b: 1.0
    does_not_apply: 'incomplete conversion: half the substrate converted gives 33, not 66'
