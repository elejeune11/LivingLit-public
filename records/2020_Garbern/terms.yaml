edits:
- adopt:
    field: cell_line
    id: CVCL_X737
    label: BJ RiPS-A
    lookup: 'lookup cellosaurus ''BJRiPS'' and ''BJ RiPS'': CVCL_X737 BJ RiPS-A is the paper''s BJRiPS-A (Methods, Cell Lines)'
    synonyms:
    - text: BJRiPS
      anchor: BJRiPS-CMs (BJ fibroblast-derived, RNA-induced pluripotent stem cell-derived cardiomyocytes)
    - text: BJRiPS-A
      anchor: The BJRiPS-A (BJ fibroblast-derived RNA-induced pluripotent
- adopt:
    field: cell_line
    id: CVCL_RM92
    label: CBiPSC6.2
    lookup: lookup cellosaurus 'Gibco Human Episomal iPSC' and 'A18945' (the Gibco episomal line's catalogue number) both resolve exactly to CVCL_RM92
      CBiPSC6.2
    synonyms:
    - text: Gibco iPS
      anchor: Gibco iPS-CMs (induced pluripotent stem cell-derived cardiomyocytes), n=3 per condition
- adopt:
    field: cell_line
    id: CVCL_EN85
    label: UCSD142i-86-1
    lookup: 'lookup cellosaurus ''UCSD142i-86-1'': exact match CVCL_EN85'
- adopt_own:
    field: treatment
    id: treatment:pifithrin_alpha
    label: pifithrin-α
    xref:
    - CHEBI:229924
    definition: Pifithrin-α, a small-molecule inhibitor of p53 transcriptional activity.
    scope: The p53 inhibitor, salt form not stated; not nutlin-3a, which activates p53.
    lookup: 'lookup chebi ''pifithrin'' and ''pifithrin-alpha'': only CHEBI:229924 pifithrin-alpha hydrobromide, a salt the paper does not name;
      no entry for the parent compound'
- adopt_own:
    field: treatment
    id: treatment:nutlin_3a
    label: nutlin-3a
    xref:
    - CHEBI:46742
    definition: Nutlin-3a, the active enantiomer of nutlin-3, an MDM2 inhibitor that stabilises p53.
    scope: The MDM2 inhibitor that raises p53; not pifithrin-α, which inhibits p53.
    lookup: 'lookup chebi ''nutlin'' and ''nutlin-3a'': CHEBI:46741 Nutlin (class) and CHEBI:46742 Nutlin-3 (racemate) only; no entry for the
      3a enantiomer'
- adopt_own:
    field: treatment
    id: treatment:fetal_bovine_serum
    label: fetal bovine serum
    definition: Serum from bovine fetuses added to the medium of some groups as an exposure.
    scope: Serum given to some groups and not others; serum in every group is a supplement (supplements:fetal_bovine_serum), not a treatment.
    synonyms:
    - text: FBS
      anchor: we added 10% fetal bovine serum (FBS) to half of
    lookup: 'lookup chebi ''fetal bovine serum'' and ''serum'': only serum proteins and antisera; the own term supplements:fetal_bovine_serum
      serves the supplements field and an own id cannot be adopted into a second field'
- adopt_own:
    field: treatment
    id: treatment:chemically_defined_lipid_concentrate
    label: chemically defined lipid concentrate
    definition: Gibco Chemically Defined Lipid Concentrate, a defined mixture of fatty acids and other lipids added to the medium.
    scope: The commercial lipid mixture; not a single named fatty acid (palmitate, oleic acid) and not the ChEBI class fatty acid.
    synonyms:
    - text: chemically defined lipids
      anchor: fatty acids were added in the form of chemically defined lipids
    lookup: 'lookup chebi ''lipid concentrate'' and ''chemically defined lipid'': no entry (a proprietary mixture)'
- add_term:
    field: platform
    id: platform:muscular_thin_film
    label: muscular thin film
    parent: platform:culture_2d
    definition: A layer of cardiomyocytes on a thin elastic film cut into cantilevers that bend as the cells contract, so force is computed from
      the film curvature.
    scope: Cells on free-standing cantilevered films whose bending reports force; not an unpatterned layer on a well bottom (monolayer), micropatterned
      islands on a fixed surface, a micropost array, a porous mesh insert or a Boyden chamber.
    synonyms:
    - text: MTF
      anchor: MTF, muscular thin film
    - text: muscular thin films
      anchor: Gelatin muscular thin films (MTFs) were prepared as previously described
- add_term:
    field: substrate
    id: substrate:gelatin_hydrogel
    label: gelatin hydrogel
    definition: A crosslinked gelatin gel forming the surface on which cells are cultured.
    scope: Crosslinked gelatin as the culture surface; not a gel in which cells are embedded (hydrogel and its kinds), not polyacrylamide, PDMS
      or glass, and not a thin protein coating such as fibronectin or laminin.
    synonyms:
    - text: micromolded gelatin
      anchor: micromolded gelatin MTFs were prepared on glass
- add_term:
    field: preparation
    id: preparation:dna_extract
    label: DNA extract
    definition: DNA purified from a sample for measurement.
    scope: Purified DNA; not RNA extract, cDNA, a crude lysate, a metabolite extract, or living or fixed samples.
- add_synonym:
    id: pacing:electrical_pacing
    text: electrically stimulated
    anchor: electrically stimulated with 15 V at a frequency of 0.5 pulses/sec
- add_term:
    field: measure
    id: measure:cell_cycle_phase_fraction
    label: cell cycle phase fraction
    dimension: dimensionless
    definition: Share of cells in a stated cell cycle phase (qualifier phase), read from DNA and RNA content, within a stated population (qualifier
      population).
    scope: Cells in one cycle phase (G0, G1, S/G2/M, sub-G1) by DNA and RNA content; not the fraction positive for a proliferation marker such
      as Ki67 or pH3 (marker-positive cells) and not binucleated cells.
    qualifiers:
      phase:
        dimension: text
      population:
        dimension: text
- add_term:
    field: measure
    id: measure:non_mitochondrial_ocr
    label: non-mitochondrial oxygen consumption rate
    parent: measure:oxygen_consumption_rate
    dimension: amount_rate
    definition: Oxygen consumption remaining after the respiratory chain is blocked with rotenone and antimycin A.
    scope: Oxygen use not by mitochondria; not maximal, spare, ATP-linked or proton-leak respiration, total ATP capacity or the time course.
    synonyms:
    - text: nonmitochondrial oxygen consumption rate
      anchor: respiratory reserve capacity, and nonmitochondrial oxygen consumption rate
- add_term:
    field: measure
    id: measure:ocr_time_course
    label: oxygen consumption rate time course
    parent: measure:oxygen_consumption_rate
    dimension: amount_rate
    definition: Oxygen consumption rate over the successive injections of a respiration assay, shown as a curve.
    scope: The curve across injections; not one derived rate (maximal, spare, ATP-linked, proton leak, non-mitochondrial or ATP capacity).
- add_term:
    field: measure
    id: measure:ecar_time_course
    label: extracellular acidification rate time course
    parent: measure:extracellular_acidification_rate
    dimension: rate
    definition: Extracellular acidification rate over the successive injections of a flux assay (qualifier assay), shown as a curve.
    scope: The curve across injections; not one derived value (glycolytic rate, capacity or reserve, or non-glycolytic acidification).
    qualifiers:
      assay:
        dimension: text
- add_term:
    field: measure
    id: measure:non_glycolytic_acidification
    label: non-glycolytic acidification
    parent: measure:extracellular_acidification_rate
    dimension: rate
    definition: Extracellular acidification remaining after glycolysis is blocked with 2-deoxyglucose.
    scope: Acidification not from glycolysis; not the glycolytic rate, capacity or reserve, and not the time course.
- add_term:
    field: measure
    id: measure:glycolytic_rate
    label: glycolytic rate
    parent: measure:extracellular_acidification_rate
    dimension: rate
    definition: Extracellular acidification after glucose addition minus non-glycolytic acidification, in a glycolysis stress test.
    scope: Glycolysis at the glucose step; not glycolytic capacity (after oligomycin), glycolytic reserve, non-glycolytic acidification or the
      time course.
    synonyms:
    - text: glycolysis ECAR
      anchor: the glycolysis ECAR was calculated by subtracting the average
- add_term:
    field: measure
    id: measure:action_potential_downstroke_velocity
    label: action potential downstroke velocity
    parent: measure:action_potential
    dimension: voltage_rate
    definition: Rate of fall of membrane voltage during repolarisation of the action potential.
    scope: Slope of the repolarising fall; not the upstroke velocity, a duration or repolarisation time, a rise time, amplitude, peak potential
      or frequency.
- add_term:
    field: measure
    id: measure:action_potential_repolarisation_time
    label: action potential repolarisation time
    parent: measure:action_potential
    dimension: time
    definition: Time for the action potential to fall between two stated fractions of its amplitude (qualifier level).
    scope: An interval within repolarisation (such as 75 % to 25 %); not the duration from the upstroke (action potential duration), the rise
      time, a slope or a ratio of durations.
    qualifiers:
      level:
        dimension: text
- add_term:
    field: measure
    id: measure:pathway_score
    label: pathway score
    parent: measure:gene_set_expression
    dimension: dimensionless
    definition: One number per sample summarising the expression of a named pathway gene set (qualifier gene_set), as computed by the analysis
      software.
    scope: A per-sample summary score of a gene set; not the set's genes shown separately (gene set expression) and not a shift of the set's fold-change
      distribution.
