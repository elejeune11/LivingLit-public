  F1_rat:
    unit: F1
    measure: compressive Young's modulus
    method: unconfined compression between two flat platens, 1 kN load cell, 1 mm/min (Instron E1000); modulus from near-linear portion of the
      stress−strain curve, usually 0–5% strain
    software: not stated
    definition: Compressive Young’s modulus was determined from a near-linear portion of the stress−strain curve in the physiological range
    finding: Native rat myocardium compressive modulus 2.67 ± 0.61 kPa.
    groups:
    - rat
    values:
      rat_text:
        printed: 2.67 ± 0.61
        unit: kPa
        kind: mean
        group: rat
        spread: SEM
        spread_source: methods
