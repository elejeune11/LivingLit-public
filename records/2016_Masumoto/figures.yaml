      mcr_cem_vs_cm: {item: F1b_mcr_cem_vs_cm, group: cem, unit_of_value: Hz}
      rt_ce: {item: F1b_rt_cem_vs_ce, group: ce, unit_of_value: msec}
      rt_cm: {item: F1b_rt_cem_vs_cm, group: cm, unit_of_value: msec}
      rt_cem: {item: F1b_rt_cem_vs_ce, group: cem, unit_of_value: msec}
      rt_cem_vs_cm: {item: F1b_rt_cem_vs_cm, group: cem, unit_of_value: msec}
      et_ce: {item: F1b_et_cem_vs_ce, group: ce, unit_of_value: V/cm}
      et_cm: {item: F1b_et_cem_vs_cm, group: cm, unit_of_value: V/cm}
      et_cem: {item: F1b_et_cem_vs_ce, group: cem, unit_of_value: V/cm}
      et_cem_vs_cm: {item: F1b_et_cem_vs_cm, group: cem, unit_of_value: V/cm}
    note: >-
      Fig. 1b, three bar charts (maximum capture rate, relaxation time, excitation threshold), each with its own axis;
      label = measure _ ECT type. Bars only (mean and upper end of the error bar, SD per Methods); no points drawn.
      <measure>_cem_vs_cm is the same CM+EC+MC bar as <measure>_cem, linked to the item against CM+MC.
  f1c_force_frequency:
    file: srep29933.pdf
    page: 2
    crop: [415, 46, 552, 165]
    script: figures/f1c_force_frequency.py
    unit: F1c
    kind: raster
    groups:
      ce: {item: F1c_force35_cem_vs_ce, group: ce, unit_of_value: fold increase}
      cm: {item: F1c_force35_cem_vs_cm, group: cm, unit_of_value: fold increase}
      cem: {item: F1c_force35_cem_vs_ce, group: cem, unit_of_value: fold increase}
      cem_vs_cm: {item: F1c_force35_cem_vs_cm, group: cem, unit_of_value: fold increase}
    note: >-
      Fig. 1c, line chart of active force (fold increase over 2 Hz) at 2-3.5 Hz; only the 3.5 Hz means are read (x =
      3.5 Hz), label = ECT type. Lines join group means; no markers or points drawn. CM+EC+MC has an upward error bar
      (upper end read). CM+EC and CM+MC share one downward stem with two caps that cannot be assigned to a group, so
      their error is not read. cem_vs_cm is the same CM+EC+MC mean as cem, linked to the item against CM+MC.
  f1d_youngs_modulus:
    file: srep29933.pdf
    page: 2
    crop: [415, 195, 552, 312]
    script: figures/f1d_youngs_modulus.py
    unit: F1d
    kind: raster
    groups:
      ce: {item: F1d_ym_cm_vs_ce, group: ce, unit_of_value: kPa}
      cm: {item: F1d_ym_cm_vs_ce, group: cm, unit_of_value: kPa}
