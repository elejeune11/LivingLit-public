  F5K_spare_SP30_vs_D30.spare_capacity_pct:
    item: F5K_spare_SP30_vs_D30
    formula: src = (ocr_max - ocr_basal)/ocr_basal
    anchor:
      quote: The percentage of spare respiratory capacity, an indicator of energy reserve
      where: Results, Metabolic profile
    library:
      formula: relative_change
      vars:
        d: src
        x: ocr_max
        x0: ocr_basal
    inputs:
      ocr_max:
        not_stated: true
        kind: per sample
        note: OCR after CCCP; not plotted
      ocr_basal:
        not_stated: true
        kind: per sample
    alternatives:
    - label: maximal over basal OCR x 100 (the Seahorse report generator's spare respiratory capacity as %)
      formula: src = ocr_max/ocr_basal
    note: Named operation 'percentage of spare respiratory capacity'; which convention was used is not stated.
