evidence:
  F1i_sl_ms_rs:
    unit: F1
    measure: sarcomere length
    method: α-actinin immunofluorescence, confocal microscope (Carl Zeiss, LSM 710 Meta)
    software: not stated
    finding: Micropatterned single SL 1.92 μm vs random single 1.72 μm; * in Fig. 1i
    compares:
    - ms
    - rs
    n: &id004
      printed: N = 8 independent samples per group
      counts: independent samples
    values:
      sl_ms_text:
        printed: '1.92'
        unit: μm
        kind: mean
        group: ms
      sl_rs_text:
        printed: '1.72'
        unit: μm
        kind: mean
        group: rs
    stats:
      test: one-way ANOVA test with Tukey HSD
      p: '*p < 0.05'
    anchor:
      quote: 'The greater sarcomere lengths (SLs) were observed in the micropatterned single hiPSC-CMs (average length: 1.92 μm)'
      where: Results, Sarcomere Formation; Fig. 1i
  F1i_sl_icmf_rs:
    unit: F1
    measure: sarcomere length
    method: α-actinin immunofluorescence, confocal microscope (Carl Zeiss, LSM 710 Meta)
    software: not stated
    finding: iCMF SL 1.91 μm vs random single 1.72 μm; * in Fig. 1i
    compares:
    - icmf
    - rs
    n: *id004
    values:
      sl_icmf_text:
        printed: '1.91'
        unit: μm
        kind: mean
        group: icmf
      sl_rs_text:
        printed: '1.72'
        unit: μm
        kind: mean
        group: rs
    stats:
      test: one-way ANOVA test with Tukey HSD
      p: '*p < 0.05'
    anchor:
      quote: 'and iCMFs (average length: 1.91 μm), whereas the random single and random cluster cells had much lower SLs'
      where: Results, Sarcomere Formation; Fig. 1i
  F1i_sl_rc:
    unit: F1
    measure: sarcomere length
    method: α-actinin immunofluorescence, confocal microscope (Carl Zeiss, LSM 710 Meta)
    software: not stated
