no_points:
  F1bc: 'first look (small model): Panels b and c are bar charts with error bars; no per-sample markers. (journal_version.pdf p.
    5)'
  F2ace: 'first look (small model): Bars with SEM error bars; panel c''s curves are traces, not per-sample dots. (journal_version.pdf
    p. 6)'
  F2bdf: 'first look (small model): Panels b, d, f are bars with error bars; d-left traces are curves, not per-sample points. (journal_version.pdf
    p. 6)'
  S3a: Right panels (G', G'' vs [NaBH4]) are bars with error bars only (n = 6); left panels are frequency-sweep curves whose
    markers are means with error bars at each frequency, not per-sample points. Image in NIHMS1685525-supplement-3.docx (word/media/image3.tif,
    Fig. S3).
  S3b: Right panels (G', G'' vs % w/v rGO at 300 mM NaBH4) are bars with error bars only (n = 6); left panels are frequency-sweep
    curves whose markers are means with error bars at each frequency, not per-sample points. No table in the supplement gives
    these values. Image in NIHMS1685525-supplement-3.docx (word/media/image3.tif, Fig. S3).
  S4: Bars with error bars only (dECM, dECM-TG, dECM-rGO; compressive modulus in kPa, n = 6); no per-sample markers. No table
    in the supplement or main text gives these values. Image in NIHMS1685525-supplement-3.docx (word/media/image4.tif, Fig.
    S4).
  S5: Panel b shows % viability of HS27a and hiPSC-CM at 0.3% w/v rGO against [NaBH4] (no rGO, 100–300 mM) as paired bars
    with error bars only; no per-sample markers. Panel a is a live/dead image. No table in the supplement or main text gives
    these values (the text gives only "> 90%"). Image in NIHMS1685525-supplement-3.docx (word/media/image5.tif, Fig. S5).
  S6: Grouped bars with error bars only (Collagen, dECM, dECM-TG, dECM-rGO at Day 14 and Day 35; twitch power in nW, n = 12);
    no per-sample markers. Neither the text (Results 3.2 gives only the trend) nor any supplement table gives these values.
    Image in NIHMS1685525-supplement-3.docx (word/media/image6.tif, Fig. S6).
  S7: Grouped bars with error bars only (TCPS, Collagen, dECM, dECM-TG, dECM-rGO at Day 14 and Day 35; KCNE1 and KCNQ1
    relative expression, n = 12); no per-sample markers. No supplement table gives these values (the KEGG table does not list
    KCNE1 or KCNQ1). Image in NIHMS1685525-supplement-3.docx (word/media/image7.tif, Fig. S7).
  S8: Grouped bars with error bars only (Glass and Graphene at Day 7 and Day 14; RMP in mV, '**' under the Day 14 Graphene
    bar); no per-sample markers. No n is printed, and neither the text (Results gives only the trend) nor any supplement
    table gives these values. Image in NIHMS1685525-supplement-3.docx (word/media/image8.tif, Fig. S8).
  F3be: 'first look (small model): Panels b–e are bars with error bars; no per-sample markers visible. (journal_version.pdf p. 8)'
  F3fj: 'first look (small model): Panels f–j are bars with error bars; no per-sample markers visible. (journal_version.pdf p. 8)'
  F4: 'first look (small model): Bars with error bars only; no per-sample markers in panels b or c (nihms-1685525.pdf p. 31)'
  F5b: 'first look (small model): Bars with SEM error bars only; no individual data points visible. (journal_version.pdf p. 10)'
  F5fij: 'first look (small model): Panels f, i, j are bars with error bars; no individual points (journal_version.pdf p. 10)'
  F5q: 'first look (small model): RT-qPCR bars with SEM error bars; no individual sample dots visible (journal_version.pdf p. 10)'
  F6: 'first look (small model): Bar charts with mean and error bars; no per-sample markers visible. (nihms-1685525.pdf p. 33)'
