  F2E_amp.amplitude:
    item: F2E_amp
    formula: s = (x0 - x)/x0
    anchor:
      quote: Contraction amplitudes were calculated as the percent change in fractional area change amplitude between contraction and
        relaxation
      where: Methods (Contractility)
      file: journal_version.pdf
    library:
      formula: relative_decrease
      vars:
        s: s
        x0: x0
        x: x
    inputs:
      x0:
        not_stated: true
        kind: per sample
        note: microtissue area at relaxation (ImageJ threshold edge-detected area profile)
      x:
        not_stated: true
        kind: per sample
        note: microtissue area at peak contraction
    alternatives:
    - label: signed relative change (x - x0)/x0, negative for contraction
      formula: s = (x - x0)/x0
    - label: change taken relative to the contracted area
      formula: s = (x0 - x)/x
    - label: difference of fractional areas (percentage points), not a relative change
    aggregation: not stated
    note: '''percent change in fractional area change amplitude'' read as the relative drop in projected area from relaxation to contraction;
      printed in %.'
