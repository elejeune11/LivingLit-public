  S4O_force.calibration:
    item: S4O_force
    formula: not stated
    anchor:
      quote: were fit to a third-degree polynomial equation, generating a force-displacement calibration curve for each custom probe
        tip
      where: Journal version, STAR Methods
    no_formula: force from POMaC wire deflection by an empirical third-degree polynomial calibration per probe tip, interpolated by
      tissue width on the wire (FEM-backed); coefficients not printed; not closed-form library algebra
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: maximum wire deflection, per tissue
      Tw:
        not_stated: true
        kind: per sample
        note: width of the tissue on the wire, per tissue
  F2G_dil_10uM.active:
    item: F2G_dil_10uM
    formula: Fa = Ft - Fp
    anchor: &id002
      quote: The active force was calculated as the difference between the total and passive tension
      where: Journal version, STAR Methods
    library:
      formula: sum_of_parts
      vars:
        t: Ft
        a: Fa
        b: Fp
    inputs:
      Ft:
        not_stated: true
        kind: per sample
        note: total tension at peak contraction, from wire deflection
      Fp:
        not_stated: true
        kind: per sample
        note: passive tension at rest, from wire deflection
