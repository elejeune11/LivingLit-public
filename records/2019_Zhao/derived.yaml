        kind: per sample
        note: post-rest force, per tissue
      Flast:
        not_stated: true
        kind: per sample
        note: force at the last pacing frequency before rest, per tissue
    aggregation: mean of per-sample
    alternatives:
    - label: 'Methods: normalized to the 1 Hz baseline'
