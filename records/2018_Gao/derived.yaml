record: 2018_Gao
formula_library_version: 16
agent:
  model: llm
  instructions: formulas_v3
derived:
  S2_mlc2a.dct:
    item: S2_mlc2a
    formula: dct = ct - ct_ref
    anchor: &id001
      quote: Measurements were calculated via the 2−∆Ct method and normalized to glyceraldehyde phosphate dehydrogenase RNA levels
      where: Supplemental Methods, Quantitative RT-PCR Analysis
      file: NIHMS936001-supplement-Supple_manuscript.pdf
    library:
      formula: sum_of_parts
      vars:
        t: ct
        a: dct
        b: ct_ref
    inputs:
      ct:
        not_stated: true
        kind: per sample
        note: Ct of the target gene in each sample; not printed
      ct_ref:
        not_stated: true
        kind: per sample
        note: Ct of GAPDH in the same sample; not printed
    note: ΔCt named by the method (target minus the reference GAPDH); no calibrator, so not ΔΔCt
  S2_mlc2a.expression:
    item: S2_mlc2a
    formula: expr = 2^(-dct)
    anchor: *id001
    library:
      formula: ddct_relative_expression
      vars:
        r: expr
        ddct: dct
    inputs:
      dct:
        derived: S2_mlc2a.dct
        kind: per sample
    aggregation: not stated
    note: 'the 2^-ΔCt form of the comparative Ct model: r = 2^(-ddct) with the ΔCt against GAPDH in place of ΔΔCt'
