  events:
  - event: add_term
    field: platform
    id: platform:tissue_between_wires
    label: tissue suspended between two parallel wires
    parent: platform:engineered_3d
    definition: An engineered tissue formed in a microwell and suspended between two parallel flexible polymer wires that
      it attaches to near its ends, so that each contraction bends the wires.
    scope: A tissue held by two parallel wires crossing it; not a tissue between two upright pillars, not a tissue cast around
      a single bending strip and not a linear tissue held by end anchors fixed to the vessel.
  - event: add_term
    field: platform
    id: platform:biowire_ii
    label: Biowire II
    parent: platform:tissue_between_wires
    definition: The Biowire II platform, in which tissues self-assemble in polystyrene microwells around two parallel POMaC
      wires whose deflection reports passive tension and active force.
