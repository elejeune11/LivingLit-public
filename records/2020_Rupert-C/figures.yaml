    table gives Ca2+ alternans. (SCI2020-9363809.pdf p. 12)'
  S6: 'first look (small model): Curves with mean ± SEM error bars; bar charts with error bars only (9363809.f1.pdf p. 7)'
  TXT2: 'first look (small model): Bars, trace, and mean±SEM markers only; caption says all data are mean±SEM. (SCI2020-9363809.pdf
    p. 10)'
