      quote: Force was then calculated based on EHT shortening and the elastic propensity and geometry of the PDMS posts to which the EHTs were attached.
      where: Experimental Procedures, Force and CaT Measurement
    library:
      formula: hooke_spring
      vars:
        F: F
        k: k
        x: x
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: EHT shortening is tracked per EHT; no deflection value is printed
      k:
        by_reference:
          citation: hansen2010
          anchor:
            quote: Force was analyzed by video-optical recording as described in the past (Hansen et al., 2010; Mannhardt et al., 2016; Schaaf et al., 2011).
            where: Experimental Procedures, Force and CaT Measurement
        kind: constant
        note: '"elastic propensity and geometry of the PDMS posts"; no stiffness, modulus or post dimension printed'
    alternatives:
    - label: deflection of one post equals the EHT shortening
      formula: F = k*x
    - label: two identical flexible posts share the shortening (unstated)
      formula: F = k*x/2
      note: if x is the EHT shortening and both posts deflect equally; the paper does not say how shortening maps to post deflection
    note: The paper names the inputs (EHT shortening, post elasticity and geometry) but not the formula; method by citation.
