  F1FH_ratio_GFAM_d20_vs_GLCM_d20.ocr_ecar:
    item: F1FH_ratio_GFAM_d20_vs_GLCM_d20
    measure: OCR/ECAR ratio
    formula: R = OCR/ECAR
    anchor:
      quote: OCR/ECAR ratio reflecting the relative contribution of OXPHOS over glycolysis
      where: Fig. 1 legend
    library:
      formula: ratio_def
      vars:
        r: R
        a: OCR
        b: ECAR
    inputs:
      OCR:
        item: F1FH_OCR_GFAM_d20_vs_GLCM_d20
        kind: per sample
      ECAR:
        item: F1FH_ECAR_GFAM_d20_vs_GLCM_d20
        kind: per sample
    aggregation: not stated
