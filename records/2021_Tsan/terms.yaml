mappings:
- field: purification
  stated: lactate
  terms:
  - purification:metabolic_selection
  qualifiers:
    substrate: lactate
- field: platform
  stated: hPSC-CMs in contact
  terms:
  - platform:culture_2d
  qualifiers:
    cell_contact: in contact with at least one other cardiomyocyte
  split: &id003
  - words: hPSC-CM
    field: cell_types
  note: Cells plated at intermediate density, unpatterned; contact with other cells is the second dimension the unit varies.
- field: platform
  stated: isolated hPSC-CM
  terms:
  - platform:culture_2d
  qualifiers:
    cell_contact: isolated
  split: *id003
  note: Cells plated at intermediate density, unpatterned; isolated single cells, not a micropatterned single cell.
- field: platform
  stated: single micropatterned hPSC-CM
  terms:
  - platform:micropatterned_single_cell
  split: *id003
- field: cm_medium
  stated: RPMI:DMEM
  terms:
  - cm_medium:rpmi_1640
  - cm_medium:dmem
  note: A mixture of the two base media; the ratio is a record qualifier.
- field: pacing
  stated: current injection
  terms:
  - pacing:current_clamp_stimulation
- field: transgene
  stated: connexin-43-GFP
  terms:
  - transgene:connexin43_fusion
  qualifiers:
    fluorophore: GFP
  note: An endogenous GFP tag in the Allen Institute line AICS-0053 cl.16.
- field: transgene
  stated: SERCA2-GFP
  terms:
  - transgene:serca2_fusion
  qualifiers:
    fluorophore: GFP
  note: An endogenous GFP tag in the Allen Institute line AICS-0046 cl.51.
- field: cm_medium
  stated: glucose-free RPMI
  terms:
  - cm_medium:rpmi_1640
  qualifiers:
    glucose: glucose-free
- field: platform
  stated: 3D human cardiac organoid
  terms:
  - platform:tissue_between_pillars
  qualifiers:
    posts: elastomer posts
  note: The source describes the Mills et al. organoids as tissues that contract between elastomer posts; the insert is not
    named, so not Heart-Dyno.
- field: mechanical_load
  stated: elastomer posts
  terms:
  - mechanical_load:auxotonic
  qualifiers:
    posts: elastomer posts
  note: 'Tissues contract between elastomer posts: an elastic load.'
- field: platform
  stated: native tissue
  terms:
  - platform:native_tissue
