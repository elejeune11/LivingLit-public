  F6H_sys.force:
    item: F6H_sys
    formula: not stated
    anchor:
      quote: by applying a beam-bending equation from elasticity theory as previously described (Serrao et al., 2012)
      where: Methods, Engineered heart tissue deflection analysis
    no_formula: systolic force from post deflection by a beam-bending equation stated only by citation (Serrao et al., 2012); post geometry
      and modulus not printed
    inputs:
      deflection:
        not_stated: true
        kind: per sample
      post:
        by_reference:
          citation: Serrao2012
          anchor:
            quote: by applying a beam-bending equation from elasticity theory as previously described (Serrao et al., 2012)
            where: Methods, Engineered heart tissue deflection analysis
        kind: constant
        note: post stiffness, or geometry and modulus
    alternatives:
    - label: linear spring (hooke_spring)
      formula: F = k*x
    - label: cantilever tip load (cantilever_tip_stiffness with hooke_spring)
      formula: F = 3*E*I*x/L**3
