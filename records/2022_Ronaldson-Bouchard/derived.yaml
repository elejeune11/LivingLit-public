      n: {printed: '7', unit: miRNAs, anchor: {quote: 'Mixed 4-tissue: 2/7 (28.6%)', where: 'Fig. 7m'}, kind: constant}
    output: F7m_consistent.values.mix4_pct_figure
  F7m_consistent.share_mo1:
