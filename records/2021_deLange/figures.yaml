figures: {}
no_points:
  F2ac: 'first look (small model): Panels A-C show a representative trace and smooth curves with shaded error bands, no per-sample
    markers. (ajpheart.00941.2020.pdf p. 6)'
  F2dk: 'Panels E-K plot individual points per frequency (0.5-2.5 Hz) with a fitted curve, but in one raster image (ajpheart.00941.2020.pdf
    p. 6, 300 dpi JPEG): the points do not each stand alone (F, G: about 14 per frequency merge into columns; E, I-K: points
    touch each other and lie under the fitted curve, e.g. E shows 4 of n = 6 at 1 Hz), so raster points are not readable;
    no mean or error bar is drawn, and no table or released data gives the values.'
  F2l: 'first look (small model): Panel L shows continuous traces over time, with no per-sample markers. (ajpheart.00941.2020.pdf
    p. 6)'
  F4: 'first look (small model): Figure 4 C–J are box-and-whisker plots with no visible individual markers; A–B are traces. (ajpheart.00941.2020.pdf
    p. 8)'
  S2: Panel A plots mean absolute dF/dt traces over time (early blue, late green) with dotted error envelopes; no individual
    ECT points or per-group summary markers (SupplementalData_Fig2.docx, image1.png). Panels C-H are box plots of normalized
    dF/dt and timing (values in Supplemental Table 1), not absolute dF/dt; no table or released data gives absolute dF/dtmax.
  S6: Panels A-L (SupplementalData_Fig6.docx, image1.png, one raster image) are box-and-whisker plots (median, box, min-max
    whiskers) per group (d30 2D, Early, Late) with no individual points drawn. Supplemental Table 2 gives Early vs Late RE
    and SEM (N = 6) for most of these genes (not CASQ2 or the ratios), but as a separate analysis (Welch t test; the record
    notes GAPDH normalisation) rather than the RNA-input-normalised values plotted here, and with no d30 2D group; no released
    data gives the plotted values.
  F5ij: 'first look (small model): Panels I and J are box-and-whisker plots with no visible individual points. (ajpheart.00941.2020.pdf
    p. 9)'
