  F2c_stiffness.stiffness_w3:
    item: F2c_stiffness
    group: w3
    formula: E = s/A
    anchor:
      quote: Stiffness was measured as the slope of the passive tension curve at the highest three strain levels (112–120%)
        divided by the cross-sectional area of the patch
      where: Methods, Assessment of biomechanical properties
    no_formula: 'A tangent stiffness: the slope of passive tension against strain (a fit over three strain levels) divided
      by the area. No library entry covers a slope; stress_def is force over area, and a slope is not a force.'
    inputs:
      s:
        not_stated: true
        kind: per sample
        note: slope of passive tension vs strain, not printed
      A:
        not_stated: true
        kind: per sample
    output: F2c_stiffness.values.stiffness_w3
  S10b_force.fold:
    item: S10b_force
    formula: r = Fdyn/Fstat
    anchor:
      quote: exhibited 4.9-fold reduced contractile forces (1.03 vs. 5.1 mN
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: ratio_def
      vars:
        r: r
        a: Fdyn
        b: Fstat
    inputs:
      Fdyn:
        value: S10b_force.values.force_dyn
        kind: per sample
      Fstat:
        value: S10b_force.values.force_stat
        kind: per sample
    output: S10b_force.values.force_fold
  S10d_cv.fold:
    item: S10d_cv
    formula: r = vdyn/vstat
    anchor:
      quote: ~3-fold lower CVs (8.7 vs. 27.2 cm/s
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: ratio_def
      vars:
        r: r
        a: vdyn
        b: vstat
    inputs:
      vdyn:
        value: S10d_cv.values.cv_dyn
        kind: per sample
      vstat:
        value: S10d_cv.values.cv_stat
        kind: per sample
    output: S10d_cv.values.cv_fold
  S5b_f15.pct_of_1hz:
    item: S5b_f15
    group: f15
    formula: r = Fx/F1
    anchor:
      quote: of 1 Hz force maintained at 1.5 and 2 Hz stimulation
      where: Results, Functional maturation of cardiopatches
    library:
      formula: ratio_def
      vars:
        r: r
        a: Fx
        b: F1
    inputs:
      Fx:
        reading: S5b/f15.f15
        kind: per sample
      F1:
        reading: S5b/f15.f1
        kind: per sample
    output: S5b_f15.values.force_f15
    note: Each patch's force at 1.5 Hz over its own 1 Hz force (the SEM is non-zero, so the normalisation is per patch). The
      readings are of the plotted normalised means, so the 1 Hz reference is 1 for every patch and the ratio of the two readings
      equals the mean of the per-sample ratios; no aggregation alternative is needed.
  S5b_f2.pct_of_1hz:
    item: S5b_f2
    group: f2
    formula: r = Fx/F1
    anchor:
