    id: measure:twitch_duration
    text: total contraction-relaxation duration
    anchor: (G) Total contraction–relaxation duration
  - event: add_term
    field: measure
    id: measure:capture_onset_time
    label: onset of electrical capture
    parent: null
    dimension: time
    definition: The earliest time at which cells or tissues can be electrically paced with capture, counted from a stated
      reference event (qualifier reference).
    scope: When pacing first captures; not the highest frequency still captured (maximum capture rate), not one-to-one following
      at a stated frequency (entrainment to pacing) and not the onset of spontaneous beating.
    qualifiers:
      reference:
        dimension: text
  - event: add_term
    field: measure
    id: measure:beating_cessation_time
    label: time to cessation of beating
    parent: null
    dimension: time
    definition: Time after which cells or tissues stop beating spontaneously, counted from a stated reference event (qualifier
      reference).
    scope: When beating stops; not when it starts (onset of spontaneous beating) and not whether beating is present at one
      time (presence of beating).
    qualifiers:
      reference:
        dimension: text
  - event: add_term
    field: measure
    id: measure:peak_calcium_signal
    label: peak calcium indicator signal
    parent: null
    dimension: dimensionless
    definition: Level of a calcium indicator's signal at the peak of the transient (qualifier indicator), a readout of systolic
      cytosolic calcium, raw or calibrated to a concentration.
    scope: The absolute level at the peak; not the level between transients (resting calcium indicator signal), not the rise
      from baseline to peak (calcium transient amplitude) and not a raw fluorescence peak compared across signal sources.
    qualifiers:
      indicator:
        dimension: text
  - event: add_term
    field: measure
    id: measure:gated_cell_event_fraction
    label: fraction of events gated as cells
    parent: null
    dimension: dimensionless
    definition: Share of flow cytometry events that fall inside the scatter gate drawn for intact cells.
    scope: A scatter-gate share of all events, before any marker; not the fraction of cells positive for a marker (marker-positive
      cells).
  - event: add_term
    field: measure
    id: measure:anchor_detachment
    label: detachment from anchors
    parent: null
    dimension: dimensionless
    definition: Whether engineered tissues pull off their pillars or anchors, or the share that do, within a stated period.
    scope: Tissues coming loose from their anchors; not tissues breaking (tissue breakage) and not failure to compact (tissue
      condensation).
