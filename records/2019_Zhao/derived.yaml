  S4O_force_area.area:
    item: S4O_force_area
    formula: not stated
    anchor:
      quote: Average tissue width (diameter) and width of the tissue on the polymer wire (Tw) were measured
      where: Journal version, STAR Methods
    no_formula: the tissue width (diameter) is measured but how the cross-sectional area was computed from it is not stated, and no
      width or area is printed
    inputs:
      d:
        not_stated: true
        kind: per sample
        note: average tissue width (diameter), per tissue, not printed
    alternatives:
    - label: circular section from the measured diameter (circular_cross_section_area)
      formula: A = pi*d**2/4
  S4O_force_area.stress_bw_1Hz:
    item: S4O_force_area
    group: bw_1Hz
    formula: s = F/A
    anchor:
      quote: the force per cross-sectional area (or per cell) is on the order of those reported
      where: Discussion
    library:
      formula: stress_def
      vars:
        sigma: s
        F: F
        A: A
    inputs:
      F:
        value: S4O_force.values.force_bw_1Hz
        part: mean
        kind: per sample
      A:
        derived: S4O_force_area.area
        kind: per sample
    output: S4O_force_area.values.force_area_bw_1Hz
    aggregation: not stated
    note: Only the Biowire II rows are derived here; the other studies' force per area carry an unexplained asterisk and are read as
      taken from those studies.
  S4O_force_area.stress_bw_PRP:
    item: S4O_force_area
