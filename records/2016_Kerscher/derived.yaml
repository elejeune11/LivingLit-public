  F2D_oct4.relative_expression:
    item: F2D_oct4
    measure: Oct4 expression
    formula: E = 2**(-dCt)
    anchor:
      quote: Gene expression levels were normalized to the housekeeping gene GAPDH using the 2-ΔCt method
      where: Methods, RT-qPCR
      file: nihms-755756.pdf
    library:
      formula: ddct_relative_expression
      vars:
        r: E
        ddct: dCt
    inputs:
      dCt:
        not_stated: true
        kind: per sample
        note: Ct(Oct4) - Ct(GAPDH) per sample; no Ct values printed
    aggregation: not stated
    note: '2^-ΔCt has no calibrator: the library''s ΔΔCt variable takes the ΔCt (target minus GAPDH). No values are printed
      and the bars (Fig. 2D-H) were not read'
