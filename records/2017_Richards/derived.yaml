  F7A_peak.normalized_f_f0:
    item: F7A_peak
    group: verapamil
    formula: nf = (F/F0)/(Fb/F0b)
    anchor:
      quote: Normalized F/F0 was calculated as the peak calcium fluorescence (F) divided by the start fluorescence level (F0), then
        divided by the F/F0 of the baseline transient before treatment
      where: Methods (Calcium transient imaging)
      file: journal_version.pdf
    library:
      formula: ratio_of_products
      vars:
        r: nf
        a1: F
        b1: F0
        a2: F0b
        b2: Fb
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: peak fluorescence after treatment
      F0:
        not_stated: true
        kind: per sample
        note: start fluorescence after treatment
      Fb:
        not_stated: true
        kind: per sample
        note: peak fluorescence of the baseline transient, same organoid
      F0b:
        not_stated: true
        kind: per sample
        note: start fluorescence of the baseline transient, same organoid
    aggregation: not stated
    note: Each organoid is normalised to its own pre-treatment transient, so the baseline group is 1 by construction (SD 0); no values
      printed.
