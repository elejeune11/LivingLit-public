    strength: may
    judgement: {direction: cannot judge, support: cannot judge, comparison: cannot judge, scope: cannot judge, replication: cannot judge,
      strength: follows, presence: does not follow}
    note: no therapy, disease-modelling or screening use is tested
  intro_size:
    kind: stated
    quote: we found that T3-treated hiPSC-CMs exhibited a larger cell size, longer sarcomere length, lower proliferative activity
