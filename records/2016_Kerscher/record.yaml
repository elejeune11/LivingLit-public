evidence:
  F1_viability:
    unit: F1
    measure: hiPSC viability
    method: LIVE/DEAD viability kit; confocal Z-stacks through the entire tissue thickness
    software: NIS Elements
    finding: HiPSCs remained viable 24 h post-encapsulation
    groups:
    - cluster
    - single
    context:
      day_of_measurement: day -2
    n:
      printed: n = 3 tissues
      counts: tissues
    anchor:
      quote: HiPSCs remained viable (green) 24 h post-encapsulation (n = 3 tissues)
      where: Fig. 1 legend
  F1_distribution:
    unit: F1
    measure: hiPSC distribution in the hydrogel
    finding: Both cluster and single hiPSCs were uniformly distributed throughout the microislands
    groups:
    - cluster
    - single
    context:
      day_of_measurement: day 0
    anchor:
      quote: Both cluster and single hiPSCs were uniformly distributed throughout the 3D-dhECT microislands
      where: Results 3.1
  F1_growth_cluster:
    unit: F1
    measure: tissue growth pattern
    finding: Cluster hiPSCs occupied the entire hydrogel volume quickly, with more growth at the edges than in the center
    groups:
    - cluster
    anchor:
      quote: Cells occupied the entire hydrogel volume quickly (Fig. 1D, F) and tissues exhibited more growth at the edges
        than in the center
      where: Results 3.1
  F1_growth_single:
    unit: F1
    measure: tissue growth pattern
    finding: Encapsulated single hiPSCs first formed small colonies and then interconnected tissue structures
    groups:
    - single
    anchor:
      quote: encapsulated single hiPSCs first formed small colonies and then subsequently formed interconnected tissue structures
      where: Results 3.1
  S1A_location:
    unit: S1A
    measure: location of proliferating cells
    finding: More cluster hiPSCs proliferated on tissue edges; single hiPSCs grew independent of tissue location
    groups:
    - cluster
    - single
    anchor:
      quote: Higher numbers of cluster hiPSCs proliferated on tissue edges, while encapsulated single hiPSCs grew independent
        of tissue location
      where: Fig. S1 legend
      file: NIHMS755756-supplement-1.pdf
  S1A_homogeneity:
    unit: S1A
    measure: tissue homogeneity
    finding: Tissues from single hiPSCs appeared more homogeneous than from cluster hiPSCs
    compares:
    - single
    - cluster
    anchor:
      quote: tissues formed using single hiPSCs appeared more homogeneous compared to cluster encapsulated hiPSCs
      where: Results 3.1
    stated_direction:
      direction: up
      anchor:
        quote: tissues formed using single hiPSCs appeared more homogeneous compared to cluster encapsulated hiPSCs
        where: Results 3.1
