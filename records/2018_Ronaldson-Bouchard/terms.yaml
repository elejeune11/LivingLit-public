  instructions: terms_v3
edits:
- add_term:
    field: mechanical_load
    id: mechanical_load:auxotonic
    label: auxotonic
    definition: Culture in which the tissue contracts against an elastic load (such as flexible pillars), so its length and
      force both change in each beat.
    scope: Contraction against an elastic, spring-like load; not a static load at fixed length, not unloaded free-floating
      culture, and not externally applied cyclic stretch.
- add_synonym:
    id: platform:adult_heart_tissue
    text: adult heart
    anchor: 'commercial tissues were used: adult heart, ages: 30–39'
- add_term:
    field: preparation
    id: preparation:cdna
    label: cDNA
    definition: Complementary DNA reverse-transcribed from the RNA of a sample, used to measure gene expression.
    scope: Reverse-transcribed cDNA, made in the study or bought; not purified RNA (RNA extract), a crude lysate, or living,
      fixed or sectioned samples.
- set_scope:
    id: preparation:rna_extract
    scope: Purified RNA; not cDNA reverse-transcribed from it, not a crude lysate, and not living or fixed samples.
- set_scope:
    id: measure:calcium_transient_amplitude
    scope: Peak height of electrically evoked transients; (F−F0)/F0 is expressed_as % change and F/F0 is expressed_as fold;
      not times or caffeine-evoked release.
