  F1h_ligands:
    unit: F1h
    measure: ligand fraction (Raman true component analysis)
    method: WITec alpha300 R Raman microscopy, true component analysis
    finding: Raman scan of CMM gives nephronectin 15.99%, CRGDS 33.55%, GFPGER 49.94%, PA 0.52%.
    groups:
    - cmm
    n: not stated
    values:
      nephronectin:
        printed: '15.99'
        unit: '%'
        kind: percent
        group: cmm
        spread: none
      crgds:
        printed: '33.55'
        unit: '%'
        kind: percent
        group: cmm
        spread: none
      gfpger:
        printed: '49.94'
        unit: '%'
        kind: percent
        group: cmm
        spread: none
      pa:
        printed: '0.52'
        unit: '%'
        kind: percent
        group: cmm
        spread: none
    stats:
      test: not stated
      p: not stated
    anchor:
      quote: Raman spectroscopic xy scan in Figure 1H shows the percentage of each ligand in the legend
      where: STAR Methods, Raman spectroscopy
    note: Values printed inside the figure image (Fig. 1H), not extractable.
  F1j_genes:
    unit: F1jk
    measure: maturation gene expression (RNA-seq)
    method: RNA sequencing; DESeq2, Wald test
    software: HISAT2, HTSeq, DESeq2
    finding: CMM upregulates calcium handling, cardiac development and metabolism genes versus d30.
    compares:
    - cmm
    - d30
    n: not stated
    stats:
      test: DESeq2 Wald test
      p: significant, threshold not stated
    anchor:
      quote: culture on CMM resulted in significant and substantial upregulation of important genes
      where: Results
    stated_direction:
      direction: up
      anchor:
        quote: culture on CMM resulted in significant and substantial upregulation of important genes
        where: Results
  F1k_genesets:
    unit: F1jk
    measure: gene set enrichment (z-score)
    method: gene set z-score from DESeq2 p values; Student's t-test genes inside vs outside set; Benjamini-Hochberg
    finding: Many gene sets differ in CMM versus d30 (p < 0.05), most related to cardiac function.
    compares:
    - cmm
    - d30
    n: not stated
    stats:
      test: Student's t-test for genes inside and outside the gene set, FDR corrected
      p: p < 0.05
    anchor:
      quote: we found many gene sets to be different in CMM versus d30 (p < 0.05)
      where: Results
    stated_direction:
      direction: up
      anchor:
        quote: CMM resulted in upregulation of several key ontologies related to cardiac electrophysiological development
        where: Results
