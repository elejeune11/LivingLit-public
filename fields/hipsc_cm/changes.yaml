    scope: IWR-1 (a tankyrase-dependent Wnt inhibitor); not IWP4 (a Porcupine inhibitor), DS-07, Wnt3a (a Wnt activator) or
      VEGF.
    lookup: 'livinglit lookup chebi ''IWR-1'' and ''IWR'': the pinned ChEBI has only IWR-1-endo (CHEBI:62882) and IWR-1-exo
