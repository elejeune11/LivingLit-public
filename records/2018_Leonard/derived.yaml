  F2_fs_K4vK1.fs_K1:
    item: F2_fs_K4vK1
    group: K1
    measure: fractional shortening
    formula: fs = (L0 - L)/L0
    anchor: &id003
      quote: a continuous decrease in fractional shortening
      where: Section 4
    library:
      formula: relative_decrease
      vars:
        s: fs
        x0: L0
        x: L
    inputs:
      L0:
        reading: fig2b/F2_rl_K4vK1/K1
        kind: per sample
      L:
        not_stated: true
        kind: per sample
        note: tissue length at peak contraction; not printed
    alternatives:
    - label: shortening = flexible-post deflection (one post rigid)
      formula: fs = F/(k*L0)
      note: not stated; would chain from twitch force, post stiffness and resting length
    note: '"fractional shortening" names its formula; how the contracted length was taken is not stated'
