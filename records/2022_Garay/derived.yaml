  F1_mapk_pi3k_overlap.mapk_only:
    item: F1_mapk_pi3k_overlap
    formula: c = 1 - f
    anchor:
      quote: 39% of the genes annotated to the MAPK pathway were also shared with the PI3K-AKT pathway
      where: Results, Signaling pathways downregulated in the adult heart
    library:
      formula: complement_fraction
      vars:
        c: c
        f: f
    inputs:
      f:
        value: F1_mapk_pi3k_overlap.values.pct_figS2C
        kind: constant
    output: F1_mapk_pi3k_overlap.values.mapk_only_figS2C
    note: MAPK-pathway genes split into those shared with PI3K-AKT and those not.
  F3F_mono_SP30_vs_D30.mono_diff:
    item: F3F_mono_SP30_vs_D30
    formula: d = mD - mS
    anchor:
      quote: the percentage of mononucleated CMs decreased in
      where: Results, Structural features
    library:
      formula: difference_from_reference
      vars:
        d: d
        x: mD
        x0: mS
    inputs:
      mD:
        reading: 'fig3f/Mono SP vs DMSO: DMSO'
        kind: per sample
      mS:
        reading: 'fig3f/Mono SP vs DMSO: SP'
        kind: per sample
    output: F3F_mono_SP30_vs_D30.values.mono_diff_text
    alternatives:
    - label: relative decrease (of the DMSO value)
      formula: d = (mD - mS)/mD
    note: '''decreased ... by 10%'' read as percentage points; a relative decrease is the alternative.'
  F3F_bi_SP30_vs_D30.bi_diff:
    item: F3F_bi_SP30_vs_D30
    formula: d = xS - xD
    anchor: &id003
      quote: the percentage of binucleation and trinucleation of day 30 SP-treated hiPSC-CMs increased by ~9 and ~1%, respectively
      where: Results, Structural features
    library:
      formula: difference_from_reference
      vars:
        d: d
        x: xS
        x0: xD
    inputs:
      xS:
        reading: 'fig3f/Bi SP vs DMSO: SP'
        kind: per sample
      xD:
        reading: 'fig3f/Bi SP vs DMSO: DMSO'
        kind: per sample
    output: F3F_bi_SP30_vs_D30.values.bi_diff_text
    alternatives:
    - label: relative increase (of the DMSO value)
      formula: d = (xS - xD)/xD
    note: '''increased by ~9 and ~1%'' read as percentage points; a relative increase is the alternative.'
  F3F_tri_SP30_vs_D30.tri_diff:
    item: F3F_tri_SP30_vs_D30
    formula: d = xS - xD
