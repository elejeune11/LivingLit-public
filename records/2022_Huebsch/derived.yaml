proposals:
  - formula: fridericia_rate_correction
    kind: definition
    statement: A rate-corrected duration (Fridericia's correction) is the duration divided by the cube root of the beat interval, both in seconds.
    equations: ["dcf = dur/RR**(1/3)"]
    variables: {dcf: "time^(2/3)", dur: time, RR: time}
    does_not_apply: "other rate corrections: Bazett's divides by the square root of the interval, Framingham's is linear in the interval"
    tests:
      - {given: {dur: 0.4, RR: 1.0}, expect: {dcf: 0.4}}
      - {given: {dur: 0.3, RR: 0.125}, expect: {dcf: 0.6}}
      - {given: {dur: 0.3, RR: 0.25}, does_not_apply: "Bazett's correction gives 0.3/0.25^(1/2) = 0.6, not 0.3/0.25^(1/3) = 0.476"}
    cites:
      text: "Fridericia LS. The duration of systole in an electrocardiogram in normal humans and in patients with heart disease (1920; English translation). Ann Noninvasive Electrocardiol 8, 343–351 (2003)"
      url: https://doi.org/10.1046/j.1542-474X.2003.08413.x
  - formula: cantilever_uniform_load
    kind: model
    statement: A slender elastic cantilever under a uniformly distributed load q along its length L deflects at its free end by qL^4/(8EI); the total load is F = qL, so F = 8EI·d/L^3.
    equations: ["d = q*L**4/(8*E*I)", "F = q*L"]
    variables: {d: length, q: force/length, L: length, E: modulus, I: second_moment, F: force}
    assumes:
      - small deflection
      - linear elastic material
      - slender beam
      - uniformly distributed load along the length
      - deflection taken at the free end
    does_not_apply: "a point load at the free end (d = F L^3/(3EI)), large deflections, or a short thick beam where shear deformation matters"
    tests:
      - {given: {q: 1.0, L: 1.0, E: 1.0, I: 1.0}, expect: {d: 0.125, F: 1.0}}
      - {given: {q: 2.0, L: 2.0, E: 4.0, I: 1.0}, expect: {d: 1.0, F: 4.0}}
      - {given: {q: 1.0, L: 1.0, E: 1.0, I: 1.0}, does_not_apply: "the same total load F = 1 at the free end deflects the tip by 1/3, not 1/8"}
    cites:
      text: "Gere and Goodno, Mechanics of Materials, 8th ed., Cengage 2013, Appendix G, Table G-1 (cantilever beam, uniform load)"
      quote: "δB = qL^4/8EI"
  - formula: circular_second_moment
    kind: definition
    statement: The second moment of area of a solid circular cross-section of radius R about a diameter is πR^4/4.
    equations: ["I = pi*R**4/4"]
    variables: {I: second_moment, R: length}
    does_not_apply: "a hollow tube (π(R^4 − Ri^4)/4) or the polar moment of the same section (πR^4/2)"
    tests:
      - {given: {R: 1.0}, expect: {I: 0.7853981633974483}}
      - {given: {R: 2.0}, expect: {I: 12.566370614359172}}
      - {given: {R: 1.0}, does_not_apply: "the polar moment πR^4/2 = 1.5708 is not the bending second moment"}
    cites:
      text: "Gere and Goodno, Mechanics of Materials, 8th ed., Cengage 2013, Appendix E, Properties of plane areas (circle)"
      quote: "Ix = Iy = πr^4/4"
