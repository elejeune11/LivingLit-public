record: 2020_Saleem-U
formula_library_version: 1
agent:
  model: llm
  instructions: formulas_v3
derived:
  F1C_ttp_ratio.longer:
    item: F1C_ttp_ratio
    formula: d = (x - x0)/x0
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    anchor:
      quote: In GCaMP5G EHTs, kinetics of time-to-peak CaT (TTP80%,CaT; 0.181 ± 0.004 s) was 28% longer than time-to-peak force (TTP80%,force; 0.141 ± 0.001 s)
      where: Results, Specificity of Fluorescence Signal
    inputs:
      x:
        reading: s1a_ttp_cat/gcamp5g
        kind: per sample
        note: TTP80%,CaT of each EHT (CaT, red bar); printed mean 0.181 s
      x0:
        reading: s1a_ttp_force/gcamp5g
        kind: per sample
        note: TTP80%,force of the same EHTs (force, blue bar); printed mean 0.141 s
    output: F1C_ttp_ratio.values.longer
    output_unit: '%'
    aggregation: not stated
    note: 'A test between two measures of the same tissues, not a contrast: the paired t-test (Figure 1C and S1A, *p<0.05) compares TTP80%,CaT with TTP80%,force in the same EHTs, and the printed relation
      is their relative difference. Inputs are the read bar means; the sentence prints the means 0.181 and 0.141 s. Whether the % is of the two means or the mean of per-EHT ratios is not stated; no per-EHT
      points are readable.'
  F1C_dt_ratio.longer:
    item: F1C_dt_ratio
    formula: d = (x - x0)/x0
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    anchor:
      quote: decay time of the CaT (DT80%; 0.329 ± 0.003 s) was 99% longer than relaxation time for force (RT80%,force; 0.165 ± 0.002 s
      where: Results, Specificity of Fluorescence Signal
    inputs:
      x:
        reading: s1a_dt_cat/gcamp5g
        kind: per sample
        note: DT80%,CaT of each EHT (CaT, red bar); printed mean 0.329 s
      x0:
        reading: s1a_rt_force/gcamp5g
