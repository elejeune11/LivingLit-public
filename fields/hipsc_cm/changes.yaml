- version: 15
  paper: 2018_Ulmer
  agent:
    model: llm
    instructions: terms_v3
    run: null
  events:
  - event: add_synonym
    id: platform:engineered_3d
    text: EHT
    anchor: We recently established the hiPSC-CM engineered heart tissue (EHT) model
  - event: add_term
    field: platform
    id: platform:cell_free_control
    label: cell-free control
    definition: A well or vessel handled like the cultures but containing no cells, used as a background blank.
    scope: A blank without cells; not a 2D culture, an engineered tissue or native tissue, which all contain cells.
  - event: add_term
    field: substrate
    id: substrate:culture_plate
    label: culture plate
    definition: A multi-well tissue-culture plate whose surface the cells grow on.
    scope: The plastic surface of a multi-well plate (well format as a qualifier); not glass, PDMS, polyacrylamide, a hydrogel
      or decellularized myocardium.
    qualifiers:
      format:
        dimension: text
      brand:
        dimension: text
  - event: adopt
    field: cell_line
    id: CVCL_VF08
    label: TUMi001-A
    lookup: 'livinglit lookup cellosaurus C25: exact synonym of TUMi001-A (Technische Universitaet Muenchen); the paper says
      C25 came from the Moretti group, Muenchen (GM00646, the other exact hit, is a fibroblast line).'
    synonyms:
    - text: C25
      anchor: The C25 control hiPSC line 1 was provided by the group of Alessandra Moretti
  - event: adopt_own
    field: cell_line
    id: cell_line:erc018_ipsc
    label: ERC018 hiPSC line (clone not stated)
    definition: The UKE stem cell facility control hiPSC line ERC018, with no clone named.
    scope: ERC018 when the source names no clone; a named clone (UKEi003-A, -B or -C) takes its Cellosaurus id.
    lookup: 'livinglit lookup cellosaurus ERC018 / ERC18 / UKEi: three clones UKEi003-A, UKEi003-B, UKEi003-C (ERC018sv1583,
      sv1590, sv1634); the paper names no clone.'
    synonyms:
    - text: ERC018
      anchor: ERC018, stem cell facility of the UKE, Hamburg
    - text: ERC18
      anchor: for providing the ERC18 control hiPSC line 2
  - event: adopt
    field: treatment
    id: CHEBI:35366
    label: fatty acid
    lookup: 'livinglit lookup chebi "fatty acid": exact CHEBI:35366; the paper used a linoleic acid/oleic acid fatty acid
      mix, so the class is kept.'
  - event: adopt
    field: treatment
    id: CHEBI:24996
    label: lactate
    lookup: 'livinglit lookup chebi lactate: exact CHEBI:24996 (the paper used sodium lactate solution; the stated value is
      lactate).'
  - event: adopt_own
    field: treatment
    id: treatment:bts
    label: N-benzyl-p-toluene sulfonamide
    definition: N-benzyl-p-toluene sulfonamide (BTS), a small-molecule myosin II inhibitor.
    scope: The myosin II inhibitor BTS; not blebbistatin (CHEBI:75379) or diacetylmonoxime.
    lookup: 'livinglit lookup chebi BTS, N-benzyl-p-toluenesulfonamide, N-benzyl-p-toluene sulfonamide, N-benzyl-4-methylbenzenesulfonamide,
      benzyl toluenesulfonamide: no ChEBI entry.'
    synonyms:
    - text: BTS
      anchor: blebbistatin and N-benzyl-p-toluene sulfonamide [BTS]
  - event: adopt_own
    field: treatment
    id: treatment:no_energy_substrate
    label: no energy substrate
    definition: Medium from which every energy substrate (glucose, lactate, fatty acid) is left out.
    scope: Withdrawal of all energy substrates; a single substrate given alone takes that substrate's id.
    lookup: 'livinglit lookup chebi "energy substrate", "no energy substrate": a state, not a compound; no ChEBI entry.'
  - event: add_synonym
    id: measure:contraction_frequency
    text: spontaneous beating frequency
    anchor: spontaneous beating frequency (beats per minute) over time
  - event: add_synonym
    id: measure:contraction_frequency
    text: beating rate
    anchor: Beating rate for hiPSC-CMs of both control cell lines in 2D
  - event: add_synonym
    id: measure:mitochondrial_dna_content
    text: mtDNA content
    anchor: we measured the mitochondrial mass and mtDNA content
  - event: add_qualifier
    id: measure:mitochondrial_dna_content
    name: gene
    dimension: text
  - event: add_qualifier
    id: measure:ultrastructure
    name: feature
    dimension: text
  - event: add_qualifier
    id: measure:enrichment_p_value
    name: annotation
    dimension: text
  - event: add_term
    field: measure
    id: measure:protein_class_abundance
    label: abundance of a protein class
    dimension: dimensionless
    definition: Abundance of the proteins of a stated class (qualifier protein_class) in a proteome, summarised as stated
      (qualifier summary).
    scope: A whole class of proteins (mitochondrial, nuclear, ribosomal); not one named protein (protein level) and not a
      count over the whole proteome.
    qualifiers:
      protein_class:
        dimension: text
      summary:
        dimension: text
  - event: add_term
    field: measure
    id: measure:identified_protein_count
    label: number of proteins identified
    dimension: dimensionless
    definition: Count of proteins identified in a proteomic analysis.
    scope: All proteins detected; not the count of proteins that differ between conditions.
  - event: add_term
    field: measure
    id: measure:annotation_share
    label: share of an annotation category
    dimension: dimensionless
    definition: Per cent of the annotations of a stated protein or gene set (qualifier gene_set) that fall in a stated pathway
      or protein class (qualifier category).
    scope: The share of a set falling in one category; not an enrichment p-value and not a count of genes in a GO term.
    qualifiers:
      category:
        dimension: text
      gene_set:
        dimension: text
  - event: add_term
    field: measure
    id: measure:regulator_effects_network
    label: regulator effects network
    dimension: categorical
    definition: A network of upstream regulators and downstream functions inferred from a set of differing proteins or genes.
    scope: An inferred regulatory network; not an enrichment p-value and not expression clusters.
  - event: add_term
    field: measure
    id: measure:mitochondrial_mass
    label: mitochondrial mass
    dimension: dimensionless
    definition: Amount of mitochondria per cell measured by the fluorescence of a mitochondrial dye.
    scope: Dye-based mitochondrial content; not mitochondrial DNA content and not mitochondrial area fraction from images.
    synonyms:
    - text: mitochondrial mass
      anchor: Mitochondrial mass was analyzed by flow cytometry of live cells
  - event: add_term
    field: measure
    id: measure:glucose_consumption
    label: glucose consumption
    dimension: concentration
    definition: Fall in the glucose concentration of the medium over a stated interval (qualifier interval).
    scope: Glucose taken up from the medium; not lactate released into it and not the oxidation of labelled glucose.
    qualifiers:
      interval:
        dimension: text
    synonyms:
    - text: glucose consumption
      anchor: Glucose consumption (B) and lactate production (C) in 2D and 3D hiPSC-CMs
  - event: add_term
    field: measure
    id: measure:lactate_production
    label: lactate production
    dimension: concentration
    definition: Rise in the lactate concentration of the medium over a stated interval (qualifier interval).
    scope: Lactate released into the medium; not glucose consumption and not extracellular acidification rate.
    qualifiers:
      interval:
        dimension: text
    synonyms:
    - text: lactate production
      anchor: Glucose consumption (B) and lactate production (C) in 2D and 3D hiPSC-CMs
  - event: add_term
    field: measure
    id: measure:substrate_oxidation
    label: labelled substrate oxidation
    dimension: amount
    definition: Amount of labelled CO2 produced from a stated radiolabelled substrate (qualifier substrate) over an incubation.
