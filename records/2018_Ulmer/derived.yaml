        not_stated: true
        kind: per sample
        note: 'CPM per sample: plotted in Fig. S6C-E, not read or released'
      t:
        printed: '60'
        unit: s/min
        anchor:
          quote: CPM was recalculated as decay per minute, Bq= CPM/60*96%
          where: Supplemental Experimental Procedures
          file: mmc1.pdf
        kind: constant
      e:
        printed: 96%
