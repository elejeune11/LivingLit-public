evidence:
  F1e_diameter:
    unit: F1e
    measure: organoid diameter
    finding: organoid diameter did not change between D0 and D10
    anchor:
      quote: Bright-field images of organoids at D10 and diameters (mean ± s.d.) at D0 and D10
      where: Fig. 1e legend
    groups:
    - c_d0
    - c_d10
    - i_d0
    - i_d10
    method: bright-field imaging
    software: not stated
    n:
      printed: n = 252 and n = 215 organoids for D0 and D10, respectively, in the control group; n = 152 and n = 216 infarct
        organoids for D0 and D10, respectively, in the test group
      counts: organoids
      per_group:
        c_d0: '252'
        c_d10: '215'
        i_d0: '152'
        i_d10: '216'
  F1f_hypoxia:
    unit: F1f
    measure: hypoxia stain radial density
    finding: decreased oxygen towards the interior of infarct organoids compared with the control organoids
    anchor:
      quote: indicating decreased oxygen (brighter) towards the interior of infarct organoids compared with the control organoids
      where: Fig. 1f legend
    compares:
    - inf
    - ctrl
    test_of: pair
    method: confocal z-slice imaging of Image-iT Green Hypoxia live-cell stain, radial density profile
    software: Radial Profile ImageJ plugin
    n:
      printed: n = 13 organoids in the control group; n = 15 infarct organoids in the test group
      counts: organoids
      per_group:
        ctrl: '13'
        inf: '15'
    stated_direction:
      direction: up
      anchor:
        quote: indicating decreased oxygen (brighter) towards the interior of infarct organoids compared with the control
          organoids
        where: Fig. 1f legend
  F1h_nadh:
    unit: F1h
    measure: NADH index
    finding: lower NADH in the centre of organoids and overall lower levels in infarct organoids
    anchor:
      quote: NADH index quantification (right) showing lower NADH in the centre of organoids and overall lower levels in infarct
        organoids
      where: Fig. 1h legend
    compares:
    - c_edge
    - c_int
    - i_edge
    - i_int
    test_of: omnibus
    method: two-photon NADH autofluorescence, background-subtracted mean grey value divided by the mean of dead organoids
    software: not stated
    n:
      printed: n = 10 organoids in the control group; n = 11 infarct organoids in test group
      counts: organoids
      per_group:
        c_edge: '10'
        c_int: '10'
        i_edge: '11'
        i_int: '11'
    stats:
      test: one-way ANOVA with post hoc Bonferroni-corrected two-sided t-tests
      p: P = 0.0014
      p_values:
      - p: '*P < 0.001'
        anchor:
          quote: Data are mean ± s.d. *P < 0.001; statistical analysis was performed using one-way ANOVA with post hoc Bonferroni-corrected
            two-sided t-tests
          where: Fig. 1h legend
  F2a_de:
    unit: F2a
    measure: number of differentially expressed genes
    finding: the cardiac organoid infarction protocol resulted in 5,675 differentially expressed genes
    anchor:
      quote: The cardiac organoid infarction protocol resulted in 5,675 differentially expressed (DE) genes (P < 0.05) compared
        with the control organoids
      where: Results, Transcriptomic meta-analysis
    compares:
    - inf
    - ctrl
    test_of: pair
    method: RNA-seq, DESeq2 differential expression analysis
    software: DESeq2 1.18.1
    values:
      n_de:
        printed: 5,675
        unit: genes
        kind: count
        between:
        - inf
        - ctrl
    n:
      printed: n = 3 biologically independent samples per group
      counts: biologically independent samples
      per_group:
        ctrl: '3'
        inf: '3'
    stats:
      test: DESeq2 differential expression analysis of RNA-seq data
      p: P < 0.05
