    lookup: lookup cl 'ventricular cardiac muscle cell' (exact, CL:2000046) and 'neonatal' (only CL:0002495 fetal cardiomyocyte,
      not ventricular); CL has no species- or age-specific ventricular myocyte
  - event: add_synonym
