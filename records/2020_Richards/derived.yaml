record: 2020_Richards
formula_library_version: 17
derived:
  F1h_nadh.nadh_value:
    item: F1h_nadh
    measure: NADH index
    formula: v = g - bg
    anchor:
      quote: background mean grey values were first subtracted from the mean grey value of the sample area NADH autofluorescence
      where: Methods, Fluorescence imaging and analysis
    library:
      formula: sum_of_parts
      vars:
        t: g
        a: v
        b: bg
    inputs:
      g:
        not_stated: true
        kind: per sample
        note: sample mean grey value, not printed
      bg:
        not_stated: true
        kind: per sample
        note: background mean grey value, not printed
    note: background-subtracted NADH value of each sample; written as g = v + bg in the library entry
  F1h_nadh.nadh_index:
    item: F1h_nadh
    measure: NADH index
    formula: N = v/vd
    anchor:
      quote: The NADH index was then calculated as the NADH value of each sample divided by the average of the NADH values
        of the dead organoid samples
      where: Methods, Fluorescence imaging and analysis
    library:
      formula: ratio_def
      vars:
        r: N
        a: v
        b: vd
    inputs:
      v:
        derived: F1h_nadh.nadh_value
        kind: per sample
      vd:
        not_stated: true
        kind: constant
        note: mean NADH value of the dead (frozen + thawed) organoids; not printed and not plotted
    note: 'no printed output: the index is shown only in Fig. 1h (read in readings f1h_nadh)'
  F2a_de.n_de_from_venn:
    item: F2a_de
    measure: number of differentially expressed genes
    formula: n = u + s
    anchor:
      quote: Venn diagram comparison of differentially expressed genes from organoid RNA-seq and the public human ICM RNA-seq
        data
      where: Supplementary Fig. 2a legend
      file: NIHMS1605561-supplement-Supplementary_Information.docx
    library:
      formula: sum_of_parts
      vars:
        t: n
        a: u
        b: s
    inputs:
      u:
        value: S2a_venn.values.unique_org
        kind: constant
      s:
        value: S2a_venn.values.shared
        kind: constant
    output: F2a_de.values.n_de
    note: the organoid circle of the Venn diagram (unique + shared) is the organoid DE gene set; the Methods say non-overlapping
      genes from platform differences were excluded for the Venn comparisons, so the circle may be smaller than the full DE
      count
    alternatives:
    - label: platform-filtered circle
      note: if genes absent from the human ICM RNA-seq data were excluded, u + s is less than 5,675 by construction
  F3c_fccp_fold.fold_ctrl:
    item: F3c_fccp_fold
    group: ctrl
    measure: oxygen consumption rate response to FCCP
    formula: r = o/o0
    anchor:
      quote: an approximately twofold increase in the oxygen consumption rate (OCR) of control organoids after treatment with
      where: Results, Pathological metabolic shifts
    library:
      formula: ratio_def
      vars:
        r: r
        a: o
        b: o0
    inputs:
      o:
        not_stated: true
        kind: not stated
        note: 'OCR of control organoids after FCCP: Fig. 3c time course, not read'
      o0:
        not_stated: true
        kind: not stated
        note: 'OCR of control organoids before FCCP (basal): Fig. 3c time course, not read'
    output: F3c_fccp_fold.values.fold_ctrl
    alternatives:
    - label: baseline = non-mitochondrial OCR
      note: Fig. 3d plots peak OCR as a percentage of non-mitochondrial respiration (control ~198 %, read); the text does
        not say which baseline 'twofold' refers to
  F3d_peak_ocr.pct_nonmito:
    item: F3d_peak_ocr
    measure: peak OCR after FCCP
    formula: p = x/xnm
    anchor:
      quote: percentage of non-mitochondrial respiration
      where: Fig. 3d axis label
      kind: figure text
    library:
      formula: ratio_def
      vars:
        r: p
        a: x
        b: xnm
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: peak OCR after FCCP of each organoid, not printed
      xnm:
        not_stated: true
        kind: per sample
        note: non-mitochondrial respiration (after rotenone/antimycin A) of each organoid, not printed
    output_unit: '%'
    note: named operation on the axis; whether each organoid's own non-mitochondrial value or a group mean is the denominator
      is not stated; values only in the figure (readings)
  F3f_peak_ecar.pct_nonmito:
    item: F3f_peak_ecar
    measure: peak ECAR after oligomycin
    formula: p = x/xnm
    anchor:
      quote: percentage of non-mitochondrial respiration
      where: Fig. 3f axis label
      kind: figure text
    library:
      formula: ratio_def
      vars:
        r: p
        a: x
        b: xnm
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: peak ECAR after oligomycin of each organoid, not printed
      xnm:
        not_stated: true
        kind: per sample
        note: non-mitochondrial respiration (after rotenone/antimycin A) of each organoid, not printed
    output_unit: '%'
    note: named operation on the axis; whether each organoid's own non-mitochondrial value or a group mean is the denominator
      is not stated; values only in the figure (readings)
  F3e_ecar_pct.ecar_increase:
    item: F3e_ecar_pct
    measure: extracellular acidification rate after oligomycin
    formula: d = (x - x0)/x0
    anchor:
      quote: Treatment with oligomycin led to a ~30% increase in the extracellular acidification rate (ECAR) of
      where: Results, Pathological metabolic shifts
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        reading: f3f_peak_ecar/infarct
        kind: per sample
        note: Fig. 3f peak ECAR after oligomycin, infarct (percentage of non-mitochondrial respiration)
      x0:
        reading: f3f_peak_ecar/control
        kind: per sample
        note: Fig. 3f peak ECAR after oligomycin, control
    output: F3e_ecar_pct.values.ecar_increase
    note: the text cites Fig. 3e,f; Fig. 3f is the only panel read. Its values are normalised to non-mitochondrial respiration,
      so their ratio equals the raw ECAR ratio only if the two groups' non-mitochondrial values are equal
    alternatives:
    - label: raw ECAR from the Fig. 3e time course
      note: not read; the increase may refer to absolute ECAR rather than the normalised peak
  F3g_lactate.normalized:
    item: F3g_lactate
    measure: normalized l-lactate level
    formula: y = c/c0
    anchor:
      quote: Normalized l-lactate levels (on the basis of absorbance readings) relative to control medium
      where: Fig. 3g legend
    library:
      formula: ratio_def
      vars:
        r: y
        a: c
        b: c0
    inputs:
      c:
        not_stated: true
        kind: per sample
        note: absorbance-based lactate level of each well, not printed
      c0:
        not_stated: true
        kind: not stated
        note: control medium level; whether it is the mean of the control organoids' medium or a cell-free control medium
          is not stated
  F3h_ldh.tpm_ratio:
    item: F3h_ldh
    measure: LDHA/LDHB ratio of transcripts per million
    formula: r = ta/tb
    anchor:
      quote: Differences in lactate-related gene expression (ratio of transcripts per million (TPM))
      where: Fig. 3h legend
    library:
      formula: ratio_def
      vars:
        r: r
        a: ta
        b: tb
    inputs:
      ta:
        not_stated: true
        kind: per sample
        note: LDHA TPM of each sample, not printed
      tb:
        not_stated: true
        kind: per sample
        note: LDHB TPM of each sample, not printed
    aggregation: not stated
    note: per-sample ratio or ratio of group means is not stated; no printed output (readings only)
  F3h_slc16.tpm_ratio:
    item: F3h_slc16
    measure: SLC16A1/SLC16A3 ratio of transcripts per million
    formula: r = ta/tb
    anchor:
      quote: Differences in lactate-related gene expression (ratio of transcripts per million (TPM))
      where: Fig. 3h legend
    library:
      formula: ratio_def
      vars:
        r: r
        a: ta
        b: tb
    inputs:
      ta:
        not_stated: true
        kind: per sample
        note: SLC16A1 TPM of each sample, not printed
      tb:
        not_stated: true
        kind: per sample
        note: SLC16A3 TPM of each sample, not printed
    aggregation: not stated
    note: per-sample ratio or ratio of group means is not stated; no printed output (readings only)
  F4i_modulus.modulus:
    item: F4i_modulus
    measure: elastic modulus
    formula: E = 3*a*dp*Phi/(2*pi*L)
    anchor: &id001
      quote: the change in length (L) from pre-deformation to equilibrium deformation was used to calculate the elastic modulus
        according the previously established relationship
      where: Methods, Mechanical testing using micropipette aspiration
    library:
      formula: micropipette_aspiration_half_space
      vars:
        E: E
        a: a
        dp: dp
        Phi: Phi
        L: L
    inputs:
      a:
        not_stated: true
        kind: not stated
        note: inner micropipette radius; only the inner diameter is printed, as a range (approximately 70-80 µm)
      dp:
        printed: '3.9'
        unit: kPa
        kind: constant
        anchor:
          quote: a fixed pressure of 40 cmH2O (~3.9 kPa)
          where: Methods, Mechanical testing using micropipette aspiration
        note: printed as ~3.9 kPa (40 cmH2O)
      Phi:
        by_reference:
          citation: r104
          anchor:
            quote: are dependent on the geometry of the micropipette tip
            where: Methods, Mechanical testing using micropipette aspiration
        kind: constant
      L:
        not_stated: true
        kind: per sample
        note: aspirated length at equilibrium deformation of each organoid, not printed
    note: 'no printed output: moduli are shown only in figures'
