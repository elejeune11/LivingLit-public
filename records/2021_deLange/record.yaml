evidence:
  F2ac_TF_length:
    unit: F2ac
    measure: twitch force versus normalized construct length
    method: isometric twitch force, stepwise stretch until maximal twitch force
    software: IonWizard 6.0
    finding: rapid increase in TF production, followed by a plateau phase
    groups:
    - ect
    n:
      printed: n = 41
      counts: hiPSC-ECTs
    anchor:
      quote: twitch force (DTF; blue line) and passive tension (DPT; green line) versus normalized construct length
      where: Fig. 2B legend
  F2ac_PT_length:
    unit: F2ac
    measure: passive tension versus normalized construct length
    method: stepwise stretch
    software: IonWizard 6.0
    finding: initial slow increase in force followed by a rapid rise as TF started to plateau
    groups:
    - ect
    n:
      printed: n = 41
      counts: hiPSC-ECTs
    anchor:
      quote: passive tension (PT) showed an initial slow increase in force followed by a rapid rise as TF started to plateau
      where: Results
  F2ac_slack:
    unit: F2ac
    measure: slack length
    finding: slack length 8 mm
    groups:
    - ect
    values:
      slack_ect_text:
        printed: '8'
        unit: mm
        kind: value
        group: ect
        spread: none
    anchor:
      quote: sequential stretching of the hiPSC-ECTs from their slack length (8 mm)
      where: Results
  F2dk_TF_freq:
    unit: F2dk
    measure: normalized twitch force versus frequency
    method: normalized to the maximum over frequencies
    software: IonWizard 6.0
    finding: marginal increase with pacing frequency; peak TF reached at 1.5 Hz
    groups:
    - ect
    n:
      printed: n = 6
      counts: hiPSC-ECTs
    anchor:
      quote: Peak TF was reached at 1.5 Hz (Fig. 2E)
      where: Results
  F2dk_CT100_freq:
    unit: F2dk
    measure: normalized CT100 versus frequency
    method: normalized to the maximum over frequencies
    software: IonWizard 6.0
    finding: CT100 decreased in a frequency-dependent manner
    groups:
    - ect
    n:
      printed: N = 14
      counts: hiPSC-ECTs
    anchor:
      quote: normalized CT100 (CT100/CT100max; blue line) versus frequency (Hz) (N = 14)
      where: Fig. 2F legend
  F2dk_RT50_freq:
    unit: F2dk
    measure: normalized RT50 versus frequency
    method: normalized to the maximum over frequencies
    software: IonWizard 6.0
    finding: RT50 decreased in response to increased pacing frequency
    groups:
    - ect
    n:
      printed: n = 14
      counts: hiPSC-ECTs
    anchor:
      quote: normalized RT50 (RT50/RT50max; blue line) versus frequency (Hz) (n = 14)
      where: Fig. 2G legend
  F2dk_CaTR_freq:
    unit: F2dk
    measure: normalized Ca2+-transient amplitude versus frequency
    method: normalized to the maximum over frequencies
    software: IonWizard 6.0
    finding: marginal increase with pacing frequency; peaked at 2 Hz
    groups:
    - ect
    n:
      printed: n = 6
      counts: hiPSC-ECTs
    anchor:
      quote: TR peaked at 2 Hz (Fig. 2I)
      where: Results
  F2dk_CaT100_freq:
    unit: F2dk
    measure: normalized Ca2+T100 versus frequency
    method: normalized to the maximum over frequencies
    software: IonWizard 6.0
    finding: Ca2+T100 decreased in a frequency-dependent manner
    groups:
    - ect
    n:
      printed: n = 6
      counts: hiPSC-ECTs
    anchor:
      quote: decreased in a frequency-dependent manner (Fig. 2, F and J)
      where: Results
  F2dk_CaDT50_freq:
    unit: F2dk
    measure: normalized Ca2+DT50 versus frequency
    method: normalized to the maximum over frequencies
    software: IonWizard 6.0
    finding: Ca2+DT50 decreased in response to increased pacing frequency
    groups:
    - ect
    n:
      printed: n = 6
      counts: hiPSC-ECTs
    anchor:
      quote: decreased in response to increased pacing frequency (Fig. 2, G and K)
      where: Results
  F2l_concurrent:
    unit: F2l
    measure: concurrent Ca2+-transient and twitch force time course
    method: Fura-2 ratio and isometric force recorded concurrently
    software: IonWizard 6.0
    finding: rapid rise in [Ca2+]i preceding force production; intact EC coupling
    groups:
    - ect
    n:
      printed: n = 13
      counts: hiPSC-ECTs
    anchor:
      quote: twitch force (TF; blue line) versus time in hiPSC-ECT paced at 1 Hz (n = 13)
      where: Fig. 2L legend
  F2m_origin:
    unit: F2m
    measure: action potential origin
    method: voltage optical mapping with FluoVolt
    software: SciMedia
    finding: action potentials originated from a single point in the construct
    groups:
    - ect
    anchor:
      quote: action potentials originated from a single point in the construct
      where: Results
  F2m_APD_ratio:
    unit: F2m
    measure: APD40-30/80-70 ratio
    method: single pixel FluoVolt fluorescence
    software: SciMedia
    finding: ratio >2, consistent with ventricular myocytes
    groups:
    - ect
    values:
      apd_ratio_text:
        printed: '>2'
        unit: ratio
        kind: value
        group: ect
        spread: none
    anchor:
      quote: we found the ADP40-30/80-70 ratio to be >2
      where: Results
    note: the text writes ADP40-30/80-70
  F3_bin1_late:
    unit: F3
    measure: Bin1 striation spacing
    method: immunostaining of cryosections for Bin1, fluorescent intensity trace
    software: NIS Elements 4.0
    finding: cross striated Bin1 staining every ~2.1 µm, indicating a t-tubular system
    groups:
    - late
    values:
      spacing_late_text:
        printed: '2.09'
        unit: µm
        group: late
        spread: not stated
      spacing_late_pm_text:
        printed: '0.026'
        unit: µm
        kind: value
        group: late
        spread: none
      spacing_late_approx_text:
        printed: ~2.1
        unit: µm
        group: late
        spread: none
      spacing_late_figure:
        printed: '2.05'
        unit: µm
        kind: value
        group: late
        spread: none
    anchor:
      quote: show a cross striated staining pattern interspersed every 2.1 mm (2.09 ± 0.026 mm)
      where: Results
    note: the ± spread is not named; 2.05 µm is a label inside the Fig. 3D image (intensity trace), not extractable text
  F3_bin1_early:
    unit: F3
    measure: Bin1 striation spacing
    method: immunostaining of cryosections for Bin1, fluorescent intensity trace
    software: NIS Elements 4.0
    finding: evidence of a t-tubular system after as little as 2 wk
    groups:
    - early
    values:
      spacing_early_figure:
        printed: '2.14'
        unit: µm
        kind: value
        group: early
        spread: none
    anchor:
      quote: image only
      where: Fig. 3B (intensity trace label)
      kind: unit
  F3_em:
    unit: F3
    measure: t-tubules by electron microscopy
    method: transmission electron microscopy
    software: not stated
    finding: t-tubules adjacent to Z-disks
    groups:
    - em
    anchor:
      quote: Electron microscopy confirmed the presence of t-tubules adjacent to Z-disks in 24-day hiPSC-ECT
      where: Results
  F4_CSA:
    unit: F4
    measure: ECT cross-sectional area
    finding: CSA decreased significantly with prolonged culture
    compares:
    - late
    - early
    n: &id003
      printed: n = 21; n = 41
      counts: hiPSC-ECTs
      per_group:
        early: '21'
        late: '41'
    stats:
      test: unpaired t test with Welch's correction
      p: '**P < 0.001'
    stated_direction:
      direction: down
      anchor:
        quote: sectional area (CSA) of hiPSC-ECTs decreased significantly with prolonged culture
        where: Results
    anchor:
      quote: sectional area (CSA) of hiPSC-ECTs decreased significantly with prolonged culture
      where: Results
  F4_auto:
    unit: F4
    measure: automaticity
    finding: automaticity significantly decreased over time in ECT culture
    compares:
    - late
    - early
    n: *id003
    stats:
      test: unpaired t test with Welch's correction
      p: '*P < 0.05'
    stated_direction:
      direction: down
      anchor:
        quote: The automaticity of hiPSC-ECTs significantly decreased over time in ECT culture
        where: Results
    anchor:
      quote: The automaticity of hiPSC-ECTs significantly decreased over time in ECT culture
      where: Results
