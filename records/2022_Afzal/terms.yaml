  instructions: terms_v4
edits:
- adopt:
    field: cell_line
    id: CVCL_E5H8
    label: UCH-HF-YK-27
    lookup: 'livinglit lookup cellosaurus ''HF-YK27'' and ''YK27'': CVCL_E5H8 UCH-HF-YK-27 (synonyms HDFa-YK27, YK27); UConn
      Health line, the authors'' institution'
    synonyms:
    - text: HF-YK27
      anchor: HF-YK27 and PBY4-48D were used to test the effect of CMM on multiple iPSCs lines
- adopt:
    field: cell_line
    id: CVCL_E5HC
    label: UCH-PBY4-48D
    lookup: 'livinglit lookup cellosaurus ''PBY4-48D'' and ''PBY4'': CVCL_E5HC UCH-PBY4-48D (synonyms PBY4, RX48D, PB-iPS)'
    synonyms:
    - text: PBY4-48D
      anchor: HF-YK27 and PBY4-48D were used to test the effect of CMM on multiple iPSCs lines
- adopt:
    field: treatment
    id: CHEBI:16240
    label: hydrogen peroxide
    lookup: 'livinglit lookup chebi ''hydrogen peroxide'': CHEBI:16240 exact'
    synonyms:
    - text: H2O2
      anchor: Using a pulse of 1 mM hydrogen peroxide (H2O2) in Tyrode buffer
- add_synonym:
    id: purification:metabolic_selection
    text: lactate
    anchor: metabolically purified using lactate
- add_qualifier:
    id: purification:metabolic_selection
    name: concentration
    dimension: concentration
- add_synonym:
    id: platform:monolayer
    text: flat tissue-culture surface
    anchor: Control flat tissue-culture surfaces were coated with fibronectin
- add_term:
    field: platform
    id: platform:nanowrinkled_surface
    label: nanowrinkled surface
    parent: platform:culture_2d
    definition: Cells grown on a flat substrate whose surface carries anisotropic nanoscale wrinkles that align them.
    scope: Wrinkle topography at the nanoscale moulded into the culture substrate; not micro-grooves scored or embossed (grooved
      surface), not printed matrix islands (micropatterned culture), not an unpatterned monolayer, and not posts, thin films,
      inserts, Boyden chambers or electrode arrays.
    synonyms:
    - text: ANW
      anchor: Selected ligands were conjugated to a substrate with anisotropic nanowrinkles (ANW)
- add_term:
    field: replating_coating
    id: replating_coating:grgds_peptide
    label: GRGDS peptide
    parent: null
    definition: The integrin-binding peptide Gly-Arg-Gly-Asp-Ser conjugated to or coated on a surface for cell attachment.
    scope: The RGD-containing peptide GRGDS; not the collagen-mimetic peptide GFPGER, not whole matrix proteins (fibronectin,
      laminin, vitronectin, nephronectin, collagen, gelatin) and not matrix extracts (Matrigel, Geltrex) or synthetic coatings
      (Synthemax, agarose).
    synonyms:
    - text: GRGDS
      anchor: incubated in GRGDS (Peptides International PFA-4189-v), GFPGER (Sigma-Aldrich 165044K), and nephronectin
- add_term:
    field: replating_coating
    id: replating_coating:gfpger_peptide
    label: GFPGER peptide
    parent: null
    definition: The collagen-mimetic integrin-binding peptide GFPGER conjugated to or coated on a surface for cell attachment.
    scope: The collagen-derived peptide GFPGER; not the RGD peptide GRGDS, not whole collagen or gelatin, not other matrix
      proteins and not matrix extracts or synthetic coatings.
    synonyms:
    - text: GFPGER
      anchor: incubated in GRGDS (Peptides International PFA-4189-v), GFPGER (Sigma-Aldrich 165044K), and nephronectin
- add_term:
    field: replating_coating
    id: replating_coating:nephronectin
    label: nephronectin
    parent: null
    definition: The extracellular-matrix protein nephronectin, a ligand of integrin alpha8beta1, coated or conjugated on a
      surface for cell attachment.
    scope: Purified nephronectin; not fibronectin, laminin, vitronectin or collagen, not short adhesion peptides (GRGDS, GFPGER)
      and not matrix extracts or synthetic coatings.
    synonyms:
    - text: nephronectin
      anchor: incubated in GRGDS (Peptides International PFA-4189-v), GFPGER (Sigma-Aldrich 165044K), and nephronectin
- add_synonym:
    id: preparation:live_cells
    text: intact cells
    anchor: in both intact cells (for OxPhos and glycolysis) and permeabilized cells
- add_synonym:
    id: preparation:permeabilised_cells
    text: permeabilized cells
    anchor: in both intact cells (for OxPhos and glycolysis) and permeabilized cells
- add_synonym:
    id: pacing:spontaneous
    text: spontaneous contraction
    anchor: monolayers of hiPSC-CMs on CMM (green) or control (purple) during spontaneous contraction
- add_synonym:
    id: pacing:electrical_pacing
    text: electric pace stimulation
    anchor: Schematic showing electric pace stimulation of hiPSC-CMs
- add_synonym:
    id: measurement_medium:seahorse_xf_dmem
    text: Seahorse XF Base Medium
    anchor: 'Seahorse XF Base Medium (Part # 102353-100) with addition of D-glucose (11 mM) and'
- add_synonym:
    id: measurement_medium:tyrode_solution
    text: modified Tyrode solution
    anchor: modified Tyrode solution was performed at 37C
- add_term:
    field: measurement_medium
    id: measurement_medium:respiration_buffer
    label: mitochondrial respiration buffer
    parent: null
    definition: A potassium-based buffer resembling the cytosol in which permeabilised cells or isolated mitochondria respire
      on supplied substrates.
    scope: An intracellular-like KCl buffer for permeabilised-cell or mitochondrial respiration; not a physiological bath
      for intact cells (Tyrode's, Krebs, extracellular solution, HBSS, PBS), not a commercial assay medium for intact cells
      (Seahorse XF media), not culture medium and not the activating or relaxing solutions of a myofilament rig.
- add_term:
    field: transgene
    id: transgene:redox_indicator
    label: genetically encoded redox indicator
    parent: null
    definition: An introduced gene for a fluorescent protein whose signal changes with the cell's redox state, such as the
      glutathione redox potential.
    scope: A redox-sensing reporter (roGFP family and similar); not a calcium or voltage indicator, not a fluorescent protein
      that reports no cellular variable, and not overexpressed, knockdown, recombinase, reprogramming, luciferase or optogenetic
      constructs.
    qualifiers:
      vector:
        dimension: text
      MOI:
        dimension: text
      compartment:
        dimension: text
- add_term:
    field: transgene
    id: transgene:grx1_rogfp2
    label: Grx1-roGFP2
    parent: transgene:redox_indicator
    definition: A redox-sensitive GFP fused to glutaredoxin-1 that reports the glutathione redox potential as a 405/488 nm
      excitation ratio.
    synonyms:
    - text: Grx1-roGFP2
      anchor: using a cytoplasmic Grx1-roGFP2 probe
- add_term:
    field: transgene
    id: transgene:varnam
    label: Varnam
    parent: transgene:voltage_indicator
    definition: A red-shifted rhodopsin-based genetically encoded voltage indicator.
    scope: The Varnam voltage indicator; not Archon1 or ArcLight.
    synonyms:
    - text: Varnam
      anchor: optical recording of action potential with Varnam probe
- add_synonym:
    id: disease_model:cardiac_hypertrophy
    text: pathological hypertrophy
    anchor: Schematic showing acute pathological hypertrophy model
- add_term:
    field: measure
    id: measure:topography_depth
    label: topographic feature depth
    parent: null
    dimension: length
    definition: Depth of the wrinkles, grooves or other relief features of a culture substrate's surface (qualifier feature).
    scope: Depth of a substrate's surface relief; not the period of the relief (topographic feature wavelength), not cell
      or tissue thickness and not fiber diameter.
    qualifiers:
      feature:
        dimension: text
- add_term:
    field: measure
    id: measure:topography_wavelength
    label: topographic feature wavelength
    parent: null
    dimension: length
    definition: Period (crest-to-crest spacing) of periodic relief features of a culture substrate's surface (qualifier feature).
    scope: Spacing of a substrate's periodic relief; not its depth (topographic feature depth), not sarcomere length and not
      fiber diameter.
    qualifiers:
      feature:
        dimension: text
- add_term:
    field: measure
    id: measure:surface_ligand_fraction
    label: surface ligand fraction
    parent: null
    dimension: dimensionless
    definition: Share of one bound ligand (qualifier ligand) among the components detected on a functionalised culture surface.
    scope: Composition of a coated or conjugated surface; not the fraction of cells positive for a marker and not a medium
      component concentration.
    qualifiers:
      ligand:
        dimension: text
- add_term:
    field: measure
    id: measure:transcriptomic_maturation_index
    label: transcriptomic maturation index
    parent: null
    dimension: dimensionless
    definition: Position of a sample along a transcriptomic maturation path from immature cells towards a reference (qualifier
      reference, such as adult heart), as a fraction or percentage of that path.
    scope: A position on a fitted maturation path; not a principal component score, not a correlation of profiles, not a distance
      between centroids and not a qualitative similarity judged from clustering.
    qualifiers:
      reference:
        dimension: text
- add_term:
    field: measure
    id: measure:actin_bundling
    label: F-actin bundling
    parent: null
    dimension: dimensionless
    definition: Degree to which F-actin filaments are gathered into thick bundles, scored from phalloidin images.
    scope: Bundling of actin filaments; not the amount of F-actin per area (F-actin density), not its orientational order
      and not myofibril coverage.
- add_term:
    field: measure
    id: measure:actin_density
    label: F-actin density
    parent: null
    dimension: dimensionless
    definition: Amount of F-actin per area of cell or image, read from phalloidin staining.
    scope: Amount of actin filaments; not their bundling (F-actin bundling), not their orientational order and not the area
      covered by myofibrils (myofibrillar density).
- add_term:
    field: measure
    id: measure:cell_height
    label: cell height
    parent: null
    dimension: length
    definition: Extent of cells or their cytoskeleton along the z axis above the substrate, from z-stacks.
    scope: Vertical extent of cells; not cell length, width or area in the plane, and not the thickness of an engineered tissue.
- add_term:
    field: measure
    id: measure:contractility_not_stated
    label: contractility, quantity not stated
    parent: null
    dimension: not stated
    definition: A contraction readout the source calls contractility without saying which quantity or unit it is.
    scope: Use only when the source names no quantity; not twitch force, traction stress, contractile work, shortening or
      an image-based contraction amplitude, each of which states what was measured.
- add_term:
    field: measure
    id: measure:substrate_driven_respiration
    label: substrate-driven respiration
    parent: measure:oxygen_consumption_rate
    dimension: amount_rate
    definition: Oxygen consumption rate of permeabilised cells or isolated mitochondria supplied with a stated substrate (qualifier
      substrate) in a stated respiratory state (qualifier respiratory_state, such as state 3 with ADP or state 4 without).
    scope: Respiration on a supplied substrate in a named state, in permeabilised cells; not the basal, maximal, spare, ATP-linked,
      proton-leak, non-mitochondrial or total ATP rates of intact cells, and not the time course.
    qualifiers:
      substrate:
        dimension: text
      respiratory_state:
        dimension: text
- add_term:
    field: measure
    id: measure:respiratory_control_ratio
    label: respiratory control ratio
    parent: null
    dimension: dimensionless
    definition: Ratio of state 3 (ADP-stimulated) to state 4 respiration on a stated substrate (qualifier substrate).
    scope: A ratio of two respiratory states; not either respiration rate itself and not the OCR/ECAR ratio.
    qualifiers:
      substrate:
        dimension: text
    synonyms:
    - text: respiratory control ratio
      anchor: Although respiratory control ratio (state-3 [active] respiration
- add_term:
    field: measure
    id: measure:glutathione_redox_state
    label: glutathione redox state
    parent: null
    dimension: dimensionless
    definition: Oxidation state of the glutathione pool read as the excitation ratio of a redox-sensitive GFP probe (qualifier
      probe), often scaled between fully oxidised and fully reduced controls.
    scope: Glutathione redox potential from a genetically encoded roGFP probe; not reactive oxygen species read with a ROS-sensitive
      dye, not mitochondrial membrane potential and not mitochondrial mass.
    qualifiers:
      probe:
        dimension: text
- add_qualifier:
    id: measure:mitochondrial_dna_content
    name: region
    dimension: text
- add_qualifier:
    id: measure:sarcomere_length
    name: marker
    dimension: text
- add_synonym:
    id: measure:twitch_duration
    text: Beating duration
    anchor: Beating duration and
- add_synonym:
