  F2b_specific_w1.specific_w1:
    item: F2b_specific_w1
    group: w1
    measure: specific force
    formula: sigma = F/A
    anchor: &id001
      quote: divided by the cross-sectional area of the patch (same as the one used for calculation of specific forces)
      where: Methods, Assessment of biomechanical properties
    library:
      formula: stress_def
      vars:
        sigma: sigma
        F: F
        A: A
    inputs:
      F:
        value: F2b_force_w1.values.force_w1
        part: mean
        kind: per sample
      A:
        not_stated: true
        kind: per sample
        note: The cross-sectional area is not printed, nor how it was measured.
    output: F2b_specific_w1.values.specific_w1
    aggregation: not stated
  F2b_specific_w3.specific_w3:
