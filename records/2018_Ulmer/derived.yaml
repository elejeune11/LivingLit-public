        data: f2d_acot1/g3D
        kind: per sample
      b:
        data: f2d_acot1/g2D
        kind: per sample
    aggregation: of means
    note: Fig. 2D plots EHT/2D fold changes (data extracted from A); no fold change is printed, so code rebuilds it only (derived by LivingLit).
