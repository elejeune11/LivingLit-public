mappings:
- field: cm_medium
  stated: DMEM + horse serum
  terms:
  - cm_medium:dmem
  split:
  - words: horse serum
    field: supplements
  note: Horse serum is an addition to the base medium, not a base medium.
- field: platform
  stated: EHT
  terms:
  - platform:tissue_between_pillars
  qualifiers:
    posts: elastic PDMS posts
  note: '''EHT'' itself is generic (synonym of 3D engineered tissue); this paper''s EHT is a fibrin gel between two elastic PDMS posts (''were
    embedded in a fibrin gel between elastic PDMS posts'').'
- field: platform
  stated: native tissue
  terms:
  - platform:adult_heart_tissue
  note: 'Both groups so labelled are adult human hearts: ''non-failing adult human hearts (NFH)'' (Fig. 3) and ''Adult human heart'' (Fig. 4F).'
- field: platform
  stated: no cells
  terms:
  - platform:cell_free_control
  note: Background wells without cells in the 14C-CO2 assay (Fig. 6D–F).
- field: substrate
  stated: 24-well Nunc plate
  terms:
  - substrate:culture_plate
  qualifiers:
    format: 24-well
    brand: Nunc
- field: substrate
  stated: 6-well plate
  terms:
  - substrate:culture_plate
  qualifiers:
    format: 6-well
- field: disease_model
  stated: 1× non-failing, 2× terminal heart failure
  flag:
    kind: several conditions
    note: One pooled group of one non-failing heart and two failing hearts (dilative cardiomyopathy or ischemic heart disease); not one disease
      state.
- field: preparation
  stated: live culture
  terms:
  - preparation:live_cells
  note: Measurements on living cultures (beating, medium metabolites, OCR, 14C-CO2).
- field: treatment
  stated: blebbistatin + none
  flag:
    kind: several conditions
    note: Pools control EHTs (no treatment) and blebbistatin-treated EHTs in one correlation (Fig. S7A–B).
