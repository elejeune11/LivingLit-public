  F1_peak:
    unit: F1
    measure: average contraction peak (force over time)
    method: video-optical recording of EHT contractions (figure recognition of the EHT ends)
    software: customized software (EHT Technologies setup)
    definition:
      citation: Hansen2010
      anchor:
        quote: Analysis of contractile force was performed by video-optical recording as previously described
        where: Experimental Procedures, Contractile Analysis
    finding: Average contraction peaks of spontaneously beating and paced EHTs are shown (mean ± SEM).
    groups:
    - spont
    - paced
    n:
      printed: n = 50 EHTs from seven independent experiments per group
      counts: EHTs/number of independent experiments
      per_group:
        spont: '50'
        paced: '50'
    stats:
      test: not stated
      statistic: not stated
