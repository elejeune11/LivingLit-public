      co_sham_4w: {item: F3_co_course, group: sham, unit_of_value: mL/min}
      co_tx: {item: F3_co_tx_vs_sham_4w, group: tx, unit_of_value: mL/min}
      co_sham: {item: F3_co_tx_vs_sham_4w, group: sham, unit_of_value: mL/min}
      sv_tx_pre: {item: F3_sv_course, group: tx, unit_of_value: fold increase to PreTx}
      sv_tx_2w: {item: F3_sv_course, group: tx, unit_of_value: fold increase to PreTx}
      sv_tx_4w: {item: F3_sv_course, group: tx, unit_of_value: fold increase to PreTx}
      sv_sham_pre: {item: F3_sv_course, group: sham, unit_of_value: fold increase to PreTx}
      sv_sham_2w: {item: F3_sv_course, group: sham, unit_of_value: fold increase to PreTx}
      sv_sham_4w: {item: F3_sv_course, group: sham, unit_of_value: fold increase to PreTx}
      sv_tx: {item: F3_sv_tx_vs_sham_4w, group: tx, unit_of_value: fold increase to PreTx}
      sv_sham: {item: F3_sv_tx_vs_sham_4w, group: sham, unit_of_value: fold increase to PreTx}
      lvad_tx_pre: {item: F3_lvad_course, group: tx, unit_of_value: mm2}
      lvad_tx_2w: {item: F3_lvad_course, group: tx, unit_of_value: mm2}
      lvad_tx_4w: {item: F3_lvad_course, group: tx, unit_of_value: mm2}
      lvad_sham_pre: {item: F3_lvad_course, group: sham, unit_of_value: mm2}
      lvad_sham_2w: {item: F3_lvad_course, group: sham, unit_of_value: mm2}
      lvad_sham_4w: {item: F3_lvad_course, group: sham, unit_of_value: mm2}
      lvad_tx: {item: F3_lvad_tx_vs_sham_4w, group: tx, unit_of_value: mm2}
      lvad_sham: {item: F3_lvad_tx_vs_sham_4w, group: sham, unit_of_value: mm2}
