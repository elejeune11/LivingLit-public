- {field: measurement_medium, stated: RPMI/B27 + Ins, terms: [measurement_medium:culture_medium], qualifiers: {medium: RPMI/B27 + Ins},
   note: drugs were diluted in the culture medium and the tissues imaged in it}
- {field: treatment, stated: DMSO or methanol, flag: {kind: alternatives, note: "one untreated group named with two vehicles (DMSO for isoproterenol, methanol for verapamil); which vehicle each comparison uses is not one context"}}
