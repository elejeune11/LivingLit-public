  F2bc_increase.pct_change:
    item: F2bc_increase
    formula: d = (x - x0)/x0
    anchor:
      quote: Relative to WT/WT, median volume of edited lines increased (12–51%), showing βMHC-R453C mutations cause hypertrophy
        in hPSC-CMs
      where: Results, Molecular assessment of β-MHC mutant hPSC-CMs
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: median cardiomyocyte volume of an edited line
      x0:
        not_stated: true
        kind: per sample
        note: median cardiomyocyte volume of its WT/WT isogenic control
    note: 12–51 % is a range over the eight edited lines and neither end names its line, so no output is named; medians are
      not printed
  F3b_a_mw_veh.percentage:
    item: F3b_a_mw_veh
    formula: r = a/b
    anchor: &id002
      quote: Percentage of human pluripotent stem cell-cardiomyocytes with negative, medium, or high brain natriuretic peptide
        expression were binned using predetermined thresholds
      where: Fig. 3 legend
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: per sample
        note: cardiomyocytes in the BNP bin(s)
      b:
        not_stated: true
        kind: per sample
        note: cardiomyocytes imaged (>60 000 cells per sample)
