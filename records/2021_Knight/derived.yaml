  F5B_tlin_text.diff:
    item: F5B_tlin_text
    formula: d = v - p
    anchor:
      quote: resulted in a slight (10 ms) reduction in linear-phase relaxation time as opposed to an 80-ms reduction in hiPSC-CMs
      where: Discussion
    library:
      formula: difference_from_reference
      vars:
        d: d
        x: v
        x0: p
    inputs:
      v:
        value: F5B_tlin_PE_v_VEH.values.VEH_table
        part: mean
        kind: not stated
      p:
        value: F5B_tlin_PE_v_VEH.values.PE_table
        part: mean
        kind: not stated
    output: F5B_tlin_text.values.diff_text
    note: 'a reduction: vehicle mean tLIN minus PE mean tLIN (Table S3)'
  S6C_tlin_text.diff:
    item: S6C_tlin_text
    formula: d = v - p
    anchor:
      quote: 72 h of PE treatment on AMVCMs resulted in a slight (10 ms) reduction in linear-phase relaxation time
