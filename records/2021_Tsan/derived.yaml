proposals:
- formula: part_of_whole
  kind: derived
  statement: The share of one part in a whole made of two parts is the part divided by the sum of the two parts.
  equations:
  - f = a/(a + b)
  variables:
    f: dimensionless
    a: D
    b: D
    t: D
  assumes:
  - t = a + b
  uses:
  - formula: ratio_def
    subs:
      r: f
      a: a
      b: t
  - formula: sum_of_parts
    subs:
      t: t
      a: a
      b: b
  does_not_apply: a whole with more than two parts, or parts that overlap (the denominator is then not a + b)
  tests:
  - given:
      a: 1.0
      b: 3.0
    expect:
      f: 0.25
      t: 4.0
  - given:
      a: 2.0
      b: 2.0
      t: 6.0
    does_not_apply: 'a third part of 2 in the whole: 2/6, not 2/4'
- formula: complement_fraction
  kind: derived
  statement: When a whole is split into two exclusive parts, the fraction in one part is one minus the fraction in the other.
  equations:
  - c = 1 - f
  variables:
    c: dimensionless
    f: dimensionless
    t: dimensionless
  assumes:
  - t = 1
  uses:
  - formula: sum_of_parts
    subs:
      t: t
      a: f
      b: c
  does_not_apply: more than two categories, or categories that overlap or leave a remainder
  tests:
  - given:
      f: 0.326
      t: 1.0
    expect:
      c: 0.674
  - given:
      f: 0.3
      t: 1.0
    does_not_apply: 'three categories (0.3, 0.2, 0.5): the second is 0.2, not 0.7'
- formula: relative_change_from_ratio
  kind: derived
  statement: The relative change of a value from a reference is the ratio of the value to the reference minus one.
  equations:
  - d = r - 1
  variables:
    d: dimensionless
    r: dimensionless
    x: D
    x0: D
  uses:
  - formula: relative_change
    subs:
      d: d
      x: x
      x0: x0
  - formula: ratio_def
    subs:
      r: r
      a: x
      b: x0
  does_not_apply: a ratio of means compared with a mean of per-sample changes when the reference varies, or a change on a log scale
  tests:
  - given:
      x: 6.0
      x0: 5.0
    expect:
      r: 1.2
      d: 0.2
  - given:
      r: 1.2
    does_not_apply: a log2 ratio of 1.2 is a change of 2**1.2 - 1 = 1.30, not 0.2
