figures:
  F2C:
    file: journal_version.pdf
    page: 6
    crop:
    - 420
    - 95
    - 525
    - 190
    script: figures/F2C.py
    unit: F2C
    kind: raster
    groups:
      Control (vs 10 nM):
        item: F2C_t10
        group: ctrl
        unit_of_value: MFI (axis prints no unit)
      10 nM Torin1:
        item: F2C_t10
        group: t10
        unit_of_value: MFI (axis prints no unit)
      Control (vs 200 nM):
        item: F2C_t200
        group: ctrl
        unit_of_value: MFI (axis prints no unit)
      200 nM Torin1:
        item: F2C_t200
        group: t200
        unit_of_value: MFI (axis prints no unit)
    note: Raster bars with individual points (n=3 per condition). Markers touch the bar-top and error-bar lines; thin lines
      are removed by a morphological opening. Control and 10 nM give three separate markers each; the 200 nM triangles lie
      under the error bar, its caps and the bar top and do not separate (bar only, countable false). The control points are
      returned under two labels, one per item.
  F2GH:
    file: journal_version.pdf
    page: 6
    crop:
    - 278
    - 345
    - 395
    - 425
    script: figures/F2GH.py
    unit: F2GH
    kind: raster
    groups:
      Control (DMSO):
        item: F2H_sarc
        group: ctrl
        unit_of_value: µm
      Torin1 (200 nM):
        item: F2H_sarc
        group: t200
        unit_of_value: µm
    note: Fig. 2H only (2G is images). Raster bars with individual points (legend n=13 and n=17 cells), but the markers do
      not stand alone; the Torin1 squares merge with each other and the bar-top line, and the control circles touch the error
      bar, its cap and the bar top. Bar only, countable false. The Torin1 error bar does not rise above the bar-top line,
      so no error is read for it. The manuscript copy (nihms-1549573.pdf p. 20, ~300 dpi) shows the same overlaps.
  F3C:
