id: 2018_Mosqueira
field_set: 3
source:
  title: CRISPR/Cas9 editing in human pluripotent stem cell-cardiomyocytes highlights arrhythmias, hypocontractility, and
    energy depletion as potential therapeutic targets for hypertrophic cardiomyopathy
  doi: 10.1093/eurheartj/ehy249
  year: '2018'
  first_author: Diogo Mosqueira
  last_author: Chris Denning
  lab: Denning lab, Department of Stem Cell Biology, Centre of Biomolecular Sciences, University of Nottingham
  journal: European Heart Journal
  files:
  - ehy249.pdf
  - ehy249_Supplementary_Information.docx
  - ehy249_Supplementary_Table_4.xlsx
  - ehy249_Figure_S1.tif
  - ehy249_Figure_S3.tif
  - ehy249_Figure_S4.tif
  - ehy249_Figure_S6.tif
  - ehy249_Figure_S8.tif
  - ehy249_Figure_S9.tif
  not_used:
  - file: ehy249_supp.zip
    why: the supplementary archive; its files were extracted beside the PDF and are listed individually
  - file: ehy249_Supplementary_Table_1.xlsx
    why: guide RNA sequences and predicted off-targets for MYH7 targeting; no group values
  - file: ehy249_Supplementary_Table_2.xlsx
    why: guide RNA sequences and predicted off-targets for AAVS1 targeting; no group values
  - file: ehy249_Supplementary_Table_3.xlsx
    why: primer sequences and their reactions; no group values
  - file: ehy249_Figure_S2.tif
    why: pluripotency marker micrographs, a karyogram, the differentiation protocol schema and β-MHC staining; no values
  - file: ehy249_Figure_S5.tif
    why: in silico structural models of βMHC interactions; model output, not a measurement
  - file: ehy249_Figure_S7.tif
    why: genotyping gels, sequencing and micrographs of the R-GECO1-edited lines, and representative traces; no values
  version_note: the supplementary files were delivered as ehy249_supp.zip and extracted beside the PDF so that quotes in them
    can be found; Thumbs.db was not extracted
default_context:
  species: human
  differentiation_factors:
    value: BMP4 + Activin A + KY0211 + XAV939
    anchor:
      quote: 'medium was changed by RPMI supplemented with B27 without insulin (-INS, LifeTechnologies #A1895601) and KY0211
        (R&D #4731) and XAV939 (R&D #3748), both at 100μM'
      where: Supplementary Methods, Monolayer cardiac differentiation of hPSC
      file: ehy249_Supplementary_Information.docx
    note: BMP4 and Activin A are named in the two preceding sentences of the same paragraph; one quote of 30 words cannot
      hold all four molecules. KY0211 is printed as such (KY02111 elsewhere in the field).
  hipsc_medium: Essential 8 (E8)
  hipsc_coating: Matrigel
