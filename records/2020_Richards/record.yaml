    where: Fig. 3 legend
- field: temperature
  value: 37 °C
  anchor:
    quote: NADH autofluorescence imaging of live cardiac organoids was performed in medium at 37 °C
    where: Methods, Fluorescence imaging and analysis
- field: measurement_medium
  value: calcium buffer from the Fluo-4 Direct Calcium Assay Kit
  anchor:
    quote: submersed in calcium buffer from the Fluo-4 Direct Calcium Assay Kit (Life Technologies)
    where: Methods, Development of the customized 2PLSM
- field: measurement_medium
  value: low-phosphate DMEM buffer
