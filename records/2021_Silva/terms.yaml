record: 2021_Silva
vocabulary_version: 42
agent:
  model: llm
  instructions: terms_v4
edits:
# ---------------------------------------------------------------- context
- add_synonym:
    id: preparation:intact_tissue
    text: intact spheroids
    anchor: we performed electrophysiological and structural analysis of the intact spheroids and dissociated cells
- add_synonym:
    id: hipsc_coating:gfr_matrigel
    text: GFR Matrigel
    anchor: were seeded onto GFR Matrigel-coated glass coverslips for patch-clamp recordings
- add_term:
    field: replating_coating
    id: replating_coating:gfr_matrigel
    label: growth-factor-reduced Matrigel
    parent: replating_coating:matrigel
    definition: Matrigel with reduced growth-factor content, used to coat the surface cells are replated on.
    scope: Matrigel sold with reduced growth-factor content; plain Matrigel stays on the parent term.
    synonyms:
    - text: GFR Matrigel
      anchor: were seeded onto GFR Matrigel-coated glass coverslips for patch-clamp recordings
- add_term:
    field: cm_medium
    id: cm_medium:advanced_dmem_f12
    label: Advanced DMEM/F12
    parent: cm_medium:dmem
    definition: Advanced DMEM/F12, a reduced-serum basal medium based on a 1:1 mix of DMEM and Ham's F-12.
    scope: The Advanced DMEM/F12 formulation; plain DMEM, and DMEM whose formulation is only a qualifier, stay on the parent term.
- adopt_own:
    field: cell_types
    id: cell_types:mesendoderm_progenitor
    label: mesendoderm progenitor cell
    definition: An early progenitor cell committed to the mesendoderm, before separation into mesoderm and endoderm, here from hiPSC differentiation day 5.
    scope: Early mesendoderm progenitors put into a construct before they differentiate; not differentiated non-cardiomyocyte cells (non-cardiomyocyte cells).
    lookup: "CL searched for 'mesendoderm', 'mesendodermal cell', 'mesendoderm progenitor' and 'primitive streak': no class; CL has only mesodermal cell (CL:0000222) and endodermal cell (CL:0000223), each narrower than mesendoderm."
    synonyms:
    - text: mesendoderm progenitor cells
      anchor: Mesendoderm progenitor cells were dissociated at differentiation day 5 with Accutase
- set_scope:
    id: cell_types:non_cardiomyocyte
    scope: Differentiated cells other than cardiomyocytes; not early progenitors put into a construct before they differentiate (mesendoderm progenitor cell).
# ---------------------------------------------------------------- measures
- add_synonym:
    id: measure:maximum_diastolic_potential
    text: MDP
    anchor: MDP, peak, amplitude, frequency, and dV/dTMax
- add_qualifier:
    id: measure:tissue_volume
    name: portion
    dimension: text
- add_qualifier:
    id: measure:calcium_transient_decay_rate
    name: statistic
    dimension: text
- add_term:
    field: measure
    id: measure:cell_type_proportion
    label: proportion of cells assigned to a cell type
    definition: Share of all cells of a sample assigned to a stated cell type (qualifier cell_type) by clustering or classification of single-cell data.
    scope: Share of all cells assigned to one type by a classification; not a fraction positive for a stated marker (marker-positive cells) and not the share of cardiomyocytes in each electrophysiological subtype (proportion of cardiomyocyte subtypes).
    dimension: dimensionless
    qualifiers:
      cell_type: {dimension: text}
- add_term:
    field: measure
    id: measure:classifier_prediction_probability
    label: classifier prediction probability
    definition: Probability a trained cell-type classifier gives to the cell type it assigns, averaged over the cells assigned to a stated type (qualifier cell_type).
    scope: Confidence of a classification; not the share of cells assigned to a type (proportion of cells assigned to a cell type).
    dimension: dimensionless
    qualifiers:
      cell_type: {dimension: text}
- add_term:
    field: measure
    id: measure:calcium_transient_frequency
    label: calcium transient frequency
    definition: Number of calcium transients per unit time.
    scope: Rate of calcium transients, including in non-contracting or non-cardiomyocyte cells; not the contraction frequency (beat rate) and not a calcium transient time.
    dimension: frequency
- add_term:
    field: measure
    id: measure:action_potential_frequency
    label: action potential frequency
    parent: measure:action_potential
    definition: Number of spontaneous action potentials per unit time in a patch-clamped cell.
    scope: Firing rate of one cell's action potentials; not a contraction frequency of a tissue, and not the waveform's amplitude, duration, peak, rise time, upstroke velocity or a ratio of durations.
    dimension: frequency
- add_term:
    field: measure
    id: measure:contraction_displacement
    label: contraction displacement
    parent: measure:contraction_motion_amplitude
    definition: Distance a tissue or a region of it moves during one contraction, read from images in length units.
    scope: Contractile motion as a distance in length units; motion metrics without length units stay on the parent term.
    dimension: length
- add_term:
    field: measure
    id: measure:beating_construct_fraction
    label: fraction of constructs beating
    parent: measure:beating_presence
    definition: Share of tissues, spheroids or organoids that beat or show calcium activity, spontaneously or in a stated mode (qualifier mode).
    scope: A share of constructs that beat; whether one construct beats stays on the parent term.
    dimension: dimensionless
    qualifiers:
      mode: {dimension: text}
- add_term:
    field: measure
    id: measure:cell_perimeter
    label: cell perimeter
    definition: Length of the outline of one cell in an image.
    scope: Length of a single cell's outline; not cell area, circularity, aspect ratio, cell length or width.
    dimension: length
    qualifiers:
      cell_type: {dimension: text}
- add_term:
    field: measure
    id: measure:transcriptome_distance
    label: distance between transcriptome profiles
    definition: Distance between samples' whole-transcriptome profiles in a low-dimensional embedding such as multidimensional scaling.
    scope: A distance between profiles in an embedding other than principal components; not a correlation coefficient of profiles (correlation of expression profiles) and not a distance between PCA centroids.
    dimension: dimensionless
# ---------------------------------------------------------------- standing keys
- standing_key:
    measure: measure:cell_type_proportion
    value: {must_match: [platform@1, preparation, measure.cell_type, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.cell_type], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:classifier_prediction_probability
    value: {must_match: [method, measure.cell_type, preparation, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.cell_type], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:calcium_transient_frequency
    value: {must_match: [platform@1, preparation, pacing, temperature, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, pacing], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:action_potential_frequency
    value: {must_match: [platform@1, preparation, pacing, temperature, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, pacing], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:contraction_displacement
    value: {must_match: [platform@1, preparation, pacing, temperature, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:beating_construct_fraction
    value: {must_match: [platform@1, preparation, measure.mode, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.mode], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:cell_perimeter
    value: {must_match: [platform@1, preparation, measure.cell_type, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:transcriptome_distance
    value: {must_match: [method, preparation, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
mappings:
# ---------------------------------------------------------------- context
- field: cell_line
  stated: GCaMP-WTC11
  terms: [CVCL_Y803]
  no_ontology_term: the GCaMP6f-modified WTC11 subclone from the Conklin laboratory; no Cellosaurus entry found (searched 'GCaMP', 'GCaMP WTC11', 'WTC-GCaMP'; CVCL_E6IL is a different WTC11 GCaMP6 clone)
  note: mapped to the parental line WTC11; the GCaMP6f reporter is in transgene
- field: dissociation_reagent
  stated: 0.25% Trypsin
  terms: [dissociation_reagent:trypsin]
  qualifiers: {concentration: 0.25%}
- field: supplements
  stated: B27 supplement minus insulin
  terms: [supplements:b27]
  qualifiers: {insulin: minus insulin}
- field: preparation
  stated: lysed with Trizol
  terms: [preparation:rna_extract]
  note: "Methods: cells 'were lysed with Trizol (Ambion) and RNA was extracted using the Direct-zol Miniprep kit' for bulk RNA-seq; the measured material is purified RNA"
