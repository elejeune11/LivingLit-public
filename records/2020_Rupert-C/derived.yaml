record: 2020_Rupert-C
formula_library_version: 32
agent:
  model: llm
  instructions: formulas_v3
derived:
  # ---------------------------------------------------------------- cross-sectional area (ellipse, height = width/2)
  ST2_csa_all.csa:
    item: ST2_csa_all
    measure: cross-sectional area
    formula: A = pi*w**2/8
    anchor:
      quote: CSA was calculated under the assumptions that tissue height was half the width and cross-sectional shape was an ellipse
      where: Methods 2.6
    library:
      formula: ellipse_area_half_width
      vars: {A: A, w: w}
    inputs:
      w: {not_stated: true, kind: per sample, note: "tissue width at relaxed length; not printed"}
    note: pi*w*(w/2)/4, an ellipse with full axes w and w/2; widths are not printed, so the printed mean CSAs cannot be rebuilt.
  ST4_csa_all.csa:
    item: ST4_csa_all
    measure: cross-sectional area
    formula: A = pi*w**2/8
    anchor:
      quote: CSA was calculated under the assumptions that tissue height was half the width and cross-sectional shape was an ellipse
      where: Methods 2.6
    library:
      formula: ellipse_area_half_width
      vars: {A: A, w: w}
    inputs:
      w: {not_stated: true, kind: per sample, note: "tissue width at relaxed length; not printed"}
  # ---------------------------------------------------------------- active stress = twitch force / CSA
  ST2_stress_all.stress:
    item: ST2_stress_all
    measure: maximum active stress
    formula: sigma = F/A
    anchor:
      quote: was calculated by averaging the active twitch force of 10 contractions and normalizing by the cross-sectional area (CSA)
      where: Methods 2.6
    library:
      formula: stress_def
      vars: {sigma: sigma, F: F, A: A}
    inputs:
      F: {not_stated: true, kind: per sample, note: "mean active twitch force of 10 contractions at 130% Lo, 1 Hz; not printed"}
      A: {derived: ST2_csa_all.csa, kind: per sample}
    aggregation: not stated
    note: CSA is measured at relaxed length (Fig. 3a legend) while force is measured at the final length (130% Lo).
  ST4_stress_all.stress:
    item: ST4_stress_all
    measure: maximum active stress
    formula: sigma = F/A
    anchor:
      quote: was calculated by averaging the active twitch force of 10 contractions and normalizing by the cross-sectional area (CSA)
      where: Methods 2.6
    library:
      formula: stress_def
      vars: {sigma: sigma, F: F, A: A}
    inputs:
      F: {not_stated: true, kind: per sample, note: "mean active twitch force of 10 contractions; not printed"}
      A: {derived: ST4_csa_all.csa, kind: per sample}
    aggregation: not stated
  ST3_stress_all.stress:
    item: ST3_stress_all
    measure: active stress
    formula: sigma = F/A
    anchor:
      quote: Active stress, the contractile force produced during twitch contractions normalized by cross-sectional area
      where: Results 3.3
    library:
      formula: stress_def
      vars: {sigma: sigma, F: F, A: A}
    inputs:
      F: {not_stated: true, kind: per sample, note: "force amplitude at each pacing frequency of the ramp; not printed"}
      A: {derived: ST2_csa_all.csa, kind: per sample, note: "same tissues as Table S2 (assumed; not stated)"}
    aggregation: not stated
  ST5_stress_all.stress:
    item: ST5_stress_all
    measure: active stress
    formula: sigma = F/A
    anchor:
      quote: Active stress, the contractile force produced during twitch contractions normalized by cross-sectional area
      where: Results 3.3
    library:
      formula: stress_def
      vars: {sigma: sigma, F: F, A: A}
    inputs:
      F: {not_stated: true, kind: per sample, note: "force amplitude at each pacing frequency of the ramp; not printed"}
      A: {derived: ST4_csa_all.csa, kind: per sample, note: "same tissues as Table S4 (assumed; not stated)"}
    aggregation: not stated
  # ---------------------------------------------------------------- passive stress and Young's modulus
  ST2_mod_all.passive_stress:
    item: ST2_mod_all
    measure: passive stress
    formula: sigma_p = Fp/A
    anchor:
      quote: was calculated by normalizing the passive (baseline) force produced at each step by the CSA
      where: Methods 2.6
    library:
      formula: stress_def
      vars: {sigma: sigma_p, F: Fp, A: A}
    inputs:
      Fp: {not_stated: true, kind: per sample, note: "passive (baseline) force at each 5% stretch step; not printed"}
      A: {derived: ST2_csa_all.csa, kind: per sample, note: "one CSA (relaxed length) for every step"}
  ST2_mod_all.modulus:
    item: ST2_mod_all
    measure: Young's modulus
    formula: E = sigma_p/eps
    anchor:
      quote: as the slope of the line of best fit of passive stress versus strain at 5–30% strain
      where: Methods 2.6
    library:
      formula: linear_elastic_stress_strain
      vars: {sigma: sigma_p, E: E, eps: eps}
    inputs:
      sigma_p: {derived: ST2_mod_all.passive_stress, kind: per sample}
      eps: {not_stated: true, kind: per sample, note: "strain of each step, 5–30% (steps of 5% from Lo)"}
    aggregation: not stated
    note: E is the least-squares slope of sigma_p on eps over 5–30% strain (an intercept is not stated); written as the linear-elastic relation it estimates.
  ST4_mod_all.passive_stress:
    item: ST4_mod_all
    measure: passive stress
    formula: sigma_p = Fp/A
    anchor:
      quote: was calculated by normalizing the passive (baseline) force produced at each step by the CSA
      where: Methods 2.6
    library:
      formula: stress_def
      vars: {sigma: sigma_p, F: Fp, A: A}
    inputs:
      Fp: {not_stated: true, kind: per sample, note: "passive (baseline) force at each 5% stretch step; not printed"}
      A: {derived: ST4_csa_all.csa, kind: per sample}
  ST4_mod_all.modulus:
    item: ST4_mod_all
    measure: Young's modulus
    formula: E = sigma_p/eps
    anchor:
      quote: as the slope of the line of best fit of passive stress versus strain at 5–30% strain
      where: Methods 2.6
    library:
      formula: linear_elastic_stress_strain
      vars: {sigma: sigma_p, E: E, eps: eps}
    inputs:
      sigma_p: {derived: ST4_mod_all.passive_stress, kind: per sample}
      eps: {not_stated: true, kind: per sample, note: "strain of each step, 5–30%"}
    aggregation: not stated
  # ---------------------------------------------------------------- fold changes and % decreases built from table means
  ST2_mod_all.fold_h5_C:
    item: ST2_mod_all
    measure: Young's modulus fold change
    formula: r = E_h5/E_C
    anchor:
      quote: by 3.7-fold with 5% hCFs
      where: Results 3.3
    library:
      formula: ratio_def
      vars: {r: r, a: E_h5, b: E_C}
    inputs:
      E_h5: {value: ST2_mod_all.values.mean_h5_table, part: mean, kind: constant}
      E_C: {value: ST2_mod_all.values.mean_C_table, part: mean, kind: constant}
    output: ST2_mod_all.values.fold_h5_C_text
    output_unit: fold
    aggregation: of means
    alternatives:
      - label: increase over control, (ratio - 1)
        formula: d = (E_h5 - E_C)/E_C
  ST2_mod_all.fold_h10_C:
    item: ST2_mod_all
    measure: Young's modulus fold change
    formula: r = E_h10/E_C
    anchor:
      quote: 5.2-fold with 10% hCFs
      where: Results 3.3
    library:
      formula: ratio_def
      vars: {r: r, a: E_h10, b: E_C}
    inputs:
      E_h10: {value: ST2_mod_all.values.mean_h10_table, part: mean, kind: constant}
      E_C: {value: ST2_mod_all.values.mean_C_table, part: mean, kind: constant}
    output: ST2_mod_all.values.fold_h10_C_text
    output_unit: fold
    aggregation: of means
    alternatives:
      - label: increase over control, (ratio - 1)
        formula: d = (E_h10 - E_C)/E_C
  ST2_mod_h15_vs_C.fold:
    item: ST2_mod_h15_vs_C
    measure: Young's modulus fold change
    formula: r = E_h15/E_C
    anchor:
      quote: significantly by 9.1-fold with 15% hCFs
      where: Results 3.3
    library:
      formula: ratio_def
      vars: {r: r, a: E_h15, b: E_C}
    inputs:
      E_h15: {value: ST2_mod_h15_vs_C.values.mean_h15_table, part: mean, kind: constant}
      E_C: {value: ST2_mod_h15_vs_C.values.mean_C_table, part: mean, kind: constant}
    output: ST2_mod_h15_vs_C.values.fold_h15_C_text
    output_unit: fold
    aggregation: of means
    alternatives:
      - label: increase over control, (ratio - 1)
        formula: d = (E_h15 - E_C)/E_C
  ST5_stress_p4_1Hz_vs_C_1Hz.fold:
    item: ST5_stress_p4_1Hz_vs_C_1Hz
    measure: active stress fold change
    formula: r = s_p4/s_C
    anchor:
      quote: p4 hCF tissues produced significantly more force (by 1.6-fold) over control tissues between 1 and 2.5 Hz
      where: Results 3.5
    library:
      formula: ratio_def
      vars: {r: r, a: s_p4, b: s_C}
    inputs:
      s_p4: {value: ST5_stress_p4_1Hz_vs_C_1Hz.values.mean_p4_1Hz_table, part: mean, kind: constant}
      s_C: {value: ST5_stress_p4_1Hz_vs_C_1Hz.values.mean_C_1Hz_table, part: mean, kind: constant}
    output: ST5_stress_p4_1Hz_vs_C_1Hz.values.fold_p4_C_text
    output_unit: fold
    aggregation: of means
    note: The fold is printed once for 1–2.5 Hz; checked here against the 1 Hz means only.
  ST2_csa_all.decrease_h5:
    item: ST2_csa_all
    measure: cross-sectional area percent decrease
    formula: s = (A_C - A_h5)/A_C
    anchor:
      quote: resulting in a 25% to 63% decrease in cross-sectional area
      where: Results 3.2
    library:
      formula: relative_decrease
      vars: {s: s, x0: A_C, x: A_h5}
    inputs:
      A_C: {value: ST2_csa_all.values.mean_C_table, part: mean, kind: constant}
      A_h5: {value: ST2_csa_all.values.mean_h5_table, part: mean, kind: constant}
    output: ST2_csa_all.values.decrease_lo_text
    output_unit: '%'
    aggregation: of means
    note: The range is printed over 5–15% hCFs without naming groups; the low end is taken as 5% hCFs (the smallest decrease in Table S2).
  ST2_csa_all.decrease_h15:
    item: ST2_csa_all
    measure: cross-sectional area percent decrease
    formula: s = (A_C - A_h15)/A_C
    anchor:
      quote: resulting in a 25% to 63% decrease in cross-sectional area
      where: Results 3.2
    library:
      formula: relative_decrease
      vars: {s: s, x0: A_C, x: A_h15}
    inputs:
      A_C: {value: ST2_csa_all.values.mean_C_table, part: mean, kind: constant}
      A_h15: {value: ST2_csa_all.values.mean_h15_table, part: mean, kind: constant}
    output: ST2_csa_all.values.decrease_hi_text
    output_unit: '%'
    aggregation: of means
    note: The high end is taken as 15% hCFs (the largest decrease in Table S2).
  # ---------------------------------------------------------------- fold changes whose inputs are only drawn as bars
  F1ab_asma_paa_vs_glass.fold:
    item: F1ab_asma_paa_vs_glass
    measure: αSMA/vimentin fold change
    formula: r = I_paa/I_glass
    anchor:
      quote: Expression of αSMA normalized by vimentin was 0.5-fold less in hCFs cultured on polyacrylamide gels
      where: Results 3.1
    library:
      formula: ratio_def
      vars: {r: r, a: I_paa, b: I_glass}
    inputs:
      I_paa: {not_stated: true, kind: per sample, note: "αSMA/vimentin intensity on gels; drawn as a bar in Fig. 1b, not read"}
      I_glass: {not_stated: true, kind: per sample, note: "αSMA/vimentin intensity on glass; drawn as a bar in Fig. 1b, not read"}
    output: F1ab_asma_paa_vs_glass.values.ratio_paa_glass_text
    output_unit: fold
    aggregation: not stated
    alternatives:
      - label: decrease relative to glass
        formula: s = (I_glass - I_paa)/I_glass
    note: Each intensity is itself αSMA divided by vimentin (per cell or field; not stated).
  F1cd_asma_tgf_vs_ctrl.fold:
    item: F1cd_asma_tgf_vs_ctrl
    measure: αSMA/vimentin fold change
    formula: r = I_tgf/I_ctrl
    anchor:
      quote: had a 1.2-fold increase in normalized αSMA fluorescence compared to control
      where: Results 3.1
    library:
      formula: ratio_def
      vars: {r: r, a: I_tgf, b: I_ctrl}
    inputs:
      I_tgf: {not_stated: true, kind: per sample, note: "drawn as a bar in Fig. 1d, not read"}
      I_ctrl: {not_stated: true, kind: per sample, note: "drawn as a bar in Fig. 1d, not read"}
    output: F1cd_asma_tgf_vs_ctrl.values.ratio_tgf_ctrl_text
    output_unit: fold
    aggregation: not stated
    alternatives:
      - label: increase over control, (ratio - 1)
        formula: d = (I_tgf - I_ctrl)/I_ctrl
  F1ef_asma_p9_vs_p4.fold:
    item: F1ef_asma_p9_vs_p4
    measure: αSMA/vimentin fold change
    formula: r = I_p9/I_p4
    anchor:
      quote: passage 9 hCFs showed a 1.3-fold increase in αSMA
      where: Results 3.1
    library:
      formula: ratio_def
      vars: {r: r, a: I_p9, b: I_p4}
    inputs:
      I_p9: {not_stated: true, kind: per sample, note: "drawn as a bar in Fig. 1f, not read"}
      I_p4: {not_stated: true, kind: per sample, note: "drawn as a bar in Fig. 1f, not read"}
    output: F1ef_asma_p9_vs_p4.values.ratio_p9_p4_text
    output_unit: fold
    aggregation: not stated
    alternatives:
      - label: increase over p4, (ratio - 1)
        formula: d = (I_p9 - I_p4)/I_p4
  S1A_acta2_p9_vs_p4.fold:
    item: S1A_acta2_p9_vs_p4
    measure: ACTA2 relative expression
    formula: r = 2**(-ddct)
    anchor:
      quote: the relative expression compared to control was calculated for genes of interest using the 2−ΔΔCt method [33]
      where: Methods 2.4
    library:
      formula: ddct_relative_expression
      vars: {r: r, ddct: ddct}
    inputs:
      ddct: {not_stated: true, kind: per sample, note: "ΔΔCt of ACTA2 (HPRT reference, p4 hCFs as calibrator); not printed"}
    output: S1A_acta2_p9_vs_p4.values.fold_p9_p4_text
    output_unit: fold
    aggregation: not stated
  S1A_gja1_p9_vs_p4.fold:
    item: S1A_gja1_p9_vs_p4
    measure: GJA1 relative expression
    formula: r = 2**(-ddct)
    anchor:
      quote: the relative expression compared to control was calculated for genes of interest using the 2−ΔΔCt method [33]
      where: Methods 2.4
    library:
      formula: ddct_relative_expression
      vars: {r: r, ddct: ddct}
    inputs:
      ddct: {not_stated: true, kind: per sample, note: "ΔΔCt of GJA1 (HPRT reference, p4 hCFs as calibrator); not printed"}
    output: S1A_gja1_p9_vs_p4.values.fold_p9_p4_text
    output_unit: fold
    aggregation: not stated
  # ---------------------------------------------------------------- conduction velocity, alternans amplitude, normalised stress
  F4cj_cv_h5.cv:
    item: F4cj_cv_h5
    measure: conduction velocity
    formula: v = d/(t2 - t1)
    anchor:
      quote: Space-time plot of action potential propagation
      where: Fig. 4 legend (f)
    library:
      formula: conduction_velocity_def
      vars: {v: v, d: d, t2: t2, t1: t1}
    inputs:
      d: {not_stated: true, kind: per sample, note: "propagation distance on the space-time plot; not printed"}
      t1: {not_stated: true, kind: per sample, note: "activation time (dF/dt) at the first site"}
      t2: {not_stated: true, kind: per sample, note: "activation time at the second site"}
    output: F4cj_cv_h5.values.cv_h5_legend
    note: One example tissue; activation maps 'as previously described [36]'.
  F4cj_cv_h15.cv:
    item: F4cj_cv_h15
    measure: conduction velocity
    formula: v = d/(t2 - t1)
    anchor:
      quote: Space-time plot of action potential propagation
      where: Fig. 4 legend (j)
    library:
      formula: conduction_velocity_def
      vars: {v: v, d: d, t2: t2, t1: t1}
    inputs:
      d: {not_stated: true, kind: per sample}
      t1: {not_stated: true, kind: per sample}
      t2: {not_stated: true, kind: per sample}
    output: F4cj_cv_h15.values.cv_h15_legend
  F5d_alt_amp_all.alternans:
    item: F5d_alt_amp_all
    measure: alternans amplitude
    formula: a = (F_full - F_part)/F_full
    anchor:
      quote: the fraction of full-force contractions was calculated
      where: Fig. 5 legend (d)
    library:
      formula: relative_decrease
      vars: {s: a, x0: F_full, x: F_part}
    inputs:
      F_full: {not_stated: true, kind: per sample, note: "amplitude of the full-force contraction"}
      F_part: {not_stated: true, kind: per sample, note: "amplitude of the alternating partial-force contraction"}
    alternatives:
      - label: partial-force contraction as a fraction of full force
        formula: a = F_part/F_full
    note: Fig. 5a marks alternans as the difference in force amplitude between alternating contractions; Fig. 5d's axis is 'Alternans (% of maximum force)'. No values printed.
  F6e_stress_vs_purity.normalised:
    item: F6e_stress_vs_purity
    measure: contractile stress normalized to control
    formula: r = sigma/sigma_C
    anchor:
      quote: Maximum active stress of tissues was normalized to control
      where: Results 3.4
    library:
      formula: ratio_def
      vars: {r: r, a: sigma, b: sigma_C}
    inputs:
      sigma: {item: ST4_stress_all, kind: per sample}
      sigma_C: {not_stated: true, kind: not stated, note: "which control value (per-experiment control mean or overall) is not stated"}
    aggregation: not stated
assumptions:
  ST2_csa_all.csa:
    model: ellipse_area_half_width
    assumptions:
      elliptical cross-section:
        reported: {shape: cross-sectional shape was an ellipse}
      h = w/2:
        reported: {height: tissue height was half the width}
      width and thickness are the full axes of the ellipse:
        reported: not stated
      uniform cross-section along the length:
        reported: not stated
  ST4_csa_all.csa:
    model: ellipse_area_half_width
    assumptions:
      elliptical cross-section:
        reported: {shape: cross-sectional shape was an ellipse}
      h = w/2:
        reported: {height: tissue height was half the width}
      width and thickness are the full axes of the ellipse:
        reported: not stated
      uniform cross-section along the length:
        reported: not stated
  ST2_mod_all.modulus:
    model: linear_elastic_stress_strain
    assumptions:
      linear elastic material:
        reported: not stated
      small strain:
        reported: {strain_range: passive stress versus strain at 5–30% strain}
  ST4_mod_all.modulus:
    model: linear_elastic_stress_strain
    assumptions:
      linear elastic material:
        reported: not stated
      small strain:
        reported: {strain_range: passive stress versus strain at 5–30% strain}
  S1A_acta2_p9_vs_p4.fold:
    model: ddct_relative_expression
    assumptions:
      amplification efficiency near 100 %:
        reported: not stated
      equal amplification efficiencies of target and reference:
        reported: not stated
  S1A_gja1_p9_vs_p4.fold:
    model: ddct_relative_expression
    assumptions:
      amplification efficiency near 100 %:
        reported: not stated
      equal amplification efficiencies of target and reference:
        reported: not stated
bounds:
  - {item: ST2_csa_all, value: ST2_csa_all.values.decrease_lo_text, formula: fraction_bounds}
  - {item: ST2_csa_all, value: ST2_csa_all.values.decrease_hi_text, formula: fraction_bounds}
  - {item: TXT1_asma_single_positive, value: TXT1_asma_single_positive.values.asma_pos_text, formula: fraction_bounds}
proposals:
  - formula: ellipse_area_half_width
    kind: derived
    statement: The cross-sectional area of a specimen whose section is taken as an ellipse of full width w and height half
      the width (h = w/2) is A = pi*w**2/8.
    equations:
      - A = pi*w**2/8
    variables: {A: area, w: length, h: length}
    assumes:
      - h = w/2
    uses:
      - formula: elliptical_cross_section_area
        subs: {A: A, a: w, b: h}
    does_not_apply: a measured thickness other than half the width, a rectangular or irregular section, or w given as a semi-axis
    tests:
      - given: {w: 2.0}
        expect: {A: 1.5707963}
      - given: {w: 1.0}
        expect: {A: 0.39269908}
      - given: {w: 2.0}
        does_not_apply: an ellipse 2 wide and 1.5 thick has area 2.356, not pi/2
