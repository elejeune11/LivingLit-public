  - event: adopt_own
    field: treatment
    id: treatment:sirna_control
    label: control siRNA
    definition: A non-targeting small interfering RNA used as the control for siRNA knockdowns.
    scope: The non-targeting control of an siRNA experiment; not a targeting siRNA and not a scrambled miRNA control.
    lookup: 'chebi ''siRNA'', ''small interfering RNA'': no term'
    synonyms:
    - text: siControl
      anchor: MM-cultured cells significantly increased CTD after siSERCA2a compared with siControl (siCtr)
  - event: add_synonym
    id: measure:contraction_frequency
    text: spontaneous beat rate
    anchor: while spontaneous beat rate was significantly lower in MM culture
  - event: add_synonym
    id: measure:resting_membrane_potential
    text: diastolic membrane potential
    anchor: Correlation and individual distribution of cell capacitance, IK1 magnitude, diastolic membrane potential and upstroke
      velocity
  - event: add_synonym
    id: measure:upstroke_velocity
    text: AP upstroke velocity
    anchor: a rapid AP upstroke velocity (dV/dtmax of 250
  - event: add_synonym
    id: measure:resting_calcium_signal
    text: diastolic calcium
    anchor: Diastolic calcium was significantly increased in MM
  - event: add_qualifier
    id: measure:current_density
    name: test_potential
    dimension: voltage
  - event: add_term
    field: measure
    id: measure:glycolytic_capacity
    label: glycolytic capacity
    parent: measure:extracellular_acidification_rate
    dimension: rate
    definition: Extracellular acidification rate after ATP synthase is blocked with oligomycin, the maximal glycolytic rate.
    scope: Acidification after oligomycin; basal acidification stays on the parent term.
    synonyms:
    - text: glycolytic capacity
      anchor: Maturation conditions induced the glycolytic capacity of cells
  - event: add_term
    field: measure
    id: measure:atp_linked_respiration
    label: ATP-linked oxygen consumption rate
    parent: measure:oxygen_consumption_rate
    dimension: amount_rate
    definition: The part of the oxygen consumption rate that oligomycin removes, the respiration coupled to ATP synthesis.
    scope: Oligomycin-sensitive respiration; not maximal (uncoupled) respiration and not spare capacity; ATP amounts from
      substrate use are ATP production.
  - event: add_term
    field: measure
    id: measure:cell_capacitance
    label: cell capacitance
    dimension: capacitance
    definition: Membrane capacitance of a single cell measured by patch clamp, a proxy for membrane area.
    scope: Electrical membrane capacitance; not cell area from images and not a current normalised to it (current density).
    synonyms:
    - text: cell capacitance
      anchor: Cell capacitance was 56.8 ± 3.1 pF
  - event: add_term
    field: measure
    id: measure:calcium_transient_duration
    label: calcium transient duration
    dimension: time
    definition: Duration of the calcium transient between its upstroke and a stated level of decay (qualifier level).
    scope: Duration of the whole transient at a stated level; not the time from peak to a level of decay (decay time), not
      the full width at half maximum read alone (FWHM), and not the rise time.
    synonyms:
    - text: Ca2+ transient duration
      anchor: enhanced thapsigargin sensitivity on Ca2+ transient duration (CTD) of MM cultured cells
  - event: add_term
    field: measure
    id: measure:non_serca_decay_constant
    label: non-SERCA calcium removal time constant
    parent: measure:calcium_transient_decay_constant
    dimension: time
    definition: Time constant of the decay of a caffeine-evoked calcium transient, when SERCA cannot take calcium back into
      the SR, a readout of removal by non-SERCA routes.
    scope: Decay of the caffeine transient; decay of electrically evoked transients stays on the parent term.
    synonyms:
    - text: non-SERCA mediated tau
      anchor: no difference was observed in non-SERCA mediated Tau and SR load
  - event: add_term
    field: measure
    id: measure:intracellular_tension
    label: intracellular tension
    dimension: force_per_length
    definition: Tension carried within a contracting cell layer, computed from the traction it exerts on a soft substrate,
      in force per length.
    scope: Tension within the cell layer in force per length; not traction stress on the substrate (force per area) and not
      twitch force of a tissue.
    synonyms:
    - text: intracellular tension
      anchor: Under MM conditions, intracellular tension was significantly increased
  - event: add_term
    field: measure
    id: measure:max_tension_rise_rate
    label: maximal rate of tension rise
    parent: measure:max_force_rise_rate
    dimension: force_per_length_rate
    definition: Maximal rate of rise of a cell layer's intracellular tension during contraction, in force per length per time.
    scope: Rate of rise of a tension in force per length; rates of force rise of tissues in force per time stay on the parent
      term.
  - event: add_term
    field: measure
    id: measure:max_tension_decay_rate
    label: maximal rate of tension decline
    parent: measure:max_force_decay_rate
    dimension: force_per_length_rate
    definition: Maximal rate of decline of a cell layer's intracellular tension during relaxation, in force per length per
      time.
    scope: Rate of decline of a tension in force per length; rates of force decline of tissues in force per time stay on the
      parent term.
  - event: add_term
    field: measure
    id: measure:contraction_motion_amplitude
    label: image-based contraction amplitude
    dimension: dimensionless
    definition: Peak amplitude of contractile motion of cells computed from image sequences by a stated motion metric (qualifier
      metric).
    scope: An image-derived motion metric of cells in culture; not force, not tissue shortening as a fraction of length, and
      not structure displacement in length units.
    qualifiers:
      metric:
        dimension: text
  - event: add_term
    field: measure
    id: measure:maximal_conductance
    label: maximal ionic conductance
    dimension: conductance
    definition: Conductance of a stated ionic current (qualifier current) at maximal activation, from a fit of its current-voltage
      relation.
    scope: A fitted conductance; not the current density at a test potential.
    qualifiers:
      current:
        dimension: text
  - event: add_term
    field: measure
    id: measure:spent_medium_concentration
    label: component concentration in conditioned medium
    dimension: concentration
    definition: Concentration of a stated component (qualifier component) measured in culture medium that has been on the
      cells for a stated time.
    scope: A concentration measured in medium after culture with cells; not a medium's formulation (medium component concentration),
      and not a change over an interval (glucose consumption, lactate production).
    qualifiers:
      component:
        dimension: text
  - event: add_term
    field: measure
    id: measure:fatty_acid_uptake
    label: fatty acid uptake
    dimension: dimensionless
    definition: Uptake of a labelled fatty acid by cells, read as the rise of its signal in the cells over time.
    scope: Fatty acid taken up into cells; not fatty acid oxidation.
    synonyms:
    - text: fatty acid uptake
      anchor: hiPSC-CMs maintained in MM showed a higher fatty acid uptake capacity
  - event: add_term
    field: measure
    id: measure:pacing_entrainment
    label: entrainment to pacing
    dimension: dimensionless
    definition: Whether cells' transients or contractions follow each stimulus at the stated pacing frequency, or the share
      of cells or wells that do.
    scope: One-to-one following at one stated frequency; not the highest frequency still followed (maximum capture rate).
