evidence:
  F1b_force:
    unit: F1b
    measure: normalized force of contraction against output cardiomyocyte percentage
    method: isometric force; output cardiomyocyte percentage as actinin+ cells
    finding: Maximal contractile force at a cardiomyocyte:non-myocyte composition of about 1:1 in all three lines.
    groups:
    - hes2rfp
    - hes2
    - hipsbj
    values:
      optimum_text:
        printed: '1:1'
        unit: cardiomyocyte:non-myocyte
        kind: ratio
        over:
        - hes2rfp
        - hes2
        - hipsbj
        spread: not stated
    anchor:
      quote: Force of contraction (FOC; normalized to maximal FOC) in relation to output cardiomyocyte percentage (actinin+
        cells) of EHM made from HES2-RFP, HES2, and hiPS-BJ lines
      where: Fig. 1b legend
    note: 'Grey area: optimal cardiomyocyte percentage (mean±SD) drawn only; the 1:1 composition is from the Results text
      ("composition of 1:1 at the time of force assessment developed maximal contractile forces").'
  F1c_purity:
    unit: F1c
    measure: cardiomyocyte purity (actinin+ cells)
    method: actinin+ cells
    finding: Cardiomyocyte purity is higher after metabolic selection.
    compares:
    - after
    - before
    n:
      printed: n=8
      counts: differentiation cultures (paired before/after)
    stats:
      test: two-tailed, paired Students t-test
      p: p<0.05
    anchor:
      quote: Quantification of cardiomyocyte purity (actinin+ cells) before and after enrichment by metabolic selection
      where: Fig. 1c legend
  F1d_condense:
    unit: F1d
    measure: EHM condensation
    method: macroscopic appearance
    finding: EHM from enriched cardiomyocytes alone did not condense; EHM with HFF did.
    compares:
    - cm_hff
    - cm_ehm
    anchor:
      quote: EHM constructed directly from enriched cardiomyocyte populations did not condense and contained mostly rounded
        cardiomyocytes
      where: Results, cell composition
    stated_direction:
      direction: up
      anchor:
        quote: EHM constructed directly from enriched cardiomyocyte populations did not condense and contained mostly rounded
          cardiomyocytes
        where: Results, cell composition
  F1d_rounded:
    unit: F1d
    measure: rounded cardiomyocytes
    method: immunostaining for actinin, f-actin and nuclei
    finding: EHM from enriched cardiomyocytes alone contained mostly rounded cardiomyocytes.
    compares:
    - cm_hff
    - cm_ehm
    anchor:
      quote: EHM constructed directly from enriched cardiomyocyte populations did not condense and contained mostly rounded
        cardiomyocytes
      where: Results, cell composition
    stated_direction:
      direction: down
      anchor:
        quote: EHM constructed directly from enriched cardiomyocyte populations did not condense and contained mostly rounded
          cardiomyocytes
        where: Results, cell composition
  F1e_cmpct:
    unit: F1e
    measure: output cardiomyocyte percentage
    finding: Output cardiomyocyte percentage falls with lower input cardiomyocyte ratio.
    groups:
    - r90
    - r70
    - r50
    n:
      printed: each circle represents one individual EHM
      counts: EHM
    anchor:
      quote: Output CM percentage and force per CM in 2 week old EHM made with indicated input cell ratios of purified CMs
        and HFFs
      where: Fig. 1e legend
  F1e_force:
    unit: F1e
    measure: force per cardiomyocyte
    finding: Force per cardiomyocyte is highest at the 70%/30% input ratio.
    groups:
    - r90
    - r70
    - r50
    n:
      printed: each circle represents one individual EHM
      counts: EHM
    anchor:
      quote: Output CM percentage and force per CM in 2 week old EHM made with indicated input cell ratios of purified CMs
        and HFFs
      where: Fig. 1e legend
  F1e_ratio:
    unit: F1e
    measure: output cardiomyocyte:fibroblast ratio
    finding: 70%/30% input gives an output cardiomyocyte:fibroblast ratio of about 1:1.
    groups:
    - r70
    values:
      ratio_text:
        printed: ~1:1
        unit: cardiomyocyte:fibroblast
        kind: ratio
        group: r70
        spread: not stated
    anchor:
      quote: with a cardiomyocyte:fibroblast output ratio of ~1:1 (Figure 1e)
      where: Results, cell composition
  F1f_foc:
    unit: F1f
    measure: force of contraction
    method: isometric force in organ bath, calcium concentration-response
    finding: Serum-free, defined EHM develop higher force than Starting Protocol EHM.
    compares:
    - sf
    - start
    n:
      printed: n=19; n=59
      counts: EHM
      per_group:
        start: '19'
        sf: '59'
    stats:
      test: 2-way ANOVA with Tukey's multiple comparisons post hoc test
      p: '*p<0.05'
    anchor:
      quote: Force of contraction (FOC) recorded under increasing calcium concentrations and electrical stimulation at 1.5
        Hz
      where: Fig. 1f legend
  S1a_force_cm:
    unit: S1ab
    measure: force per cardiomyocyte
    finding: Defined EHM generate more force per cardiomyocyte.
    compares:
    - def
    - undef
    n:
      printed: undefined (n=10) vs. defined (n=9) EHM
      counts: EHM
      per_group:
        undef: '10'
        def: '9'
    stats:
      test: two-tailed, unpaired Student's t-test
      p: '*p<0.05'
    anchor:
      quote: Force per cardiomyocyte (CM) in undefined vs. defined EHM
      where: Suppl. Fig. 1a legend
      file: NIHMS862055-supplement-Corrected_Supplemental_Materials.pdf
  S1b_actinin:
    unit: S1ab
    measure: actinin median fluorescence intensity
    method: flow cytometry
    software: DIVA or Cyflogic
    finding: Cardiomyocytes from defined EHM have higher actinin MFI.
    compares:
    - def
    - undef
    context:
      preparation: isolated cardiomyocyte
    n:
      printed: undefined (n=10) vs. defined (n=9) EHM
      counts: EHM
      per_group:
        undef: '10'
        def: '9'
    stats:
      test: two-tailed, unpaired Student's t-test
      p: '*p<0.05'
    anchor:
      quote: Actinin median fluorescence intensity (MFI) assessed by flow cytometry in cardiomyocytes isolated from undefined
        vs. defined EHM
      where: Suppl. Fig. 1b legend
      file: NIHMS862055-supplement-Corrected_Supplemental_Materials.pdf
