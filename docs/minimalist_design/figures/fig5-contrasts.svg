es</text><rect x='665.8' y='394' width='198.2' height='20' rx='10' fill='#ffffff' stroke='#5d6670' stroke-width='1.3'/><text x='764.9' y='408.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='bold' text-anchor='middle'>code computes, never stored</text><rect x='36' y='418' width='200' height='68' rx='8' fill='#e3f1e8' stroke='#2f8f57' stroke-width='1.6'/><text x='48.0' y='440.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#2f8f57' font-weight='bold' text-anchor='start'>E1 · contrast</text><text x='48.0' y='460.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>one field differs:</text><text x='48.0' y='476.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>pacing, ramp vs none</text><rect x='246' y='418' width='200' height='68' rx='8' fill='#f8e3e1' stroke='#c8402f' stroke-width='1.6'/><text x='258.0' y='440.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#c8402f' font-weight='bold' text-anchor='start'>E2 · confound</text><text x='258.0' y='460.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>calcium and pacing differ;</text><text x='258.0' y='476.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>flagged by code</text><rect x='456' y='418' width='200' height='68' rx='8' fill='#e3f1e8' stroke='#2f8f57' stroke-width='1.6'/><text x='468.0' y='440.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#2f8f57' font-weight='bold' text-anchor='start'>E3 · main effect of pacing</text><text x='468.0' y='460.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>sides differ in pacing,</text><text x='468.0' y='476.0' font-family='Helvetica, Arial, sans-ser