  F4B_circularity.circularity_cm:
    item: F4B_circularity
    group: cm
    measure: cell circularity
    formula: c = 4*pi*A/P**2
    anchor:
      quote: Cells were analyzed for their cell area and circularity using ImageJ software with standard analysis plugins
      where: Methods, 3D-dhECT CM size, circularity
      file: nihms-755756.pdf
    library:
      formula: circularity_def
      vars:
        c: c
        A: A
        P: P
    inputs:
      A:
        item: F4B_area
        kind: per sample
        note: cell area of each CM (only range and mean printed)
      P:
        not_stated: true
        kind: per sample
        note: cell perimeter; not printed
    output: F4B_circularity.values.circ_mean_text
    aggregation: mean of per-sample
    note: the formula is named ('circularity', ImageJ standard plugins), not written out; ImageJ's circularity is 4πA/P²
  TXT5_lw.lw_cm:
    item: TXT5_lw
    group: cm
    measure: length-to-width ratio
    formula: r = Lc/Wc
    anchor:
      quote: Length and width of 60 cells were measured using ImageJ and the ratio was calculated
      where: Methods, 3D-dhECT CM size, circularity
      file: nihms-755756.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: Lc
        b: Wc
    inputs:
      Lc:
        not_stated: true
        kind: per sample
        note: cell length
      Wc:
        not_stated: true
        kind: per sample
        note: cell width
    output: TXT5_lw.values.lw
    aggregation: not stated
    note: an SD over n = 60 CMs suggests a mean of per-cell ratios, but the text does not say
