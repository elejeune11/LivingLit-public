  S4F_text:
    unit: S4F
    measure: cardiolipin side chain profile
    finding: induction lowers 68C/70C and raises 72C/74C cardiolipin
    groups:
    - HIPSC
    - GLUC
    - MM
    - MPAT
    anchor:
      quote: Induction of hiPSCs into hiPSC-CMs caused significant CL remodeling, in particular a decrease in 68C- and 70C-CL and an increase
        in 72C- and 74C-CL
      where: Results, MPAT and MM Induce a Gene Expression Program
