claims:
  abs_responsive:
    kind: stated
    quote: The hiPSC-ECTs are responsive to physiological stimuli, including stretch, frequency, and b-adrenergic stimulation
    where: Abstract
    rests_on:
    - F2ac_TF_length
    - F2dk_TF_freq
    - ST3_TF_early
    - ST3_TF_late
    - ST3_auto_early
    - ST3_auto_late
    note: stretch and frequency responses are shown without tests
    judgement:
      direction: follows
      support: cannot judge
      comparison: follows
      scope: follows
      replication: follows
      strength: follows
      presence: follows
  abs_ttubules:
    kind: stated
