edits:
# ---------------------------------------------------------------- culture fields
- add_term:
    field: hipsc_medium
    id: hipsc_medium:ftda
    label: FTDA medium
    definition: FTDA defined medium for expanding pluripotent stem cells.
    scope: FTDA medium; not mTeSR1.
- set_scope:
    id: hipsc_medium:mtesr1
    scope: mTeSR1 medium; not FTDA medium.
- add_term:
    field: hipsc_coating
    id: hipsc_coating:geltrex
    label: Geltrex
    definition: Geltrex basement-membrane matrix used to coat culture vessels.
    scope: The Geltrex product; not Matrigel, a different basement-membrane extract.
- set_scope:
    id: hipsc_coating:matrigel
    scope: Matrigel and its variants; not Geltrex, a different basement-membrane extract.
- add_qualifier: {id: purity_method:flow_cytometry, name: marker, dimension: text}
- add_term:
    field: cm_medium
    id: cm_medium:eht_medium
    label: EHT medium
    definition: The culture medium a source calls EHT medium, used to maintain engineered heart tissues; its composition is given by the cited protocol.
    scope: A medium named EHT medium without stated base; not RPMI 1640.
- set_scope:
    id: cm_medium:rpmi_1640
    scope: RPMI-1640 based medium; not a medium named only as EHT medium.
- add_synonym:
    id: substrate:fibrin_hydrogel
    text: fibrin
    anchor: thrombin carryover and fibrin polymerization in the pipette tip
- add_synonym:
    id: CL:0000746
    text: hiPSC-CMs
    anchor: Frozen or freshly dissociated hiPSC-CMs were counted
- add_qualifier: {id: platform:tissue_between_pillars, name: posts, dimension: text}

# ---------------------------------------------------------------- treatment
- adopt_own:
    field: treatment
    id: treatment:viral_transduction
    label: viral transduction
    definition: Transduction of the cells with a viral vector carrying a transgene (the transgene, vector and multiplicity of infection are qualifiers).
    scope: Gene transfer by a viral vector; not a compound and not a mechanical intervention.
    qualifiers:
      transgene: {dimension: text}
      vector: {dimension: text}
      MOI: {dimension: text}
    lookup: searched 'transduction', 'lentiviral', 'GFP', 'green fluorescent protein' and 'GCaMP' in ChEBI 257; ChEBI holds chemicals, not gene transfer or proteins such as GFP or GCaMP
- adopt_own:
    field: treatment
    id: treatment:metal_braces
    label: metal braces
    definition: Metal braces inserted into hollow posts to stiffen them and stop the tissue from shortening.
    scope: A mechanical intervention on the posts; not a compound or a gene transfer.
    qualifiers:
      phase: {dimension: text}
    lookup: searched 'metal brace' and 'brace' in ChEBI 257; a mechanical intervention, not a chemical
- adopt_own:
    field: treatment
    id: treatment:emd_57033
    label: EMD-57033
    definition: The thiadiazinone calcium sensitiser EMD-57033.
    scope: The compound EMD-57033; not a gene transfer or a mechanical intervention.
    lookup: searched 'EMD-57033', 'EMD57033', 'EMD 57033' and 'EMD' in ChEBI 257; no entry for this compound
- adopt:
    field: treatment
    id: CHEBI:4480
    label: diacetylmonoxime
    lookup: searched 'BDM', '2,3-butanedione monoxime', 'butanedione monoxime' (no hit) and 'diacetyl monoxime' in ChEBI 257; 2,3-butanedione monoxime is diacetylmonoxime
    synonyms:
    - text: BDM
      anchor: monoxime (BDM; 10 mM
- adopt:
    field: treatment
    id: CHEBI:34555
    label: Bay-K-8644
    lookup: searched 'Bay K-8644' and 'Bay K 8644' in ChEBI 257; exact match (racemate)
- adopt:
    field: treatment
    id: CHEBI:4551
    label: digoxin
    lookup: searched 'digoxin' in ChEBI 257; exact match
- adopt:
    field: treatment
    id: CHEBI:85966
    label: ivabradine
    lookup: searched 'ivabradine' in ChEBI 257; exact match (the free base; the hydrochloride is CHEBI:85969, the paper names no salt)
- adopt:
    field: treatment
    id: CHEBI:188664
    label: omecamtiv mecarbil
    lookup: searched 'omecamtiv mecarbil' in ChEBI 257; exact match

# ---------------------------------------------------------------- measures: synonyms and qualifiers on existing terms
- add_synonym:
    id: measure:calcium_transient_amplitude
    text: CaT amplitude
    anchor: At 1.8 mM calcium, CaT amplitude was 185%
- add_synonym:
    id: measure:twitch_force
    text: force amplitude
    anchor: higher (15,128 versus 5,318 AU) and force amplitude was
- add_synonym:
    id: measure:twitch_force
    text: contraction force
    anchor: Average peaks of contraction force (blue, left)
- add_synonym:
    id: measure:contraction_frequency
    text: beating frequency
    anchor: The adaptation of force to changes in beating frequency
- add_qualifier: {id: measure:calcium_transient_rise_time, name: level, dimension: text}
- add_qualifier: {id: measure:calcium_transient_decay_time, name: level, dimension: text}

# ---------------------------------------------------------------- measures: new terms
- add_term:
    field: measure
    id: measure:signal_to_noise_ratio
    label: signal-to-noise ratio
    definition: Amplitude of a recorded signal divided by the background noise of the recording.
    scope: Quality of a recording (the signal is the qualifier signal); not the amplitude of the signal itself.
    qualifiers:
      signal: {dimension: text}
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:fluorescence_peak_amplitude
    label: peak fluorescence amplitude
    definition: Peak intensity of a recorded fluorescence signal, whatever its source (calcium indicator, GFP or autofluorescence).
    scope: Raw fluorescence peaks compared across signal sources (qualifier signal); not calcium transient amplitude, which is the transient of a calcium indicator.
    qualifiers:
      signal: {dimension: text}
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:contraction_time_to_peak
    label: time to peak force
    definition: Time from the start of a contraction to its force peak, measured from a stated level (qualifier level).
    scope: Rise of force; not relaxation time and not the rise time of the calcium transient.
    qualifiers:
      level: {dimension: text}
    dimension: time
- add_term:
    field: measure
    id: measure:calcium_force_time_difference
    label: calcium transient time relative to force time
    definition: Relative difference between a time of the calcium transient and the matching time of force in the same beats (qualifier phase says which pair).
    scope: A comparison of calcium and force kinetics within one tissue; not either time on its own.
    qualifiers:
      phase: {dimension: text}
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:force_fluorescence_loop
    label: force-fluorescence loop
    definition: Qualitative shape or orientation of force plotted against fluorescence over one beat (qualifier aspect).
    scope: The phase-plane loop of force against fluorescence; not the relation of amplitudes across conditions.
    qualifiers:
      aspect: {dimension: text}
    dimension: categorical
- add_term:
    field: measure
    id: measure:force_calcium_relation
    label: force-calcium amplitude relation
    definition: How relative force amplitude changes with relative calcium transient amplitude across conditions (qualifier varied_by).
    scope: Relation of amplitudes across conditions; not the within-beat force-fluorescence loop.
    qualifiers:
      varied_by: {dimension: text}
    dimension: categorical
- add_term:
    field: measure
    id: measure:beating_presence
    label: presence of beating
    definition: Whether tissues beat or have stopped beating.
    scope: Beating present or absent; not contraction frequency.
    qualifiers:
      mode: {dimension: text}
    dimension: categorical

# ---------------------------------------------------------------- standing keys for the measures this paper adds
- standing_key:
    measure: measure:signal_to_noise_ratio
    value: {must_match: [platform@1, preparation, measure.signal], may_vary: [cell_line, pacing]}
