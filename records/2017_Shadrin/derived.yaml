    output: S5b_f2.values.force_f2
    note: Each patch's force at 2 Hz over its own 1 Hz force (the SEM is non-zero, so the normalisation is per patch). The
      readings are of the plotted normalised means, so the 1 Hz reference is 1 for every patch and the ratio of the two readings
      equals the mean of the per-sample ratios; no aggregation alternative is needed.
  F6c_d14_vs_d7.fold:
    item: F6c_d14_vs_d7
    formula: r = B14/B7
    anchor:
      quote: a 1.6-fold increase in blood vessel density
      where: Results, Cardiopatch vascularization and function in window chambers
    library:
      formula: ratio_def
      vars:
        r: r
        a: B14
        b: B7
    inputs:
      B14:
        reading: F6c/d14_vs_d7.patch_d14
        kind: per sample
      B7:
        reading: F6c/d14_vs_d7.patch_d7
        kind: per sample
    output: F6c_d14_vs_d7.values.bvd_fold
    aggregation: not stated
    note: Repeated measures in the same mice; whether the fold is of means or a mean of per-mouse folds is not stated.
  F6c_d14_vs_d7.bvd:
    item: F6c_d14_vs_d7
    formula: B = Av/Ap
    anchor:
      quote: blood vessel density (BVD, total area of blood vessels per patch area
      where: Methods, Intravital imaging of vasculature and Ca2+ transients
    library:
      formula: ratio_def
      vars:
        r: B
        a: Av
        b: Ap
    inputs:
      Av:
        not_stated: true
        kind: per sample
      Ap:
        not_stated: true
        kind: per sample
    note: Definition of the plotted BVD (A.U.); no part is printed.
  S18_no_arrhythmia.no_arrhythmia_total:
    item: S18_no_arrhythmia
    formula: k = kp + kc
    anchor: &id002
      quote: In 75% of attempts, burst pacing at 2–20 Hz
      where: Results, Functional analysis of epicardially implanted cardiopatches
    library:
      formula: sum_of_parts
      vars:
        t: k
        a: kp
        b: kc
    inputs:
      kp:
        value: S18_no_arrhythmia.values.patch_no_arr
        kind: constant
      kc:
        value: S18_no_arrhythmia.values.ctrl_no_arr
        kind: constant
  S18_no_arrhythmia.attempts_total:
    item: S18_no_arrhythmia
    formula: m = mp + mc
    anchor: *id002
    library:
      formula: sum_of_parts
      vars:
        t: m
        a: mp
        b: mc
    inputs:
      mp:
        value: S18_no_arrhythmia.values.patch_attempts
        kind: constant
      mc:
        value: S18_no_arrhythmia.values.ctrl_attempts
        kind: constant
  S18_no_arrhythmia.share:
    item: S18_no_arrhythmia
    formula: f = k/m
    anchor: *id002
    library:
      formula: ratio_def
      vars:
        r: f
        a: k
        b: m
    inputs:
      k:
        derived: S18_no_arrhythmia.no_arrhythmia_total
        kind: constant
      m:
        derived: S18_no_arrhythmia.attempts_total
        kind: constant
    output: S18_no_arrhythmia.values.share
    alternatives:
    - label: per group, each about 75 %
      note: '''in both'' may mean each group separately: 40/54 = 74.1 % and 36/48 = 75.0 %.'
  F4a_TNNI3.ddct:
    item: F4a_TNNI3
    formula: r = 2**(-ddct)
    anchor: &id003
      quote: Relative expression of target genes was quantified by the ΔΔCt method using GAPDH as the housekeeping gene
      where: Methods, qRT-PCR
    library:
      formula: ddct_relative_expression
      vars:
        r: r
        ddct: ddct
    inputs:
      ddct:
        not_stated: true
        kind: per sample
        note: Ct values are not reported
    note: Relative expression per sample; F4a is normalised to adult left ventricle, F4b to 1MM, S11 to d0 or to age-matched
      monolayers.
