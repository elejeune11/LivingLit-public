claims:
  C01:
    kind: stated
    quote: we find that TDI treatment in a 3D tissue context yields a higher fidelity adult cardiac phenotype, in-cluding sarcoplasmic reticulum
      function and contractile properties
    where: Abstract
    scope: hiPSC-CMs in 3D CMTs
    strength: higher fidelity adult cardiac phenotype
    rests_on:
    - ST4_amp_025
    - ST4_amp_05
    - ST4_decay_05
    - F5D_4Hz
    - F5F_contraction
    - F5I_RT50
    - F5L_tdi_force
    - F3A_CMT_ATP2A2
    - F3A_CMT_RYR2
    judgement:
      direction: follows
      support: follows
      comparison: overstated
      scope: overstated
      replication: follows
      strength: overstated
      presence: follows
    note: no comparison of TDI in 3D against TDI in 2D is tested, and no adult tissue is measured; 'adult' is not shown
  C02:
    kind: stated
    quote: We found that TDI treatment altered the transcriptional profile
    where: Introduction
    scope: monolayers and CMTs
    strength: not stated
    rests_on:
    - F3A_CM_TNNT2
    - F3A_CM_MYH7
    - F3A_CM_MYH6
    - F3A_CM_GJA1
    - F3A_CM_ACTN2
    - F3A_CM_MYL2
    - F3A_CM_JPH2
    - F3A_CM_BIN1
    - F3A_CM_CAMK2D
    - F3A_CM_PRKACA
