  f4f_before.normalized_to_actin:
    item: f4f_before
    measure: mtDNA content (Mt-ND1/2 normalized to actin)
    formula: m = c/g
    anchor:
      quote: PCR amplification of genomic DNA for the mitochondrial encoded NADH dehydrogenase (Mt-ND1/2), normalized to the nuclear encoded gene
        actin
      where: Fig. 4 legend
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: m
        a: c
        b: g
    inputs:
      c:
        by_reference:
          citation: Burkart2016
          anchor:
            quote: Experimental procedure and primer sequences as published in (Burkart et al., 2016)
            where: Supplemental Experimental Procedures
            file: mmc1.pdf
        kind: per sample
      g:
        by_reference:
          citation: Burkart2016
          anchor:
            quote: Experimental procedure and primer sequences as published in (Burkart et al., 2016)
            where: Supplemental Experimental Procedures
            file: mmc1.pdf
        kind: per sample
    note: '''Normalized to'' a reference gene is a named ratio; how Mt-ND1/2 and ACTB quantities are obtained from the qPCR (standard curve or
      2^-dCt) is stated only by citation.'
