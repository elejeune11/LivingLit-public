  T3_Vup_norm.vup_norm_g1:
    item: T3_Vup_norm
    group: g1
    measure: force upstroke velocity normalized by peak stress
    formula: vn = v/s
    anchor:
      quote: similar between groups when Vup is normalized by peak stress
      where: Results 3.3
    library:
      formula: ratio_def
      vars:
        r: vn
        a: v
        b: s
    inputs:
      v:
        value: T3_Vup.values.g1_table
        part: mean
        kind: per sample
      s:
        value: T3_stress.values.g1_table
        part: mean
        kind: per sample
    output_unit: 1/s
    aggregation: not stated
    note: normalized values are not printed, so there is no output to judge
