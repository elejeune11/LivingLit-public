      vars: {r: ecar, a: R, b: D}
    inputs:
      R: {not_stated: true, kind: per sample, note: raw ECAR of each well (last baseline measurement before Oligomycin)}
      D: {not_stated: true, kind: per sample, note: PicoGreen DNA content of each sample; the printed unit expresses the result per 300 ng DNA}
