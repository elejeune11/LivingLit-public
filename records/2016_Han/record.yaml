evidence:
  F1B_orient:
    unit: F1
    measure: fiber orientation
    finding: aligned scaffolds show anisotropic, random scaffolds isotropic fiber orientation histograms
    groups:
    - al
    - ra
    method: SEM images analyzed; 300 fibers randomly picked from three different samples
    software: NIH ImageJ
    anchor:
      quote: Histogram analysis of fiber alignment in each type of fibrous scaffolds confirmed the well-defined anisotropic and isotropic features
      where: Results 3.1
  F1C_range:
    unit: F1
    measure: fiber diameter
    finding: fiber diameters of both scaffolds range 230–2200 nm
    groups:
    - al
    - ra
    method: SEM images analyzed; 300 fibers randomly picked from three different samples
    software: NIH ImageJ
    values:
      range_lo:
        printed: '230'
        unit: nm
        kind: value
        over:
        - al
        - ra
        spread: none
      range_hi:
        printed: '2200'
        unit: nm
        kind: value
        over:
        - al
        - ra
        spread: none
    anchor:
      quote: Fiber diameters showed a similar distribution in size in the range of 230–2200 nm
      where: Results 3.1
  F1C_peak:
    unit: F1
    measure: fiber diameter histogram peak
    finding: almost identical histogram peak frequency at 500–600 nm
    groups:
    - al
    - ra
    method: SEM images analyzed; 300 fibers randomly picked from three different samples
    software: NIH ImageJ
    values:
      peak_lo:
        printed: '500'
        unit: nm
        kind: value
        over:
        - al
        - ra
        spread: none
      peak_hi:
        printed: '600'
        unit: nm
        kind: value
        over:
        - al
        - ra
        spread: none
    anchor:
      quote: with an almost identical histogram peak frequency at 500–600 nm
      where: Results 3.1
  F1C_diam:
    unit: F1
    measure: average fiber diameter
    finding: average sizes of aligned and random fibers indistinguishable, approximately 0.7 µm
    compares:
    - al
    - ra
    method: SEM images analyzed; 300 fibers randomly picked from three different samples
    software: NIH ImageJ
    n:
      printed: n = 300
      counts: fibers (randomly picked from three different samples)
    values:
      diam_text:
        printed: approximately 0.7
        unit: µm
        kind: mean
        over:
        - al
        - ra
        spread: SD
        spread_source: legend
    stats:
      test: Mann–Whitney U test
      p: p > 0.05
      p_values:
      - p: n.s.
        anchor:
          quote: n.s. not significant via Mann–Whitney U test
          where: Fig. 1 legend
    anchor:
      quote: the average sizes of aligned and random fibers were indistinguishable, and were at approximately 0.7 µm
      where: Results 3.1
