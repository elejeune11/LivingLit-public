  F8_ctnt.ptotal:
    item: F8_ctnt
    formula: Ptotal = (pmono + 2*pbis + 3*ptris)/100
    anchor: &id013
      quote: Ptotal = (%Pmono + (2 × %Pbis) + (3 × %Ptris) + …)/100
      where: Supplemental Methods, MS-based quantification of protein phosphorylation
      file: NIHMS936001-supplement-Supple_manuscript.pdf
    library:
      formula: ptotal_from_relative_abundance
      vars:
        P: Ptotal
        p1: pmono
        p2: pbis
        p3: ptris
    inputs:
      pmono:
        not_stated: true
        kind: per sample
        note: '% relative abundance of the mono-phosphorylated form'
      pbis:
        not_stated: true
        kind: per sample
        note: '% relative abundance of the bis-phosphorylated form'
      ptris:
        not_stated: true
        kind: per sample
        note: '% relative abundance of the tris-phosphorylated form'
    alternatives:
