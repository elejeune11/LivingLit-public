  F1a_purity:
    unit: F1a
    measure: cTnT+ cardiomyocytes
    method: flow cytometry for cTnT
    software: Flowing Software
    finding: 86.3 ± 0.9% of cells were cTnT+ across 66 differentiations (range 71–98%)
    groups:
    - cm
    values:
      purity_text:
        printed: '86.3'
        unit: '%'
        kind: mean
        group: cm
        spread: SEM
        spread_source: methods
      purity_sem_text:
        printed: '0.9'
        unit: '%'
        kind: sem
        group: cm
      range_low:
        printed: '71'
        unit: '%'
        kind: value
        group: cm
      range_high:
        printed: '98'
        unit: '%'
        kind: value
        group: cm
    n:
      printed: n = 66 independent differentiations
      counts: independent differentiations
    anchor:
      quote: cells at d15–21 contained 86.3 ± 0.9% cTnT+ hiPSC-CMs (n = 66 independent differentiations; range 71–98% cTnT
        + ; Fig. 1a)
      where: Results, Cellular makeup and structural maturation of cardiopatches
  S2_cd31:
    unit: S2
    measure: CD31+ endothelial cells
    method: flow cytometry for CD31-APC
    software: Flowing Software
    finding: 0.31% of cells in the input population were CD31+ (0.1% in the unstained control)
    groups:
    - cm
    values:
      cd31_stained:
        printed: '0.31'
        unit: '%'
        kind: percent
        group: cm
        spread: none
      cd31_unstained:
        printed: '0.1'
        unit: '%'
        kind: percent
        group: cm
        spread: none
    anchor:
      quote: Supplementary Fig. 2C
      where: Supplementary Fig. 2C
      kind: unit
    note: the two percentages are printed inside the flow cytometry plots (stained and unstained)
  F1g_w1:
    unit: F1g
    measure: Ki67+ cardiomyocytes
    method: immunostaining for Ki67 and Nkx2.5, confocal
    software: ImageJ
    finding: 17.0 ± 0.7% of CMs were Ki67+ at 1 week
    groups:
    - w1
    values:
      ki67_w1:
        printed: '17.0'
        unit: '%'
        group: w1
        spread: SEM
        spread_source: legend
      ki67_w1_sem:
        printed: '0.7'
        unit: '%'
        kind: sem
        group: w1
    n: &id007
      printed: n = 8/11/12 patches (for 1/2/3 week) from four differentiations
      counts: patches
      per_group:
        w1: '8'
        w2: '11'
        w3: '12'
    anchor: &id008
      quote: demonstrated a continuous decrease in Ki67+ CMs from 17.0 ± 0.7% at 1 week to 8.1 ± 1.1% at 3 weeks of culture
      where: Results, Cellular makeup and structural maturation of cardiopatches
