  S4G_caff.baseline:
    item: S4G_caff
    formula: m0 = S0/n0
    anchor: &id002
      quote: the amplitude of the first peak after caffeine addition was divided by the average of the four peaks before caffeine
      where: STAR Methods
    library:
      formula: mean_def
      vars:
        m: m0
        S: S0
        n: n0
    inputs:
      S0:
        not_stated: true
        kind: per sample
        note: sum of the amplitudes of the four paced transients before caffeine
      n0:
        printed: '4'
        unit: count
        anchor:
          quote: After 4 calcium transients, stimulation was stopped
          where: STAR Methods
        kind: constant
  S4G_caff.ratio:
    item: S4G_caff
    formula: r = a1/m0
    anchor: *id002
    library:
      formula: ratio_def
      vars:
        r: r
        a: a1
        b: m0
    inputs:
      a1:
        not_stated: true
        kind: per sample
        note: amplitude of the first peak after caffeine
      m0:
        derived: S4G_caff.baseline
        kind: per sample
    aggregation: mean of per-sample
    alternatives:
    - label: percentage change from baseline
      formula: d = (a1 - m0)/m0
      note: the legend prints the result as "percentage, relative to amplitude at baseline"; whether it is the ratio x100
        or the increase over baseline is not stated (relative_change)
  F7F_cx43.norm_ctrl_cmecf:
    item: F7F_cx43
    group: ctrl_cmecf
    formula: y = m_ctrl/m_ctrl
    anchor: &id003
      quote: normalized to the respective CTRL
      where: Fig. 7 legend
    library:
      formula: normalized_to_own_control
      vars:
        my: y
        mx: m_ctrl
    inputs:
      m_ctrl:
        not_stated: true
        kind: constant
        note: mean CX43 per cell of the CTRL MTs (n = 3 batches); not printed
    note: the CTRL group normalised to its own mean
    output: F7F_cx43.values.cx43_ctrl
