evidence:
  S3_ventricular:
    unit: S3
    measure: fraction of ventricular-like cells
    method: whole cell patch clamp, current clamp, EPC-10 amplifier
    software: PatchMaster
    definition: negative maximum diastolic membrane potential (less than −50 mV), rapid AP upstroke, long plateau, AP amplitude
      greater than 90 mV, APD90/APD50 less than 1.4
    finding: Ventricular-like cells were the predominant phenotype.
    groups:
    - cm
    values:
      pct_text:
        printed: 57%
        unit: '%'
        kind: percent
        group: cm
        spread: none
      pct_legend:
        printed: 57%
        unit: '%'
        kind: percent
        group: cm
        spread: none
    note: Also printed in the Supplemental Figure 3B legend ('The majority subtype (57%) consisted of ventricular-like CMs').
    anchor:
      quote: with ventricular-like cells being the predominant phenotype (57%)
      where: Results, hPSC-CM Electrophysiology
  S3_atrial:
    unit: S3
    measure: fraction of atrial-like cells
    method: whole cell patch clamp, current clamp, EPC-10 amplifier
    software: PatchMaster
    definition: absence of a prominent plateau phase, negative diastolic membrane potential (less than −50 mV), APD90/APD50
      greater than 1.7
    finding: 24% of cells were atrial-like.
    groups:
    - cm
    values:
      pct:
        printed: 24%
        unit: '%'
        kind: percent
        group: cm
        spread: none
    anchor:
      quote: along with atrial-like (24%) and nodal-like (19%)
      where: Results, hPSC-CM Electrophysiology
  S3_nodal:
    unit: S3
    measure: fraction of nodal-like cells
    method: whole cell patch clamp, current clamp, EPC-10 amplifier
    software: PatchMaster
    definition: more positive maximum diastolic potential, slower AP upstroke, prominent phase 4 depolarization, APD90/APD50
      between 1.4 and 1.7
    finding: 19% of cells were nodal-like.
    groups:
    - cm
    values:
      pct:
        printed: 19%
        unit: '%'
        kind: percent
        group: cm
        spread: none
    anchor:
      quote: along with atrial-like (24%) and nodal-like (19%)
      where: Results, hPSC-CM Electrophysiology
  S3_mdp:
    unit: S3
    measure: maximum diastolic potential of ventricular-like cells
    method: whole cell patch clamp, current clamp, EPC-10 amplifier
    software: PatchMaster
    finding: Average maximum diastolic potential of ventricular-like cells.
    groups:
    - cm
    values:
      mdp:
        printed: −63.3
        unit: not stated
        kind: mean
        group: cm
        spread: SEM
        spread_source: sentence
        suspected_error:
          what: no unit printed
          why: a membrane potential is printed without a unit (mV expected)
      mdp_sem:
        printed: '1.7'
        unit: not stated
        kind: sem
        group: cm
        spread: SEM
        spread_source: sentence
    anchor:
      quote: average maximum diastolic potential of ventricular-like (V-like) cells were −63.3 ± 1.7 (± SEM)
      where: Results, hPSC-CM Electrophysiology
  S3_vmax:
    unit: S3
    measure: maximal upstroke velocity of ventricular-like cells
    method: whole cell patch clamp, current clamp, EPC-10 amplifier
    software: PatchMaster
    finding: Vmax of ventricular-like cells.
    groups:
    - cm
    values:
      vmax:
        printed: '27.4'
        unit: V/s
        kind: mean
        group: cm
        spread: SEM
        spread_source: sentence
      vmax_sem:
        printed: '1.8'
        unit: V/s
        kind: sem
        group: cm
        spread: SEM
        spread_source: sentence
    note: The '(± SEM)' is printed after the first value of the same sentence; the Methods default is mean ± SD.
    anchor:
      quote: the maximal upstroke velocity (Vmax) measured as V/s was 27.4 ± 1.8
      where: Results, hPSC-CM Electrophysiology
  S5_tnt_hipsc:
    unit: S5
    measure: troponin-T positive cells
    method: flow cytometry for troponin-T, BD FACSAria II
    software: FlowJo
    finding: A representative hiPSC-CM differentiation yielded 88% troponin-T positive cells.
    groups:
    - hipsc
    values:
      tnt_text:
        printed: 88%
        unit: '%'
        kind: percent
        group: hipsc
        spread: none
      tnt_text2:
        printed: 88%
        unit: '%'
        kind: percent
        group: hipsc
        spread: none
      tnt_legend:
        printed: approximately 88%
        unit: '%'
        kind: percent
        group: hipsc
        spread: none
    note: Printed in Results (hPSC-CM Flow Cytometry and EHM Generation) and in the Supplemental Figure 5 legend.
    anchor:
      quote: A representative differentiation of hiPSC-CM yielded 88% troponin-T
      where: Results, hPSC-CM Flow Cytometry
