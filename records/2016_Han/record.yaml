    method: α-actinin immunostaining; confocal Z-stacks projected with max intensity
    software: FluoView software (Olympus)
    anchor:
      quote: CMs on aligned fibrous scaffolds were extended and elongated in the direction parallel to the fiber alignment
      where: Results 3.2
  F2B_ra:
    unit: F2
