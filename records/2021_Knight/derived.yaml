record: 2021_Knight
formula_library_version: 30
agent:
  model: llm
  instructions: formulas_v3
derived:
  F3D_maxt.tension:
    item: F3D_maxt
    measure: maximum tension
    formula: not stated
    anchor: &id002
      quote: maximum tension (mN/mm2), the greatest level of active tension generated by the myofibril at full calcium activation (pCa
        4.5)
      where: Supplemental Experimental Procedures
      file: mmc1.pdf
    no_formula: tension is printed in mN/mm2 and myofibril diameters were measured, but how force (from the calibrated force probe)
      and cross-sectional area were obtained and combined is not stated
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: myofibril force from the cantilevered force probe (printed compliance 6-8 μm/μN); not printed
      d:
        item: F3D_diam
        kind: per sample
        note: myofibril diameter, measured in ImageJ
    alternatives: &id001
    - label: circular cross-section from the measured diameter
      formula: sigma = 4*F/(pi*d**2)
    aggregation: not stated
  F3D_rest.tension:
    item: F3D_rest
    measure: resting tension
    formula: not stated
    anchor: &id003
      quote: resting tension, the passive tension produced in relaxing conditions, induced by a push on the stretcher
      where: Supplemental Experimental Procedures
      file: mmc1.pdf
    no_formula: tension is printed in mN/mm2 and myofibril diameters were measured, but how force (from the calibrated force probe)
      and cross-sectional area were obtained and combined is not stated
    inputs:
