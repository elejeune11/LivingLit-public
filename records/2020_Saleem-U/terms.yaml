mappings:
# ---------------------------------------------------------------- culture and platform
- field: purity_method
  stated: flow cytometry (cardiac troponin T)
  terms: [purity_method:flow_cytometry]
  qualifiers: {marker: cardiac troponin T}
- field: platform
  stated: engineered heart tissue (EHT)
  terms: [platform:tissue_between_pillars]
  note: The paper's EHTs are fibrin strips cast between pairs of flexible PDMS posts (Experimental Procedures). "EHT" is not added as a synonym because it is broader than this format.
- field: platform
  stated: engineered heart tissue (EHT) on hollow PDMS posts
  terms: [platform:tissue_between_pillars]
  qualifiers: {posts: hollow PDMS posts}

# ---------------------------------------------------------------- mechanical load
- field: mechanical_load
  stated: flexible PDMS posts
  terms: [mechanical_load:auxotonic]
  qualifiers: {posts: flexible PDMS posts}
  note: EHTs contract against flexible posts that bend with each beat (auxotonic); the post description is kept as a qualifier.
- field: mechanical_load
  stated: stiffened PDMS posts (metal braces)
  terms: [mechanical_load:isometric]
  qualifiers: {posts: hollow PDMS posts stiffened by metal braces}
  note: The braces stiffen the posts and abrogate EHT movement, so contraction is at fixed length.

# ---------------------------------------------------------------- measurement calcium
- field: measurement_calcium_mM
  stated: submaximal
  flag: {kind: several conditions, note: "Not a number; the qualifier gives a different bath calcium per hiPSC line (and for Bay K-8644), so the unit pools several calcium conditions."}
- field: measurement_calcium_mM
  stated: 0.4–0.6 mM for hiPSC cell line 2, and 0.8 mM for hiPSC cell line 3
  flag: {kind: several conditions, note: "Two bath calcium concentrations for two cell lines in one value; code would read it as one quantity."}

# ---------------------------------------------------------------- transgene
- field: transgene
  stated: GFP (lentiviral)
  terms: [transgene:gfp]
  qualifiers: {vector: lentivirus}
- field: transgene
  stated: GCaMP5G or GCaMP6f (lentiviral)
  flag: {kind: alternatives, note: "Names two sensors joined by 'or'; the group pools GCaMP5G and GCaMP6f tissues, so it is not one transgene."}
- field: transgene
  stated: GCaMP5G (lentiviral)
  terms: [transgene:gcamp5g]
  qualifiers: {vector: lentivirus}
- field: transgene
  stated: GCaMP6f (lentiviral)
  terms: [transgene:gcamp6f]
  qualifiers: {vector: lentivirus}
- field: transgene
  stated: GCaMP6f (AAV6)
  terms: [transgene:gcamp6f]
  qualifiers: {vector: AAV6}
- field: transgene
  stated: GCaMP6f (AAV6 and lentiviral)
  terms: [transgene:gcamp6f]
  qualifiers: {vector: AAV6 and lentivirus (pooled)}
  note: One transgene; the unit pools tissues transduced by either vector, which the paper analyses together, so both vectors are named in the qualifier.

# ---------------------------------------------------------------- measures
- field: measure
  stated: time-to-peak CaT (TTP80%,CaT)
  terms: [measure:calcium_transient_rise_time]
  qualifiers: {level: 80%}
  note: Items of this measure are printed both in s and as % change from own baseline, so no paper-wide expressed_as is given (see ambiguity log).
- field: measure
  stated: TTP-80% (CaT)
  terms: [measure:calcium_transient_rise_time]
  qualifiers: {level: 80%, expressed_as: "% change", normalised_to: own baseline}
- field: measure
  stated: time-to-peak force (TTP80%,force)
  terms: [measure:contraction_time_to_peak]
  qualifiers: {level: 80%}
  note: Printed both in s and as % change from own baseline; no paper-wide expressed_as.
- field: measure
  stated: TTP-80% (force)
  terms: [measure:contraction_time_to_peak]
  qualifiers: {level: 80%, expressed_as: "% change", normalised_to: own baseline}
- field: measure
  stated: decay time of the CaT (DT80%)
  terms: [measure:calcium_transient_decay_time]
  qualifiers: {level: 80%, expressed_as: absolute}
- field: measure
  stated: decay time of the CaT (DT80%,CaT)
  terms: [measure:calcium_transient_decay_time]
  qualifiers: {level: 80%}
  note: Printed both in s and as % change from own baseline; no paper-wide expressed_as.
- field: measure
  stated: DT80% (CaT)
  terms: [measure:calcium_transient_decay_time]
  qualifiers: {level: 80%, expressed_as: "% change", normalised_to: own baseline}
- field: measure
  stated: relaxation time CaT (RT80%,CaT)
  terms: [measure:calcium_transient_decay_time]
  qualifiers: {level: 80%, expressed_as: "% change", normalised_to: own baseline}
  note: The isoprenaline sentence writes RT80%,CaT where the paper otherwise writes DT80%,CaT, and the plotted panel (Fig. S4A) is labelled DT80%; the same quantity.
- field: measure
  stated: relaxation time for force (RT80%,force)
  terms: [measure:relaxation_time]
  qualifiers: {level: 80%}
  note: Printed both in s and as % change from own baseline; no paper-wide expressed_as.
- field: measure
  stated: RT80% (force)
  terms: [measure:relaxation_time]
  qualifiers: {level: 80%, expressed_as: "% change", normalised_to: own baseline}
- field: measure
  stated: time-to-peak CaT relative to time-to-peak force
  terms: [measure:calcium_force_time_difference]
  qualifiers: {phase: time to peak}
- field: measure
  stated: decay time of the CaT relative to relaxation time for force
  terms: [measure:calcium_force_time_difference]
  qualifiers: {phase: CaT decay versus force relaxation}
- field: measure
  stated: orientation of the force-calcium loop
  terms: [measure:force_fluorescence_loop]
  qualifiers: {aspect: orientation}
- field: measure
  stated: shape of the force-fluorescence loop
  terms: [measure:force_fluorescence_loop]
  qualifiers: {aspect: shape}
- field: measure
  stated: shape of the force-light dependency
  terms: [measure:force_fluorescence_loop]
  qualifiers: {aspect: shape}
- field: measure
  stated: contraction force and autofluorescence intensity peaks
  flag: {kind: several measures, note: "Two measures in one value: contraction force peaks and autofluorescence intensity peaks."}
- field: measure
  stated: contraction force and GFP fluorescence intensity peaks
  flag: {kind: several measures, note: "Two measures in one value: contraction force peaks and GFP fluorescence intensity peaks."}
- field: measure
  stated: fraction of hiPSC-CMs transduced, by GFP staining
  terms: [measure:marker_positive_cells]
  qualifiers: {marker: GFP}
- field: measure
  stated: spontaneous beating
  terms: [measure:beating_presence]
  note: The finding is that some EHTs stopped beating at 100 nM nifedipine while electrically paced; whether "spontaneous" is right is doubtful, so no mode qualifier is given.
- field: measure
  stated: TTP80%,force, TTP80%,CaT, RT80%,force, and DT80%,CaT
  flag: {kind: several measures, note: "Four kinetic measures in one value (time to peak and relaxation of force, time to peak and decay of CaT)."}
- field: measure
  stated: correlation of relative force and CaT amplitude values at different pacing frequencies
  terms: [measure:force_calcium_relation]
  qualifiers: {varied_by: pacing frequency}
