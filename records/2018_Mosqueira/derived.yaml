  F3d_hets.difference:
    item: F3d_hets
    formula: d = x - x0
    anchor:
      quote: across all isogenic sets, WT/MUT showed a significant increase in bi- and multi-nucleation (1.9–3.6% and 1.1–1.9%)
        relative to WT/WT
      where: Results, Molecular assessment of β-MHC mutant hPSC-CMs
    library:
      formula: difference_from_reference
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: percentage of bi- (or multi-) nucleated WT/MUT cardiomyocytes
      x0:
        not_stated: true
        kind: per sample
        note: the same percentage in WT/WT
    alternatives:
    - label: the printed values are the WT/MUT percentages themselves, not increases
      formula: d = x
    - label: the printed values are relative changes
      formula: d = (x - x0)/x0
    note: '''increase ... (1.9–3.6% and 1.1–1.9%) relative to WT/WT'' does not say whether the numbers are percentage-point
      increases, relative changes or the WT/MUT levels; ranges over three lines, no output named'
