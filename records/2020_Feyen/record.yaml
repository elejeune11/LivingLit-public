        printed: 40%
        unit: '%'
        kind: percent
        between:
        - mm
        - rpmi
        expressed_as: '% change'
        spread: none
        spread_source: sentence
    n:
      printed: n = 3 batches
      counts: batches
    stats:
      test: not stated
      statistic: not stated
      p: not stated
