evidence:
  F1_area_MPAT_v_GLUC:
    unit: F1
    measure: cell area
    method: immunofluorescence on PFA-fixed cells stained for α-actinin and counterstained with HCS CellMask
    software: Image J
    finding: 'cell area: MPAT vs GLUC, ****p < 0.0001'
    compares:
    - MPAT
    - GLUC
    n:
      printed: Data were pooled from three replicates from two inductions (GLPAT) or three or more (all other conditions) inductions
      counts: replicates from inductions
      per_group:
        GLPAT: three replicates from two inductions
        GLUC: three or more inductions
        MM: three or more inductions
        MPAT: three or more inductions
    stats:
      test: Kruskal-Wallis test followed by Dunn’s post test
      p: '****p < 0.0001'
    anchor:
      quote: Kruskal-Wallis test followed by Dunn’s post test (B) or one-way ANOVA with Tukey’s post test (C)
