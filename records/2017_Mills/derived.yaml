record: 2017_Mills
formula_library_version: 8
agent:
  model: llm
  instructions: formulas_v3
derived:
  SIM1_k.I:
    item: SIM1_k
    formula: I = b*h**3/12
    anchor:
      quote: Irectangle = bh3
      where: SI Methods, eq. S2
      file: pnas.201707316si.pdf
    library:
      formula: rect_second_moment
      vars:
        I: I
        w: b
        t: h
    inputs:
      b:
        printed: '0.5'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      h:
        printed: '0.2'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
    note: second moment of area of one PDMS pole (b = length of the pole, h = width in the bending direction)
  SIM1_k.k_S1:
    item: SIM1_k
    formula: k = 6*E*I/(-x**3 + 3*L*x**2)
    anchor:
      quote: Maximum deflection at the end of a rectangular cantilever fixed at one end with force applied at a specified
        distance
      where: SI Methods, eq. S1
      file: pnas.201707316si.pdf
    library:
      formula: cantilever_point_load_stiffness
      vars:
        k: k
        E: E
        I: I
        L: L
        x: x
    inputs:
      E:
        printed: 1,500
        unit: kPa
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      L:
        printed: '0.7'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      x:
        printed: '0.35'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      I:
        derived: SIM1_k.I
        kind: constant
    output_unit: μN/μm
    note: eq. S1 written as F = k*delta; the methods print k = 14 μN/μm for these parameters (not a record value, so no output);
      the measured k is 14.2 ± 2.4 μN/μm (SIM1_k.values.k), an independent validation
  SIM1_k.k_S3:
    item: SIM1_k
    formula: k = E*b*h**3/(2*(-x**3 + 3*L*x**2))
    anchor:
      quote: Combining Eqs. S1 and S2
      where: SI Methods, eq. S3
      file: pnas.201707316si.pdf
    library:
      formula: cantilever_point_load_stiffness_rect
      vars:
        k: k
        E: E
        w: b
        t: h
        L: L
        x: x
    inputs:
      E:
        printed: 1,500
        unit: kPa
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      b:
        printed: '0.5'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      h:
        printed: '0.2'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      L:
        printed: '0.7'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
      x:
        printed: '0.35'
        unit: mm
        anchor:
          quote: E = 1,500 kPa, b = 0.5 mm, h = 0.2 mm, L = 0.7 mm, x = 0.35 mm
          where: SI Methods, Force Analysis of hCO in Heart-Dyno
          file: pnas.201707316si.pdf
        kind: constant
    output_unit: μN/μm
    note: eq. S3 (S1 with S2); the methods print k = 14 μN/μm for these parameters, not stored as a record value
  F1D_force.force:
    item: F1D_force
    formula: F = k*delta
    anchor:
      quote: The pole deflection was used to approximate the force of contraction
      where: SI Methods, Force Analysis of hCO in Heart-Dyno
      file: pnas.201707316si.pdf
    library:
      formula: hooke_spring
      vars:
        F: F
        k: k
        x: delta
    inputs:
      k:
        printed: '14'
        unit: μN/μm
        anchor:
          quote: k = 14 μN/μm
          where: SI Methods, eq. S4
          file: pnas.201707316si.pdf
        kind: constant
      delta:
        not_stated: true
        kind: per sample
        note: pole deflection tracked per hCO; not printed or plotted
