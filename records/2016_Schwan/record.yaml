evidence:
  TXT1_beating:
    unit: TXT1
    measure: spontaneous beating
    method: observation (Supplementary Video 2)
    finding: regions of spontaneous beating two days post-seeding, synchronous contraction at approximately day five
    groups:
    - nrvm
    anchor:
      quote: Regions of spontaneous beating within the constructs were observed two days post-seeding
      where: Results, p. 6
    note: rests on Supplementary Video 2, not in the folder
  F3b_thickness:
    unit: F3b
    measure: EHT thickness
    method: optical coherence tomography, five evenly spaced images per EHT
    software: ImageJ; ThorImage OCT
    finding: thickness increases from day 3 until day 9
    compares:
    - d9
    - d3
    anchor:
      quote: More detailed tracking of EHT dimensions from day 3 to day 16 shows that remodeling starts immediately
      where: Results, p. 6
    stated_direction:
      direction: up
      anchor:
        quote: with thickness of the tissue increasing until day 9
        where: Results, p. 6
  F3b_width:
    unit: F3b
    measure: EHT width
    method: optical coherence tomography, five evenly spaced images per EHT
    software: ImageJ; ThorImage OCT
    finding: width decreases; compaction slows around day 12
    groups:
    - d3
    - d5
    - d7
    - d9
    - d12
    - d14
    - d16
    anchor:
      quote: Matrix compaction and tissue remodeling slowed down significantly around day 12
      where: Results, p. 6
    note: '''significantly'' with no test printed'
  F3b_diameter:
    unit: F3b
    measure: EHT diameter
    method: optical coherence tomography, five evenly spaced images per EHT
    finding: circular cross-section of about 250 µm diameter by day 16
    groups:
    - d16
    values:
      diameter_d16_text:
        printed: approximately 250
        unit: μm
        kind: value
        group: d16
      diameter_d16_discussion:
        printed: '250'
        unit: μm
        kind: mean
        group: d16
    anchor:
      quote: circular cross-section of approximately 250
      where: Results, p. 6
    note: 'the discussion repeats it: ''EHTs had an average diameter of 250 μm'''
  F3c_csa:
    unit: F3c
    measure: cross-sectional area
    method: optical coherence tomography, five evenly spaced images per EHT
    software: ImageJ
    definition: mean of five evenly spaced OCT cross-sections
    finding: cross-sectional area falls with age
    compares:
    - c9
    - c16
    - c23
    test_of: omnibus
    values:
      csa_d16_discussion:
        printed: ~0.1
        unit: mm2
        kind: mean
        group: c16
    anchor:
      quote: Measurements in 9-, 16-, and 23-day-old EHTs show a reduction in cross-sectional area of the tissue with age
      where: Results, p. 6
    stated_direction:
      direction: down
      anchor:
        quote: show a reduction in cross-sectional area of the tissue with age
        where: Results, p. 6
    note: no test printed; ~0.1 mm2 at day 16 from the Discussion
  F3d_striation:
    unit: F3d
    measure: sarcomere striations
    method: phalloidin and DAPI fluorescence staining, Leica LSM 510
    finding: striated actin pattern indicating organized sarcomeres
    groups:
    - nrvm
    anchor:
      quote: sections stained for myofilament proteins exhibited a striated pattern that indicated the pres
      where: Results, p. 6
  S1_distribution:
    unit: S1
    measure: cell distribution
    method: phalloidin/DAPI staining and Masson's trichrome
    finding: cells distributed evenly throughout the construct
    groups:
    - nrvm
    anchor:
      quote: Masson’s-trichrome Stain of longitudinally cut EHT. Nuclei (dark brown/black) are evenly distributed.
      where: Supplementary Fig. 1 legend
      file: srep32068-s1.pdf
  F3e_cx43:
    unit: F3e
    measure: connexin 43 gap junctions
    method: cardiac troponin T and connexin 43 immunofluorescence, Leica LSM 510
    finding: gap junctions between neighbouring cardiomyocytes after 16 days
    groups:
    - hesc
    anchor:
      quote: Note the formation of gap junctions between neighboring cardiomyocytes after 16 days in culture
      where: Fig. 3 legend
  F4b_stress:
    unit: F4ac
    measure: peak twitch stress
    method: isometric twitch force with a force transducer, field stimulation; stress = force / cross-sectional area (OCT);
      ten contractions averaged per stretch level
    definition: measured force divided by the cross-sectional area of the EHT
    finding: time in culture affected peak stress; 2.4-fold increase from day 9 to day 23
    compares:
    - d9
    - d16
    - d23
    test_of: omnibus
    n:
      printed: n = 11, 8 and 12 respectively
      counts: EHTs
      per_group:
        d9: '11'
        d16: '8'
        d23: '12'
    values:
      stress_d9:
        printed: '0.20'
        unit: mN/mm2
        kind: mean
        group: d9
        spread: SEM
        spread_source: methods
      stress_d9_sem:
        printed: '0.03'
        unit: mN/mm2
        kind: sem
        group: d9
        spread: SEM
        spread_source: methods
      stress_d23:
        printed: '0.49'
        unit: mN/mm2
        kind: mean
        group: d23
        spread: SEM
        spread_source: methods
      stress_d23_sem:
        printed: '0.08'
        unit: mN/mm2
        kind: sem
        group: d23
        spread: SEM
        spread_source: methods
      fold_d23_d9:
        printed: '2.4'
        unit: fold
        kind: ratio
        between:
        - d23
        - d9
    stats:
      test: one-way ANOVA
      p: p < 0.05
    anchor:
      quote: Time in culture significantly impacted EHT peak twitch stress (one-way ANOVA, p < 0.05)
      where: Results, p. 6
    note: stretch level of the printed means not stated
  F4c_gain_omnibus:
    unit: F4ac
    measure: length-stress gain
    method: isometric twitch force with a force transducer, field stimulation; stress = force / cross-sectional area (OCT);
      ten contractions averaged per stretch level
    definition: slope of the stretch-peak stress relationship, engineering strain as the unit for stretch
    finding: length-stress gain increased with time in culture
    compares:
    - d9
    - d16
    - d23
    test_of: omnibus
    n:
      printed: n = 11, 8 and 12 respectively
      counts: EHTs
      per_group:
        d9: '11'
        d16: '8'
        d23: '12'
    stats:
      test: ANOVA
      p: p < 0.01
    anchor:
      quote: increased significantly with time in culture (length-stress gain, p < 0.01, Fig. 4c)
      where: Results, p. 6
    note: text P; the legend's '*p < 0.05' marks the Tukey pair Day23 vs Day9 (F4c_gain_d23_d9)
  F4c_gain_d23_d9:
    unit: F4ac
    measure: length-stress gain
    method: isometric twitch force with a force transducer, field stimulation; stress = force / cross-sectional area (OCT);
      ten contractions averaged per stretch level
    definition: slope of the stretch-peak stress relationship, engineering strain as the unit for stretch
    finding: length-stress gain higher at day 23 than day 9
    compares:
    - d23
    - d9
    n:
      printed: n = 11, 8 and 12 respectively
      counts: EHTs
      per_group:
        d9: '11'
        d16: '8'
        d23: '12'
    stats:
      test: ANOVA, Tukey post hoc
      p: '*p < 0.05'
    anchor:
      quote: increase in mN/mm2 per unit engineering strain ANOVA, Tukey post hoc, *p < 0.05
      where: Fig. 4 legend
