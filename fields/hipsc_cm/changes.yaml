    label: viral transduction
    definition: Transduction of the cells with a viral vector carrying a transgene (the transgene, vector and multiplicity
      of infection are qualifiers).
    scope: Gene transfer by a viral vector; not a compound and not a mechanical intervention.
    qualifiers:
      transgene:
        dimension: text
      vector:
        dimension: text
      MOI:
        dimension: text
    lookup: searched 'transduction', 'lentiviral', 'GFP', 'green fluorescent protein' and 'GCaMP' in ChEBI 257; ChEBI holds
      chemicals, not gene transfer or proteins such as GFP or GCaMP
  - event: adopt_own
    field: treatment
