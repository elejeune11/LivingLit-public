<svg xmlns='http://www.w3.org/2000/svg' width='900' height='440' viewBox='0 0 900 440'><rect width='900' height='440' fill='#ffffff'/><text x='24.0' y='34.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#1f2328' font-weight='bold' text-anchor='start'>One reading checks every link of the chain</text><text x='24.0' y='56.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start' font-style='italic'>made-up paper: deflection read from a figure, force and stress printed with P values</text><rect x='24' y='76' width='268' height='80' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='36.0' y='98.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Post deflection</text><text x='36.0' y='118.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>read from a figure by code</text><text x='36.0' y='134.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>8 tissues per group</text><path d='M158.0 156.0 L158.0 182.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M292.0 116.0 L308.4 116.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M314.0 116.0 L307.0 119.5 L307.0 112.5 Z' fill='#9aa3ad'/><rect x='316' y='76' width='268' height='80' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='328.0' y='98.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Force</text><text x='328.0' y='118.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>via two_post_force_balance</text><text x='328.0' y='134.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>printed: P = 0.02</text><path d='M450.0 156.0 L450.0 182.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M584.0 116.0 L600.4 116.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M606.0 116.0 L599.0 119.5 L599.0 112.5 Z' fill='#9aa3ad'/><rect x='608' y='76' width='268' height='80' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='620.0' y='98.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Stress</text><text x='620.0' y='118.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>via F / A</text><text x='620.0' y='134.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>printed: mean ± SD, P = 0.04</text><path d='M742.0 156.0 L742.0 182.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><rect x='24' y='184' width='852' height='74' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='36.0' y='206.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Carried along by code</text><text x='36.0' y='226.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>Read deflections × k give force values; ÷ A give stress values, labelled derived by LivingLit.</text><text x='36.0' y='242.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>Every printed mean, spread and P on the chain is checked against them, not only the panel that was read.</text><path d='M450.0 258.0 L450.0 274.4' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M450.0 280.0 L446.5 273.0 L453.5 273.0 Z' fill='#9aa3ad'/><rect x='24' y='282' width='852' height='142' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='36.0' y='306.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Formulas across the chain</text><text x='560.0' y='306.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Result</text><path d='M36.0 316.0 L864.0 316.0' fill='none' stroke='#dfe3e7' stroke-width='1' stroke-linejoin='round'/><text x='36.0' y='338.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>Constant scaling: force and stress share one P if A is constant</text><text x='560.0' y='338.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='start'>0.02 vs 0.04: inconsistent if A constant</text><text x='36.0' y='360.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>Same n: the n of force carries to stress</text><text x='560.0' y='360.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>8 = 8: consistent</text><text x='36.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>A not stated as one constant or per tissue</text><text x='560.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>both run as labelled alternatives</text><text x='36.0' y='404.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>An input item found inconsistent upstream</text><text x='560.0' y='404.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>a separate flag; status unchanged</text></svg>
