mappings:
# ---------------------------------------------------------------- context
- field: wnt_activation_days
  stated: Forty-eight hours
  flag: {kind: not a context, note: "Stand-in kind: this IS one context, the quantity 48 h printed in words, but code's quantity parser does not read the hyphenated number word 'Forty-eight' and no flag kind fits; either the parser learns hyphenated number words or the reader writes '48 hours'."}
- field: purification
  stated: glucose-depleted medium with lactate
  terms: [purification:metabolic_selection]
  note: "The paper prints 'glucose-depleted culture medium with abundant lactate', so this shortened wording cannot be anchored as a synonym."
- field: purification
  stated: magnetic nanoparticle selection for CD34
  terms: [purification:immunomagnetic_selection]
  qualifiers: {marker: CD34}
- field: platform
  stated: hCMP
  terms: [platform:cast_patch]
  note: "No synonym: 'hCMP' (human cardiac muscle patch) is used by the lab for other patch formats too, so it would be broader than this term."
- field: mechanical_load
  stated: rocking
  flag: {kind: not a context, note: "Rocking (45 rpm) is the dynamic culture regime, already recorded in maturation_strategy ('dynamic rocking platform'); the paper states no mechanical load (anchoring, stretch or loading regime) for the free hCMP. Re-read mechanical_load."}
- field: mechanical_load
  stated: static
  flag: {kind: not a context, note: "'Static' is the fixed-platform culture condition, already recorded in maturation_strategy ('static culture condition'); the paper states no mechanical load regime. Re-read mechanical_load."}
- field: pacing
  stated: pacing
  terms: [pacing:electrical_pacing]
  note: "The legends say 'in response electronic pacing'; no synonym, since bare 'pacing' would also cover optical pacing in other papers."
- field: preparation
  stated: hCMP in a chamber
  terms: [preparation:intact_tissue]
- field: time_point
  stated: after incubation with BDM
  flag: {kind: not a context, note: "Names the BDM exposure (already in treatment) but no time; time_point takes a time or the state baseline. Re-read for an incubation time, or write not stated."}
- field: cm_medium
  stated: RPMI1640+B27
  terms: [cm_medium:rpmi_1640]
  split: [{words: B27, field: supplements}]
- field: platform
  stated: 4-well chamber slides
  terms: [platform:culture_2d]
  note: a culture vessel; mapped to the broader 2D culture term (monolayer is not stated); no synonym, a vessel name could hold any format
- field: preparation
  stated: fixed with 4% PFA
  terms: [preparation:fixed]
  qualifiers: {fixative: 4% PFA}
- field: treatment
  stated: hCMP-secreted exosomes
  terms: [treatment:exosomes]
  qualifiers: {source: hCMP}
- field: supplements
  stated: EGM 2-MV medium
  terms: [supplements:egm_2mv]
  note: "A commercial EC medium kit (basal medium plus supplements); cm_medium is for cardiomyocyte media and is 'not applicable' here, so the kit has no medium field of its own."
- field: platform
  stated: 24-well tissue culture plate
  terms: [platform:culture_2d]
  note: a culture vessel holding cells on a Matrigel layer; mapped to the broader 2D culture term
- field: preparation
  stated: perfused hCMP
  terms: [preparation:intact_tissue]
- field: preparation
  stated: ventricular epicardium
  terms: [preparation:intact_tissue]
  note: rabbit left-ventricular myocardium of a cited study, measured on the epicardium
- field: platform
  stated: 12-well plates
  terms: [platform:culture_2d]
  note: a culture vessel holding hiPSC-CMs on Matrigel; mapped to the broader 2D culture term
- field: treatment
  stated: hCMP-Exo + GW4869
  terms: [treatment:exosomes, CHEBI:231549]
  qualifiers: {source: hCMP}
- field: treatment
  stated: hCMP-Exo + annexin V
  terms: [treatment:exosomes, CHEBI:758841]
  qualifiers: {source: hCMP}
- field: treatment
  stated: EC-Exo
  terms: [treatment:exosomes]
  qualifiers: {source: monolayer culture of hiPSC-ECs}
- field: treatment
  stated: SMC-Exo
  terms: [treatment:exosomes]
  qualifiers: {source: monolayer culture of hiPSC-SMCs}
- field: treatment
  stated: CM-Exo
  terms: [treatment:exosomes]
  qualifiers: {source: monolayer culture of hiPSC-CMs}
- field: treatment
