    label: mesothelial cell of epicardium
    lookup: cl 'epicardial cell' (no hit), 'epicardial' (only epicardial adipocytes), 'epicardium' -> CL:0011019; epicardial
      cells are the mesothelial cells of the epicardium
    synonyms:
