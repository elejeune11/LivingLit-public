record: 2019_Zhao
formula_library_version: 14
agent:
  model: llm
  instructions: formulas_v3
derived:
  S4O_force_cell.per_cm_riegler:
    item: S4O_force_cell
    group: riegler
    formula: f = F/N
    anchor: &id001
      quote: Active force/Input CM
      where: Fig. S4O table header (supplement 4)
    library:
      formula: ratio_def
      vars:
        r: f
        a: F
        b: N
    inputs:
      F:
        value: S4O_force.values.force_riegler
        part: mean
        kind: constant
      N:
        value: S4O_input.values.input_riegler
        kind: constant
    output: S4O_force_cell.values.force_cell_riegler
    output_unit: nN
    note: Printed unit nN/Cell is nN per one CM (the count is dimensionless), given as nN for code's unit table. Column header names
      the operation (active force divided by input number of CMs); the force is a group mean and the CM count one constant, so the ratio
      of means equals the mean of ratios.
