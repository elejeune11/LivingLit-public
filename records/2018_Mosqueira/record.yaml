evidence:
  F1e_purity:
    unit: F1e
    measure: cardiomyocyte purity
    finding: differentiation purity was above 90% α-actinin positive cells
    anchor:
      quote: Cardiomyocyte differentiation purity >90% α-actinin
      where: Fig. 1 legend
    method: α-actinin immunostaining read by high-content imaging
    software: Harmony high-content imaging analysis software
    groups: &id007
    - a_ww
    - a_mw
    - a_mm
    - a_mm6
    - a_kk
    - r_ww
    - r_mw
    - r_mm
    - h_ww
    - h_mw
    - h_mm
    n:
      printed: n = 8
      counts: biological replicates
    values:
      purity_legend:
        printed: '>90'
        unit: '%'
        kind: percent
        over: *id007
  F1e_cutoff:
    unit: F1e
    measure: cardiomyocyte purity
    finding: only cultures above 85% α-actinin positive were used
    anchor:
      quote: 85% α-actinin positive were used
      where: Results, CRISPR/Cas9 engineering and characterization of MYH7 variants
    groups: *id007
    n:
      printed: n = 8
      counts: biological replicates
    values:
      purity_text:
        printed: ≥85
        unit: '%'
        kind: percent
        over: *id007
    note: a selection criterion stated in the text; the figure legend states purity >90%
  F1f_ratio:
    unit: F1f
    measure: 'MUT: WT MYH7 allele expression ratio'
    finding: in heterozygotes the ratio of mutant to wild-type MYH7 alleles ranged from 25% to 60% between lines
    anchor:
      quote: 'In heterozygotes, the ratio of MUT: WT alleles ranged from 25% to 35% (HUES7, REBL-PAT) to 60% (AT1), confirming
        unequal expression but also variation between lines'
      where: Results, Molecular assessment of β-MHC mutant hPSC-CMs
    method: XhoI-based restriction fragment length polymorphism with band densitometry
    software: AIDA Image Analyzer software
    groups:
    - a_mw
    - r_mw
    - h_mw
    n:
      printed: n = 4
      counts: biological replicates
    values:
      ratio_lo_text:
        printed: '25'
        unit: '%'
        kind: percent
        over:
        - r_mw
        - h_mw
      ratio_hi_text:
        printed: '35'
        unit: '%'
        kind: percent
        over:
        - r_mw
        - h_mw
      ratio_at1_text:
        printed: '60'
        unit: '%'
        kind: percent
        group: a_mw
      ratio_at1_discussion:
        printed: '60'
        unit: '%'
        kind: percent
        group: a_mw
      ratio_rpat_discussion:
        printed: '35'
        unit: '%'
        kind: percent
        group: r_mw
      ratio_hues7_discussion:
        printed: '25'
        unit: '%'
        kind: percent
        group: h_mw
    note: 'the discussion prints the ratios per line: AT1 60%, REBL-PAT 35%, HUES7 25%'
  F2bc_a_mw:
    unit: F2bc
    measure: cardiomyocyte volume
    finding: median cardiomyocyte volume was higher in the gene-edited line than in its isogenic control
