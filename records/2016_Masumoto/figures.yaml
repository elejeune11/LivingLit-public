      twod_vs_cm: {item: F2a_kappa_cm_vs_twod, group: twod, unit_of_value: κ}
      ce: {item: F2a_kappa_cem_vs_ce, group: ce, unit_of_value: κ}
      ce_vs_cm: {item: F2a_kappa_cm_vs_ce, group: ce, unit_of_value: κ}
      cm: {item: F2a_kappa_cm_vs_twod, group: cm, unit_of_value: κ}
      cm_vs_ce: {item: F2a_kappa_cm_vs_ce, group: cm, unit_of_value: κ}
      cem: {item: F2a_kappa_cem_vs_twod, group: cem, unit_of_value: κ}
      cem_vs_ce: {item: F2a_kappa_cem_vs_ce, group: cem, unit_of_value: κ}
    note: >-
      Fig. 2a right, one bar chart of the concentration parameter (κ, 0-8, nine ticks; dimensionless, printed axis
      title "Concentration parameter (κ)"); label = group. Bars only (mean and upper end of the error bar, SD per
      Methods); no points drawn, so the legend's n = 3 (2D) and 5 (each 3D) cannot be counted. Each bar serves two
      items, so each is returned under a second label (<group>_vs_<other>) linked to its other item.
  s9b_circular_sd:
