  F4j_MYH7_MYH6_icmf_rc.ratio:
    item: F4j_MYH7_MYH6_icmf_rc
    formula: r = a/b
    anchor:
      quote: Gene expression relative to GAPDH in the random cluster, micropatterned single, and iCMFs of sarcomere gene TNNT2
        (i) and MYH7/MYH6 (j)
      where: Fig. 4 legend
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        derived: F4j_MYH7_MYH6_icmf_rc.myh7_expression
        kind: per sample
      b:
        derived: F4j_MYH7_MYH6_icmf_rc.myh6_expression
        kind: per sample
    aggregation: not stated
    alternatives:
    - label: ratio of 2^-ΔCt values (no calibrator)
      formula: r = 2^(-(dct7 - dct6))
      note: differs from the ratio of 2^-ΔΔCt values by the calibrator's MYH7/MYH6 ratio, one constant factor
    note: MYH7/MYH6 written as a ratio of the two genes' relative expressions; how the ratio was formed is not stated.
