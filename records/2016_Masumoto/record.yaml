      r2_example_cem:
        printed: '0.978'
        unit: dimensionless
        kind: value
        group: cem
        spread: none
    anchor:
      quote: '(average R2 value: 0.972 in CM+EC, 0.961 in CM+MC, 0.973 in CM+EC+MC)'
      where: Results p. 3
    note: r2_example values are printed in the figure legend box of the representative plot (image); r2_mean values are the
      text's averages.
  S8a_force_calcium:
    unit: S8a
    measure: active force (increase ratio)
    method: custom intact muscle test system; force transducer (model 403A, Aurora Scientific) and high-speed length controller
      (model 322C); measured at Lmax
    software: not stated
    finding: Active force increase ratio against external Ca2+ for each ECT type (curves).
    groups:
    - ce
    - cm
    - cem
    anchor:
      quote: Increase ratio of active force according to gradually increasing external Ca2+ concentration (0-5mM)
      where: Supplementary Fig. 8 legend (a)
      file: srep29933-s1.pdf
    note: Curve points (0, 0.625, 1.25, 2.5, 5.0 mM) are for the figures reader.
  S8a_ec50_omnibus:
    unit: S8a
    measure: Ca2+ EC50
    method: custom intact muscle test system; force transducer (model 403A, Aurora Scientific) and high-speed length controller
      (model 322C); measured at Lmax
    software: not stated
    definition: &id025
      citation: c28
      anchor:
        quote: EC50 (half maximal effective concentration) was calculated using spline curve calculated from active force
          on each Ca2+ concentration points as previously reported
        where: Supplementary Methods
        file: srep29933-s1.pdf
    finding: Ca2+ EC50 not different among the three ECT types (P=0.45).
    compares:
    - ce
    - cm
    - cem
    test_of: omnibus
    stats:
      test: one-way or two-way repeated analysis of variance (ANOVA) followed by Tukey's test as post hoc (Methods)
      p: P=0.45
    anchor:
      quote: EC50 (half maximal effective concentration) calculated from spline curve
      where: Supplementary Fig. 8 legend (a)
      file: srep29933-s1.pdf
    note: P printed in the figure (image).
  S8a_ec50_text:
    unit: S8a
    measure: Ca2+ EC50
    definition: *id025
    finding: Ca2+ EC50 of the ECTs around 1 mM.
    groups:
    - ce
    - cm
    - cem
    values:
      ec50_all:
        printed: around 1
        unit: mM
        kind: value
        over:
        - ce
        - cm
        - cem
        spread: none
    anchor:
      quote: the Ca2+ EC50 (half maximal effective concentration) values of our ECTs (Supplementary Fig. 8a) (around 1 mM)
      where: Results p. 3
  S8a_ec50_ref28:
    unit: S8a
    measure: Ca2+ EC50
    finding: Reported Ca2+ EC50 of adult human muscle strips around 3.0 mM (ref. 28).
    groups:
    - ref28
    values:
      ec50_ref:
        printed: around 3.0
        unit: mM
        kind: value
        group: ref28
        spread: none
    anchor:
      quote: much lower than those reported as those for adult human muscle strips (around 3.0 mM)
      where: Results p. 3
  S8b_caffeine_omnibus:
    unit: S8b
    measure: active force increase on caffeine
    method: custom intact muscle test system; force transducer (model 403A, Aurora Scientific) and high-speed length controller
      (model 322C); measured at Lmax; caffeine administered to the perfusion chamber, at Lmax without pacing
    software: not stated
    finding: Active force increase on 5 mM caffeine not different among ECT types (P=0.10).
    compares:
    - ce
    - cm
    - cem
    test_of: omnibus
    values: {}
    stats:
      test: one-way or two-way repeated analysis of variance (ANOVA) followed by Tukey's test as post hoc (Methods)
      p: P=0.10
    anchor:
      quote: Fold increase of active force corresponding to 5mM caffeine administration (right)
      where: Supplementary Fig. 8 legend (b)
      file: srep29933-s1.pdf
    note: 'P printed in the figure (image). Axis: Active force (fold increase corresponding to caffeine) in %.'
