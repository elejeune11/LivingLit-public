        derived: F3mn_force_per_cm.n_cm_cmonly
        kind: constant
    aggregation: not stated
  F3mn_force_per_cm.ratio:
    item: F3mn_force_per_cm
    formula: r = ft/fc
    anchor: *id016
    library:
      formula: ratio_def
      vars:
        r: r
        a: ft
        b: fc
    inputs:
