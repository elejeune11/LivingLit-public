        not_stated: true
        kind: per sample
        note: engrafted cells per gram from the qPCR standard curve
  F4_engraftment.rate:
    item: F4_engraftment
    group: mi_hcmp
    formula: rate = n_eng/n_admin
    anchor:
      quote: the final engraftment rate of each animal was calculated as the total number of engrafted
      where: Supplemental Methods, Engraftment rate
      file: NIHMS936001-supplement-Supple_manuscript.pdf
    library:
      formula: ratio_def
      vars:
        r: rate
        a: n_eng
        b: n_admin
    inputs:
      n_eng:
        not_stated: true
        kind: per sample
        note: sum over the samples of F4_engraftment.cells_per_sample; per-heart totals not printed
      n_admin:
        printed: 1.6x10 7
        unit: cells
        kind: constant
        anchor:
          quote: divided by the number of cells administered (1.6x10 7)
          where: Supplemental Methods, Engraftment rate
          file: NIHMS936001-supplement-Supple_manuscript.pdf
