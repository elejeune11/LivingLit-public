    output: F3H_erythrocytes.values.pct_of_cells_fig
  # ---------------------------------------------------------------- Fig. 3H / S2G: shares of cardiomyocytes
  F3H_atrial_cm.cm_total:
    item: F3H_atrial_cm
    group: ml_d100
    formula: cm = atr + ven + unsp
    anchor: not stated
    library: {formula: sum_of_three_parts, vars: {t: cm, a: atr, b: ven, c: unsp}}
    inputs:
      atr: {value: F3H_atrial_cm.values.count_table, kind: constant}
      ven: {value: F3H_ventricular_cm.values.count_table, kind: constant}
      unsp: {value: F3H_cardiomyocytes.values.count_table, kind: constant}
    output_unit: cells
    note: The paper does not say which classes make up 'the organoid cardiomyocytes'; taken as the three cardiomyocyte
      classes of Fig. S2G (atrial CM, ventricular CM, cardiomyocytes). No printed output; the denominator of the shares below.
  F3H_atrial_cm.pct_of_cm_text:
    item: F3H_atrial_cm
    group: ml_d100
    formula: pct = count/cm
    anchor: &cmpct
      quote: The classifier estimated that 98% of the organoid cardiomyocytes were atrial cardiomyocytes
      where: Results, Long-term culture
    library: &ratio_cm {formula: ratio_def, vars: {r: pct, a: count, b: cm}}
    inputs:
      count: {value: F3H_atrial_cm.values.count_table, kind: constant}
      cm: &cm {derived: F3H_atrial_cm.cm_total, kind: constant}
    output: F3H_atrial_cm.values.pct_of_cm_text
  F3H_atrial_cm.pct_of_cm_table:
    item: F3H_atrial_cm
    group: ml_d100
    formula: pct = count/cm
    anchor: *cmpct
    library: *ratio_cm
    inputs:
      count: {value: F3H_atrial_cm.values.count_table, kind: constant}
      cm: *cm
    output: F3H_atrial_cm.values.pct_of_cm_table
  F3H_ventricular_cm.pct_of_cm_text:
    item: F3H_ventricular_cm
    group: ml_d100
