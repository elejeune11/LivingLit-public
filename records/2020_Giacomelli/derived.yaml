record: 2020_Giacomelli
formula_library_version: 14
agent:
  model: llm
  instructions: formulas_v3
derived:
  F4G_dur_cmec.ncd:
    item: F4G_dur_cmec
    formula: ncd = cd/sqrt(ibi)
    anchor: &id001
      quote: Normalized contraction duration = contraction duration / sqrt (IBI).
      where: STAR Methods
    library:
      formula: bazett_rate_correction
      vars:
        dc: ncd
        d: cd
        RR: ibi
    inputs:
      cd:
        not_stated: true
        kind: per sample
        note: contraction duration of each spontaneously beating MT; not printed
      ibi:
        item: F4F_ibi_cmec
        kind: per sample
        note: each MT's own inter-beat interval (Fig. 4F); no values printed or read
    aggregation: mean of per-sample
    note: IBI unit for the square root not stated; the library form takes durations and IBI in seconds
