        r: p
        a: ns
        b: n
    inputs:
      ns:
        not_stated: true
        kind: per sample
        note: DAPI-positive cells positive for alpha-actinin
      n:
        not_stated: true
        kind: per sample
        note: DAPI-positive cells
    output_unit: '%'
  F2c_mito.percent_area:
    item: F2c_mito
    formula: p = Am/At
    anchor:
      quote: The per cent area of mitochondria in early-stage intensity-trained tissues
      where: main text, p. 240
    library:
      formula: ratio_def
      vars:
        r: p
        a: Am
        b: At
    inputs:
      Am:
        not_stated: true
        kind: per sample
        note: area covered by mitochondria
      At:
        not_stated: true
        kind: per sample
        note: area analysed (reference area not stated)
    output: F2c_mito.values.e_int
    aggregation: mean of per-sample
    note: the printed value is a mean over samples of per-sample fractions (released data hold one percentage per sample)
  ED5c_area.pct_change:
    item: ED5c_area
    formula: p = (Ac - Ar)/Ar
    anchor:
      quote: per cent change between the contracted and relaxed state
      where: Methods, Change in tissue area
    library:
      formula: relative_change
      vars:
        d: p
        x: Ac
        x0: Ar
    inputs:
      Ac:
        not_stated: true
        kind: per sample
        note: projected area, contracted
      Ar:
        not_stated: true
        kind: per sample
        note: projected area, relaxed
    alternatives:
    - label: change relative to the contracted area (reference state not stated)
      formula: p = (Ar - Ac)/Ac
  ED5c_area.normalized:
    item: ED5c_area
    formula: q = p/p6
    anchor:
      quote: Data represent the ratio of the change in area for a given time point and the change in area at day 6
      where: Extended Data Fig. 5 legend
    library:
      formula: ratio_def
      vars:
        r: q
        a: p
        b: p6
    inputs:
      p:
        derived: ED5c_area.pct_change
        kind: per sample
      p6:
        not_stated: true
        kind: not stated
        note: change in area at day 6; per tissue or group mean not stated
    alternatives:
    - label: each tissue normalised to its own day-6 value
    - label: normalised to the group mean at day 6
