record: 2021_Zhang
formula_library_version: 2
agent:
  model: llm
  instructions: formulas_v2
derived:
  # ---- CMT force from pillar deflection (Hooke; detail by reference to ref41)
  F4C_het.force:
    item: F4C_het
    measure: peak systolic force
    formula: F = k*x
    anchor:
      quote: based on the deflection of the pillars and the measured pillar spring constant of 2.68 µN/m
      where: Methods, Cardiac microtissues
    library:
      formula: hooke_spring
      vars: {F: F, k: k, x: x}
    inputs:
      k:
        printed: '2.68'
        unit: µN/m
        anchor:
          quote: constant of 2.68 µN/m
          where: Methods, Cardiac microtissues
        kind: constant
      x:
        not_stated: true
        kind: per sample
        note: pillar deflection per CMT, tracked in videos; not printed
    alternatives:
    - label: two-post force balance (tension = k times the deflection of one pillar)
      note: which deflection enters (one pillar, the mean of both, or their sum) is not stated; the method is by reference (41)
    - label: sum of both pillars' deflections
      formula: F = k*(x1 + x2)
    note: no force value is printed; group values exist only as figure readings (fig4C), so nothing is rebuilt. The printed spring
      constant unit (µN/m) is recorded as stated.
  F4C_hom.force:
    item: F4C_hom
    measure: peak systolic force
    formula: F = k*x
    anchor:
      quote: based on the deflection of the pillars and the measured pillar spring constant of 2.68 µN/m
      where: Methods, Cardiac microtissues
    library:
      formula: hooke_spring
      vars: {F: F, k: k, x: x}
    inputs:
      k:
        printed: '2.68'
        unit: µN/m
        anchor:
          quote: constant of 2.68 µN/m
          where: Methods, Cardiac microtissues
        kind: constant
      x:
        not_stated: true
        kind: per sample
        note: pillar deflection per CMT, tracked in videos; not printed
    alternatives:
    - label: two-post force balance (tension = k times the deflection of one pillar)
      note: which deflection enters (one pillar, the mean of both, or their sum) is not stated; the method is by reference (41)
    - label: sum of both pillars' deflections
      formula: F = k*(x1 + x2)
  # ---- CMT stress = force / cross-sectional area (area by reference; kind not stated)
  F4D_het.stress:
    item: F4D_het
    measure: peak systolic stress
    formula: s = F/A
    anchor:
      quote: Maximum contractile force, stress, and contraction kinetics were calculated using a custom MATLAB script
      where: Methods, Cardiac microtissues
    library:
      formula: stress_def
      vars: {sigma: s, F: F, A: A}
    inputs:
      F:
        item: F4C_het
        kind: per sample
      A:
        by_reference:
          citation: ref41
          anchor:
            quote: based on the deflection of the pillars and the measured pillar spring constant of 2.68 µN/m, as described previously (41)
            where: Methods, Cardiac microtissues
        kind: not stated
        note: the paper names no area, no tissue dimension, and does not say whether one area is used for all CMTs or one per tissue
    alternatives:
    - label: one constant cross-sectional area for every CMT
      note: stress would then be force scaled by a constant, and its P would equal the force P
    - label: cross-sectional area measured per CMT
      note: stress P may then differ from force P
    note: 'stress = force / area is the definition of stress; the paper states only that stress was calculated from pillar deflection
      by the method of ref41, so the area enters by reference'
  F4D_hom.stress:
    item: F4D_hom
    measure: peak systolic stress
    formula: s = F/A
    anchor:
      quote: Maximum contractile force, stress, and contraction kinetics were calculated using a custom MATLAB script
      where: Methods, Cardiac microtissues
    library:
      formula: stress_def
      vars: {sigma: s, F: F, A: A}
    inputs:
      F:
        item: F4C_hom
        kind: per sample
      A:
        by_reference:
          citation: ref41
          anchor:
            quote: based on the deflection of the pillars and the measured pillar spring constant of 2.68 µN/m, as described previously (41)
            where: Methods, Cardiac microtissues
        kind: not stated
        note: the paper names no area, no tissue dimension, and does not say whether one area is used for all CMTs or one per tissue
    alternatives:
    - label: one constant cross-sectional area for every CMT
    - label: cross-sectional area measured per CMT
  # ---- relative expression 2^-ddCt (proposal ddct_relative_expression)
  F1D_het.rel:
    item: F1D_het
    measure: PKP2 RNA expression
    formula: r = 2^(-ddct)
    anchor:
      quote: Relative gene expression is calculated as 2−ΔΔCT ± SEM
      where: Methods, Reverse transcription quantitative PCR
    library:
      formula: ddct_relative_expression
      vars: {r: r, ddct: ddct}
    inputs:
      ddct:
        not_stated: true
        kind: per sample
        note: ddct = (Ct PKP2 - Ct PSMB2) of a sample minus the mean of that difference over WT repeats; no Ct value is printed
    output: F1D_het.values.rel
    note: the printed 63.2 % is the group mean of per-sample 2^-ddct relative to WT1, not one sample's value
  F1D_hom.rel:
    item: F1D_hom
    measure: PKP2 RNA expression
    formula: r = 2^(-ddct)
    anchor:
      quote: Relative gene expression is calculated as 2−ΔΔCT ± SEM
      where: Methods, Reverse transcription quantitative PCR
    library:
      formula: ddct_relative_expression
      vars: {r: r, ddct: ddct}
    inputs:
      ddct:
        not_stated: true
        kind: per sample
        note: ddct = (Ct PKP2 - Ct PSMB2) of a sample minus the mean of that difference over WT repeats; no Ct value is printed
    output: F1D_hom.values.rel
    note: the printed 32.5 % is the group mean of per-sample 2^-ddct relative to WT2, not one sample's value
  # ---- FRAP percentage recovery: normalised to an unbleached reference, then divided by pre-bleach intensity
  F7B_het.normalized:
    item: F7B_het
    measure: junctional N-cadherin FRAP
    formula: In = I/Iref
    anchor:
      quote: normalized to an unbleached reference region, and divided by the intensity in the ROI before photobleaching
      where: Methods, Fluorescence recovery from photobleaching
    library:
      formula: ratio_def
      vars: {r: In, a: I, b: Iref}
    inputs:
      I:
        not_stated: true
        kind: per sample
        note: background-subtracted intensity of the bleached ROI at each time point
      Iref:
        not_stated: true
        kind: per sample
        note: intensity of the unbleached reference region
  F7B_het.recovery:
    item: F7B_het
    measure: junctional N-cadherin FRAP
    formula: R = In/I0
    anchor:
      quote: normalized to an unbleached reference region, and divided by the intensity in the ROI before photobleaching
      where: Methods, Fluorescence recovery from photobleaching
    library:
      formula: ratio_def
      vars: {r: R, a: In, b: I0}
    inputs:
      In:
        derived: F7B_het.normalized
        kind: per sample
      I0:
        not_stated: true
        kind: per sample
        note: ROI intensity before photobleaching; whether it was also normalised to the reference is not stated
    output_unit: '%'
    alternatives:
    - label: pre-bleach intensity also normalised to the reference region (double normalisation)
      formula: R = (I/Iref)/(I0/Iref0)
  F7B_hom.normalized:
    item: F7B_hom
    measure: junctional N-cadherin FRAP
    formula: In = I/Iref
    anchor:
      quote: normalized to an unbleached reference region, and divided by the intensity in the ROI before photobleaching
      where: Methods, Fluorescence recovery from photobleaching
    library:
      formula: ratio_def
      vars: {r: In, a: I, b: Iref}
    inputs:
      I:
        not_stated: true
        kind: per sample
      Iref:
        not_stated: true
        kind: per sample
  F7B_hom.recovery:
    item: F7B_hom
    measure: junctional N-cadherin FRAP
    formula: R = In/I0
    anchor:
      quote: normalized to an unbleached reference region, and divided by the intensity in the ROI before photobleaching
      where: Methods, Fluorescence recovery from photobleaching
    library:
      formula: ratio_def
      vars: {r: R, a: In, b: I0}
    inputs:
      In:
        derived: F7B_hom.normalized
        kind: per sample
      I0:
        not_stated: true
        kind: per sample
    output_unit: '%'
    alternatives:
    - label: pre-bleach intensity also normalised to the reference region (double normalisation)
      formula: R = (I/Iref)/(I0/Iref0)
  # ---- TFM RMS stress (proposal root_mean_square)
  F5D_het.rms:
    item: F5D_het
    measure: RMS systolic stress
    formula: S = sqrt(Q/n)
    anchor:
      quote: Root mean squares (RMSs) of the magnitudes of stress vectors
      where: Methods, Traction force microscopy
    library:
      formula: root_mean_square
      vars: {S: S, Q: Q, n: n}
    inputs:
      Q:
        not_stated: true
        kind: per sample
        note: sum of squared stress-vector magnitudes |S1|^2 + ... + |Sn|^2 over the user-defined area
      n:
        not_stated: true
        kind: per sample
        note: number of stress vectors in the area
    note: the paper prints S_RMS = sqrt((|S1|^2 + ... + |Sn|^2)/n); Q names the sum of squares
  F5D_hom.rms:
    item: F5D_hom
    measure: RMS systolic stress
    formula: S = sqrt(Q/n)
    anchor:
      quote: Root mean squares (RMSs) of the magnitudes of stress vectors
      where: Methods, Traction force microscopy
    library:
      formula: root_mean_square
      vars: {S: S, Q: Q, n: n}
    inputs:
      Q: {not_stated: true, kind: per sample}
      n: {not_stated: true, kind: per sample}
  F6D_het.rms:
    item: F6D_het
    measure: RMS systolic stress
    formula: S = sqrt(Q/n)
