    where: Methods, Fabrication of organoids and spheroids
- field: replating_coating
  value: gelatin-coated 96-well plates
  anchor:
    quote: cells were plated for 2 d on gelatin-coated 96-well plates (20,000 cells per well)
    where: Methods, Drug testing
