  F6H_df.developed_force:
    item: F6H_df
    formula: not stated
    anchor:
      quote: developed force (DF; calculated from the post deflection with each twitch)
      where: Methods, Engineered heart tissue deflection analysis
    no_formula: developed force is defined by citation (Turnbull et al., 2014); the paper does not state DF = systolic - diastolic
    inputs:
      twitch:
        by_reference:
          citation: Turnbull2014
          anchor:
            quote: as previously described (Turnbull et al., 2014)
            where: Methods, Engineered heart tissue deflection analysis
        kind: per sample
    alternatives:
    - label: systolic minus diastolic force (difference_from_reference on the F6H_sys and F6H_dia readings)
      formula: DF = Fsys - Fdia
  F6H_t2r.ratio:
    item: F6H_t2r
    formula: r = t90/tpk
    anchor:
      quote: the ratio of time to the 90th percentile of relaxation (T2Rlx90) relative to the time to peak (T2Pk)
      where: Results
    library:
      formula: ratio_def
      vars:
        r: r
        a: t90
        b: tpk
    inputs:
      t90:
        not_stated: true
        kind: per sample
        note: T2Rlx90, not printed or plotted
      tpk:
        not_stated: true
        kind: per sample
        note: T2Pk, not printed or plotted
    aggregation: not stated
  F5G_ocr.per_cell:
    item: F5G_ocr
    formula: r = ocr/cells
    anchor:
      quote: Cell numbers were normalized using Methylene Blue staining
      where: Methods, Seahorse analysis
    library:
      formula: ratio_def
      vars:
        r: r
        a: ocr
        b: cells
    inputs:
      ocr:
        not_stated: true
        kind: per sample
        note: OCR per well
      cells:
        not_stated: true
        kind: per sample
        note: cell number per well from Methylene Blue staining
    note: normalisation to cell number; the exact operation (per cell, per 1,000 cells, or relative) is done in Seahorse Wave and not
      stated
