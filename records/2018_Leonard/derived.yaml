  F2_resolution_K4.force_per_pixel:
    item: F2_resolution_K4
    group: K4
    measure: force resolution of post tracking
    formula: F = k*p
    anchor: *id001
    library:
      formula: hooke_spring
      vars:
        F: F
        k: k
        x: p
    inputs:
      k:
        value: F1_stiffness_text.values.K4_text
        kind: constant
      p:
        printed: '8.3'
        unit: μm
        anchor:
          quote: 65 frames per second (FPS) with 8.3 μm/pixel resolution
          where: Section 2.3
        kind: constant
        note: one pixel of post movement
    output: F2_resolution_K4.values.force_per_pixel
    output_unit: μN
    note: the printed 76 μN/pixel is the force of one pixel (8.3 μm) of K4 post deflection; output unit per pixel
  F2_csa.area:
    item: F2_csa
    measure: cross-sectional area
    formula: A = pi/4*w*t
    anchor:
      quote: The cross-sectional area was calculated assuming an elliptical cross section (A = π/4 × width × thickness)
      where: Section 2.1
    library:
      formula: elliptical_cross_section_area
      vars:
        A: A
        a: w
        b: t
    inputs:
      w:
        not_stated: true
        kind: per sample
        note: tissue width from image analysis, per tissue; not printed
      t:
        printed: '500'
        unit: μm
        anchor:
          quote: the thickness was conservatively estimated be to 500 μm
          where: Section 2.1
        kind: constant
    output: F2_csa.values.all_mean
    aggregation: mean of per-sample
  F2_stress_K4vK1.stress_K1:
    item: F2_stress_K4vK1
    group: K1
    measure: twitch stress
    formula: s = F/A
    anchor: &id002
      quote: when the twitch force of each tissue was normalized by its cross-sectional area
      where: Section 3.2
    library:
      formula: stress_def
      vars:
        sigma: s
        F: F
        A: A
    inputs:
      F:
        value: F2_force_text.values.K1_mean_text
        kind: per sample
      A:
        value: F2_csa.values.all_mean
        kind: per sample
        note: each tissue has its own area; only the mean over all four groups is printed
    output_unit: mN/mm2
    alternatives:
    - label: mean of per-sample (as the paper states)
      formula: s_i = F_i/A_i
      note: per-tissue F and A are not printed or read, so only the ratio of means can be rebuilt
    note: 'no printed stress value: the rebuilt ratio of means (pooled area) is for comparison with the Fig. 2B stress panel;
      applies to every F2_stress_* item holding this group'
  F2_stress_K2vK1.stress_K2:
