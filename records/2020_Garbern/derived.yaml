record: 2020_Garbern
formula_library_version: 20
agent:
  model: llm
  instructions: formulas_v3
derived:
  F3A_profile.baseline:
    item: F3A_profile
    measure: baseline oxygen consumption rate
    formula: ocr_base = S/n
    anchor:
      quote: Baseline OCR values were calculated by averaging the first three OCR measurements (0-12 minutes) prior to injection of
        compounds
      where: Supplemental Methods, Seahorse
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: mean_def
      vars:
        m: ocr_base
        S: S
        n: n
    inputs:
      S:
        not_stated: true
        kind: per sample
        note: sum of the first three OCR measurements of a well; not printed
      n:
        printed: '3'
        unit: count
        kind: constant
        anchor:
          quote: Baseline OCR values were calculated by averaging the first three OCR measurements
          where: Supplemental Methods, Seahorse
          file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
        note: printed as the word 'three'
    note: Per well.
  F3A_profile.normalized_to_baseline:
    item: F3A_profile
    measure: oxygen consumption rate normalized to baseline
    formula: ocr_norm = ocr/ocr_base
    anchor:
      quote: Data were normalized to the average baseline value for each well.
      where: Supplemental Methods, Seahorse
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: ratio_def
      vars:
        r: ocr_norm
        a: ocr
        b: ocr_base
    inputs:
      ocr:
        not_stated: true
        kind: per sample
        note: OCR of a well at each measurement (already per cell number by CyQUANT); not printed
      ocr_base:
        derived: F3A_profile.baseline
        kind: per sample
    note: Per well. The earlier normalisation to absolute cell number (same well, same divisor) cancels in this ratio.
  F3B_max.maximal_ocr:
    item: F3B_max
    measure: maximal oxygen consumption rate
    formula: ocr_max = ocr_fccp - ocr_nonmito
    anchor:
      quote: maximal OCR values were calculated by subtracting the average non-mitochondrial OCR values (OCR following rotenone/actinomycin
        A) from the OCR values after the injection with the uncoupler FCCP
      where: Supplemental Methods, Seahorse
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: sum_of_parts
      vars:
        t: ocr_fccp
        a: ocr_max
        b: ocr_nonmito
    inputs:
      ocr_fccp:
        not_stated: true
        kind: per sample
        note: OCR after FCCP, normalized to baseline; plotted in the Fig. 3A profile, not read
      ocr_nonmito:
        item: F3B_nonmito
        kind: per sample
    aggregation: not stated
    note: All terms normalized to each well's baseline (a common divisor, so the order of subtraction and normalisation does not matter).
  F3B_reserve.reserve_capacity:
    item: F3B_reserve
    measure: respiratory reserve capacity
    formula: ocr_reserve = ocr_fccp - ocr_base
    anchor:
      quote: respiratory reserve capacity values were calculated by subtracting baseline OCR values from OCR values after addition of
        FCCP
      where: Supplemental Methods, Seahorse
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: sum_of_parts
      vars:
        t: ocr_fccp
        a: ocr_reserve
        b: ocr_base
    inputs:
      ocr_fccp:
        not_stated: true
        kind: per sample
        note: OCR after FCCP, normalized to baseline; plotted in the Fig. 3A profile, not read
      ocr_base:
        not_stated: true
        kind: constant
        note: baseline OCR after normalisation to the well's own baseline (1, i.e. 100 %, by construction); not printed
    aggregation: not stated
    note: With every well normalized to its own baseline, the normalized reserve is the normalized FCCP OCR minus 1 (100 %).
  S5C_glycolysis.glycolysis:
    item: S5C_glycolysis
    measure: glycolysis
    formula: glyc = ecar_glc - ecar_nonglyc
    anchor:
      quote: the glycolysis ECAR was calculated by subtracting the average non-glycolytic acidification values (after 2-DG) from the
        values after glucose administration
      where: Supplemental Methods, Seahorse
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: sum_of_parts
      vars:
        t: ecar_glc
        a: glyc
        b: ecar_nonglyc
    inputs:
      ecar_glc:
        not_stated: true
        kind: per sample
        note: ECAR after glucose; plotted in the Suppl. Fig. 5B profile, not read
      ecar_nonglyc:
        item: S5C_nonglyc
        kind: per sample
    aggregation: not stated
  S5C_glycolytic_capacity.capacity:
    item: S5C_glycolytic_capacity
    measure: glycolytic capacity
    formula: cap = ecar_oligo - ecar_nonglyc
    anchor:
      quote: the glycolytic capacity was calculated by subtracting the non-glycolytic acidification ECAR values from ECAR values after
        addition of oligomycin
      where: Supplemental Methods, Seahorse
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: sum_of_parts
      vars:
        t: ecar_oligo
        a: cap
        b: ecar_nonglyc
    inputs:
      ecar_oligo:
        not_stated: true
        kind: per sample
        note: ECAR after oligomycin; plotted in the Suppl. Fig. 5B profile, not read
      ecar_nonglyc:
        item: S5C_nonglyc
        kind: per sample
    aggregation: not stated
  S5C_glycolytic_reserve.reserve:
    item: S5C_glycolytic_reserve
    measure: glycolytic reserve
    formula: res = ecar_oligo - ecar_glc
    anchor:
      quote: the glycolytic reserve was calculated by subtracting the ECAR values after addition of glucose from the ECAR values after
        addition of oligomycin
      where: Supplemental Methods, Seahorse
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: sum_of_parts
      vars:
        t: ecar_oligo
        a: res
        b: ecar_glc
    inputs:
      ecar_oligo:
        not_stated: true
        kind: per sample
        note: ECAR after oligomycin; plotted in the Suppl. Fig. 5B profile, not read
      ecar_glc:
        not_stated: true
        kind: per sample
        note: ECAR after glucose; plotted in the Suppl. Fig. 5B profile, not read
    alternatives:
    - label: from the other two stated measures
      formula: res = cap - glyc
      note: 'follows from the two stated subtractions (the non-glycolytic term cancels): glycolytic reserve = glycolytic capacity -
        glycolysis'
    aggregation: not stated
  F2F_force.stoney_force:
    item: F2F_force
    measure: maximum systolic force per MTF
    formula: not stated
    anchor:
      quote: The modified Stoney equation was used to calculate force for each MTF using the radius of curvature, thickness, and elastic
        modulus.
      where: Methods, Muscular Thin Films
      file: journal_version.pdf
    no_formula: modified Stoney equation stated only by citation (ref 33); its form is not printed
    inputs:
      R:
        not_stated: true
        kind: per sample
        note: radius of curvature of each MTF (ImageJ); not printed
      h:
        not_stated: true
        kind: per sample
        note: MTF thickness (confocal); not printed
      E:
        not_stated: true
        kind: not stated
        note: elastic modulus of the gelatin film; value not printed
      stoney:
        by_reference:
          citation: ref33
          anchor:
            quote: The modified Stoney equation was used to calculate force for each MTF using the radius of curvature, thickness, and
              elastic modulus.33
            where: Methods, Muscular Thin Films
            file: journal_version.pdf
        kind: not stated
    note: Supplemental Methods then speak of systolic, diastolic and twitch stresses per MTF; the figure reports force.
  F2F_force.relative_force:
    item: F2F_force
    measure: relative maximum systolic force
    formula: rel = F/Fc
    anchor:
      quote: The relative maximum systolic force was normalized to control for each batch.
      where: Methods, Muscular Thin Films
      file: journal_version.pdf
    library:
      formula: ratio_def
      vars:
        r: rel
        a: F
        b: Fc
    inputs:
      F:
        derived: F2F_force.stoney_force
        kind: per sample
      Fc:
        not_stated: true
        kind: not stated
        note: mean maximum systolic force of the control MTFs of the same batch; not printed
    output: F2F_force.values.force_ratio_text
    aggregation: not stated
    note: Per batch (3 batches, 2 lines). The printed 'nearly 2-fold' compares Torin1 with control after this normalisation.
  F3E_JC1.red_green:
    item: F3E_JC1
    measure: JC-1 red:green fluorescence ratio
    formula: rg = red/green
    anchor: &id001
      quote: For JC-1, the ratio of red to green MFI for vehicle versus Torin1-treated cells was quantified and normalized to control.
      where: Methods, MitoTracker and MitoProbe JC-1 Assays
      file: journal_version.pdf
    library:
      formula: ratio_def
      vars:
        r: rg
        a: red
        b: green
    inputs:
      red:
        not_stated: true
        kind: per sample
        note: red (aggregate) MFI of a sample; not printed
      green:
        not_stated: true
        kind: per sample
        note: green (monomer) MFI of a sample; not printed
  F3E_JC1.normalized_to_control:
    item: F3E_JC1
    measure: relative JC-1 red:green ratio
    formula: rel = rg/rgc
    anchor: *id001
    library:
      formula: ratio_def
      vars:
        r: rel
        a: rg
        b: rgc
    inputs:
      rg:
        derived: F3E_JC1.red_green
        kind: per sample
      rgc:
        not_stated: true
        kind: not stated
        note: control (vehicle) red:green ratio, mean or per batch not stated; not printed
    aggregation: not stated
  F3D_mtDNA.mt_to_nuclear:
    item: F3D_mtDNA
    measure: mitochondrial to nuclear DNA ratio
    formula: not stated
    anchor:
      quote: Primers for DNA to mitochondrial gene ND1 (nicotinamide adenine dinucleotide dehydrogenase 1) and nuclear gene lipoprotein
        lipase gene (LPL) were used.
      where: Methods, Mitochondrial DNA to Nuclear DNA Ratio
      file: journal_version.pdf
    no_formula: the calculation of the ratio from qPCR is not stated (primers cited to ref 10); the plotted ratio is normalized to control
      (axis label, image only)
    inputs:
      ct_nd1:
        not_stated: true
        kind: per sample
        note: Ct of ND1; not printed
      ct_nuc:
        not_stated: true
        kind: per sample
        note: Ct of the nuclear gene (LPL in Methods, B2M in the legend); not printed
    alternatives:
    - label: delta Ct
      formula: r = 2^(ct_nuc - ct_nd1)
      note: common practice for a mtDNA copy ratio (the form of ratio_from_log2_values); not stated
  S1B_Ki67.positive_ctrl:
    item: S1B_Ki67
    group: ctrl
    measure: percentage of Ki67+ cardiomyocytes
    formula: pos = k/N
    anchor: &id002
      quote: The percentage of Ki67+ cells or pH3+ cells out of the total number of cells marked by DAPI and TNNT2 was quantified.
      where: Supplemental Methods, Imaging quantification of proliferating cardiomyocytes
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: ratio_def
      vars:
        r: pos
        a: k
        b: N
    inputs:
      k:
        not_stated: true
        kind: constant
        note: Ki67+ cells among the DAPI+ TNNT2+ cells counted over 5 fields; not printed
      N:
        value: S1B_Ki67.values.total_ctrl_figure
        kind: constant
    output: S1B_Ki67.values.ki67pos_ctrl_figure
    note: One pooled count per group; k is not printed, so this cannot be rebuilt.
  S1B_Ki67.negative_ctrl:
    item: S1B_Ki67
    group: ctrl
    measure: percentage of Ki67- cardiomyocytes
    formula: neg = 1 - pos
    anchor:
      quote: Pie charts depicting the percentage of total DAPI/TNNT+ cardiomyocytes that are Ki67+ or Ki67- in control
      where: Supplemental Figure 1 legend
      file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    library:
      formula: complement_fraction
      vars:
        c: neg
        f: pos
    inputs:
      pos:
        value: S1B_Ki67.values.ki67pos_ctrl_figure
        kind: constant
    output: S1B_Ki67.values.ki67neg_ctrl_figure
    note: Ki67+ and Ki67- are the two exclusive parts of one total, drawn as one pie chart.
