    file: NIHMS1605561-supplement-Supplementary_Information.docx
- field: supplements
  value: 10% FBS + 1% glutamine + 1% non-essential amino acids
  anchor:
    quote: In organoid medium, the CM-specific component was defined as glucose-containing F12/DMEM medium with 10% FBS, 1%
      glutamine and 1% non-essential amino acids
    where: Methods, Fabrication of organoids and spheroids
- field: replating_coating
  value: non-adhesive agarose hydrogel molds
  anchor:
    quote: non-adhesive agarose hydrogel molds were used as microtissue fabrication molds generated from commercial master
