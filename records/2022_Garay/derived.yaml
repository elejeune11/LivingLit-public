  ST1_chip_adult.pct:
    item: ST1_chip_adult
    formula: p = n/N
    anchor: &id001
      quote: N (%)
      where: Table S1
      file: mmc1.pdf
      kind: table cell
    library:
      formula: ratio_def
      vars:
        r: p
        a: n
        b: N
    inputs:
      n:
        value: ST1_chip_adult.values.n_table
        kind: constant
      N:
        value: ST1_chip_total.values.n_table
        kind: constant
    output: ST1_chip_adult.values.pct_table
    note: Table S1 prints each group as N (%), the percent of the assay's total.
