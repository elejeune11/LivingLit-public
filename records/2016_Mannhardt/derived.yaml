record: 2016_Mannhardt
formula_library_version: 5
agent:
  model: llm
  instructions: formulas_v3
derived:
  TXT2_force.force:
    item: TXT2_force
    formula: not stated
    anchor: not stated
    no_formula: force from post deflection is stated only by citation (video-optical recording as previously described, Hansen et al. 2010); no
      formula or post stiffness is printed
    inputs:
      deflection:
        by_reference:
          citation: Hansen2010
          anchor:
            quote: Analysis of contractile force was performed by video-optical recording as previously described
            where: Experimental Procedures, Contractile Analysis
        kind: per sample
      stiffness:
        by_reference:
          citation: Hansen2010
          anchor:
            quote: Analysis of contractile force was performed by video-optical recording as previously described
            where: Experimental Procedures, Contractile Analysis
        kind: not stated
    output: TXT2_force.values.mean
    note: applies to every video-optical force item of this paper (F1, F3-F7, S4-S7 force items); written once here
  F3B_iso.change_text:
    item: F3B_iso
    formula: d = (x - x0)/x0
    anchor:
      quote: which itself amounted to +27% (from 47 ± 6 to 60 ± 4 bpm)
      where: Results, Pacemaker Mechanisms
    library: &id001
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        value: F3B_iso.values.iso
        kind: per sample
      x0:
        value: F3B_iso.values.bl
        kind: per sample
    output: F3B_iso.values.change_text
    aggregation: not stated
  F3B_iso.change_discussion:
    item: F3B_iso
    formula: d = (x - x0)/x0
    anchor:
      quote: was smaller in hiPSC-EHTs than in native SAN preparations (+30% versus +50% in mice
      where: Discussion
    library: *id001
    inputs:
      x:
        value: F3B_iso.values.iso
        kind: per sample
      x0:
        value: F3B_iso.values.bl
        kind: per sample
    output: F3B_iso.values.change_discussion
    aggregation: not stated
    note: 'the Discussion restates the isoprenaline effect of Fig. 3B (Results: +27%, from 47 to 60 bpm)'
  F3B_ryd.reduction_discussion:
    item: F3B_ryd
    formula: s = (x0 - x)/x0
    anchor:
      quote: Ryanodine itself reduced spontaneous beating frequency by 50%
      where: Discussion
    library:
      formula: relative_decrease
      vars:
        s: s
        x: x
        x0: x0
    inputs:
      x:
        value: F3B_ryd.values.ryd
        kind: per sample
      x0:
        value: F3B_ryd.values.bl
        kind: per sample
    output: F3B_ryd.values.reduction_discussion
    aggregation: not stated
    note: Results print the same comparison as from 47 ± 6 to 20 ± 2 bpm
  F4C_T2.fdar:
    item: F4C_T2
    formula: d = (x - x0)/x0
    anchor: &id002
      quote: frequency-dependent acceleration of relaxation [FDAR] 18%
      where: Results, Physiological Force Modulation
    library: *id001
    inputs:
      x:
        reading: F4C_bars/F4C_T2|f2p0
        kind: per sample
      x0:
        reading: F4C_bars/F4C_T2|f1p0
        kind: per sample
    output: F4C_T2.values.fdar
    aggregation: not stated
    note: relaxation time T2 at 2.0 Hz relative to 1.0 Hz (Fig. 4C bars); the minus sign is printed on the page
