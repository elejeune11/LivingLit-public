- version: 62
  paper: 2016_Herron
  agent:
    model: llm
    instructions: terms_v4
    run: null
  events:
  - event: add_synonym
    id: pacing:electrical_pacing
    text: electric pacing
    anchor: we characterized AP propagation velocity and duration over electric pacing frequencies ranging from 0.7 to 2.5
      Hz
  - event: add_synonym
    id: measurement_medium:extracellular_solution
    text: external solution
    anchor: Monolayers were perfused with a warm (37±1.5°C) external solution
  - event: add_synonym
    id: measurement_medium:hbss
    text: HBSS
    anchor: optical mapping was done at 37°C in HBSS
  - event: add_synonym
    id: preparation:lysate
    text: Laemmli sample buffer
    anchor: cells were collected in Laemmli sample buffer
  - event: add_synonym
    id: substrate:culture_plate
    text: plastic
    anchor: here we used plastic as the rigid comparator for PDMS
  - event: add_synonym
    id: purification:immunomagnetic_selection
    text: MACS
    anchor: purified using magnetic activated cell sorting (MACS)
  - event: add_synonym
    id: purity_method:immunostaining
    text: immunofluorescent staining
    anchor: confirmed by immunofluorescent staining (supplemental figure 6B)
  - event: add_term
    field: replating_coating
    id: replating_coating:collagen_type_not_stated
    label: collagen, type not stated
    parent: null
    definition: A collagen coating whose collagen type the source does not state.
    scope: A collagen protein coating of unstated type; not Matrigel, Geltrex or gelatin (denatured collagen), and not fibronectin,
      laminin, vitronectin, Synthemax or agarose.
    synonyms:
    - text: collagen
      anchor: collagen (20 µg/mL; Sigma-Aldrich - C0543) and laminin (4 µg/mL;
  - event: add_term
    field: substrate
    id: substrate:trichloro_silanized_glass
    label: trichloro-silanized glass
    parent: substrate:glass
    definition: Glass whose surface has been treated with a trichlorosilane to change its surface chemistry.
    scope: Glass silanized with a trichlorosilane; not methylated glass and not PDMS-coated glass or bulk PDMS.
    synonyms: []
  - event: add_term
    field: substrate
    id: substrate:methylated_glass
    label: methylated glass
    parent: substrate:glass
    definition: Glass whose surface has been given methyl groups to make its surface chemistry resemble PDMS.
    scope: Glass with a methylated surface; not trichloro-silanized glass and not PDMS-coated glass or bulk PDMS.
    synonyms: []
  - event: add_term
    field: measure
    id: measure:takeoff_potential
    label: takeoff potential
    parent: measure:action_potential
    dimension: voltage
    definition: The membrane potential at which the action potential upstroke takes off from diastolic depolarisation.
    scope: Voltage at the start of the upstroke; not the maximum diastolic potential, the peak potential, the amplitude, the
      upstroke velocity, a duration, rise or repolarisation time, a duration ratio or the firing frequency, and not a stimulus
      threshold (excitation threshold).
    synonyms:
    - text: take-off potential
      anchor: action potential (AP) amplitude, take-off potential, action potential duration (APD) at 30, 50, 70,
  - event: add_term
    field: measure
    id: measure:monolayer_confluence
    label: monolayer confluence
    parent: null
    dimension: dimensionless
    definition: Fraction of a culture surface covered by cells, from a confluence mask of phase-contrast images.
    scope: Share of a culture surface covered by a cell monolayer; not the area fraction of a tissue section (tissue area
      fraction), not the culture surface area, not cell area and not cell viability.
    synonyms:
    - text: monolayer confluence
      anchor: 100 μmol/L FAK inhibitor-14 reduced monolayer confluence
  - event: adopt
    field: cell_line
    id: CVCL_E087
    label: UM22-2
    lookup: cellosaurus "UM 22-2" and "UM22-2" both gave CVCL_E087 UM22-2 (exact); the paper's line is a hESC line from the
      University of Michigan (NIH registration 0209)
    synonyms:
    - text: UM 22-2
      anchor: 'were derived using the UM 22-2 (NIH registration #0209)'
  - event: adopt_own
    field: cell_line
    id: cell_line:bj_ipsc7
    label: BJ-iPSC7
    scope: The BJ-iPSC7 line of the Herron 2016 study; not hiPS-BJ, BJ1D or other BJ-derived lines, and not any other named
      or unnamed line.
    definition: An hiPSC line made from BJ fibroblasts by mRNA reprogramming in the Herron 2016 study's laboratory.
    lookup: cellosaurus "BJ-iPSC7", "BJ-iPS" and "BJ" gave no BJ-iPSC7 (only BJ iPSC clones 1-3, UBi005-A, KKUi001-A and BJ
      RiPS-A, other lines)
    synonyms: []
  - event: adopt_own
    field: treatment
    id: treatment:anti_integrin_b1_neutralising_antibody
