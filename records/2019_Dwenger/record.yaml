claims:

  c_abs_immaturity:
    kind: literature
    quote: "The immaturity of human induced pluripotent stem cell derived engineered cardiac tissues limits their ability to regenerate damaged myocardium and to serve as robust in vitro models"
    where: "Abstract"
    scope: "hiPSC engineered cardiac tissues in general"
    direction: "not stated"
    strength: "limits"

  c_abs_conditioning:
    kind: literature
    quote: "Several chronic biomimetic conditioning protocols, including mechanical stretch, perfusion, and/or electrical stimulation promote engineered cardiac tissue maturation but have significant technical limitations."
    where: "Abstract"
    scope: "published conditioning protocols"
    direction: "not stated"
    strength: "promote, significant technical limitations"

