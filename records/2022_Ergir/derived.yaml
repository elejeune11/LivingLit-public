        value: F7A_lpl.values.lpl_log2fc_data
        kind: constant
        note: DESeq2 log2 fold change 3D-d50 vs 2D-d50 (Supplementary dataset 1)
    output: F7A_lpl.values.lpl_fold_text
    alternatives:
    - label: the printed '4 times fold' is the log2 fold change itself
      formula: fold = lfc
      note: the record reader's suspected error; the text's 4 matches the log2 value
  F8F_dox1_vs_untr.viability_dox1:
    item: F8F_dox1_vs_untr
    group: dox1
    formula: v = L/L0
    anchor:
      quote: on day 6 of Doxo treatment normalized to untreated samples
      where: Fig. 8 legend
    library:
      formula: ratio_def
      vars: {r: v, a: L, b: L0}
    inputs:
      L: {not_stated: true, kind: per sample, note: CellTiter-Glo luminescence of each 1 µg/mL Doxo sample}
      L0: {not_stated: true, kind: not stated, note: untreated luminescence (whether the untreated mean or a per-plate value is not stated)}
    output: F8F_dox1_vs_untr.values.via_dox1_text
    aggregation: not stated
  F8F_dox1_vs_untr.viability_untr:
    item: F8F_dox1_vs_untr
    group: untr
    formula: v = L/L0
    anchor:
      quote: on day 6 of Doxo treatment normalized to untreated samples
      where: Fig. 8 legend
    library:
      formula: ratio_def
      vars: {r: v, a: L, b: L0}
    inputs:
      L: {not_stated: true, kind: per sample, note: CellTiter-Glo luminescence of each untreated sample}
      L0: {not_stated: true, kind: not stated, note: untreated luminescence (whether the untreated mean or a per-plate value is not stated)}
    output: F8F_dox1_vs_untr.values.via_untr_text
    aggregation: not stated
    note: the control is normalised to its own group; its printed SD (4.1 %) is not 0, so samples were not each normalised to themselves
  F8F_dox0p1_vs_untr.viability_dox0p1:
    item: F8F_dox0p1_vs_untr
    group: dox0p1
    formula: v = L/L0
    anchor:
      quote: on day 6 of Doxo treatment normalized to untreated samples
      where: Fig. 8 legend
    library:
      formula: ratio_def
      vars: {r: v, a: L, b: L0}
    inputs:
      L: {not_stated: true, kind: per sample, note: CellTiter-Glo luminescence of each 0.1 µg/mL Doxo sample}
      L0: {not_stated: true, kind: not stated, note: untreated luminescence (whether the untreated mean or a per-plate value is not stated)}
    output: F8F_dox0p1_vs_untr.values.via_dox0p1_text
    aggregation: not stated
  F7B_ocr_baseline.dna_normalised:
    item: F7B_ocr_baseline
    formula: ocr = R/D
    anchor:
      quote: Metabolic data were normalized by measuring the DNA content of each sample
      where: Methods, Seahorse XFp Analyzer
    library:
      formula: ratio_def
      vars: {r: ocr, a: R, b: D}
    inputs:
      R: {not_stated: true, kind: per sample, note: raw OCR of each well (last baseline measurement before Oligomycin)}
      D: {not_stated: true, kind: per sample, note: PicoGreen DNA content of each sample; the printed unit expresses the result per 300 ng DNA}
    aggregation: not stated
  F7B_ecar_baseline.dna_normalised:
