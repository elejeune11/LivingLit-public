  f6b_glucose.consumption:
    item: f6b_glucose
    measure: glucose consumption
    formula: G = c1 - c0
    anchor:
      quote: Glucose consumption was calculated as the initial cGluc of the medium before the 4 hours of incubation subtracted from cGluc after
        incubation
      where: Supplemental Experimental Procedures
      file: mmc1.pdf
    library:
      formula: sum_of_parts
      vars:
        t: c1
        a: c0
        b: G
    inputs:
      c1:
        not_stated: true
        kind: per sample
        note: cGluc after 4 h; not released
      c0:
        not_stated: true
        kind: per sample
        note: initial cGluc; not released
    alternatives:
    - label: consumption as initial minus final
      formula: G = c0 - c1
      note: the usual sign for consumption; the stated wording (initial subtracted from after) gives final minus initial
    note: 'Written as worded: ''A subtracted from B'' is B - A.'
  f6c_lactate.production:
    item: f6c_lactate
    measure: lactate production
    formula: L = l0 - l1
    anchor:
      quote: Lactate production was calculated by subtracting cLac after incubation from initial cLac
      where: Supplemental Experimental Procedures
      file: mmc1.pdf
    library:
      formula: sum_of_parts
      vars:
        t: l0
        a: l1
        b: L
    inputs:
      l0:
        not_stated: true
        kind: per sample
        note: initial cLac; not released
      l1:
        not_stated: true
        kind: per sample
        note: cLac after 4 h; not released
    alternatives:
    - label: production as final minus initial
      formula: L = l1 - l0
      note: 'the usual sign for production (Fig. 6C axis: cLac increase); the stated wording gives initial minus final'
    note: 'Written as worded: ''subtracting X from Y'' is Y - X.'
  f6b_glucose.fold_2d_over_3d:
    item: f6b_glucose
    measure: glucose consumption
    formula: r = a/b
    anchor:
      quote: glucose consumption and lactate production were 2- to 3-fold higher in 2D hiPSC-CMs than in 3D
      where: Results
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        reading: F6BC/B 2D
        kind: per sample
      b:
        reading: F6BC/B 3D
        kind: per sample
    output: f6b_glucose.values.fold_low
    note: The range '2- to 3-fold' is printed once for both measures; judged against its lower end, the end nearest the rebuilt ratio.
  f6c_lactate.fold_2d_over_3d:
    item: f6c_lactate
    measure: lactate production
    formula: r = a/b
    anchor:
      quote: glucose consumption and lactate production were 2- to 3-fold higher in 2D hiPSC-CMs than in 3D
      where: Results
