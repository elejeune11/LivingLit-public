<svg xmlns='http://www.w3.org/2000/svg' width='900' height='400' viewBox='0 0 900 400'><rect width='900' height='400' fill='#ffffff'/><text x='24.0' y='34.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#1f2328' font-weight='bold' text-anchor='start'>A wrong derivation is caught from the methods text alone</text><text x='24.0' y='56.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start' font-style='italic'>made-up example</text><text x='24.0' y='88.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>Given: two models, cited</text><text x='330.0' y='88.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>Derived formula: proved by code</text><text x='640.0' y='88.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>The paper: anchored</text><rect x='24' y='98' width='250' height='62' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='36.0' y='120.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Hooke&#x27;s law (model)</text><text x='36.0' y='140.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>F = k·δ, for each post</text><rect x='24' y='178' width='250' height='62' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='36.0' y='200.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Static equilibrium (model)</text><text x='36.0' y='220.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>F1 = F2 = T, tissue at rest</text><rect x='330' y='112' width='260' height='100' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='342.0' y='134.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>two_post_force_balance</text><text x='342.0' y='154.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>T = k·d1 = k·d2</text><text x='342.0' y='170.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>so k·(d1 + d2) = 2T</text><text x='342.0' y='186.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>proved with SymPy, tests pass</text><path d='M274.0 129.0 L300.0 129.0 L300.0 150.0 L322.4 150.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M328.0 150.0 L321.0 153.5 L321.0 146.5 Z' fill='#9aa3ad'/><path d='M274.0 209.0 L300.0 209.0 L300.0 174.0 L322.4 174.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M328.0 174.0 L321.0 177.5 L321.0 170.5 Z' fill='#9aa3ad'/><rect x='640' y='98' width='236' height='82' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='652.0' y='120.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Paper&#x27;s methods</text><text x='652.0' y='140.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>F = k·(d1 + d2)</text><text x='652.0' y='156.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start'>written with its quote</text><rect x='640' y='200' width='236' height='62' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='652.0' y='222.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Symbolic check</text><text x='652.0' y='242.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>the paper&#x27;s F = 2T</text><path d='M758.0 180.0 L758.0 192.4' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M758.0 198.0 L754.5 191.0 L761.5 191.0 Z' fill='#9aa3ad'/><path d='M590.0 162.0 L614.0 162.0 L614.0 231.0 L632.4 231.0' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M638.0 231.0 L631.0 234.5 L631.0 227.5 Z' fill='#9aa3ad'/><path d='M758.0 262.0 L758.0 284.4' fill='none' stroke='#9aa3ad' stroke-width='1.4' stroke-linejoin='round'/><path d='M758.0 290.0 L754.5 283.0 L761.5 283.0 Z' fill='#9aa3ad'/><rect x='24' y='292' width='852' height='92' rx='8' fill='#f8e3e1' stroke='#c8402f' stroke-width='1.6'/><text x='36.0' y='314.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#c8402f' font-weight='bold' text-anchor='start'>Flag: inconsistent with two_post_force_balance (derived) ← Hooke + equilibrium</text><text x='36.0' y='334.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>Within the paper: a constant factor of 2, so t, P and direction are unchanged: conclusion unaffected.</text><text x='36.0' y='350.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>Absolute values: rebuilt force = printed force / 2, labelled derived by LivingLit; the printed value is kept.</text><text x='36.0' y='366.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>Claims against adult values, and comparisons with other papers, use the rebuilt value.</text></svg>
