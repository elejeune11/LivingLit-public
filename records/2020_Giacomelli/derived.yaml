  F7D_pkp2.norm:
    item: F7D_pkp2
    formula: y = p/g
    anchor:
      quote: GAPDH was used as loading control. Densitometric analysis is shown in the lower panel.
      where: Fig. 7 legend
    library:
      formula: ratio_def
      vars:
        r: y
        a: p
        b: g
    inputs:
      p:
        not_stated: true
        kind: per sample
        note: PKP2 band density
      g:
        not_stated: true
        kind: per sample
        note: GAPDH band density of the same lane
    note: readings F7D give the normalised values only; the band densities are not printed
  S7G_sma.fraction:
    item: S7G_sma
    formula: f = a/b
    anchor: &id004
      quote: SMA positive and DAPI positive cells to obtain the percentage of SMA positive cells per image
      where: STAR Methods
    library:
      formula: ratio_def
      vars:
        r: f
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: per sample
        note: SMA positive cells in one image
      b:
        not_stated: true
        kind: per sample
        note: DAPI positive cells in the same image
    aggregation: mean of per-sample
    note: 'printed in %: the fraction x100. Per image, then (not stated) averaged per differentiation'
  S7I_sma.fraction:
