    definition: A synthetic vitronectin-derived peptide substrate (Corning Synthemax II-SC) coated on plates for undifferentiated
      pluripotent stem cells.
    scope: A synthetic peptide surface; not Matrigel or Geltrex (basement-membrane extracts) and not recombinant vitronectin
      protein.
