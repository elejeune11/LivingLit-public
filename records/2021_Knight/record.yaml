  abs_elongated:
    kind: stated
    quote: These cells display many characteristics of adult human cardiomyocytes, including elongated cell morphology, sarcomeric maturity, and
      increased myofibril contractile force.
    where: Summary
    scope: MPAT and MM hiPSC-CMs
    asserts_direction: down
    rests_on:
    - F1_circ_MPAT_v_GLUC
    - F1_circ_MM_v_GLUC
    - S1D_circ_MPAT_v_GLUC
    - S1E_circ_MPAT_v_GLUC
    judgement:
      direction: follows
      support: follows
      comparison: overstated
      scope: follows
      replication: follows
      strength: follows
      presence: follows
    note: elongation is the first assertion of the sentence; no adult human cell shape is measured, so the comparison to adult cardiomyocytes
      is overstated
  abs_sarcomere:
    kind: stated
    quote: These cells display many characteristics of adult human cardiomyocytes, including elongated cell morphology, sarcomeric maturity, and
      increased myofibril contractile force.
