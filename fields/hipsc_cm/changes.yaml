    label: shear stress conditioning
    parent: maturation_strategy:dynamic_culture
    definition: Exposure of a cell layer, such as an endothelial barrier, to flow whose shear stress is raised step by step
      during culture.
    scope: A stepwise rise of flow shear on a cell layer to mature it; the general case of moving medium around a construct
      is the parent (dynamic culture).
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:air_liquid_interface
    label: air–liquid interface culture
    parent: null
    definition: Culture with the upper surface of a tissue exposed to air and the lower surface fed by medium, used to stratify
      epidermis.
    scope: Lifting a tissue to the air to mature it; not electrical stimulation, mechanical loading, a maturation medium,
      dynamic or static culture, gene overexpression, prolonged culture, a standard medium control, osteogenic induction or
      co-culture.
    synonyms:
    - text: air–liquid interface
      anchor: adding human keratinocytes, and by cultivation at the air–liquid interface for 3 weeks
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:osteogenic_induction
    label: osteogenic induction
    parent: null
    definition: Culture in an osteogenic medium that drives stromal cells towards osteoblasts.
    scope: A medium-driven osteoblastic differentiation of stromal cells; not a cardiomyocyte maturation medium, not electrical
      or mechanical stimulation, not air–liquid interface culture and not co-culture.
    synonyms:
    - text: osteogenic differentiation
