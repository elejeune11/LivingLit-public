      where: Fig. S7E legend
      file: mmc1.pdf
    compares:
    - mm
    - ctr
    n:
      printed: n=3-8 EHTs
      counts: EHTs
    stats:
      test: not stated
      statistic: not stated
      p: p < 0.05 (Methods)
    method: video-optical recording of contractile force
    stated_direction:
      direction: up
      anchor:
        quote: Force generation in the viable MM EHTs was increased at the end of the culture period (Figure 6C; Figures S7D and S7E)
        where: Results, MM Improves EHT Culture
  S7F_beatrate:
    unit: S7F
    measure: beat rate on the last day of culture
    finding: beat rate was lower in MM EHTs on the last day of culture
    anchor:
      quote: Quantification of beat rate (BPM) on the last day of culture per batch (n=3-8 EHTs)
