      a medium named only as EHT medium or a mixture of cell-type-specific media.
  - event: add_term
    field: replating_coating
    id: replating_coating:non_adhesive_agarose
    label: non-adhesive agarose mold
    definition: A non-adhesive agarose hydrogel with recesses into which cells are seeded so that they aggregate rather than
      attach.
    scope: A non-adhesive surface for aggregation; not an adhesive coating such as Matrigel, Geltrex, fibronectin, gelatin
      or vitronectin.
