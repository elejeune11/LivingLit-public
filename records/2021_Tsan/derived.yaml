  F2e_cv.cv_reduction:
    item: F2e_cv
    formula: red = (cv0 - cv1)/cv0
    anchor:
      quote: variability across 2DMBs was reduced by 87% compared to standard hPSC-CMs
      where: Results, p. 5
    library:
      formula: relative_decrease
      vars:
        s: red
        x0: cv0
        x: cv1
    inputs:
      cv0:
        value: F2e_cv.values.cv_mono
        kind: constant
      cv1:
        value: F2e_cv.values.cv_mb
        kind: constant
    output: F2e_cv.values.cv_reduction
    output_unit: '%'
    alternatives:
    - label: reduction of SD rather than CV
      note: '"variability" is not defined; the CVs are printed beside it'
  F3h_sd.less:
    item: F3h_sd
    formula: less = (s0 - s1)/s0
    anchor:
      quote: variability across replicates was 73% less in 2DMBs
      where: Results, p. 5
    library:
      formula: relative_decrease
      vars:
        s: less
        x0: s0
        x: s1
    inputs:
      s0:
        value: F3h_sd.values.sd_mono
        kind: constant
      s1:
        value: F3h_sd.values.sd_mb
        kind: constant
    output: F3h_sd.values.less
    output_unit: '%'
    note: the released Fig. 3h monolayer amplitudes give SD 1.39 (n = 55), not the printed 1.06
  TXT1_yield.fold:
    item: TXT1_yield
    formula: fold = y1/y0
    anchor:
      quote: 110-fold increase in yield vs. single cells
      where: Results, p. 5
    library:
      formula: ratio_def
      vars:
        r: fold
        a: y1
        b: y0
    inputs:
      y1:
        value: TXT1_yield.values.yield_mb
        kind: constant
      y0:
        value: TXT1_yield.values.yield_single
        kind: constant
    output: TXT1_yield.values.fold
    aggregation: of means
    note: ratio of the two printed mean yields; the single-cell yield is from prior work (different substrates)
  TXT1_yield.yield_single:
    item: TXT1_yield
    group: single
    formula: y = c/N
    anchor:
      quote: substrate containing 2742 single-cell-scale rectangular micropatterns (0.5 ± 0.3% of micropatterns
      where: Results, p. 5
    library:
      formula: ratio_def
      vars:
        r: y
        a: c
        b: N
    inputs:
      c:
        not_stated: true
        kind: per sample
        note: single cells meeting quality thresholds per substrate (printed only as the range 5–36)
      N:
        printed: '2742'
        unit: count
        kind: constant
        anchor:
          quote: substrate containing 2742 single-cell-scale rectangular micropatterns
          where: Results, p. 5
    output: TXT1_yield.values.yield_single
    output_unit: '%'
    aggregation: not stated
    note: 'a share of micropatterns: the words "of micropatterns" are the stated operation'
  TXT1_yield.yield_mb:
    item: TXT1_yield
    group: mb
    formula: y = c/N
    anchor:
      quote: 55 ± 13% of micropatterns on 2DMB substrates exhibited adherence of 6–12 cells
      where: Results, p. 5
    library:
      formula: ratio_def
      vars:
        r: y
        a: c
        b: N
    inputs:
      c:
        not_stated: true
        kind: per sample
        note: micropatterns with a 2DMB per substrate; not printed or released
      N:
        printed: '4772'
        unit: count
        kind: constant
        anchor:
          quote: The design consisted of a rectangular array of 4772 rectangles
          where: Methods, Micropatterned substrate fabrication
    output: TXT1_yield.values.yield_mb
    output_unit: '%'
    aggregation: not stated
    note: that every substrate carries the full 4772-pattern array is not stated
