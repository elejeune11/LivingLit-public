  F4_force_20.pct_baseline:
    item: F4_force_20
    formula: r = x/x0
    anchor: &id003
      quote: relative values (means ± SEM) normalized to own baseline (0.75 Hz)
      where: Figure 4 legend
    library:
      formula: ratio_def
      vars:
        r: r
        a: x
        b: x0
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: absolute value of each EHT after the intervention; not printed
      x0:
        not_stated: true
        kind: per sample
        note: the same EHT's own baseline value; not printed
    note: '"% of baseline" (named operation, per EHT); the plotted means are read in readings.yaml and feed the % change derivation of this item.'
  F4_force_20.change:
    item: F4_force_20
    formula: d = (x - x0)/x0
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    anchor:
      quote: Between 0.75 and 2.0 Hz, the increase in stimulation frequency was accompanied by an increase in force (+96%) and CaT (97%).
      where: Results, Force-Frequency Relationship
    inputs:
      x:
        reading: f4a_force_20/f20
        kind: per sample
        x: 2 Hz
