        dimension: text
  - event: add_term
    field: transgene
    id: transgene:ctnnb1_dn90
    label: ΔN90 β-catenin
    parent: transgene:overexpressed_gene
    definition: Human CTNNB1 lacking amino acids 2 to 90, a constitutively active β-catenin.
    scope: Constitutively active β-catenin; not a YAP1 mutant.
  - event: add_term
    field: transgene
    id: transgene:yap1_s127a
    label: YAP1(S127A)
    parent: transgene:overexpressed_gene
    definition: Human YAP1 with serine 127 replaced by alanine, a constitutively active YAP1.
    scope: The human S127A mutant; not the murine S112A mutant and not β-catenin.
  - event: add_term
    field: transgene
    id: transgene:yap1_s112a
    label: YAP1(S112A)
    parent: transgene:overexpressed_gene
    definition: Murine Yap1 with serine 112 replaced by alanine, a constitutively active YAP1.
    scope: The murine S112A mutant; not the human S127A mutant and not β-catenin.
  - event: add_term
    field: transgene
    id: transgene:empty_vector
    label: empty vector
    definition: A viral vector carrying no transgene (only its multiple cloning site), used as a control.
    scope: A vector with no insert; not a reporter, an indicator, a recombinase or an overexpressed gene.
    qualifiers:
      vector:
        dimension: text
      MOI:
        dimension: text
      dose:
        dimension: text
  - event: add_synonym
    id: measure:twitch_force
    text: force of contraction
    anchor: stimuli that alter the force of contraction
  - event: add_synonym
    id: measure:contraction_frequency
    text: rate of contraction
    anchor: Isoprenaline increased the rate of contraction in both media
  - event: add_synonym
    id: measure:action_potential_amplitude
    text: AP amplitude
    anchor: a large AP amplitude (>85 mV)
  - event: add_qualifier
    id: measure:ec50
    name: agonist
    dimension: text
  - event: add_qualifier
    id: measure:marker_positive_cells
    name: population
    dimension: text
  - event: add_qualifier
    id: measure:differentially_expressed_gene_count
    name: gene_set
    dimension: text
  - event: add_qualifier
    id: measure:enrichment_p_value
    name: gene_set
    dimension: text
  - event: add_term
    field: measure
    id: measure:calcium_transient_rise_rate
    label: calcium transient rising slope
    definition: Rate at which the calcium-dye signal rises during the upstroke of the calcium transient.
    scope: Slope of the rise in signal per time; not the rise time, the amplitude or the decay.
    dimension: rate
  - event: add_term
    field: measure
    id: measure:calcium_transient_decay_constant
    label: calcium transient decay time constant
    parent: measure:calcium_transient_decay_time
    definition: Time constant (tau) of an exponential fitted to the decay of the calcium transient.
    scope: The fitted decay constant; not the time to a stated level of decay, and not a decay time expressed relative to
      a reference.
    dimension: time
  - event: set_scope
    id: measure:relative_calcium_transient_decay_time
    scope: A decay time expressed relative to a reference (qualifiers expressed_as, normalised_to); not the fitted decay time
      constant.
  - event: add_term
    field: measure
    id: measure:action_potential_peak_potential
    label: action potential peak potential
    parent: measure:action_potential
    definition: The most positive membrane voltage reached during the action potential.
    scope: The absolute voltage at the peak (overshoot); not the amplitude from rest to peak, the duration or the upstroke
      velocity.
    dimension: voltage
  - event: add_term
    field: measure
    id: measure:clamped_membrane_potential
    label: clamped membrane potential
    definition: The membrane voltage at which a cell is held by continuous current injection between elicited action potentials.
    scope: A voltage set by injected current in current clamp; not the free resting membrane potential.
    dimension: voltage
    synonyms:
    - text: clamped membrane potential
      anchor: CMP, clamped membrane potential
  - event: add_term
    field: measure
    id: measure:expression_profile_correlation
    label: correlation of expression profiles
    definition: Correlation coefficient between the expression profiles of two samples over many genes or proteins (qualifier
      profile says what was correlated).
    scope: Similarity of whole profiles between samples; not the expression of one gene and not a correlation between two
      staining signals.
    dimension: dimensionless
    qualifiers:
      profile:
        dimension: text
  - event: add_term
    field: measure
    id: measure:go_term_gene_count
    label: number of genes in a GO term
    definition: Count of genes of a stated gene set that fall in a stated Gene Ontology term (qualifiers gene_set and go_term).
    scope: Genes counted within one annotation; not a whole-transcriptome count of differentially expressed genes and not
      an enrichment p-value.
    dimension: dimensionless
    qualifiers:
      go_term:
        dimension: text
      gene_set:
        dimension: text
  - event: add_term
    field: measure
    id: measure:differentially_expressed_protein_count
    label: number of differentially expressed proteins
    definition: Count of proteins whose abundance differs between compared conditions at a stated threshold.
    scope: A count over a whole proteome comparison; not a gene count and not the level of one protein.
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:maximal_oxygen_consumption_rate
    label: maximal oxygen consumption rate
    parent: measure:oxygen_consumption_rate
    definition: Oxygen consumption rate after uncoupling (for example with FCCP), the maximal respiration.
    scope: Uncoupled, maximal respiration; not the spare capacity above basal.
    dimension: amount_rate
    synonyms:
    - text: maximal oxygen consumption rate
      anchor: higher maximal oxygen consumption rate
  - event: add_term
    field: measure
    id: measure:spare_respiratory_capacity
    label: spare respiratory capacity
    parent: measure:oxygen_consumption_rate
    definition: Maximal oxygen consumption rate minus basal oxygen consumption rate.
    scope: The reserve above basal respiration; not the maximal rate itself.
    dimension: amount_rate
    synonyms:
    - text: reserve metabolic capacity
      anchor: Reserve metabolic capacity is higher in hCOs cultured in MM
  - event: add_term
    field: measure
    id: measure:fatty_acid_oxidation_rate
    label: fatty acid oxidation rate
    definition: Rate at which cells oxidise fatty acids, for example the etomoxir-sensitive oxygen consumption rate.
    scope: Respiration or substrate use attributed to fatty acids; not total oxygen consumption and not glycolysis.
    dimension: amount_rate
    synonyms:
    - text: fatty acid oxidation
      anchor: Fatty acid oxidation is higher in hCOs cultured in MM
  - event: add_term
    field: measure
    id: measure:mitochondrial_dna_content
    label: mitochondrial DNA content
    definition: Amount of mitochondrial DNA relative to nuclear DNA, a proxy for mitochondrial content.
    scope: mtDNA copy number; not mitochondrial area fraction from images and not respiration.
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:metabolite_abundance
    label: metabolite abundance
    definition: Amount of a stated metabolite (qualifier metabolite) measured in a sample.
    scope: Intracellular metabolite levels; not the concentration of a component in a medium formulation.
    dimension: dimensionless
    qualifiers:
      metabolite:
        dimension: text
  - event: add_term
    field: measure
    id: measure:intensity_correlation
    label: correlation between staining intensities
    definition: Correlation coefficient between two staining intensities measured over the same samples (qualifier signals).
    scope: Co-variation of two signals across samples; not the similarity of expression profiles.
    dimension: dimensionless
    qualifiers:
      signals:
        dimension: text
  - event: add_term
    field: measure
    id: measure:dna_lesion_staining_intensity
    label: DNA lesion staining intensity
    definition: Mean fluorescence intensity of immunostaining for a stated DNA lesion (qualifier lesion) within a stated region
      (qualifier region).
    scope: Staining of a modified base or DNA lesion; not staining of a protein.
    dimension: dimensionless
    qualifiers:
      lesion:
        dimension: text
      region:
        dimension: text
  - event: add_term
    field: measure
    id: measure:dna_staining_intensity
    label: DNA staining intensity
    definition: Total fluorescence of a DNA stain over a tissue, a proxy for its cell number.
    scope: DNA stain over a whole tissue; not staining of a protein or a DNA lesion.
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:tissue_projected_area
    label: tissue projected area
    definition: Area of an engineered tissue in an image taken from above.
    scope: Projected area of a whole tissue; not its cross-section and not the area of single cells.
    dimension: area
  - event: add_term
    field: measure
    id: measure:released_protein_level
    label: released protein level
    definition: Level of a stated intracellular protein (qualifier protein) released into the culture medium, a marker of
      cell damage.
    scope: Protein measured in the conditioned medium; not a medium's formulation and not the protein inside the cells.
    dimension: dimensionless
    qualifiers:
      protein:
        dimension: text
  - event: add_term
    field: measure
    id: measure:post_spring_constant
    label: post spring constant
    definition: Force per unit deflection of the elastic post or pole that loads an engineered tissue.
    scope: Stiffness of the loading device; not a property of the tissue.
    dimension: stiffness
  - event: add_term
    field: measure
    id: measure:cardiomyocyte_subtype_proportion
    label: proportion of cardiomyocyte subtypes
    definition: Shares of cardiomyocytes classed as ventricular-, atrial- or nodal-like, usually from action potential shape
      (qualifier subtype for one class).
    scope: Classification of cells into electrophysiological subtypes; not a fraction positive for a marker.
    dimension: dimensionless
    qualifiers:
      subtype:
        dimension: text
  - event: add_term
    field: measure
    id: measure:ic50
    label: IC50
    definition: Concentration of a compound giving half-maximal inhibition of a stated target (qualifier target).
    scope: An inhibitory potency; not the concentration giving half the maximal response of a readout (EC50).
    dimension: concentration
    qualifiers:
      target:
        dimension: text
    synonyms:
    - text: IC50
      anchor: inhibits both GSK3A/B (IC50 of 13 and 16 nM, respectively)
  - event: add_term
    field: measure
    id: measure:principal_component_score
    label: principal component score
    definition: Coordinate of a sample on a stated principal component (qualifier component) of an analysis over a stated
      gene set (qualifier gene_set).
    scope: Where one sample lies in a principal component analysis; not the variance a component explains.
    dimension: dimensionless
    qualifiers:
      component:
        dimension: text
      gene_set:
        dimension: text
  - event: add_term
    field: measure
    id: measure:tissue_viability
    label: tissue viability
    definition: Fraction of engineered tissues that are live, intact and without deformities.
    scope: Survival of whole tissues; not the fraction of living cells (cell viability) and not breakage counts alone.
    dimension: dimensionless
    synonyms:
    - text: tissue viability
      anchor: Culture of hCO maintains high tissue viability in CTRL medium or MM
