  F7C_basal.mito_stress_parameter:
    item: F7C_basal
    formula: not stated
    anchor:
      quote: The Mito Stress Test was performed according to the manufacturer’s instructions
      where: Methods, Seahorse XFp Analyzer
    no_formula: the parameter is computed by the kit's definitions, stated only by reference to the manufacturer's instructions (no citation in the record)
    inputs:
      ocr: {item: F7B_ocr_baseline, kind: per sample}
      nonmito: {not_stated: true, kind: per sample, note: OCR after Rotenone/Antimycin A; not printed}
    alternatives:
    - label: Agilent Seahorse XF Cell Mito Stress Test definition (not stated in the paper)
      formula: basal = ocr - nonmito
  F7C_atp.mito_stress_parameter:
    item: F7C_atp
    formula: not stated
    anchor:
      quote: The Mito Stress Test was performed according to the manufacturer’s instructions
      where: Methods, Seahorse XFp Analyzer
    no_formula: the parameter is computed by the kit's definitions, stated only by reference to the manufacturer's instructions (no citation in the record)
    inputs:
      ocr: {item: F7B_ocr_baseline, kind: per sample}
      oligo: {not_stated: true, kind: per sample, note: minimum OCR after Oligomycin; not printed}
    alternatives:
    - label: Agilent Seahorse XF Cell Mito Stress Test definition (not stated in the paper)
      formula: atp = ocr - oligo
    - label: same definitions expressed through printed parameters (ATP production = basal respiration - proton leak)
      formula: atp = basal - leak
  F7C_leak.mito_stress_parameter:
    item: F7C_leak
    formula: not stated
    anchor:
      quote: The Mito Stress Test was performed according to the manufacturer’s instructions
      where: Methods, Seahorse XFp Analyzer
    no_formula: the parameter is computed by the kit's definitions, stated only by reference to the manufacturer's instructions (no citation in the record)
    inputs:
      oligo: {not_stated: true, kind: per sample, note: minimum OCR after Oligomycin; not printed}
      nonmito: {not_stated: true, kind: per sample, note: OCR after Rotenone/Antimycin A; not printed}
    alternatives:
    - label: Agilent Seahorse XF Cell Mito Stress Test definition (not stated in the paper)
      formula: leak = oligo - nonmito
  F7C_spare.mito_stress_parameter:
    item: F7C_spare
    formula: not stated
    anchor:
      quote: The Mito Stress Test was performed according to the manufacturer’s instructions
      where: Methods, Seahorse XFp Analyzer
    no_formula: the parameter is computed by the kit's definitions, stated only by reference to the manufacturer's instructions (no citation in the record)
    inputs:
      maxr: {not_stated: true, kind: per sample, note: maximal OCR after FCCP minus non-mitochondrial OCR; not printed (F7B_max_resp has no values)}
      basal: {item: F7C_basal, kind: per sample}
    alternatives:
    - label: Agilent Seahorse XF Cell Mito Stress Test definition, as an absolute difference (not stated in the paper)
      formula: spare = maxr - basal
    - label: Agilent definition as a percentage (not stated in the paper)
      formula: spare = maxr/basal
