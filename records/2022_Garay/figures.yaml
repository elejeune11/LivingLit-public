no_points:
  F2GH: 'first look (small model): H: bars with mean±SEM error bars; G is a blot. (main.pdf p. 4)'
  F3BF: 'B: violin of per-cell points, many per group and heavily overlapping (not separable; printed n is 3 experiments);
    C-E: bars with mean±SEM, no points. F (3 points per bar) is read as fig3f. (main.pdf p. 6)'
  F5DL: 'D-E: mean kinetic OCR/ECAR curves with error bars, no individual points. G-L: dot clouds of hundreds of opaque same-colour
    discs per column, flattened so covered discs are lost (60d in G: about 90 visible discs vs about 560 implied by (SD/SEM)^2);
    points not separable, so means with SEM only. F: per-experiment means, no item. (main.pdf p. 9)'
  F5MR: 'M-N, Q-R: two columns (yellow DMSO, purple SP) of radial-gradient discs (radius about 1.85 pt) stored as flattened
    gradient pieces, overlapping into merged blobs of 2-5 disc areas each (only one of the 4 x 2 columns has a single free-standing
    disc); the disc outlines are not recoverable from the pieces (arc fitting gives about 35 centre clusters per column) and
    the covered discs are lost, so points are not separable; means with SEM only. (main.pdf p. 9)'
  F6CF: 'first look (small model): Panels A–F are scheme, traces, and violin plots with mean/quartile lines, no per-sample markers.
    (main.pdf p. 11)'
  S3FG: 'F-G: western blots and bar charts (DMSO 30d yellow, SP 30d purple, three lines) of p-ERK/total ERK and p-AKT/total
    AKT, each a bar with a one-sided error bar; no individual points. (mmc1.pdf p. 4)'
