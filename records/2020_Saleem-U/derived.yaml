        x0: x0
    anchor:
      quote: CaT amplitudes showed 10% decline (8,003 ± 344, 7,241 ± 327, 7,293 ± 320, AU ± SEM, N = 15)
      where: Results, Specificity of Fluorescence Signal
    inputs:
      x:
        value: S2FG_cat.values.m3
        part: mean
        kind: per sample
      x0:
        value: S2FG_cat.values.m1
        part: mean
        kind: per sample
    output: S2FG_cat.values.decline
    output_unit: '%'
    note: 'The 10% decline is stated over the series of three measurements (over: [m1, m2, m3]) without saying which pair; written as last versus first (m3 vs m1, 8.9%); m2 vs m1 (9.5%) is the alternative.
      Dunnett post-test is vs measurement 1, so both compare to m1.'
    alternatives:
    - label: m2 versus m1 (unstated choice)
      formula: s = (x0 - x)/x0
      note: 'x = S2FG_cat.values.m2 (7,241 AU), x0 = m1 (8,003 AU): 9.5%'
    aggregation: not stated
  F2D_force.pct_baseline:
    item: F2D_force
    formula: r = x/x0
    anchor: &id001
      quote: data are normalized to own baseline
      where: Figure 2 legend
    library:
      formula: ratio_def
      vars:
        r: r
        a: x
        b: x0
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: absolute value of each EHT after the intervention; not printed
