'normal' text-anchor='middle'>fibrin</text><rect x='128.0' y='236' width='84' height='26' rx='6' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='170.0' y='253.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='middle'>Matrigel</text><rect x='234.0' y='236' width='56' height='26' rx='6' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='262.0' y='253.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='middle'>PDMS</text><rect x='295.0' y='236' width='126' height='26' rx='6' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='358.0' y='253.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='middle'>polyacrylamide</text><text x='262.0' y='290.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='middle' font-style='italic'>stiffness “8 kPa”</text><text x='362.0' y='290.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='middle' font-style='italic'>stiffness “4 kPa”</text><text x='324.0' y='322.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#b07d0c' font-weight='normal' text-anchor='middle' font-style='italic'>group “soft substrate”: stiffness &lt; 100 kPa</text><text x='36.0' y='344.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>PDMS has one ancestor at each level, so “substrate@1” has one answer.</text><text x='36.0' y='359.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>Stiffness is a qualifier, compared at printed precision. A group is a named</text><text x='36.0' y='374.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>rule over terms and qualifiers, usable by keys; it does not change ancestors.</text><path d='M669.0 136.0 L580.0 176.0' fill='none' stroke='#5d6670' stroke-width='1.4' stroke-linejoin='round'/><path d='M669.0 136.0 L770.0 176.0' fill='none' stroke='#5d6670' stroke-width='1.4' stroke-linejoin='round'/><path d='M580.0 202.0 L580.0 236.0' fill='none' stroke='#5d6670' stroke-width='1.4' stroke-linejoin='round'/><path d='M580.0 202.0 L770.0 236.0' fill='none' stroke='#5d6670' stroke-width='1.4' stroke-linejoin='round'/><line x1='770.0' y1='202.0' x2='765.1' y2='202.9' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='761.1' y1='203.6' x2='756.2' y2='204.5' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='752.3' y1='205.2' x2='747.4' y2='206.1' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='743.4' y1='206.8' x2='738.5' y2='207.6' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='734.6' y1='208.3' x2='729.6' y2='209.2' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='725.7' y1='209.9' x2='720.8' y2='210.8' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='716.8' y1='211.5' x2='711.9' y2='212.4' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='708.0' y1='213.1' x2='703.1' y2='214.0' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='699.1' y1='214.7' x2='694.2' y2='215.6' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='690.3' y1='216.3' x2='685.3' y2='217.1' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='681.4' y1='217.9' x2='676.5' y2='218.7' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='672.5' y1='219.4' x2='667.6' y2='220.3' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='663.7' y1='221.0' x2='658.8' y2='221.9' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='654.8' y1='222.6' x2='649.9' y2='223.5' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='646.0' y1='224.2' x2='641.0' y2='225.1' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='637.1' y1='225.8' x2='632.2' y2='226.7' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='628.3' y1='227.4' x2='623.3' y2='228.2' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='619.4' y1='229.0' x2='614.5' y2='229.8' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='610.5' y1='230.5' x2='605.6' y2='231.4' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='601.7' y1='232.1' x2='596.8' y2='233.0' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='592.8' y1='233.7' x2='587.9' y2='234.6' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='584.0' y1='235.3' x2='580.0' y2='236.0' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='770.0' y1='202.0' x2='770.0' y2='207.0' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='770.0' y1='211.0' x2='770.0' y2='216.0' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='770.0' y1='220.0' x2='770.0' y2='225.0' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><line x1='770.0' y1='229.0' x2='770.0' y2='234.0' stroke='#c8402f' stroke-width='1.4' stroke-linecap='round'/><rect x='623.5' y='111' width='91' height='26' rx='6' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='669.0' y='128.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>substrate</text><rect x='503.0' y='176' width='154' height='26' rx='6' fill='#e6ecf7' stroke='#2a5ab0' stroke-width='1.6'/><text x='580.0' y='193.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#2a5ab0' font-weight='bold' text-anchor='middle'>synthetic material</text><rect x='707.0' y='176' width='126' height='26' rx='6' fill='#f8e3e1' stroke='#c8402f' stroke-width='1.6'/><text x='770.0' y='193.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#c8402f' font-weight='bold' text-anchor='middle'>soft substrate</text><rect x='552.0' y='236' width='56' height='26' rx='6' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='580.0' y='253.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='middle'>PDMS</text><rect x='707.0' y='236' width='126' height='26' rx='6' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='770.0' y='253.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='middle'>polyacrylamide</text><text x='669.0' y='290.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#c8402f' font-weight='normal' text-anchor='middle' font-style='italic'>but stiff PDMS (MPa) is not soft: the parent depends on a number</text><text x='474.0' y='344.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>“Same at level 1” has two answers for PDMS, and every move or split</text><text x='474.0' y='359.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>has to be replayed along every path. The second parent is really a</text><text x='474.0' y='374.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#5d6670' font-weight='normal' text-anchor='start'>second dimension (stiffness): a qualifier or a group instead.</text></svg>
