id: 2022_Huebsch
field_set: 3

context_anchors:
  - {field: species, value: "human", anchor: {quote: "Human induced pluripotent stem cell (hiPSC) technology provides an exciting opportunity for disease modeling and drug discovery.", where: "Introduction"}}
  - {field: differentiation_factors.CHIR99021, value: "8 μM", anchor: {quote: "At day 0, hiPSC were >90% confluent and were treated with Roswell Park Memorial Institute Medium 1640 (RPMI) containing B-27 supplement without insulin (RPMI-I), along with 8μM CHIR99021", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: confluency, value: ">90% confluent", anchor: {quote: "At day 0, hiPSC were >90% confluent and were treated with Roswell Park Memorial Institute Medium 1640 (RPMI) containing B-27 supplement without insulin (RPMI-I)", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: differentiation_factors.IWP_2, value: "5 μM", anchor: {quote: "On day 2, medium was replaced with RPMI-I containing 5μM IWP-2 (Peprotech).", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: hipsc_medium, value: "Essential 8 Medium", anchor: {quote: "frozen stocks of pluripotent cells were thawed and plated on hESC-Qualified Matrix (Corning; Corning, NY) in Essential 8 Medium (E8; Thermo Fisher, Tewksbury, MA)", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: hipsc_coating, value: "hESC-Qualified Matrix", anchor: {quote: "frozen stocks of pluripotent cells were thawed and plated on hESC-Qualified Matrix (Corning; Corning, NY) in Essential 8 Medium", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: wnt_activation_days, value: "24 hr", anchor: {quote: "Exactly 24 hr after drug was added, medium was exchanged for RPMI-I (day 1).", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: purification, value: "lactate treatment", anchor: {quote: "Characterization of the purity of iPSC-CM obtained by lactate treatment of cryopreserved iPSC-cardiomyocyte differentiation", where: "Supplementary Fig. 1 title"}}
  - {field: purity_method, value: "flow cytometry for Cardiac Troponin T", anchor: {quote: "Cardiomyocyte purity both before and after this procedure was characterized by flow cytometry for Cardiac Troponin T (TNNT2; Table S2; Fig. S1).", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: purity, value: "> 90%", anchor: {quote: "Typically, after lactate purification (see Methods), we observed > 90% cTnT positive cardiomyocytes.", where: "Reporting Summary, Cell population abundance", file: journal_version.pdf}}
  - {field: cm_medium, value: "glucose free RPMI", anchor: {quote: "All media were prepared from the same batch of powdered, glucose free RPMI.", where: "Table S1 footnote", file: NIHMS1896910-supplement-Supplemental_Documents.docx}}
  - {field: supplements.B_27, value: "2%", anchor: {quote: "all media were supplemented with 2% B-27 supplement and 150µg/mL L-ascorbic acid.", where: "Table S1 footnote", file: NIHMS1896910-supplement-Supplemental_Documents.docx}}
  - {field: supplements.L_ascorbic_acid, value: "150μg/mL", anchor: {quote: "all media were supplemented with 2% B-27 supplement and 150µg/mL L-ascorbic acid.", where: "Table S1 footnote", file: NIHMS1896910-supplement-Supplemental_Documents.docx}}
  - {field: replating_coating, value: "Matrigel", anchor: {quote: "hiPSC-CM were thawed and plated at a density of 100,000 cells/cm2 onto Matrigel, in RPMI-C with 10μM Y27632", where: "Methods, Cardiomyocyte Differentiation"}}
  - {field: composition, value: "80% hiPSC-CM and 20% hiPSC-SC", anchor: {quote: "We then prepared a cocktail of 80% hiPSC-CM and 20% hiPSC-SC, at a density of 6.6×106 cells/mL", where: "Methods, Self-Assembly of Cardiac Microtissues within Cardiac MPS"}}
  - {field: cell_types, value: "hiPSC-CM + hiPSC-SC", anchor: {quote: "We then prepared a cocktail of 80% hiPSC-CM and 20% hiPSC-SC, at a density of 6.6×106 cells/mL", where: "Methods, Self-Assembly of Cardiac Microtissues within Cardiac MPS"}}
  - {field: dissociation_reagent, value: "0.25% trypsin", anchor: {quote: "hiPSC-CM and hiPSC-SC (passage 5 – 8) were singularized with 0.25% trypsin after extensive PBS washes.", where: "Methods, Self-Assembly of Cardiac Microtissues within Cardiac MPS"}}
  - {field: cell_line, value: "WTC", anchor: {quote: "Wild Type C (WTC) human hiPSC harboring a single-copy of CAG-driven GCaMP6f knocked into the first Exon of the AAVS1 “safe harbor” locus", where: "Methods, Cell Sourcing"}}
  - {field: transgene, value: "CAG-driven GCaMP6f", anchor: {quote: "Wild Type C (WTC) human hiPSC harboring a single-copy of CAG-driven GCaMP6f knocked into the first Exon of the AAVS1 “safe harbor” locus", where: "Methods, Cell Sourcing"}}
  - {field: transgene.locus, value: "AAVS1", anchor: {quote: "harboring a single-copy of CAG-driven GCaMP6f knocked into the first Exon of the AAVS1 “safe harbor” locus", where: "Methods, Cell Sourcing"}}
  - {field: donor_age, value: "30-year-old", anchor: {quote: "The parent cell line (WTC) was reprogrammed from fibroblasts derived from a healthy 30-year-old Japanese male with a normal electrocardiogram", where: "Methods, Cell Sourcing"}}
  - {field: cell_line, value: "SCVI20", anchor: {quote: "The second line, Stanford University Cardiovascular Biobank Line 20 (SCVI20), was generated from a healthy, disease genotype-free 77-year-old Caucasian male", where: "Methods, Cell Sourcing"}}
  - {field: donor_age, value: "77-year-old", anchor: {quote: "Stanford University Cardiovascular Biobank Line 20 (SCVI20), was generated from a healthy, disease genotype-free 77-year-old Caucasian male", where: "Methods, Cell Sourcing"}}
  - {field: cell_line, value: "SCVI273", anchor: {quote: "The third cell line, SCVI273, was generated from a healthy 43-year-old Asian female", where: "Methods, Cell Sourcing"}}
  - {field: donor_age, value: "43-year-old", anchor: {quote: "The third cell line, SCVI273, was generated from a healthy 43-year-old Asian female", where: "Methods, Cell Sourcing"}}
  - {field: cell_line, value: "G15.AO", anchor: {quote: "The fourth cell line, G15.AO48, was generated from mesenchymal stem cells derived from adipose tissue (ADSCs) using retroviral vectors", where: "Methods, Cell Sourcing"}}
  - {field: cell_line, value: "WTC + SCVI20", anchor: {quote: "WTC, open squares and circles; SCVI20, closed squares and circles", where: "Extended Data Fig. 6 legend"}}
  - {field: platform, value: "cardiac MPS", anchor: {quote: "we formed cardiac MPS that mimicked the mass composition of the human heart", where: "Results, Screening for optimal carbon sourcing in hiPSC-cardiac MPS"}}
  - {field: substrate, value: "polydimethylsiloxane", anchor: {quote: "The cardiac MPS is formed by replica molding Polydimethylsiloxane (PDMS; Sylgard 184 kit, Dow Chemical, Midland, MI)", where: "Methods, Fabrication of Cardiac MPS"}}
  - {field: stromal_cell, value: "hiPSC-derived stromal cells", anchor: {quote: "These hiPSC-derived stromal cells (hiPSC-SC) have a similar lineage to cardiomyocytes", where: "Supplemental Methods", file: NIHMS1896910-supplement-Supplemental_Documents.docx}}
  - {field: mechanical_load, value: "contract against PDMS posts", anchor: {quote: "as contrasted to cardiomyocytes in MPS that contract against PDMS posts", where: "Results, Maturation Media Supports a Shift Toward a more Mature Mitochondrial Structure"}}
  - {field: seeding_density, value: "2×104 cells", anchor: {quote: "3μL of this cocktail, corresponding to 2×104 cells, was injected into the cell loading inlet of each MPS", where: "Methods, Self-Assembly of Cardiac Microtissues within Cardiac MPS"}}
  - {field: platform, value: "2D monolayer", anchor: {quote: "In 2D monolayers, hiPS-SC overgrow hiPSC-CM (data not shown).", where: "Methods, Plating of hiPSC-CM for 2D Monolayer Studies"}}
  - {field: substrate, value: "Matrigel", anchor: {quote: "plated at a density of 200,000 cells/cm2 onto GFR Matrigel", where: "Methods, Plating of hiPSC-CM for 2D Monolayer Studies"}}
  - {field: seeding_density, value: "200,000 cells/cm2", anchor: {quote: "plated at a density of 200,000 cells/cm2 onto GFR Matrigel", where: "Methods, Plating of hiPSC-CM for 2D Monolayer Studies"}}
  - {field: cell_types, value: "hiPSC-CM", anchor: {quote: "for 2D pharmacology and gene expression studies, biochemically purified hiPSC-CM were grown in monolayers", where: "Methods, Plating of hiPSC-CM for 2D Monolayer Studies"}}
  - {field: preparation, value: "live", anchor: {quote: "Live MPS and monolayer were incubated with Mitotracker for 30min at 37°C in RPMI 1640 supplement with insulin.", where: "Methods, Analysis of Mitochondrial Morphology and Potential"}}
  - {field: measurement_medium, value: "RPMI 1640 supplement with insulin", anchor: {quote: "Live MPS and monolayer were incubated with Mitotracker for 30min at 37°C in RPMI 1640 supplement with insulin.", where: "Methods, Analysis of Mitochondrial Morphology and Potential"}}
  - {field: preparation, value: "fixed", anchor: {quote: "Samples were then washed with PBS for 10min before being fixed in 4% PFA for 15min and washed again with PBS.", where: "Methods, Analysis of Mitochondrial Morphology and Potential"}}
  - {field: preparation, value: "lysis buffer", anchor: {quote: "The PDMS component, with microtissue attached, was transferred to a microcentrifuge tube, and pooled with up to six other microtissues in lysis buffer", where: "Methods, Gene Expression in MPS"}}
  - {field: preparation, value: "singularized", anchor: {quote: "Cells were washed twice in PBS and singularized with 0.25% trypsin/EDTA.", where: "Reporting Summary, Flow cytometry sample preparation", file: journal_version.pdf}}
  - {field: preparation, value: "organotypic slice culture", anchor: {quote: "Brandenburger M et al. Organotypic slice culture from human adult ventricular myocardium.", where: "References, 56"}}
  - {field: temperature, value: "37 °C", anchor: {quote: "During imaging, MPS or 2D monolayers in multi-well plates were maintained at 37°C on a stage equipped with a heating unit", where: "Methods, Image Acquisition for Beating Physiology Studies"}}
  - {field: day_of_measurement, value: "day 10", anchor: {quote: "Tissues were treated with SM or MM for 10 days. On day 10, MPS were flushed for 10 minutes with PBS at 25°C.", where: "Methods, MPS Tissue Isolation and Immunofluorescence Imaging"}}
  - {field: measurement_medium, value: "RPMI-C without phenol red", anchor: {quote: "MPS were equilibrated to media without dye before imaging (RPMI-C without phenol red) as described above, using a Red LED (640nm)", where: "Methods, Optical Measurement of Action Potentials"}}
  - {field: measurement_medium, value: "Tyrode's saline", anchor: {quote: "For testing inotropic responsiveness to extracellular calcium concentration, Tyrode’s saline (0.1g/L anhydrous MgCl2, 0.2g/L KCl, 8g/L NaCl", where: "Methods, Pharmacology in MPS and 2D Monolayers"}}
  - {field: measurement_calcium_mM, value: "0.9mM", anchor: {quote: "For force calculation (inotropy), MPS were cultured in Tyrodde’s saline with 0.9mM Ca2+.", where: "Fig. 4 legend"}}
  - {field: pacing, value: "1 Hz", anchor: {quote: "Before recording videos, cells were paced for 10 seconds (20V, 20msec bipolar pulses at 1Hz, ION OPTIX Myopacer Field Simulator).", where: "Methods, Image Acquisition for Beating Physiology Studies"}}
  - {field: number_of_lines, value: "four", anchor: {quote: "Spontaneous beat rate for a representative set of MPS for all four genotypes, pre-treated for 10 days with either SM or MM.", where: "Extended Data Fig. 4 legend"}}
  - {field: maturation_strategy, value: "Maturation Media", anchor: {quote: "This led to a new Maturation Media (herein referred to as “MM”): glucose free RPMI basal media supplemented with 2% B-27", where: "Results, Screening for optimal carbon sourcing in hiPSC-cardiac MPS"}}
  - {field: maturation_strategy, value: "standard media", anchor: {quote: "Comparison of MPS cultured in standard media (red) to MPS cultured in glucose-free media during L9 studies (black)", where: "Extended Data Fig. 2 legend"}}
  - {field: maturation_strategy, value: "glucose-free media", anchor: {quote: "Comparison of MPS cultured in standard media (red) to MPS cultured in glucose-free media during L9 studies (black)", where: "Extended Data Fig. 2 legend"}}
  - {field: maturation_strategy, value: "fatty-acid media", anchor: {quote: "MPS were incubated with different fatty-acid media for ten days before their beating physiology and calcium flux were assessed.", where: "Results, Screening for optimal carbon sourcing in hiPSC-cardiac MPS"}}
  - {field: maturation_strategy, value: "modulating palmitate and albumin in MM", anchor: {quote: "contractile prevalence in MM-pre-treated MPS that resulted from modulating the levels of palmitate and albumin in MM", where: "Extended Data Fig. 3 legend"}}
  - {field: maturation_strategy.oleic_acid, value: "125 μM", anchor: {quote: "MM with 125μM oleic acid, 100μM palmitic acid, 0.5g/l glucose, 10mM galactose and 2.5% BSA was used for all subsequent studies", where: "Results"}}
  - {field: maturation_strategy.palmitic_acid, value: "100 μM", anchor: {quote: "MM with 125μM oleic acid, 100μM palmitic acid, 0.5g/l glucose, 10mM galactose and 2.5% BSA was used for all subsequent studies", where: "Results"}}
  - {field: maturation_strategy.glucose, value: "0.5 g/l", anchor: {quote: "MM with 125μM oleic acid, 100μM palmitic acid, 0.5g/l glucose, 10mM galactose and 2.5% BSA was used for all subsequent studies", where: "Results"}}
  - {field: maturation_strategy.galactose, value: "10 mM", anchor: {quote: "MM with 125μM oleic acid, 100μM palmitic acid, 0.5g/l glucose, 10mM galactose and 2.5% BSA was used for all subsequent studies", where: "Results"}}
  - {field: maturation_strategy.BSA, value: "2.5%", anchor: {quote: "MM with 125μM oleic acid, 100μM palmitic acid, 0.5g/l glucose, 10mM galactose and 2.5% BSA was used for all subsequent studies", where: "Results"}}
  - {field: maturation_strategy.BSA, value: "0.25%", anchor: {quote: "we concluded that an ideal maturation media would contain this higher level (2.5%, vs. 0.25% contained in standard B-27 supplemented media", where: "Results"}}
