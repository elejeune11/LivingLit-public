    label: deferoxamine mesylate
    lookup: 'chebi ''desferrioxamine'' and ''deferoxamine''; the paper names the salt: ''deferoxamine mesylate (DFO)'''
    synonyms:
    - text: DFO
      anchor: For deferoxamine mesylate (DFO) (MilliporeSigma, Burlington, MA)-induced hypertrophy, cells were treated with
        30 mM DFO in DMSO or vehicle (DMSO) for 96 hours.
  - event: adopt
    field: disease_model
