# Derivations as the methods state them (formula agent, instructions formulas_v3).
record: 2018_Ronaldson-Bouchard
formula_library_version: 0
agent:
  model: llm
  instructions: formulas_v3
derived:
  F1e_stress.stress:
    item: F1e_stress
    formula: s = F/A
    anchor: &id001
      quote: Twitch forces were calculated as the average of the difference between cyclic peak maximum and minimum force and normalized
        to the cross-sectional area
      where: Methods, Direct measurements of force
    library:
      formula: stress_def
      vars:
        sigma: s
        F: F
        A: A
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: 'twitch force: mean over cycles of (peak maximum - minimum force); not printed'
      A:
        not_stated: true
        kind: per sample
        note: measured at the tissue centre after force measurements; values not printed
    alternatives:
    - label: area from a measured diameter assuming a circular cross-section (shape not stated)
      formula: s = 4*F/(pi*d**2)
