      file: mmc1.pdf
    compares:
    - mm
    - ctr
    n:
      printed: n=3-8 EHTs
      counts: EHTs
    stats:
      test: not stated
      statistic: not stated
      p: p < 0.05 (Methods)
    method: video-optical recording of spontaneous contractions
    stated_direction:
      direction: down
      anchor:
        quote: while spontaneous beat rate was significantly lower in MM culture
