record: 2021_deLange
formula_library_version: 29
agent:
  model: llm
  instructions: formulas_v3
derived:
  ST3_auto_early.pct_iso:
    item: ST3_auto_early
    measure: automaticity
    formula: d = (x - x0)/x0
    anchor: &id001
      quote: expressed as % isoproterenol response
      where: Results
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        value: ST3_auto_early.values.auto_early_iso_table
        part: mean
        kind: per sample
      x0:
        value: ST3_auto_early.values.auto_early_bl_table
        part: mean
        kind: per sample
    output: ST3_auto_early.values.auto_early_pct_table
    output_unit: '%'
    aggregation: not stated
    note: paired design (each ECT at baseline and with isoproterenol); the % values in brackets after each Iso mean are read
      as the % change from baseline; whether each ECT's % change was averaged or the means were used is not stated
