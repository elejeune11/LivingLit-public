    anchor: &vpct
      quote: Ventricular cells represented only 1% of the cardiomyocytes
      where: Results, Long-term culture
    library: *ratio_cm
    inputs:
      count: {value: F3H_ventricular_cm.values.count_table, kind: constant}
      cm: *cm
    output: F3H_ventricular_cm.values.pct_of_cm_text
  F3H_ventricular_cm.pct_of_cm_table:
    item: F3H_ventricular_cm
    group: ml_d100
    formula: pct = count/cm
    anchor: *vpct
    library: *ratio_cm
