  F2B_well.increase_d8:
    item: F2B_well
    group: d8
    formula: r = (L - L0)/L0
    anchor:
      quote: the 8× dyn-EHT showed the greatest change, with an ~50% increase in diastolic length
      where: Results
      file: scitranslmed.abd1817.pdf
    library:
      formula: relative_change
      vars:
        d: r
        x: L
        x0: L0
    inputs:
      L:
        data: F2B_well/d8
        kind: per sample
      L0:
        value: F2B_well.values.well
        kind: constant
        note: the PDMS well length; the reference is not stated
    output: F2B_well.values.d8_inc
    alternatives:
    - label: reference = 8x constrained diastolic length
      formula: r = (L - L0)/L0
      note: L0 from F2B_well/c8 (about 30% instead of about 50%)
  S13C_Desmoplakin.reduction:
    item: S13C_Desmoplakin
    formula: s = (x0 - x)/x0
    anchor:
      quote: a 65% reduction in desmoplakin
      where: Discussion
      file: scitranslmed.abd1817.pdf
    library:
      formula: relative_decrease
      vars:
        s: s
        x: x
        x0: x0
    inputs:
      x:
        data: S13C_Desmoplakin/mut
        kind: per sample
      x0:
        data: S13C_Desmoplakin/ctl
        kind: per sample
    output: S13C_Desmoplakin.values.red
  S13C_Desmocollin_2.reduction:
