record: 2022_Ergir
formula_library_version: 23
agent:
  model: llm
  instructions: formulas_v3
derived:
  F7A_fabp3.fold_change:
    item: F7A_fabp3
    formula: fold = 2**lfc
    anchor:
      quote: the heart-type fatty acid binding protein (FABP3) and the lipoprotein lipase (LPL) displayed 4 times fold upregulation
      where: Results, metabolic activity
    library:
      formula: fold_change_from_log2_fold_change
      vars: {r: fold, l: lfc}
    inputs:
      lfc:
        value: F7A_fabp3.values.fabp3_log2fc_data
        kind: constant
        note: DESeq2 log2 fold change 3D-d50 vs 2D-d50 (Supplementary dataset 1)
    output: F7A_fabp3.values.fabp3_fold_text
    alternatives:
    - label: the printed '4 times fold' is the log2 fold change itself
      formula: fold = lfc
      note: the record reader's suspected error; the text's 4 matches the log2 value
  F7A_lpl.fold_change:
    item: F7A_lpl
    formula: fold = 2**lfc
    anchor:
      quote: the heart-type fatty acid binding protein (FABP3) and the lipoprotein lipase (LPL) displayed 4 times fold upregulation
      where: Results, metabolic activity
    library:
      formula: fold_change_from_log2_fold_change
      vars: {r: fold, l: lfc}
    inputs:
