    page: 2
    crop: [155, 118, 415, 165]
    script: figures/f1a_proportions.py
    unit: F1a
    kind: raster
    groups:
      ce_CM: {item: F1a_proportions, group: ce, unit_of_value: '%'}
      ce_EC: {item: F1a_proportions, group: ce, unit_of_value: '%'}
      cm_CM: {item: F1a_proportions, group: cm, unit_of_value: '%'}
      cm_MC: {item: F1a_proportions, group: cm, unit_of_value: '%'}
      cem_CM: {item: F1a_proportions, group: cem, unit_of_value: '%'}
      cem_EC: {item: F1a_proportions, group: cem, unit_of_value: '%'}
      cem_MC: {item: F1a_proportions, group: cem, unit_of_value: '%'}
    note: >-
      Fig. 1a lower row, three bar charts (CM+EC, CM+MC, CM+EC+MC), each with its own 0-80 % axis; label = ECT type _ cell
      type whose proportion the bar shows. Bars only (mean and upper end of the error bar, SD per Methods); no points drawn.
      CM+EC MC bar is too short to separate its fill from its error cap and is not read; CM+MC has no EC bar drawn.
