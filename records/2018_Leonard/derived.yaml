    formula: c = r - 1
    anchor: &id006
      quote: where NPPA went up by 40% and ACTA1 went up by 80% compared to EHTs at Day 1
      where: Section 4
    library:
      formula: relative_change_from_ratio
      vars:
        d: c
        r: r
    inputs:
      r:
        reading: fig7a/F7A_NPPA_K4vDay1/K4
        kind: per sample
        note: K4 fold change normalized to EHTs at Day 1 (Day 1 = 1)
    output: F7A_NPPA_K4vDay1.values.change_text
    aggregation: of means
    note: '"went up by 40% ... compared to EHTs at Day 1" read as the K4 mean ratio minus 1'
