  f3b_summary.fold_range:
    item: f3b_summary
    measure: ATP synthase subunit fold change
    formula: not stated
    anchor:
      quote: found that 9 out of 11 subunits showed an 2- to 4.5-fold increase in 3D and heart samples in comparison with 2D
      where: Results
      file: main.pdf
    no_formula: 'a range (smallest and largest) of per-subunit fold changes over 9 subunits and two groups: extremes over items are not a closed-form
      library step'
    note: Each subunit's fold change is a ratio of group means (ratio_def); its released counts are in data.yaml (f3b_* items).
  f2d_acot1.fold_change:
    item: f2d_acot1
    measure: ACOT1 normalized spectral count
