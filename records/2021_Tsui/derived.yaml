  F7c_ic50_apd.ic50:
    item: F7c_ic50_apd
    measure: IC50 of APD90 prolongation by cisapride
    formula: not stated
    anchor:
      quote: the normalized data was fit to a non-linear dose response curve using a least squares fit
      where: Methods 2.19
    no_formula: a least-squares fit of a dose–response curve in GraphPad Prism (model, Hill slope and constraints not stated); curve fits are
      outside the closed-form library
    inputs:
      curve:
        derived: F7b_dr_apd.normalised
        kind: per sample
  F7c_ic50_bi.ic50:
    item: F7c_ic50_bi
    measure: IC50 of change in beat interval by cisapride
    formula: not stated
    anchor:
      quote: the normalized data was fit to a non-linear dose response curve using a least squares fit
      where: Methods 2.19
    no_formula: a least-squares fit of a dose–response curve in GraphPad Prism (model, Hill slope and constraints not stated); curve fits are
      outside the closed-form library
    inputs:
      curve:
        derived: F7b_dr_bi.normalised
        kind: per sample
  F7b_dr_apd.normalised:
    item: F7b_dr_apd
    measure: '% change in APD90'
    formula: n = (x - xmin)/(xmax - xmin)
    anchor:
      quote: APD90 or ΔBI values were normalized such that the lowest value was set at 0% and the largest value at 100%
      where: Methods 2.19
    library:
      formula: min_max_normalised
      vars:
        n: n
        x: x
        xmin: xmin
        xmax: xmax
    inputs:
      x:
        not_stated: true
        kind: per sample
        note: APD90 at one cisapride concentration
      xmin:
        not_stated: true
        kind: not stated
        note: 'lowest value: per tissue, per group or pooled is not stated'
      xmax:
        not_stated: true
        kind: not stated
        note: 'largest value: per tissue, per group or pooled is not stated'
    output_unit: '%'
    note: Printed as % (fraction × 100). Fig. 7b and S9a label the axis '% change', but Methods 2.19 describes min–max normalisation.
  F7b_dr_bi.delta_bi:
    item: F7b_dr_bi
    measure: beat-to-beat change in beat interval
    formula: dbi = bi2 - bi1
    anchor:
      quote: calculating the difference in this interval from one beat to the next
      where: Methods 2.19
    library:
      formula: difference_from_reference
      vars:
        d: dbi
        x: bi2
        x0: bi1
    inputs:
      bi2:
        not_stated: true
        kind: per sample
        note: a beat interval
      bi1:
        not_stated: true
        kind: per sample
        note: the preceding beat interval
    alternatives:
    - label: absolute difference
      formula: dbi = Abs(bi2 - bi1)
      note: whether the sign is kept is not stated
    - label: averaged over beats
      note: how successive differences were reduced to one value per tissue is not stated
