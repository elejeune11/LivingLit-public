    inputs:
      d:
        not_stated: true
        kind: per sample
        note: flexible-post deflection over time
      method:
        by_reference:
          citation: ref27
          anchor: *id004
        kind: not stated
    alternatives:
    - label: force times velocity
      formula: P = F*v
    note: the same method holds for every F2 twitch power item; plotted values are maxima during contraction
  F2_work_K4vK1.work:
