  F1_rat.modulus:
    item: F1_rat
    measure: Young's modulus
    formula: E = ds/de
    anchor:
      quote: Young’s modulus was determined from the linear portion of the stress−strain curve
      where: Methods 2.7
    library:
      formula: linear_elastic_stress_strain
      vars:
        E: E
        sigma: ds
        eps: de
    inputs:
      ds:
        not_stated: true
        kind: per sample
        note: stress change across the fitted linear region; curves not released
      de:
        not_stated: true
        kind: per sample
        note: strain change across the fitted linear region (usually between 0 and 5% strain)
    alternatives:
    - label: secant from zero strain
      formula: E = s/e
      note: slope over the stated region is taken as stated; a secant through the origin is the unstated alternative
    aggregation: mean of per-sample
  F1_range.modulus:
