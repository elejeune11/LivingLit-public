record: 2018_Gao
vocabulary_version: 35
agent: {model: llm, instructions: terms_v4}
edits:
# ---------------------------------------------------------------- context: own and adopted terms, synonyms
- adopt_own:
    field: cell_line
    id: cell_line:zhang_hcipsc
    label: hciPSC (cardiac-lineage hiPSC line of the Zhang lab, unnamed)
    definition: GFP-expressing hiPSC line reprogrammed with Sendai virus from left-atrial fibroblasts of an adult male, which the source calls hciPSC.
    lookup: "cellosaurus 'hciPSC' and 'cardiac fibroblast': no matching line (only IM-HCF, an immortalised fibroblast line, and TVGHi008-A, a patient line)"
    scope: The Zhang lab's cardiac-fibroblast-derived GFP line called hciPSC; not any other unnamed or in-house line.
    synonyms:
    - {text: hciPSC, anchor: were differentiated from hciPSCs}
- add_term:
    field: hipsc_medium
    id: hipsc_medium:growth_medium_not_named
    label: hiPSC growth medium, formulation not named
    parent: null
    definition: A medium for undifferentiated hiPSCs that the source names only as growth medium, without its formulation.
    scope: An unnamed hiPSC maintenance medium; not a named medium such as mTeSR1, FTDA, Essential 8, StemFlex or MEF-conditioned medium.
    synonyms:
    - {text: hiPSC growth medium, anchor: maintained with hiPSC growth medium in Matrigel-coated plate}
- add_synonym: {id: hipsc_coating:matrigel, text: Matrigel-coated plate, anchor: maintained with hiPSC growth medium in Matrigel-coated plate}
- add_synonym: {id: preparation:dissociated_cells, text: resuspended as single cells, anchor: 'For flow cytometry analyses, cells were trypsinized, resuspended as single cells'}
- add_synonym: {id: dissociation_reagent:trypsin, text: trypsinized, anchor: 'For flow cytometry analyses, cells were trypsinized, resuspended as single cells'}
- add_term:
    field: purification
    id: purification:immunomagnetic_selection
    label: immunomagnetic selection
    parent: null
    definition: Enrichment of cells carrying a surface marker (qualifier marker) by binding them to antibody-coated magnetic particles.
    scope: Selection by a surface marker on magnetic particles; not fluorescence-activated cell sorting, not selection by energy substrate (metabolic selection), not a genetically encoded marker (genetic selection) and not density gradient separation.
    qualifiers: {marker: {dimension: text}}
    synonyms:
    - {text: magnetic nanoparticle selection, anchor: were collected via magnetic nanoparticle selection for CD34 expression}
- add_term:
    field: purification
    id: purification:facs
    label: fluorescence-activated cell sorting
    parent: null
    definition: Enrichment of cells by sorting them one by one on fluorescent antibody labels in a flow cytometer.
    scope: Cell-by-cell sorting on fluorescent labels; not bulk selection on magnetic particles (immunomagnetic selection), not selection by energy substrate (metabolic selection), not a genetically encoded marker (genetic selection) and not density gradient separation.
    qualifiers: {marker: {dimension: text}}
- adopt:
    field: cell_types
    id: CL:0000192
    label: smooth muscle cell
    lookup: "cl 'smooth muscle cell': exact label; the paper's hiPSC-SMCs are differentiated from CD34+ vascular progenitors"
    synonyms:
    - {text: hiPSC-SMCs, anchor: hiPSC-SMCs were incubated with mouse anti-α-smooth muscle actin}
    - {text: smooth muscle cells, anchor: hiPSCs were differentiated into endothelial cells (ECs) and smooth muscle cells (SMCs)}
- add_synonym: {id: CL:0000115, field: cell_types, text: hiPSC-ECs, anchor: 'then, the hiPSC-ECs were purified and enriched'}
- adopt:
    field: endothelial_cell
    id: CL:0000115
    label: endothelial cell
    lookup: "cl 'endothelial cell': exact label, already adopted for cell_types; the paper's hiPSC-ECs are CD31+ VE-cadherin+ cells sorted after differentiation"
    synonyms:
    - {text: hiPSC-ECs, anchor: 'then, the hiPSC-ECs were purified and enriched'}
- add_synonym: {id: substrate:fibronectin, text: fibronectin-coated plates, anchor: culturing the hiPSC-VPCs on fibronectin-coated plates with EGM 2-MV medium}
- add_synonym: {id: replating_coating:fibronectin, text: fibronectin-coated plates, anchor: culturing the hiPSC-VPCs on fibronectin-coated plates with EGM 2-MV medium}
- add_term:
    field: platform
    id: platform:cast_patch
    label: cast tissue patch, anchoring not stated
    parent: platform:engineered_3d
    definition: A flat engineered tissue sheet cast from cells in a hydrogel in a mould and cultured in a dish, with no frame, poles or anchors stated.
    scope: A flat sheet whose holding is not stated; not a sheet anchored at its edges by a frame (frame-anchored patch), not a sheet on flexible poles, not a ring, and not a linear tissue between pillars, anchors or wires or around a strip.
- add_term:
    field: platform
    id: platform:boyden_chamber
    label: Boyden chamber
    parent: platform:culture_2d
    definition: A two-compartment well in which cells are seeded on a porous membrane and counted after migrating through it toward the lower compartment.
    scope: Cells on a porous membrane insert for a migration assay; not a flat monolayer on the well bottom, not micropatterned islands and not a micropost array.
    synonyms:
    - {text: Boyden chamber, anchor: Migration was evaluated via the Boyden-chamber assay}
- add_synonym: {id: maturation_strategy:dynamic_culture, text: dynamic rocking platform, anchor: culturing the construct on a dynamic (rocking) platform}
- add_synonym: {id: maturation_strategy:static_culture, text: static culture condition, anchor: 'on a fixed platform (i.e., the static culture condition)'}
- add_synonym: {id: preparation:lysate, text: protein extracts, anchor: Protein extracts were run on 10% SDS-PAGE gels}
- add_synonym: {id: preparation:live_cells, text: cultured cells, anchor: the number of exosomes taken up by the cultured cells increased substantially}
- add_qualifier: {id: preparation:fixed, name: fixative, dimension: text}
- add_term:
    field: measurement_medium
    id: measurement_medium:hbss
    label: Hank's balanced salt solution
    parent: null
    definition: Hank's balanced salt solution used as the bath or perfusate during the measurement.
    scope: A bath named Hank's balanced salt solution; not Tyrode's or Krebs solution, not a named extracellular solution, not an assay or imaging medium, not a serum-free medium and not the cells' culture medium.
- add_term:
    field: measurement_medium
    id: measurement_medium:serum_free_dmem
    label: serum-free DMEM
    parent: null
    definition: DMEM without serum used as the medium during the measurement or exposure.
    scope: Serum-free medium whose base is stated as DMEM; not a serum-free medium of unstated base, not a named assay or imaging medium, not a physiological salt solution (Tyrode's, Krebs, Hank's, extracellular solution) and not the cells' culture medium.
    synonyms:
    - {text: serum-free DMEM medium, anchor: cultured under hypoxic conditions for 48 h in serum-free DMEM medium}
- add_term:
    field: species
    id: species:rabbit
    label: rabbit
    parent: null
    definition: Oryctolagus cuniculus.
    scope: Rabbit cells, tissue or hearts; not human, rat or pig.
    xref: [NCBITaxon:9986]
- add_term:
    field: species
    id: species:pig
    label: pig
    parent: null
    definition: Sus scrofa (domestic pig).
    scope: Pig (swine) cells, tissue or hearts; not human, rat or rabbit.
    xref: [NCBITaxon:9823]
    synonyms:
    - {text: swine, anchor: Experiments were performed with female Yorkshire swine}
- set_scope: {id: species:human, scope: 'Human cells or tissue; not rat, rabbit, pig or other animals.'}
- set_scope: {id: species:rat, scope: 'Rat cells, tissue or hearts; not human, rabbit or pig.'}
- adopt_own:
    field: supplements
    id: supplements:egm_2mv
    label: EGM-2MV endothelial growth medium kit
    definition: Lonza's EGM-2MV microvascular endothelial growth medium, a basal medium sold with its serum and growth-factor supplements.
    lookup: "chebi 'EGM-2MV' and 'endothelial growth medium': not in ChEBI (a commercial medium kit, not a chemical entity)"
    scope: The whole EGM-2MV kit named as one addition; not a single serum (fetal bovine serum, horse serum), not B27 or another defined supplement, and not a single growth factor such as VEGF.
- adopt_own:
    field: treatment
    id: treatment:pbs
    label: phosphate-buffered saline
    definition: Phosphate-buffered saline given as the vehicle control for an added material.
    lookup: "chebi 'phosphate-buffered saline', 'phosphate buffered saline', 'PBS', 'saline': no ChEBI entity for the buffer"
    scope: The buffer given as a vehicle; not DMSO and not any active compound.
    synonyms:
    - {text: PBS, anchor: treated with PBS or with exosomes collected from monolayer cultures of ECs}
- adopt_own:
    field: treatment
    id: treatment:exosomes
    label: exosomes
    definition: Extracellular vesicles collected from conditioned medium and added to cultured cells, with the cells or construct that secreted them as the qualifier source.
    lookup: "chebi 'exosome': no ChEBI entity (a vesicle fraction, not a chemical entity)"
    scope: Secreted vesicles added as an exposure; the secreting cells are the qualifier source; not a single protein, a drug or a vehicle.
    qualifiers: {source: {dimension: text}}
- adopt:
    field: treatment
    id: CHEBI:231549
    label: GW4869
    lookup: "chebi 'GW4869': exact label; used as an inhibitor of exosome release"
- adopt:
    field: treatment
    id: CHEBI:758841
    label: annexin a5
    lookup: "chebi 'annexin': annexin a5 is the ChEBI entry for the protein the paper calls annexin V (exosome-internalisation inhibitor)"
    synonyms:
    - {text: annexin V, 'anchor': 'an exosome-internalization inhibitor (annexin V, 2 μg/mL)'}
- add_qualifier: {id: treatment:ect_implantation, name: number_of_constructs, dimension: dimensionless}
- adopt_own:
    field: treatment
    id: treatment:cell_free_patch_implantation
    label: cell-free patch implantation
    definition: Surgical placement on the heart of a patch of the same matrix as an engineered tissue but without cells, as a control for implanting the tissue.
    lookup: "chebi 'fibrin patch': no ChEBI entity (a surgical procedure)"
    scope: Implanting a matrix without cells; not implanting an engineered cardiac tissue with cells (engineered cardiac tissue implantation).
    qualifiers: {number_of_constructs: {dimension: dimensionless}}
# ---------------------------------------------------------------- measures: synonyms and qualifiers on existing terms
- add_synonym: {id: measure:twitch_force, text: twitch force generation, anchor: 'conductive velocity, calcium transients, micro-impedence, and twitch force generation'}
- add_synonym: {id: measure:passive_force, text: passive force, anchor: (H) active and passive force generation was}
- add_synonym: {id: measure:ejection_fraction, text: left ventricular ejection fraction, anchor: (C) left ventricular ejection fractions (LVEF)}
- add_qualifier: {id: measure:cell_cross_sectional_area, name: region, dimension: text}
- add_qualifier: {id: measure:protein_level, name: region, dimension: text}
# ---------------------------------------------------------------- measures: new terms
- add_term:
    field: measure
    id: measure:shortest_captured_cycle_length
    label: shortest captured pacing cycle length
    parent: measure:maximum_capture_rate
    dimension: time
    definition: The shortest pacing cycle length at which a tissue still follows each stimulus one-to-one, the reciprocal of the maximum capture rate.
    scope: The capture limit as a cycle length (time); the parent states it as a frequency.
- add_term:
    field: measure
    id: measure:tissue_resistivity
    label: tissue resistivity
    parent: null
    dimension: resistivity
    definition: The real part of a tissue's microscopic composite impedance at a stated stimulation frequency (qualifier frequency).
    scope: The resistive (real) component of tissue impedance; not the reactive (imaginary) component (tissue reactivity) and not conduction velocity.
    qualifiers: {frequency: {dimension: frequency}}
- add_term:
    field: measure
    id: measure:tissue_reactivity
    label: tissue reactivity
    parent: null
    dimension: resistivity
    definition: The imaginary part of a tissue's microscopic composite impedance at a stated stimulation frequency (qualifier frequency).
    scope: The reactive (imaginary) component of tissue impedance; not the resistive component (tissue resistivity) and not cell capacitance.
    qualifiers: {frequency: {dimension: frequency}}
- add_term:
    field: measure
    id: measure:tube_formation
    label: tube formation
    parent: null
    dimension: dimensionless
    definition: Number of tube-like structures that endothelial cells form per microscope field on a gel in an in vitro angiogenesis assay.
    scope: Tubes formed by endothelial cells in vitro; not vessels counted in tissue sections (vessel count density) and not cells migrating through a membrane (transwell migration).
    synonyms:
    - {text: EC tube formation, anchor: EC tube formation}
- add_term:
    field: measure
    id: measure:transwell_migration
    label: transwell migration
    parent: null
    dimension: dimensionless
    definition: Number of cells per microscope field that migrate through a porous membrane in a Boyden or transwell chamber.
    scope: Cells crossing a porous membrane; not tubes formed on a gel (tube formation) and not motion of structures within cells (structure motion).
- add_term:
    field: measure
    id: measure:exosome_diameter
    label: exosome diameter
    parent: null
    dimension: length
    definition: Diameter of extracellular vesicles (exosomes) collected from conditioned medium, by particle tracking or electron microscopy.
    scope: Size of secreted vesicles; not the diameter of tissues, tubular structures or embryoid bodies.
- add_term:
    field: measure
    id: measure:engraftment_rate
    label: engraftment rate
    parent: measure:engraftment
    dimension: dimensionless
    definition: Number of donor cells found in the host heart divided by the number of cells implanted.
    scope: A cell-count ratio of engrafted to delivered cells; not an area ratio of graft to infarct (engrafted area per infarct area) and not the fraction of animals with a graft (engraftment incidence).
- add_term:
    field: measure
    id: measure:vessel_count_density
    label: vessel count density
    parent: null
    dimension: number_per_area
    definition: Number of vessel structures positive for a stated marker (qualifier marker) per area or per microscope field of a stated region (qualifier region) in tissue sections.
    scope: A count of vessels per area or field; not the vessel area per implant area (blood vessel density) and not the share of vessels positive for a marker (marker-positive vessel fraction).
    qualifiers: {marker: {dimension: text}, region: {dimension: text}}
- add_term:
    field: measure
    id: measure:marker_positive_vessel_fraction
    label: marker-positive vessel fraction
    parent: null
    dimension: dimensionless
    definition: Fraction of vessels in a tissue section positive for a stated marker or markers (qualifier marker), such as a human-specific or reporter marker.
    scope: A share of vessels; not a share of cells (marker-positive cells) and not a vessel count per area (vessel count density).
    qualifiers: {marker: {dimension: text}}
- add_term:
    field: measure
    id: measure:lv_end_diastolic_volume
    label: left ventricular end-diastolic volume
    parent: null
    dimension: volume
    definition: Volume of the left ventricular cavity at end diastole in vivo, from imaging.
    scope: A cavity volume; not a cavity area in one imaging plane (left ventricular end diastolic area), not an ejected volume (stroke volume) and not a fraction (ejection fraction).
- add_term:
    field: measure
    id: measure:infarct_size
    label: infarct size
    parent: null
    dimension: dimensionless
    definition: Size of a myocardial scar as a fraction of the left ventricle, such as scar surface area over total LV surface area from delayed-enhancement MRI.
    scope: Scar extent relative to the ventricle; not engrafted area per infarct area and not a tissue area fraction of a section taken by cells.
- add_term:
    field: measure
    id: measure:wall_thickening_fraction
    label: systolic wall thickening fraction
    parent: null
    dimension: dimensionless
    definition: Fractional increase in ventricular wall thickness from diastole to systole in a stated region (qualifier region), from imaging in vivo.
    scope: Thickening of a heart wall segment in vivo; not fractional shortening of an engineered tissue (contractile shortening) and not ejection fraction.
    qualifiers: {region: {dimension: text}}
- add_term:
    field: measure
    id: measure:lv_systolic_pressure
    label: left ventricular systolic pressure
    parent: null
    dimension: pressure
    definition: Peak pressure in the left ventricle during systole, measured with a catheter in vivo.
    scope: A chamber pressure in vivo; not wall stress (LV wall stress) and not the stress of an engineered tissue (twitch stress).
- add_term:
    field: measure
    id: measure:lv_wall_stress
    label: left ventricular wall stress
    parent: null
    dimension: stress
    definition: Stress in the left ventricular wall of a stated region (qualifier region) at a stated phase of the cycle (qualifier phase), computed from chamber pressure, radius and wall thickness.
    scope: Wall stress of a heart in vivo; not chamber pressure (left ventricular systolic pressure) and not the active or resting stress of an engineered tissue (twitch stress, diastolic stress).
    qualifiers: {region: {dimension: text}, phase: {dimension: text}}
- add_term:
    field: measure
    id: measure:lv_weight_body_weight_ratio
    label: left ventricular weight to body weight ratio
    parent: null
    dimension: dimensionless
    definition: Weight of the left ventricle at sacrifice divided by body weight.
    scope: A post-mortem organ-to-body weight ratio; not a clinical mass index from imaging (left ventricular mass index).
- add_term:
    field: measure
    id: measure:marker_positive_cells_per_field
    label: marker-positive cells per field
    parent: measure:cells_per_field
    dimension: dimensionless
    definition: Number of cells positive for a stated marker (qualifier marker) per microscope field in a stated region (qualifier region).
    scope: A per-field count of marker-positive cells; the parent counts all cells per field.
    qualifiers: {marker: {dimension: text}, region: {dimension: text}}
- add_term:
    field: measure
    id: measure:protein_phosphorylation_level
    label: total protein phosphorylation (Ptotal)
    parent: measure:phosphorylated_protein_fraction
    dimension: dimensionless
    definition: Phosphate per molecule of a stated protein (qualifier protein), summed over its phosphorylated species weighted by their relative abundance in top-down mass spectrometry.
    scope: Phosphates per molecule summed over species (can exceed one); the parent is the ratio of phosphorylated to total protein.
