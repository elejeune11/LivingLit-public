      Torin1 (200 nM):
        item: F3D_mtDNA
        group: t200
        unit_of_value: ratio normalized to control (axis prints no unit)
    note: Raster bars with individual points (n=3 per group). Read from the author manuscript copy (300 dpi image; the journal
      page p. 8 holds the same figure at ~200 dpi). Markers touch the error-bar stems and caps; thin lines are removed by
      a morphological opening, leaving one blob per marker.
