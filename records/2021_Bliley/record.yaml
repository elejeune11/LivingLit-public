    groups:
    - s8
    anchor:
      quote: the z component of bending was orders of magnitude lower than the x component
      where: Supplementary methods
      file: abd1817_sm.pdf
  S22B:
    unit: S22
    measure: elastic modulus of PDMS strip
    method: tensile testing of laser-cut dog bones on an Instron 5943 at 1 mm/min; slope of stress-strain curve over 0 to 10% strain
    finding: The 8x strip material has a higher elastic modulus than the 1x strip material.
    compares:
    - s8
    - s1
    values:
      s1:
        printed: '1.59'
        unit: MPa
        kind: mean
        group: s1
        spread: SD
        spread_source: legend
      s8:
        printed: '1.89'
        unit: MPa
        kind: mean
        group: s8
        spread: SD
        spread_source: legend
        suspected_error:
          what: 1.89 MPa for the ~260 µm strip
          why: the five values in Data file S1 (sheet Fig S22) average about 1.86 MPa
    stats:
      test: Mann-Whitney U test on ranks
      p: '* P=0.0043'
    anchor:
      quote: Mann-Whitney U test on ranks
      where: fig. S22 legend (B)
      file: abd1817_sm.pdf
    note: mean values are printed in Materials and Methods (Young's modulus used in the FEM)
