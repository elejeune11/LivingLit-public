  ST4_amp_025.dff_ctrl_025:
    item: ST4_amp_025
    group: ctrl_025
    formula: dff = (F - F0)/F0
    anchor: &id005
      quote: quantified by the intensity change ΔF/ F0 = (F-F0)/F0
      where: Methods 2.7
    library:
      formula: relative_change
      vars:
        d: dff
        x: F
        x0: F0
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: peak signal averaged over the selected region
      F0:
        not_stated: true
        kind: per sample
        note: signal averaged over a 2 s interval before stimulation
    output: ST4_amp_025.values.ctrl_025_table
    aggregation: not stated
  ST4_amp_025.dff_tdi_025:
