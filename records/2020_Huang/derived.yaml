  F4F_APD30_1.ratio:
    item: F4F_APD30_1
    formula: r = a/b
    anchor: &id003
      quote: The mean values for APD30 and APD80 at 1 Hz were about 1.7 times longer for TDI-CMs and 1.4 times longer for TDI-CMTs
      where: Results 3.3
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: not stated
        note: mean APD of TDI at 1 Hz (Fig. 4 panel; no points or printed means)
      b:
        not_stated: true
        kind: not stated
        note: mean APD of control at 1 Hz
    output: F4F_APD30_1.values.ratio_text
    aggregation: of means
    note: '''times longer'' read as a ratio of the mean values, as the sentence says (''The mean values ... were about 1.7 times longer'')'
