  F4C_circ_al_ra.circularity_al:
    item: F4C_circ_al_ra
    group: al
    measure: circularity
    formula: c = 4*pi*A/P**2
    anchor: &id003
      quote: 'circularity: 0 = line, 1 = circle'
      where: Fig. 4 legend
    library:
      formula: circularity_def
      vars:
        c: c
        A: A
        P: P
    inputs:
      A:
        item: F4C_area_al_ra
        kind: per sample
        note: cell area of the same cells (Fig. 4C left)
      P:
        not_stated: true
        kind: per sample
        note: cell perimeter not printed
    output: F4C_circ_al_ra.values.circ_al_text
    aggregation: not stated
    alternatives:
    - label: ISO 9276-6 circularity (square root of the form factor)
      formula: c = sqrt(4*pi*A/P**2)
      note: the paper names ImageJ for cell shape; ImageJ circularity is the form factor 4πA/P²
  F4C_circ_al_ra.circularity_ra:
    item: F4C_circ_al_ra
    group: ra
    measure: circularity
    formula: c = 4*pi*A/P**2
    anchor: *id003
    library:
