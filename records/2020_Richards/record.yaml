  value: hiPSC-CMs + FBs + HUVECs + hADSCs
  anchor:
    quote: Organoid cell suspensions comprised 50% hiPSC-CMs and 50% non-myocyte (at a 4:2:1 ratio of FBs:HUVECs:hADSCs) in
      medium for a final concentration of ~2.0 × 106 cells per ml
    where: Methods, Fabrication of organoids and spheroids
- field: cell_types
  value: hiPSC-CM
  anchor:
    quote: Monocellular spheroids (hiPSC-CM only, cardiac FB only) were fabricated using a concentration of ~2.0 × 106 cells
      per ml
    where: Methods, Fabrication of organoids and spheroids
- field: cell_types
  value: cardiac FB
  anchor:
    quote: Monocellular spheroids (hiPSC-CM only, cardiac FB only) were fabricated using a concentration of ~2.0 × 106 cells
      per ml
    where: Methods, Fabrication of organoids and spheroids
- field: stromal_cell
  value: human cardiac ventricular FBs
  anchor:
    quote: Human cardiac ventricular FBs (CC-2904, 0000401462, Lonza), which were cultured in FGM-2 medium (Lonza)
    where: Methods, Cell culture
- field: endothelial_cell
  value: human umbilical vein endothelial cells
  anchor:
    quote: Human umbilical vein endothelial cells (HUVECs; C2519A, 0000471466, Lonza) were cultured in EGM-3 medium
    where: Methods, Cell culture
- field: composition
  value: 50% hiPSC-CMs and 50% non-myocyte at a 4:2:1 ratio of FBs:HUVECs:hADSCs
  anchor:
    quote: Organoid cell suspensions comprised 50% hiPSC-CMs and 50% non-myocyte (at a 4:2:1 ratio of FBs:HUVECs:hADSCs) in
      medium for a final concentration of ~2.0 × 106 cells per ml
    where: Methods, Fabrication of organoids and spheroids
- field: seeding_density
  value: ~2.0 × 106 cells per ml
  anchor:
    quote: Organoid cell suspensions comprised 50% hiPSC-CMs and 50% non-myocyte (at a 4:2:1 ratio of FBs:HUVECs:hADSCs) in
      medium for a final concentration of ~2.0 × 106 cells per ml
    where: Methods, Fabrication of organoids and spheroids
- field: seeding_density
  value: 20 × 103 cells per well
  anchor:
    quote: cells were plated in 96-well plates (20 × 103 cells per well) and cultured for 2 d
    where: Methods, Cell culture
- field: cm_medium
  value: organoid medium
  anchor:
    quote: In organoid medium, the CM-specific component was defined as glucose-containing F12/DMEM medium with 10% FBS, 1%
