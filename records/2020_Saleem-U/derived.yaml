bounds: []
proposals:
- formula: hooke_spring
  kind: model
  statement: The force of a linear elastic spring (or a flexible post loaded at a point) is its stiffness times its deflection.
  equations:
  - F = k*x
  variables:
    F: force
    k: stiffness
    x: length
  assumes:
  - linear spring
  - small deflection
  does_not_apply: large deflections or a nonlinear (e.g. viscoelastic or strain-stiffening) post, where force is not proportional to deflection
  tests:
  - given:
      k: 2.0
      x: 3.0
    expect:
      F: 6.0
  - given:
      k: 2.0
      x: 3.0
    does_not_apply: 'post deflected beyond its linear range: measured F differs from k*x'
  cites:
    text: Halliday, Resnick and Walker, Fundamentals of Physics, 10th ed., Wiley 2014, ch. 7 (spring force, Hooke's law)
    quote: Fx = -kx (Hooke's law)
- formula: relative_decrease
  kind: derived
  statement: The relative decrease of a value from a reference, (x0 - x)/x0, is the ratio of the drop to the reference.
  equations:
  - s = (x0 - x)/x0
  variables:
    s: dimensionless
    x: D
    x0: D
    dx: D
  assumes:
  - dx = x0 - x
  uses:
  - formula: ratio_def
    subs:
      r: s
      a: dx
      b: x0
  does_not_apply: a signed relative change (x - x0)/x0, or a drop relative to a value other than the reference
  tests:
  - given:
      x: 1.5
      x0: 2.0
    expect:
      s: 0.25
  - given:
      x: 1.5
      x0: 2.0
    does_not_apply: signed relative change gives -0.25
