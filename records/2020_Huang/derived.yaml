  F4K_CV_1.cv:
    item: F4K_CV_1
    formula: nu = dx/(t2 - t1)
    anchor:
      quote: the CV was determined as ν = Δx/Δt
      where: Methods 2.8
    library:
      formula: conduction_velocity_def
      vars:
        v: nu
        d: dx
        t1: t1
        t2: t2
    inputs:
      dx:
        not_stated: true
        kind: per sample
        note: spatial distance between the measurement points at the two ends of a CMT; not printed
      t1:
        not_stated: true
        kind: per sample
        note: AP onset at the first end
      t2:
        not_stated: true
        kind: per sample
        note: AP onset at the second end; Δt = t2 − t1
    note: Δt is printed as the time difference between AP onsets; written as t2 − t1. No CV value is printed (Fig. 4K only)
  F4H_CV_05.cv:
    item: F4H_CV_05
    formula: not stated
    anchor:
      quote: the distribution of local conduction velocities was fit with a Gaussian function to determine the average conduction velocity (CV)
      where: Methods 2.8
    no_formula: monolayer CV is the centre of a Gaussian fitted to local velocities from custom MATLAB scripts cited as [42,43]; the local-velocity
      formula is not stated and a curve-fit centre is no closed formula
