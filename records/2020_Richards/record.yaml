claims:
  C1:
    kind: stated
    quote: cardiac organoids that incorporate an oxygen-diffusion gradient and that are stimulated with the neurotransmitter
      noradrenaline model the structure of the human heart after myocardial infarction
    where: Abstract
    scope: human cardiac organoids after a 10 d infarction protocol
    direction: not stated
    strength: model the structure of the human heart after myocardial infarction
    rests_on:
    - F1f_hypoxia
    - F1h_nadh
    - F4f_vimentin
    - F5f_int_vs_edge
    judgement:
      direction: cannot judge
      support: follows
      comparison: follows
      scope: overstated
      replication: overstated
      strength: overstated
      presence: follows
    note: the mimicry of infarct, border and remote zones rests on one donor and on images without a zone-by-zone measurement
  C2:
    kind: stated
    quote: recapitulate hallmarks of myocardial infarction (in particular, pathological metabolic shifts, fibrosis and calcium
      handling) at the transcriptomic, structural and functional levels
    where: Abstract
    scope: infarct organoids versus control organoids, donor A
    direction: not stated
    strength: recapitulate hallmarks of myocardial infarction
    rests_on:
    - F3d_peak_ocr
    - F3f_peak_ecar
    - F3g_lactate
    - F4f_vimentin
    - F4i_modulus
    - F5f_int_vs_edge
    - F5g_contraction
    - F2b_org_mouse
    - F2b_org_human
