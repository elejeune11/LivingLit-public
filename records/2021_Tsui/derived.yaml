  F3fj_MYH7_d14.relative_expression:
    item: F3fj_MYH7_d14
    measure: MYH7 relative expression
    formula: r = 2^(-ddct)
    anchor: &id001
      quote: Relative gene expression was calculated using the comparative Ct method, where GAPDH was designated as the housekeeping gene
      where: Methods 2.13
    library:
      formula: ddct_relative_expression
      vars:
        r: r
        ddct: ddct
    inputs:
      ddct:
        not_stated: true
        kind: per sample
        note: ΔΔCt of MYH7 (GAPDH reference, age-matched TCPS calibrator); Ct values are not printed
    aggregation: not stated
    note: 'Calibrator: age-matched TCPS controls with the same HS27A ratio; each sample run in triplicate. Whether ΔΔCt is taken per sample against
      the calibrator mean (mean of per-sample 2^-ΔΔCt) or from group-mean Ct is not stated.'
