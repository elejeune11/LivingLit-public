evidence:

  F1_beat_onset:
    unit: F1
    measure: "day of onset of spontaneous beating"
    finding: "C-OP ECTs began to beat spontaneously after 3 days of culture, as control ECTs did"
    compares: [cop, ctrl]
    stats: {p: "not stated"}
    values:
      onset_cop: {printed: "3 days", unit: "days", kind: "value", group: cop}
    stated_direction:
      direction: none
      anchor:
        quote: "D14C-OP ECTs began to spontaneously beat after 3 days of culture, similar to control ECTs"
        where: "Results, ChIEF transfection"
    anchor:
      quote: "D14C-OP ECTs began to spontaneously beat after 3 days of culture, similar to control ECTs"
      where: "Results, ChIEF transfection"

  F2_active_a:
    unit: F2
    measure: "active force"
    method: "force recorded at each electric field pacing rate with an isolated muscle testing system"
    finding: "active force decreased when the pacing rate was stepped from 3 to 3.5 Hz"
    compares: [p3_5, p3]
    stats: {p: "not stated"}
    stated_direction:
      direction: down
      anchor:
        quote: "Active force decreased and passive force increased during each stepwise increase in pacing rate: (a) 3 to 3.5 to 3 Hz."
        where: "Figure 2 legend"
    anchor:
      quote: "Active force decreased and passive force increased during each stepwise increase in pacing rate: (a) 3 to 3.5 to 3 Hz."
      where: "Figure 2 legend"

  F2_active_b:
    unit: F2
    measure: "active force"
    method: "force recorded at each electric field pacing rate with an isolated muscle testing system"
    finding: "active force decreased when the pacing rate was stepped from 4 to 4.5 Hz"
    compares: [p4_5, p4]
    stats: {p: "not stated"}
    stated_direction:
      direction: down
      anchor:
        quote: "Active force decreased and passive force increased during each stepwise increase in pacing rate: (a) 3 to 3.5 to 3 Hz. (b) 4 to 4.5 to 4 Hz."
        where: "Figure 2 legend"
    anchor:
      quote: "(b) 4 to 4.5 to 4 Hz."
      where: "Figure 2 legend"

  F2_active_c:
    unit: F2
    measure: "active force"
    method: "force recorded at each electric field pacing rate with an isolated muscle testing system"
    finding: "active force decreased when the pacing rate was stepped from 5 to 5.5 Hz"
    compares: [p5_5, p5]
    stats: {p: "not stated"}
    stated_direction:
      direction: down
      anchor:
        quote: "Active force decreased and passive force increased during each stepwise increase in pacing rate"
        where: "Figure 2 legend"
    anchor:
      quote: "(c) 5 to 5.5 to 5 Hz."
      where: "Figure 2 legend"

  F2_passive_a:
    unit: F2
    measure: "passive force"
    method: "force recorded at each electric field pacing rate with an isolated muscle testing system"
    finding: "passive force increased when the pacing rate was stepped from 3 to 3.5 Hz"
    compares: [p3_5, p3]
    stats: {p: "not stated"}
    stated_direction:
      direction: up
      anchor:
        quote: "Active force decreased and passive force increased during each stepwise increase in pacing rate: (a) 3 to 3.5 to 3 Hz."
        where: "Figure 2 legend"
    anchor:
      quote: "Increasing pacing rate was associated with reduced active force and increased passive force."
      where: "Materials and methods, Force testing"

  F2_passive_b:
    unit: F2
    measure: "passive force"
    method: "force recorded at each electric field pacing rate with an isolated muscle testing system"
    finding: "passive force increased when the pacing rate was stepped from 4 to 4.5 Hz"
    compares: [p4_5, p4]
    stats: {p: "not stated"}
    stated_direction:
      direction: up
      anchor:
        quote: "Active force decreased and passive force increased during each stepwise increase in pacing rate"
        where: "Figure 2 legend"
    anchor:
      quote: "(b) 4 to 4.5 to 4 Hz."
      where: "Figure 2 legend"

  F2_passive_c:
    unit: F2
    measure: "passive force"
    method: "force recorded at each electric field pacing rate with an isolated muscle testing system"
    finding: "passive force increased when the pacing rate was stepped from 5 to 5.5 Hz"
    compares: [p5_5, p5]
    stats: {p: "not stated"}
    stated_direction:
      direction: up
      anchor:
        quote: "Active force decreased and passive force increased during each stepwise increase in pacing rate"
        where: "Figure 2 legend"
    anchor:
      quote: "(c) 5 to 5.5 to 5 Hz."
      where: "Figure 2 legend"

  F2_hysteresis:
    unit: F2
    measure: "beat-to-beat hysteresis"
    method: "amplitude variation between sequential beats in the force tracing"
    finding: "amplitude variation between sequential beats increased incrementally at higher pacing rates"
    compares: [p5_5, p3]
    stats: {p: "not stated"}
    stated_direction:
      direction: up
      anchor:
        quote: "at higher pacing rates there is an incremental increase in the amplitude variation between sequential beats, termed beat-to-beat hysteresis"
        where: "Figure 2 legend"
    anchor:
      quote: "at higher pacing rates there is an incremental increase in the amplitude variation between sequential beats, termed beat-to-beat hysteresis"
      where: "Figure 2 legend"

  F3_sigma_a:
    unit: F3
    measure: "mean active stress"
    method: "stress calculated as force divided by cross-sectional area; active stress is the difference between each maximum and its preceding minimum"
    software: "automated software developed in MATLAB"
    definition: "Active stress, σA, is the difference between σmax and σmin."
    finding: "mean active stress of the representative C-OP ECT at 4.5 Hz was 0.29 mN/mm2"
    groups: [rep]
    values:
      sigma_a: {printed: "0.29", unit: "mN/mm2", kind: "mean", group: rep, x: "4.5 Hz", spread: "none"}
    anchor:
      quote: "Mean σA was 0.29 mN/mm2, σbb was 0.17, RT50 was 63 ms, and normalized systolic energy was 0.53."
      where: "Figure 3 legend"

  F3_sigma_bb:
    unit: F3
    measure: "beat-to-beat hysteresis"
    method: "magnitude of the difference between the active stress of an even-numbered cycle and the preceding odd-numbered cycle, divided by the mean active stress"
    software: "automated software developed in MATLAB"
    definition: "Beat-to-beat hysteresis, σbb, is the magnitude of the difference between the σA of an even-numbered cycle and the σA of the preceding odd-numbered cycle"
    finding: "beat-to-beat hysteresis of the representative C-OP ECT at 4.5 Hz was 0.17"
    groups: [rep]
    values:
      sigma_bb: {printed: "0.17", unit: "dimensionless", kind: "mean", group: rep, x: "4.5 Hz", spread: "none"}
    anchor:
      quote: "Mean σA was 0.29 mN/mm2, σbb was 0.17, RT50 was 63 ms, and normalized systolic energy was 0.53."
      where: "Figure 3 legend"

  F3_rt50:
    unit: F3
    measure: "relaxation time to 50% diastolic stress"
    method: "time for stress to relax by 50% of active stress from maximum stress"
    software: "automated software developed in MATLAB"
    definition: "RT50 is the time for stress to relax by 50% of σA from σmax."
    finding: "RT50 of the representative C-OP ECT at 4.5 Hz was 63 ms"
    groups: [rep]
    values:
      rt50: {printed: "63", unit: "ms", kind: "value", group: rep, x: "4.5 Hz", spread: "none"}
    anchor:
      quote: "Mean σA was 0.29 mN/mm2, σbb was 0.17, RT50 was 63 ms, and normalized systolic energy was 0.53."
      where: "Figure 3 legend"

  F3_energy:
    unit: F3
    measure: "normalized systolic energy"
    method: "systolic stress-time integral for each cycle, normalized to time and to maximum stress"
    software: "automated software developed in MATLAB"
    definition: "We calculated the mean normalized systolic stress-time integral and defined this value as the mean systolic potential energy (SPE)."
    finding: "normalized systolic energy of the representative C-OP ECT at 4.5 Hz was 0.53"
    groups: [rep]
    values:
      energy: {printed: "0.53", unit: "dimensionless", kind: "mean", group: rep, x: "4.5 Hz", spread: "none", expressed_as: "normalised"}
    anchor:
      quote: "Mean σA was 0.29 mN/mm2, σbb was 0.17, RT50 was 63 ms, and normalized systolic energy was 0.53."
      where: "Figure 3 legend"

  F4ab_patch:
    unit: F4ab
    measure: "action potential generation on optical stimulation"
    method: "whole cell patch clamp of ChIEF-expressing cells within the ECT with pulsed blue light stimulation"
    software: "pClamp 10"
    context:
      preparation: {value: "patched single cells within the ECT"}
    finding: "acute optical pacing triggered CM depolarization and action potential generation in D14 C-OP ECTs"
    groups: [cop]
    stats: {p: "not stated"}
    anchor:
      quote: "We confirmed acute OP triggered CM depolarization and action potential generation within D14C-OP ECTs using pulsed blue light stimulation and patch clamp recording"
      where: "Results, Force–length and force–frequency testing"

  F4ab_capture:
    unit: F4ab
    measure: "optical pacing capture"
    method: "visual inspection and brief video recordings during acute optical pacing"
    finding: "acute optical pacing captured all beats when paced above the intrinsic beat rate until the maximum capture rate"
    groups: [cop]
    stats: {p: "not stated"}
    anchor:
      quote: "Acute OP captured all beats when paced above the intrinsic beat rate until reaching the MCR."
      where: "Results, Force–length and force–frequency testing"

  F4ab_optical_mcr:
    unit: F4ab
    measure: "optical maximum capture rate"
    method: "optical pacing with a 470 nm LED below the perfusion bath, rate increased in 0.5 Hz increments until the optical maximum capture rate"
    finding: "optical stimulation during force testing paced tissues to a maximum rate of 5 Hz"
    groups: [cop]
    n:
      printed: "For a subset of D14 C-OP ECTs (n = 6)"
      counts: "ECTs"
    values:
      optical_mcr: {printed: "5", unit: "Hz", kind: "value", group: cop, spread: "none"}
    anchor:
      quote: "Optical stimulation during force testing could pace tissues to a maximum rate of 5 Hz"
      where: "Discussion"

  F4ch_mcr_cop_ctrl:
    unit: F4ch
    measure: "maximum capture rate"
    method: "electric field pacing in 0.5 Hz increments; maximum capture rate determined at the onset of 2:1 block, with Fourier analysis of the force trace"
    software: "automated software developed in MATLAB"
    definition: "We determined electrical MCR at the onset of 2:1 block."
    finding: "D14 C-OP ECTs captured at a higher electric field paced rate than D14 control ECTs"
    compares: [cop, ctrl]
    n:
