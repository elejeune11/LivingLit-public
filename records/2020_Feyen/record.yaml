    method: western blot; α-MHC and β-MHC normalized to cTnT and then to the mean of the control EHTs per batch
    stated_direction:
      direction: up
      anchor:
        quote: higher b-MHC abundance was observed by western blotting in MM than control media (Figures S7G and S7H)
        where: Results, MM Improves EHT Culture
  S7H_amhc:
    unit: S7H
