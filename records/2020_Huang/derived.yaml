record: 2020_Huang
formula_library_version: 17
agent:
  model: llm
  instructions: formulas_v3
derived:
  F5B_static.force:
    item: F5B_static
    formula: F = k*delta
    anchor: &id001
      quote: The CMTs' contraction forces were calculated using F = kδ
      where: Methods 2.9
    library:
      formula: hooke_spring
      vars:
        F: F
        k: k
        x: delta
    inputs:
      k:
        printed: '0.25'
        unit: μN/μm
        anchor: &id002
          quote: δ is the average deflection of the two micropillars and k = 0.25 μN/μm.
          where: Methods 2.9
        kind: constant
      delta:
        not_stated: true
        kind: per sample
        note: the average deflection of the two micropillars, per CMT; no deflections are printed
    note: no force in μN is printed; the force feeds the stress step
  F5B_static.stress:
    item: F5B_static
    formula: sigma = F/A
    anchor: not stated
    library:
      formula: stress_def
      vars:
        sigma: sigma
        F: F
        A: A
    inputs:
      F:
        derived: F5B_static.force
        kind: per sample
      A:
        not_stated: true
        kind: not stated
        note: the paper prints stresses (mN/mm2) and static/dynamic stress panels but never states the area (cross-section) or how it was measured
    note: 'a stress named, not its formula: ''stress'' is printed beside force from F = kδ, so force over an unstated area'
