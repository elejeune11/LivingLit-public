  S4A_cpt1a_MM_v_GLUC.fold_change:
    item: S4A_cpt1a_MM_v_GLUC
    measure: CPT1A expression
    formula: r = (t*s0)/(s*t0)
    anchor: &id008
      quote: normalized to 18S rRNA and shown as fold change relative to GLUC
      where: Figure S4 legend
      file: mmc1.pdf
    library:
      formula: ratio_of_products
      vars:
        r: r
        a1: t
        b1: s
        a2: s0
        b2: t0
    inputs:
      t:
        not_stated: true
        kind: per sample
        note: target expression in the group
      s:
        not_stated: true
        kind: per sample
        note: 18S rRNA in the group
      t0:
        not_stated: true
        kind: not stated
        note: target expression in GLUC
      s0:
        not_stated: true
        kind: not stated
        note: 18S rRNA in GLUC
    alternatives:
    - label: 2^-ΔΔCt
      formula: r = 2**(-ddct)
      note: the quantification method (ΔΔCt or standard curve) is not stated
    aggregation: not stated
