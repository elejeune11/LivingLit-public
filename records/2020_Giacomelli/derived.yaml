  F1C_qpcr.rel_expr:
    item: F1C_qpcr
    formula: r = 2^(-dct)
    anchor: &id006
      quote: Results were analyzed by using the DCt method.
      where: STAR Methods
    library:
      formula: ddct_relative_expression
      vars:
        r: r
        ddct: dct
    inputs:
      dct:
        not_stated: true
        kind: per sample
        note: Ct of the target minus Ct of the reference (RPL37A); no calibrator sample is named, so the exponent is a DCt,
          not a DDCt
    note: 'the DCt method is the comparative Ct method without a calibrator: 2^-DCt'
  S6B_nos3.rel_expr:
