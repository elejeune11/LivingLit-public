  F6B_tnni_org.gene_ratio:
    item: F6B_tnni_org
    formula: r = ea/eb
    anchor:
      quote: Gene expression of cardiac troponin I (TNNNI3) over slow, skeletal troponin I (TNNNI1)
      where: Fig. 6B legend
      file: journal_version.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: ea
        b: eb
    inputs:
      ea:
        not_stated: true
        kind: per sample
        note: TNNI3 expression, 2^(-dCt)
      eb:
        not_stated: true
        kind: per sample
        note: TNNI1 expression, 2^(-dCt)
    alternatives:
    - label: ratio of the averaged expressions instead of the average of per-experiment ratios
    aggregation: not stated
    note: Each expression is 2^(-dCt) (Methods); the ratio equals 2^(-(dCt_a - dCt_b)). Not printed.
