        unit_of_value: no unit printed (axis "cTnT mean fluo. intensity")
    note: 'Fig. S2B right chart (raster, whole page is one image), bar mean +/- error bar with one filled circle per batch
      (n = 4). All 4 circles per group found; they are apart from each other, but in each group one sits on the upper cap
      and one on the vertical error line or lower cap (same colour as the circles), so the script opens the lines away (9
      px disc) and centres each circle on its off-line chords. Point means (29.8k RPMI/B27, 87.8k MM) agree with the bar tops
      (29.6k, 87.7k); bar-to-cap distances (6.2k, 8.3k) equal the SEM of the points (5.9k, 8.2k), matching the Methods (mean
      +/- SEM). Y axis has no unit. The left chart (% cTnT positive cells, item S2B_purity) is not read: its values are printed
      in the text.'
