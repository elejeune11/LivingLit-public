    parent: platform:culture_2d
    definition: An insert holding a porous mesh on which cell layers (such as an endothelial barrier) grow, separating two
      compartments.
    scope: Cell layers on a porous mesh between two compartments; not a flat layer on the well bottom (monolayer), not a migration
      assay (Boyden chamber), not micropatterned islands and not a micropost array.
    synonyms:
    - text: mesh insert
      anchor: Underneath each tissue chamber is an elastic mesh insert
  - event: set_scope
    id: platform:boyden_chamber
    scope: Cells on a porous membrane insert for a migration assay; not a flat monolayer on the well bottom, not micropatterned
      islands, not a micropost array, and not a mesh insert carrying a barrier layer between compartments (porous mesh insert).
  - event: add_term
    field: platform
    id: platform:multi_tissue_chip
    label: multi-tissue chip
    parent: platform:engineered_3d
    definition: A perfused device in which engineered tissues sit in separate chambers connected by a circulating medium.
    scope: Engineered tissues held in chambers of a device linked by circulating medium; the number of tissues is the qualifier
      configuration; not a single construct format (strip, ring, patch, tissue between pillars, anchors or wires) and not
      a one-tissue microfluidic microchamber (microfluidic cardiac MPS).
    qualifiers:
      configuration:
        dimension: text
  - event: add_term
    field: platform
    id: platform:barrier_separated_tissue_chip
    label: multi-tissue chip with endothelial barriers
    parent: platform:multi_tissue_chip
    definition: A multi-tissue chip in which each tissue chamber is separated from the circulating medium by an endothelial
      barrier.
    scope: Tissues linked through endothelial barriers, each in its own medium; not the same chip without barriers, where
      tissues share the medium (multi-tissue chip with shared medium).
    synonyms:
    - text: Multi-organ tissue chip
      anchor: The maintenance of matured tissues in the Multi-organ tissue chip was compared to that of the Mixed tissue chip
  - event: add_term
    field: platform
    id: platform:shared_medium_tissue_chip
    label: multi-tissue chip with shared medium
    parent: platform:multi_tissue_chip
    definition: A multi-tissue chip without endothelial barriers, in which all tissues share one common medium.
    scope: Tissues linked through a common medium with no barrier; not a chip whose chambers are separated by endothelial
      barriers (multi-tissue chip with endothelial barriers).
    synonyms:
    - text: Mixed tissue chip
      anchor: The maintenance of matured tissues in the Multi-organ tissue chip was compared to that of the Mixed tissue chip
  - event: set_scope
    id: platform:microfluidic_cardiac_mps
    scope: A microtissue formed by loading cells into a fluid-fed microchamber with posts; not a hydrogel tissue cast between
      two pillars in a well, a strip, a ring, a patch, a tissue between anchors or wires, and not several tissues in chambers
      linked by circulating medium (multi-tissue chip).
  - event: add_term
    field: platform
    id: platform:single_tissue_culture
    label: tissue cultured on its own
    parent: null
    definition: A tissue or cell population cultured individually, not connected to other tissues, named as the comparison
      for multi-tissue chips; its format is not stated.
    scope: Culture alone, as the comparison for tissues linked in a multi-tissue chip, with no format stated; not a named
      2D format, 3D engineered format, aggregate or native tissue, and not a cell-free blank.
  - event: add_term
    field: substrate
    id: substrate:nylon_mesh
    label: porous nylon mesh
    parent: null
    definition: A porous nylon mesh used as a substrate for cell layers; pore size and coating are qualifiers.
    scope: A porous synthetic mesh; not a hydrogel, glass, PDMS, polyacrylamide, a culture plate, a protein coating or a decellularized
      matrix.
    qualifiers:
      pore_size:
        dimension: length
      coating:
        dimension: text
    synonyms:
