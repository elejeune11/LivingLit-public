proposals:
  - formula: absolute_difference_over_reference
    kind: derived
    statement: The absolute difference of two like quantities divided by a reference of the same kind, |a - b|/m (e.g. the
      beat-to-beat difference in active stress over the mean active stress), is a ratio of the absolute difference to the reference.
    equations:
      - "r = Abs(a - b)/m"
    variables: {r: dimensionless, a: D, b: D, m: D, dn: D}
    assumes:
      - "dn = Abs(a - b)"
    uses:
      - {formula: ratio_def, subs: {r: r, a: dn, b: m}}
    does_not_apply: a signed difference (a - b)/m, a difference over the sum of the two (|a - b|/(a + b)), or a mean of per-pair ratios compared with the ratio of means
    tests:
      - {given: {a: 3.0, b: 1.0, m: 4.0}, expect: {r: 0.5}}
      - {given: {a: 1.0, b: 3.0, m: 4.0}, expect: {r: 0.5}}
      - {given: {a: 1.0, b: 3.0, m: 4.0}, does_not_apply: "the signed form gives -0.5"}

  - formula: normalized_time_integral
    kind: derived
    statement: A time integral of a quantity over an interval, normalised to the interval's duration and to a reference value
      of the quantity (e.g. a systolic stress-time integral over cycle time and peak stress), is the integral divided by the
      product of duration and reference; it is dimensionless.
    equations:
      - "e = Si/(T*m)"
    variables: {e: dimensionless, Si: D*time, T: time, m: D, q: D*time}
    assumes:
      - "q = T*m"
    uses:
      - {formula: ratio_def, subs: {r: e, a: Si, b: q}}
    does_not_apply: an integral normalised to time only (a time-averaged value, with the quantity's own dimension), or to the reference only
    tests:
      - {given: {Si: 6.0, T: 2.0, m: 3.0}, expect: {e: 1.0}}
      - {given: {Si: 3.0, T: 2.0, m: 3.0}, expect: {e: 0.5}}
      - {given: {Si: 6.0, T: 2.0, m: 3.0}, does_not_apply: "normalised to time only gives 3, not 1"}
