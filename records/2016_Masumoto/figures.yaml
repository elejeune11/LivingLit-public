      the time-course item; <measure>_<group> is the Tx4w reading again without x, linked to the 4-week comparison.
      Error: upper end of the Tx bars (they point up) in cardiac output, stroke volume and ejection fraction. Sham bars
      point down (lower end only), not a reading kind, so not read; LVAd caps cannot be assigned to a group, not read.
      Stroke volume and ejection fraction at PreTx are 1 by construction and are read as plotted.
