  F3b_force_d7.post_second_moment:
    item: F3b_force_d7
    measure: second moment of area of the flexible post
    formula: not stated
    anchor: not stated
    library:
      formula: circular_second_moment_diameter
      vars:
        I: I
        d: d
    inputs:
      d:
        printed: '1.5'
        unit: mm
        kind: constant
        anchor: &id004
          quote: each post 12.5 mm long and 1.5 mm in diameter
          where: Methods 2.10
    note: Implied by 'slender-beam theory' with the post's diameter; the formula is not printed. The 2 mm cap is ignored.
  F3b_force_d7.post_stiffness:
    item: F3b_force_d7
    measure: spring constant of the flexible post
    formula: not stated
    anchor:
      quote: the spring constant of the PDMS post, k, was determined by the Young’s modulus of PDMS (~3.8 MPa) and the diameter and length of
        the post itself
      where: Methods 2.12
    library:
      formula: cantilever_tip_stiffness
      vars:
        k: k
        E: E
        I: I
        L: L
    inputs:
      E:
        printed: ~3.8
        unit: MPa
        kind: constant
        anchor:
          quote: Young’s modulus of PDMS (~3.8 MPa)
          where: Methods 2.12
      I:
        derived: F3b_force_d7.post_second_moment
        kind: constant
      L:
        printed: '12.5'
        unit: mm
        kind: constant
        anchor: *id004
    alternatives:
    - label: load at the tissue's height
      formula: k = 6*E*I/(3*L*x**2 - x**3)
      note: cantilever_point_load_stiffness, with x the distance from the post base to the tissue; the tissue's height on the post is not printed
    note: '''Slender-beam theory'' names the model; which load case was used is not stated. One post of each pair is rigid (glass capillary),
      so the tissue force is the flexible post''s force.'
  F3b_force_d7.force:
    item: F3b_force_d7
    measure: twitch force
    formula: F = k*x
    anchor: &id005
      quote: flexible post deflection was tracked across the duration of each video, which allowed for the calculation of twitch force
      where: Methods 2.12
    library:
      formula: hooke_spring
      vars:
        F: F
        k: k
        x: x
    inputs:
      k:
        derived: F3b_force_d7.post_stiffness
        kind: constant
      x:
        not_stated: true
        kind: per sample
        note: peak twitch deflection of the flexible post; not printed
    aggregation: not stated
    note: F = k·x from 'spring constant'; one post is rigid, so no two-post sum applies.
  F3b_force_d14_rgo_tg.force:
