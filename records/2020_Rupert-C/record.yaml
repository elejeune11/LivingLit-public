  S3_t50_slope_hcf_vs_C:
    unit: S3
    measure: slope of time to 50% relaxation against contractile stress
    method: linear regression of relaxation time against contractile stress across pacing frequencies
    finding: the slope of the linear regression was significantly greater in control tissues
    compares:
      condition:
      - h5
      - h10
      - h15
      reference:
      - C
    test_of: main effect
    n:
      printed: n≥7
      counts: not stated
    stats:
      test: linear regression
      p: P<0.05
    stated_direction:
      direction: down
      anchor:
        quote: The relationship between relaxation time and contractile force was signiﬁcantly steeper in control tissues (Figures S3B and S3C)
        where: Results 3.2
    anchor:
      quote: The slope of the linear regression was significantly greater in control tissues compared to p4 and p9 hCF tissues. P<0.05, n≥7
      where: Fig. S3 legend
      file: 9363809.f1.pdf
    suspected_error:
      what: the legend compares control with 'p4 and p9 hCF tissues', groups that Fig. S3 does not contain (Control, 5%, 10%, 15% hCF)
      why: Fig. S3 shows the doping series; p4/p9 are the groups of Fig. S5
    note: test 'linear regression' from the Methods list; slope values not printed
