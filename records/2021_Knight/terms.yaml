record: 2021_Knight
vocabulary_version: 60
agent: {model: llm, instructions: terms_v4}
edits:
# ---------------------------------------------------------------- context: synonyms
- add_synonym: {id: purification:metabolic_selection, text: lactate medium,
    anchor: "Twenty to twenty-five days post induction, cardiomyocytes were enriched using lactate medium"}
- add_synonym: {id: preparation:fixed, text: fixed cells,
    anchor: "All measurements of cell area and hypertrophy were conducted on PFA-fixed cells."}
- add_synonym: {id: preparation:lysate, text: lysates, anchor: "normalized to α-tubulin. N = 5 lysates."}
- add_synonym: {id: preparation:rna_extract, text: RNA extraction,
    anchor: "RNA was generated via a column-free RNA extraction method."}
- add_synonym: {id: CHEBI:8093, field: treatment, text: PE,
    anchor: "For phenylephrine (PE)-induced hypertrophy, hiPSC-CMs were treated with 10 µM PE or vehicle (PBS) for 48 hours."}
- add_synonym: {id: MONDO:0005045, field: disease_model, text: HCM,
    anchor: "Myofibril mechanics data from human donor and idiopathic hypertrophic cardiomyopathy (HCM) hearts."}
# ---------------------------------------------------------------- context: adopted ids
- adopt: {field: treatment, id: "CHEBI:748559", label: deferoxamine mesylate,
    lookup: "chebi 'desferrioxamine' and 'deferoxamine'; the paper names the salt: 'deferoxamine mesylate (DFO)'",
    synonyms: [{text: DFO, anchor: "For deferoxamine mesylate (DFO) (MilliporeSigma, Burlington, MA)-induced hypertrophy, cells were treated with 30 mM DFO in DMSO or vehicle (DMSO) for 96 hours."}]}
- adopt: {field: disease_model, id: "MONDO:0010281", label: Danon disease, lookup: "mondo 'Danon disease' (exact label)"}
- adopt: {field: supplements, id: "CHEBI:7896", label: hexadecanoate,
    lookup: "second field for the id already adopted in treatment (synonym palmitic acid); chebi 'palmitic acid' gave only derivatives"}
- adopt: {field: supplements, id: "CHEBI:16196", label: oleic acid,
    lookup: "second field for the id already adopted in treatment; chebi 'oleic acid' (exact label)"}
- adopt_own: {field: cell_line, id: "cell_line:cuso_1", label: CUSO-1,
    scope: "The CUSO-1 line only; not CUSO-2, the other healthy-donor line of the same lab.",
    definition: "hiPSC line CUSO-1 of the University of Colorado, derived from a healthy male donor.",
    lookup: "cellosaurus 'CUSO-1', 'CUSO', 'CUSO 2': no hiPSC line (only Caco-2 CuSO4-R)"}
- adopt_own: {field: cell_line, id: "cell_line:cuso_2", label: CUSO-2,
    scope: "The CUSO-2 line only; not CUSO-1, the other healthy-donor line of the same lab.",
    definition: "hiPSC line CUSO-2 of the University of Colorado, derived from a healthy male donor.",
    lookup: "cellosaurus 'CUSO-1', 'CUSO', 'CUSO 2': no hiPSC line (only Caco-2 CuSO4-R)"}
- adopt_own: {field: cell_line, id: "cell_line:md_111", label: MD-111,
    scope: "Danon patient MD-111's line; not MD-186 or its corrected line MD-186C.",
    definition: "hiPSC line from male Danon disease patient MD-111, carrying a LAMP2 mutation.",
    lookup: "cellosaurus 'MD-111', 'MD186', 'LAMP2': no hiPSC line (only LAMP2 knockout lines of other cell types)"}
- adopt_own: {field: cell_line, id: "cell_line:md_186", label: MD-186,
    scope: "Danon patient MD-186's uncorrected line; not its corrected isogenic line MD-186C.",
    definition: "hiPSC line from male Danon disease patient MD-186, carrying a LAMP2 mutation.",
    lookup: "cellosaurus 'MD-186', 'MD186', 'LAMP2': no hiPSC line (only LAMP2 knockout lines of other cell types)"}
- adopt_own: {field: cell_line, id: "cell_line:md_186c", label: MD-186C,
    scope: "The corrected isogenic line of MD-186; not the uncorrected MD-186 line.",
    definition: "Isogenic line of MD-186 in which the Danon-causing LAMP2 mutation was corrected with CRISPR-Cas9.",
    lookup: "cellosaurus 'MD-186', 'MD186', 'LAMP2': no corrected hiPSC line"}
# ---------------------------------------------------------------- context: own terms
- add_term:
    field: platform
    id: platform:grooved_surface
    label: grooved surface
    parent: platform:culture_2d
    definition: "Cells grown on a flat surface scored or embossed with parallel micro-grooves that align them."
    scope: "Topographic grooves across the whole surface (the groove maker is a qualifier); not cells confined to printed matrix islands (micropatterned culture), not an unpatterned monolayer, and not posts, thin films, inserts or electrode arrays."
    qualifiers: {groove_maker: {dimension: text}}
- add_term:
    field: preparation
    id: preparation:isolated_myofibrils
    label: isolated myofibrils
    definition: "Myofibrils or myofibril bundles released from lysed cells or homogenised tissue and mounted for mechanical measurement."
    scope: "Single myofibrils or small bundles freed from the cell; not skinned tissue strips, intact tissue, dissociated living cells, or extracts for molecular assays."
    synonyms: [{text: isolated myofibrils, anchor: "we isolated myofibrils from hiPSC-CMs cultured under each condition"}]
- add_term:
    field: preparation
    id: preparation:permeabilised_cells
    label: permeabilised cells
    definition: "Harvested cells whose plasma membrane is chemically permeabilised so that an assay reaches intracellular enzymes or organelles."
    scope: "Permeabilised cell suspensions for enzyme or organelle assays; not skinned muscle tissue, not isolated myofibrils, not lysates or extracts, and not fixed cells."
- add_term:
    field: preparation
    id: preparation:lipid_extract
    label: lipid extract
    definition: "Lipids extracted from harvested cells or tissue (e.g. by a Bligh-Dyer method) for mass spectrometry."
    scope: "Extracted lipids; not polar metabolites (metabolite extract), not RNA or DNA extracts and not a protein lysate."
- add_term:
    field: measurement_medium
    id: measurement_medium:activating_solution
    label: activating solution
    definition: "A high-calcium solution (pCa about 4.5) that fully activates permeabilised myofilaments or myofibrils."
    scope: "The calcium-activating bath of a skinned-muscle or myofibril rig; not the relaxing solution of the same rig and not a physiological bath for intact cells (Tyrode's, Krebs, culture medium)."
- add_term:
    field: measurement_medium
    id: measurement_medium:relaxing_solution
    label: relaxing solution
    definition: "A low-calcium solution (pCa about 9) in which permeabilised myofilaments or myofibrils are relaxed."
    scope: "The relaxing bath of a skinned-muscle or myofibril rig; not the activating solution of the same rig and not a physiological bath for intact cells (Tyrode's, Krebs, culture medium)."
- add_term:
    field: genotype
    id: genotype:lamp2_variant
    label: LAMP2 variant
    parent: genotype:gene_variant
    definition: "Cells carrying a variant in LAMP2, the lysosome-associated membrane protein 2 gene whose loss causes Danon disease."
    scope: "A LAMP2 variant; not variants in other genes (PKP2, DSP, MYBPC3, MYH7 and others)."
- add_term:
    field: genotype
    id: genotype:gene_corrected
    label: gene-corrected isogenic line
    parent: genotype:wild_type
    definition: "A patient line in which the disease-causing variant (gene a qualifier) was corrected by gene editing, the isogenic control of the patient line."
    scope: "Wild type reached by editing a patient line; an unrelated healthy or unedited control is the parent wild type."
- add_qualifier: {id: treatment:vehicle_not_stated, name: control, dimension: text}
# ---------------------------------------------------------------- measures: synonyms and qualifiers
- add_synonym: {id: measure:cell_circularity, text: circularity,
    anchor: "To assess differences in cell morphology quantitatively, we measured cell area and circularity."}
- add_qualifier: {id: measure:differentially_expressed_gene_count, name: threshold, dimension: text}
# ---------------------------------------------------------------- measures: new terms
- add_term:
    field: measure
    id: measure:sarcomere_organisation_score
    label: sarcomere organisation score
    definition: "Ordinal score of sarcomere organisation graded per cell from electron micrographs on a stated scale (qualifier scale)."
    scope: "A numeric grade from electron microscopy; not the by-eye immunostaining appearance (sarcomere organisation), not an order parameter and not sarcomere length."
    dimension: dimensionless
    qualifiers: {scale: {dimension: text}}
- add_term:
    field: measure
    id: measure:cell_to_cell_variability
    label: cell-to-cell variability
    definition: "Spread of a stated measure (qualifier of_measure) across the individual cells of one group."
    scope: "Spread among cells within a group; not the spread across replicate samples (variability across samples) and not the measure's mean."
    dimension: dimensionless
    qualifiers: {of_measure: {dimension: text}, statistic: {dimension: text}}
- add_term:
    field: measure
    id: measure:lipid_species_fraction
    label: lipid species fraction
    definition: "Share of one lipid species (qualifier lipid_species) in the total of its lipid class (qualifier total), by mass spectrometry."
    scope: "The share of a lipid species within its class; not the abundance of a polar metabolite (metabolite abundance) and not a gene-product isoform fraction."
    dimension: dimensionless
    qualifiers: {lipid_species: {dimension: text}, total: {dimension: text}}
- add_term:
    field: measure
    id: measure:myofibril_rate_constant
    label: myofibril kinetic rate constant
    definition: "Rate constant of a phase of tension development or relaxation in a mounted myofibril after a rapid solution switch."
    scope: "Rate constants of isolated myofibril or skinned-muscle mechanics; not times to a level of relaxation in a twitch (relaxation time) and not rates of force change (maximal rate of force rise)."
    dimension: frequency
- add_term:
    field: measure
    id: measure:myofibril_activation_rate
    label: myofibril activation rate constant
    parent: measure:myofibril_rate_constant
    definition: "Rate constant of tension development after a myofibril is switched into activating solution (kACT)."
    scope: "Tension development from relaxation; not tension redevelopment after a release-restretch (kTR) and not relaxation rate constants."
    dimension: frequency
    synonyms: [{text: kAct, anchor: "activation kinetics (kAct), the rate constant of tension development following myofibril activation"}]
- add_term:
    field: measure
    id: measure:tension_redevelopment_rate
    label: tension redevelopment rate constant
    parent: measure:myofibril_rate_constant
    definition: "Rate constant of tension redevelopment after a rapid release and restretch breaks cross-bridges in an activated myofibril (kTR)."
    scope: "Redevelopment during steady activation; not tension development from relaxation (kACT) and not relaxation rate constants."
    dimension: frequency
    synonyms: [{text: kTr, anchor: "reactivation kinetics (kTr), the rate constant of tension redevelopment following myofibril release/stretch to break cross bridges"}]
- add_term:
    field: measure
    id: measure:slow_phase_relaxation_rate
    label: slow phase relaxation rate constant
    parent: measure:myofibril_rate_constant
    definition: "Rate constant of the initial slow, linear phase of myofibril relaxation after the switch to relaxing solution (kREL,slow)."
    scope: "The slow linear phase; not the fast exponential phase (fast phase relaxation rate constant) and not activation rate constants."
    dimension: frequency
- add_term:
    field: measure
    id: measure:fast_phase_relaxation_rate
    label: fast phase relaxation rate constant
    parent: measure:myofibril_rate_constant
    definition: "Rate constant of the fast exponential phase of myofibril relaxation (kREL,fast)."
    scope: "The fast exponential phase; not the slow linear phase (slow phase relaxation rate constant) and not activation rate constants."
    dimension: frequency
- add_term:
    field: measure
    id: measure:slow_phase_relaxation_duration
    label: slow phase relaxation duration
    definition: "Duration of the slow linear phase of myofibril relaxation, from the switch to relaxing solution to the start of the fast phase (tLIN)."
    scope: "A myofibril relaxation phase duration; not a twitch relaxation time to a stated level and not a rate constant."
    dimension: time
- add_term:
    field: measure
    id: measure:calcium_activated_tension
    label: maximal calcium-activated tension
    definition: "Greatest active tension per cross-sectional area of a permeabilised myofibril or muscle at full calcium activation."
    scope: "Steady maximal tension under saturating calcium in a skinned preparation; not the twitch stress of an intact paced tissue and not resting (diastolic) stress."
    dimension: stress
- add_term:
    field: measure
    id: measure:myofibril_diameter
    label: myofibril diameter
    definition: "Diameter of a mounted myofibril or myofibril bundle, measured from images."
    scope: "A myofibril's width; not a cell, tissue, fiber, vessel or Z-disk dimension."
    dimension: length
- add_term:
    field: measure
    id: measure:sample_clustering
    label: clustering of samples
    definition: "Grouping of samples or groups by unsupervised clustering on a stated set of measured parameters (qualifier features)."
    scope: "Clustering of samples on several parameters; not clustering of genes by their expression profiles (gene expression clusters)."
    dimension: categorical
    qualifiers: {features: {dimension: text}}
# ---------------------------------------------------------------- standing keys for the measures this paper adds
- standing_key:
    measure: measure:sarcomere_organisation_score
    value: {must_match: [platform@1, preparation, measure.scale, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:cell_to_cell_variability
    value: {must_match: [platform@1, preparation, measure.of_measure, measure.statistic, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.of_measure], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:lipid_species_fraction
    value: {must_match: [platform@1, preparation, measure.lipid_species, measure.total, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.lipid_species], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:myofibril_rate_constant
    value: {must_match: [preparation, temperature, measurement_calcium_mM, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:myofibril_activation_rate
    value: {must_match: [preparation, temperature, measurement_calcium_mM, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:tension_redevelopment_rate
    value: {must_match: [preparation, temperature, measurement_calcium_mM, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:slow_phase_relaxation_rate
    value: {must_match: [preparation, temperature, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:fast_phase_relaxation_rate
    value: {must_match: [preparation, temperature, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:slow_phase_relaxation_duration
    value: {must_match: [preparation, temperature, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:calcium_activated_tension
    value: {must_match: [preparation, temperature, measurement_calcium_mM, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:myofibril_diameter
    value: {must_match: [preparation, treatment, genotype, disease_model, species], may_vary: [cell_line, platform]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:sample_clustering
    value: {must_match: [preparation, measure.features], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.features], may_vary: [cell_line]}
mappings:
# ---------------------------------------------------------------- context
- field: insulin_day
  stated: D7
