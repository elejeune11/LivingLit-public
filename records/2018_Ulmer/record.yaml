      where: Fig. 1 legend
      file: main.pdf
    method: video-optical recording
    software: not stated
    definition:
      citation: Hansen2010
      anchor:
        quote: Video-optical analysis of contractile force was performed as recently described (Hansen et al., 2010;
        where: Experimental Procedures
        file: main.pdf
    groups:
    - l1b1
    - l1b2
    - l2b1
    - l2b2
    - l2b3
    n:
      printed: 'Control line 1 (#1, n=13; #2, n=6 ) Control line 2 (#1, n=14; #2, n=10; #3, n=3)'
