    anchor: accelerates maturation of human engineered heart tissue
  - text: engineered tissues
    anchor: Zhao et al. (engineered tissues with rapid pacing)
  - text: EHT
    anchor: We recently established the hiPSC-CM engineered heart tissue (EHT) model
  - text: engineered heart muscle
    anchor: Engineered heart muscle (EHM) formation depends on passive stretch
  - text: engineered heart tissues
    anchor: Mass-produced (Figure 6D) engineered heart tissues from expanded hiPSC-CMs
  - text: engineered cardiac tissues
