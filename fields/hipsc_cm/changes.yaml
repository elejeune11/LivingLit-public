  - event: add_term
    field: measure
    id: measure:lactate_glucose_yield
    label: lactate yield on glucose
    dimension: dimensionless
    definition: Lactate produced per glucose consumed by the cells over a stated interval, from medium concentrations.
    scope: A ratio of lactate production to glucose consumption; not glucose consumption or lactate production alone, and
      not an OCR/ECAR ratio.
  - event: add_term
    field: measure
    id: measure:isotopologue_fraction
    label: mass isotopologue fraction
    dimension: dimensionless
    definition: Share of a metabolite pool (qualifier metabolite) present as one mass isotopologue (qualifier isotopologue)
      after labelling with a stated 13C tracer (qualifier tracer).
    scope: One isotopologue's share of a labelled pool; not a substrate's computed contribution to a pool, not metabolite
      abundance and not labelled substrate oxidation.
    qualifiers:
      tracer:
        dimension: text
      metabolite:
        dimension: text
      isotopologue:
        dimension: text
  - event: add_term
    field: measure
    id: measure:tracer_contribution
    label: substrate contribution to a labelled pool
    dimension: dimensionless
    definition: Fraction of a metabolite pool (qualifier pool) derived from a stated 13C-labelled substrate (qualifier tracer),
      computed from isotopologue distributions.
    scope: A substrate's share of a pool's carbon; not the fraction of a single isotopologue, not metabolite abundance and
      not labelled substrate oxidation.
    qualifiers:
      tracer:
        dimension: text
      pool:
        dimension: text
  - event: add_term
    field: measure
    id: measure:ocr_ecar_ratio
    label: OCR/ECAR ratio
    dimension: dimensionless
    definition: Oxygen consumption rate divided by extracellular acidification rate, an index of oxidative over glycolytic
      energy production.
    scope: The ratio of the two rates; not the oxygen consumption rate or the acidification rate alone, and not lactate yield
      on glucose.
  - event: add_term
    field: measure
    id: measure:cell_concentration
    label: cell concentration
    dimension: number_per_volume
    definition: Number of cells per volume of suspension, counted after harvesting a culture.
    scope: Cells per volume of a harvested culture; not cells in a whole construct (cell number), cells per field of view,
      or the fraction alive (cell viability).
  - event: add_term
    field: measure
    id: measure:lipid_droplet_content
    label: lipid droplet content
    dimension: dimensionless
    definition: Amount of intracellular neutral lipid droplets, measured by the fluorescence of a lipid-droplet dye.
    scope: Stored neutral lipid; not fatty acid uptake, fatty acid oxidation or mitochondrial mass.
  - event: add_term
    field: measure
    id: measure:gene_set_distribution_shift
    label: shift of a gene set's fold-change distribution
    parent: measure:gene_set_expression
    dimension: dimensionless
    definition: Whether the distribution of expression fold changes of a stated gene set (qualifier gene_set) is shifted from
      that of all genes, tested by a distribution test.
    scope: A test of a set's fold-change distribution against all genes; not the heat map or profile of the set's genes read
      together (the parent term).
  - event: add_term
    field: measure
    id: measure:pca_centroid_distance
    label: distance between PCA centroids
    dimension: dimensionless
    definition: Euclidean distance between the centroids of two sample groups in a principal component analysis over stated
      components (qualifier components) and a stated gene set (qualifier gene_set).
    scope: Distance between groups in principal component space; not one sample's principal component score, the variance
      a component explains, or a correlation of expression profiles.
    qualifiers:
      components:
        dimension: text
      gene_set:
        dimension: text
  - event: add_term
    field: measure
    id: measure:binucleated_cell_fraction
    label: binucleated cell fraction
    dimension: dimensionless
    definition: Fraction of cells with two nuclei.
    scope: Share of cells with two nuclei; not the fraction of cells positive for a marker and not the distance between nuclei.
    synonyms:
    - text: percentage of binucleated cells
      anchor: higher (1.6-fold) percentage of binucleated cells
  - event: add_term
    field: measure
    id: measure:mitochondrial_membrane_potential
    label: mitochondrial membrane potential
    dimension: dimensionless
    definition: Inner mitochondrial membrane potential, read as the fluorescence of a potential-dependent mitochondrial dye.
    scope: Potential-dependent dye signal; not mitochondrial mass, mitochondrial DNA content or mitochondrial area fraction.
    synonyms:
    - text: mitochondrial membrane potential
      anchor: Measurement of mitochondrial membrane potential
  - event: add_term
    field: measure
    id: measure:cell_circularity
    label: cell circularity index
    dimension: dimensionless
    definition: Circularity of a cell's outline (4π·area/perimeter², 1 for a circle).
    scope: Roundness of the outline; not cell area, the length-to-width aspect ratio or the 0-to-1 elongation ratio.
  - event: add_term
    field: measure
    id: measure:calcium_transient_decay_rate
    label: calcium transient decay velocity
    dimension: rate
    definition: Rate at which the calcium-dye signal falls during the decay of the calcium transient.
    scope: Slope of the decay in signal per time; not the decay time or time constant, and not the rising slope.
  - event: add_term
    field: measure
    id: measure:metabolic_activity
    label: metabolic activity
    dimension: dimensionless
    definition: Cellular reducing activity measured by the reduction of a resazurin-based reagent.
    scope: Reagent reduction by living cells; not the fraction of cells alive (cell viability), oxygen consumption or cell
      concentration.
  - event: set_scope
