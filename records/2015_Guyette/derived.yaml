  F5I_cv.cv:
    item: F5I_cv
    group: fib
    measure: conduction velocity
    formula: v = d/(t2 - t1)
    anchor:
      quote: with a conduction velocity of 32±56 cm/s
      where: Results, Recellularization of Myocardial Slices and Fibers
    library:
      formula: conduction_velocity_def
      vars:
        v: v
        d: d
        t1: t1
        t2: t2
    inputs:
      d: &id002
        not_stated: true
        kind: per sample
      t1: *id002
      t2: *id002
    output: F5I_cv.values.cv
    aggregation: not stated
    note: how distance and activation times were taken from the voltage maps is not stated
