evidence:
  F1_ffr_raw:
    unit: F1
    measure: systolic peak force
    method: isometric force with a force transducer and linear actuator at 10% stretch, in Tyrode's solution; pacing frequency
      staircase from 1 to 3 Hz in 0.25-Hz increments
    software: MATLAB scripts
    finding: Higher systolic peak forces for HC-NP across 1–3 Hz; FFR negative in both groups.
    compares:
    - HC_NP
    - LC_NP
    context:
      pacing:
        value: electrical pacing
        qualifiers:
          frequency: 1–3 Hz in 0.25-Hz increments
    n:
      printed: (B and C), (E and F) both n = 6
      counts: tissues (EHTs)
      per_group:
        HC_NP: '6'
        LC_NP: '6'
    stats:
      test: two-way ANOVA with repeated measures
      p: p < 0.0001
      p_values:
      - p: p = n.s.
        anchor:
          quote: two-way ANOVA p = n.s. (B and C)
          where: Fig. 1 legend
      - p: p < 0.0001
        anchor:
          quote: Fig. 1B label 'Calcium p < 0.0001'
          where: Fig. 1B
          kind: unit
    anchor:
      quote: The raw FFR showed higher systolic peak forces for HC-NP group across 1–3 Hz (Ca2+ p < 0.0001)
      where: Results, p. 2038
    note: The text and the Fig. 1B label give p < 0.0001 for Ca2+; the legend gives two-way ANOVA p = n.s. for B and C.
  F1_ffr_norm:
    unit: F1
    measure: normalized peak force
    method: isometric force with a force transducer and linear actuator at 10% stretch, in Tyrode's solution; systolic peak
      force normalized, 1–3 Hz
    software: MATLAB scripts
    finding: Marginal improvement in HC-NP; both highly negative.
    compares:
    - HC_NP
    - LC_NP
    context:
      pacing:
        value: electrical pacing
        qualifiers:
          frequency: 1–3 Hz in 0.25-Hz increments
    n:
      printed: (B and C), (E and F) both n = 6
      counts: tissues (EHTs)
      per_group:
        HC_NP: '6'
        LC_NP: '6'
    stats:
      test: two-way ANOVA with repeated measures
