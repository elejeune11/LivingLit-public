  F5e_variation_rc.variation_rc_0p5Hz:
    item: F5e_variation_rc
    group: rc_0p5Hz
    formula: d = (x - 1/f)/(1/f)
    anchor:
      quote: Relative percent variation between the measurement interval and the input frequency
      where: Fig. 5 legend
    library:
      formula: relative_deviation_from_period
      vars:
        d: d
        x: x
        f: f
    inputs:
      x:
        item: F5d_interval_rc
        kind: per sample
        note: measured interval between adjacent calcium transient peaks (Fig. 5d/f bars; not read, no value printed)
      f:
        printed: '0.5'
        unit: Hz
        anchor:
          quote: cells were paced continuously with an incrementing frequency (0.5, 1, 2, 3, 4, 5, 6, 7, 8 Hz)
          where: Methods, Continuous Electrical Stimulation
        kind: constant
    aggregation: not stated
    alternatives:
    - label: absolute deviation
      formula: d = Abs(x*f - 1)
      note: the sign of the variation is not stated; the plotted values are all positive
    note: The paper names the operation only; the reference is read as the period of the input frequency, 1/f.
