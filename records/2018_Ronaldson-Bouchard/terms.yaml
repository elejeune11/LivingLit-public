  terms:
  - measure:mitochondrial_area_fraction
- field: measure
  stated: IK1 current density
  terms:
  - measure:current_density
  qualifiers:
    current: IK1
- field: measure
  stated: T-tubules and calcium handling protein spacing
  flag:
    kind: several measures
    note: T-tubule presence and the spacing of calcium handling proteins are two measures
- field: measure
  stated: calcium transient ((F – F0)/F0) at increasing pacing frequency
  terms:
  - measure:calcium_transient_amplitude
  qualifiers:
    expressed_as: '% change'
  note: pacing frequency is the x variable
- field: measure
  stated: caffeine response
  terms:
  - measure:caffeine_calcium_release
- field: measure
  stated: change in twitch tension after rest (post-rest potentiation)
  terms:
  - measure:post_rest_potentiation
- field: measure
  stated: change in force with isoproterenol (ionotropic response)
  terms:
  - measure:twitch_force
  note: 'broader term: a dose response of force to isoproterenol (treatment); whether the value is a change or a level is
    not in the stated text'
- field: measure
  stated: calcium transient ((F – F0)/F0) with isoproterenol (lusitropic response)
  terms:
  - measure:calcium_transient_amplitude
  qualifiers:
    expressed_as: '% change'
  note: the stated quantity is (F – F0)/F0 although the label says lusitropic
- field: measure
  stated: EC50 of beat frequency response to isoproterenol
  terms:
  - measure:ec50
  qualifiers:
    response: beat frequency
- field: measure
  stated: twitch stress vs [Ca2+]
  terms:
  - measure:twitch_stress
  note: '[Ca2+] is the x variable'
- field: measure
  stated: action potential duration (90% from peak)
  terms:
