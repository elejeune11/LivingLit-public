  F4B_al_tcp.levels_3_4_al:
    item: F4B_al_tcp
    group: al
    measure: sarcomeric organization level
    formula: t = a + b
    anchor: &id004
      quote: those cells exhibited the highest proportions of cells in levels III and IV, reaching a total of 75%, comparing
        to 63%
      where: Results 3.3
    library:
      formula: sum_of_parts
      vars:
        t: t
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: constant
        note: share of cells in level III (Fig. 4B stacked bar, not read)
      b:
        not_stated: true
        kind: constant
        note: share of cells in level IV (Fig. 4B stacked bar, not read)
    output: F4B_al_tcp.values.lvl34_al_text
  F4B_al_tcp.levels_3_4_tcp:
    item: F4B_al_tcp
    group: tcp
    measure: sarcomeric organization level
    formula: t = a + b
    anchor: *id004
    library:
      formula: sum_of_parts
      vars:
        t: t
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: constant
        note: share of cells in level III (Fig. 4B stacked bar, not read)
      b:
        not_stated: true
        kind: constant
        note: share of cells in level IV (Fig. 4B stacked bar, not read)
    output: F4B_al_tcp.values.lvl34_tcp_text
  F4_li1996_area.fold_vs_hpsc:
    item: F4_li1996_area
    measure: cell area
    formula: r = a/b
    anchor:
      quote: which is at least 11 fold larger than hPSC-CMs examined in the current study
      where: Discussion
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        value: F4_li1996_area.values.area_text
        part: mean
        kind: constant
      b:
        value: F4C_area_al_tcp.values.area_tcp_text
        part: mean
        kind: constant
        note: the largest hPSC-CM mean area (TCP); "at least" fits the largest
    alternatives:
    - label: aligned fibers (864 µm2)
      formula: r = a/b
      note: b = F4C_area_al_tcp.values.area_al_text
    - label: random fibers (745 µm2)
      formula: r = a/b
      note: b = F4C_area_al_ra.values.area_ra_text
    note: the printed "at least 11 fold" is not a recorded value (only in the item note); no output named
  F4_bird2003_sl.fold_vs_hpsc:
    item: F4_bird2003_sl
    measure: sarcomere length
    formula: r = a/b
    anchor:
      quote: which is about 1.5 fold of the value in hPSC-CMs observed in this study
      where: Discussion
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        value: F4_bird2003_sl.values.sl_text
        part: mean
        kind: constant
      b:
        value: F4D_sl.values.sl_text
        part: mean
        kind: constant
    note: the printed "about 1.5 fold" is not a recorded value (only in the item note); 2.2/1.4 is 1.57; no output named
