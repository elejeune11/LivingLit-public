  terms: [measure:calcium_transient_rise_time]
  qualifiers: {level: 50% rise to peak}
  note: the Discussion prints '50% rise to peak time'; the Fig. 7 legend's 'half rise to decay time' is a suspected error in the record.
- field: measure
