  F1_area_text.pct_MM:
    item: F1_area_text
    formula: s = (x0 - x)/x0
    anchor:
      quote: Cells cultured with MM or MPAT were approximately 30% smaller than cells cultured in GLUC
      where: Results, MPAT Improves Both hiPSC-CM Morphology
    library:
      formula: relative_decrease
      vars:
        s: s
        x: x
        x0: x0
    inputs:
      x:
        not_stated: true
        kind: not stated
        note: mean cell area of MM (Fig. 1B bars; not printed, not read)
      x0:
        not_stated: true
        kind: not stated
        note: mean cell area of GLUC (Fig. 1B; not printed, not read)
    output: F1_area_text.values.pct_MM_text
  F1_area_text.pct_MPAT:
