  F5g_contraction.amplitude:
    item: F5g_contraction
    measure: contraction amplitude (fractional area change)
    formula: c = (Ar - Ac)/Ar
    anchor:
      quote: Contraction amplitudes were calculated as the percentage change in fractional area change amplitude between contraction
        and relaxation
      where: Methods, Contraction analysis of beating spheroids
    library:
      formula: relative_decrease
      vars:
        s: c
        x: Ac
        x0: Ar
    inputs:
      Ac:
        not_stated: true
        kind: per sample
        note: projected area at contraction of each organoid, not printed
      Ar:
        not_stated: true
        kind: per sample
        note: projected area at relaxation of each organoid, not printed
    alternatives:
    - label: percentage
      formula: c = 100*(Ar - Ac)/Ar
      note: the Methods say 'percentage change', but Fig. 5g plots fractions (about 0.008)
