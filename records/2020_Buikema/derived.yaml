record: 2020_Buikema
formula_library_version: 27
agent:
  model: llm
  instructions: formulas_v3
derived:
  F1B_sparse.fold_overall:
    item: F1B_sparse
    group: sparse
    formula: R = r1*r2*r3
    anchor:
      quote: the total cell number increased by 8-, 8-, and 4-fold at each passage, resulting overall in a 241-fold increase
      where: Results, GSK-3b Inhibition Promotes hiPSC-CM Proliferation
      file: journal_version.pdf
    library:
      formula: product_of_three_ratios
      vars:
        R: R
        r1: r1
        r2: r2
        r3: r3
    inputs:
      r1:
        value: F1B_sparse.values.fold_first
        kind: constant
      r2:
        value: F1B_sparse.values.fold_second
        kind: constant
      r3:
        value: F1B_sparse.values.fold_third
        kind: constant
    output: F1B_sparse.values.fold_overall
    note: the overall fold over three passages is the product of the per-passage folds ('resulting overall in')
  F1B_dense.fold_10:
    item: F1B_dense
    formula: r = a/b
    anchor:
      quote: at the end of three passages or 3 weeks, the number increase was 10-fold
      where: Results, GSK-3b Inhibition Promotes hiPSC-CM Proliferation
      file: journal_version.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: per sample
        note: cell number after three passages or 3 weeks; not printed
      b:
        not_stated: true
        kind: per sample
        note: cell number at day 12 ('fold increase over day 12', Fig. 1B legend); not printed
    output: F1B_dense.values.fold_10
  F5B_pnu_chir.drop:
    item: F5B_pnu_chir
    formula: s = (x0 - x)/x0
    anchor:
      quote: the CHIR-mediated hiPSC-CM proliferation decreased only by 50%
      where: Results, Mechanistic Analysis
      file: journal_version.pdf
    library:
      formula: relative_decrease
      vars:
        s: s
        x: x
        x0: x0
    inputs:
      x:
        reading: f5b/F5B_pnu_chir/chir_pnu
        kind: per sample
      x0:
        reading: f5b/F5B_pnu_chir/chir
        kind: per sample
    output: F5B_pnu_chir.values.drop
    note: decrease of the inhibitor group's mean relative to CHIR alone, from the plotted TnT+ cell numbers
  F5H_mk.drop:
    item: F5H_mk
    formula: s = (x0 - x)/x0
    anchor:
      quote: hiPSC-CM proliferation decreased by 50% compared with CHIR treatment alone
      where: Results, Mechanistic Analysis
      file: journal_version.pdf
    library:
      formula: relative_decrease
      vars:
        s: s
        x: x
        x0: x0
    inputs:
      x:
        reading: f5h/F5H_mk/chir_mk
        kind: per sample
      x0:
        reading: f5h/F5H_mk/chir
        kind: per sample
    output: F5H_mk.values.drop
    note: decrease of the inhibitor group's mean relative to CHIR alone, from the plotted TnT+ cell numbers
  S5B.fold:
    item: S5B
    formula: r = a/b
    anchor:
      quote: CHIR-treated embryos contained a 1.8-fold increase in mitotic CMs compared with the embryos treated with DMSO control
      where: Results, in vivo CHIR
      file: journal_version.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        reading: s5/S5B/chir
        kind: per sample
      b:
        reading: s5/S5B/ctr
        kind: per sample
    output: S5B.values.fold
    aggregation: of means
    note: fold of group means (unpaired embryos); the plotted values are already relative to CTR
  F3E_force.force:
    item: F3E_force
    formula: F = d/L*A*E
    anchor:
      quote: maximum contractile force was calculated using Young's modulus equation
      where: Methods, Single cell patterning and contractility
      file: journal_version.pdf
    library:
      formula: force_from_strain_modulus_area
      vars:
        F: F
        d: d
        L: L
        A: A
        E: E
    inputs:
      d:
        not_stated: true
        kind: per sample
        note: maximum contractile deformation distance from motion vector analysis; not printed
      L:
        printed: '112'
        unit: um
        kind: constant
        anchor:
          quote: initial cell length determined by patterning
          where: Methods, Single cell patterning and contractility (equation)
          file: journal_version.pdf
      A:
        printed: '1800'
        unit: um^2
        kind: constant
        anchor:
          quote: Since cells are patterned into known surface area
          where: Methods, Single cell patterning and contractility
          file: journal_version.pdf
      E:
        printed: '10'
        unit: kPa
        kind: constant
        anchor:
          quote: attached to hydrogel substrate of known stiffness (10 kPa)
          where: Methods, Single cell patterning and contractility
          file: journal_version.pdf
    aggregation: mean of per-sample
    note: E is the hydrogel substrate's modulus and A the patterned planform area (not a cross-section carrying the force), as the methods
      state; no force value is printed, so nothing is rebuilt
  F3H_amp.dff0:
    item: F3H_amp
    formula: d = (F - F0)/F0
    anchor:
      quote: Transient amplitude was expressed as DF/F0
      where: Methods, Electrophysiological studies
      file: journal_version.pdf
    library:
      formula: relative_change
      vars:
        d: d
        x: F
        x0: F0
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: peak Fluo-4 fluorescence
      F0:
        not_stated: true
        kind: per sample
        note: baseline fluorescence
    aggregation: not stated
    note: Fig. 3F legend says the traces are 'expressed relative to baseline (F/F0)'; the methods give DF/F0 for the amplitude
