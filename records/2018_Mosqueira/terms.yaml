record: 2018_Mosqueira
vocabulary_version: 50
agent:
  model: llm
  instructions: terms_v4
edits:
# ---------------------------------------------------------------- adopted fields
- adopt_own:
    field: differentiation_factors
    id: differentiation_factors:ky02111
    label: KY02111
    definition: The small-molecule Wnt signalling inhibitor KY02111, used in cardiac differentiation.
    scope: KY02111, a Wnt inhibitor; not IWP4 or IWR-1 (other Wnt inhibitors), not Wnt3a, VEGF or DS-07.
    lookup: searched the pinned ChEBI for KY02111, KY 02111, KY-02111 and KY0211; no entry
    synonyms:
    - text: KY0211
      anchor: KY0211 (R&D #4731) and XAV939 (R&D #3748), both at 100μM
- adopt_own:
    field: cell_line
    id: cell_line:at1
    label: AT1
    definition: The AT1 hiPSC line of the Denning lab, reprogrammed by lentivirus from dental-pulp fibroblasts of a female donor.
    scope: The Denning-lab AT1 line and lines gene-edited from it; not REBL-PAT or any other own line.
    lookup: searched the pinned Cellosaurus for AT1 and for dental pulp iPSC; AT1 there is SUP-B26 (a leukaemia line), not this hiPSC line
- adopt_own:
    field: cell_line
    id: cell_line:rebl_pat
    label: REBL-PAT
    definition: The REBL-PAT hiPSC line of the Denning lab, reprogrammed with Sendai virus from a skin biopsy of a male donor.
    scope: The Denning-lab REBL-PAT line and lines gene-edited from it; not AT1 or any other own line.
    lookup: searched the pinned Cellosaurus for REBL-PAT, REBL PAT and REBL; no entry
- adopt:
    field: cell_line
    id: CVCL_B205
    label: HUES 7
    lookup: Cellosaurus search for HUES7 (exact synonym of HUES 7)
    synonyms:
    - text: HUES7
      anchor: male HUES7 hESC
- adopt:
    field: disease_model
    id: MONDO:0005045
    label: hypertrophic cardiomyopathy
    lookup: MONDO search for hypertrophic cardiomyopathy (exact label)
- adopt:
    field: treatment
    id: CHEBI:51450
    label: bosentan
    lookup: ChEBI search for bosentan (exact label; bosentan hydrate not chosen)
- adopt_own:
    field: treatment
    id: treatment:vehicle_not_stated
    label: vehicle, solvent not stated
    definition: A vehicle control whose solvent the source does not name.
    scope: A vehicle exposure with an unnamed solvent; a named solvent (DMSO, PBS) maps to that solvent, and no exposure is the state none.
    lookup: a vehicle is a role, not a compound; ChEBI has no entry for an unnamed vehicle (searched vehicle)
- add_qualifier:
    id: CHEBI:28262
    name: concentration
    dimension: concentration
# ---------------------------------------------------------------- own context fields
- add_term:
    field: purity_method
    id: purity_method:immunostaining
    label: immunostaining
    definition: Counting marker-positive cells in fixed cultures by immunostaining and imaging.
    scope: Purity from stained, imaged cells; not flow cytometry of cells in suspension.
    qualifiers:
      marker: {dimension: text}
- set_scope:
    id: purity_method:flow_cytometry
    scope: Purity counted on cells in suspension by flow cytometry; not immunostaining of fixed cultures.
- add_synonym:
    id: replating_coating:vitronectin
    text: Vitronectin-N
    anchor: seeding into Vitronectin-N (VN, Lifetech #A14700)-coated vessels
- add_synonym:
    id: measurement_medium:tyrode_solution
    text: Tyrode's
    anchor: Extracellular solution (Tyrode’s) contained (mM)
- add_synonym:
    id: measurement_medium:seahorse_xf_dmem
    text: XF base medium
    anchor: medium was exchanged for XF base medium (Agilent Technologies #102353)
- add_qualifier:
    id: measurement_medium:hbss
    name: formulation
    dimension: text
- add_synonym:
    id: pacing:electrical_pacing
    text: electrically paced
    anchor: EHTs were electrically paced (2 V, 1-2.5 Hz, impulse duration 4 ms)
- add_synonym:
    id: preparation:dissociated_cells
    text: dissociated hPSC-CMs
    anchor: Mitochondria of dissociated hPSC-CMs were stained using 100nM MitoTracker green FM
- add_term:
    field: transgene
    id: transgene:r_geco1
    label: R-GECO1
    parent: transgene:calcium_indicator
    definition: The red-fluorescent genetically encoded calcium indicator R-GECO1.
    scope: R-GECO1, a red indicator; not the green GCaMP indicators (GCaMP5G, GCaMP6f, GCaMP6).
- add_term:
    field: genotype
    id: genotype:myh7_variant
    label: MYH7 variant
    parent: genotype:gene_variant
    definition: A variant of MYH7, the gene of β-myosin heavy chain, with variant and zygosity as qualifiers.
    scope: A variant in MYH7; not in MYH6, MYBPC3, PKP2, DSP, RBM20, SCN5A or TTN.
- add_term:
    field: genotype
    id: genotype:myh6_variant
    label: MYH6 variant
    parent: genotype:gene_variant
    definition: A variant of MYH6, the gene of α-myosin heavy chain, with variant and zygosity as qualifiers.
    scope: A variant in MYH6; not in MYH7, MYBPC3, PKP2, DSP, RBM20, SCN5A or TTN.
# ---------------------------------------------------------------- measures
- add_synonym:
    id: measure:basal_mitochondrial_respiration
    text: basal respiration
    anchor: where basal respiration, maximal respiration and ATP production increased by 3-, 2.75-, and 3-fold, respectively
- add_term:
    field: measure
    id: measure:marker_intensity_class_fraction
    label: fraction of cells in a marker intensity class
    parent: measure:marker_positive_cells
    dimension: dimensionless
    definition: Fraction of cells whose staining intensity for a stated marker (qualifier marker) falls in a stated class (qualifier intensity_class, such as negative, medium or high) set by thresholds.
    scope: Cells binned by how strongly they stain for one marker; not the plain positive fraction (marker-positive cells) and not cells counted by visible sarcomeres (sarcomere containing cells).
    qualifiers:
      intensity_class: {dimension: text}
- set_scope:
    id: measure:sarcomere_containing_cells
    scope: Cells counted by visible sarcomeres; not cells binned by the staining intensity of a marker (fraction of cells in a marker intensity class).
- add_term:
    field: measure
    id: measure:mononucleated_cell_fraction
    label: mononucleated cell fraction
    dimension: dimensionless
    definition: Fraction of cells with one nucleus.
    scope: Share of cells with one nucleus; not binucleated or multinucleated cell fractions and not a marker-positive fraction.
- add_term:
    field: measure
    id: measure:multinucleated_cell_fraction
    label: multinucleated cell fraction
    dimension: dimensionless
    definition: Fraction of cells with more than two nuclei.
    scope: Share of cells with more than two nuclei; not binucleated (two nuclei) or mononucleated cell fractions.
- set_scope:
    id: measure:binucleated_cell_fraction
    scope: Share of cells with two nuclei; not mononucleated or multinucleated (more than two nuclei) cell fractions, not the fraction of cells positive for a marker and not the distance between nuclei.
- add_term:
    field: measure
    id: measure:disarrayed_sarcomere_cell_fraction
    label: fraction of cells with disarrayed sarcomeres
    dimension: dimensionless
    definition: Fraction of cells whose sarcomeres are classed as disarrayed, by eye or by an image classifier.
    scope: A counted share of cells with sarcomeric disarray; not a graded description of sarcomere organisation, not an order parameter and not the fraction of cells that show sarcomeres.
- add_term:
    field: measure
    id: measure:reactive_oxygen_species_level
    label: reactive oxygen species level
    dimension: dimensionless
    definition: Level of reactive oxygen species in cells, read as the fluorescence of a ROS-sensitive probe (qualifier probe) in a stated compartment (qualifier compartment).
    scope: ROS from a ROS-sensitive dye; not mitochondrial mass from a mitochondrial dye and not mitochondrial membrane potential.
    qualifiers:
      probe: {dimension: text}
      compartment: {dimension: text}
- add_term:
    field: measure
    id: measure:abnormal_calcium_event_frequency
    label: frequency of abnormal calcium events
    dimension: dimensionless
    definition: Number of calcium transient events in a recording classed as abnormal by a stated criterion (qualifier criterion), such as delayed afterdepolarisation-like events.
    scope: A count of abnormal events within recordings; not the share of hearts or tissues with an arrhythmia (arrhythmia incidence) and not a present-or-absent judgement of irregular transients (calcium transient irregularity).
    qualifiers:
      criterion: {dimension: text}
- add_term:
    field: measure
    id: measure:ap_repolarisation_phase_ratio
    label: ratio of late to early repolarisation duration
    parent: measure:action_potential
    dimension: dimensionless
    definition: The duration of a late repolarisation interval divided by that of an early one, such as (APD80−APD70)/(APD40−APD30), a shape index used to class cardiomyocyte subtypes.
    scope: A ratio of two differences between action potential durations; not one duration divided by another (ratio of action potential durations), not a duration, an amplitude, a peak potential, a rise time, a velocity, a frequency or a repolarisation time.
# ---------------------------------------------------------------- standing keys
- standing_key:
    measure: measure:marker_intensity_class_fraction
    value:
      must_match: [platform@1, preparation, measure.marker, measure.intensity_class, measure.expressed_as, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
      must_match: [contrast, measure.marker, measure.intensity_class]
      may_vary: [cell_line, day_of_measurement]
- standing_key:
    measure: measure:mononucleated_cell_fraction
    value:
      must_match: [platform@1, preparation, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
      must_match: [contrast]
      may_vary: [cell_line, day_of_measurement]
- standing_key:
    measure: measure:multinucleated_cell_fraction
    value:
      must_match: [platform@1, preparation, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
      must_match: [contrast]
      may_vary: [cell_line, day_of_measurement]
- standing_key:
    measure: measure:disarrayed_sarcomere_cell_fraction
    value:
      must_match: [platform@1, preparation, measure.expressed_as, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
      must_match: [contrast]
      may_vary: [cell_line, day_of_measurement]
- standing_key:
    measure: measure:reactive_oxygen_species_level
    value:
      must_match: [platform@1, preparation, measure.probe, measure.compartment, measure.expressed_as, measure.normalised_to, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
      must_match: [contrast, measure.compartment]
      may_vary: [cell_line, day_of_measurement]
- standing_key:
    measure: measure:abnormal_calcium_event_frequency
    value:
      must_match: [platform@1, preparation, pacing, temperature, measure.criterion, measure.expressed_as, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
      must_match: [contrast, pacing]
      may_vary: [cell_line, day_of_measurement]
- standing_key:
    measure: measure:ap_repolarisation_phase_ratio
    value:
      must_match: [platform@1, preparation, pacing, temperature, method, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
      must_match: [contrast]
      may_vary: [cell_line, day_of_measurement]
