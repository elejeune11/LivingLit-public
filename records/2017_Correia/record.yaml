  F1C_YLacGlc_GLCM_d10_vs_GLCM_d0:
    unit: F1C
    measure: ratio of Lac production to Glc consumption (YLac/Glc)
    finding: 'd10 vs d0: ns'
    anchor: &id006
      quote: (C) Ratio of Lac production to Glc consumption (YLac/Glc) in GLCM through culture time
      where: Fig. 1 legend
    method: metabolite concentrations in supernatants (YSI 7100MBS)
    compares:
    - GLCM_d10
    - GLCM_d0
    n: &id007
      printed: 12–24 wells, n ≥ 3 separate experiments
      counts: wells
    stats:
      test: unpaired Student’s t test or one-way analysis of variance (ANOVA) (Methods)
      p: ns
