  TXT2_force.f_mb:
    item: TXT2_force
    group: mb
    formula: f = F/w
    anchor:
      quote: Mean uniaxial traction force normalized to cell/2DMB width
      where: Results, p. 5
    library:
      formula: ratio_def
      vars:
        r: f
        a: F
        b: w
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: total traction force per 2DMB from the modelled look-up table (Supplemental Fig. 3); not printed per 2DMB
      w:
        printed: '45'
        unit: µm
        kind: constant
        anchor:
          quote: a dimension of 308 × 45 µm
          where: Methods, Micropatterned substrate fabrication
    output: TXT2_force.values.f_mb
    aggregation: not stated
    alternatives:
    - label: width 44 µm (Supplemental Notes model geometry)
      formula: f = F/w
      note: '"308 μm length, 44 μm width, and 10 μm thickness" (Supplemental Notes)'
    note: that the pattern width (not a measured width) is used is not stated; F comes from a finite-element model with no library entry
  TXT2_force.f_single:
    item: TXT2_force
    group: single
    formula: f = F/w
    anchor:
      quote: Mean uniaxial traction force normalized to cell/2DMB width
      where: Results, p. 5
    library:
      formula: ratio_def
      vars:
        r: f
        a: F
        b: w
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: traction force per cell by traction force microscopy (method not described in this paper)
      w:
        not_stated: true
        kind: not stated
        note: single-cell micropattern width; not stated
    output: TXT2_force.values.f_single
    aggregation: not stated
  F6a_ctni.ctni_120:
    item: F6a_ctni
    group: t120
    formula: p = c/(c + s)
    anchor:
      quote: The relative proportion at each time point was calculated as cTni/(cTnI+ssTnI)
      where: Methods, Mass spectrometry
    library:
      formula: part_of_whole
      vars:
        f: p
        a: c
        b: s
    inputs:
      c:
        not_stated: true
        kind: per sample
        note: cTnI abundance (three most abundant unique peptides) per sample; not released
      s:
        not_stated: true
        kind: per sample
        note: ssTnI abundance per sample; not released
    output: F6a_ctni.values.ctni_120
    output_unit: '%'
    aggregation: not stated
  F6b_oxt3_v_std.prop:
    item: F6b_oxt3_v_std
