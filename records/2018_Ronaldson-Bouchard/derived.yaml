        kind: per sample
        note: relative expression; quantification model not stated
      x0:
        not_stated: true
        kind: constant
        note: late-stage tissues at the start of stimulation
    alternatives:
    - label: 2^-ddCt (Livak), not stated
    note: the heat map shows log2 of the fold change (record finding)
