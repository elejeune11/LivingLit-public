  # ---------------------------------------------------------------- dextran permeability, Pe = Ct V / (C0 A Δt)
  ED4b_3kDa.permeability:
    item: ED4b_3kDa
    measure: 3 kDa FITC-dextran permeability
    formula: Pe = Ct*V/(C0*A*dt)
    anchor:
      quote: permeability was calculated using the equation
      where: Methods, Endothelial barriers
    library: {formula: apparent_permeability, vars: {P: Pe, Ct: Ct, V: V, C0: C0, A: A, t: dt}}
    inputs: &pe_inputs
      Ct: {not_stated: true, kind: per sample, note: 'concentration in the tissue chamber at the end of the assay; not released'}
      V: {not_stated: true, kind: constant, note: 'volume of the medium in the vascular chamber; not printed for this assay'}
      C0: {not_stated: true, kind: constant, note: 'initial reservoir concentration; not printed for this assay'}
      A: {not_stated: true, kind: constant, note: 'area of the membrane with cells; not printed'}
      dt: {not_stated: true, kind: constant, note: 'assay time: samples taken at 0, 1, 2, 6, 12, 24 and 48 h; which interval enters Pe is not stated'}
  ED4b_70kDa.permeability:
    item: ED4b_70kDa
    measure: 70 kDa FITC-dextran permeability
    formula: Pe = Ct*V/(C0*A*dt)
    anchor:
      quote: permeability was calculated using the equation
      where: Methods, Endothelial barriers
    library: {formula: apparent_permeability, vars: {P: Pe, Ct: Ct, V: V, C0: C0, A: A, t: dt}}
    inputs: *pe_inputs
  ED4d_3kDa.permeability:
    item: ED4d_3kDa
    measure: 3 kDa FITC-dextran permeability
    formula: Pe = Ct*V/(C0*A*dt)
    anchor:
      quote: permeability was calculated using the equation
      where: Methods, Endothelial barriers
    library: {formula: apparent_permeability, vars: {P: Pe, Ct: Ct, V: V, C0: C0, A: A, t: dt}}
    inputs: *pe_inputs
  ED4d_70kDa.permeability:
    item: ED4d_70kDa
    measure: 70 kDa FITC-dextran permeability
    formula: Pe = Ct*V/(C0*A*dt)
    anchor:
      quote: permeability was calculated using the equation
      where: Methods, Endothelial barriers
    library: {formula: apparent_permeability, vars: {P: Pe, Ct: Ct, V: V, C0: C0, A: A, t: dt}}
    inputs: *pe_inputs
  # ---------------------------------------------------------------- specificity = TN / (FP + TN) × 100
  # The ×100 is the % unit of the output (04-formulas, Percent); written as a fraction so it maps to part_of_whole.
  TXT2_specificity.specificity_mo4:
    item: TXT2_specificity
    group: mo4_dox
    measure: specificity of miRNA biomarker changes against clinical data
    formula: Sp = TN/(FP + TN)
    anchor:
      quote: From these tallies, the specificity was calculated as described below.
      where: Methods, Sensitivity and specificity calculations
    library: {formula: part_of_whole, vars: {f: Sp, a: TN, b: FP}}
    inputs:
      TN: {not_stated: true, kind: constant, note: 'true-negative tally; not printed'}
      FP: {not_stated: true, kind: constant, note: 'false-positive tally; not printed'}
    output: TXT2_specificity.values.mo4_text
  TXT2_specificity.specificity_mix4:
    item: TXT2_specificity
    group: mix4_dox
    measure: specificity of miRNA biomarker changes against clinical data
    formula: Sp = TN/(FP + TN)
    anchor:
      quote: From these tallies, the specificity was calculated as described below.
      where: Methods, Sensitivity and specificity calculations
    library: {formula: part_of_whole, vars: {f: Sp, a: TN, b: FP}}
    inputs:
      TN: {not_stated: true, kind: constant}
      FP: {not_stated: true, kind: constant}
    output: TXT2_specificity.values.mix4_text
  # ---------------------------------------------------------------- "k out of 17 miRNAs (p %)"
  S10_consistent_mo4.share:
    item: S10_consistent_mo4
    measure: paediatric miRNAs with activity consistent with the clinical study
    formula: p = k/n
    anchor:
      quote: consistent with clinical results for 10 out of 17 miRNAs17 (58.8%)
      where: Results, Identification of miRNA biomarkers
    library: {formula: ratio_def, vars: {r: p, a: k, b: n}}
    inputs:
      k: {value: S10_consistent_mo4.values.frac_text, kind: constant}
      n:
        printed: '17'
        unit: miRNAs
        anchor: {quote: 'identifying 17 miRNAs differentially expressed in paediatric cancer patients', where: 'Results, Identification of miRNA biomarkers'}
        kind: constant
    output: S10_consistent_mo4.values.pct_text
  S10_consistent_mix4.share:
    item: S10_consistent_mix4
    measure: paediatric miRNAs with activity consistent with the clinical study
    formula: p = k/n
    anchor:
      quote: out of 17 miRNAs (29.4%) for the Mixed model
      where: Results, Identification of miRNA biomarkers
    library: {formula: ratio_def, vars: {r: p, a: k, b: n}}
    inputs:
      k: {value: S10_consistent_mix4.values.frac_text, kind: constant}
      n:
        printed: '17'
        unit: miRNAs
        anchor: {quote: 'identifying 17 miRNAs differentially expressed in paediatric cancer patients', where: 'Results, Identification of miRNA biomarkers'}
        kind: constant
    output: S10_consistent_mix4.values.pct_text
  S10_mix4_agree_oppose.share_agree:
    item: S10_mix4_agree_oppose
    measure: paediatric miRNAs with activity consistent with the clinical study
    formula: p = a/(a + b)
    anchor:
      quote: However, only 5 were in agreement with published results (29.4%), while 12 showed differential activities opposite to clinical observation
      where: Results
    library: {formula: part_of_whole, vars: {f: p, a: a, b: b}}
    inputs:
      a: {value: S10_mix4_agree_oppose.values.agree_text, kind: constant}
      b: {value: S10_mix4_agree_oppose.values.opposite_text, kind: constant}
    output: S10_mix4_agree_oppose.values.agree_pct_text
    note: the whole is taken as agree + opposite (all 17 differentially active), as the record's finding states
  S12_consistent_mo4p.share:
    item: S12_consistent_mo4p
    measure: paediatric miRNAs with activity consistent with the clinical study
    formula: p = k/n
    anchor:
      quote: consistent with clinical results for 9 out of the 17 (52.9%)
      where: Results, Identification of miRNA biomarkers
    library: {formula: ratio_def, vars: {r: p, a: k, b: n}}
    inputs:
