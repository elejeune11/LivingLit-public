# ---------------------------------------------------------------- re-map v3: mechanical_load
- add_synonym:
    id: mechanical_load:isometric
    text: constrained loading
    anchor: Heatmap showing log scale geometrical mean of gene expression relative to the 1× constrained loading condition.
- add_qualifier:
    id: mechanical_load:isometric
    name: stiffness
    dimension: text
- add_qualifier:
    id: mechanical_load:isometric
    name: strip thickness
    dimension: length
- add_qualifier:
    id: mechanical_load:isometric
    name: days
    dimension: text
- add_qualifier:
    id: mechanical_load:auxotonic
    name: stiffness
    dimension: text
- add_qualifier:
    id: mechanical_load:auxotonic
    name: strip thickness
    dimension: length
- add_qualifier:
    id: mechanical_load:auxotonic
    name: days
    dimension: text
- add_term:
    field: mechanical_load
    id: mechanical_load:strip_load
    label: elastic strip load, regime not stated
    definition: The load of a flexible polymer strip of stated stiffness, where the source does not say whether the strip was held fixed or free to bend (as in characterising the strip itself).
    scope: A strip's load with no culture regime stated; not a strip held fixed so the tissue cannot shorten (isometric load), not a strip or pillar the tissue bends with each beat (auxotonic), and not externally applied cyclic stretch.
    qualifiers:
      stiffness: {dimension: text}
      strip thickness: {dimension: length}
- add_term:
    field: mechanical_load
    id: mechanical_load:cyclic_stretch
    label: cyclic stretch
    definition: Repeated stretching of cultured cells by an external device, such as a deformable membrane, with stated amplitude, frequency, regimen and duration (qualifiers).
    scope: Stretch imposed by a device; not a load the tissue works against as it contracts (auxotonic or isometric load) and not a strip load whose regime is not stated.
    synonyms:
    - text: cyclic stretch
      anchor: Monolayers were subjected to cyclic stretch regimens using the Flexcell system FX-4000.
    qualifiers:
      amplitude: {dimension: dimensionless}
      frequency: {dimension: text}
      regimen: {dimension: text}
      duration: {dimension: time}
- set_scope:
    id: mechanical_load:isometric
    scope: Shortening prevented (rigid or stiffened posts, an immobilised strip, fixed length); not contraction against an elastic, spring-like load (auxotonic), not externally applied cyclic stretch, and not a strip load whose regime is not stated.
