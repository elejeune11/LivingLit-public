  ST1_bmi.bmi_text:
    item: ST1_bmi
    group: donors
    measure: donor body mass index
    formula: BMI = W/H**2
    anchor:
      quote: an average body mass index of 27.76±6.09 kg/m2
      where: Results, Perfusion-Decellularization
    library:
      formula: ratio_to_square
      vars:
        r: BMI
        a: W
        h: H
    inputs:
      W:
        value: ST1_weight.values.weight_text
        part: mean
        kind: per sample
      H:
        value: ST1_height.values.height_text
        part: mean
        kind: per sample
    output: ST1_bmi.values.bmi_text
    aggregation: mean of per-sample
    alternatives:
    - label: of means
      formula: BMI = W/H**2
      note: mean weight over squared mean height, 27.9 kg/m2; not equal to a mean of per-donor BMIs
    note: BMI is per donor (Online Table I lists it per heart); the mean is a mean of per-donor values. The paper does not
      say whether it computed BMI or took it from donor records
