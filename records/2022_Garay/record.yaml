        unit: loci
        kind: count
        over:
        - adult
        - fetal
        - embryo
        - invitro
        spread: none
    stats:
      test: not stated
      p: not stated
    anchor:
      quote: ChIP-seq hierarchical clustering for 25,149 loci with differential H3K27ac deposition
