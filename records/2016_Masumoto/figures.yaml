    kind: raster
    groups:
      twod: {item: S9_csd_ce_vs_twod, group: twod, unit_of_value: Deg}
      twod_vs_cm: {item: S9_csd_cm_vs_twod, group: twod, unit_of_value: Deg}
      twod_vs_cem: {item: S9_csd_cem_vs_twod, group: twod, unit_of_value: Deg}
      ce: {item: S9_csd_ce_vs_twod, group: ce, unit_of_value: Deg}
      ce_vs_cm: {item: S9_csd_cm_vs_ce, group: ce, unit_of_value: Deg}
      ce_vs_cem: {item: S9_csd_cem_vs_ce, group: ce, unit_of_value: Deg}
