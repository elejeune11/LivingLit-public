    output: F1C_dt_ratio.values.longer
    output_unit: '%'
    aggregation: not stated
    note: 'A test between two measures of the same tissues, not a contrast: the paired t-test (Figure 1C and S1A, *p<0.05) compares DT80%,CaT with RT80%,force in the same EHTs, and the printed relation
      is their relative difference. Inputs are the read bar means; the sentence prints the means 0.329 and 0.165 s. Whether the % is of the two means or the mean of per-EHT ratios is not stated; no per-EHT
      points are readable.'
  F1D_ttp_ratio.shorter:
    item: F1D_ttp_ratio
    formula: s = (x0 - x)/x0
    library:
      formula: relative_decrease
      vars:
        s: s
        x: x
        x0: x0
    anchor:
      quote: In GCaMP6f EHTs, TTP80%,CaT was 20% shorter than TTP80%,force (0.116 ± 0.004 s versus 0.145 ± 0.005 s)
      where: Results, Specificity of Fluorescence Signal
    inputs:
      x:
        reading: s1b_ttp_cat/gcamp6f
        kind: per sample
