figures:
  F5C_mds:
    file: main.pdf
    page: 11
    crop:
    - 375.0
    - 190.0
    - 475.0
    - 270.0
    script: figures/f5c_mds.py
    unit: F5
    kind: raster
    groups:
      Multilineage:
        item: F5C_mds
        group: ml_prog
        unit_of_value: leading logFC dim 2
      Cardiac:
        item: F5C_mds
        group: cardiac_prog
        unit_of_value: leading logFC dim 2
      Gut:
        item: F5C_mds
        group: gut_prog
        unit_of_value: leading logFC dim 2
    note: 'Fig. 5C MDS plot; each point is one sample: value = leading logFC dim 2 (y axis), x = leading logFC dim 1 (x axis,
      stored without its interval). Raster image at its native 300 dpi; the x tick marks are unevenly spaced in the image
      itself, and the calibration misfit enters the intervals. The two gut markers overlap into one blob (not standing alone),
      so gut gives only the blob centre as the group mean (x = mean dim 1), no points.'
no_points:
  S1E: 'violin plots with individual organoid markers in a raster image (mmc1.pdf p. 3, panel E, right: cardiac:full volume
    ratio, black markers on a black violin outline). At day 10 the markers overlap each other in two clusters, and at both
    days the top and bottom markers merge with the outline, so no marker stands alone and raster points are not readable;
    the violins show median and quartile lines only, no mean or error bar. No table, text or released data gives the values.'
  F4C: 'first look (small model): B shows calcium traces; C shows connected means with error bars (main.pdf p. 9)'
  F4EG: 'F: violin plots of per-cell values in a raster image (main.pdf p. 9); hundreds of cell markers overlap into merged
    clusters, so no marker stands alone and raster points are not readable; no mean or error bar drawn. E: images; G: stacked
    percentage bars. No table or released data gives the values.'
  S1IJ: 'first look (small model): Panels I and J show mean lines with markers and error bars, not per-sample points. (mmc1.pdf
    p. 3)'
