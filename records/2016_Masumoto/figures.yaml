    file: srep29933-s1.pdf
    page: 8
    crop: [428, 80, 578, 452]
    script: figures/s1_protocol_populations.py
    unit: S1
    kind: raster
    groups:
      cmmc_CM: {item: S1_ctnt, group: cmmc_p, unit_of_value: '%'}
      cmmc_MC: {item: S1_pdgfrb, group: cmmc_p, unit_of_value: '%'}
      mc_CM: {item: S1_ctnt, group: mc_p, unit_of_value: '%'}
    note: >-
      Supplementary Fig. 1 right, three stacked bar charts (CM+EC, CM+MC, MC protocol), each with its own % axis; label
      = protocol _ cell type whose proportion the bar shows (CM cTnT+, MC PDGFRb+). Bars only (mean and upper end of the
      error bar, SD per Methods); no points drawn, so the legend's n = 5 (CM+MC) and 42 (MC) cannot be counted. Not
      read: CM+MC EC (no bar drawn), MC-protocol EC (only an error cap on the axis line, no fill), and the bars whose
      values are printed in the text (CM+EC all three, MC-protocol MC). The MC-protocol CM bar is one or two fill rows
      tall in the ~200 dpi source image, so its mean rests on a sub-pixel edge.
