  F4E_force.slack:
    item: F4E_force
    group: slack
    formula: r = a/b
    anchor: &id003
      quote: Increasing the preload resulted in an increase in contractile force from 43% ± 5% to 100% (maximum force
      where: Results, Physiological Force Modulation
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: per sample
        note: force at slack length; absolute force not printed
      b:
        not_stated: true
        kind: per sample
        note: maximum force of the same EHT; not printed
    output: F4E_force.values.slack
    aggregation: not stated
    note: force as % of maximum force; the Fig. 4E curve is already normalised (readings in % of maximum)
  F4E_force.length_at_max:
    item: F4E_force
    group: max
    formula: r = a/b
    anchor:
      quote: Maximum force was reached at 107% of slack length
      where: Results, Physiological Force Modulation
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: per sample
        note: length at maximum force; not printed
      b:
        not_stated: true
        kind: per sample
        note: slack length; not printed
    output: F4E_force.values.length_at_max
  S5F_fs.eht:
    item: S5F_fs
    group: eht
    formula: d = (x - x0)/x0
    anchor: *id003
    library: *id001
    inputs:
      x:
        value: F4E_force.values.max
        kind: per sample
      x0:
        value: F4E_force.values.slack
        kind: per sample
    output: S5F_fs.values.eht
    aggregation: not stated
    alternatives:
    - label: difference of percentages of maximum force (percentage points)
      formula: d = x - x0
      note: 100% - 43% = 57 percentage points; not a library formula
    note: Fig. S5F prints the Frank-Starling force increase as +57%; the text gives 43% to 100% of maximum force (Fig. 4E); the formula behind
      +57% is not stated
