proposals:
  - formula: circular_cross_section_area
    kind: model
    statement: The cross-sectional area of a cylindrical specimen computed from one measured diameter, A = pi*d^2/4,
      treating the section as a circle.
    equations:
      - A = pi*d**2/4
    variables: {A: area, d: length}
    assumes:
      - circular cross-section
      - uniform diameter along the length
    does_not_apply: flattened, elliptical or rectangular sections (strips, sheets), or a diameter that varies along the specimen
    tests:
      - given: {d: 2.0}
        expect: {A: 3.14159265}
      - given: {d: 2.0}
        does_not_apply: 'a square section of side 2 has area 4, not pi'
    cites:
      text: 'Gere JM, Goodno BJ. Mechanics of Materials (Cengage), Appendix: Properties of plane areas, circle (A = pi d^2/4)'
      anchor:
        quote: assuming circular cross-sectional geometry
        where: Methods, Measurement of Contractile Function
  - formula: reciprocal_def
    kind: derived
    statement: The reciprocal of a quantity is one divided by it (a ratio with numerator 1).
    equations:
      - r = 1/b
    variables: {r: 1/D, b: D, a: dimensionless}
    assumes:
      - a = 1
    uses:
      - formula: ratio_def
        subs: {r: r, a: a, b: b}
    does_not_apply: a ratio with a numerator other than 1, or a reciprocal of a period read as a frequency in other units
    tests:
      - given: {b: 4.0}
        expect: {r: 0.25}
      - given: {b: 4.0}
        does_not_apply: 'negative reciprocal or 1 - b is not the reciprocal'
  - formula: fraction_bounds
    kind: bound
    statement: A fraction of a whole (a part divided by the whole it belongs to) lies between 0 and 1 (0 % and 100 %).
    equations:
      - f >= 0
      - f <= 1
    variables: {f: dimensionless}
    does_not_apply: ratios of distinct quantities (fold changes, normalised values, % of baseline above 100 %)
    tests:
      - given: {f: 0.4}
      - given: {f: 1.2}
        does_not_apply: 'a fold change of 1.2 is not a fraction of a whole'
    cites:
      text: 'NIST Special Publication 811 (2008), Guide for the Use of the International System of Units (SI), section 7.10:
        quantities of dimension one, such as mass fraction and volume fraction'
      url: https://www.nist.gov/pml/special-publication-811
