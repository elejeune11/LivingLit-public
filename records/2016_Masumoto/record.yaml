evidence:
  F1a_proportions:
    unit: F1a
    measure: proportion of CM, EC and MC
    finding: Proportions of CM, EC and MC used to generate each ECT type, shown as bars.
    groups:
    - ce
    - cm
    - cem
    n:
      printed: n = 8 (CM+EC), n = 7 (CM+MC), and n = 12 (CM+EC+MC)
      counts: ECTs
      per_group: &id002
        ce: '8'
        cm: '7'
        cem: '12'
    anchor:
      quote: the proportions of each cell type used to generate ECTs (lower)
      where: Fig. 1 legend (a)
  F1a_cmratio_cem_vs_ce:
    unit: F1a
    measure: CM ratio
    finding: CM ratio lower in CM+EC+MC (48.3%) than in CM+EC (63.1%).
    compares:
    - cem
    - ce
    n:
      printed: n = 8 (CM+EC), n = 7 (CM+MC), and n = 12 (CM+EC+MC)
      counts: ECTs
      per_group: *id002
    values:
      cmratio_ce:
        printed: 63.1 ± 7.0
        unit: '%'
        kind: mean
        group: ce
        spread: SD
        spread_source: methods
      cmratio_cem:
        printed: 48.3 ± 6.8
        unit: '%'
        kind: mean
        group: cem
        spread: SD
        spread_source: methods
    stats:
      test: one-way or two-way repeated analysis of variance (ANOVA) followed by Tukey's test as post hoc (Methods)
      p: P < 0.001
    anchor: &id003
      quote: 'consistent with a higher CM ratio in CM+EC (63.1 ± 7.0%) compared to other 2 types (CM+EC+MC: 48.3 ± 6.8%, P
        < 0.001; CM+MC: 43.6 ± 4.7%, P < 0.0001)'
      where: Results p. 3
    note: The sentence cites Supplementary Fig. 5a for the active force; the CM ratio is shown in Fig. 1a (lower). n taken
      from the Fig. 1a legend's group sizes.
  F1a_cmratio_cm_vs_ce:
    unit: F1a
    measure: CM ratio
    finding: CM ratio lower in CM+MC (43.6%) than in CM+EC (63.1%).
    compares:
