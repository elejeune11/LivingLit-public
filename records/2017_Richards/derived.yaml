      vars:
        r: e
        ddct: dct
    inputs:
      dct:
        not_stated: true
        kind: per sample
        note: Ct of the target minus the 'geometric mean of GAPDH and ACTB'; Ct values not printed
    alternatives:
    - label: reference = geometric mean of the two reference Ct values
