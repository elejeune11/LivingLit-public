  F7E_stiff_K.stiffness:
    item: F7E_stiff_K
    measure: tissue stiffness
    formula: E = s/A
    anchor:
      quote: Tissue stiffness obtained by determining the slope between 0% and 40% strain and dividing by cross-sectional
        area for each tissue
      where: Fig. 7 legend
    library:
      formula: modulus_from_force_strain_slope
      vars:
        E: E
        s: s
        A: A
    inputs:
      s:
        not_stated: true
        kind: per sample
        note: slope of passive force against strain, 0-40 % strain
      A:
        value: F2_csa.values.all_mean
        kind: per sample
        note: '"the same cross-sectional area as for the in situ measurements"; per tissue, pooled mean only'
    aggregation: mean of per-sample
    note: printed 0.6-0.9 kPa is a range over group means, not one output
  S7_aMHC.normalized:
    item: S7_aMHC
