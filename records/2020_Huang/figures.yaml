      SCN1B TDI:
        item: F3A_CM_SCN1B
        group: tdi
        unit_of_value: log2(FC)
    note: 'Supplementary Fig. S7: per-set log2 fold change (TDI vs untreated) for 12 sets of hiPSC-CMs plus Avg.; cell colours
      inverted against the colour key (ticks -6, 0, 6). Points are per-set ratios to the untreated counterpart, so the ctrl
      group has no points of its own. Crossed cells (no data) give no point. Only the six starred genes are read.'
