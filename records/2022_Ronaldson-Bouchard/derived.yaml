record: 2022_Ronaldson-Bouchard
formula_library_version: 19
agent:
  model: llm
  instructions: formulas_v3
derived:
  # ---------------------------------------------------------------- TEER = measured resistance × effective area
  # Skin: the methods name the product. Written through ratio_def (R = TEER/A), which is the same equation.
  F4g_teer.unit_area_resistance:
    item: F4g_teer
    measure: skin unit area resistance (TEER)
    formula: TEER = R*A
    anchor:
      quote: calculated the tissue resistance by multiplying the measured resistance (Ohm) with the effective tissue area (cm2)
      where: Methods, Skin function assays
    library: {formula: ratio_def, vars: {r: R, a: TEER, b: A}}
    inputs:
      R: {not_stated: true, kind: per sample, note: 'measured resistance (Ohm), mean of 2–3 technical replicates per tissue; not released'}
      A: {not_stated: true, kind: constant, note: 'effective tissue area (cm2) of the EndOhm chamber; value not printed'}
    note: no single printed TEER value; the released per-tissue values (data F4g_teer) are the outputs, not inputs
  ED3i_teer.unit_area_resistance:
    item: ED3i_teer
    measure: skin unit area resistance (TEER)
    formula: TEER = R*A
    anchor:
      quote: calculated the tissue resistance by multiplying the measured resistance (Ohm) with the effective tissue area (cm2)
      where: Methods, Skin function assays
    library: {formula: ratio_def, vars: {r: R, a: TEER, b: A}}
    inputs:
      R: {not_stated: true, kind: per sample, note: 'measured resistance (Ohm); not released'}
      A: {not_stated: true, kind: constant, note: 'effective tissue area (cm2); value not printed'}
  # Endothelial barriers: "from the measured resistance and the effective barrier area" names the inputs, not the
  # operation; the product is the labelled alternative (as for skin, and as the Ohms × cm2 axis unit implies).
  F3c_teer.unit_area_resistance:
    item: F3c_teer
    measure: vascular barrier TEER (unit area resistance)
    formula: not stated
    anchor:
      quote: calculated the barrier resistance from the measured resistance (Ohm) and the effective barrier area (cm2)
      where: Methods, Endothelial barriers
    library: {formula: ratio_def, vars: {r: R, a: TEER, b: A}}
    inputs:
      R: {not_stated: true, kind: per sample, note: 'measured resistance (Ohm), 2–3 technical replicates per barrier'}
      A: {not_stated: true, kind: constant, note: 'effective barrier area (cm2); value not printed'}
    alternatives:
    - {label: 'product, as stated for skin', formula: TEER = R*A}
    - {label: blank-subtracted product (a common TEER practice; not stated), formula: TEER = (R - R0)*A}
  F3d_teer.unit_area_resistance:
    item: F3d_teer
    measure: vascular barrier TEER (unit area resistance)
    formula: not stated
    anchor:
      quote: calculated the barrier resistance from the measured resistance (Ohm) and the effective barrier area (cm2)
      where: Methods, Endothelial barriers
    library: {formula: ratio_def, vars: {r: R, a: TEER, b: A}}
    inputs:
      R: {not_stated: true, kind: per sample}
      A: {not_stated: true, kind: constant}
    alternatives:
    - {label: 'product, as stated for skin', formula: TEER = R*A}
    - {label: blank-subtracted product (not stated), formula: TEER = (R - R0)*A}
  F4c_teer.unit_area_resistance:
    item: F4c_teer
    measure: vascular barrier TEER (unit area resistance)
    formula: not stated
    anchor:
      quote: calculated the barrier resistance from the measured resistance (Ohm) and the effective barrier area (cm2)
