    stated_direction:
      direction: up
      anchor:
        quote: as well as significantly more mitochondrial content (Figure S7C)
        where: Results, MM Improves EHT Culture
    suspected_error:
      what: the legend calls the result a 'significant tendency'
      why: a tendency and a significant difference are different statements; the Results call it significantly more mitochondrial content
  S7E_force:
    unit: S7E
    measure: average contractile force over the last week of culture
    finding: force was higher in MM EHTs over the last week of culture
    anchor:
