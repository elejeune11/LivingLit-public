  TXT2_transcripts.total:
    item: TXT2_transcripts
    formula: t = d + u
    anchor:
      quote: We identified 3,856 transcripts and 855 proteins that were differentially regulated
      where: Results
    library:
      formula: sum_of_parts
      vars:
        t: t
        a: d
        b: u
    inputs:
      d:
        value: S5E_counts.values.down
        kind: constant
      u:
        value: S5E_counts.values.up
        kind: constant
    output: TXT2_transcripts.values.transcripts
    note: differentially regulated = down + up in the Fig. S5E volcano plot
  TXT2_proteins.total:
    item: TXT2_proteins
    formula: t = d + u
    anchor:
      quote: We identified 3,856 transcripts and 855 proteins that were differentially regulated
