units:

  F1:
    where: "Figure 1"
    title: "ECT formation and chronic optical pacing (C-OP) protocol"
    context:
      day_of_measurement: "not stated"
      pacing: "none"
      preparation: {value: "ECT culture"}
      measurement_medium: "not applicable"
    groups:
      ctrl:
        label: "D14 control"
        context:
          composition: {value: "CM/EC/MC 60%/13%/12%"}
          maturation_strategy: "none"
          transgene: "none"
      cop:
        label: "D14 C-OP"
        context:
          composition: {value: "CM/EC/MC 56%/11%/14%"}
          maturation_strategy:
            value: "chronic optical pacing"
            qualifiers:
              from: "D7 to D14"
              wavelength: "470 nm"
              pulse_width: "5 ms"
              rate: "0.5 Hz below the maximum capture rate"
          transgene:
            value: "AAV1/2-CAG-oChIEF-tdTomato"
            qualifiers: {MOI: "500"}

  F2:
    where: "Figure 2a–c"
    title: "Representative force tracings at increasing electrical pacing rates display decreasing active force and increasing beat-to-beat hysteresis"
