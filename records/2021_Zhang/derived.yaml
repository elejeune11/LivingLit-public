assumptions:
  F4C_het.force:
    model: hooke_spring
    assumptions:
      linear spring:
        reported: not stated
      small deflection:
        reported: not stated
  F4C_hom.force:
    model: hooke_spring
    assumptions:
      linear spring:
        reported: not stated
      small deflection:
        reported: not stated
  F1D_het.rel:
    model: ddct_relative_expression
    assumptions:
      amplification efficiency near 100 %:
        reported: not stated
      equal amplification efficiencies of target and reference:
        reported: not stated
  F1D_hom.rel:
    model: ddct_relative_expression
    assumptions:
      amplification efficiency near 100 %:
        reported: not stated
      equal amplification efficiencies of target and reference:
        reported: not stated
proposals:
- formula: ddct_relative_expression
  kind: model
  statement: Relative expression of a target gene by the comparative Ct method is 2 raised to minus the difference of the
    target-minus-reference Ct between a sample and the calibrator.
  equations:
  - r = 2^(-ddct)
  variables:
    r: dimensionless
    ddct: dimensionless
  assumes:
  - amplification efficiency near 100 %
  - equal amplification efficiencies of target and reference
  does_not_apply: amplification efficiencies far from 100 % or unequal between target and reference (use an efficiency-corrected
    ratio such as Pfaffl's)
  tests:
  - given: {ddct: 1.0}
    expect: {r: 0.5}
  - given: {ddct: -2.0}
    expect: {r: 4.0}
  - given: {ddct: 1.0}
    does_not_apply: 'efficiency 90 % per cycle: expression ratio is 1.9^-1, not 2^-1'
  cites:
    text: Livak and Schmittgen, Analysis of relative gene expression data using real-time quantitative PCR and the 2^-ΔΔCT
      method. Methods 25, 402–408 (2001)
    url: https://doi.org/10.1006/meth.2001.1262
- formula: root_mean_square
  kind: definition
  statement: The root mean square of n values is the square root of the mean of their squares.
  equations:
  - S = sqrt(Q/n)
  variables:
    S: D
    Q: D**2
    n: count
  does_not_apply: the mean of the magnitudes (not squared), or a spread about the mean (that is the SD)
  tests:
  - given: {Q: 8.0, n: 2.0}
    expect: {S: 2.0}
  - given: {Q: 25.0, n: 1.0}
    expect: {S: 5.0}
  - given: {Q: 10.0, n: 2.0}
    does_not_apply: 'values 1 and 3 (mean of squares 5): the plain mean 2 differs from the RMS sqrt(5)'
  cites:
    text: Weisstein, Root-Mean-Square, MathWorld (Wolfram Research)
    url: https://mathworld.wolfram.com/Root-Mean-Square.html
