record: 2016_Kerscher
vocabulary_version: 63
agent: {model: llm, instructions: terms_v4}
edits:
# ---- cell_line
- adopt:
    field: cell_line
    id: CVCL_C434
    label: IPS(IMR90)-1
    lookup: "livinglit lookup cellosaurus 'IMR90-1' (exact synonym of CVCL_C434; the paper names it IMR-90 Clone 1, from WiCell)"
    synonyms:
    - {text: IMR90-1, anchor: "For 2D monolayer differentiation of hiPSCs (IMR90-1 hiPSC line)"}
- add_synonym:
    id: CVCL_K054
    text: 19-9-11
    anchor: "initiating consistently on day 6 for the cluster 19-9-11 hiPSC line"
# ---- treatment
- adopt:
    field: treatment
    id: CHEBI:8499
    label: propranolol
    lookup: "livinglit lookup chebi propranolol (exact label; the racemate, as the paper does not name an enantiomer)"
# ---- platform: cell-laden hydrogel formats of this paper
- add_term:
    field: platform
    id: platform:hydrogel_microisland
    label: hydrogel microisland
    parent: platform:engineered_3d
    definition: A thin disc of cell-laden hydrogel crosslinked in a mould and bonded to a glass surface, cultured attached to it.
    scope: Use for surface-bound hydrogel discs; free-floating hydrogel slabs are hydrogel macrotissue and suspended hydrogel spheres hydrogel microsphere, and tissues held between posts, wires, anchors or a frame, or a cast patch whose anchoring is not stated, have their own terms.
    qualifiers: {thickness: {dimension: length}, diameter: {dimension: length}}
    synonyms:
    - {text: microisland, anchor: "microisland tissues were fabricated and immobilized on"}
- add_term:
    field: platform
    id: platform:hydrogel_macrotissue
    label: hydrogel macrotissue
    parent: platform:engineered_3d
    definition: A millimetre- to centimetre-scale slab of cell-laden hydrogel cultured free in suspension.
    scope: Use for large free-floating hydrogel constructs; surface-bound discs are hydrogel microisland, sub-millimetre suspended spheres hydrogel microsphere, and scaffold-free aggregates (organoid aggregate macrotissue) are under cell aggregate.
    qualifiers: {thickness: {dimension: length}, width: {dimension: length}, length: {dimension: length}}
    synonyms:
    - {text: macrotissue, anchor: "tested geometries included macrotissues"}
- add_term:
    field: platform
    id: platform:hydrogel_microsphere
    label: hydrogel microsphere
    parent: platform:engineered_3d
    definition: A sub-millimetre sphere of cell-laden hydrogel cultured in suspension.
    scope: Use for cells encapsulated in a hydrogel sphere; scaffold-free spheroids and aggregates are cell aggregate, surface-bound discs hydrogel microisland and large free-floating slabs hydrogel macrotissue.
    qualifiers: {diameter: {dimension: length}}
    synonyms:
    - {text: microsphere, anchor: "suspension culture of 3D-dhECT microspheres"}
# ---- substrate
- add_term:
    field: substrate
    id: substrate:peg_fibrinogen
    label: PEG-fibrinogen
    parent: substrate:hydrogel
    definition: A photocrosslinked hydrogel of fibrinogen conjugated to poly(ethylene glycol) diacrylate.
    scope: Use for PEG-fibrinogen; plain fibrin gels and PEGylated fibrin clotted with thrombin are under fibrin hydrogel, and not Matrigel, Geltrex, collagen or ECM gels.
- add_term:
    field: substrate
    id: substrate:pegylated_fibrin
    label: PEGylated fibrin hydrogel
    parent: substrate:fibrin_hydrogel
    definition: A fibrin gel made from fibrinogen reacted with a PEG crosslinker and clotted with thrombin.
    scope: Use when the fibrin is PEGylated; plain fibrin stays on fibrin hydrogel, and PEG-diacrylate-fibrinogen photogels are PEG-fibrinogen.
- add_term:
    field: substrate
    id: substrate:basement_membrane_proteins
    label: basement membrane proteins, product not named
    parent: substrate:hydrogel
    definition: A gel or gel component of basement membrane proteins whose product or source is not named.
    scope: Use only when no product is named; Matrigel and Geltrex when named, and not collagen I, fibrin, PEG-fibrinogen or decellularized cardiac ECM gels.
- add_term:
    field: substrate
    id: substrate:pa_rgds
    label: PA-RGDS
    parent: substrate:hydrogel
    definition: A self-assembling peptide amphiphile gel presenting the RGDS adhesion motif.
    scope: Use for peptide amphiphile gels; not protein gels (fibrin, collagen, Matrigel, Geltrex, PEG-fibrinogen) or polysaccharide gels (alginate, agarose).
- add_term:
    field: substrate
    id: substrate:alginate_hydrogel
    label: alginate hydrogel
    parent: substrate:hydrogel
    definition: A hydrogel of alginate, usually crosslinked with divalent cations.
    scope: Use for alginate gels; agarose gels are agarose hydrogel, and not protein or peptide gels (fibrin, collagen, Matrigel, Geltrex, PEG-fibrinogen, PA-RGDS).
- add_term:
    field: substrate
    id: substrate:agarose_hydrogel
    label: agarose hydrogel
    parent: substrate:hydrogel
    definition: A thermally gelled hydrogel of agarose.
    scope: Use for agarose gels; alginate gels are alginate hydrogel, and not protein or peptide gels (fibrin, collagen, Matrigel, Geltrex, PEG-fibrinogen, PA-RGDS).
# ---- pacing, preparation
- add_synonym:
    id: pacing:electrical_pacing
    text: exogenous pacing
    anchor: "between exogenous pacing and cell response"
- add_synonym:
    id: preparation:intact_tissue
    text: whole tissues
    anchor: "was administered to whole tissues, which caused"
# ---- measures
- add_synonym:
    id: measure:contraction_frequency
    text: frequency of spontaneous contraction
    anchor: "the frequency of spontaneous contraction increased by 1.2-fold"
- add_qualifier:
    id: measure:cell_number
    name: proxy
    dimension: text
- add_term:
    field: measure
    id: measure:sarcomeric_feature_ratio
    label: ratio of counts of two sarcomeric features
    definition: The number of one sarcomeric feature (I-bands, H-zones) divided by the number of another (Z-lines, sarcomeres) counted on the same images.
    scope: Use for count ratios between two kinds of sarcomeric feature, named in the qualifier features; bands per sarcomere go to sarcomeric bands per sarcomere, and lengths or widths of bands to their own length measures.
    dimension: dimensionless
    qualifiers: {features: {dimension: text}}
- add_term:
    field: measure
    id: measure:dissociation_into_single_cells
    label: dissociation into single cells
    definition: Whether a tissue construct could be dissociated into individual cells.
    scope: Use for the outcome of dissociating a construct; counts or viability of the dissociated cells go to cell number or cell viability.
    dimension: categorical
- add_term:
    field: measure
    id: measure:longest_culture_duration
    label: longest culture duration
    definition: The longest time a construct or its cells were kept in culture.
    scope: Use for how long cultures were maintained; days of differentiation at which other measures were made go to day_of_measurement, and onset times to their own measures.
    dimension: time
- standing_key:
    measure: measure:sarcomeric_feature_ratio
    value: {must_match: [platform@1, preparation, measure.features], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.features], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:dissociation_into_single_cells
    value: {must_match: [platform@1], may_vary: [cell_line, substrate]}
    direction: {must_match: [contrast], may_vary: [cell_line, substrate]}
- standing_key:
    measure: measure:longest_culture_duration
    value: {must_match: [platform@1, species], may_vary: [cell_line, substrate]}
    direction: {must_match: [contrast], may_vary: [cell_line, substrate]}
