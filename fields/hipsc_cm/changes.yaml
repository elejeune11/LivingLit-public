# Append-only log of accepted vocabulary edits (03-vocabulary). vocab.yaml is rebuilt from it.
- version: 1
  paper: 2018_Ronaldson-Bouchard
  agent:
    model: llm
    instructions: terms_v2
    run: null
  events:
  - event: add_term
    field: platform
    id: platform:culture_2d
    label: 2D culture
    definition: Cells grown as a layer on a flat surface.
    scope: Use for flat cultures; not for 3D engineered constructs or native heart tissue.
  - event: add_term
    field: platform
    id: platform:engineered_3d
    label: 3D engineered tissue
    definition: A three-dimensional construct engineered from cells in a matrix.
    scope: Use for engineered 3D constructs; not for flat cultures or tissue taken from a heart.
  - event: add_term
    field: platform
    id: platform:native_tissue
    label: native heart tissue
    definition: Heart tissue taken from a donor, used as a benchmark rather than engineered.
    scope: Use for tissue taken from a heart; not for engineered constructs or 2D cultures.
  - event: add_term
    field: platform
    id: platform:monolayer
    label: monolayer
    parent: platform:culture_2d
    definition: A single layer of cells on a flat surface.
  - event: add_term
    field: platform
    id: platform:tissue_between_pillars
    label: tissue between two pillars
    parent: platform:engineered_3d
    definition: An engineered tissue formed by cells in a hydrogel suspended between two flexible pillars that load it auxotonically.
  - event: add_term
    field: platform
    id: platform:fetal_heart_tissue
    label: fetal cardiac tissue
    parent: platform:native_tissue
    definition: Heart tissue taken from a human fetus.
    scope: Fetal donor tissue; not adult heart tissue.
    synonyms:
    - text: FCT
      anchor: using human fetal cardiac tissues (FCTs) and adult human heart ventricles as benchmarks
  - event: add_term
    field: platform
    id: platform:adult_heart_tissue
    label: adult heart tissue
    parent: platform:native_tissue
    definition: Heart tissue taken from an adult human.
    scope: Adult donor tissue; not fetal heart tissue.
    synonyms:
    - text: adult myocardium
      anchor: but remained below those in adult myocardium
    - text: adult cardiac tissue
      anchor: Representative transmission electron microscopy images for FCTs, adult cardiac tissue, and early-stage cardiac
        tissues
    - text: adult human heart
      anchor: using human fetal cardiac tissues (FCTs) and adult human heart ventricles as benchmarks
  - event: add_term
    field: substrate
    id: substrate:hydrogel
    label: hydrogel
    definition: A water-swollen polymer network in which cells are embedded.
    scope: Use for cells embedded in a gel; the gel's material is a narrower term.
  - event: add_term
    field: substrate
    id: substrate:fibrin_hydrogel
    label: fibrin hydrogel
    parent: substrate:hydrogel
    definition: A hydrogel formed from fibrinogen polymerised by thrombin.
  - event: add_term
    field: preparation
    id: preparation:intact_tissue
    label: intact tissue
    definition: The whole construct or tissue, measured without dissociation or fixation.
    scope: Living whole tissue; not dissociated cells, fixed samples or extracts.
  - event: add_term
    field: preparation
    id: preparation:dissociated_cells
    label: dissociated cells
    definition: Cells enzymatically or mechanically separated from a tissue before measurement.
    scope: Living cells freed from the tissue; not intact tissue, fixed samples or extracts.
  - event: add_term
    field: preparation
    id: preparation:fixed
    label: fixed
    definition: A sample chemically fixed (e.g. paraformaldehyde or glutaraldehyde) before imaging.
    scope: Fixed samples; not living tissue, living dissociated cells or extracts.
  - event: add_term
    field: preparation
    id: preparation:rna_extract
    label: RNA extract
    definition: RNA purified from a sample for expression measurement.
    scope: Molecular extracts of RNA; not living or fixed samples.
    synonyms:
    - text: total RNA
      anchor: Total RNA was purified from tissues
  - event: add_term
    field: cm_medium
    id: cm_medium:rpmi_1640
    label: RPMI 1640
    definition: RPMI-1640 basal medium.
    synonyms:
    - text: RPMI
      anchor: RPMI + B27 medium, consisting of RPMI-1640
  - event: add_term
    field: hipsc_medium
    id: hipsc_medium:mtesr1
    label: mTeSR1
    definition: mTeSR1 defined medium for pluripotent stem cells.
  - event: add_term
    field: hipsc_coating
    id: hipsc_coating:matrigel
    label: Matrigel
    definition: Basement-membrane matrix extracted from Engelbreth-Holm-Swarm mouse sarcoma.
  - event: add_term
    field: hipsc_coating
    id: hipsc_coating:gfr_matrigel
    label: growth-factor-reduced Matrigel
    parent: hipsc_coating:matrigel
    definition: Matrigel with reduced growth-factor content.
  - event: add_term
    field: replating_coating
    id: replating_coating:matrigel
    label: Matrigel
    definition: Basement-membrane matrix extracted from Engelbreth-Holm-Swarm mouse sarcoma.
  - event: add_term
    field: purity_method
    id: purity_method:flow_cytometry
    label: flow cytometry
    definition: Counting marker-positive cells in suspension by flow cytometry.
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:electrical_stimulation
    label: electrical stimulation
    definition: Electrical field stimulation applied during culture to make the cells contract.
    scope: Electrical regimes during culture; the regime's pattern is a narrower term.
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:constant_stimulation
    label: constant electrical stimulation
    parent: maturation_strategy:electrical_stimulation
    definition: Electrical stimulation at one fixed frequency throughout culture.
    scope: Fixed frequency; not a regime whose frequency is raised over time.
    qualifiers:
      frequency:
        dimension: frequency
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:intensity_training
    label: intensity training
    parent: maturation_strategy:electrical_stimulation
    definition: Electrical stimulation whose frequency is raised stepwise over the culture period.
    scope: Frequency increased over time; not stimulation at one fixed frequency.
    qualifiers:
      frequency:
        dimension: frequency
  - event: add_term
    field: pacing
    id: pacing:electrical_pacing
    label: electrical pacing
    definition: Electrical stimulation that drives beats during the measurement.
    synonyms:
    - text: electrical stimulation
      anchor: and made to contract by electrical stimulation
    qualifiers:
      frequency:
        dimension: frequency
  - event: add_term
    field: pacing
    id: pacing:current_clamp_stimulation
    label: current clamp stimulation
    parent: pacing:electrical_pacing
    definition: Beats triggered by current injection through a patch pipette in current clamp mode.
  - event: adopt
    field: cell_line
    id: CVCL_D081
    label: iPS.C2a
    lookup: searched 'C2A' and 'iPS.C2a' in Cellosaurus 57.0; iPS.C2a is a human iPSC line from Medical College of Wisconsin
      (PubMed 19998274, Duncan lab); the paper credits S. Duncan, University of Wisconsin, for the C2A line
    synonyms:
    - text: C2A
      anchor: University of Wisconsin (C2A line)
  - event: adopt
    field: cell_line
    id: CVCL_Y803
    label: GM25256
    lookup: searched 'WTC11' and 'WTC-11' in Cellosaurus 57.0; listed as a synonym of GM25256 (Conklin, Gladstone)
    synonyms:
    - text: WTC11
      anchor: early-stage cardiac tissues from the C2A line (h), WTC11 cell line (i), and IMR90 cell line (j)
  - event: adopt_own
    field: cell_line
    id: cell_line:imr90_ipsc
    label: IMR90-derived iPSC line (clone not stated)
    definition: A human iPSC line reprogrammed from IMR-90 fibroblasts, clone not named by the source.
    lookup: searched 'IMR90', 'IMR-90', 'iPS(IMR90)' in Cellosaurus 57.0; IMR-90 (CVCL_0347) is the parent fibroblast line
      and iPS(IMR90)-1..4 are distinct clones; the paper names no clone
    synonyms:
    - text: IMR90
      anchor: Columbia University (IMR90 line)
  - event: adopt
    field: differentiation_factors
    id: CHEBI:81351
    label: Activin A
    lookup: searched 'activin A' in ChEBI 257; exact match
  - event: adopt
    field: differentiation_factors
    id: CHEBI:758024
    label: human recombinant bone morphogenetic protein 4
    lookup: searched 'BMP4' (no hit) and 'bone morphogenetic protein 4' in ChEBI 257
    synonyms:
    - text: BMP4
      anchor: bone morphogenetic protein 4 (BMP4, 25 ng/ml, R&D systems)
  - event: adopt_own
    field: differentiation_factors
    id: differentiation_factors:vegf
    label: vascular endothelial growth factor
    definition: The growth factor VEGF, added during mesoderm induction.
    lookup: searched 'VEGF' and 'vascular endothelial growth factor' in ChEBI 257; only VEGF receptor antagonists and activators,
      no entry for the protein
    synonyms:
    - text: VEGF
      anchor: vascular endothelial growth factor (VEGF, 10 ng/ml, R&D systems)
  - event: adopt
    field: supplements
    id: CHEBI:17334
    label: penicillin
    lookup: searched 'penicillin' in ChEBI 257; exact match (class)
  - event: adopt
    field: supplements
    id: CHEBI:17076
    label: streptomycin
    lookup: searched 'streptomycin' in ChEBI 257; exact match
  - event: adopt
    field: supplements
    id: CHEBI:22652
    label: ascorbic acid
    lookup: searched 'ascorbic acid' in ChEBI 257; exact match (the paper does not say L-)
  - event: adopt
    field: cell_types
    id: CL:0000746
    label: cardiac muscle cell
    lookup: searched 'cardiac muscle cell' and 'cardiomyocyte' in CL; CL has no iPSC-derived cardiomyocyte class
    synonyms:
    - text: hiPS-CMs
      anchor: Intensity training of cardiac tissues derived from early-stage hiPS-CMs is required to enhance mitochondrial
        development
  - event: adopt
    field: cell_types
    id: CL:0002551
    label: fibroblast of dermis
    lookup: searched 'fibroblast of dermis', 'dermal fibroblast' in CL
    synonyms:
    - text: human dermal fibroblasts
      anchor: Differentiated hiPS-CMs were combined with supporting human dermal fibroblasts (Lonza)
  - event: adopt
    field: stromal_cell
    id: CL:0002551
    label: fibroblast of dermis
    lookup: second field for the same CL id; searched 'fibroblast of dermis' in CL
  - event: adopt
    field: treatment
    id: CHEBI:27732
    label: caffeine
    lookup: searched 'caffeine' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:80240
    label: Endothelin-1
    lookup: searched 'endothelin-1' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:75379
    label: blebbistatin
    lookup: searched 'blebbistatin' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:8925
    label: ryanodine
    lookup: searched 'ryanodine' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:9516
    label: thapsigargin
    lookup: searched 'thapsigargin' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:48432
    label: angiotensin II
    lookup: searched 'angiotensin II' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:7565
    label: nifedipine
    lookup: searched 'nifedipine' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:9948
    label: verapamil
    lookup: searched 'verapamil' in ChEBI 257; exact match
  - event: adopt
    field: treatment
    id: CHEBI:64317
    label: isoprenaline
    lookup: searched 'isoproterenol' and 'isoprenaline' in ChEBI 257; isoprenaline is the parent compound entry (CHEBI:747921
      'isoproterenol' is a second, newer entry)
    synonyms:
    - text: isoproterenol
      anchor: with increasing doses of isoproterenol
  - event: adopt_own
    field: disease_model
    id: disease_model:cardiac_hypertrophy
    label: cardiac hypertrophy
    definition: Pathological hypertrophy of heart muscle, here induced in vitro by drugs such as endothelin-1.
    lookup: searched 'cardiac hypertrophy', 'hypertrophy' and 'hypertrophic cardiomyopathy' in MONDO; no class for acquired
      cardiac hypertrophy; hypertrophic cardiomyopathy (MONDO:0005045) is the inherited disease, not this drug-induced model
  - event: add_term
    field: measure
    id: measure:gene_expression
    label: gene expression
    definition: Relative mRNA level of one gene, as a fold change against a reference.
    scope: mRNA level of one named gene (the gene is a qualifier); not protein or marker-positive cell fractions.
    qualifiers:
      gene:
        dimension: text
      normalised_to:
        dimension: text
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:action_potential
    label: action potential
    definition: The membrane-voltage waveform of one beat.
    scope: The whole waveform; its amplitude, duration and upstroke are narrower terms; not resting potential.
    dimension: voltage
  - event: add_term
    field: measure
    id: measure:action_potential_amplitude
    label: action potential peak amplitude
    parent: measure:action_potential
    definition: Voltage from resting potential to the action potential's peak.
    scope: Peak height of the waveform; not its duration or upstroke velocity.
    dimension: voltage
  - event: add_term
    field: measure
    id: measure:action_potential_duration
    label: action potential duration
    parent: measure:action_potential
    definition: Time from upstroke to a stated level of repolarisation.
    scope: Width of the waveform at a stated level (qualifier level); not amplitude or upstroke.
    qualifiers:
      level:
        dimension: text
    dimension: time
  - event: add_term
    field: measure
    id: measure:upstroke_velocity
    label: upstroke velocity
    parent: measure:action_potential
    definition: Rate of rise of membrane voltage during the upstroke.
    scope: Slope of the upstroke; not amplitude or duration.
    dimension: voltage_rate
  - event: add_term
    field: measure
    id: measure:resting_membrane_potential
    label: resting membrane potential
    definition: Membrane voltage between beats.
    scope: Diastolic voltage; not the action potential or its parts.
    dimension: voltage
  - event: add_term
    field: measure
    id: measure:current_density
    label: current density
    definition: An ionic current normalised to membrane capacitance.
    scope: One named ionic current (qualifier current) per capacitance; not voltages.
    qualifiers:
      current:
        dimension: text
    dimension: current_density
  - event: add_term
    field: measure
    id: measure:twitch_force
    label: twitch force
    definition: Active force of one contraction.
    scope: Force in newtons; not force per cross-section (twitch stress).
    dimension: force
  - event: add_term
    field: measure
    id: measure:twitch_stress
    label: twitch stress
    definition: Active force of one contraction per cross-sectional area.
    scope: Force per area; not absolute force.
    dimension: stress
  - event: add_term
    field: measure
    id: measure:post_rest_potentiation
    label: post-rest potentiation
    definition: Change in twitch tension on the first beat after a pause in pacing.
    scope: Change after rest relative to steady state; not the steady twitch force itself.
    synonyms:
    - text: change in twitch tension
      anchor: Post-rest potentiation measurements were subsequently obtained by analysing the change in twitch tension
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:calcium_transient_amplitude
    label: calcium transient amplitude
    definition: Peak of the calcium-dye fluorescence transient relative to baseline.
    scope: Peak height of electrically evoked transients; how it is normalised ((F−F0)/F0 or F/F0) is the qualifier normalisation;
      not times or caffeine-evoked release.
    qualifiers:
      normalisation:
        dimension: text
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:calcium_transient_rise_time
    label: calcium transient rise time
    definition: Time for the calcium transient to rise to its peak.
    scope: Rise of the transient; not its width or decay.
    dimension: time
  - event: add_term
    field: measure
    id: measure:calcium_transient_fwhm
    label: calcium transient FWHM
    definition: Full width of the calcium transient at half its maximum.
    scope: Width at half maximum; not rise or decay time.
    dimension: time
  - event: add_term
    field: measure
    id: measure:calcium_transient_decay_time
    label: calcium transient decay time
    definition: Time for the calcium transient to decay from its peak to a stated level.
    scope: Decay of the calcium transient; not contraction relaxation time, rise time or width.
    dimension: time
  - event: add_term
    field: measure
    id: measure:caffeine_calcium_release
    label: caffeine calcium release
    definition: Calcium-dye signal released from stores by a caffeine bolus.
    scope: Release evoked by caffeine, a measure of SR load; not electrically evoked transients.
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:relaxation_time
    label: relaxation time
    definition: Time from peak to a stated fraction of relaxation (qualifier level).
    scope: Relaxation time at a stated level when the source does not tie it to the calcium transient; not calcium transient
      decay time when that is named.
    qualifiers:
      level:
        dimension: text
    dimension: time
  - event: add_term
    field: measure
    id: measure:ec50
    label: EC50
    definition: Concentration giving half the maximal response of a stated readout.
    scope: A potency from a dose-response fit; the readout is the qualifier response.
    qualifiers:
      response:
        dimension: text
    dimension: concentration
  - event: add_term
    field: measure
    id: measure:conduction_velocity
    label: conduction velocity
    definition: Speed at which electrical activation spreads through the tissue.
    scope: Propagation speed; not beat frequency.
    dimension: velocity
  - event: add_term
    field: measure
    id: measure:contraction_frequency
    label: contraction frequency
    definition: Number of contractions per unit time.
    scope: Beat rate; not conduction velocity.
    synonyms:
    - text: frequency of contractions
      anchor: Frequency of contractions in cardiac tissues over four weeks of culture
    dimension: frequency
  - event: add_term
    field: measure
    id: measure:cell_area
    label: cell area
    definition: Projected area of one cell.
    scope: Size of single cells; not tissue area change or organelle area.
    dimension: area
  - event: add_term
    field: measure
    id: measure:mitochondrial_area_fraction
    label: mitochondrial area fraction
    definition: Per cent of image area occupied by mitochondria.
    scope: Fraction of area covered by mitochondria; not cell area.
    synonyms:
    - text: per cent area of mitochondria
      anchor: The per cent area of mitochondria in early-stage intensity-trained tissues
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:oxygen_consumption_rate
    label: oxygen consumption rate
    definition: Rate at which cells consume oxygen.
    scope: Respiration; not extracellular acidification.
    dimension: amount_rate
  - event: add_term
    field: measure
    id: measure:extracellular_acidification_rate
    label: extracellular acidification rate
    definition: Rate at which cells acidify the medium.
    scope: Glycolytic acidification; not oxygen consumption.
    dimension: rate
  - event: add_term
    field: measure
    id: measure:ultrastructure
    label: ultrastructure
    definition: Qualitative grading of sarcomere and organelle organisation in electron micrographs.
    scope: Qualitative ultrastructure; not sarcomere length or T-tubules.
    dimension: categorical
  - event: add_term
    field: measure
    id: measure:t_tubules
    label: T-tubules
    definition: Presence and organisation of transverse tubules.
    scope: T-tubule presence or organisation; not general ultrastructure.
    dimension: categorical
  - event: add_term
    field: measure
    id: measure:marker_positive_cells
    label: marker-positive cells
    definition: Fraction of cells positive for a stated marker (qualifier marker).
    scope: Fraction of one marker-positive population; not a ratio between two populations.
    qualifiers:
      marker:
        dimension: text
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:sarcomere_containing_cells
    label: sarcomere containing cells
    parent: measure:marker_positive_cells
    definition: Fraction of cells that show sarcomeres.
    scope: Cells counted by visible sarcomeres.
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:marker_positive_ratio
    label: marker-positive ratio
    definition: Ratio of two marker-positive populations (qualifier markers).
    scope: A ratio of two populations; not one population's fraction.
    qualifiers:
      markers:
        dimension: text
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:cell_elongation_ratio
    label: cell elongation ratio
    definition: Cell shape index from 0 (circle) to 1 (fully elongated).
    scope: Shape; not cell area.
    dimension: dimensionless
  - event: add_term
    field: measure
    id: measure:sarcomere_length
    label: sarcomere length
    definition: Distance between adjacent Z-lines.
    scope: Length of one sarcomere; not cell size.
    dimension: length
  - event: add_term
    field: measure
    id: measure:fractional_area_change
    label: fractional change in area
    definition: Change in projected tissue area between contracted and relaxed states, as a fraction.
    scope: Tissue contraction amplitude from area; not cell area.
    qualifiers:
      normalised_to:
        dimension: text
    dimension: dimensionless
  - event: standing_key
    measure: measure:gene_expression
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - measure.gene
      - measure.normalised_to
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      - measure.gene
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:action_potential
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:action_potential_amplitude
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:action_potential_duration
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - measure.level
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      - measure.level
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:upstroke_velocity
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:resting_membrane_potential
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:current_density
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - measure.current
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      - measure.current
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:twitch_force
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - media_calcium_mM
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:twitch_stress
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - media_calcium_mM
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:post_rest_potentiation
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - media_calcium_mM
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:calcium_transient_amplitude
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - measure.normalisation
      - media_calcium_mM
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      - measure.normalisation
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:calcium_transient_rise_time
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:calcium_transient_fwhm
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      may_vary:
      - cell_line
    direction:
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
  - event: standing_key
    measure: measure:calcium_transient_decay_time
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      may_vary:
      - cell_line
