evidence:
  S1_area:
    unit: S1
    measure: cell area
    method: phalloidin staining; cell area
    software: not stated
    finding: Cells in contact with at least one other cell are larger than isolated cells.
    compares:
    - contact
    - isolated
    n: not stated
    stats:
      test: not stated
      p: p<0.0001
    anchor:
      quote: Cardiomyocytes in contact with at least one other cardiomyocyte grew to significantly larger sizes than isolated
        cells
      where: Results, p. 2
    note: P printed in the figure only (Supplemental Fig. 1a); test and n not stated.
  F1f_mono_single:
    unit: F1f
    measure: resting sarcomere length
    method: MyBP-C immunofluorescence; automated segmentation of sarcomere units
    software: custom MATLAB script
    finding: Sarcomeres are longer in nonpatterned monolayers than in single micropatterned cells.
    compares:
    - mono
    - single
    n:
      printed: N = 448, 229, 373 sarcomere measurements per condition
      counts: sarcomeres
      per_group:
        single: '448'
        mono: '229'
        mb: '373'
    values:
      len_mono:
        printed: 2.2 ± 0.5
        unit: μm
        kind: mean
        group: mono
        spread: not stated
      len_single:
        printed: 1.8 ± 0.4
        unit: μm
        kind: mean
        group: single
        spread: not stated
    stats:
      test: two-sided Tukey-adjusted ANOVA
      p: P < 0.0001
      p_values:
      - p: p<0.0001
        anchor:
          quote: Fig. 1f (figure label p<0.0001)
          where: Fig. 1f
          kind: unit
    anchor:
      quote: Resting sarcomere length was measured in single micropatterned hPSC-CMs compared to nonpatterned (standard) hPSC-CMs
        on 8 kPa PDMS
      where: Fig. 1f legend
    note: Box plot (median, interquartile range, range); the ± in the text is not named.
  F1f_both:
    unit: F1f
    measure: resting sarcomere length
    method: MyBP-C immunofluorescence; automated segmentation of sarcomere units
    software: custom MATLAB script
    finding: Resting sarcomere length is about 2.2 μm in both 2DMBs and nonpatterned monolayers.
    groups:
    - mono
    - mb
    n:
      printed: N = 448, 229, 373 sarcomere measurements per condition
      counts: sarcomeres
      per_group:
        single: '448'
        mono: '229'
        mb: '373'
    values:
      len_approx:
        printed: ~2.2
        unit: μm
        kind: mean
        over:
        - mono
        - mb
        spread: not stated
    anchor:
      quote: Resting sarcomere length in both 2DMBs and nonpatterned hPSC-CMs on 8 kPa PDMS substrates was ~2.2 μm
      where: Results, p. 2
  F1f_mb_single:
    unit: F1f
    measure: resting sarcomere length
    method: MyBP-C immunofluorescence; automated segmentation of sarcomere units
    software: custom MATLAB script
    finding: Sarcomeres are longer in 2DMBs than in single micropatterned cells.
    compares:
    - mb
    - single
    n:
      printed: N = 448, 229, 373 sarcomere measurements per condition
      counts: sarcomeres
      per_group:
        single: '448'
        mono: '229'
        mb: '373'
    values:
      len_mb:
        printed: 2.2 ± 0.4
        unit: μm
        kind: mean
        group: mb
        spread: not stated
      len_single:
        printed: 1.8 ± 0.4
        unit: μm
        kind: mean
        group: single
        spread: not stated
    stats:
      test: two-sided Tukey-adjusted ANOVA
      p: P < 0.0001
      p_values:
      - p: p<0.0001
        anchor:
          quote: Fig. 1f (figure label p<0.0001)
          where: Fig. 1f
          kind: unit
    anchor:
      quote: both longer than in single hPSC-CMs on PDMS (1.8 ± 0.4 μm, P < 0.0001; Fig. 1f)
      where: Results, p. 2
  F1g_sigma:
    unit: F1gh
    measure: standard deviation of sarcomere orientation (representative image)
    method: MyBP-C immunofluorescence; automated segmentation of sarcomere units; Gaussian fit per image
    software: custom MATLAB script
    finding: In representative images, sarcomere orientations spread less in a 2DMB than in a monolayer.
    groups:
    - mb
    - mono
    n: not stated
    values:
      sigma_mb:
        printed: '18'
        unit: degrees
        kind: sd
        group: mb
        spread: not stated
      sigma_mono:
        printed: '37'
        unit: degrees
        kind: sd
        group: mono
        spread: not stated
    anchor:
      quote: Representative distribution of sarcomere orientations is shown for an 2DMB (blue) overlayed on a representative
        distribution for standard hPSC-CMs (black)
      where: Fig. 1g legend
    note: σ values are figure text in an image (Fig. 1g).
  F1h_sd_angle:
    unit: F1gh
    measure: standard deviation of sarcomere angles
    method: MyBP-C immunofluorescence; automated segmentation of sarcomere units; Gaussian fit per image
    software: custom MATLAB script
    finding: The standard deviation of sarcomere angles is lower in 2DMBs than in monolayers.
    compares:
    - mb
    - mono
    n:
      printed: N = 34; N = 19
      counts: images
      per_group:
        mb: '34'
        mono: '19'
    stats:
      test: two-sided t test
      p: p<0.0001
    anchor:
      quote: The standard deviation of sarcomere angles is lower for 2DMBs (N = 34) compared to monolayer hPSC-CMs (N = 19)
      where: Fig. 1h legend
    note: P printed in the figure only.
  F2e_fs:
    unit: F2e
    measure: maximal fractional shortening
    method: brightfield time-series at 50 frames per second; ROI cross-correlation displacement tracking at the inner 50%
      of the 2DMB (ContractQuant)
    software: ContractQuant (custom MATLAB)
    finding: Maximal fractional shortening is greater in 2DMBs than in standard hPSC-CMs.
    compares:
    - mb
    - mono
    n:
      printed: N = 62 and 36, respectively
      counts: 2DMBs or monolayer regions
      per_group:
        mb: '62'
        mono: '36'
    values:
      fs_mb:
        printed: 5.0 ± 1.1
        unit: '%'
        kind: mean
        group: mb
        spread: not stated
      fs_mono:
        printed: 0.9 ± 1.4
        unit: '%'
        kind: mean
        group: mono
        spread: not stated
    stats:
      test: not stated
      p: P < 0.0001
      p_values:
      - p: p<0.0001
        anchor:
          quote: Fig. 2e (figure label p<0.0001)
          where: Fig. 2e
          kind: unit
    anchor:
      quote: Average maximal fractional shortening was significantly greater in 2DMBs compared to standard hPSC-CMs from the
        same batches (5.0 ± 1.1% vs. 0.9 ± 1.4%, P < 0.0001, Fig. 2e)
      where: Results, p. 5
    note: Fig. 2 legend says P values are from two-tailed t tests and error bars are SD; panel e is covered by that sentence
      only by position.
  F2e_cv:
    unit: F2e
    measure: coefficient of variation of maximal fractional shortening
    method: brightfield time-series at 50 frames per second; ROI cross-correlation displacement tracking at the inner 50%
      of the 2DMB (ContractQuant)
    software: ContractQuant (custom MATLAB)
    finding: Variability of fractional shortening across 2DMBs is 87% lower than across standard hPSC-CMs.
    groups:
    - mb
    - mono
    n: not stated
    values:
      cv_mb:
        printed: '0.21'
        unit: dimensionless
        kind: value
        group: mb
        spread: not stated
      cv_mono:
        printed: '1.58'
        unit: dimensionless
        kind: value
        group: mono
        spread: not stated
      cv_reduction:
        printed: '87'
        unit: '%'
        kind: percent
        between:
        - mb
        - mono
        spread: not stated
    anchor:
      quote: variability across 2DMBs was reduced by 87% compared to standard hPSC-CMs (coefficient of variation 0.21 vs.
        1.58
      where: Results, p. 5
  TXT1_yield:
    unit: TXT1
    measure: fraction of micropatterns with a quantifiable muscle unit
    method: brightfield screening of micropatterns at ×10
    software: not stated
    finding: 2DMB substrates yield far more usable micropatterns than single-cell substrates.
    compares:
    - mb
    - single
    n:
      printed: N = 20; N = 12
      counts: substrates
      per_group:
        mb: '20'
        single: '12'
    values:
      yield_mb:
        printed: 55 ± 13
        unit: '% of micropatterns'
        kind: mean
        group: mb
        spread: not stated
      yield_single:
        printed: 0.5 ± 0.3
        unit: '% of micropatterns'
        kind: mean
        group: single
        spread: not stated
      fold:
        printed: '110'
        unit: fold
        kind: ratio
        between:
        - mb
        - single
        spread: not stated
    stats:
      test: not stated
      p: P < 0.0001
    anchor:
      quote: micropatterns on 2DMB substrates exhibited adherence of 6–12 cells with resultant rectangular geometry and uniaxial
        contractile direction (110-fold increase in yield vs. single cells, P < 0.0001, N = 20)
      where: Results, p. 5
    note: Single-cell yield is from the authors' prior work; a 2DMB counts with 6–12 cells, a single cell when it met quality
      thresholds for contractile quantification.
  TXT1_single_count:
    unit: TXT1
    measure: number of single hPSC-CMs meeting quality thresholds per substrate
    finding: Only 5–36 single cells per substrate met quality thresholds in prior work.
    groups:
    - single
    n: not stated
    values:
      lo:
        printed: '5'
        unit: cells per substrate
        kind: count
        group: single
        spread: not stated
      hi:
        printed: '36'
        unit: cells per substrate
        kind: count
        group: single
        spread: not stated
    anchor:
