      ef_tx_2w: {item: F3_ef_course, group: tx, unit_of_value: fold increase to PreTx}
      ef_tx_4w: {item: F3_ef_course, group: tx, unit_of_value: fold increase to PreTx}
      ef_sham_pre: {item: F3_ef_course, group: sham, unit_of_value: fold increase to PreTx}
      ef_sham_2w: {item: F3_ef_course, group: sham, unit_of_value: fold increase to PreTx}
      ef_sham_4w: {item: F3_ef_course, group: sham, unit_of_value: fold increase to PreTx}
      ef_tx: {item: F3_ef_tx_vs_sham_4w, group: tx, unit_of_value: fold increase to PreTx}
      ef_sham: {item: F3_ef_tx_vs_sham_4w, group: sham, unit_of_value: fold increase to PreTx}
    note: >-
      Fig. 3d, four line charts (cardiac output mL/min; stroke volume and ejection fraction as fold increase to PreTx;
      LVAd mm2 as printed "(mm²)"), one per quadrant of the crop. Lines join group means (blue Sham, red Tx); no
      markers or points, so the legend's n = 6 (Tx) and 5 (sham) cannot be counted. Label <measure>_<group>_<time>
