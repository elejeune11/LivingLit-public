  F2d_sf2_sf1.ffr:
    item: F2d_sf2_sf1
    measure: force of contraction (% change vs 1 Hz)
    formula: d = (F - F1)/F1
    anchor: &id002
      quote: +22±6% at 3 Hz versus 1 Hz
      where: Results, functional maturation
    library:
      formula: relative_change
      vars:
        d: d
        x: F
        x0: F1
    inputs:
      F:
        reading: F2d_ffr/F2d_sf2_sf1/sf2
        x: '2'
        kind: per sample
      F1:
        reading: F2d_ffr/F2d_sf2_sf1/sf1
        x: '1'
        kind: per sample
        note: the plotted 1 Hz value is the reference (% of FOC at 1 Hz)
    output: F2d_sf2_sf1.values.ffr_sf2_text
    aggregation: not stated
