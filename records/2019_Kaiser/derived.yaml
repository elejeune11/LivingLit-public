  T3_stress_fold.max_fold:
    item: T3_stress_fold
    measure: peak active stress
    formula: r = a/b
    anchor:
      quote: Peak twitch stress varies between groups as much as 5-fold (Table 3)
      where: Results 3.3
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        value: T3_stress_g11_vs_g4.values.g11_table
        part: mean
        kind: constant
        note: largest Table 3 mean (group 11)
      b:
        value: T3_stress_g11_vs_g4.values.g4_table
        part: mean
        kind: constant
        note: smallest Table 3 mean (group 4)
    output: T3_stress_fold.values.max_fold
    aggregation: of means
    note: '''as much as'' read as the largest over the smallest group mean of Table 3 (groups 1, 4, 7, 11).'
  F2D.anisotropic_ratio:
    item: F2D
    measure: tensile Young's modulus
    formula: r = a/b
    anchor:
      quote: anisotropic ratio of approximately 2:1
      where: Results 3.1
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        value: F2D.values.long_results
        part: mean
        kind: constant
      b:
        value: F2D.values.trans_results
        part: mean
        kind: constant
    output: F2D.values.anisotropic_ratio
    aggregation: of means
  TS2_SMA_only.sma_only_unpurified1:
    item: TS2_SMA_only
    group: unpurified1
    measure: SMA+ only cells
    formula: o = s - c
    anchor:
      quote: SMA+ only (%)
      where: Table S2
      file: ab8b01112_si_001.pdf
      kind: table cell
    library:
      formula: difference_from_reference
      vars:
        d: o
        x: s
        x0: c
    inputs:
      s:
        value: TS2_SMA.values.unpurified1_table
        kind: constant
      c:
        value: TS2_cTnT_SMA.values.unpurified1_table
        kind: constant
    output: TS2_SMA_only.values.unpurified1_table
    note: the column name 'SMA+ only' beside 'SMA+' and 'cTnT+ and SMA+' names the set difference; the paper does not say
      whether it was gated directly or subtracted
