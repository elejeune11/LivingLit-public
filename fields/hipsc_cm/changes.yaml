- version: 5
  paper: 2022_Shen
  agent:
    model: llm
    instructions: terms_v2
    run: null
  events:
  - event: add_term
    field: substrate
    id: substrate:decellularized_myocardium
    label: decellularized myocardium
    parent: null
    definition: A slice of heart muscle from which the cells have been removed, leaving the extracellular matrix as a scaffold
      that cells are seeded onto.
    scope: Native cardiac extracellular matrix left after decellularization (the donor species is the qualifier species);
      not a hydrogel cast from purified matrix proteins, PDMS, glass or polyacrylamide.
    qualifiers:
      species:
        dimension: text
  - event: adopt
    field: stromal_cell
    id: CL:0002548
    label: fibroblast of cardiac tissue
    lookup: livinglit lookup cl 'cardiac fibroblast' -> CL:0002548 (exact synonym 'cardiac fibroblast'); the source names
      cardiac fibroblasts, not ventricle fibroblasts, so not CL:2000066
    synonyms:
    - text: adult human cardiac fibroblasts
      anchor: 1 million cells of 90% hiPSC-CMs and 10% adult human cardiac fibroblasts
  - event: add_synonym
    id: platform:engineered_3d
    text: engineered heart tissue
    anchor: accelerates maturation of human engineered heart tissue
  - event: add_synonym
    id: platform:engineered_3d
    text: engineered tissues
    anchor: Zhao et al. (engineered tissues with rapid pacing)
  - event: add_synonym
    id: platform:native_tissue
    text: human ventricular samples
    anchor: maturing human ventricular samples, but there were also several exceptions
  - event: add_qualifier
    id: cm_medium:rpmi_1640
    name: glucose
    dimension: text
  - event: add_synonym
    id: maturation_strategy:intensity_training
    text: ramp pacing
    anchor: Functional improvements from high calcium and ramp pacing were observed in a second iPSC line
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:maturation_medium
    label: maturation medium
    parent: null
    definition: A culture medium formulated to promote cardiomyocyte maturation (for example by changing energy substrates
      or adding hormones) in place of the standard medium.
    scope: Maturation by the medium's composition; not electrical stimulation or mechanical loading.
    synonyms:
    - text: maturation media
      anchor: Mills et al. (engineered three-dimensional [3D] tissues with maturation media)
  - event: adopt_own
    field: cell_line
    id: cell_line:shen_pbmc_healthy_male_ipsc
    label: healthy adult male PBMC-derived hiPSC line of the Shen study (unnamed)
    definition: An unnamed hiPSC line reprogrammed from peripheral blood monocytes of a healthy adult male, used as a second
      healthy control line by its source.
    scope: The unnamed second control line of this source only; not PGP1 or any other unnamed line.
    lookup: The source gives no line name or accession; livinglit lookup cellosaurus 'PBMC healthy male' and 'Campbell' returned
      nothing.
  - event: add_synonym
    id: measure:twitch_force
    text: systolic peak force
    anchor: The raw FFR showed higher systolic peak forces for HC-NP group
  - event: add_synonym
    id: measure:calcium_transient_amplitude
    text: Ca2+ transient signal intensity
    anchor: Fura-2 Ca2+ transient signal intensity at 1 Hz
  - event: add_synonym
    id: measure:contraction_frequency
    text: spontaneous beating rate
    anchor: spontaneous beating rate after ramp completion
  - event: add_term
    field: measure
    id: measure:relative_twitch_force
    label: relative twitch force
    parent: measure:twitch_force
    dimension: dimensionless
    definition: Twitch force expressed relative to a reference twitch force of the same tissue (qualifier normalised_to),
      as a ratio or a percentage change (qualifier expressed_as).
    scope: A force divided by a reference force of the same tissue (another pacing rate, before a drug); not absolute twitch
      force.
    qualifiers:
      normalised_to:
        dimension: text
      expressed_as:
        dimension: text
  - event: add_term
    field: measure
    id: measure:relative_time_to_peak_force
    label: relative time to peak force
    parent: measure:contraction_time_to_peak
    dimension: dimensionless
    definition: Time to peak force expressed relative to a reference value of the same tissue (qualifier normalised_to), as
      a ratio or a percentage change (qualifier expressed_as).
    scope: A time to peak divided by a reference time to peak of the same tissue; not the time to peak itself.
    qualifiers:
      normalised_to:
        dimension: text
      expressed_as:
        dimension: text
      level:
        dimension: text
  - event: add_term
    field: measure
    id: measure:relative_relaxation_time
    label: relative relaxation time
    parent: measure:relaxation_time
    dimension: dimensionless
    definition: Relaxation time to a stated level expressed relative to a reference value of the same tissue (qualifier normalised_to),
      as a ratio or a percentage change (qualifier expressed_as).
    scope: A relaxation time divided by a reference relaxation time of the same tissue; not the relaxation time itself, and
      not a fitted relaxation time constant.
    qualifiers:
      normalised_to:
        dimension: text
      expressed_as:
        dimension: text
      level:
        dimension: text
  - event: set_scope
    id: measure:relaxation_time_constant
    scope: The fitted decay constant; not the time to a stated level of relaxation, and not a relaxation time expressed relative
      to a reference.
  - event: add_term
    field: measure
    id: measure:relative_calcium_transient_amplitude
    label: relative calcium transient amplitude
    parent: measure:calcium_transient_amplitude
    dimension: dimensionless
    definition: Calcium transient amplitude expressed relative to a reference amplitude of the same tissue (qualifier normalised_to),
      as a ratio or a percentage change (qualifier expressed_as).
    scope: An amplitude divided by a reference amplitude of the same tissue (before a drug); not the amplitude itself.
    qualifiers:
      normalised_to:
        dimension: text
      expressed_as:
        dimension: text
  - event: add_term
    field: measure
    id: measure:relative_calcium_transient_decay_time
    label: relative calcium transient decay time
    parent: measure:calcium_transient_decay_time
    dimension: dimensionless
    definition: Calcium transient decay time to a stated level expressed relative to a reference value of the same tissue
      (qualifier normalised_to), as a ratio or a percentage change (qualifier expressed_as).
    scope: A decay time divided by a reference decay time of the same tissue; not the decay time itself.
    qualifiers:
      normalised_to:
        dimension: text
      expressed_as:
        dimension: text
      level:
        dimension: text
  - event: add_term
    field: measure
    id: measure:diastolic_excess_fraction
    label: diastolic excess fraction
    parent: null
    dimension: dimensionless
    definition: Ratio of the diastolic force at a high pacing rate to the diastolic force at rest.
    scope: Rise of resting force with pacing rate, as a ratio; not diastolic stress itself and not post-rest potentiation.
  - event: add_term
    field: measure
    id: measure:force_frequency_relationship
    label: force-frequency relationship
    parent: null
    dimension: categorical
    definition: The shape of twitch force against pacing frequency (positive, flat or negative), read from force over a range
      of frequencies.
    scope: The trend of force across frequencies as a whole; not twitch force at one frequency and not the force-calcium relation.
  - event: add_term
    field: measure
    id: measure:differentially_expressed_gene_count
    label: number of differentially expressed genes
    parent: null
    dimension: dimensionless
    definition: Count of genes whose expression differs between compared conditions at a stated threshold.
    scope: A count of genes over a whole transcriptome comparison; not the expression of one gene.
  - event: add_term
    field: measure
    id: measure:pca_variance_explained
    label: variance explained by principal components
    parent: null
    dimension: dimensionless
    definition: Fraction of the variation in a set of samples captured by stated principal components (qualifier component).
    scope: A property of a principal component analysis of many samples; not a measurement of one sample.
    qualifiers:
      component:
        dimension: text
  - event: add_term
    field: measure
    id: measure:medium_component_concentration
    label: medium component concentration
    parent: null
    dimension: concentration
    definition: Concentration of a stated component (qualifier component) in a culture medium's formulation.
    scope: The composition of a medium; not a measurement on cells or tissues.
    qualifiers:
      component:
        dimension: text
