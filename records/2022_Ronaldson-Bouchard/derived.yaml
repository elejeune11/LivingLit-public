    anchor:
      quote: defined as the concentration of a compound that elicits 50% of its maximal overall effect
      where: Results
    no_formula: 'EC50 from a dose–response curve fit; the fitted model (Hill slope, bounds) is not stated and no curve-fit entry is in the library'
  S4c_nifedipine.ec50:
