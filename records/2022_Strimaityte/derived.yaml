derived:
  F4i_TNNT2_icmf_rc.relative_expression:
    item: F4i_TNNT2_icmf_rc
    formula: r = 2^(-ddct)
    anchor:
      quote: Fold differences were normalized to GAPDH and calculated using the 2−ΔΔCt method.
      where: Methods, RT-qPCR
    library:
      formula: ddct_relative_expression
      vars:
        r: r
        ddct: ddct
    inputs:
      ddct:
        not_stated: true
        kind: per sample
        note: TNNT2 Ct minus GAPDH Ct, minus the calibrator's; no Ct values printed
    aggregation: not stated
    note: TNNT2 relative to GAPDH. The calibrator group (the one set to 1) is not stated; values are plotted only (violins,
      Fig. 4i–o).
