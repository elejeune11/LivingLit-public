    library:
      formula: difference_from_reference
      vars:
        d: d
        x: v
        x0: p
    inputs:
      v:
        value: S6C_tlin_PE_v_VEH.values.VEH_table
        part: mean
        kind: not stated
      p:
        value: S6C_tlin_PE_v_VEH.values.PE_table
        part: mean
        kind: not stated
