evidence:
  F1C_qpcr:
    unit: F1
    measure: relative mRNA expression of fibroblast and epicardial genes
    finding: hiPSC-CFs expressed fibroblast genes and reduced WT1 and TBX18, and were more similar to ACFs than to SFs
    anchor:
      quote: Heatmap showing qPCR analysis of fibroblast (GJA1, ITGA4, COL1A2, COL1A1, and POSTN) and EPI (GJA1, WT1, and
        TBX18) genes in hiPSC-EPIs and
      where: Fig. 1 legend
    groups:
    - epi
    - cf
    - acf
    - sf
    method: qPCR, DCt method
    software: GraphPad Prism 8.2.0
    n:
      printed: n = 3
      counts: biological replicates
    definition: Values normalized to RPL37A.
  F1E_degs:
    unit: F1
    measure: number of differentially expressed genes
    finding: 4,266 DEGs separated the cell types into lineage-specific clusters
    anchor:
      quote: Heatmap showing hierarchical clustering of 4,266 DEGs (PFDR % 0.05) across different cell types showing cell-lineage-specific
        gene clusters.
      where: Fig. 1 legend
    groups:
    - epi
    - cf
    - acf
    - sf
    method: bulk RNA-seq, differential expression with edgeR
    values:
      degs:
        printed: 4,266
        unit: genes
        kind: count
        spread: not stated
        over:
        - epi
        - cf
        - acf
        - sf
    stats:
      test: generalized linear models as implemented in edgeR
      p: PFDR % 0.05
  F2F_align_cmec:
    unit: F2F
    measure: sarcomere alignment index
    finding: sarcomere alignment index was higher in CMECFs than in CMECs
    anchor:
      quote: Sarcomere organization (sarcomere alignment index; n > 45 areas from 3 MTs per group; *p < 0.05)
      where: Fig. 2 legend
    compares:
    - cmecf
    - cmec
    method: immunofluorescence for ACTN2 in whole-mount MTs; sarcomere alignment by a Fast Fourier Transform plugin
    software: Fiji Software, ImageJ
    definition: The index of sarcomere alignment was obtained by normalizing the area under the first order peak for the total
      area of the power spectrum profile.
    n:
      printed: n > 45
      counts: areas from 3 MTs per group
    stats:
      test: One-way ANOVA with Dunnett's multiple comparisons test
      p: '*p < 0.05'
  F2F_align_sf:
    unit: F2F
    measure: sarcomere alignment index
    finding: sarcomere alignment index was higher in CMECFs than in CMEC SFs
