# Formula agent (formulas_v3) for 2021_Tsan. Derivations as the paper states them; verdicts come from code.
record: 2021_Tsan
formula_library_version: 8
agent:
  model: llm
  instructions: formulas_v3
derived:
  F2e_fs.fs_mb:
    item: F2e_fs
    group: mb
    formula: fs = dL/L
    anchor: &id001
      quote: Note that a different scale was used for Δlength/length (fractional shortening)
      where: Fig. 2 legend, panel d
    library:
      formula: ratio_def
      vars:
        r: fs
        a: dL
        b: L
    inputs:
      dL:
        not_stated: true
        kind: per sample
        note: ROI displacement at peak contraction per 2DMB (ContractQuant); not released
      L:
        not_stated: true
        kind: per sample
        note: ROI length at rest (inner 50% of the 2DMB) per 2DMB; not released
    output: F2e_fs.values.fs_mb
    output_unit: '%'
    aggregation: mean of per-sample
    note: maximal fractional shortening per 2DMB, averaged; only the per-2DMB results are released
