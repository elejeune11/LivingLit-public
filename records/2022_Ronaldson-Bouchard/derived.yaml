      n:
        printed: '17'
        unit: miRNAs
        anchor: {quote: 'identifying 17 miRNAs differentially expressed in paediatric cancer patients', where: 'Results, Identification of miRNA biomarkers'}
        kind: constant
    output: S12_consistent_mo4p.values.pct_text
  S12_consistent_mix4p.share:
    item: S12_consistent_mix4p
    measure: paediatric miRNAs with activity consistent with the clinical study
    formula: p = k/n
    anchor:
