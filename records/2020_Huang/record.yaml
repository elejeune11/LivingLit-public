evidence:
  F1B_alignment:
    unit: F1B
    measure: sarcomeric alignment
    method: immunostaining for α-actinin and troponin I, confocal imaging
    software: ImageJ
    finding: TDI-treated hiPSC-CMs exhibited substantial sarcomeric alignment; untreated sarcomeres randomly dispersed
    compares:
    - tdi
    - ctrl
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    anchor:
      quote: sarcomeres in untreated hiPSC-CMs were randomly dispersed, while TDI-treated hiPSC-CMs exhibited substantial sarcomeric alignment
      where: Results 3.1
    stated_direction:
      direction: up
      anchor:
        quote: TDI-treated hiPSC-CMs exhibited substantial sarcomeric alignment
        where: Results 3.1
  F1B_GJA1:
    unit: F1B
    measure: GJA1 localization at cell ends
    method: Connexin 43 (GJA1) immunostaining
    software: ImageJ
    finding: GJA1 concentrated at the ends of elongated TDI-treated cells; more uniform in untreated cells
    compares:
    - tdi
    - ctrl
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    anchor:
      quote: Connexin 43 (GJA1) staining was concentrated at the ends of the elongated TDI-treated hiPSC-CMs, suggesting polarized gap junction
        distributions
      where: Results 3.1
    stated_direction:
      direction: up
      anchor:
        quote: GJA1 in untreated hiPSC-CMs was distributed more uniformly
        where: Results 3.1
  F1C_width:
    unit: F1C
    measure: CMT width at the center
    method: phase contrast imaging
    finding: TDI-CMTs were 30% ± 5% narrower in the center than control-CMTs
    compares:
    - tdi
    - ctrl
    n:
      printed: N = 10
      counts: CMTs
    values:
      narrower_text:
        printed: 30% ± 5%
        unit: '%'
        kind: percent
        between:
        - tdi
        - ctrl
        spread: not stated
        expressed_as: '% change'
    stats:
      test: unpaired Student's t-test (Methods)
      statistic: not stated
      p: p < .05
    anchor:
      quote: TDI-CMTs were more compact compared with control-CMTs (30% ± 5% narrower in the center, p < .05, N = 10)
      where: Results 3.1
    stated_direction:
      direction: down
      anchor:
        quote: 30% ± 5% narrower in the center
        where: Results 3.1
  F1C_alignment:
    unit: F1C
    measure: cellular alignment
    method: α-actinin immunostaining
    context:
      preparation: fixed
    finding: TDI-treated CMTs exhibit structural anisotropy and improved cellular alignment
    compares:
    - tdi
    - ctrl
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    anchor:
      quote: Higher magnification images of the α-actinin staining show TDI-treated CMTs exhibit structural anisotropy and improved cellular alignment
      where: Fig. 1 legend
    stated_direction:
      direction: up
      anchor:
        quote: TDI-treated CMTs exhibit structural anisotropy and improved cellular alignment
        where: Fig. 1 legend
  F1D_CM_sl:
    unit: F1D_CM
    measure: sarcomere length
    method: α-actinin staining; intensity profile along a sarcomere, distances between maxima averaged; at least three sarcomeres per cell
    software: ImageJ peak finder macro
    finding: Longer sarcomeres in TDI-treated single cells
    compares:
    - tdi
    - ctrl
    n:
      printed: N = 100 cells
      counts: cells, from 5 differentiations
    values:
      tdi_text:
        printed: 1.9 μm ± 0.2 μm
        unit: μm
        kind: mean
        group: tdi
        spread: SD
        spread_source: legend
      ctrl_text:
        printed: 1.6 μm ± 0.1 μm
        unit: μm
        kind: mean
        group: ctrl
        spread: SD
        spread_source: legend
    stats:
      test: unpaired Student's t-test (Methods)
      statistic: not stated
      p: p ≤ 0.05
      p_values:
      - p: '*p ≤ 0.05'
        anchor:
          quote: 'Single cells: *p ≤ 0.05'
          where: Fig. 1 legend
    anchor:
      quote: 1.9 μm ± 0.2 μm treated vs 1.6 μm ± 0.1 μm un-treated for single cells, p ≤ 0.05, N = 100 cells
      where: Results 3.1
  F1D_CMT_sl:
    unit: F1D_CMT
    measure: sarcomere length
    method: α-actinin staining; intensity profile along a sarcomere, distances between maxima averaged; at least three sarcomeres per cell
    software: ImageJ peak finder macro
    finding: Longer sarcomeres in TDI-treated CMTs
    compares:
    - tdi
