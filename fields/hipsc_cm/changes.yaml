    definition: hiPSC line CUSO-1 of the University of Colorado, derived from a healthy male donor.
    lookup: 'cellosaurus ''CUSO-1'', ''CUSO'', ''CUSO 2'': no hiPSC line (only Caco-2 CuSO4-R)'
  - event: adopt_own
