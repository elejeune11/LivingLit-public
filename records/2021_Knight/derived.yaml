  F4CD_bnp_text.fold_MM:
    item: F4CD_bnp_text
    formula: r = a/b
    anchor:
      quote: BNP staining in MM and MPAT cells was much lower at baseline and was increased approximately 2-fold by PE treatment
      where: Results, MPAT and MM Methods Allow an Adult-like Hypertrophic Response
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        reading: f4d_bnp/MM_PE_v_MM_VEH/MM_PE
        kind: not stated
      b:
        reading: f4d_bnp/MM_PE_v_MM_VEH/MM_VEH
        kind: not stated
    output: F4CD_bnp_text.values.fold_MM_text
    note: ratio of % BNP+ cells with PE to that with vehicle (Fig. 4D, points per induction)
  S5C_nppb_text.fold_MM:
    item: S5C_nppb_text
    formula: r = g/m
    anchor:
      quote: By qPCR, MM and MPAT cells displayed a 5- to 6-fold reduction in BNP expression relative to GLUC cells at baseline
      where: Results, MPAT and MM Methods Allow an Adult-like Hypertrophic Response
    library:
      formula: ratio_def
      vars:
        r: r
        a: g
        b: m
    inputs:
      g:
        not_stated: true
        kind: not stated
        note: NPPB expression of GLUC normalised to 18S rRNA (Fig. S5C; not printed, not read)
      m:
        not_stated: true
        kind: not stated
        note: NPPB expression of MM normalised to 18S rRNA (Fig. S5C; not printed, not read)
    note: the printed range "5- to 6-fold" covers MM and MPAT together, so no single printed value is this output
