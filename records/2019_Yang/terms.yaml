# ---------------------------------------------------------------- adopted ids
- adopt:
    field: cell_line
    id: CVCL_0045
    label: HEK293
    lookup: Cellosaurus lookup 'HEK293' (exact; Cellosaurus lists 'HEK 293' as a synonym)
    synonyms:
    - text: HEK 293
      anchor: House-made palmitate-albumin complex is endotoxin-free, related to Results 2.1. HEK 293
- adopt:
    field: treatment
    id: CHEBI:16412
    label: lipopolysaccharide
    lookup: ChEBI lookup 'lipopolysaccharide' (exact)
    synonyms:
    - text: LPS
      anchor: different concentrations of E.coli lipopolysaccharides (LPS) suspended in DMEM/
- adopt:
    field: treatment
    id: CHEBI:17351
    label: linoleic acid
    lookup: ChEBI lookup 'linoleic acid' (exact); chosen over the anion 'linoleate' (CHEBI:30245) to sit with the adopted
      'oleic acid' (CHEBI:16196); the paper writes both 'linoleate-BSA' and 'linoleic acid-albumin'
- adopt:
    field: treatment
    id: CHEBI:30807
    label: tetradecanoate
    lookup: ChEBI lookup 'myristate' found no exact label; 'tetradecanoate' (exact) is the myristate anion, as the adopted
      'hexadecanoate' (CHEBI:7896) carries 'palmitate'
    synonyms:
    - text: myristate
      anchor: adding three of the constituent fatty acids (myristate C14:0,
- adopt:
    field: treatment
    id: CHEBI:32372
    label: palmitoleate
    lookup: ChEBI lookup 'palmitoleate' (exact)
- adopt_own:
    field: treatment
    id: treatment:fatty_acid_free_albumin
    label: fatty acid-free albumin
    definition: Serum albumin stripped of bound fatty acids, given as the vehicle or carrier for fatty acids.
    scope: The albumin carrier or vehicle itself; fatty acids bound to it take their own ids, and not serum (fetal bovine
      serum), a lipid mixture (chemically defined lipid concentrate) or a salt vehicle (phosphate-buffered saline).
    lookup: ChEBI lookup 'albumin', 'serum albumin' and 'bovine serum albumin' found only human, recombinant and labelled
      albumins (e.g. CHEBI:749447 albumin human, CHEBI:760525 recombinant rice-derived human serum albumin); no bovine or
      fatty acid-free albumin
    synonyms:
    - text: fatty acid-free BSA
      anchor: palmitate with 12% fatty acid-free BSA (molecular ratio 2.2:1)
# ---------------------------------------------------------------- own terms
- add_term:
    field: hipsc_medium
    id: hipsc_medium:mtesr_version_not_stated
    label: mTeSR (version not stated)
    parent: null
    definition: An mTeSR-family pluripotent stem cell medium whose version (mTeSR1, mTeSR Plus) the source does not state.
    scope: mTeSR named without its version; mTeSR1 when the source names it, and not FTDA, Essential 8, StemFlex,
      MEF-conditioned or an unnamed growth medium.
    synonyms:
    - text: mTeSR
      anchor: RUES2 and WTC-11 undifferentiated cells were cultured with mTeSR medium
- add_term:
    field: replating_coating
    id: replating_coating:laminin
    label: laminin
    parent: null
    definition: Laminin, a basement-membrane glycoprotein, coated or printed on a surface so that cardiomyocytes attach.
    scope: Purified laminin (source or isoform in the qualifier source); not Matrigel or Geltrex, which are basement-membrane
      mixtures, and not fibronectin, vitronectin, gelatin or agarose.
    qualifiers:
      source: {dimension: text}
- add_term:
    field: transgene
    id: transgene:luciferase_reporter
    label: luciferase reporter
    parent: null
    definition: A luciferase gene introduced under a stated promoter or response element so that its light output reports that
      element's activity.
    scope: A light-producing enzyme reporter read by a luminescence assay; not a fluorescent protein reporter, a calcium or
      voltage indicator, or an overexpressed gene studied for its own effect.
    qualifiers:
      luciferase: {dimension: text}
      promoter: {dimension: text}
- add_qualifier:
    id: transgene:overexpressed_gene
    name: gene
    dimension: text
- add_term:
    field: measure
    id: measure:reporter_activity
    label: reporter gene activity
    parent: null
    dimension: dimensionless
    definition: Signal of a reporter gene driven by a stated pathway or response element (qualifier reporter), usually divided
      by a constitutive control reporter.
    scope: Activity of an introduced reporter construct; not the mRNA level of an endogenous gene (gene expression) and not a
      protein's amount (protein level).
    qualifiers:
      reporter: {dimension: text}
# ---------------------------------------------------------------- synonyms
- add_synonym:
    id: platform:micropost_array
    text: silicone microposts
    anchor: Arrays of silicone microposts were fabricated by casting polydimethylsiloxane (PDMS)
- add_synonym:
    id: preparation:lysate
    text: homogenized
    anchor: collected in PBS, and homogenized
- add_synonym:
    id: preparation:lysate
    text: total protein
    anchor: Total protein was acquired from control cardiomyocytes or cardiomyocytes after 15 and 30 min of fatty acid treatment
- add_synonym:
    id: preparation:dissociated_cells
    text: single cardiomyocytes
    anchor: Only the contractile forces of single cardiomyocytes (no junctions with adjacent cells) with obvious beating
- add_synonym:
    id: measure:cell_circularity
    text: circularity index
    anchor: in cell area (C), circularity index (D), and sarcomere length (E)
- add_synonym:
    id: measure:cell_capacitance
    text: membrane capacitance
    anchor: (C) Analysis of cardiomyocyte membrane capacitance.
# ---------------------------------------------------------------- standing keys
- standing_key:
    measure: measure:reporter_activity
    value:
      must_match: [platform@1, preparation, cell_line, measure.reporter, measure.expressed_as, measure.normalised_to,
        treatment, genotype, disease_model]
      may_vary: [day_of_measurement]
    direction:
      must_match: [contrast, measure.reporter]
      may_vary: [cell_line, day_of_measurement]
