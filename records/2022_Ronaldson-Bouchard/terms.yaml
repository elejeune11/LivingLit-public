mappings:
- field: maturation_strategy
  stated: ramping of shear stress
  terms:
  - maturation_strategy:shear_stress_conditioning
  note: the paper's words are 'a slow ramping of the applied shear stress', so no synonym
- field: mechanical_load
  stated: zero stress
  terms:
  - mechanical_load:fluid_shear_stress
  qualifiers:
    shear_stress: zero
  note: 'the static arm of ''zero stress, 1.88 and 6.27 dynes cm−2'': the same load at size zero'
- field: maturation_strategy
  stated: electromechanical stimulation
  terms:
  - maturation_strategy:intensity_training
  note: the record's qualifiers (2 to 6 Hz, 0.33 Hz per day) make it a frequency ramp; the words alone are broader than intensity
    training, so no synonym
- field: maturation_strategy
  stated: 3D co-culture
  terms:
  - maturation_strategy:co_culture
  split:
  - words: 3D
    field: platform
  note: '''3D'' is the construct format; in unit ED3e it also contradicts the group platform ''2D monolayer'' (see log)'
- field: platform
  stated: Isolated
  terms:
  - platform:single_tissue_culture
  note: '''tissues cultured individually, with and without endothelial barriers''; no synonym, the bare word is too generic'
- field: platform
  stated: 3D tissue
  terms:
  - platform:engineered_3d
  note: not printed in the text (figure label), so no synonym
- field: platform
  stated: Static with Mesh
  terms:
  - platform:porous_mesh_insert
  split:
  - words: Static
    field: maturation_strategy
- field: platform
  stated: Static with EC Barrier
  terms:
  - platform:porous_mesh_insert
  split:
  - words: Static
    field: maturation_strategy
  - words: EC Barrier
    field: endothelial_cell
- field: platform
  stated: Perfused with Mesh (no barrier)
  terms:
  - platform:porous_mesh_insert
  split:
  - words: Perfused
    field: maturation_strategy
  - words: no barrier
    field: endothelial_cell
- field: platform
  stated: Perfused with EC Barrier
  terms:
  - platform:porous_mesh_insert
  split:
  - words: Perfused
    field: maturation_strategy
  - words: EC Barrier
    field: endothelial_cell
- field: donor_age
  stated: paediatric
  flag:
    kind: not a context
    note: donor_age is a quantity with the states fetal, neonatal, newborn, infant, young and adult; 'paediatric' is neither
      a number nor a declared state and spans several of them; the reader should give the clinical cohort's printed ages or
      leave the field not stated
- field: treatment
  stated: astemizol
  terms:
  - CHEBI:2896
  note: paper's spelling of astemizole, printed only in a figure
- field: measure
  stated: vascular barrier TEER (unit area resistance)
  terms:
  - measure:transepithelial_electrical_resistance
