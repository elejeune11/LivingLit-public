    item: F3mn_force_per_cm
    group: cmonly
    formula: Nc = a + b + c
    anchor:
      quote: patches that contained the same total number of cells but were composed of only hiPSC-CMs
      where: Results, Functional assessment of hCMPs in vitro
      file: nihms936001.pdf
    library:
      formula: sum_of_three_parts
      vars:
        t: Nc
        a: a
        b: b
        c: c
    inputs:
      a:
        printed: 1 million
        unit: cells
        kind: constant
        anchor: &id015
          quote: 1 million hiPSC-CMs, 0.5 million hiPSC-ECs, and 0.5 million hiPSC-SMCs
          where: Supplemental Methods, Force generation assessment
          file: NIHMS936001-supplement-Supple_manuscript.pdf
      b:
        printed: 0.5 million
        unit: cells
        kind: constant
        anchor: *id015
      c:
        printed: 0.5 million
        unit: cells
        kind: constant
        anchor: *id015
    note: CM-only force patches hold the force-test hCMP total (1 + 0.5 + 0.5 million) as CMs; "million" is a word, so these numbers are in 10^6 cells
  F3mn_force_per_cm.per_cm_tri:
    item: F3mn_force_per_cm
    group: tri
    formula: f = F/N
    anchor: &id016
      quote: the amount of force generated per cardiomyocyte was approximately twice as great in the hCMPs
      where: Results, Functional assessment of hCMPs in vitro
      file: nihms936001.pdf
    library:
      formula: ratio_def
      vars:
        r: f
        a: F
        b: N
    inputs:
      F:
        item: F3mn_total_force
        kind: per sample
      N:
        printed: 1 million
        unit: cells
        kind: constant
        anchor: *id015
        note: 'printed as "1 million": 10^6 cells'
    output: F3mn_force_per_cm.values.per_myocyte_discussion
    aggregation: not stated
    note: the 1.1 nN/myocyte of the Discussion; the Figure 3M forces are not read (no readings)
