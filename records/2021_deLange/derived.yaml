  F2m_APD_ratio.ratio:
    item: F2m_APD_ratio
    group: ect
    measure: APD40-30/80-70 ratio
    formula: r = (x1 - x2)/(y1 - y2)
    anchor:
      quote: ADP40-30/80-70 ratio
      where: Results
    library:
      formula: ratio_of_differences
      vars:
        r: r
        x1: x1
        x2: x2
        y1: y1
        y2: y2
    inputs:
      x1:
        not_stated: true
        kind: per sample
        note: APD40 not printed
      x2:
        not_stated: true
        kind: per sample
        note: APD30 not printed
      y1:
        not_stated: true
        kind: per sample
        note: APD80 not printed
      y2:
        not_stated: true
        kind: per sample
        note: APD70 not printed
    output: F2m_APD_ratio.values.apd_ratio_text
