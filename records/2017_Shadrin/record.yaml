        printed: '8.1'
        unit: '%'
        group: w3
        spread: SEM
        spread_source: legend
      ki67_w3_sem:
        printed: '1.1'
        unit: '%'
        kind: sem
        group: w3
    n: *id007
    anchor: *id008
  F1g_w2_vs_w1:
    unit: F1g
    measure: Ki67+ cardiomyocytes
    method: immunostaining for Ki67 and Nkx2.5, confocal
    software: ImageJ
    finding: Ki67+ CMs differed between w1 and w2
    compares:
    - w2
    - w1
    n: *id007
    stats:
