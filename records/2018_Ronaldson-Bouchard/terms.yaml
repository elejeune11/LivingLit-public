mappings:
- field: cm_medium
  stated: RPMI + B27
  terms:
  - cm_medium:rpmi_1640
  split:
  - words: B27
    field: supplements
  note: B27 is a supplement mixture (supplements:b27); cm_medium holds the base medium, so B27 is a split request to supplements.
- field: pacing
  stated: voltage clamp
  flag:
    kind: not a context
    note: voltage clamp is a recording mode (method), not pacing; the cells are not paced
- field: platform
  stated: fetal cardiac tissue strip
  terms:
  - platform:fetal_heart_tissue
  note: strip format of the fetal benchmark tissue
- field: platform
  stated: adult left ventricle tissue
  terms:
  - platform:adult_heart_tissue
  note: left-ventricular origin is not a separate term
- field: measure
  stated: gene expression, conduction genes (SCN5A, KCNJ2, KCND3, ITPR3, HCN2, SCN1B, HCN4, HCN1, KCNJ8, KCNH2)
  flag:
    kind: several measures
    note: a panel of genes in one value; each gene is its own measure (measure.gene)
- field: measure
  stated: gene expression, maturation genes (NPPA, NPPB, MAPK1, PRKACA)
  flag:
    kind: several measures
    note: a panel of genes in one value; each gene is its own measure (measure.gene)
- field: measure
  stated: gene expression, structural genes (TNNT2, GJA1, TNNI3, MYH6, MYH7, MYH7/MYH6, AKAP6, GJA5, JPH2)
  flag:
    kind: several measures
    note: a panel of genes in one value; each gene is its own measure (measure.gene)
- field: measure
  stated: gene expression, energetics genes (PRKAA1, TFAM, PPARGC1A, PPA1, PTPA, SLC2A4)
  flag:
    kind: several measures
    note: a panel of genes in one value; each gene is its own measure (measure.gene)
- field: measure
  stated: gene expression, calcium genes (CACNA1C, RYR2, CASQ2, PLN, CAMK2B, TRDN, CAV3, BIN1, AMPH, ATP2A2)
  flag:
    kind: several measures
    note: a panel of genes in one value; each gene is its own measure (measure.gene)
- field: measure
  stated: gene expression (structural, calcium handling, conduction, energetics, maturation genes)
  flag:
    kind: several measures
    note: a panel of genes in one value; each gene is its own measure (measure.gene)
- field: measure
  stated: SCN5A expression
  terms:
