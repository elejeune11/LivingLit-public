  F2_vel_K4vK1.velocity:
    item: F2_vel_K4vK1
    measure: shortening velocity
    formula: not stated
    anchor: not stated
    no_formula: method stated only by citation [27] ("as previously described")
    inputs:
      d:
        not_stated: true
        kind: per sample
        note: flexible-post deflection over time
      method:
        by_reference:
          citation: ref27
          anchor: &id004
            quote: Twitch force, velocity, power, and work were then calculated from the deflection of the flexible post and
              its bending stiffness, as previously described [27]
            where: Section 2.3
        kind: not stated
    alternatives:
    - label: rate of post deflection
      formula: v = dd/dt
    note: the same method holds for every F2 shortening velocity item; plotted values are maxima during contraction
  F2_power_K4vK1.power:
    item: F2_power_K4vK1
