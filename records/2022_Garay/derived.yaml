  F4C_degs_SP30_vs_D30.total:
    item: F4C_degs_SP30_vs_D30
    formula: t = only + shared
    anchor: &id002
      quote: with 308 DEGs in common (Figure 4C)
      where: Results, Transcriptional profile
    library:
      formula: sum_of_parts
      vars:
        t: t
        a: only
        b: shared
    inputs:
      only:
        value: F4C_degs_SP30_vs_D30.values.degs_only_fig
        kind: constant
      shared:
        value: F4C_degs_shared.values.degs_text
        kind: constant
    output: F4C_degs_SP30_vs_D30.values.degs_text
    note: A comparison's DEGs are those in its own Venn region plus the 308 in common.
  F4C_degs_D90_vs_D30.total:
    item: F4C_degs_D90_vs_D30
    formula: t = only + shared
    anchor: *id002
    library:
      formula: sum_of_parts
      vars:
        t: t
        a: only
        b: shared
    inputs:
      only:
        value: F4C_degs_D90_vs_D30.values.degs_only_fig
        kind: constant
      shared:
        value: F4C_degs_shared.values.degs_text
        kind: constant
    output: F4C_degs_D90_vs_D30.values.degs_text
    note: A comparison's DEGs are those in its own Venn region plus the 308 in common.
  F4C_degs_shared.venn_union:
    item: F4C_degs_shared
    formula: u = a + b + c
    anchor: *id002
    library:
      formula: sum_of_three_parts
      vars:
        t: u
        a: a
        b: b
        c: c
    inputs:
      a:
        value: F4C_degs_SP30_vs_D30.values.degs_only_fig
        kind: constant
      b:
        value: F4C_degs_shared.values.degs_text
        kind: constant
      c:
        value: F4C_degs_D90_vs_D30.values.degs_only_fig
        kind: constant
    note: 'Intermediate: all DEGs in the two-set Venn diagram (no printed value).'
  F4C_degs_SP30_vs_D30.venn_pct:
    item: F4C_degs_SP30_vs_D30
    formula: p = a/u
    anchor: not stated
    library:
      formula: ratio_def
      vars:
        r: p
        a: a
        b: u
    inputs:
      a:
        value: F4C_degs_SP30_vs_D30.values.degs_only_fig
        kind: constant
      u:
        derived: F4C_degs_shared.venn_union
        kind: constant
    output: F4C_degs_SP30_vs_D30.values.degs_only_pct_fig
    alternatives:
    - label: 'denominator: the two comparisons'' DEG totals summed (713 + 2,402; shared genes counted twice)'
      formula: p = a/(713 + 2402)
    note: The Venn diagram prints a percent per region without naming its denominator; taken as all genes in the diagram.
  F4C_degs_D90_vs_D30.venn_pct:
    item: F4C_degs_D90_vs_D30
