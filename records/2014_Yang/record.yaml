evidence:
  F1C_area:
    unit: F1CE
    measure: cell area
    method: co-staining of F-actin and α-actinin; confocal images processed and quantified using NIS Elements
    software: NIS Elements
    finding: Cell area is larger in T3-treated than in control cells.
    compares: [t3, control]
    n: {printed: n > 100 per condition, counts: not stated}
    values:
      area_control: {printed: '604', unit: μm2, kind: mean, group: control, spread: SEM, spread_source: methods}
      area_control_sem: {printed: '28', unit: μm2, kind: sem, group: control}
      area_t3: {printed: '991', unit: μm2, kind: mean, group: t3, spread: SEM, spread_source: methods}
      area_t3_sem: {printed: '58', unit: μm2, kind: sem, group: t3}
    stats:
      test: ANOVA with Student–Newman–Keuls post hoc testing
      p: P < 0.001
      p_values:
      - p: '#P < 0.001'
        anchor: {quote: '# P<0.001, *P<0.05', where: Fig. 1 legend, file: nihms-586803.pdf}
    anchor:
      quote: We observed a significant increase in cell size (cell area) in T3-treated cells compared with control cells (604 ± 28
      where: Results 3.1
  F1D_circularity:
    unit: F1CE
    measure: circularity index
    method: immunocytochemistry; images quantified using NIS Elements
    software: NIS Elements
    definition: Circularity = 4π · Area / Perimeter2; 0 for a line, 1 for a perfect circle
    finding: Circularity index is lower in T3-treated than in control cells.
    compares: [t3, control]
    n: {printed: n > 100 per condition, counts: not stated}
    values:
      circ_control: {printed: '0.66', unit: dimensionless, kind: mean, group: control, spread: SEM, spread_source: methods}
      circ_control_sem: {printed: '0.03', unit: dimensionless, kind: sem, group: control}
      circ_t3: {printed: '0.54', unit: dimensionless, kind: mean, group: t3, spread: SEM, spread_source: methods}
      circ_t3_sem: {printed: '0.02', unit: dimensionless, kind: sem, group: t3}
    stats:
      test: ANOVA with Student–Newman–Keuls post hoc testing
      p: P = 0.004
      p_values:
      - p: '*P < 0.05'
        anchor: {quote: '# P<0.001, *P<0.05', where: Fig. 1 legend, file: nihms-586803.pdf}
    anchor:
      quote: T3-treatment resulted in a decreased circularity index (0.66 ± 0.03 vs 0.54 ± 0.02
      where: Results 3.1
  F1E_sarcomere:
    unit: F1CE
    measure: sarcomere length
    method: myofibrils with at least ten continuous α-actinin+ bands; length divided by the number of sarcomeres
    software: NIS Elements
    definition: distance between Z-disks
    finding: Sarcomere length is longer in T3-treated than in control cells.
    compares: [t3, control]
    n: {printed: n > 100 per condition, counts: not stated}
    values:
      sarc_control_results: {printed: '1.67', unit: μm, kind: mean, group: control, spread: SEM, spread_source: methods}
      sarc_control_sem_results: {printed: '0.02', unit: μm, kind: sem, group: control}
      sarc_t3_results: {printed: '1.73', unit: μm, kind: mean, group: t3, spread: SEM, spread_source: methods}
      sarc_t3_sem_results: {printed: '0.01', unit: μm, kind: sem, group: t3}
      sarc_control_discussion: {printed: '1.67', unit: μm, kind: mean, group: control, spread: SEM, spread_source: methods}
      sarc_control_sem_discussion: {printed: '0.02', unit: μm, kind: sem, group: control}
      sarc_t3_discussion: {printed: '1.73', unit: μm, kind: mean, group: t3, spread: SEM, spread_source: methods}
      sarc_t3_sem_discussion: {printed: '0.01', unit: μm, kind: sem, group: t3}
    stats:
      test: ANOVA with Student–Newman–Keuls post hoc testing
      p: P = 0.006
      p_values:
      - p: '*P < 0.05'
        anchor: {quote: '# P<0.001, *P<0.05', where: Fig. 1 legend, file: nihms-586803.pdf}
    anchor:
      quote: increased from 1.67 ± 0.02 μm in untreated controls to 1.73 ± 0.01 μm
      where: Results 3.1 (repeated in the Discussion)
  F1F_amhc:
    unit: F1F
    measure: α-MHC expression
    method: quantitative RT-PCR, SYBR green on an ABI 7900HT; normalized first to HPRT mRNA levels and then to untreated control levels
    software: not stated
    finding: α-MHC is up-regulated in T3-treated cells relative to control.
    compares: [t3, control]
    values:
      amhc_fold: {printed: '7.3', unit: fold, kind: ratio, between: [t3, control], expressed_as: fold, normalised_to: untreated
          control levels, spread: SEM, spread_source: methods}
      amhc_fold_sem: {printed: '1.9', unit: fold, kind: sem, between: [t3, control]}
    anchor:
      quote: we observed α-MHC up-regulation (7.3 ± 1.9-fold vs. control)
      where: Results 3.1
  F1F_bmhc:
    unit: F1F
    measure: β-MHC expression
    method: quantitative RT-PCR, SYBR green on an ABI 7900HT; normalized first to HPRT mRNA levels and then to untreated control levels
    software: not stated
    finding: β-MHC is down-regulated in T3-treated cells relative to control.
    compares: [t3, control]
    values:
      bmhc_fold: {printed: '0.5', unit: fold, kind: ratio, between: [t3, control], expressed_as: fold, normalised_to: untreated
          control levels, spread: SEM, spread_source: methods}
      bmhc_fold_sem: {printed: '0.2', unit: fold, kind: sem, between: [t3, control]}
    anchor:
      quote: β-MHC down-regulation (0.5 ± 0.2-fold vs. control)
      where: Results 3.1
  F1F_serca:
    unit: F1F
    measure: SERCA2a expression
    method: quantitative RT-PCR, SYBR green on an ABI 7900HT; normalized first to HPRT mRNA levels and then to untreated control levels
    software: not stated
    finding: SERCA2a expression is increased in T3-treated cells relative to control.
    compares: [t3, control]
    values:
      serca_fold: {printed: '3.9', unit: fold, kind: ratio, between: [t3, control], expressed_as: fold, normalised_to: untreated
          control levels, spread: SEM, spread_source: methods}
      serca_fold_sem: {printed: '0.9', unit: fold, kind: sem, between: [t3, control]}
    anchor:
      quote: an increase of sarcoendoplasmic reticulum ATPase (SERCA2a) expression (3.9 ± 0.9-fold vs. control)
      where: Results 3.1
  TXT1_cm_percentage:
    unit: TXT1
    measure: cardiomyocyte percentage
    method: immunocytochemistry with α-actinin as a cardiomyocyte marker and Hoechst 33342 nuclear counterstain
    finding: T3 treatment does not change cardiomyocyte percentage.
    compares: [t3, control]
    stated_direction:
      direction: none
      anchor: {quote: showed that T3 treatment does not lead to a change in cardiomyocyte percentage, where: Results 3.1}
    anchor:
      quote: showed that T3 treatment does not lead to a change in cardiomyocyte percentage
      where: Results 3.1
  TXT2_n2ba:
    unit: TXT2
    measure: titin N2BA isoform expression
    method: Q-RT-PCR with primers from [19]
    finding: One week of T3 did not change N2BA expression (data not shown).
    compares: [t3, control]
    stated_direction:
      direction: none
      anchor: {quote: One week of T3 treatment did not change the expression level of either isoform (data not shown), where: Results
          3.1}
    anchor:
      quote: One week of T3 treatment did not change the expression level of either isoform (data not shown)
      where: Results 3.1
  TXT2_n2b:
    unit: TXT2
    measure: titin N2B isoform expression
    method: Q-RT-PCR with primers from [19]
    finding: One week of T3 did not change N2B expression (data not shown).
    compares: [t3, control]
    stated_direction:
      direction: none
      anchor: {quote: One week of T3 treatment did not change the expression level of either isoform (data not shown), where: Results
          3.1}
    anchor:
      quote: One week of T3 treatment did not change the expression level of either isoform (data not shown)
      where: Results 3.1
  TXT2_dominant:
    unit: TXT2
    measure: titin isoform expression (N2BA and N2B)
    method: Q-RT-PCR with primers from [19]
    finding: Both N2BA and N2B are expressed, N2BA being dominant.
    groups: [control, t3]
    note: a comparison between two measures in the same samples (N2BA against N2B); no values printed
    anchor:
      quote: Both N2BA and N2B isoforms were expressed with N2BA being the dominant one
      where: Results 3.1
  TXT3_amhc_2p5d:
    unit: TXT3
    measure: α-MHC expression
    finding: α-MHC up-regulated 4.35-fold after 2.5 days of T3.
    compares: [t3_2p5d, control]
    values:
      amhc_2p5d: {printed: '4.35', unit: fold, kind: ratio, between: [t3_2p5d, control], expressed_as: fold, spread: none}
    anchor:
      quote: We observed a 4.35-fold and a 10.78-fold upregulation of α-MHC after 2.5 and 14 days treatment
      where: Results 3.1
  TXT3_amhc_14d:
    unit: TXT3
    measure: α-MHC expression
