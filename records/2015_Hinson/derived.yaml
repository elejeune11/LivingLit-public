  F1F_pWT.fold_pWT:
    item: F1F_pWT
    measure: twitch force
    formula: fold = F_high/F_low
    anchor:
      quote: At higher load, pWT CMTs produced a two-fold increase in force
      where: Results, mechanical load
    library:
      formula: ratio_def
      vars:
        r: fold
        a: F_high
        b: F_low
    inputs:
      F_high:
        derived: F1F_pWT.force_pWT_high
        kind: per sample
      F_low:
        derived: F1F_pWT.force_pWT_low
        kind: per sample
    output: F1F_pWT.values.fold_pWT
    aggregation: not stated
    alternatives:
    - label: '''two-fold increase'' as a relative change (relative_change)'
      formula: fold = (F_high - F_low)/F_low
    note: groups pWT_high over pWT_low; printed 'two-fold' has no numeral
  F1F_high.fold_high:
    item: F1F_high
    measure: twitch force
    formula: fold = F_wt/F_mut
    anchor:
      quote: greater than four-fold more than that produced by pP22582fs+/− CMTs
      where: Results, mechanical load
    library:
      formula: ratio_def
      vars:
        r: fold
        a: F_wt
        b: F_mut
    inputs:
      F_wt:
        derived: F1F_pWT.force_pWT_high
        kind: per sample
      F_mut:
        derived: F1F_high.force_pP22582fs_high
        kind: per sample
    output: F1F_high.values.fold_high
    aggregation: not stated
    alternatives:
    - label: ratio of the load-induced increases (the Δ of Fig. 1F)
      formula: fold = (F_wt_high - F_wt_low)/(F_mut_high - F_mut_low)
    note: the sentence may compare the increases rather than the forces at high load; printed 'greater than four-fold' has
      no numeral
  TXT3_exon66.fold:
    item: TXT3_exon66
    measure: proportion of TTN transcripts including exon 66
    formula: fold = p_ipscm/p_lv
    anchor:
      quote: 5-fold more than adult LV (18% of TTN transcripts contained exon 66)
      where: Results, I-band versus A-band
    library:
      formula: ratio_def
      vars:
        r: fold
        a: p_ipscm
        b: p_lv
    inputs:
      p_ipscm:
        value: TXT3_exon66.values.psi_ipscm
        kind: constant
        note: 'printed ''>80'': a lower bound, not a value'
      p_lv:
        value: TXT3_exon66.values.psi_lv
        kind: constant
    output: TXT3_exon66.values.fold
    alternatives:
    - label: '''5-fold more'' as a relative change (relative_change)'
      formula: fold = (p_ipscm - p_lv)/p_lv
  T1D_alleles.mutant_share:
    item: T1D_alleles
    group: pP22582fs
    measure: allele-specific TTN RNA expression
    formula: f = m/(m + w)
    anchor:
      quote: Ratio
      where: Table S1 (D), header of column F, next to the mutant and WT allele counts
      file: NIHMS727908-supplement-Supplemental_Table.xlsx
      kind: dataset cell
    library:
      formula: part_of_whole
      vars:
        f: f
        a: m
        b: w
    inputs:
      m:
        value: T1D_alleles.values.mutant_count
        kind: constant
      w:
        value: T1D_alleles.values.wt_count
        kind: constant
    output: T1D_alleles.values.ratio
    alternatives:
    - label: mutant:WT count ratio (ratio_def)
      formula: f = m/w
    note: the column is headed 'Ratio' and prints '0.53/0.47'; read here as the mutant and WT shares of the two counts (the
      first number is the output)
  F2D_pP22582fs.epsilon:
    item: F2D_pP22582fs
    measure: sarcomere organization (ɛ)
    formula: eps = en/en_max
    anchor: &id004
      quote: The energy of sarcomere assembly was normalized to the maximum value observed for each condition
      where: Methods, sarcomere analysis
      file: NIHMS727908-supplement-Supplemental_text_and_figures.pdf
    library:
      formula: ratio_def
      vars:
        r: eps
        a: en
        b: en_max
    inputs:
      en:
        not_stated: true
        kind: per sample
        note: area under the first nonzero peak of the fitted periodic component
      en_max:
        not_stated: true
        kind: constant
        note: maximum value observed for the condition (un-patterned cells or tissue)
