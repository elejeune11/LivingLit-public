  F4C_purity.eff:
    item: F4C_purity
    group: cms
    measure: differentiation efficiency (α-actinin-positive cells)
    formula: eff = ppos - pneg
    anchor:
      quote: the percentage of α-actinin-positive cells subtracted by negative control
      where: Online Methods, Cell Characterization – Flow Cytometry
      file: NIHMS733623-supplement-306874DR2_Online_Data_Supplement.pdf
    library:
      formula: sum_of_parts
      vars:
        t: ppos
        a: eff
        b: pneg
    inputs:
      ppos: *id002
      pneg: *id002
    output: F4C_purity.values.eff
    note: printed as a bound (>85%), so there is no single value to rebuild
