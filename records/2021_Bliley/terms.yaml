mappings:
# ---------------------------------------------------------------- context
- field: platform
  stated: PDMS strip EHT
  terms: [platform:tissue_on_strip]
  note: the strip's load now sits in mechanical_load (stiffness 1×, 4×, 8×, 12×, strip thickness as qualifiers)
- field: platform
  stated: control heart tissue
  terms: [platform:native_tissue]
  note: the source's 'control heart' compared with the patient's explanted heart; donor age not stated, so not adult or fetal tissue
- field: mechanical_load
  stated: dynamic loading
  terms: [mechanical_load:auxotonic]
  note: the strip is free to bend and the tissue beats 'in an unconstrained manner against the PDMS strip', shortening each beat; no synonym added because 'dynamic loading' elsewhere can mean imposed cyclic stretch
- field: mechanical_load
  stated: PDMS strip load
  terms: [mechanical_load:strip_load]
  note: units characterising the strips (finite element model, dog-bone specimens, force transducer, tissue composition); constrained or dynamic culture is not stated there
- field: preparation
  stated: intact monolayer
  terms: [preparation:live_cells]
  note: living 2D monolayers imaged with a voltage dye
- field: cell_line
  stated: DSPmut patient hiPSC line
  terms: [cell_line:dspmut_patient_ipsc]
- field: cell_line
  stated: control wild-type hiPSC line
  terms: [cell_line:dspmut_control_ipsc]
- field: disease_model
  stated: arrhythmogenic cardiomyopathy
  terms: [MONDO:0004994]
  no_ontology_term: arrhythmogenic cardiomyopathy (biventricular ACM; MONDO has only the right-ventricular and syndromic forms)
- field: genotype
  stated: DSP c.273+5G>A + DSP c.6687delA
  terms: [genotype:dsp_variant]
  qualifiers: {gene: DSP, variant: c.273+5G>A + c.6687delA}
  note: the record's note says one variant on each allele; zygosity is not printed as a word
- field: cm_medium
  stated: RPMI medium (without phenol red) containing HEPES
  terms: [cm_medium:rpmi_1640]
  qualifiers: {formulation: without phenol red}
  split:
  - {words: containing HEPES, field: supplements}
  note: measurement medium for the voltage-dye recordings
# ---------------------------------------------------------------- measures
- field: measure
  stated: tensile force applied to the tissue
  terms: [measure:applied_tissue_load]
- field: measure
  stated: strip bending reaction force (x and z components)
  terms: [measure:strip_bending_force]
  qualifiers: {component: x and z}
  note: the item compares the two components of one simulated force
- field: measure
  stated: elastic modulus of PDMS strip
  terms: [measure:elastic_modulus]
  qualifiers: {specimen: PDMS strip}
- field: measure
  stated: tissue elastic modulus
  terms: [measure:elastic_modulus]
  qualifiers: {specimen: tissue}
- field: measure
  stated: diastolic tissue length
  terms: [measure:tissue_length]
  qualifiers: {phase: diastolic}
- field: measure
  stated: cardiomyocyte stress trace
  terms: [measure:stress_trace]
- field: measure
  stated: normalized cardiomyocyte twitch stress trace
  terms: [measure:stress_trace]
  qualifiers: {expressed_as: normalised}
  note: what the trace is divided by is not printed
- field: measure
  stated: orientational order parameter
  terms: [measure:actin_order_parameter]
  note: computed from actin filament angles (item method)
- field: measure
  stated: actin angle distribution
  terms: [measure:orientation_distribution]
  qualifiers: {structure: actin filaments}
- field: measure
  stated: MYH6/MYH7 mRNA expression
  terms: [measure:gene_expression]
  qualifiers: {gene: MYH6/MYH7, expressed_as: fold, normalised_to: 1× constrained loading condition}
  note: a ratio of two genes' expression
- field: measure
  stated: NPPB mRNA expression
  terms: [measure:gene_expression]
  qualifiers: {gene: NPPB, expressed_as: fold, normalised_to: 1× constrained loading condition}
- field: measure
  stated: TTN-N2B mRNA expression
  terms: [measure:gene_expression]
  qualifiers: {gene: TTN-N2B, expressed_as: fold, normalised_to: 1× constrained loading condition}
- field: measure
