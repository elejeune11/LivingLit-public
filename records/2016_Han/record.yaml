  F7_rate_al_tcp:
    unit: F7
    measure: calcium transient frequency
    finding: beat rate lower on aligned scaffolds than on TCPs
    compares:
    - al
    - tcp
    method: Fluo-4 AM line-scan confocal imaging of spontaneous calcium transients
    software: Clampfit, Axon pCLAMP 10
    n: &id026
      printed: TCPs (n = 52), aligned (n = 62) and random fibrous scaffolds (n = 58)
      counts: cells from three independent experiments
      per_group:
        tcp: '52'
        al: '62'
        ra: '58'
    values:
      rate_al_text:
        printed: '19'
        unit: bpm
        kind: mean
        group: al
        spread: SEM
        spread_source: methods
      rate_al_sem_text:
        printed: '10'
        unit: bpm
        kind: sem
        group: al
        spread: none
        suspected_error: &id027
          what: spread of the aligned and random beat rates
          why: text prints 19 ± 10 and 22 ± 14 bpm as mean ± SE, but Fig. 7D error bars for these groups are about 1–2 bpm; an SE of 10 with n
            = 62 implies an SD near 80 bpm
      rate_tcp_text:
        printed: '29'
        unit: bpm
        kind: mean
        group: tcp
        spread: SEM
        spread_source: methods
      rate_tcp_sem_text:
        printed: '1'
        unit: bpm
        kind: sem
        group: tcp
        spread: none
    stats:
      test: Kruskal–Wallis one-way ANOVA on ranks using Dunn's method for pairwise multiple comparisons
      p: p < 0.05
    anchor: &id028
      quote: the average beating rates of cells from cultures on the two fibers were significantly lower (19 ± 10 bpm for aligned fibers, 22 ±
        14 bpm for random fibers)
      where: Results 3.6
