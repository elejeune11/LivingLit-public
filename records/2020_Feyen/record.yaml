      quote: Expression (qPCR) of adult/fetal ratio of SCN5a was higher in maturation media compared to RPMI/B27 cultured iPSC-CMs (n=4 batches).
      where: Fig. S6B legend
      file: mmc1.pdf
    compares:
    - mm
    - rpmi
    n:
      printed: n=4 batches
      counts: batches
    stats:
      test: not stated
      statistic: not stated
      p: p < 0.05 (Methods)
    method: qRT-PCR of adult and fetal SCN5a isoforms, ΔΔCt method
    stated_direction:
      direction: up
      anchor:
        quote: the expression of adult-SCN5a isoform (Veerman et al., 2017) (Figure S6B)
        where: Results, Phenotypic Manifestation of LQT under MM Conditions
  S6F_gmax:
    unit: S6F
    measure: maximal Na+ conductance (Gmax), absolute
    finding: absolute Gmax was higher in MM but not significantly
    anchor:
      quote: Absolute (not Cm-normalized) Gmax from the IV sets showed an elevated non-significant Gmax in MM- iPSC-CMs
      where: Fig. S6F legend
      file: mmc1.pdf
    compares:
    - mm
    - rpmi
    stats:
      test: not stated
      statistic: not stated
      p: non-significant
    method: whole-cell ruptured patch clamp; peak INa versus Em fitted to a Boltzmann activation function
    software: pClamp10.4
    stated_direction:
      direction: up
      anchor:
        quote: showed an elevated non-significant Gmax in MM- iPSC-CMs
        where: Fig. S6F legend
        file: mmc1.pdf
  S6G_cm:
    unit: S6G
    measure: cell capacitance (Cm)
    finding: capacitance was higher in MM than in RPMI/B27
    anchor:
      quote: Maturation cells have significantly higher capacitance than RPMI-CMs.
      where: Fig. S6G legend
      file: mmc1.pdf
    compares:
    - mm
    - rpmi
    stats:
      test: not stated
      statistic: not stated
      p: p < 0.05 (Methods)
    method: whole-cell ruptured patch clamp
    stated_direction:
      direction: up
      anchor:
        quote: Maturation cells have significantly higher capacitance than RPMI-CMs.
        where: Fig. S6G legend
        file: mmc1.pdf
  S7A_lactate:
    unit: S7A
    measure: lactate concentration in the medium
    finding: control EHT media held more lactate than MM at 24 h
    anchor:
      quote: Significantly more lactate was produced in control media compared to MM at 24h timepoint.
      where: Fig. S7A legend
      file: mmc1.pdf
    compares:
    - mm
    - ctr
    n:
      printed: n=14-23 EHT / 3 batches
      counts: EHTs and batches
    stats:
      test: not stated
      statistic: not stated
      p: p < 0.05 (Methods)
    method: blood gas analyzer (Radiometer ABL90) on medium samples
    stated_direction:
      direction: down
      anchor:
        quote: Significantly more lactate was produced in control media compared to MM at 24h timepoint.
        where: Fig. S7A legend
        file: mmc1.pdf
  S7A_glucose:
    unit: S7A
    measure: glucose concentration in the medium
    finding: glucose concentration in both media over the refeeding interval
    anchor:
      quote: Concentration of glucose (left) and lactate (right, dotted line) in serum containing control media (ctr, blue) or maturation medium (MM, red)
      where: Fig. S7A legend
      file: mmc1.pdf
    compares:
    - mm
    - ctr
    n:
      printed: n=14-23 EHT / 3 batches
      counts: EHTs and batches
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    method: blood gas analyzer (Radiometer ABL90) on medium samples
  S7B_ratio:
    unit: S7B
    measure: lactate production / glucose consumption ratio
    finding: MM EHTs produced less lactate per glucose consumed
    anchor:
      quote: EHTs in MM showed less lactate production relative to glucose consumption (Figures S7A and S7B), indicating increased oxidative metabolism
      where: Results, MM Improves EHT Culture
    compares:
    - mm
    - ctr
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    method: ratio calculated from the blood gas measurements of Figure S7A
    stated_direction:
      direction: down
      anchor:
        quote: EHTs in MM showed less lactate production relative to glucose consumption
        where: Results, MM Improves EHT Culture
  S7C_mtdna:
    unit: S7C
    measure: mitochondrial DNA content (ND1/ND2 to genomic DNA)
    finding: MM EHTs held more mitochondrial DNA
    anchor:
      quote: Quantitative RT-PCR of mitochondrial DNA content (ND1/ND2) depicted a significant tendency for more mitochondria in MM
      where: Fig. S7C legend
      file: mmc1.pdf
    compares:
    - mm
    - ctr
    stats:
      test: not stated
      statistic: not stated
      p: p < 0.05 (Methods)
