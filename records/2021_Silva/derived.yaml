  # ---------------------------------------------------------------- ratios with no readable inputs (recorded; cannot rebuild)
  F1E_size_ratio.ratio:
    item: F1E_size_ratio
    formula: r = a_ml/a_conv
    anchor:
      quote: multilineage microtissues growing to approximately 3 times the size of conventional microtissues by 30 days
      where: Results, Formation of heart-like compartments
    library: {formula: ratio_def, vars: {r: r, a: a_ml, b: a_conv}}
    inputs:
      a_ml: {item: F1E_area_d30, kind: not stated, note: 'mean surface area, multilineage day 30 (Fig. 1E, not read)'}
      a_conv: {item: F1E_area_d30, kind: not stated, note: 'mean surface area, conventional day 30 (Fig. 1E, not read)'}
    output: F1E_size_ratio.values.ratio_text
    aggregation: of means
    alternatives:
    - label: size as diameter
      formula: r = sqrt(a_ml/a_conv)
      note: "'size' is not defined; a 3-fold diameter would be a 9-fold projected area"
    note: "'size' taken as surface area (the sentence cites Fig. 1E). Fig. 1E is not read, so the inputs carry no values."
  S1E_ratio.ratio:
    item: S1E_ratio
    formula: r = vc/vt
    anchor:
      quote: ratio of cardiac:total volume
      where: Fig. S1E legend
    library: {formula: ratio_def, vars: {r: r, a: vc, b: vt}}
    inputs:
      vc: {item: S1E_cardiac_volume, kind: per sample}
      vt: {item: S1E_total_volume, kind: per sample}
    aggregation: not stated
    note: no values printed or readable (no_points S1E); recorded for completeness
  S1J_mlc2v.pct_area:
    item: S1J_mlc2v
    formula: pct = a_mlc2v/a_cm
    anchor:
      quote: The dynamics of the percentage area occupied by ventricular cardiomyocytes (MLC2v) over the total cardiac area
      where: Fig. S1J legend
    library: {formula: ratio_def, vars: {r: pct, a: a_mlc2v, b: a_cm}}
    inputs:
      a_mlc2v: {not_stated: true, kind: per sample, note: 'thresholded MLC2v+ area, not reported'}
      a_cm: {not_stated: true, kind: per sample, note: 'total cardiac area, not reported'}
    aggregation: not stated
    note: no values printed; recorded for completeness
