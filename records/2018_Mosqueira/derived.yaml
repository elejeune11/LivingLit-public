proposals:
- formula: sphere_volume
  kind: model
  statement: The volume of a body treated as a sphere of radius r is 4/3 pi r^3 (e.g. a cell volume from one measured size).
  equations:
  - V = 4*pi*r**3/3
  variables:
    V: volume
    r: length
  assumes:
  - spherical shape
  does_not_apply: elongated, flattened or irregular bodies (rod-shaped adult cardiomyocytes, spread cells), whose volume is
    not set by one radius
  tests:
  - given:
      r: 1.0
    expect:
      V: 4.1887902
  - given:
      r: 3.0
    expect:
      V: 113.097336
  - given:
      r: 1.0
    does_not_apply: a prolate ellipsoid with semi-axes 1, 1 and 2 has volume 8.38, not 4.19
  cites:
    text: 'Zwillinger D (ed.). CRC Standard Mathematical Tables and Formulae, 33rd ed., CRC Press 2018, section 4.6 (solids:
      sphere of radius r)'
    quote: V = 4/3 πr^3
- formula: sphere_volume_diameter
  kind: derived
  statement: The volume of a body treated as a sphere, from its diameter, is pi d^3 / 6.
  equations:
  - V = pi*d**3/6
  variables:
    V: volume
    d: length
    r: length
  assumes:
  - d = 2*r
  uses:
  - formula: sphere_volume
    subs:
      V: V
      r: r
  does_not_apply: a diameter taken as the radius (volume 8x too large), or a non-spherical body
  tests:
  - given:
      d: 2.0
    expect:
      V: 4.1887902
  - given:
      d: 10.0
    expect:
      V: 523.598776
  - given:
      d: 2.0
    does_not_apply: 'diameter used as the radius: 4/3 pi 2^3 = 33.5, not 4.19'
- formula: ratio_of_differences
  kind: derived
  statement: A ratio of two differences, (x1 - x2)/(y1 - y2), e.g. an action potential shape metric (APD80-APD70)/(APD40-APD30).
  equations:
  - r = (x1 - x2)/(y1 - y2)
  variables:
    r: D/D2
    x1: D
    x2: D
    y1: D2
    y2: D2
    p: D
    q: D2
  assumes:
  - p = x1 - x2
  - q = y1 - y2
  uses:
  - formula: ratio_def
    subs:
      r: r
      a: p
      b: q
  does_not_apply: a difference of ratios, or x1 - x2/(y1 - y2) without the numerator bracketed
  tests:
  - given:
      x1: 5.0
      x2: 3.0
      y1: 4.0
      y2: 3.0
    expect:
      r: 2.0
  - given:
      x1: 300.0
      x2: 280.0
      y1: 150.0
      y2: 140.0
    expect:
      r: 2.0
  - given:
      x1: 5.0
      x2: 3.0
      y1: 4.0
      y2: 3.0
    does_not_apply: ratio of the first terms, 5/4 = 1.25, is not the ratio of the differences (2)
- formula: difference_from_reference
  kind: derived
  statement: The change of a value from a reference, d = x - x0 (an absolute or percentage-point change), is the sum of parts
    x = x0 + d solved for d.
  equations:
  - d = x - x0
  variables:
    d: D
    x: D
    x0: D
  uses:
  - formula: sum_of_parts
    subs:
      t: x
      a: x0
      b: d
  does_not_apply: a change expressed relative to the reference ((x - x0)/x0) or as a ratio (x/x0)
  tests:
  - given:
      x: 3.0
      x0: 2.0
    expect:
      d: 1.0
  - given:
      x: 5.5
      x0: 3.6
    expect:
      d: 1.9
  - given:
      x: 3.0
      x0: 2.0
    does_not_apply: 'relative change: (3 - 2)/2 = 0.5, not 1'
