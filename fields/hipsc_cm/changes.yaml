    id: cell_line:md_186c
    label: MD-186C
    scope: The corrected isogenic line of MD-186; not the uncorrected MD-186 line.
    definition: Isogenic line of MD-186 in which the Danon-causing LAMP2 mutation was corrected with CRISPR-Cas9.
    lookup: 'cellosaurus ''MD-186'', ''MD186'', ''LAMP2'': no corrected hiPSC line'
  - event: add_term
    field: platform
    id: platform:grooved_surface
    label: grooved surface
    parent: platform:culture_2d
    definition: Cells grown on a flat surface scored or embossed with parallel micro-grooves that align them.
    scope: Topographic grooves across the whole surface (the groove maker is a qualifier); not cells confined to printed matrix
      islands (micropatterned culture), not an unpatterned monolayer, and not posts, thin films, inserts or electrode arrays.
    qualifiers:
      groove_maker:
        dimension: text
  - event: add_term
    field: preparation
    id: preparation:isolated_myofibrils
    label: isolated myofibrils
    definition: Myofibrils or myofibril bundles released from lysed cells or homogenised tissue and mounted for mechanical
      measurement.
    scope: Single myofibrils or small bundles freed from the cell; not skinned tissue strips, intact tissue, dissociated living
      cells, or extracts for molecular assays.
    synonyms:
    - text: isolated myofibrils
      anchor: we isolated myofibrils from hiPSC-CMs cultured under each condition
  - event: add_term
    field: preparation
    id: preparation:permeabilised_cells
    label: permeabilised cells
    definition: Harvested cells whose plasma membrane is chemically permeabilised so that an assay reaches intracellular enzymes
      or organelles.
    scope: Permeabilised cell suspensions for enzyme or organelle assays; not skinned muscle tissue, not isolated myofibrils,
      not lysates or extracts, and not fixed cells.
  - event: add_term
    field: preparation
    id: preparation:lipid_extract
    label: lipid extract
    definition: Lipids extracted from harvested cells or tissue (e.g. by a Bligh-Dyer method) for mass spectrometry.
    scope: Extracted lipids; not polar metabolites (metabolite extract), not RNA or DNA extracts and not a protein lysate.
  - event: add_term
    field: measurement_medium
    id: measurement_medium:activating_solution
    label: activating solution
    definition: A high-calcium solution (pCa about 4.5) that fully activates permeabilised myofilaments or myofibrils.
    scope: The calcium-activating bath of a skinned-muscle or myofibril rig; not the relaxing solution of the same rig and
      not a physiological bath for intact cells (Tyrode's, Krebs, culture medium).
  - event: add_term
    field: measurement_medium
    id: measurement_medium:relaxing_solution
    label: relaxing solution
    definition: A low-calcium solution (pCa about 9) in which permeabilised myofilaments or myofibrils are relaxed.
    scope: The relaxing bath of a skinned-muscle or myofibril rig; not the activating solution of the same rig and not a physiological
      bath for intact cells (Tyrode's, Krebs, culture medium).
  - event: add_term
    field: genotype
    id: genotype:lamp2_variant
    label: LAMP2 variant
    parent: genotype:gene_variant
    definition: Cells carrying a variant in LAMP2, the lysosome-associated membrane protein 2 gene whose loss causes Danon
      disease.
    scope: A LAMP2 variant; not variants in other genes (PKP2, DSP, MYBPC3, MYH7 and others).
  - event: add_term
    field: genotype
    id: genotype:gene_corrected
    label: gene-corrected isogenic line
    parent: genotype:wild_type
    definition: A patient line in which the disease-causing variant (gene a qualifier) was corrected by gene editing, the
      isogenic control of the patient line.
    scope: Wild type reached by editing a patient line; an unrelated healthy or unedited control is the parent wild type.
  - event: add_qualifier
    id: treatment:vehicle_not_stated
    name: control
    dimension: text
  - event: add_synonym
    id: measure:cell_circularity
    text: circularity
    anchor: To assess differences in cell morphology quantitatively, we measured cell area and circularity.
  - event: add_qualifier
    id: measure:differentially_expressed_gene_count
    name: threshold
    dimension: text
  - event: add_term
    field: measure
    id: measure:sarcomere_organisation_score
    label: sarcomere organisation score
    definition: Ordinal score of sarcomere organisation graded per cell from electron micrographs on a stated scale (qualifier
      scale).
    scope: A numeric grade from electron microscopy; not the by-eye immunostaining appearance (sarcomere organisation), not
      an order parameter and not sarcomere length.
    dimension: dimensionless
    qualifiers:
      scale:
        dimension: text
  - event: add_term
    field: measure
    id: measure:cell_to_cell_variability
    label: cell-to-cell variability
    definition: Spread of a stated measure (qualifier of_measure) across the individual cells of one group.
    scope: Spread among cells within a group; not the spread across replicate samples (variability across samples) and not
      the measure's mean.
    dimension: dimensionless
    qualifiers:
      of_measure:
        dimension: text
      statistic:
        dimension: text
  - event: add_term
    field: measure
    id: measure:lipid_species_fraction
    label: lipid species fraction
    definition: Share of one lipid species (qualifier lipid_species) in the total of its lipid class (qualifier total), by
      mass spectrometry.
    scope: The share of a lipid species within its class; not the abundance of a polar metabolite (metabolite abundance) and
      not a gene-product isoform fraction.
    dimension: dimensionless
    qualifiers:
      lipid_species:
        dimension: text
      total:
        dimension: text
  - event: add_term
    field: measure
    id: measure:myofibril_rate_constant
    label: myofibril kinetic rate constant
    definition: Rate constant of a phase of tension development or relaxation in a mounted myofibril after a rapid solution
      switch.
    scope: Rate constants of isolated myofibril or skinned-muscle mechanics; not times to a level of relaxation in a twitch
      (relaxation time) and not rates of force change (maximal rate of force rise).
    dimension: frequency
  - event: add_term
    field: measure
    id: measure:myofibril_activation_rate
    label: myofibril activation rate constant
    parent: measure:myofibril_rate_constant
    definition: Rate constant of tension development after a myofibril is switched into activating solution (kACT).
    scope: Tension development from relaxation; not tension redevelopment after a release-restretch (kTR) and not relaxation
      rate constants.
    dimension: frequency
    synonyms:
    - text: kAct
      anchor: activation kinetics (kAct), the rate constant of tension development following myofibril activation
  - event: add_term
    field: measure
    id: measure:tension_redevelopment_rate
    label: tension redevelopment rate constant
    parent: measure:myofibril_rate_constant
    definition: Rate constant of tension redevelopment after a rapid release and restretch breaks cross-bridges in an activated
      myofibril (kTR).
    scope: Redevelopment during steady activation; not tension development from relaxation (kACT) and not relaxation rate
      constants.
    dimension: frequency
    synonyms:
    - text: kTr
      anchor: reactivation kinetics (kTr), the rate constant of tension redevelopment following myofibril release/stretch
        to break cross bridges
  - event: add_term
    field: measure
    id: measure:slow_phase_relaxation_rate
    label: slow phase relaxation rate constant
    parent: measure:myofibril_rate_constant
    definition: Rate constant of the initial slow, linear phase of myofibril relaxation after the switch to relaxing solution
      (kREL,slow).
    scope: The slow linear phase; not the fast exponential phase (fast phase relaxation rate constant) and not activation
      rate constants.
    dimension: frequency
  - event: add_term
    field: measure
    id: measure:fast_phase_relaxation_rate
    label: fast phase relaxation rate constant
    parent: measure:myofibril_rate_constant
    definition: Rate constant of the fast exponential phase of myofibril relaxation (kREL,fast).
    scope: The fast exponential phase; not the slow linear phase (slow phase relaxation rate constant) and not activation
      rate constants.
    dimension: frequency
  - event: add_term
    field: measure
    id: measure:slow_phase_relaxation_duration
    label: slow phase relaxation duration
    definition: Duration of the slow linear phase of myofibril relaxation, from the switch to relaxing solution to the start
      of the fast phase (tLIN).
    scope: A myofibril relaxation phase duration; not a twitch relaxation time to a stated level and not a rate constant.
    dimension: time
  - event: add_term
    field: measure
    id: measure:calcium_activated_tension
    label: maximal calcium-activated tension
    definition: Greatest active tension per cross-sectional area of a permeabilised myofibril or muscle at full calcium activation.
    scope: Steady maximal tension under saturating calcium in a skinned preparation; not the twitch stress of an intact paced
      tissue and not resting (diastolic) stress.
    dimension: stress
  - event: add_term
    field: measure
    id: measure:myofibril_diameter
    label: myofibril diameter
    definition: Diameter of a mounted myofibril or myofibril bundle, measured from images.
    scope: A myofibril's width; not a cell, tissue, fiber, vessel or Z-disk dimension.
    dimension: length
  - event: add_term
    field: measure
    id: measure:sample_clustering
    label: clustering of samples
    definition: Grouping of samples or groups by unsupervised clustering on a stated set of measured parameters (qualifier
      features).
    scope: Clustering of samples on several parameters; not clustering of genes by their expression profiles (gene expression
      clusters).
    dimension: categorical
    qualifiers:
      features:
        dimension: text
