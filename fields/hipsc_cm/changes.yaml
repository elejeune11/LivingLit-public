  - event: add_term
    field: mechanical_load
    id: mechanical_load:static_stretch
    label: static stretch
    parent: null
    definition: An external stretch along the tissue's fibre direction imposed once and held for a stated time (qualifiers
      strain and duration).
    scope: A step stretch that lengthens the fibres and is held; not repeated stretching (cyclic stretch), not the fixed culture
      length the tissue contracts against (isometric load), and not a deformation that shears the fibres at constant fibre
      length (static shear).
    qualifiers:
      strain:
        dimension: dimensionless
      duration:
        dimension: time
  - event: add_term
    field: mechanical_load
    id: mechanical_load:static_shear
    label: static shear
    parent: null
    definition: An external in-plane deformation imposed once and held so that matrix fibres are sheared past each other while
      fibre length stays unchanged (qualifiers strain and duration).
    scope: Shear of the fibres at constant fibre length; not stretch along the fibres (static stretch), not shear stress from
      flowing medium (fluid shear stress) and not cyclic stretch.
    qualifiers:
      strain:
        dimension: dimensionless
      duration:
        dimension: time
