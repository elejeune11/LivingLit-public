        unit: mpH/min/cell number
        kind: mean
        group: mm
        spread: SEM
        spread_source: methods
      gc_rpmi:
        printed: 10.2 ± 0.1
        unit: mpH/min/cell number
        kind: mean
        group: rpmi
        spread: SEM
        spread_source: methods
    n:
      printed: n = 3 batches
      counts: batches
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    method: Seahorse XF96 extracellular flux analyzer, Glycolysis stress test
