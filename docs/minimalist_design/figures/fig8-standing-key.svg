<svg xmlns='http://www.w3.org/2000/svg' width='900' height='420' viewBox='0 0 900 420'><rect width='900' height='420' fill='#ffffff'/><text x='24.0' y='34.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#1f2328' font-weight='bold' text-anchor='start'>One standing key, four pairs: code names why each is or is not comparable</text><text x='24.0' y='56.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#5d6670' font-weight='normal' text-anchor='start' font-style='italic'>contractile stress, value part of its key; made-up items from five papers</text><rect x='24' y='74' width='270' height='330' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='36.0' y='98.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>Standing key: stress</text><text x='36.0' y='116.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>in the vocabulary, versioned</text><text x='36.0' y='146.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='start'>must match</text><text x='36.0' y='164.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>platform at level 2</text><text x='36.0' y='180.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>temperature</text><text x='36.0' y='196.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>preparation</text><text x='36.0' y='212.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>derivation (same formula)</text><text x='36.0' y='244.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='start'>may vary</text><text x='36.0' y='262.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='normal' text-anchor='start'>cell line, substrate</text><text x='36.0' y='300.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>When a pair is not comparable,</text><text x='36.0' y='316.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>code coarsens each field one level,</text><text x='36.0' y='332.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>then drops it, and reports</text><text x='36.0' y='348.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>where the verdict changes.</text><rect x='314' y='74' width='562' height='72' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='326.0' y='96.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>A · E7 vs B · E4</text><text x='326.0' y='116.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>12 ± 2 vs 14 ± 3 mN/mm²; every field matches</text><rect x='740' y='98' width='124' height='24' rx='12' fill='#e3f1e8' stroke='#2f8f57' stroke-width='1.6'/><text x='802.0' y='114.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>agree</text><rect x='314' y='158' width='562' height='72' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='326.0' y='180.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>A · E7 vs C · E2</text><text x='326.0' y='200.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>temperature: 37 °C vs room temperature</text><rect x='740' y='182' width='124' height='24' rx='12' fill='#f8e3e1' stroke='#c8402f' stroke-width='1.6'/><text x='802.0' y='198.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>not comparable</text><rect x='314' y='242' width='562' height='72' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='326.0' y='264.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>A · E7 vs D · E5</text><text x='326.0' y='284.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>platform: anchored EHT vs spheroid;</text><text x='326.0' y='300.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>at level 1 both 3D: then they differ</text><rect x='740' y='266' width='124' height='24' rx='12' fill='#f8f0de' stroke='#d19a17' stroke-width='1.6'/><text x='802.0' y='282.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>differ if relaxed</text><rect x='314' y='326' width='562' height='72' rx='8' fill='#ffffff' stroke='#9aa3ad' stroke-width='1.3'/><text x='326.0' y='348.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2328' font-weight='bold' text-anchor='start'>A · E7 vs E · E1</text><text x='326.0' y='368.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>E summed both posts (formula flag);</text><text x='326.0' y='384.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#5d6670' font-weight='normal' text-anchor='start'>rebuilt value, labelled derived</text><rect x='740' y='350' width='124' height='24' rx='12' fill='#e6ecf7' stroke='#2a5ab0' stroke-width='1.6'/><text x='802.0' y='366.5' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#1f2328' font-weight='bold' text-anchor='middle'>agree, rebuilt</text></svg>
