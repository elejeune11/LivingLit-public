assumptions: {}
bounds: []
proposals:
- formula: ratio_def
  kind: definition
  statement: A ratio (including a fold change, a fraction and a normalised value) is one quantity divided by another.
  equations:
  - r = a/b
  variables:
    r: D/D2
    a: D
    b: D2
  does_not_apply: a difference, a log ratio, or a mean of per-sample ratios compared with a ratio of means
  tests:
  - given:
      a: 6.0
      b: 2.0
    expect:
      r: 3.0
  - given:
      a: 6.0
      b: 2.0
    does_not_apply: log2 ratio (1.585) is not the ratio
  cites:
    text: 'ISO 80000-1:2022 Quantities and units, Part 1: General (quotients of quantities; quantities of dimension one)'
    url: https://www.iso.org/standard/76921.html
- formula: stress_def
  kind: definition
  statement: Normal stress is the normal force divided by the area it acts on.
  equations:
  - sigma = F/A
  variables:
    sigma: stress
    F: force
    A: area
  does_not_apply: shear force, or an area other than the one carrying the force (e.g. a per-cell or per-myofibril area)
  tests:
  - given:
      F: 2.0
      A: 4.0
    expect:
      sigma: 0.5
  cites:
    text: 'ISO 80000-4:2019 Quantities and units, Part 4: Mechanics (normal stress)'
    url: https://www.iso.org/standard/64975.html
- formula: conduction_velocity_def
  kind: definition
  statement: Conduction velocity is the distance between two sites divided by the difference of their activation times.
  equations:
  - v = d/(t2 - t1)
  variables:
    v: velocity
    d: length
    t1: time
    t2: time
  does_not_apply: propagation not along the line between the two sites (curved or oblique wavefront)
  tests:
  - given:
      d: 1.0
      t1: 0.0
      t2: 0.5
    expect:
      v: 2.0
  cites:
    text: 'ISO 80000-3:2019 Quantities and units, Part 3: Space and time (velocity, speed = ds/dt)'
    url: https://www.iso.org/standard/64974.html
- formula: frequency_def
  kind: definition
  statement: The frequency of a periodic event is the inverse of its period.
  equations:
  - f = 1/T
  variables:
    f: frequency
    T: time
  does_not_apply: irregular beating, where the mean of inverse periods differs from the inverse of the mean period
  tests:
  - given:
      T: 0.5
    expect:
      f: 2.0
  cites:
    text: 'ISO 80000-3:2019 Quantities and units, Part 3: Space and time (frequency f = 1/T)'
    url: https://www.iso.org/standard/64974.html
- formula: relative_change
  kind: derived
  statement: The relative change of a value from a reference, (x - x0)/x0, is the ratio of the difference to the reference.
  equations:
  - d = (x - x0)/x0
  variables:
    d: dimensionless
    x: D
    x0: D
    dx: D
  assumes:
  - dx = x - x0
  uses:
  - formula: ratio_def
    subs:
      r: d
      a: dx
      b: x0
  does_not_apply: a change expressed relative to a value other than the reference subtracted (e.g. % of peak)
  tests:
  - given:
      x: 3.0
      x0: 2.0
    expect:
      d: 0.5
