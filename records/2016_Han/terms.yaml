    note: one fold range (1.9–2.4) over four genes; each gene is a measure of its own (the per-gene items F5_<gene> already exist).
- field: measure
  stated: relative expression of ATP2A2, CASQ2, HCN1, KCNJ2 and KCNA4
  flag:
    kind: several measures
    note: one fold range (1.8–2.8) over five genes; each gene is a measure of its own (the per-gene items F5_<gene> already exist).
- field: measure
  stated: normalized beating rate
  terms: [measure:contraction_frequency]
  qualifiers: {expressed_as: fold}
  note: MEA beating rate after each dose relative to the rate before the compound, printed as fold (Results 3.5, Fig. 6 legend); normalised_to left out because the paper does not name the reference in so many words.
- field: measure
