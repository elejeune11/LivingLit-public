record: 2018_Mosqueira
formula_library_version: 25
agent:
  model: llm
  instructions: formulas_v3
derived:
  F2bc_a_mw.volume:
    item: F2bc_a_mw
    formula: V = pi*d**3/6
    anchor: &id001
      quote: estimation of cardiomyocyte volume was performed using the calibration curve and formula of volume of a perfect
        sphere
      where: Supplementary Methods, Volumetry
      file: ehy249_Supplementary_Information.docx
    library:
      formula: sphere_volume_diameter
      vars:
        V: V
        d: d
    inputs:
      d:
        not_stated: true
        kind: per sample
        note: per-cell diameter from forward scatter via the bead calibration curve (Fig. 2A); the curve's form and coefficients
          are not printed
    note: the printed formula is V = π/6 × diameter³ (an equation object in the Supplementary Methods); each sample is summarised
      by its median per-cell volume (25 000 cells per sample); no volume is printed
