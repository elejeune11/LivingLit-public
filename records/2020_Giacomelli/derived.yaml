  F5B_basal_cmf.per_dna:
    item: F5B_basal_cmf
    formula: y = o/dna
    anchor: &id007
      quote: Normalization was performed by lysing the MTs with a chloride-based lysis buffer
      where: STAR Methods
    library:
      formula: ratio_def
      vars:
        r: y
        a: o
        b: dna
    inputs:
      o:
        not_stated: true
        kind: per sample
        note: the Seahorse parameter of one well (how it is computed from the injection phases is not stated)
      dna:
        not_stated: true
        kind: per sample
        note: DNA content of the same well (Picogreen)
    note: normalisation to DNA content; the parameter itself (e.g. ATP production, spare capacity, glycolytic reserve) as
      a difference of OCR or ECAR phases is not stated in the paper
