source:
  title: "Metabolically driven maturation of human-induced-pluripotent-stem-cell-derived cardiac microtissues on microfluidic chips"
  doi: "10.1038/s41551-022-00884-4"
  year: "2022"
  first_author: "Nathaniel Huebsch"
  last_author: "Kevin E. Healy"
  lab: "Healy lab, Department of Bioengineering, University of California at Berkeley"
  journal: "Nature Biomedical Engineering"
  files:
    - journal_version.pdf
    - nihms-1896910.pdf
    - NIHMS1896910-supplement-Supplementary_Figures.pdf
    - NIHMS1896910-supplement-Supplemental_Documents.docx
  missing:
    - "Source data for the figures (the paper states source data are provided with it; no source data file is in the folder)"
  version_note: "The folder holds the published version and the author manuscript (NIHMS). Quotes are taken from either; the author manuscript keeps the Extended Data legends in extractable text."

default_context:
  species: "human"
  differentiation_factors:
    value: "CHIR99021 + IWP-2"
    qualifiers: {CHIR99021: "8 μM", IWP_2: "5 μM"}
    anchor:
      quote: "At day 0, hiPSC were >90% confluent and were treated with Roswell Park Memorial Institute Medium 1640 (RPMI) containing B-27 supplement without insulin (RPMI-I), along with 8μM CHIR99021"
      where: "Methods, Cardiomyocyte Differentiation"
    note: "the two molecules are named in separate sentences; the value's anchor is the CHIR99021 sentence, each dose is anchored in context_anchors"
  hipsc_medium: "Essential 8 Medium"
  hipsc_coating: "hESC-Qualified Matrix"
  wnt_activation_days: "24 hr"
  wnt_inhibition_days: "not stated"
  insulin_day: "not stated"
  confluency: ">90% confluent"
  purification: "lactate treatment"
  purity_method: "flow cytometry for Cardiac Troponin T"
  purity: "> 90%"
  cm_medium: "glucose free RPMI"
  supplements:
    value: "B-27 + L-ascorbic acid"
    qualifiers: {B_27: "2%", L_ascorbic_acid: "150μg/mL"}
    anchor:
      quote: "In addition to the ingredients described above, all media were supplemented with 2% B-27 supplement and 150µg/mL L-ascorbic acid."
      where: "Table S1 footnote"
      file: NIHMS1896910-supplement-Supplemental_Documents.docx
  replating_coating: "Matrigel"
  endothelial_cell: "none"
  composition: "80% hiPSC-CM and 20% hiPSC-SC"
  cm_day_at_formation: "not stated"
  genotype: "healthy control line"
  disease_model: "none"
  culture_calcium_mM: "not stated"
  incubator_atmosphere: "not stated"
  dissociation_reagent: "0.25% trypsin"

units:
  F1:
    where: "Fig. 1a–e"
    title: "Optimized hiPSC-CM MPS"
    context: &mps_live
      number_of_lines: "not stated"
      cell_line: "WTC"
      transgene: {value: "CAG-driven GCaMP6f", qualifiers: {locus: "AAVS1"}}
      donor_age: "30-year-old"
      platform: "cardiac MPS"
      substrate: "polydimethylsiloxane"
      cell_types: "hiPSC-CM + hiPSC-SC"
      stromal_cell: "hiPSC-derived stromal cells"
      mechanical_load: "contract against PDMS posts"
      seeding_density: "2×104 cells"
      preparation: "live"
      temperature: "37 °C"
      day_of_measurement: "day 10"
      treatment: "none"
      time_point: "not applicable"
      measurement_medium: "RPMI-C without phenol red"
      measurement_calcium_mM: "not stated"
      pacing: "not stated"
    other_conditions:
      - text: "Pump-free, gravity-driven flow was used to feed the tissues"
        anchor:
          quote: "Pump-free, gravity-driven flow was used to feed the tissues."
          where: "Methods, Self-Assembly of Cardiac Microtissues within Cardiac MPS"
      - text: "all physiology and gene expression studies with MPS and monolayers derived from a minimum of three independent differentiations"
        anchor:
          quote: "Potential batch-to-batch variability in hiPSC-CM phenotype was mitigated by performing all physiology and gene expression studies with MPS and monolayers derived from a minimum of three independent differentiations."
          where: "Methods, Self-Assembly of Cardiac Microtissues within Cardiac MPS"
      - text: "Microphysiological systems were excluded from data analysis if tissue did not exhibit uniaxial beating"
        anchor:
          quote: "Microphysiological systems were excluded from data analysis if tissue did not exhibit uniaxial beating"
          where: "Reporting Summary, Data exclusions"
          file: journal_version.pdf
    groups:
      wtc: {label: "cardiac MPS", context: {maturation_strategy: "not stated"}}

  ED2BF:
    where: "Extended Data Fig. 2b–f"
    title: "Design-of-experiments (DoE) based screens identify maturation media for hiPSC-CM microphysiological systems"
    context:
      <<: *mps_live
      pacing: "1 Hz"
    note: "Each plotted point is one level of one media component in the L9 Taguchi array; the groups below are those levels."
    groups:
      glu25: {label: "glucose 25 mM", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {glucose: "25 mM"}, anchor: {quote: "Glucose (mM) 25", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      glu10: {label: "glucose 10 mM", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {glucose: "10 mM"}, anchor: {quote: "Glucose (mM) 10", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      glu0: {label: "glucose 0 mM", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {glucose: "0 mM"}, anchor: {quote: "Glucose (mM) 0", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      pa0: {label: "palmitic acid 0 μM", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {palmitic_acid: "0 μM"}, anchor: {quote: "Palmitic Acid (μM) 0", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      pa200: {label: "palmitic acid 200 μM", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {palmitic_acid: "200 μM"}, anchor: {quote: "Palmitic Acid (μM) 200", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      oa0: {label: "oleic acid 0 μM", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {oleic_acid: "0 μM"}, anchor: {quote: "Oleic Acid (μM) 0", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      oa125: {label: "oleic acid 125 μM", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {oleic_acid: "125 μM"}, anchor: {quote: "Oleic Acid (μM) 125", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      bsa2: {label: "BSA 2.5 mg/mL", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {BSA: "2.5 mg/mL"}, anchor: {quote: "BSA (mg/mL) 2.5", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}
      bsa25: {label: "BSA 25 mg/mL", context: {maturation_strategy: {value: "fatty-acid media", qualifiers: {BSA: "25 mg/mL"}, anchor: {quote: "BSA (mg/mL) 25", where: "Extended Data Fig. 2b–f, x axis", kind: unit}}}}

  ED2GH:
    where: "Extended Data Fig. 2g,h"
    title: "Comparison of MPS cultured in standard media to MPS cultured in glucose-free media during L9 studies, and MPS cultured in the final Maturation Media"
    context:
      <<: *mps_live
      pacing: "1 Hz"
