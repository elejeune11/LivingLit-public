record: 2022_Ronaldson-Bouchard
vocabulary_version: 40
agent:
  model: llm
  instructions: terms_v4
edits:
- add_synonym:
    id: CL:0000134
    text: MSC
    anchor: MSC, mesenchymal stem cell
- add_synonym:
    id: CL:0002551
    text: NHDF
    anchor: NHDF, normal human dermal fibroblasts
- add_synonym:
    id: CL:0000057
    text: human fibroblasts
    anchor: were formed from aggregates of hiPSC-derived hepatocytes and supporting human fibroblasts encapsulated in fibrin
      matrix
- adopt:
    field: cell_types
    id: CL:0000312
    label: keratinocyte
    lookup: livinglit lookup cl keratinocyte (exact); the paper names human keratinocytes seeded onto the dermal matrix, no
      epidermal subtype
    synonyms:
    - text: human keratinocytes
      anchor: seeding human dermal fibroblasts into collagen matrix, adding human keratinocytes
- adopt:
    field: cell_types
    id: CL:0000062
    label: osteoblast
    lookup: livinglit lookup cl osteoblast (exact)
    synonyms:
    - text: osteoblasts
      anchor: suggesting that osteoblasts are more sensitive to doxorubicin than osteoclasts
- adopt:
    field: cell_types
    id: CL:0000092
    label: osteoclast
    lookup: livinglit lookup cl osteoclast (exact); mono- or multinuclear not stated
    synonyms:
    - text: osteoclasts
      anchor: suggesting that osteoblasts are more sensitive to doxorubicin than osteoclasts
- adopt:
    field: cell_types
    id: CL:0000182
    label: hepatocyte
    lookup: livinglit lookup cl hepatocyte (exact); CL has no iPSC-derived hepatocyte class, the source is the line
    synonyms:
    - text: hiPSC-derived hepatocytes
      anchor: were formed from aggregates of hiPSC-derived hepatocytes and supporting human fibroblasts
- adopt:
    field: cell_types
    id: CL:0001054
    label: CD14-positive monocyte
    lookup: livinglit lookup cl 'CD14-positive monocyte' (exact)
    synonyms:
    - text: CD14+ monocytes
      anchor: primary CD14+ monocytes were seeded into the osteoblastic bone
- adopt:
    field: treatment
    id: CHEBI:2896
    label: astemizole
    lookup: livinglit lookup chebi astemizole (exact); the paper's spelling 'astemizol' is printed only in a figure image,
      so no synonym
- adopt_own:
    field: treatment
    id: treatment:cryoinjury
    label: cryoinjury
    definition: Local freezing injury of a tissue by brief contact with a cold object such as dry ice.
    scope: A physical injury made to a tissue; not a compound, a gene transfer or an implantation.
    lookup: 'livinglit lookup chebi cryoinjury: no hit; an injury, not a chemical entity'
    synonyms:
    - text: cryoinjury
      anchor: evidence.F3l_ctni.anchor
- add_synonym:
    id: supplements:b27
    text: B-27 supplement
    anchor: cardiac medium was added (RPMI 1640; Thermo Fisher, 11875-093; B-27 supplement
- add_term:
    field: platform
    id: platform:porous_mesh_insert
    label: porous mesh insert
    parent: platform:culture_2d
    definition: An insert holding a porous mesh on which cell layers (such as an endothelial barrier) grow, separating two
      compartments.
    scope: Cell layers on a porous mesh between two compartments; not a flat layer on the well bottom (monolayer), not a migration
      assay (Boyden chamber), not micropatterned islands and not a micropost array.
    synonyms:
    - text: mesh insert
      anchor: Underneath each tissue chamber is an elastic mesh insert
- set_scope:
    id: platform:boyden_chamber
    scope: Cells on a porous membrane insert for a migration assay; not a flat monolayer on the well bottom, not micropatterned
      islands, not a micropost array, and not a mesh insert carrying a barrier layer between compartments (porous mesh insert).
- add_term:
    field: platform
    id: platform:multi_tissue_chip
    label: multi-tissue chip
    parent: platform:engineered_3d
    definition: A perfused device in which engineered tissues sit in separate chambers connected by a circulating medium.
    scope: Engineered tissues held in chambers of a device linked by circulating medium; the number of tissues is the qualifier
      configuration; not a single construct format (strip, ring, patch, tissue between pillars, anchors or wires) and not
      a one-tissue microfluidic microchamber (microfluidic cardiac MPS).
    qualifiers:
      configuration:
        dimension: text
- add_term:
    field: platform
    id: platform:barrier_separated_tissue_chip
    label: multi-tissue chip with endothelial barriers
    parent: platform:multi_tissue_chip
    definition: A multi-tissue chip in which each tissue chamber is separated from the circulating medium by an endothelial
      barrier.
    scope: Tissues linked through endothelial barriers, each in its own medium; not the same chip without barriers, where
      tissues share the medium (multi-tissue chip with shared medium).
    synonyms:
    - text: Multi-organ tissue chip
      anchor: The maintenance of matured tissues in the Multi-organ tissue chip was compared to that of the Mixed tissue chip
- add_term:
    field: platform
    id: platform:shared_medium_tissue_chip
    label: multi-tissue chip with shared medium
    parent: platform:multi_tissue_chip
    definition: A multi-tissue chip without endothelial barriers, in which all tissues share one common medium.
    scope: Tissues linked through a common medium with no barrier; not a chip whose chambers are separated by endothelial
      barriers (multi-tissue chip with endothelial barriers).
    synonyms:
    - text: Mixed tissue chip
      anchor: The maintenance of matured tissues in the Multi-organ tissue chip was compared to that of the Mixed tissue chip
- set_scope:
    id: platform:microfluidic_cardiac_mps
    scope: A microtissue formed by loading cells into a fluid-fed microchamber with posts; not a hydrogel tissue cast between
      two pillars in a well, a strip, a ring, a patch, a tissue between anchors or wires, and not several tissues in chambers
      linked by circulating medium (multi-tissue chip).
- add_term:
    field: platform
    id: platform:single_tissue_culture
    label: tissue cultured on its own
    parent: null
    definition: A tissue or cell population cultured individually, not connected to other tissues, named as the comparison
      for multi-tissue chips; its format is not stated.
    scope: Culture alone, as the comparison for tissues linked in a multi-tissue chip, with no format stated; not a named
      2D format, 3D engineered format, aggregate or native tissue, and not a cell-free blank.
- add_term:
    field: substrate
    id: substrate:nylon_mesh
    label: porous nylon mesh
    parent: null
    definition: A porous nylon mesh used as a substrate for cell layers; pore size and coating are qualifiers.
    scope: A porous synthetic mesh; not a hydrogel, glass, PDMS, polyacrylamide, a culture plate, a protein coating or a decellularized
      matrix.
    qualifiers:
      pore_size:
        dimension: length
      coating:
        dimension: text
    synonyms:
    - text: porous nylon mesh
      anchor: Each chamber has an insert with a porous nylon mesh serving as a substrate for the endothelial layer
- add_term:
    field: substrate
    id: substrate:decellularized_bone
    label: decellularized bone
    parent: null
    definition: Bone tissue with its cells removed, used as a scaffold for cells.
    scope: A decellularized bone scaffold; not decellularized myocardium, not a hydrogel and not a synthetic material.
    synonyms:
    - text: decellularized bone scaffolds
      anchor: mesenchymal stromal cells (MSC) into decellularized bone scaffolds
- set_scope:
    id: substrate:decellularized_myocardium
    scope: Decellularized heart muscle as a scaffold; not decellularized bone, not a hydrogel and not a synthetic material.
- add_term:
    field: mechanical_load
    id: mechanical_load:fluid_shear_stress
    label: fluid shear stress
    parent: null
    definition: Shear stress applied to cells by flowing medium during culture; its size is the qualifier shear_stress.
    scope: Load from flowing medium on a cell layer (the size, zero included, is a qualifier); not an elastic, isometric or
      strip load on a tissue, not free shortening (unloaded) and not cyclic stretch.
    qualifiers:
      shear_stress:
        dimension: stress
    synonyms:
    - text: shear stress
      anchor: 'To optimize the hydrodynamic shear stress, we tested three different conditions: zero stress'
- add_term:
    field: maturation_strategy
    id: maturation_strategy:shear_stress_conditioning
    label: shear stress conditioning
    parent: maturation_strategy:dynamic_culture
    definition: Exposure of a cell layer, such as an endothelial barrier, to flow whose shear stress is raised step by step
      during culture.
    scope: A stepwise rise of flow shear on a cell layer to mature it; the general case of moving medium around a construct
      is the parent (dynamic culture).
- add_term:
    field: maturation_strategy
    id: maturation_strategy:air_liquid_interface
    label: air–liquid interface culture
    parent: null
    definition: Culture with the upper surface of a tissue exposed to air and the lower surface fed by medium, used to stratify
      epidermis.
    scope: Lifting a tissue to the air to mature it; not electrical stimulation, mechanical loading, a maturation medium,
      dynamic or static culture, gene overexpression, prolonged culture, a standard medium control, osteogenic induction or
      co-culture.
    synonyms:
    - text: air–liquid interface
      anchor: adding human keratinocytes, and by cultivation at the air–liquid interface for 3 weeks
- add_term:
    field: maturation_strategy
    id: maturation_strategy:osteogenic_induction
    label: osteogenic induction
    parent: null
    definition: Culture in an osteogenic medium that drives stromal cells towards osteoblasts.
    scope: A medium-driven osteoblastic differentiation of stromal cells; not a cardiomyocyte maturation medium, not electrical
      or mechanical stimulation, not air–liquid interface culture and not co-culture.
    synonyms:
    - text: osteogenic differentiation
      anchor: The following day, osteogenic differentiation was initiated by changing to osteogenic medium
- add_term:
    field: maturation_strategy
    id: maturation_strategy:co_culture
    label: co-culture
    parent: null
    definition: Culture of the main cell type together with supporting cells of another type, intended to improve their function.
    scope: Supporting cells added to the main cells (their identity goes to cell_types or stromal_cell); not a medium, not
      electrical or mechanical stimulation, not air–liquid interface culture and not osteogenic induction.
- add_term:
    field: preparation
    id: preparation:circulating_perfusate
    label: circulating perfusate
    parent: preparation:collected_medium
    definition: Medium collected from the circulation shared by the tissues of a perfused device, not from one tissue's chamber.
    scope: The common circulating medium of a perfused device; the general case of medium taken off one culture is the parent
      (collected culture medium).
    synonyms:
    - text: perfusate
      anchor: In vitro biomarkers of doxorubicin cardiomyopathy in perfusate of multi-tissue chips
- add_synonym:
    id: preparation:collected_medium
    text: supernatant
    anchor: At 72 h, the supernatant was collected
- add_term:
    field: transgene
    id: transgene:cd63_gfp_fusion
    label: CD63-GFP exosome reporter
    parent: transgene:fluorescent_fusion_protein
    definition: A construct expressing the exosome marker CD63 fused to GFP, which labels the exosomes the cells secrete.
    scope: A CD63 fusion that labels secreted exosomes; not an N-cadherin, α-actinin-2, connexin-43 or SERCA2 fusion.
    synonyms:
    - text: pCT-CD63-GFP exosome Cyto-Tracer
      anchor: HiPSC-derived CM were transfected with a pCT-CD63-GFP exosome Cyto-Tracer
- add_term:
    field: measure
    id: measure:transepithelial_electrical_resistance
    label: transepithelial electrical resistance
    parent: null
    dimension: resistance_area
    definition: Electrical resistance across a cell barrier times its area (qualifier barrier says which barrier).
    scope: Resistance across a cell barrier per area; not a tissue's bulk resistivity (tissue resistivity) and not a tracer's
      permeability (barrier permeability).
    qualifiers:
      barrier:
        dimension: text
    synonyms:
    - text: TEER
      anchor: transepithelial/transedothelial electrical resistance (TEER)
- add_term:
    field: measure
    id: measure:barrier_permeability
    label: barrier permeability to a tracer
    parent: null
    dimension: velocity
    definition: Permeability coefficient of a cell barrier to a stated tracer (qualifier tracer), from the tracer passing
      it per area and time.
    scope: Tracer flux across a barrier as a permeability; not the electrical resistance of the barrier, not a tracer's concentration
      in a compartment and not its share of the total.
    qualifiers:
      tracer:
        dimension: text
- add_term:
    field: measure
    id: measure:tracer_concentration
    label: tracer concentration
    parent: null
    dimension: concentration
    definition: Concentration of a stated tracer (qualifier tracer) in a compartment of a culture device, followed over time.
    scope: A tracer added to follow transport or uptake in a device; not a compound left in solution to test material uptake
      (compound concentration remaining in solution), not a medium's formulation, not a drug or metabolite in conditioned
      medium, and not a share of the total.
    qualifiers:
      tracer:
        dimension: text
      compartment:
        dimension: text
- add_term:
    field: measure
    id: measure:tracer_compartment_fraction
    label: share of a tracer in a compartment
    parent: null
    dimension: dimensionless
    definition: Per cent of the total amount of a stated tracer (qualifier tracer) found in each compartment of a device.
    scope: The distribution of a tracer between compartments; not its concentration and not a barrier's permeability.
    qualifiers:
      tracer:
        dimension: text
- add_term:
    field: measure
    id: measure:whole_tissue_fluorescence
    label: whole-tissue fluorescence signal
    parent: null
    dimension: radiant_efficiency
    definition: Fluorescence of a stated label (qualifier label) over a whole tissue, imaged macroscopically as radiant efficiency
      or similar.
    scope: Macroscopic imaging of a label in whole tissues; not immunostaining intensity in a region (protein fluorescence
      intensity), not a recorded fluorescence transient and not a stained area.
    qualifiers:
      label:
        dimension: text
- add_term:
    field: measure
    id: measure:cells_per_tissue_area
    label: cells per tissue area
    parent: null
    dimension: number_per_area
    definition: Number of cells of a stated type (qualifier cell_type) per unit area of tissue.
    scope: Cells of one type per area of tissue; not cells per microscope field, not cells in a whole construct and not vessels
      per area.
    qualifiers:
      cell_type:
        dimension: text
- add_term:
    field: measure
    id: measure:enzyme_activity
    label: enzyme activity
    parent: null
    dimension: enzyme_activity
    definition: Activity of a stated enzyme (qualifier enzyme) in a sample or medium, by a kinetic or colorimetric assay.
    scope: Catalytic activity of one enzyme; not the amount of a protein (protein level, secreted or released protein level).
    qualifiers:
      enzyme:
        dimension: text
- add_term:
    field: measure
    id: measure:bone_volume
    label: bone volume
    parent: null
    dimension: volume
    definition: Volume of mineralised bone in a scaffold or tissue, by micro-computed tomography.
    scope: Mineralised volume within a bone construct; not the volume of a whole engineered tissue (tissue volume) and not
      cell or nuclear volume.
- add_term:
    field: measure
    id: measure:protein_subset_count
    label: number of proteins meeting a criterion
    parent: measure:identified_protein_count
    dimension: dimensionless
    definition: Count of the proteins of a proteome that meet a stated criterion (qualifier criterion), such as highly expressed
      only in one tissue.
    scope: A count of a selected subset of proteins; the count of all proteins identified is the parent.
    qualifiers:
      criterion:
        dimension: text
- add_term:
    field: measure
    id: measure:proteome_overlap
    label: proteome overlap with a reference
    parent: null
    dimension: dimensionless
    definition: Per cent of the proteins detected in a sample that are also detected in a stated reference tissue (qualifier
      reference).
    scope: Shared presence of proteins with a reference; not agreement of their expression levels (expression level agreement)
      and not a correlation coefficient of profiles.
    qualifiers:
      reference:
        dimension: text
- add_term:
    field: measure
    id: measure:expression_level_agreement
    label: expression level agreement with a reference
    parent: null
    dimension: dimensionless
    definition: Per cent of the proteins shared with a stated reference (qualifier reference) whose expression level class
      (low, medium, high) matches the reference.
    scope: Agreement of binned expression levels of shared proteins; not shared presence (proteome overlap) and not a correlation
      coefficient (correlation of expression profiles).
    qualifiers:
      reference:
        dimension: text
- add_term:
    field: measure
    id: measure:annotation_fold_enrichment
    label: annotation fold enrichment
    parent: null
    dimension: dimensionless
    definition: Ratio of the observed to the expected number of members of a stated annotation (qualifier annotation) in a
      gene or protein set (qualifier gene_set).
    scope: Over-representation as a ratio; not its p-value (functional enrichment p-value), not a ranked-list enrichment score
      (normalized enrichment score) and not a count.
    qualifiers:
      annotation:
        dimension: text
      gene_set:
        dimension: text
- add_term:
    field: measure
    id: measure:mirna_expression
    label: microRNA expression
    parent: measure:gene_expression
    dimension: dimensionless
    definition: Relative level of one stated microRNA (qualifier gene), as a fold change against a reference.
    scope: Level of a microRNA; mRNA of a protein-coding gene is the parent (gene expression); not allele-specific expression.
- set_scope:
    id: measure:allele_specific_expression
    scope: Expression of one allele of a gene against the other; not total mRNA of the gene (the parent) and not a microRNA
      level (microRNA expression).
- add_term:
    field: measure
    id: measure:clinical_concordance
    label: concordance with clinical data
    parent: null
    dimension: dimensionless
    definition: Share of a stated set of biomarkers whose change in a model agrees in direction with a clinical study (qualifier
      basis says what was compared).
    scope: Agreement of a model's biomarker changes with patients' data; not a correlation of expression profiles and not
      a distance in principal component space.
    qualifiers:
      basis:
        dimension: text
      biomarker_set:
        dimension: text
- add_term:
    field: measure
    id: measure:biomarker_specificity
    label: biomarker specificity against clinical data
    parent: measure:clinical_concordance
    dimension: dimensionless
    definition: True negatives over true negatives plus false positives, for biomarker changes in a model scored against a
      clinical study.
    scope: Specificity of a model's biomarker calls; the share of biomarkers that agree is the parent (concordance with clinical
      data).
- add_synonym:
    id: measure:contraction_frequency
    text: beat frequency
    anchor: The resulting traces were used to determine the beat frequency and plot it
