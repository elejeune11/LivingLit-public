  F1IK_Gln.remaining_FAM_d0:
    item: F1IK_Gln
    group: FAM_d0
    measure: contribution of [U-13C]glutamine to labelled TCA cycle pools
    formula: Gln = 1 - FA
    anchor:
      quote: the remaining 82% from [U-13C]Gln
      where: Results
    library:
      formula: complement_fraction
      vars:
        c: Gln
        f: FA
    inputs:
      FA:
        value: F1IK_FA.values.FA_FAM_d0_text
        kind: constant
    output: F1IK_Gln.values.Gln_FAM_d0_figure
    note: FAM's main substrates are Gln, OA and PA; contributions are normalised to their total
    alternatives:
    - label: FA rebuilt from the pie's OA + PA
      note: derived F1IK_FA.oa_pa_FAM_d0
