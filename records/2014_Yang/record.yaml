  anchor: {quote: Only the contractile forces of single cardiomyocytes (no junctions with adjacent cells) with obvious beating activity
      were assessed., where: Methods 2.6}
- field: platform
  value: glass slides
  anchor: &fn {quote: cardiomyocytes were replated onto fibronectin-coated glass slides, where: Methods 2.7}
- field: substrate
  value: glass
  anchor: *fn
- field: replating_coating
  value: fibronectin
  anchor: *fn
- field: pacing
  value: stimulated
  anchor: &stim {quote: Stimulated calcium transients (0.5 Hz) were then monitored with the Ionoptix Stepper Switch system, where: Methods
      2.7}
- field: pacing.frequency
  value: 0.5 Hz
  anchor: *stim
- field: measurement_medium
  value: culturing medium
  anchor: {quote: The experiments were done at 37 °C with culturing medium containing 15 mM HEPES., where: Methods 2.7}
- field: preparation
  value: total DNA
  anchor: {quote: Total DNA was extracted using phenol–chloroform extraction method., where: Methods 2.4}
- field: platform
  value: tissue culture dishes
  anchor: {quote: Adherent cells in tissue culture dishes were fixed for transmission electron microscopy, where: 'Supplement, Electron
      Microscopy', file: NIHMS586803-supplement-01.docx}
- field: cm_day_at_formation
  value: around 20 days
  anchor: &seed5 {quote: 'At around 20 days after differentiation, the cardiomyocytes were seeded onto the plates with a density of 30,000
      per XF96 well (2500/mm2)', where: Methods 2.8}
- field: seeding_density
  value: 30,000 per XF96 well (2500/mm2)
  anchor: *seed5
- field: platform
  value: Seahorse plates
  anchor: {quote: The cells were treated with 20 ng/ml T3 for one week in the Seahorse plates before the assay., where: Methods 2.8}
- field: replating_coating
  value: Gelatin
  anchor: &gel {quote: The plates were pre-treated with 0.1% Gelatin., where: Methods 2.8}
- field: replating_coating.concentration
  value: 0.1%
  anchor: *gel
- field: measurement_medium
  value: unbuffered DMEM
  anchor: &dmem {quote: 'base media (unbuffered DMEM, Sigma D5030, supplemented with 2 mM glutamine) 1 h before the assay', where: Methods
      2.8}
- field: measurement_medium.glutamine
  value: 2 mM
  anchor: *dmem
- field: day_of_measurement
  value: ~100 day
  anchor: {quote: upon the long-term (~100 day) maintenance of hPSC-CMs in low density cultures, where: Discussion}

claims:
  abs_size:
    kind: stated
    quote: A one-week treatment with T3 increased cardiomyocyte size, anisotropy, and sarcomere length.
    where: Abstract
    scope: hiPSC-CMs (IMR90 line), one week of 20 ng/ml T3
    direction: size up
    asserts_direction: up
    rests_on: [F1C_area]
    judgement: &cells {direction: follows, support: follows, comparison: follows, scope: follows, replication: cannot judge, strength: follows,
      presence: follows}
    note: n counts cells (n > 100 per condition); the number of differentiations behind them is not stated
  abs_anisotropy:
    kind: stated
    quote: A one-week treatment with T3 increased cardiomyocyte size, anisotropy, and sarcomere length.
    where: Abstract
    scope: hiPSC-CMs (IMR90 line), one week of 20 ng/ml T3
    direction: anisotropy up, measured as a lower circularity index
    asserts_direction: down
    rests_on: [F1D_circularity]
    judgement: *cells
  abs_sarcomere:
