    id: CL:0002620
    label: skin fibroblast
    lookup: cl 'skin fibroblast' (exact); second field for the same id
  - event: add_qualifier
    id: CL:0002620
    name: origin
    dimension: text
  - event: adopt
    field: endothelial_cell
    id: CL:0010008
    label: cardiac endothelial cell
    lookup: cl 'cardiac endothelial cell' (exact); CL:0002350 endocardial cell is narrower and not what the paper names
  - event: add_qualifier
    id: CL:0010008
    name: origin
    dimension: text
  - event: adopt_own
    field: supplements
    id: supplements:vegf
    label: vascular endothelial growth factor (isoform not stated)
    definition: Vascular endothelial growth factor named without its isoform, added routinely to the culture medium.
    scope: VEGF named without an isoform; VEGF165 when the isoform is named, and not other growth factors (IGF-1, FGF-2, TGF-β1).
    lookup: 'chebi ''vascular endothelial growth factor'' and ''VEGF'': only receptor antagonists and activators (CHEBI:65207,
      CHEBI:91189, CHEBI:224893); ChEBI has no entry for the protein'
    synonyms:
    - text: VEGF
      anchor: per 50 mL BPEL medium supplemented with VEGF (50 ng/ml)
  - event: add_qualifier
    id: CHEBI:760509
    name: concentration
    dimension: concentration
  - event: adopt
    field: treatment
    id: CHEBI:50095
    label: bucladesine
    lookup: chebi 'bucladesine' (exact, N6,2'-O-dibutyryl-cAMP) and 'dibutyryl cAMP' (CHEBI:197402 dibutyryl-cAMP also exists);
      bucladesine is the established entry for dbcAMP
    synonyms:
    - text: dbcAMP
      anchor: Dibutyryl cAMP (dbcAMP) treatment was performed on CMECFs and CMEC SFs from CTRL1 and CTRL2
  - event: add_term
    field: transgene
    id: transgene:gja1_overexpression
    label: connexin-43 (GJA1) overexpression
    parent: transgene:overexpressed_gene
    definition: An introduced GJA1 gene that overexpresses connexin-43.
    scope: Overexpressed connexin-43; not ΔN90 β-catenin, YAP1(S127A) or YAP1(S112A).
  - event: add_term
    field: transgene
    id: transgene:shrna_knockdown
    label: shRNA knockdown
    parent: null
    definition: A short hairpin RNA construct that silences a named gene (qualifier target).
    scope: An shRNA that silences a named gene; not an overexpressed gene, a reporter, an indicator, a recombinase, an empty
      vector or a non-targeting shRNA control.
    qualifiers:
      target:
        dimension: text
      vector:
        dimension: text
  - event: add_term
    field: transgene
    id: transgene:control_shrna
    label: non-targeting shRNA control
    parent: null
    definition: A construct given as the control of an shRNA knockdown, targeting no gene.
    scope: The control arm of an shRNA experiment; not a targeting shRNA, an empty vector of an overexpression experiment
      or a reporter given for its own sake.
    qualifiers:
      vector:
        dimension: text
    synonyms:
    - text: scramble shRNA
      anchor: GFP expressing virus (pLV-CMV-GFP) was used as a control (scramble shRNA).
  - event: add_synonym
    id: measure:ap_notch_fraction
    text: fraction of APs with the Ito notch
    anchor: Bar graph showing the fraction of APs with the Ito ‘‘notch’’ (red).
  - event: add_synonym
    id: measure:twitch_duration
    text: contraction duration
    anchor: (O) Contraction duration (left) and IBI (right) measured in spontaneously beating MTs.
  - event: add_synonym
    id: measure:tissue_width
    text: MT diameter
    anchor: (B) Bar graphs showing MT diameter measured in MTs mounted on glass coverslips
  - event: add_synonym
    id: measure:contractile_velocity
    text: maximum contraction velocity
    anchor: as indicated by the maximum contraction velocity and acceleration measured at increasing pacing frequencies
  - event: add_synonym
    id: measure:contractile_velocity
    text: contraction velocity
    anchor: and upstroke velocity higher, and contraction velocity and acceleration faster (Figure 6E)
  - event: add_term
    field: measure
    id: measure:sarcomere_alignment_index
    label: sarcomere alignment index
    parent: null
    dimension: dimensionless
    definition: Area under the first-order peak of the Fourier power spectrum of a sarcomere (α-actinin) image divided by
      the total area of the spectrum profile.
    scope: An FFT-based index of sarcomere regularity and alignment; not the sarcomere orientational order parameter, angle
      dispersion, or the number or length of sarcomeres.
  - event: add_term
    field: measure
    id: measure:inter_beat_interval
    label: inter-beat interval
    parent: null
    dimension: time
    definition: Time between successive beats.
    scope: The interval between beats, a time; not contraction frequency (a rate) and not contraction duration.
    synonyms:
    - text: IBI
      anchor: Inter-beat interval (IBI) (F) and normalized contraction duration (G) in spontaneously beating MTs.
  - event: add_term
    field: measure
    id: measure:proton_leak
    label: proton leak
    parent: measure:oxygen_consumption_rate
    dimension: amount_rate
    definition: The mitochondrial oxygen consumption that remains after ATP synthase is blocked with oligomycin.
    scope: Oligomycin-insensitive mitochondrial respiration; not ATP-linked respiration, maximal respiration or spare respiratory
      capacity.
  - event: add_term
    field: measure
    id: measure:glycolytic_reserve
    label: glycolytic reserve
    parent: measure:extracellular_acidification_rate
    dimension: rate
    definition: Glycolytic capacity minus basal glycolysis, the acidification rate cells can add above their basal rate.
    scope: The reserve above basal acidification; not glycolytic capacity itself.
  - event: add_term
    field: measure
    id: measure:internuclear_distance
    label: distance between nuclei
    parent: null
    dimension: length
    definition: Mean distance between neighbouring nuclei in a tissue, from segmented images.
    scope: Spacing of nuclei, a proxy for cell packing; not cell size, cell number, tissue width or sarcomere length.
    synonyms:
    - text: average distance between nuclei
      anchor: Bar graph showing average distance between nuclei (F) and average volume
  - event: add_term
    field: measure
    id: measure:nuclear_volume
    label: nuclear volume
    parent: null
    dimension: volume
    definition: Volume of cell nuclei from segmented 3D images, for a stated population (qualifier cell_type).
    scope: Size of nuclei; not cell volume or tissue volume.
    qualifiers:
      cell_type:
        dimension: text
  - event: add_term
    field: measure
    id: measure:contraction_acceleration
    label: contraction acceleration
    parent: null
    dimension: acceleration
    definition: Rate of change of the displacement velocity of a tissue during contraction, from image-based motion analysis.
    scope: Acceleration during contraction; not contractile velocity and not relaxation acceleration.
  - event: add_term
    field: measure
    id: measure:relaxation_acceleration
    label: relaxation acceleration
    parent: null
    dimension: acceleration
    definition: Rate of change of the displacement velocity of a tissue during relaxation, from image-based motion analysis.
    scope: Acceleration during relaxation; not relaxation velocity and not contraction acceleration.
  - event: add_term
    field: measure
    id: measure:net_metabolite_exchange
    label: net release or uptake of a metabolite
    parent: null
    dimension: amount
    definition: Net amount of a stated metabolite (qualifier metabolite) released into (positive) or taken up from (negative)
      the culture medium over a culture interval.
    scope: A signed net exchange of one metabolite with the medium; not a concentration in spent medium, not intracellular
      metabolite abundance, and not glucose consumption or lactate production when a source names them so.
    qualifiers:
      metabolite:
        dimension: text
  - event: add_term
    field: measure
    id: measure:protein_puncta_per_cell
    label: protein puncta per cell
    parent: null
    dimension: dimensionless
    definition: Number of immunostained spots of a stated protein (qualifier protein) per cell, from image segmentation.
    scope: A count of discrete stained spots per cell; not staining intensity, protein level by blot or a fraction of marker-positive
      cells.
    qualifiers:
