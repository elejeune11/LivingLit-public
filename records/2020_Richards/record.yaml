- field: measurement_medium
  value: medium
  anchor:
    quote: A micropipette aspiration was performed in medium similarly to previous studies
    where: Methods, Mechanical testing using micropipette aspiration
- field: transgene
  value: GCaMP6 adenovirus
  anchor:
    quote: hiPSC-CMs were infected overnight (~16 h) with GCaMP6 adenovirus (gift from M. Morad) the day before organoid fabrication
    where: Methods, Development of the customized 2PLSM
- field: treatment
  value: 1 µM noradrenaline
  anchor:
    quote: cardiac organoids with a radius of ~150 µm that were cultured at 10% O2 with 1 µM noradrenaline
    where: Results, Development of human cardiac infarct organoids
- field: treatment
  value: 10 µM metoprolol
  anchor:
    quote: which was reversed when cultured with 10 µM metoprolol beta-adrenergic blocker
    where: Results, Development of human cardiac infarct organoids
- field: treatment
  value: 10 nM JQ1
  anchor:
    quote: 10 nM of JQ1 (SML1524, Sigma) was added to the medium on D0 and then every 2 d for infarct organoids
    where: Methods, Drug testing
- field: treatment
  value: 30 mM 2,3-butanedione monoxime
  anchor:
    quote: organoids were soaked in a 30 mM solution of 2,3-butanedione monoxime (Sigma) in medium for 5–10 min
    where: Methods, Mechanical testing using micropipette aspiration
