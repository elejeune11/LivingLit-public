  ST3_amp_d21.amplitude_tdi_d21_025:
    item: ST3_amp_d21
    group: tdi_d21_025
    formula: amp = peak - dia
    anchor: &id004
      quote: the amplitude of each signal was measured from baseline value to peak
      where: Methods 2.7
    library:
      formula: sum_of_parts
      vars:
        t: peak
        a: amp
        b: dia
    inputs:
      peak:
        value: ST3_peak_d21.values.tdi_d21_025_table
        part: mean
        kind: per sample
      dia:
        value: ST3_dia_d21.values.tdi_d21_025_table
        part: mean
        kind: per sample
    output: ST3_amp_d21.values.tdi_d21_025_table
    aggregation: not stated
    note: 'amplitude from baseline (diastolic) to peak: amp = peak − dia, written with the peak as output of the sum; rebuilt amp is peak − dia.
      A difference is linear, so mean of per-sample and of means agree'
