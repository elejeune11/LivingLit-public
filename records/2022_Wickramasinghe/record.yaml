id: 2022_Wickramasinghe
field_set: 3
source:
  title: PPARdelta activation induces metabolic and contractile maturation of human pluripotent stem cell-derived cardiomyocytes
  doi: 10.1016/j.stem.2022.02.011
  year: '2022'
  first_author: Nadeera M. Wickramasinghe
  last_author: Nicole C. Dubois
  lab: Dubois lab, Icahn School of Medicine at Mount Sinai
  journal: Cell Stem Cell
  files:
  - journal_version.pdf
  - nihms-1982259.pdf
  - NIHMS1982259-supplement-Supplement_text.pdf
  missing:
  - Video S1
  not_used:
  - file: NIHMS1982259-supplement-Table_S1.xlsx
    why: 'Supplemental File 1: genes regulated early, maintained and late after PPARd activation with per-gene log2 fold changes at days 1, 2,
      3, 7 and 28; gene-level lists, no group values. Its row counts (695/1160, 13/33, 39/44) agree with the text.'
  - file: NIHMS1982259-supplement-Table_S2.xlsx
    why: 'Supplemental File 2: per-gene membership flags (up/down) for PPARd agonist 7d, 7d-pulse and 28d (Venn of Fig. 3F); gene-level, no group
      values. Two of its up-set counts differ from Fig. 3F (see F3F_up).'
  version_note: journal_version.pdf (Cell Stem Cell 29, 559–576, with STAR Methods) and nihms-1982259.pdf (author manuscript) carry the same text;
    the manuscript extracts μ, ≤ and minus signs that the journal PDF loses.
