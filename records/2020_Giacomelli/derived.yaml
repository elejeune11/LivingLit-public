  F2F_align_cmec.index:
    item: F2F_align_cmec
    formula: sai = a1/at
    anchor: &id005
      quote: The index of sarcomere alignment was obtained by normalizing the area under the first order peak for the total
        area of the power spectrum profile.
      where: STAR Methods
    library:
      formula: ratio_def
      vars:
        r: sai
        a: a1
        b: at
    inputs:
      a1:
        not_stated: true
        kind: per sample
        note: area under the first-order peak of the FFT power spectrum profile
      at:
        not_stated: true
        kind: per sample
        note: total area of the power spectrum profile
    aggregation: mean of per-sample
