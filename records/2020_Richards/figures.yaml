no_points:
  S12: 'Raster TIFF (supplement .docx, word/media/image12.tiff): representative 2PLSM fluorescence images of one control
    and one infarct organoid (a, b), each with the GCaMP6 calcium traces (∆F/F0 vs time, scale bars only) of two CM ROIs;
    no per-video or per-organoid markers and no summary values for the 5 videos per group; synchronization is shown by
    trace alignment only. (Supplementary Fig. 12)'
  S4: 'Raster TIFF (supplement .docx, word/media/image4.tif, 150 dpi): bars (mean ± s.d.) with dot swarms, but no group''s
    dots all stand alone; the control dots (n = 10) merge into one clump near 0–2, and of the infarct dots (n = 10) only
    four stand alone (colour-mask blobs of one dot''s area) while the rest merge into two clumps (blob areas about 2× and
    4× a single dot), so no points can be counted. (Supplementary Fig. 4)'
  S1c: 'Raster TIFF (supplement .docx, word/media/image1.tiff): bars (mean ± s.d.) with dot swarms, but no group''s dots
    stand alone; control and infarct dots merge into horizontal rows (7 colour blobs each) and the metoprolol dots touch in
    pairs and clusters (9 blobs for n = 15), so no points can be counted. (Supplementary Fig. 1c)'
  S5: 'Raster TIFF (supplement .docx, word/media/image5.tif, 150 dpi): individual circles only (no bars or means), but
    no group''s circles all stand alone; non-white blobs give CM spheroid one clump (n = 5), FB spheroid 1 alone + 1 clump
    (n = 5), cardiac organoid 1 alone + 1 clump (n = 6), organoid+FB 1 alone + 1 clump of 3 overlapping circles (n = 4),
    so no points can be counted. (Supplementary Fig. 5)'
  S11d: 'Raster TIFF (supplement .docx, word/media/image11.tiff, 220 dpi): individual open circles only (no bars or
    means), but no group''s circles all stand alone; non-white blobs give infarct 2 alone + 2 clumps of 2 overlapping
    circles (n = 6) and control 1 alone + 1 clump of 4 overlapping circles (n = 5), so no points can be counted.
    (Supplementary Fig. 11d)'
  F1e: 'first look (small model): Box plots with whiskers only; no individual sample points visible. (journal_version.pdf p. 3)'
  F4ef: 'first look (small model): Panel f shows radial-bin means with SD bars; panel e is images only. (journal_version.pdf p.
    7)'
  F6ab: 'first look (small model): Panels a-b are micrographs and mean±s.d. profile curves, no per-sample markers (journal_version.pdf
    p. 10)'
  F6d: 'first look (small model): Panel d is stacked percentage bars with no per-organoid markers. (journal_version.pdf p. 10)'
  F6e: 'first look (small model): Panel e is a fluorescence image with calcium trace curves; no per-sample markers. (journal_version.pdf
    p. 10)'
  F7c: 'first look (small model): Binned mean radial profiles with s.d. shading; no per-sample markers. (journal_version.pdf p.
    11)'
  S1d: 'Representative z-stack confocal immunofluorescence images (αSA/vimentin and TUNEL) of control, infarct and 0.1%
    O2 + 1 µM NE organoids; no plotted values or per-sample markers, and the 0.1% O2 outcome (loss of αSA+ banding) is
    stated in the legend and text only. (Supplementary Information .docx, Supplementary Fig. 1d)'
  S14a: 'Raster TIFF (supplement .docx, word/media/image14.tif): two representative bright-field micrographs (organoid
    media vs cardiomyocyte media, 1% O2 + 1 µM NE), one per group with scale bars only; no plot, no per-image markers
    and no quantified cell death for the 4 images per group; "almost 100% cell death" is stated in the text only.
    (Supplementary Fig. 14a)'
