    compares: [iso, base]
    n: {printed: "n = 48", counts: "the number of analyzed sites within the EHTs from 5 independent experiments"}
    stats:
      test: "paired student t-test (Methods)"
      p: "P < 0.001"
      p_values:
        - p: "*p < 0.01"
          anchor:
            quote: "carbamylcholine (n = 31; D) in the contraction rates (middle-panels) and in the signal decay time (right-panels). *p < 0.01."
            where: "Fig. 2 legend"
    anchor:
      quote: "a significant increase in the frequency of the optically-derived [Ca2+]i transients, in both the line-scan confocal single-cell resolution experiments (Fig. 2C, n = 48, P < 0.001)"
      where: "Results, Electrophysiological and calcium-handling assessment"

