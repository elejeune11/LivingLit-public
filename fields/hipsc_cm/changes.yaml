  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:gene_overexpression
    label: gene overexpression
    definition: Overexpression of a gene or microRNA in the cells to promote their maturation.
    scope: Maturation by an introduced gene or microRNA (named in transgene); not electrical stimulation, mechanical loading,
      a maturation medium, dynamic, static or prolonged culture.
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:prolonged_culture
    label: prolonged culture
    definition: Keeping the cells in culture for a long time so that they mature with time alone.
    scope: Maturation by time in culture alone (the duration is day_of_measurement); not electrical stimulation, mechanical
      loading, a maturation medium, gene overexpression, dynamic or static culture.
    synonyms:
