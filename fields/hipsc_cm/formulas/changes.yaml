# Append-only log of accepted formula entries (04-formulas). Entry files are rebuilt from it.
- version: 1
  paper: 2018_Ronaldson-Bouchard
  agent:
    model: llm
    instructions: formulas_v2
    run: null
  events:
  - event: add
    entry:
      formula: ratio_def
      kind: definition
      statement: A ratio (including a fold change, a fraction and a normalised value) is one quantity divided by another.
      equations:
      - r = a/b
      variables:
        r: D/D2
        a: D
        b: D2
      does_not_apply: a difference, a log ratio, or a mean of per-sample ratios compared with a ratio of means
      tests:
      - given:
          a: 6.0
          b: 2.0
        expect:
          r: 3.0
      - given:
          a: 6.0
          b: 2.0
        does_not_apply: log2 ratio (1.585) is not the ratio
      cites:
        text: 'ISO 80000-1:2022 Quantities and units, Part 1: General (quotients of quantities; quantities of dimension one)'
        url: https://www.iso.org/standard/76921.html
  - event: add
    entry:
      formula: stress_def
      kind: definition
      statement: Normal stress is the normal force divided by the area it acts on.
      equations:
      - sigma = F/A
      variables:
        sigma: stress
        F: force
        A: area
      does_not_apply: shear force, or an area other than the one carrying the force (e.g. a per-cell or per-myofibril area)
      tests:
      - given:
          F: 2.0
          A: 4.0
        expect:
          sigma: 0.5
      cites:
        text: 'ISO 80000-4:2019 Quantities and units, Part 4: Mechanics (normal stress)'
        url: https://www.iso.org/standard/64975.html
  - event: add
    entry:
      formula: conduction_velocity_def
      kind: definition
      statement: Conduction velocity is the distance between two sites divided by the difference of their activation times.
      equations:
      - v = d/(t2 - t1)
      variables:
        v: velocity
        d: length
        t1: time
        t2: time
      does_not_apply: propagation not along the line between the two sites (curved or oblique wavefront)
      tests:
      - given:
          d: 1.0
          t1: 0.0
          t2: 0.5
        expect:
          v: 2.0
      cites:
        text: 'ISO 80000-3:2019 Quantities and units, Part 3: Space and time (velocity, speed = ds/dt)'
        url: https://www.iso.org/standard/64974.html
  - event: add
    entry:
      formula: frequency_def
      kind: definition
      statement: The frequency of a periodic event is the inverse of its period.
      equations:
      - f = 1/T
      variables:
        f: frequency
        T: time
      does_not_apply: irregular beating, where the mean of inverse periods differs from the inverse of the mean period
      tests:
      - given:
          T: 0.5
        expect:
          f: 2.0
      cites:
        text: 'ISO 80000-3:2019 Quantities and units, Part 3: Space and time (frequency f = 1/T)'
        url: https://www.iso.org/standard/64974.html
  - event: add
    entry:
      formula: relative_change
      kind: derived
      statement: The relative change of a value from a reference, (x - x0)/x0, is the ratio of the difference to the reference.
      equations:
      - d = (x - x0)/x0
      variables:
        d: dimensionless
        x: D
        x0: D
        dx: D
      assumes:
      - dx = x - x0
      uses:
      - formula: ratio_def
        subs:
          r: d
          a: dx
          b: x0
      does_not_apply: a change expressed relative to a value other than the reference subtracted (e.g. % of peak)
      tests:
      - given:
          x: 3.0
          x0: 2.0
        expect:
          d: 0.5
- version: 2
  paper: 2020_Saleem-U
  agent:
    model: llm
    instructions: formulas_v2
    run: null
  events:
  - event: add
    entry:
      formula: hooke_spring
      kind: model
      statement: The force of a linear elastic spring (or a flexible post loaded at a point) is its stiffness times its deflection.
      equations:
      - F = k*x
      variables:
        F: force
        k: stiffness
        x: length
      assumes:
      - linear spring
      - small deflection
      does_not_apply: large deflections or a nonlinear (e.g. viscoelastic or strain-stiffening) post, where force is not proportional
        to deflection
      tests:
      - given:
          k: 2.0
          x: 3.0
        expect:
          F: 6.0
      - given:
          k: 2.0
          x: 3.0
        does_not_apply: 'post deflected beyond its linear range: measured F differs from k*x'
      cites:
        text: Halliday, Resnick and Walker, Fundamentals of Physics, 10th ed., Wiley 2014, ch. 7 (spring force, Hooke's law)
        quote: Fx = -kx (Hooke's law)
  - event: add
    entry:
      formula: relative_decrease
      kind: derived
      statement: The relative decrease of a value from a reference, (x0 - x)/x0, is the ratio of the drop to the reference.
      equations:
      - s = (x0 - x)/x0
      variables:
        s: dimensionless
        x: D
        x0: D
        dx: D
      assumes:
      - dx = x0 - x
      uses:
      - formula: ratio_def
        subs:
          r: s
          a: dx
          b: x0
      does_not_apply: a signed relative change (x - x0)/x0, or a drop relative to a value other than the reference
      tests:
      - given:
          x: 1.5
          x0: 2.0
        expect:
          s: 0.25
      - given:
          x: 1.5
          x0: 2.0
        does_not_apply: signed relative change gives -0.25
- version: 3
  paper: 2021_Zhang
  agent:
    model: llm
    instructions: formulas_v2
    run: null
  events:
  - event: add
    entry:
      formula: ddct_relative_expression
      kind: model
      statement: Relative expression of a target gene by the comparative Ct method is 2 raised to minus the difference of
        the target-minus-reference Ct between a sample and the calibrator.
      equations:
      - r = 2^(-ddct)
      variables:
        r: dimensionless
        ddct: dimensionless
      assumes:
      - amplification efficiency near 100 %
      - equal amplification efficiencies of target and reference
      does_not_apply: amplification efficiencies far from 100 % or unequal between target and reference (use an efficiency-corrected
        ratio such as Pfaffl's)
      tests:
      - given:
          ddct: 1.0
        expect:
          r: 0.5
      - given:
          ddct: -2.0
        expect:
          r: 4.0
      - given:
          ddct: 1.0
        does_not_apply: 'efficiency 90 % per cycle: expression ratio is 1.9^-1, not 2^-1'
      cites:
        text: Livak and Schmittgen, Analysis of relative gene expression data using real-time quantitative PCR and the 2^-ΔΔCT
          method. Methods 25, 402–408 (2001)
        url: https://doi.org/10.1006/meth.2001.1262
  - event: add
    entry:
      formula: root_mean_square
      kind: definition
      statement: The root mean square of n values is the square root of the mean of their squares.
      equations:
      - S = sqrt(Q/n)
      variables:
        S: D
        Q: D**2
        n: count
      does_not_apply: the mean of the magnitudes (not squared), or a spread about the mean (that is the SD)
      tests:
      - given:
          Q: 8.0
          n: 2.0
        expect:
          S: 2.0
      - given:
          Q: 25.0
          n: 1.0
        expect:
          S: 5.0
      - given:
          Q: 10.0
          n: 2.0
        does_not_apply: 'values 1 and 3 (mean of squares 5): the plain mean 2 differs from the RMS sqrt(5)'
      cites:
        text: Weisstein, Root-Mean-Square, MathWorld (Wolfram Research)
        url: https://mathworld.wolfram.com/Root-Mean-Square.html
- version: 4
  paper: 2021_Bliley
  agent:
    model: llm
    instructions: formulas_v2
    run: null
  events:
  - event: add
    entry:
      formula: cantilever_tip_stiffness
      kind: model
      statement: The stiffness of a slender elastic cantilever loaded at its free end is three times its modulus times its
        second moment of area over its length cubed.
      equations:
      - k = 3*E*I/L**3
      variables:
        k: stiffness
        E: modulus
        I: second_moment
        L: length
      assumes:
      - small deflection
      - linear elastic material
      - slender beam
      - point load at the free end
      does_not_apply: large deflections, a load applied away from the free end, or a short thick beam where shear deformation
        matters
      tests:
      - given:
          E: 1.0
          I: 1.0
          L: 1.0
        expect:
          k: 3.0
      - given:
          E: 200.0
          I: 2.0
          L: 2.0
        expect:
          k: 150.0
      - given:
          E: 1.0
          I: 1.0
          L: 1.0
        does_not_apply: 'load at mid-length of the cantilever: k = 24EI/L^3 (3EI/(L/2)^3), not 3EI/L^3'
      cites:
        text: Gere and Goodno, Mechanics of Materials, 8th ed., Cengage 2013, Appendix G, Table G-1 (cantilever beam, concentrated
          load at the free end)
        quote: δB = PL^3/3EI
  - event: add
    entry:
      formula: rect_second_moment
      kind: definition
      statement: The second moment of area of a rectangular cross-section of width w and thickness t, about its centroidal
        axis parallel to the width, is w t^3 / 12.
      equations:
      - I = w*t**3/12
      variables:
        I: second_moment
        w: length
        t: length
      does_not_apply: bending about the other axis (I = t*w^3/12) or a non-rectangular section
      tests:
      - given:
          w: 12.0
          t: 1.0
        expect:
          I: 1.0
      - given:
          w: 3.0
          t: 2.0
        expect:
          I: 2.0
      - given:
          w: 3.0
          t: 2.0
        does_not_apply: 'bending about the width axis swapped: t*w^3/12 = 4.5, not 2'
      cites:
        text: Gere and Goodno, Mechanics of Materials, 8th ed., Cengage 2013, Appendix E (properties of plane areas, rectangle)
        quote: Ix = bh^3/12
  - event: add
    entry:
      formula: strip_stiffness_thickness_ratio
      kind: derived
      statement: For two cantilever strips of the same modulus, width and length, the bending stiffness scales with the cube
        of the thickness.
      equations:
      - k2 = k1*(t2/t1)**3
      variables:
        k1: stiffness
        k2: stiffness
        E1: modulus
        E2: modulus
        I1: second_moment
        I2: second_moment
        L1: length
        L2: length
        w1: length
        w2: length
        t1: length
        t2: length
      assumes:
      - E2 = E1
      - w2 = w1
      - L2 = L1
      uses:
      - formula: cantilever_tip_stiffness
        subs:
          k: k1
          E: E1
          I: I1
          L: L1
      - formula: cantilever_tip_stiffness
        subs:
          k: k2
          E: E2
          I: I2
          L: L2
      - formula: rect_second_moment
        subs:
          I: I1
          w: w1
          t: t1
      - formula: rect_second_moment
        subs:
          I: I2
          w: w2
          t: t2
      does_not_apply: strips of different modulus, width or free length, where k2/k1 = (E2/E1)(w2/w1)(L1/L2)^3 (t2/t1)^3
      tests:
      - given:
          k1: 1.0
          t1: 1.0
          t2: 2.0
        expect:
          k2: 8.0
      - given:
          k1: 2.0
          t1: 2.0
          t2: 1.0
        expect:
          k2: 0.25
  - event: add
    entry:
      formula: work_def
      kind: definition
      statement: The work done by a constant force along a straight displacement in its direction is the force times the displacement.
      equations:
      - W = F*d
      variables:
        W: energy
        F: force
        d: length
      does_not_apply: a force not along the displacement (W = F d cos θ) or a force that varies along the path (W is the integral
        of F)
      tests:
      - given:
          F: 2.0
          d: 3.0
        expect:
          W: 6.0
      - given:
          F: 2.0
          d: 3.0
        does_not_apply: 'force at 60° to the displacement: W = 3, not 6'
      cites:
        text: 'ISO 80000-4:2019 Quantities and units, Part 4: Mechanics (work)'
        url: https://www.iso.org/standard/64975.html
- version: 5
  paper: 2022_Shen
  agent:
    model: llm
    instructions: formulas_v2
    run: null
  events:
  - event: add
    entry:
      formula: cumulative_variance_explained_two
      kind: definition
      statement: The share of total variance explained by two principal components of one PCA is the sum of the shares explained
        by each.
      equations:
      - c = p1 + p2
      variables:
        c: dimensionless
        p1: dimensionless
        p2: dimensionless
      does_not_apply: shares from different PCAs (different samples or gene sets), or a component counted twice
      tests:
      - given:
          p1: 0.61
          p2: 0.12
        expect:
          c: 0.73
      - given:
          p1: 0.5
          p2: 0.25
        expect:
          c: 0.75
      - given:
          p1: 0.61
          p2: 0.61
        does_not_apply: 'PC1 counted twice: 1.22 of the variance is impossible'
      cites:
        text: 'Jolliffe, I. T. Principal Component Analysis, 2nd ed. Springer (2002), Section 6.1.1: cumulative percentage
          of total variation t_m = 100 * sum_{k<=m} l_k / sum_k l_k'
        url: https://doi.org/10.1007/b98835
- version: 6
  paper: 2016_Mannhardt
  agent:
    model: llm
    instructions: formulas_v3
    run: null
  events:
  - event: add
    entry:
      formula: ratio_from_log2_values
      kind: derived
      statement: The ratio of two positive quantities given as binary logarithms is two to the power of the difference of
        the logarithms (a fold change from log2 values).
      equations:
      - r = 2**(la - lb)
      variables:
        r: dimensionless
        a: dimensionless
        b: dimensionless
        la: dimensionless
        lb: dimensionless
      assumes:
      - a = 2**la
      - b = 2**lb
      uses:
      - formula: ratio_def
        subs:
          r: r
          a: a
          b: b
      does_not_apply: values on a natural-log or log10 scale, or a mean of per-sample linear fold changes (2 to the difference
        of mean log2 values is the ratio of geometric means)
      tests:
      - given:
          la: 3.0
          lb: 1.0
        expect:
          r: 4.0
      - given:
          la: 7.85342
          lb: 7.29583
        expect:
          r: 1.47181
      - given:
          la: 3.0
          lb: 1.0
        does_not_apply: 'log2 difference read as a fold change: 2, not 4'
- version: 7
  paper: 2016_Ruan
  agent:
    model: llm
    instructions: formulas_v3
    run: null
  events:
  - event: add
    entry:
      formula: circular_cross_section_area
      kind: model
      statement: The cross-sectional area of a cylindrical specimen computed from one measured diameter, A = pi*d^2/4, treating
        the section as a circle.
      equations:
      - A = pi*d**2/4
      variables:
        A: area
        d: length
      assumes:
      - circular cross-section
      - uniform diameter along the length
      does_not_apply: flattened, elliptical or rectangular sections (strips, sheets), or a diameter that varies along the
        specimen
      tests:
      - given:
          d: 2.0
        expect:
          A: 3.14159265
      - given:
          d: 2.0
        does_not_apply: a square section of side 2 has area 4, not pi
      cites:
        text: 'Gere JM, Goodno BJ. Mechanics of Materials (Cengage), Appendix: Properties of plane areas, circle (A = pi d^2/4)'
        anchor:
          quote: assuming circular cross-sectional geometry
          where: Methods, Measurement of Contractile Function
  - event: add
    entry:
      formula: reciprocal_def
      kind: derived
      statement: The reciprocal of a quantity is one divided by it (a ratio with numerator 1).
      equations:
      - r = 1/b
      variables:
        r: 1/D
        b: D
        a: dimensionless
      assumes:
      - a = 1
      uses:
      - formula: ratio_def
        subs:
          r: r
          a: a
          b: b
      does_not_apply: a ratio with a numerator other than 1, or a reciprocal of a period read as a frequency in other units
      tests:
      - given:
          b: 4.0
        expect:
          r: 0.25
      - given:
          b: 4.0
        does_not_apply: negative reciprocal or 1 - b is not the reciprocal
  - event: add
    entry:
      formula: fraction_bounds
      kind: bound
      statement: A fraction of a whole (a part divided by the whole it belongs to) lies between 0 and 1 (0 % and 100 %).
      equations:
      - f >= 0
      - f <= 1
      variables:
        f: dimensionless
      does_not_apply: ratios of distinct quantities (fold changes, normalised values, % of baseline above 100 %)
      tests:
      - given:
          f: 0.4
      - given:
          f: 1.2
        does_not_apply: a fold change of 1.2 is not a fraction of a whole
      cites:
        text: 'NIST Special Publication 811 (2008), Guide for the Use of the International System of Units (SI), section 7.10:
          quantities of dimension one, such as mass fraction and volume fraction'
        url: https://www.nist.gov/pml/special-publication-811
- version: 8
  paper: 2018_Ulmer
  agent:
    model: llm
    instructions: formulas_v3
    run: null
  events:
  - event: add
    entry:
      formula: sum_of_parts
      kind: definition
      statement: A whole made of two non-overlapping parts of the same kind is the sum of the parts; a difference (change,
        consumption, production) is that sum solved for one part.
      equations:
      - t = a + b
      variables:
        t: D
        a: D
        b: D
      does_not_apply: overlapping parts (an item counted in both), or quantities of different kinds or units
      tests:
      - given:
          a: 133.0
          b: 123.0
        expect:
          t: 256.0
      - given:
          a: 0.5
          b: 0.25
        expect:
          t: 0.75
      - given:
          a: 133.0
          b: 123.0
        does_not_apply: 'overlapping parts: 10 items in both give a whole of 246, not 256'
      cites:
        text: 'ISO 80000-1:2022 Quantities and units, Part 1: General (quantities of the same kind can be added; the sum is
          a quantity of that kind)'
        url: https://www.iso.org/standard/76921.html
  - event: add
    entry:
      formula: sum_of_three_parts
      kind: derived
      statement: A whole made of three non-overlapping parts of the same kind is the sum of the three parts.
      equations:
      - t = a + b + c
      variables:
        t: D
        a: D
        b: D
        c: D
        u: D
      uses:
      - formula: sum_of_parts
        subs:
          t: u
          a: a
          b: b
      - formula: sum_of_parts
        subs:
          t: t
          a: u
          b: c
      does_not_apply: overlapping parts, or a part counted twice
      tests:
      - given:
          a: 228.0
          b: 51.0
          c: 12.0
        expect:
          t: 291.0
      - given:
          a: 1.0
          b: 2.0
          c: 3.0
        does_not_apply: 'b counted twice: 8, not 6'
  - event: add
    entry:
      formula: proportional_amount
      kind: derived
      statement: A quantity in a fixed proportion a:b to another quantity Q is Q times a/b (amount metabolised from the fraction
        of label recovered; product from a stoichiometric yield; a unit conversion by a factor).
      equations:
      - q = Q*a/b
      variables:
        q: D
        Q: D
        a: D2
        b: D2
        y: dimensionless
      assumes:
      - the proportion a to b holds for every part of Q
      uses:
      - formula: ratio_def
        subs:
          r: y
          a: q
          b: Q
      - formula: ratio_def
        subs:
          r: y
          a: a
          b: b
      does_not_apply: a proportion that changes across Q (label not equilibrated with the unlabelled pool; incomplete conversion),
        or an offset added to the product
      tests:
      - given:
          Q: 2.0
          a: 33.0
          b: 1.0
        expect:
          q: 66.0
      - given:
          Q: 280.0
          a: 2.0
          b: 2.0
        expect:
          q: 280.0
      - given:
          Q: 10.0
          a: 1.0
          b: 4.0
        expect:
          q: 2.5
      - given:
          Q: 2.0
          a: 33.0
          b: 1.0
        does_not_apply: 'incomplete conversion: half the substrate converted gives 33, not 66'
- version: 9
  paper: 2017_Mills
  agent:
    model: llm
    instructions: formulas_v3
    run: null
  events:
  - event: add
    entry:
      formula: cantilever_point_load_stiffness
      kind: model
      statement: The stiffness of a slender elastic cantilever loaded by a point force at distance x from its fixed end, with
        the deflection taken at the free end, is 6EI/(3Lx^2 - x^3).
      equations:
      - k = 6*E*I/(3*L*x**2 - x**3)
      variables:
        k: stiffness
        E: modulus
        I: second_moment
        L: length
        x: length
      assumes:
      - small deflection
      - linear elastic material
      - slender beam
      - point load at distance x from the fixed end
      - deflection taken at the free end
      does_not_apply: large deflections, a short thick beam where shear deformation matters, or a deflection taken at the
        load point (then k = 3EI/x^3)
      tests:
      - given:
          E: 1.0
          I: 1.0
          L: 1.0
          x: 1.0
        expect:
          k: 3.0
      - given:
          E: 1.0
          I: 1.0
          L: 2.0
          x: 1.0
        expect:
          k: 1.2
      - given:
          E: 1.0
          I: 1.0
          L: 2.0
          x: 1.0
        does_not_apply: 'deflection read at the load point: k = 3EI/x^3 = 3, not 1.2'
      cites:
        text: Gere and Goodno, Mechanics of Materials, 8th ed., Cengage 2013, Appendix G, Table G-1 (cantilever beam, concentrated
          load P at distance a from the support)
        quote: δB = Pa^2(3L - a)/6EI
  - event: add
    entry:
      formula: cantilever_point_load_stiffness_rect
      kind: derived
      statement: For a rectangular cantilever (width w in the plane, thickness t in the bending direction) loaded at distance
        x from its fixed end, the stiffness at the free end is E w t^3 / (2(3Lx^2 - x^3)).
      equations:
      - k = E*w*t**3/(2*(3*L*x**2 - x**3))
      variables:
        k: stiffness
        E: modulus
        I: second_moment
        L: length
        x: length
        w: length
        t: length
      uses:
      - formula: cantilever_point_load_stiffness
        subs:
          k: k
          E: E
          I: I
          L: L
          x: x
      - formula: rect_second_moment
        subs:
          I: I
          w: w
          t: t
      does_not_apply: a non-rectangular (e.g. circular) pole section, where I = pi d^4/64
      tests:
      - given:
          E: 1.0
          w: 12.0
          t: 1.0
          L: 1.0
          x: 1.0
        expect:
          k: 3.0
      - given:
          E: 1500000.0
          w: 0.0005
          t: 0.0002
          L: 0.0007
          x: 0.00035
        expect:
          k: 13.994169096209912
      - given:
          E: 1.0
          w: 12.0
          t: 1.0
          L: 1.0
          x: 1.0
        does_not_apply: 'width and thickness swapped (w = 1, t = 12): k is 144 times larger'
