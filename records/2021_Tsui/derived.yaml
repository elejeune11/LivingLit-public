  ST5_RASGRF1.fold_change:
    item: ST5_RASGRF1
    measure: fold change
    formula: fc = a/b
    anchor:
      quote: Upregulated fold changes in dECM-rGO EHTs
      where: Table S5
      file: NIHMS1685525-supplement-3.docx
      kind: table cell
    library:
      formula: ratio_def
      vars:
        r: fc
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: not stated
        note: RASGRF1 normalised expression in dECM-rGO EHTs
      b:
        not_stated: true
        kind: not stated
        note: RASGRF1 normalised expression in dECM-only EHTs
    output: ST5_RASGRF1.values.fc_RASGRF1_table
    alternatives:
    - label: DESeq2 model estimate
      formula: fc = 2^l
      note: fold change as 2^log2FC from DESeq2's negative-binomial fit (shrunken or not, not stated)
    note: Fold changes come from DESeq2 (Methods 2.17), not from printed means.
