# Derivations of 2016_Kerscher, written by the formula agent (instructions formulas_v3).
record: 2016_Kerscher
formula_library_version: 31
agent:
  model: llm
  instructions: formulas_v3
derived:
  S1B_growth_d5.growth_imr_d5:
    item: S1B_growth_d5
    group: imr_d5
    measure: lateral surface area increase
    formula: d = (A5 - A0)/A0
    anchor:
      quote: Tissue growth was based on normalized day 0 tissue surface area
      where: Methods, Tissue area growth
      file: nihms-755756.pdf
    library:
      formula: relative_change
      vars:
        d: d
        x: A5
        x0: A0
    inputs:
      A5:
        not_stated: true
        kind: per sample
        note: day-5 lateral surface area of each tissue; not printed
      A0:
        not_stated: true
        kind: per sample
        note: day-0 lateral surface area of the same tissue; not printed
    output: S1B_growth_d5.values.growth_imr_d5_text
    aggregation: not stated
    alternatives:
    - label: ratio to day 0, then minus 1
      formula: d = A5/A0 - 1
      note: '''normalized day 0 tissue surface area'' read as A5/A0; the printed 20.1 % is an expansion, so the change is
        the ratio minus 1 (relative_change_from_ratio)'
    note: the paper prints the day-5 value as an expansion of the area ('expanded microisland lateral surface area of 20.1
      ± 8.0%'); per-tissue areas are not printed and Fig. S1B has no points
