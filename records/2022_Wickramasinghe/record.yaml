claims:
  abs_isoform:
    kind: stated
    quote: we find that peroxisome-proliferator-associated receptor (PPAR) signaling regulates glycolysis and fatty acid oxidation (FAO) in an
      isoform-specific manner
    where: Summary
    scope: hPSC-CMs
    strength: not stated
    rests_on:
    - F3A_deg_gw
    - F3A_deg_gsk
    - F3B_fao_gw
    - F3A_kegg_gw
    - F4B_cd36_gw
    opposes: []
    cites: []
    judgement:
      direction: follows
      support: overstated
      comparison: follows
      scope: follows
      replication: follows
      strength: overstated
      presence: follows
    note: glycolysis regulation rests on early pathway changes only; no glycolytic flux measured; PPARa/PPARg agonists not shown to differ in
      FAO flux
  abs_ppara_active:
    kind: stated
    quote: While PPARalpha (PPARa) is the most active isoform in hPSC-CMs
    where: Summary
    scope: not stated
    strength: not stated
    rests_on:
    - F1N_abundance
    - F1A_PPARA
    opposes: []
    cites: []
    judgement:
      direction: follows
      support: overstated
      comparison: overstated
      scope: follows
      replication: follows
      strength: follows
      presence: follows
    note: '''most active'' rests on expression abundance, not on a measure of activity'
  abs_fao_networks:
    kind: stated
    quote: PPARdelta (PPARd) activation efficiently upregulates the gene regulatory networks underlying FAO
    where: Summary
    scope: not stated
    strength: not stated
    rests_on:
