  F2d_oop:
    unit: F2af
    measure: sarcomere orientational order parameter
    method: immunofluorescent imaging of sarcomeric α-actinin; confocal projected z-stacks
    software: custom MATLAB code
    definition: &id004
      citation: cit19
      anchor:
        quote: quantification of the sarcomere orientational order parameter (OOP)
        where: p. 305, main text
    finding: All spacings give OOP > 0.2; the highest OOP (∼0.5) at 60 µm spacing, marked significant.
    compares:
    - s40
    - s60
    - s80
    - s100
    test_of: omnibus
    n:
      printed: 40 (n = 9), 60 (n = 13), 80 (n = 8) and 100 µm (n = 10)
      counts: laminar NRVM tissues
      per_group:
        s40: '9'
        s60: '13'
        s80: '8'
        s100: '10'
    values:
      oop_s60_text:
        printed: ∼0.5
        unit: ''
        kind: mean
        group: s60
        spread: none
      oop_all_text:
        printed: '> 0.2'
        unit: ''
        kind: mean
        over:
        - s40
        - s60
        - s80
        - s100
        spread: none
    stats:
      test: one-way analysis of variance with Holm–Sidak pairwise comparison
      p: ∗, P < 0.05
    anchor:
      quote: Sarcomere OOP of laminar NRVM tissues developed on substrates with 40 (n = 9), 60 (n = 13), 80 (n = 8) and 100 µm (n = 10)
      where: Fig. 2d legend
    note: Asterisk sits over the 60 µm bar only; the partner groups of the post-hoc comparison are not marked, so no pair is written. Test from
      Methods (one-way ANOVA, Holm–Sidak for pairwise). Error bars s.e.m.
  F2g_velocity_ratio:
    unit: F2gi
    measure: ratio of action potential propagation speed parallel to orthogonal to grooves
    method: optical mapping (tandem-lens macroscope, MiCAM Ultima camera, 200 Hz) with RH237; activation time as time to maximum upstroke slope;
      post-processing as previously described [21]
    software: custom MATLAB code
    definition: Ratio between action potential (AP) propagation speed parallel and orthogonal to the grooves
    finding: 60 µm spacing gives the highest anisotropy; propagation 2.7 times faster parallel than transverse.
    groups:
    - s40
    - s60
    - s80
    - s100
    n:
      printed: n ≥ 3
      counts: not stated
    values:
      ratio_s60_text:
        printed: '2.7'
        unit: ''
        kind: mean
        group: s60
        spread: none
    anchor:
      quote: orthogonal to the grooves for laminar NRVM tissue developed on substrates with 40, 60, 80 and 100 µm filament spacing, (n ≥ 3)
      where: Fig. 2g legend
    note: No test printed. Error bars s.e.m.; individual points plotted.
  F2g_native_ratio:
    unit: F2gi
    measure: ratio of action potential propagation speed parallel to orthogonal to grooves
