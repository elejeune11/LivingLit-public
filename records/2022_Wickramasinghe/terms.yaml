vocabulary_version: 56
agent: {model: llm, instructions: terms_v4}
edits:
# ---------------------------------------------------------------- synonyms
- add_synonym: {id: CHEBI:62878, text: XAV, anchor: "5 mmol/L XAV (Stemgent). On Day 5, medium was changed to differentiation medium supplemented with 5 ng/ml VEGF"}
- add_synonym: {id: platform:monolayer, text: 2D monolayers, anchor: "hPSC-CMs were plated as 2D monolayers at day 20 of differentiation"}
- add_synonym: {id: purification:facs, text: FACS, anchor: "RNA was extracted from FACS-isolated SIRPA+CD90- hPSC-CMs"}
- add_synonym: {id: measurement_medium:tyrode_solution, text: "Tyrode's buffer", anchor: "incubated in 1X Tyrode’s buffer with 10 mM blebbistatin for"}
- add_synonym: {id: CL:0002129, field: cell_types, text: atrial hPSC-CMs, anchor: "We demonstrated that CD36 is also low in atrial hPSC-CMs"}
- add_synonym: {id: CL:0000057, field: cell_types, text: hPSC-derived fibroblasts, anchor: "Oxygen consumption rate (OCR) in hPSC-CMs and hPSC-derived fibroblasts (black)"}
- add_synonym: {id: measure:spare_respiratory_capacity, text: respiratory spare capacity, anchor: "Basal respiration (left) and respiratory spare capacity (right)"}
- add_synonym: {id: measure:fatty_acid_oxidation_rate, text: FAO flux, anchor: "FAO flux assay 4 weeks after PPARd modulation (n = 4)."}
- add_synonym: {id: measure:maximum_capture_rate, text: maximum capture frequency, anchor: "and the maximum capture frequency across EHTs remained unchanged"}
- add_synonym: {id: measure:twitch_force, text: developed force, anchor: "twitch parameters including developed force (DF; calculated from the post deflection with each twitch)"}
- add_synonym: {id: measure:angle_dispersion, text: circularity standard deviation, anchor: "to determine alignment (Mean Vector Length, MVL) and the circularity standard deviation (CSD)"}
- add_synonym: {id: measure:binucleated_cell_fraction, text: binucleated hPSC-CMs, anchor: "Percentage of binucleated hPSC-CMs determined on images from IF analysis for ACTN2 and DAPI stain"}
# ---------------------------------------------------------------- treatment (ChEBI)
- adopt: {field: treatment, id: CHEBI:79989, label: GW 6471, lookup: "livinglit lookup chebi GW6471: exact"}
- adopt: {field: treatment, id: CHEBI:79993, label: GW 9662, lookup: "livinglit lookup chebi GW9662: exact"}
- adopt: {field: treatment, id: CHEBI:79991, label: GW 0742, lookup: "livinglit lookup chebi GW0742: exact"}
- adopt: {field: treatment, id: CHEBI:50122, label: rosiglitazone, lookup: "livinglit lookup chebi rosiglitazone: exact (racemate; the paper does not name an enantiomer or salt)"}
- adopt:
    field: treatment
    id: CHEBI:32509
    label: pirinixic acid
    lookup: "livinglit lookup chebi WY14643 and WY-14643: nothing; pirinixic acid is WY-14643 (exact label match)"
    synonyms: [{text: WY14643, anchor: "Rosiglitazone (Sigma-Aldrich, 5 μM), WY14643 (Sigma-Aldrich, 5 μM) with or without"}]
- adopt_own:
    field: treatment
    id: treatment:gsk0660
    label: GSK0660
    definition: A small-molecule PPARδ antagonist (inverse agonist) used to inhibit PPARδ signalling.
    scope: The named PPARδ antagonist compound; not other own small molecules (EMD-57033, BTS, ATX-II, NS-1643, compound 6.28, pifithrin-α, nutlin-3a), not proteins, RNAs, cells or physical exposures.
    lookup: "livinglit lookup chebi GSK0660, 'GSK 0660', GSK-0660 and GSK: no GSK0660 entry in the pinned ChEBI release"
# ---------------------------------------------------------------- platform
- add_term:
    field: platform
    id: platform:embryoid_body
    label: embryoid body
    parent: platform:cell_aggregate
    definition: A suspension aggregate of pluripotent stem cells in which they are differentiated, before any replating.
    scope: Aggregates formed from undifferentiated stem cells to drive differentiation; not a fused tissue of several preformed aggregates (organoid aggregate macrotissue), and not a spheroid formed from already differentiated cardiomyocytes (cell aggregate).
    synonyms: [{text: embryoid bodies, anchor: "or until cells dissociated from plates, to generate embryoid bodies (EBs)"}]
# ---------------------------------------------------------------- measures
- add_term:
    field: measure
    id: measure:mean_vector_length
    label: mean vector length
    definition: Length of the mean resultant vector of the orientations of a stated structure (qualifier structure), from 0 (no common direction) to 1 (all aligned).
    scope: The circular-statistics resultant length as an alignment index; not the standard deviation of angles (angle dispersion), not an orientational order parameter, not a sarcomere alignment index and not the von Mises concentration.
    dimension: dimensionless
    qualifiers: {structure: {dimension: text}}
    synonyms: [{text: mean vector length, anchor: "to determine alignment (Mean Vector Length, MVL) and the circularity standard deviation (CSD)"}]
- add_term:
    field: measure
    id: measure:chromatin_accessibility
    label: chromatin accessibility
    definition: Accessibility of chromatin at a stated locus or gene (qualifier locus), read from ATAC-seq or a similar assay.
    scope: Open chromatin at one locus; not a histone mark signal (histone mark signal), not gene expression and not a count of differential loci.
    dimension: dimensionless
    qualifiers: {locus: {dimension: text}}
    synonyms: [{text: chromatin accessibility, anchor: "the biggest increases and decreases in chromatin accessibility in GW0742 compared with"}]
- add_term:
    field: measure
    id: measure:mitochondrial_morphology
    label: mitochondrial morphology
    definition: Shape, size or internal structure of mitochondria, with the aspect in a qualifier (feature).
    scope: Mitochondrial shape or ultrastructure as a whole or as a stated feature (cristae); not mitochondrial mass or content from a dye (mitochondrial mass), and not the share of image area covered by mitochondria (mitochondrial area fraction).
    dimension: categorical
    qualifiers: {feature: {dimension: text}}
- add_term:
    field: measure
    id: measure:mitochondrial_length
    label: mitochondrial length
    parent: measure:mitochondrial_morphology
    definition: Length of single mitochondria along their long axis in micrographs.
    scope: The long axis of a mitochondrion; not its short axis (mitochondrial width).
    dimension: length
- add_term:
    field: measure
    id: measure:mitochondrial_width
    label: mitochondrial width
    parent: measure:mitochondrial_morphology
    definition: Width of single mitochondria across their long axis in micrographs.
    scope: The short axis of a mitochondrion; not its long axis (mitochondrial length).
    dimension: length
- add_term:
    field: measure
    id: measure:systolic_force
    label: systolic force
    definition: Total force a tissue exerts at the peak of a contraction, the resting (diastolic) force included.
    scope: Absolute force at peak contraction; not the active amplitude above the resting force (twitch force, developed force), not the resting force between beats (diastolic force), and not force per cross-section.
    dimension: force
- add_term:
    field: measure
    id: measure:diastolic_force
    label: diastolic force
    definition: Force a beating tissue exerts between contractions, at rest in its device.
    scope: Resting force between beats at the device's own length; not passive tension at an imposed stretch (passive tension), not resting stress (diastolic stress), and not peak force (systolic force).
    dimension: force
    synonyms: [{text: diastolic force, anchor: "increases in systolic and diastolic force following PPARd induction"}]
- add_term:
    field: measure
    id: measure:cell_proliferation
    label: cell proliferation, assay not stated
    definition: Proliferation of cells reported without its assay or marker.
    scope: Use only when a source states proliferation without the assay; a marker-positive fraction (EdU, Ki67, pH3) is marker-positive cells and a DNA-content phase share is cell cycle phase fraction.
    dimension: categorical
- add_term:
    field: measure
    id: measure:electrical_coupling
    label: electrical coupling, measure not stated
    definition: Electrical coupling between cells reported without the quantity measured.
    scope: Use only when a source states coupling without a measure; conduction velocity, gap junction protein levels or dye transfer have their own terms.
    dimension: categorical
- add_term:
    field: measure
    id: measure:sequencing_read_count
    label: sequencing read count
    definition: Number of sequencing reads per sample meeting a stated criterion (qualifier criterion), such as reads aligned or pseudoaligned.
    scope: A sequencing quality figure; not a gene's expression and not a count of differentially expressed genes.
    dimension: dimensionless
    qualifiers: {criterion: {dimension: text}}
    synonyms: [{text: reads successfully pseudoaligned, anchor: "The average number of reads successfully pseudoaligned across samples was 16.46 million"}]
# ---------------------------------------------------------------- standing keys
- standing_key:
    measure: measure:mean_vector_length
    value: {must_match: [platform@1, preparation, measure.structure, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.structure], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:chromatin_accessibility
    value: {must_match: [platform@1, preparation, measure.locus, measure.expressed_as, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.locus], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:mitochondrial_morphology
    value: {must_match: [platform@1, preparation, measure.feature, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.feature], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:mitochondrial_length
    value: {must_match: [platform@1, preparation, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:mitochondrial_width
    value: {must_match: [platform@1, preparation, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:systolic_force
    value: {must_match: [platform@1, preparation, pacing, temperature, measurement_calcium_mM, mechanical_load, measure.expressed_as, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, pacing], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:diastolic_force
    value: {must_match: [platform@1, preparation, pacing, temperature, measurement_calcium_mM, mechanical_load, measure.expressed_as, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, pacing], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:cell_proliferation
    value: {must_match: [platform@1, preparation, method, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:electrical_coupling
    value: {must_match: [platform@1, preparation, pacing, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
