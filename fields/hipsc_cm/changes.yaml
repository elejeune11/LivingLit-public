    dimension: dimensionless
    definition: Number of calcium transient events in a recording classed as abnormal by a stated criterion (qualifier criterion),
      such as delayed afterdepolarisation-like events.
    scope: A count of abnormal events within recordings; not the share of hearts or tissues with an arrhythmia (arrhythmia
      incidence) and not a present-or-absent judgement of irregular transients (calcium transient irregularity).
