  F3_res_death.resistance:
    item: F3_res_death
    measure: vascular resistance
    formula: R = P/Q
    anchor:
      quote: Mean vascular resistance calculated under constant pressure perfusion
      where: Figure 3 legend
    library:
      formula: ratio_def
      vars:
        r: R
        a: P
        b: Q
    inputs:
      P:
        printed: '60'
        unit: mmHg
        kind: constant
        anchor:
          quote: constant pressure of 60 mmHg at room temperature
          where: Online Methods, Human Heart Preparation and Decellularization
          file: NIHMS733623-supplement-306874DR2_Online_Data_Supplement.pdf
      Q:
        item: F3_flow_death
        kind: per sample
        note: flow rates are plotted only (Figure 3A); not read
    aggregation: not stated
    note: the resistance formula is not printed; 'vascular resistance' names pressure over flow
  F3_res_solution.resistance:
