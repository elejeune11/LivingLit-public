evidence:
  S1_purity_cm:
    unit: S1
    measure: percentage of hiPSC-CMs expressing cTnT
    finding: 96.4% of the hiPSC-CMs expressed cTnT.
    anchor:
      quote: 96.4% of the hiPSC-CMs expressed cTnT (Supplemental Figure 1B)
      where: Results, Differentiation and characterization of hiPSC-CMs, -SMCs, and -ECs
      file: nihms936001.pdf
    groups:
    - cm
    values:
      pct_text:
        printed: '96.4'
        unit: '%'
        kind: percent
        group: cm
        spread: none
      pct_figure:
        printed: '96.4'
        unit: '%'
        kind: percent
        group: cm
        spread: none
    method: flow cytometry on a FACS Aria instrument after permeabilization and staining with the indicated primary antibodies
    software: not stated
  S1_purity_smc:
    unit: S1
    measure: percentage of hiPSC-SMCs expressing αSMA
    finding: 91.5% of the hiPSC-SMCs expressed αSMA.
    anchor:
      quote: 91.5% of the hiPSC-SMCs expressed αSMA (Supplemental Figure 1C)
      where: Results, Differentiation and characterization of hiPSC-CMs, -SMCs, and -ECs
      file: nihms936001.pdf
    groups:
    - smc
    values:
      pct_text:
        printed: '91.5'
        unit: '%'
        kind: percent
        group: smc
        spread: none
      pct_figure:
        printed: '91.5'
        unit: '%'
        kind: percent
        group: smc
        spread: none
    method: flow cytometry on a FACS Aria instrument after permeabilization and staining with the indicated primary antibodies
    software: not stated
  S1_purity_cd31:
    unit: S1
    measure: percentage of hiPSC-ECs expressing CD31
    finding: 95.8% of the hiPSC-ECs expressed CD31.
    anchor:
      quote: The purity of the hiPSC-EC population was determined via flow-cytometry analysis of CD31 and vascular endothelial cadherin (VE-cadherin) expression
      where: Supplemental Figure 1 legend
      file: NIHMS936001-supplement-Supple_manuscript.pdf
    groups:
    - ec
    values:
      pct_figure:
        printed: '95.8'
        unit: '%'
        kind: percent
        group: ec
        spread: none
    method: flow cytometry on a FACS Aria instrument after permeabilization and staining with the indicated primary antibodies
    software: not stated
    note: the value is printed inside Supplemental Figure 1D only
  S1_purity_vecad:
    unit: S1
    measure: percentage of hiPSC-ECs expressing VE-cadherin
    finding: 97.1% of the hiPSC-ECs expressed VE-cadherin.
    anchor:
      quote: The purity of the hiPSC-EC population was determined via flow-cytometry analysis of CD31 and vascular endothelial cadherin (VE-cadherin) expression
      where: Supplemental Figure 1 legend
      file: NIHMS936001-supplement-Supple_manuscript.pdf
    groups:
    - ec
    values:
      pct_figure:
        printed: '97.1'
        unit: '%'
        kind: percent
        group: ec
        spread: none
    method: flow cytometry on a FACS Aria instrument after permeabilization and staining with the indicated primary antibodies
    software: not stated
    note: the value is printed inside Supplemental Figure 1E only
  S1_purity_ec_text:
    unit: S1
    measure: percentage of hiPSC-ECs expressing CD31 and/or VE-cadherin
    finding: '>95% of the hiPSC-ECs expressed CD31 and/or VE-cadherin.'
    anchor:
      quote: 95% of the hiPSC-ECs expressed CD31 and/or VE-cadherin (Supplemental Figures 1D and 1E)
      where: Results, Differentiation and characterization of hiPSC-CMs, -SMCs, and -ECs
      file: nihms936001.pdf
    groups:
    - ec
    values:
      pct_text:
        printed: '>95'
        unit: '%'
        kind: percent
        group: ec
        spread: none
    method: flow cytometry on a FACS Aria instrument after permeabilization and staining with the indicated primary antibodies
    software: not stated
    suspected_error:
      what: the journal version reads 'CD31 and vascular endothelial cadherin', the author manuscript 'CD31 and/or VE-cadherin'
      why: the two versions of the same sentence state a different marker combination
  S2_mlc2a:
    unit: S2
    measure: MLC2a mRNA expression
    finding: MLC2a mRNA expression did not differ significantly between the four conditions.
    anchor: &id052
      quote: was evaluated via quantitative RT-PCR in hCMPs and in monolayers composed of equivalent populations of hiPSC-derived cardiac cells on day 1 and day 7 after fabrication
      where: Supplemental Figure 2 legend
      file: NIHMS936001-supplement-Supple_manuscript.pdf
    groups:
    - mono_d1
    - hcmp_d1
    - mono_d7
    - hcmp_d7
    n: &id053
      printed: n = 4 hCMPs or monolayers per time point
      counts: hCMPs or monolayers
    method: quantitative RT-PCR with Maxima SYBR Green Master Mix on a Realplex 2 Real-Time PCR system
    software: not stated
    definition: Measurements were calculated via the 2-ΔCt method and normalized to glyceraldehyde phosphate dehydrogenase RNA levels
    note: no mark of significance is printed for this gene
