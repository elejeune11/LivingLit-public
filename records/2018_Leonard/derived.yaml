    note: the same method holds for every F2 twitch work item; plotted values are maxima during contraction
  F1_stiffness_text.stiffness:
    item: F1_stiffness_text
    measure: flexible post stiffness
    formula: not stated
    anchor: not stated
    no_formula: calibration stated only by citation [27]
    inputs:
      k_pipette:
        printed: '0.28'
        unit: μN/μm
        anchor: &id005
          quote: with a glass pipette of known stiffness (0.28 μN/μm) following a previously described procedure [27]
          where: Section 2.1
        kind: constant
      method:
        by_reference:
          citation: ref27
          anchor: *id005
        kind: not stated
    alternatives:
    - label: springs in series (pipette against post)
      formula: k = k_pipette*d_pipette/d_post
      note: the usual calibration; not stated here
  F3_maxforce_text.K4_over_K1_discussion:
    item: F3_maxforce_text
    measure: maximum isometric twitch force at Lmax
    formula: r = a/b
    anchor:
      quote: Here, we observe a similar (1.5-fold) improvement with applied afterload
      where: Section 4
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        value: F3_maxforce_text.values.K4_mean_text
        kind: constant
      b:
        value: F3_maxforce_text.values.K1_mean_text
        kind: constant
    output: F3_maxforce_text.values.K4_over_K1_discussion
    aggregation: of means
    note: '"n-fold improvement" read as the ratio of group means'
  F3_maxforce_text.K4_over_UL_discussion:
    item: F3_maxforce_text
    measure: maximum isometric twitch force at Lmax
    formula: r = a/b
    anchor:
      quote: a more dramatic (4.7-fold) improvement when comparing our highest afterload to our unloaded condition
      where: Section 4
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        value: F3_maxforce_text.values.K4_mean_text
        kind: constant
      b:
        value: F3_maxforce_text.values.UL_mean_text
        kind: constant
    output: F3_maxforce_text.values.K4_over_UL_discussion
    aggregation: of means
    note: '"n-fold improvement" read as the ratio of group means'
  F7A_NPPA_K4vDay1.change:
    item: F7A_NPPA_K4vDay1
