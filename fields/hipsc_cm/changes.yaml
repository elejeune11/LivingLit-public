      the compound sold as (epsilon-)aminocaproic acid.
    synonyms:
    - text: aminocaproic acid
      anchor: aminocaproic acid to prevent ﬁbrin degradation
  - event: add_synonym
    id: substrate:fibrin_hydrogel
    text: fibrinogen
    anchor: Hydrogel solution (24 μL human ﬁbrinogen (10 mg/mL, Sigma F4883), 12 μL Matrigel
  - event: add_term
    field: platform
    id: platform:frame_anchored_patch
    label: frame-anchored tissue patch
    parent: platform:engineered_3d
    definition: A flat engineered tissue sheet cast in a mould with its edges anchored to a surrounding frame (such as a nylon
      mesh frame) and cultured free-floating in medium.
    scope: A flat sheet held at its edges by a frame; not a tissue suspended between two pillars and not a tissue cast around
      a single bending strip.
    qualifiers:
      size:
        dimension: text
    synonyms:
    - text: cardiopatch
      anchor: a “Cardiopatch” platform for 3D culture and maturation of hiPSC-CMs
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:dynamic_culture
    label: dynamic culture
    definition: Culture of free-floating constructs on a rocking platform or in moving medium, to improve nutrient and oxygen
      supply.
    scope: Agitated or flowing medium around the construct; not mechanical loading through a load-bearing element (mechanical
      loading), not electrical stimulation, not a change of medium composition (maturation medium), and not static culture.
    synonyms:
    - text: free-floating dynamic culture
      anchor: After 3 weeks of free-ﬂoating dynamic culture
  - event: add_term
    field: maturation_strategy
    id: maturation_strategy:static_culture
    label: static culture
    definition: Culture in still medium without rocking or flow, named as the comparison for dynamic culture.
    scope: Still medium, stated as the contrast to dynamic culture; not dynamic culture, and not any electrical, mechanical
      or medium-based strategy.
  - event: add_term
    field: pacing
    id: pacing:spontaneous
    label: spontaneous beating
    definition: No stimulation during the measurement; the cells or tissue beat at their own rate.
    scope: Unpaced, spontaneous activity; not electrical pacing of any kind.
    synonyms:
    - text: spontaneous
      anchor: Cardiopatches exhibited spontaneous macroscopic contractions
  - event: set_scope
    id: pacing:electrical_pacing
    scope: Beats driven by an electrical stimulus (the delivery is a narrower term, frequency and protocol are qualifiers);
      not spontaneous beating.
  - event: add_qualifier
    id: pacing:electrical_pacing
    name: protocol
    dimension: text
  - event: add_term
    field: pacing
    id: pacing:field_stimulation
    label: field stimulation
    parent: pacing:electrical_pacing
    definition: Electrical pacing by an electric field between two electrodes on either side of the whole sample.
    scope: Field across the whole sample; not a point electrode at one site and not current injection through a patch pipette.
    synonyms:
    - text: field-electrode stimulation
      anchor: recorded during 1 Hz ﬁeld-electrode stimulation (10 ms duration
    - text: field-shock stimulation
      anchor: step-wise increases in ﬁeld-shock stimulation at 1, 1.5, and 2 Hz
  - event: add_term
    field: pacing
    id: pacing:point_stimulation
    label: point stimulation
    parent: pacing:electrical_pacing
    definition: Electrical pacing from a point electrode at one site of the sample, so that activation spreads from that site.
    scope: Stimulus at one site (used to measure conduction); not a field across the whole sample and not current injection
      through a patch pipette.
  - event: set_scope
    id: pacing:current_clamp_stimulation
    scope: Current injected into one cell through a patch pipette; not a field across the sample and not a point electrode
