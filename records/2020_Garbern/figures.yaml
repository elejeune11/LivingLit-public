    - 284
    - 308
    script: figures/F3C.py
    unit: F3C
    kind: raster
    groups:
      Control:
        item: F3C_mitotracker
        group: ctrl
        unit_of_value: MFI (axis prints no unit)
      Torin1 (200 nM):
        item: F3C_mitotracker
        group: t200
        unit_of_value: MFI (axis prints no unit)
    note: Raster bars with individual points (n=3 per group). Read from the author manuscript copy (300 dpi image; the journal
