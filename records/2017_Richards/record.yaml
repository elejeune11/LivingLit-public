evidence:
  F2A_ratio_dev_heart:
    unit: F2A
    measure: cardiac cell type fraction (by number)
    method: reported literature
    software: not stated
    finding: Literature-reported fractions of cardiomyocytes, fibroblasts and endothelial cells differ between developing
      and adult stage hearts
    groups:
    - dev_heart
    anchor:
      quote: The ratio of cardiac cell types (by number) changes throughout development, based on reported literature
      where: Fig. 2 legend
  F2A_ratio_adult_heart:
    unit: F2A
    measure: cardiac cell type fraction (by number)
    method: reported literature
    software: not stated
    finding: Literature-reported fractions of cardiomyocytes, fibroblasts and endothelial cells differ between developing
      and adult stage hearts
    groups:
    - adult_heart
    anchor:
      quote: The ratio of cardiac cell types (by number) changes throughout development, based on reported literature
      where: Fig. 2 legend
  F2E_amp:
    unit: F2
    measure: contraction amplitude
    method: threshold edge-detecting on video of fractional area change
    software: Zen 2011, Adobe Premiere and ImageJ
    definition: the percent change in fractional area change amplitude between contraction and relaxation
    finding: Developing stage ratio organoids showed higher contraction amplitude than adult stage ratio organoids at D10
    compares:
    - dev
    - adult
    n:
      printed: n=8–12 organoids
      counts: organoids
    stats:
      test: not stated
      p: '*p<0.05'
    anchor:
      quote: Analysis of average (±SEM) contraction amplitude (i.e., fractional area change) showed significant differences
        at D10
      where: Fig. 2E legend
    note: Bars are means ± SEM (legend); values only plotted.
  F2E_beating:
    unit: F2
    measure: fraction of organoids beating
    method: video analysis
    software: not stated
    finding: 100% of developing stage ratio organoids beat at D10, ~50% of adult stage ratio organoids
    groups:
    - dev
    - adult
    values:
      beating_dev_legend:
        printed: 100%
        unit: '%'
        kind: percent
        group: dev
        spread: none
      beating_adult_legend:
        printed: ~50%
        unit: '%'
        kind: percent
        group: adult
        spread: none
      beating_dev_figure:
        printed: 100%
        unit: '%'
        kind: percent
        group: dev
        spread: none
      beating_adult_figure:
        printed: ~50%
        unit: '%'
        kind: percent
        group: adult
        spread: none
    anchor:
      quote: Developing stage ratio organoids showed 100% of organoids beating at D10, while adult stage ratio organoids had
        only ~50% beating
      where: Fig. 2E legend
    note: Values also printed above the bars of Fig. 2E (figure text).
  F2_regularity:
    unit: F2
    measure: regularity of beating
    method: video analysis of contraction profiles
    software: not stated
    finding: Developing stage ratio organoids beat more regularly than adult ratio organoids
    compares:
    - dev
    - adult
    stats:
      test: not stated
      p: p<0.05 (Methods)
    anchor:
      quote: significantly higher contraction amplitude (i.e., fractional area change) and regularity of beating than adult
        ratio organoids
      where: Results 2.1
    stated_direction:
      direction: up
      anchor:
        quote: significantly higher contraction amplitude (i.e., fractional area change) and regularity of beating than adult
          ratio organoids
        where: Results 2.1
    note: No measure of regularity is defined or plotted; the representative traces in Fig. 2D are the only display.
  S2_zline:
    unit: S2
    measure: sarcomere formation (Z-line formation)
    method: immunofluorescence on 7 μm cryosections, confocal imaging (Leica TCS SP5)
    software: not stated
    finding: Developing stage ratio organoids showed sarcomeric banding; adult ratio organoids minimal Z-line formation
    compares:
    - dev
    - adult
    stats:
      test: not stated
      p: not stated
    anchor:
      quote: enhanced sarcomere development (e.g., Z-line formation) in developing stage ratio organoids at D10 when compared
        to adult ratio organoids
      where: Results 2.1
    stated_direction:
      direction: up
      anchor:
        quote: enhanced sarcomere development (e.g., Z-line formation) in developing stage ratio organoids at D10 when compared
          to adult ratio organoids
        where: Results 2.1
    note: Qualitative, from images (Fig. S2); no test.
  S3_viability:
    unit: S3
    measure: TUNEL-based viability index
    method: TUNEL staining (Roche In Situ Cell Death Detection Kit) on frozen sections
    software: not stated
    definition: '[1 – (TUNEL-positive area/DAPI-positive area)]'
    finding: Ratiometric media gave a better viability index than DMEM/F12 with FBS at D0
    compares:
      condition:
      - ratiometric
      reference:
      - dmem0
      - dmem5
      - dmem10
    test_of: main effect
    n:
      printed: n=3-4 organoids
      counts: organoids
    stats:
      test: not stated
      p: '*p <0.05'
    anchor:
      quote: 'Fig. S3 legend: ratiometric media compared to DMEM/F12 with FBS cultured; n=3-4 organoids; Asterisk represents
        significant difference with control, p <0.05.'
      where: Fig. S3 legend
      file: NIHMS894081-supplement.docx
      kind: unit
    note: One asterisk over the ratiometric bar; the legend says 'significant difference with control' without naming the
      control group(s); written as ratiometric against the three DMEM/F12 groups.
  F3C_vwf_D10:
    unit: F3AC
    measure: vWF-positive area (normalized over spheroid area)
    method: vWF immunofluorescence on cryosections
    software: not stated
    definition: vWF-positive covered area divided by spheroid area
    finding: With hADSCs, vWF-positive area was higher than without at D10
    compares:
    - plus_D10
    - minus_D10
    n:
      printed: n=3 organoids
      counts: organoids
    stats:
      test: not stated
      p: '*p<0.05'
    anchor:
      quote: significantly improved the vWF-positive area over spheroid area by D10; n=3 organoids
      where: Fig. 3B–C legend
  F3C_vwf_minus_time:
    unit: F3AC
    measure: vWF-positive area (normalized over spheroid area)
    method: vWF immunofluorescence on cryosections
    software: not stated
    definition: vWF-positive covered area divided by spheroid area
    finding: Without hADSCs, vWF-positive area at D10 differed from D0 (asterisk between D0 and D10 -ADSC)
    compares:
    - minus_D10
    - minus_D0
    n:
      printed: n=3 organoids
      counts: organoids
    stats:
      test: not stated
      p: '*p<0.05'
    anchor:
      quote: significantly improved the vWF-positive area over spheroid area by D10; n=3 organoids
      where: Fig. 3B–C legend
    note: Fig. 3C draws three significance lines; which D0 bar the long lines start from is not resolvable at the printed
      resolution (see ambiguity log).
  F3C_vwf_plus_time:
    unit: F3AC
    measure: vWF-positive area (normalized over spheroid area)
    method: vWF immunofluorescence on cryosections
    software: not stated
    definition: vWF-positive covered area divided by spheroid area
    finding: With hADSCs, vWF-positive area at D10 differed from D0
    compares:
    - plus_D10
    - plus_D0
    n:
      printed: n=3 organoids
      counts: organoids
    stats:
      test: not stated
      p: '*p<0.05'
    anchor:
      quote: significantly improved the vWF-positive area over spheroid area by D10; n=3 organoids
      where: Fig. 3B–C legend
    note: Pair read from the long upper significance line of Fig. 3C; see ambiguity log.
  F3A_cd31:
    unit: F3AC
    measure: CD31-positive endothelial network formation
    method: CD31 immunofluorescence
    software: not stated
    finding: With hADSCs, CD31-positive network formation increased by D10
    compares:
    - plus_D10
    - minus_D10
    n:
      printed: n=3 organoids/group per endothelial stain
      counts: organoids
    stats:
      test: not stated
      p: not stated
    anchor:
      quote: The addition of adipose-derived stem cells (+ADSC) led to increased vWF- and CD31-positive endothelial network
        formation by D10
      where: Fig. 3A legend
    stated_direction:
      direction: up
      anchor:
        quote: The addition of adipose-derived stem cells (+ADSC) led to increased vWF- and CD31-positive endothelial network
          formation by D10
        where: Fig. 3A legend
    note: Images only; no test.
  F3E_lumens:
    unit: F3E
    measure: vWF-positive lumens per organoid
    method: immunofluorescence on 7 μm cryosections, confocal imaging (Leica TCS SP5)
    software: not stated
    definition: the number of vWF-positive ring-shaped structures with adjacent DAPI-stained nuclei per organoid
    finding: More vWF-positive lumen structures per organoid with hADSCs at D10
    compares:
    - plus
    - minus
    n:
      printed: n=10 organoids per group
      counts: organoids
    stats:
      test: not stated
      p: '*p<0.05'
    anchor:
      quote: Significantly more vWF-positive lumen structures were observed per organoid in D10 organoids with hADSCs in comparison
        to without hADSCs; n=10 organoids per group
      where: Fig. 3E legend
    note: Box plot.
  F3D_lumen_like:
    unit: F3DF
    measure: lumen-like structures
    method: immunofluorescence on 7 μm cryosections, confocal imaging (Leica TCS SP5)
    software: not stated
    finding: Lumen-like structures with vWF-positive cells bordered by α-SA-positive hiPSC-CMs
    groups:
    - plus
    anchor:
      quote: Lumen-like structures (asterisk) were observed in D10 cardiac organoids with hADSCs
      where: Fig. 3D legend
  F3F_vessel:
    unit: F3DF
    measure: CD31-positive vessel structures
    method: 3D reconstruction of z-stacked confocal images
    software: Imaris
    finding: 3D reconstruction showed a CD31-positive vessel with open lumens supported by vimentin-positive cells
    groups:
    - plus
    anchor:
      quote: 3D reconstruction of thick cardiac organoid sections revealed CD31-positive vessel structures supported by vimentin-positive
        cells
      where: Results 2.2
  S4_lumens:
    unit: S4
    measure: lumen-like regions in serial confocal images
    method: serial confocal z-stack images every 5 µm across 40 µm
    software: not stated
    finding: Multiple lumen-like regions connected by vWF-positive ECs in X, Y and Z
    groups:
    - org
    anchor:
      quote: Serial images of confocal imaging of vWF-stained whole organoids further confirmed the formation of multiple
        areas with lumen-like regions
      where: Results 2.2
