evidence:
  F1C_actinin:
    unit: F1
    measure: sarcomeric α-actinin-2 staining
    method: immunofluorescence
    finding: mutant iPSC-CMs stain positive for sarcomeric α-actinin-2
    groups: &id014
    - WT1
    - PKP2tv_het
    - WT2
    - PKP2tv_hom
    anchor:
      quote: These mutant iPSCs could be differentiated into CMs that stained positive for sarcomeric α-actinin-2 (Fig. 1C)
      where: Results, p. 2
  F1C_pkp2:
    unit: F1
    measure: PKP2 staining
    method: immunofluorescence
    finding: PKP2 fluorescence not detectable in PKP2tv−/−
    groups:
    - WT2
    - PKP2tv_hom
    anchor:
      quote: PKP2 fluorescence is not detectable in PKP2tv−/−
      where: Fig. 1C legend
  F1D_het:
    unit: F1
    measure: PKP2 RNA expression
    method: reverse transcription quantitative PCR (power SYBR Green, QuantStudio3), PSMB2 housekeeping gene
    definition: relative expression 2^−ΔΔCT; ΔCT = CT of PKP2 minus CT of PSMB2; ΔΔCT = ΔCT of a sample minus the average ΔCT of WT repeats
    finding: PKP2 RNA reduced to 63.2% of WT1
    compares:
    - PKP2tv_het
    - WT1
    n:
      printed: PKP2tv+/− (n = 4) compared to WT1 (n = 3)
      counts: biological replicates (independent batches of stem cell differentiation), each the mean of two samples
      per_group:
        PKP2tv_het: '4'
        WT1: '3'
    values:
      rel:
        printed: '63.2'
        unit: '%'
        kind: percent
        between:
        - PKP2tv_het
        - WT1
        spread: SEM
        spread_source: sentence
      rel_sem:
        printed: '13.9'
        unit: '%'
        kind: sem
        between:
        - PKP2tv_het
        - WT1
        spread: SEM
        spread_source: sentence
    stats:
      test: two-tailed, unpaired Student's t test assuming unequal variances
      p: P = 0.03
    anchor:
      quote: 63.2 ± 13.9% in PKP2tv+/− (n = 4) compared to WT1 (n = 3)
      where: Fig. 1D legend
    context:
      preparation: lysate
  F1D_hom:
    unit: F1
    measure: PKP2 RNA expression
    method: reverse transcription quantitative PCR (power SYBR Green, QuantStudio3), PSMB2 housekeeping gene
    definition: relative expression 2^−ΔΔCT; ΔCT = CT of PKP2 minus CT of PSMB2; ΔΔCT = ΔCT of a sample minus the average ΔCT of WT repeats
