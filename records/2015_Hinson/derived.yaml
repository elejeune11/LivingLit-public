    aggregation: not stated
  S2D_strain.energy:
    item: S2D_strain
    measure: strain energy
    formula: U = k*x**2/2
    anchor:
      quote: the post displacement was squared and multiplied by one-half times the spring constant of a micro-post
      where: Methods, Micro-post arrays (mPads)
      file: NIHMS727908-supplement-Supplemental_text_and_figures.pdf
    library:
      formula: spring_strain_energy
      vars:
        U: U
        k: k
        x: x
    inputs:
      k:
        printed: '11.076'
        unit: μN/μm
        kind: constant
        anchor:
          quote: having a spring constant k=11.076µN/µm
          where: Methods, Micro-post arrays (mPads)
          file: NIHMS727908-supplement-Supplemental_text_and_figures.pdf
      x:
        not_stated: true
        kind: per sample
        note: displacement of each attached micro-post
    output_unit: fJ
    aggregation: not stated
    alternatives:
    - label: 'per cell: sum over its attached posts'
      formula: U = k*(x1**2 + x2**2 + ...)/2
    note: the energy is computed 'on each attached micro-post' but plotted per cell; how posts are combined per cell is not
      stated
