      item S7H_amhc) is not listed by figures-needed and is not read.'
no_points:
  F5I: 'Raster bar chart (mean +/- SEM, image ~300 dpi) with one marker per well, but the markers do not stand alone, so it
    is not readable under the raster rule: HD2 MM markers overlap each other in a chain along the bar top; HD1 MM markers
    touch each other and the bar top; F1473C RPMI/B27 grey markers sit on the same-grey SEM caps and bar top; F1473C MM black
    markers sit on the black error line, both caps and the mean line. Bars and error bars only for every compared group.'
  F6C: 'Raster bar charts (mean +/- SEM, image ~300 dpi; journal_version.pdf p. 9) with one marker per EHT (circles, squares,
    triangles = 3 batches), but the markers do not stand alone in any group read, so it is not readable under the raster rule:
    force ctr grey markers sit on the same-grey mean line and SEM caps and touch each other; force MM black markers sit on
    the black upper cap and vertical error line (one square at the mean); BPM ctr grey markers stack on the vertical error
    line and caps (two squares touching near 60-70 BPM); BPM MM black circles and triangles sit on the upper cap and mean
    line. Bars and error bars only for every compared group; no printed values in the text or supplement.'
  F6D: 'Raster bar charts (mean +/- SEM, image ~300 dpi; journal_version.pdf p. 9, TTP80% panel ~x 405-465, y 235-310 pt)
    with one marker per EHT (circles, squares, triangles = 3 batches), but the markers do not stand alone, so it is not readable
    under the raster rule: control grey markers merge with the same-grey upper SEM cap (a circle and a triangle at ~0.152
    s) and sit beside the vertical error line; MM black markers abut with no fill-level gap between them (two stacked circles
    near 0.19 s; two stacked triangles near 0.147 s) and one triangle abuts the lower SEM cap (~0.168 s). MM shows 10 markers
    (1 square, 4 circles, 5 triangles) against the printed n = 9. Bars and error bars only for both compared groups; no printed
    values in the text or supplement.'
  S5D: 'Raster bar chart (mmc1.pdf p. 10, whole figure one image ~400 dpi; Diastolic Calcium panel ~x 190-255, y 300-385 pt),
    mean +/- error bar with one marker per cell (RPMI/B27 grey, MM black), but the markers do not stand alone, so it is not
    readable under the raster rule: both groups are dense beeswarms (on the order of 90 markers each) whose markers touch
    and overlap each other and sit on the same-colour error-bar lines and caps. Bars and error bars only for both compared
    groups; no printed values for this panel in the text or supplement.'
  F6B: 'first look (small model): Line plot of means with SEM error bars; no per-sample points. (nihms-1613944.pdf p. 30)'
  S1D: 'first look (small model): Panel D shows means with error bars and connecting lines, no per-sample points (mmc1.pdf p. 2)'
  S1F: 'first look (small model): Panel F shows connected mean markers with error bars, no individual points. (mmc1.pdf p. 2)'
  S6A: 'first look (small model): Dose-response curves with mean markers and error bars; no per-sample dots. (mmc1.pdf p. 12)'
  S6G: 'Raster bar chart (mmc1.pdf p. 12, whole page one image ~280 dpi; panel ~x 285-380, y 322-392 pt), mean +/- SEM (S6
    legend) with one filled circle per cell (legend prints no n), but the markers do not stand alone, so it is not readable
    under the raster rule: RPMI/B27 grey circles merge with each other in pairs and triplets (near 17 and 20 pF) and sit on
    the same-grey mean line and SEM caps in a dense band near 5-13 pF; MM black circles touch in vertical pairs (below the
    lower cap, and two between the caps) and sit on the black upper and lower caps. Bars and error bars only for both compared
    groups; no printed values in the text or supplement.'
  S7A: 'first look (small model): Time-course line plots with mean markers and SEM error bars only (mmc1.pdf p. 14)'
  S7E: 'Raster bar chart (mmc1.pdf p. 14, whole page one image ~400 dpi; panel ~x 380-520, y 228-302 pt), mean +/- error bar
    per batch (batch1-3, ctr and MM each) with one marker per EHT (legend n=3-8 EHTs), but the markers do not stand alone
    in every batch, so neither pooled group (ctr, mm) is readable under the raster rule: batch1 MM black circles sit on the
    black mean line and upper cap and touch the bar top; batch3 ctr grey triangles overlap each other in a chain on the same-grey
    mean line and caps; batch3 MM black triangles sit on the black caps and touch each other; batch2 ctr grey squares sit
    on the same-grey vertical error line and lower cap. Only batch2 MM (6 black squares) stands mostly alone, one square on
    the black error line. Bars and error bars only; no printed values in the text or supplement.'
  S4A: 'Fig. S4B (mmc1.pdf p. 8, raster; the only S4A-unit panel still needed, item S4B_ik1_capacitance/mm) is a scatter of
    IK1 density against capacitance, one black marker per MM cell (printed n=32) with a regression line and printed slope=0.00+/-0.03,
    r=0.023, p=0.902, but the markers do not all stand alone: lone markers are ~54 px2 at 300 dpi and several blobs are merged
    pairs (~97-106 px2), so it is not readable under the raster rule. A regression line and printed fit statistics only; no
    points. The S4A dot plots are already read as bars only (figures/s4a.py).'
  F5J: 'Fig. 5J (journal_version.pdf p. 8, raster ~300 dpi; the nihms copy embeds its figure at about the same resolution). The
    F1473C MM bar is already read with its 9 points (figures/f5j.py, group mm_lqt). The groups still needed are not readable
    under the raster rule. RPMI/B27 F1473C (rpmi_lqt): the bar spans 0 to roughly -70 ms (about 10 px). Its grey markers (darkness ~130) sit
    in a bar fill ~75 and touch the bar border, the dotted zero line (two of them at its lower edge) and the bar-bottom line.
    Only 2 triangles are visible, below the bar, against the legend''s n = 3-6 wells per batch, so at least one marker is
    hidden. HD1, HD2 and HD3 MM (mm_hd): values near 0, and the black markers merge with the black dots of the dotted zero
    line and with each other in one dark band. mm_hd is also three bars (HD1-HD3) in the figure, not one group. Bars and
    error bars only for these groups; no values are printed in the text or the supplement.'
