    direction:
      must_match: [contrast, platform@2]
      may_vary: [cell_line, day_of_measurement]
- standing_key:
    measure: measure:sarcomere_order_parameter
    value:
      must_match: [platform, preparation, measure.distance, measure.summary, treatment, genotype, disease_model]
      may_vary: [cell_line]
    direction:
