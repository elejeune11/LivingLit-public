no_points:
  S2A: 'first look (small model): Panel A is a blue silver-stained gel image, not a plot with data points. (mmc1.pdf p. 5)'
  S2C: 'first look (small model): Panel C is bar charts with mean and SEM whiskers; no individual dots (mmc1.pdf p. 5)'
  S4A: 'first look (small model): Panel A shows bars with SEM error bars only, no individual dots (mmc1.pdf p. 9)'
  S5C: 'first look (small model): Mean bars with error bars only; no individual sample markers visible. (mmc1.pdf p. 11)'
  S4BC: 'first look (small model): Panels B, C, D are Venn diagrams and heatmaps, with no per-sample markers. (mmc1.pdf p. 7)'
  S4D: 'first look (small model): Panel D shows bars with error bars only; no individual dots visible. (mmc1.pdf p. 9)'
  S4F: 'first look (small model): Panel F shows bars with SEM error bars; no per-sample markers visible. (mmc1.pdf p. 9)'
  S6B: 'first look (small model): Bars with SEM error bars only; no individual sample markers visible. (mmc1.pdf p. 13)'
  F6D: 'first look (small model): Panel C is micrographs; panel D is bars with mean ± SEM, no dots. (main.pdf p. 10)'
  F6E: 'first look (small model): Bars with mean ± SEM error bars; no individual markers visible (main.pdf p. 10)'
  F7B: 'first look (small model): Panels A-B: blot and bar chart with mean error bars, no per-sample points (main.pdf p. 11)'
  F7D: 'first look (small model): Panel C is a blot; panel D is bars with error bars, no per-sample markers. (main.pdf p. 11)'
