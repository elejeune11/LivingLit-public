      ce_vs_cem: {item: F1d_ym_cem_vs_ce, group: ce, unit_of_value: kPa}
    note: >-
      Fig. 1d, one bar chart of Young's modulus (0-15 kPa, four ticks); label = ECT type. Bars only (mean and upper end
      of the error bar, SD per Methods); no points drawn. ce_vs_cem is the same CM+EC bar as ce, linked to the item
      CM+EC+MC vs CM+EC.
  f2a_kappa:
    file: srep29933.pdf
