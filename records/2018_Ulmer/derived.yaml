  f6_fa_3d.bq_from_cpm:
    item: f6_fa_3d
    measure: 14C-CO2 (metabolic flux)
    formula: B = C/t*e
    anchor:
      quote: To calculate the amount of radioactive CO2 produced, CPM was recalculated as decay per minute, Bq= CPM/60*96%
      where: Supplemental Experimental Procedures
      file: mmc1.pdf
    library:
      formula: proportional_amount
      vars:
        q: B
        Q: C
        a: e
        b: t
    inputs:
      C:
        not_stated: true
        kind: per sample
        note: 'CPM per sample: plotted in Fig. S6C-E, not read or released'
      t:
        printed: '60'
        unit: s/min
        anchor:
          quote: CPM was recalculated as decay per minute, Bq= CPM/60*96%
          where: Supplemental Experimental Procedures
          file: mmc1.pdf
        kind: constant
      e:
        printed: 96%
        anchor:
          quote: CPM was recalculated as decay per minute, Bq= CPM/60*96%
          where: Supplemental Experimental Procedures
          file: mmc1.pdf
        kind: constant
    note: Written as printed (multiplied by 96%); a counting efficiency usually divides CPM (DPM = CPM/efficiency).
  f6_fa_3d.bq_2D:
    item: f6_fa_3d
    group: g2D
    measure: 14C-CO2 (metabolic flux)
    formula: N = P*SA
    anchor:
      quote: Total amount of radioactive CO2 = bq /specific radioactivity per pmol
      where: Supplemental Experimental Procedures
      file: mmc1.pdf
    library:
      formula: ratio_def
      vars:
        r: P
        a: N
        b: SA
    inputs:
      P:
        reading: F6DF/D 2D
        kind: per sample
      SA:
        printed: '2'
        unit: Bq/pmol
        anchor:
          quote: 'Glucose: bq x 1 pmol / 8 bq, oleic acid: Bq x 1 pmol / 2 bq, lactic acid: Bq x 1 pmol / 4 bq'
          where: Supplemental Experimental Procedures
          file: mmc1.pdf
        kind: constant
    output_unit: Bq
    note: The stated P = Bq/SA solved for Bq, so the plotted pmol (oleic acid) give N in Bq.
  f6_fa_3d.metabolized_2D:
    item: f6_fa_3d
    group: g2D
    measure: metabolized energy substrate
    formula: S = N/M*K
    anchor:
      quote: Metabolized energy substrate = N/M*K; N = 14CO2 [Bq]; M=Input radioactivity
      where: Supplemental Experimental Procedures
      file: mmc1.pdf
    library:
      formula: proportional_amount
      vars:
        q: S
        Q: K
        a: N
        b: M
    inputs:
      N:
        derived: f6_fa_3d.bq_2D
        kind: per sample
      M:
        not_stated: true
        kind: constant
        note: 'input radioactivity in Bq not printed: only 0.0037 MBq/ml is, and the flux assay''s volume is not stated'
      K:
        printed: '1'
        unit: mM
        anchor:
          quote: 1 mM linoleic acid/oleic acid fatty acid mix (L9655, Sigma), 1 mM lactate (7455, Sodium lactate solution 50%, Caelo), 5 mM D
            (+)-glucose anhydrous
          where: Supplemental Experimental Procedures
          file: mmc1.pdf
        kind: constant
        note: K is given in [M] (a concentration) although called an amount of substance
