  last_author: Kshitiz
  lab: Kshitiz lab, University of Connecticut Health
  journal: Cell Reports
  files:
  - main.pdf
  - mmc1.pdf
  missing:
  - Videos S1-S13
  - Data S1
  - Table S1 as cited for Fig. 1N/S4 (mmc2.xlsx holds cluster GO terms only)
  not_used:
  - file: mmc16.pdf
    why: combined PDF of the article and the supplemental figures; identical text to main.pdf + mmc1.pdf
  - file: mmc2.xlsx
    why: 'Table S1: GO/KEGG/Reactome terms per hierarchical cluster with -log10 padj; no group values'
  - file: code_github
    why: 'folder: Steiner-tree PPI network code, BioGRID and GO annotation inputs, network outputs (model outputs, no group values)'
