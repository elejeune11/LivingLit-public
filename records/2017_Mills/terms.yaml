mappings:
# ---------------------------------------------------------------- context
- field: stromal_cell
  stated: CD90+ stromal cell
  terms: [CL:0000499]
  no_ontology_term: CD90+ stromal cell (CL has no stromal cell class defined by CD90)
  note: CD90+ is the marker the paper uses for the stromal population; mapped to the broader CL stromal cell.
- field: cell_line
  stated: ATCC-BXS0116 hiPSC
  terms: [CVCL_0A07]
  note: '"hiPSC" says what the line is; the accession is the line.'
- field: platform
  stated: Heart-Dyno hCO
  terms: [platform:heart_dyno]
  note: hCO is the paper's name for the cardiac organoid formed in the Heart-Dyno; not added as a synonym because other
    papers use hCO for other organoid formats.
- field: platform
  stated: human adult heart
  terms: [platform:adult_heart_tissue]
  note: The paper's own and borrowed adult heart samples (S8B re-read moved these words from cell_types to platform).
- field: platform
  stated: human fetal ventricle
  terms: [platform:fetal_heart_tissue]
  note: Fetal ventricle from GSE62913; the ventricle is part of the fetal heart tissue the term names.
- field: cell_types
  stated: neonatal rat ventricular cardiomyocyte
  terms: [CL:2000046]
  qualifiers: {species: rat}
  note: CL classes are species-neutral, so the species is a qualifier; "neonatal" is already in donor_age.
- field: replating_coating
  stated: Matrigel or laminin
  flag:
    kind: alternatives
    note: 'the paper prints "plated on growth factor-reduced Matrigel or laminin (Sigma)coated coverslips": which coating
      each cell had is not stated.'
- field: substrate
  stated: 1.6 mg/mL collagen matrix
  terms: [substrate:collagen_hydrogel]
  qualifiers: {collagen_concentration: 1.6 mg/mL}
- field: substrate
  stated: 3.2 mg/mL collagen matrix
  terms: [substrate:collagen_hydrogel]
  qualifiers: {collagen_concentration: 3.2 mg/mL}
- field: substrate
  stated: 2.6 mg/mL collagen plus 9% (vol/vol) Matrigel matrix
  terms: [substrate:collagen_hydrogel, substrate:matrigel]
  qualifiers: {collagen_concentration: 2.6 mg/mL, matrigel_fraction: 9% (vol/vol)}
- field: cm_medium
  stated: α-MEM with 10% FBS
  terms: [cm_medium:alpha_mem]
  split:
  - words: 10% FBS
    field: supplements
  note: FBS is a supplement, not part of the base medium (cm_medium scope).
- field: cm_medium
  stated: DMEM without glucose, glutamine and phenol red
  terms: [cm_medium:dmem]
  qualifiers: {glucose: without glucose, formulation: 'without glucose, glutamine and phenol red'}
- field: supplements
  stated: 4% B27 + GlutaMAX + L-ascorbic acid 2 phosphate + Penicillin/Streptomycin
  terms: [supplements:b27, CHEBI:73788, CHEBI:167162, CHEBI:17334, CHEBI:17076]
  qualifiers: {concentration: 4%}
  note: The paper's "4% B27 (with or without insulin)"; insulin is the compared factor and is recorded once, as the treatment qualifier insulin.
- field: treatment
  stated: nifidipine
  terms: [CHEBI:7565]
  note: Spelled "nifidipine" in the figure as the record states (read from the Fig. S1B image; the word is not in the
    extracted text, so no synonym is added); nifedipine is the compound.
- field: treatment
  stated: 5 μM CHIR
  terms: [CHEBI:91091]
  qualifiers: {concentration: 5 μM}
  note: CHIR is the paper's short name for CHIR99021 in Fig. S8 labels.
- field: treatment
  stated: 100 ng/ml NRG1
  terms: [treatment:nrg1]
  qualifiers: {concentration: 100 ng/ml}
- field: transgene
  stated: Ad-YAP1(S112A)
  terms: [transgene:yap1_s112a]
  qualifiers: {vector: adenovirus}
  note: An adenovirus carrying murine Yap1(S112A) (CMV-YAP(S112A)); MOI 10 is the record's own qualifier.
- field: transgene
  stated: AAV6-GFP
  terms: [transgene:gfp]
  qualifiers: {vector: AAV6}
- field: transgene
  stated: AAV6-MCS
  terms: [transgene:empty_vector]
  qualifiers: {vector: AAV6}
- field: transgene
  stated: AAV6-ΔN90β-catenin
  terms: [transgene:ctnnb1_dn90]
  qualifiers: {vector: AAV6}
- field: transgene
  stated: AAV6-YAP1(S127A)
  terms: [transgene:yap1_s127a]
  qualifiers: {vector: AAV6}
- field: transgene
  stated: AAV6-ΔN90β-catenin + AAV6-YAP1(S127A)
  terms: [transgene:ctnnb1_dn90, transgene:yap1_s127a]
  qualifiers: {vector: AAV6}
# ---------------------------------------------------------------- measures
- field: measure
  stated: 50% activation time
  terms: [measure:contraction_time_to_peak]
  qualifiers: {level: 50%}
  note: 'The paper defines activation time as "time from 50% activation to peak (Ta)".'
- field: measure
  stated: 50% relaxation time
  terms: [measure:relaxation_time]
  qualifiers: {level: 50%}
  note: 'The paper defines relaxation time as "time from peak to 50% relaxation (Tr)".'
- field: measure
