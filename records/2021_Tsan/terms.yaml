record: 2021_Tsan
vocabulary_version: 68
agent:
  model: llm
  instructions: terms_v4
edits:
- add_term:
    field: hipsc_medium
    id: hipsc_medium:stemflex
    label: StemFlex
    parent: null
    definition: StemFlex (Gibco) feeder-free medium for pluripotent stem cells.
    scope: StemFlex medium; not Essential 8, mTeSR1, FTDA or MEF-conditioned medium.
- adopt:
    field: differentiation_factors
    id: CHEBI:90739
    label: BMS-453
    lookup: 'lookup chebi ''BMS 453'': exact CHEBI:90739 BMS-453 (retinoic acid receptor ligand used as a retinoid signalling
      inhibitor)'
- add_qualifier:
    id: platform:culture_2d
    name: cell_contact
    dimension: text
- add_term:
    field: platform
    id: platform:muscle_bundle_2d
    label: two-dimensional cardiac muscle bundle
    parent: platform:micropatterned_cell_patch
    definition: A small group of cardiomyocytes (about 6 to 12) on one narrow rectangular matrix island on a soft substrate,
      forming an aligned bundle that contracts uniaxially against the substrate.
    scope: A rectangular multicellular island shaped to contract uniaxially; other multicellular islands stay on the parent.
    synonyms:
    - text: 2DMB
      anchor: micron-scale two-dimensional cardiac muscle bundles (2DMBs)
- adopt:
    field: stromal_cell
    id: CL:0000057
    label: fibroblast
    lookup: 'lookup cl fibroblast: exact CL:0000057; the source does not say which fibroblast'
    synonyms:
    - text: fibroblasts
      anchor: are comprised of ~25% fibroblasts
- adopt:
    field: cell_line
    id: CVCL_K054
    label: iPS-DF19-9-11T.H
    lookup: 'lookup cellosaurus DF19-9-11: CVCL_K054 iPS-DF19-9-11T.H (synonyms DF19-9-11T, iPS DF19-9-11T); the source names
      WiCell iPS-DF19-911T'
    synonyms:
    - text: DF19-9-11
      anchor: seven differentiation batches in the DF19-9-11 line
- adopt:
    field: cell_line
    id: CVCL_VK83
    label: WTC-mEGFP-GJA1-cl16
    lookup: 'lookup cellosaurus AICS-0053: CVCL_VK83 WTC-mEGFP-GJA1-cl16 (synonym AICS-0053-016)'
    synonyms:
    - text: AICS-0053 cl.16
      anchor: connexin-43-GFP, AICS-0053 cl.16
- adopt:
    field: cell_line
    id: CVCL_UD14
    label: WTC-mEGFP-ATP2A2-cl51
    lookup: 'lookup cellosaurus AICS-0046: CVCL_UD14 WTC-mEGFP-ATP2A2-cl51 (synonym AICS-0046-051)'
    synonyms:
    - text: AICS-0046 cl.51
      anchor: SERCA2-GFP, AICS-0046 cl.51
- adopt_own:
    field: cell_line
    id: cell_line:mr18
    label: MR18
    definition: Control hiPSC line MR18 from a healthy individual, from the NYSCF Research Institute Stem Cell Repository.
    scope: The NYSCF control line MR18 only; not the other NYSCF lines of this source or other unnamed lines.
    lookup: 'lookup cellosaurus MR18: no NYSCF line of that name (only unrelated near matches); the source gives no accession'
- adopt_own:
    field: cell_line
    id: cell_line:mr30
    label: MR30
    definition: Control hiPSC line MR30 from a healthy individual, from the NYSCF Research Institute Stem Cell Repository.
    scope: The NYSCF control line MR30 only; not the other NYSCF lines of this source or other unnamed lines.
    lookup: 'lookup cellosaurus MR30: no NYSCF line of that name (only unrelated near matches); the source gives no accession'
- adopt_own:
    field: cell_line
    id: cell_line:mr48
    label: MR48
    definition: Control hiPSC line MR48 from a healthy individual, from the NYSCF Research Institute Stem Cell Repository.
    scope: The NYSCF control line MR48 only; not the other NYSCF lines of this source or other unnamed lines.
    lookup: 'lookup cellosaurus MR48: no NYSCF line of that name (only unrelated near matches); the source gives no accession'
- adopt_own:
    field: cell_line
    id: cell_line:tsan_mybpc3_patient_ipsc
    label: MYBPC3 patient hiPSC lines of the Tsan study (two, unnamed)
    definition: Two unnamed hiPSC lines from patients with MYBPC3 mutations, a gift from the Mummery lab, pooled with DF19-9-11
      in the source's mass spectrometry experiment.
    scope: The two pooled MYBPC3 patient lines of this source only; not DF19-9-11, its MYBPC3 promoter deletion line or other
      unnamed patient lines.
    lookup: 'lookup cellosaurus MYBPC3: the source gives no line names or accessions, so no Cellosaurus entry can be chosen'
- add_term:
    field: transgene
    id: transgene:connexin43_fusion
    label: connexin-43 fluorescent fusion
    parent: transgene:fluorescent_fusion_protein
    definition: Connexin-43 (GJA1) fused to a fluorescent protein, marking gap junctions.
    scope: Tagged connexin-43; not tagged α-actinin-2, N-cadherin or SERCA2.
- add_term:
    field: transgene
    id: transgene:serca2_fusion
    label: SERCA2 fluorescent fusion
    parent: transgene:fluorescent_fusion_protein
    definition: SERCA2 (ATP2A2) fused to a fluorescent protein, marking the sarcoplasmic reticulum calcium pump.
    scope: Tagged SERCA2; not tagged α-actinin-2, N-cadherin or connexin-43.
- set_scope:
    id: transgene:actinin2_fusion
    scope: Tagged α-actinin-2, marking Z-discs; not tagged N-cadherin, connexin-43 or SERCA2.
- set_scope:
    id: transgene:n_cadherin_fusion
    scope: Tagged N-cadherin, marking adherens junctions; not tagged α-actinin-2, connexin-43 or SERCA2.
- adopt:
    field: treatment
    id: CHEBI:756998
    label: mavacamten
    lookup: 'lookup chebi mavacamten: exact CHEBI:756998'
- adopt:
    field: treatment
    id: CHEBI:18258
    label: 3,3',5-triiodo-L-thyronine
    lookup: 'lookup chebi 3,3'',5-triiodo-L-thyronine: CHEBI:18258 (T3; not the reverse T3 CHEBI:11684); the source prints
      triiodothyronine (T3)'
    synonyms:
    - text: T3
      anchor: triiodothyronine thyroid hormone (T3)
- adopt:
    field: treatment
    id: CHEBI:41879
    label: dexamethasone
    lookup: 'lookup chebi dexamethasone: exact CHEBI:41879'
- adopt:
    field: treatment
    id: CHEBI:84327
    label: torin 1
    lookup: 'lookup chebi torin 1: exact CHEBI:84327; the source prints torin1'
- adopt:
    field: supplements
    id: CHEBI:28260
    label: galactose
    lookup: 'lookup chebi galactose: exact CHEBI:28260 (isomer not stated)'
- adopt:
    field: supplements
    id: CHEBI:24996
    label: lactate
    lookup: 'lookup chebi lactate: exact CHEBI:24996, already adopted for treatment; added for supplements'
- adopt:
    field: supplements
    id: CHEBI:15361
    label: pyruvate
    lookup: 'lookup chebi pyruvate: exact CHEBI:15361'
- add_term:
    field: genotype
    id: genotype:mybpc3_variant
    label: MYBPC3 variant
    parent: genotype:gene_variant
    definition: Cells carrying a variant in MYBPC3, the gene encoding cardiac myosin-binding protein C.
    scope: A variant in MYBPC3; the variant itself and its zygosity are qualifiers; not a DSP or PKP2 variant.
- set_scope:
    id: genotype:dsp_variant
    scope: A variant in DSP; the variant itself and its zygosity are qualifiers; not a PKP2 or MYBPC3 variant.
- set_scope:
    id: genotype:pkp2_variant
    scope: A variant in PKP2; the variant itself and its zygosity are qualifiers; not a DSP or MYBPC3 variant.
- add_synonym:
    id: measure:action_potential_amplitude
    text: action potential amplitude
    anchor: evidence.F3d_apa.anchor
- add_synonym:
    id: measure:contractile_shortening
    text: maximal fractional shortening
    anchor: evidence.F2e_fs.anchor
- add_synonym:
    id: measure:contractile_shortening
    text: fractional shortening
    anchor: evidence.F2e_fs.anchor
- add_synonym:
    id: measure:sarcomere_length
    text: resting sarcomere length
    anchor: evidence.F1f_mono_single.anchor
- add_term:
    field: measure
    id: measure:angle_dispersion
    label: angle dispersion
    parent: null
    definition: Spread (standard deviation) of the angles of a stated structure (qualifier structure) within one sample or
      image.
    scope: The standard deviation of angles itself; not its reciprocal (inverse angle dispersion), not an order parameter
      and not the angle histogram (orientation distribution).
    dimension: angle
    qualifiers:
      structure:
        dimension: text
- add_term:
    field: measure
    id: measure:between_sample_variability
    label: variability across samples
    parent: null
    definition: 'Spread of a stated measure (qualifier of_measure) across replicate samples, as a stated statistic (qualifier
      statistic: coefficient of variation or standard deviation).'
    scope: How much replicates of one measure differ from each other; not the measure itself and not the spread of angles
      within one sample (angle dispersion).
    dimension: dimensionless
    qualifiers:
      of_measure:
        dimension: text
      statistic:
        dimension: text
- add_term:
    field: measure
    id: measure:micropattern_yield
    label: micropattern yield
    parent: null
    definition: Share of micropatterned islands on a substrate that hold a construct meeting a stated criterion (qualifier
      criterion).
    scope: A share of islands that succeed; not a count of usable cells or constructs per substrate.
    dimension: dimensionless
    qualifiers:
      criterion:
        dimension: text
- add_term:
    field: measure
    id: measure:usable_construct_count
    label: usable constructs per substrate
    parent: null
    definition: Number of cells or constructs on one substrate that meet a stated quality criterion (qualifier criterion).
    scope: A count per substrate; not a share of islands (micropattern yield).
    dimension: dimensionless
    qualifiers:
      criterion:
        dimension: text
- add_term:
    field: measure
    id: measure:myofibrillar_density
    label: myofibrillar density
    parent: null
    definition: Fraction of a cell's or construct's area occupied by detected myofibrils.
    scope: Myofibril coverage of the cell area; not sarcomere number, sarcomere length or alignment.
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:analysis_time
    label: analysis time
    parent: null
    definition: Computing or operator time needed to analyse one unit of data (such as one beat) with a stated method.
    scope: Time spent on analysis; not a physiological time of the cells.
    dimension: time
- add_term:
    field: measure
    id: measure:resting_calcium_signal
    label: resting calcium indicator signal
    parent: null
    definition: Level of a calcium indicator's signal between transients (qualifier indicator), a readout of diastolic cytosolic
      calcium.
    scope: The baseline level of the indicator; not the transient's amplitude or its times.
    dimension: dimensionless
    qualifiers:
      indicator:
        dimension: text
- add_term:
    field: measure
    id: measure:stained_area_ratio
    label: stained area ratio
    parent: null
    definition: Area stained or labelled for a stated protein (qualifier protein) divided by a reference labelled area (normalised_to).
    scope: A ratio of labelled areas; not a staining intensity (protein fluorescence intensity) and not a fraction of positive
      cells.
    dimension: dimensionless
    qualifiers:
      protein:
        dimension: text
- add_term:
    field: measure
    id: measure:required_sample_size
    label: required sample size
    parent: null
    definition: Number of samples a power analysis says are needed to detect a stated difference (qualifier effect_size) in
      a stated measure (qualifier of_measure).
    scope: A computed number of samples; not the variability it is computed from (variability across samples).
    dimension: dimensionless
    qualifiers:
      of_measure:
        dimension: text
      effect_size:
        dimension: text
- add_term:
    field: measure
    id: measure:category_de_gene_fraction
    label: share of a category's genes differentially expressed
    parent: null
    definition: Fraction of the genes in a stated annotation category (qualifier category) that are differentially expressed
      between compared conditions.
    scope: Share of one category's genes that are differentially expressed; not the share of a gene set falling in a category
      (share of an annotation category), not a count of genes in a GO term and not an enrichment p-value.
    dimension: dimensionless
    qualifiers:
      category:
        dimension: text
- add_term:
    field: measure
    id: measure:enriched_category_count
    label: number of enriched annotation categories
    parent: null
    definition: Number of categories of a stated annotation (qualifier annotation, such as GO biological process) over-represented
      among differentially expressed genes.
    scope: A count of enriched categories; not the number of differentially expressed genes and not one category's p-value.
    dimension: dimensionless
    qualifiers:
      annotation:
        dimension: text
- add_term:
    field: measure
    id: measure:pathway_regulation
    label: pathway regulation
    parent: null
    definition: Direction and significance of the regulation of a stated pathway (qualifier pathway) between compared conditions,
      from a pathway impact analysis of expression data.
    scope: Up- or down-regulation of a whole pathway; not the expression of one gene and not over-representation of an annotation
      (enrichment p-value).
    dimension: categorical
    qualifiers:
      pathway:
        dimension: text
- add_term:
    field: measure
    id: measure:isoform_fraction
    label: isoform fraction
    parent: null
    definition: Share of one isoform or variant of a gene product (qualifier isoform) in the total of the stated isoforms
      (qualifier total).
    scope: The share of one isoform among its alternatives; not the level of one gene or protein against a reference.
    dimension: dimensionless
    qualifiers:
      isoform:
        dimension: text
      total:
        dimension: text
- add_term:
    field: measure
    id: measure:protein_isoform_fraction
    label: protein isoform fraction
    parent: measure:isoform_fraction
    definition: Share of one protein isoform in the total of the stated protein isoforms, measured on protein.
    scope: Measured on protein; not on mRNA (transcript isoform fraction).
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:transcript_isoform_fraction
    label: transcript isoform fraction
    parent: measure:isoform_fraction
    definition: Share of one mRNA isoform or splice variant in the total of the stated transcripts, measured on mRNA.
    scope: Measured on mRNA, including percent spliced in; not on protein (protein isoform fraction).
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:contraction_deceleration_time
    label: contraction deceleration time
    parent: null
    definition: Time from the end of the linear phase of shortening (deviation from the linear contractile slope) to peak
      contraction.
    scope: The late, decelerating part of contraction; not time to peak from the start of contraction and not relaxation time.
    dimension: time
- standing_key:
    measure: measure:angle_dispersion
    value:
      must_match:
      - platform@1
      - preparation
      - measure.structure
      may_vary: &id001
      - cell_line
    direction:
      must_match:
      - contrast
      - measure.structure
      may_vary: &id002
      - cell_line
      - day_of_measurement
- standing_key:
    measure: measure:between_sample_variability
    value:
      must_match:
      - platform@1
