    formula: d = (x - x0)/x0
    anchor:
      quote: normalized force amplitudes, measured with 3Hz pacing, are about 30% larger in conditioned atrial biowires
      where: Results
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        derived: F4B_3Hz.normalized
        kind: per sample
        note: A_St_3Hz; bars not read (F4BC no points)
      x0:
        derived: F4B_3Hz.normalized
        kind: per sample
        note: A_UnSt_3Hz; bars not read
    output: F4B_3Hz.values.diff_text
    aggregation: of means
    note: '''30% larger'' compares two group means of different tissues, so the change is of means.'
