record: 2022_Afzal
formula_library_version: 33
agent:
  model: llm
  instructions: formulas_v3
derived:
  F2i_KCNJ2.rq_d30:
    item: F2i_KCNJ2
    group: d30
    measure: KCNJ2 mRNA relative quantification (RQ)
    formula: rq = e/e
    anchor: &id001
      quote: Heatmap with relative quantification (RQ) of select cardiac transcript expression using RT-PCR on different substrates
      where: Fig. 2I legend
    library:
      formula: normalized_to_own_control
      vars:
        my: rq
        mx: e
    inputs:
      e:
        not_stated: true
        kind: not stated
        note: KCNJ2 expression normalised to GAPDH, d30 group (Ct values not printed)
    output: F2i_KCNJ2.values.rq_d30
    note: d30 is the calibrator (RQ 1.00); 'd30 is control condition' (STAR Methods, RT-PCR).
  F2i_KCNJ2.rq_d30m:
    item: F2i_KCNJ2
    group: d30m
    measure: KCNJ2 mRNA relative quantification (RQ)
    formula: rq = e/e0
    anchor: *id001
    library:
      formula: ratio_def
      vars:
        r: rq
        a: e
        b: e0
    inputs:
      e:
        not_stated: true
        kind: not stated
        note: KCNJ2 expression normalised to GAPDH in group d30m; Ct values not printed
      e0:
        not_stated: true
        kind: not stated
        note: KCNJ2 expression normalised to GAPDH in d30 (control condition); not printed
    output: F2i_KCNJ2.values.rq_d30m
    aggregation: not stated
    alternatives:
    - label: comparative Ct (2^-ddCt, Livak), the usual RQ computation; not stated in the methods
      formula: rq = 2^(-ddct)
    note: 'Normalisation to GAPDH: ''the transcripts were normalized to endogenous GAPDH Control'' (STAR Methods, RT-PCR). n per surface
      not printed.'
