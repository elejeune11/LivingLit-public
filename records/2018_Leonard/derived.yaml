        a: p
        b: l
    inputs:
      p:
        not_stated: true
        kind: per sample
        note: αMHC band density
      l:
        not_stated: true
        kind: per sample
        note: lamin A/C band density, same lysate
    note: further expressed relative to EHTs at Day 1 and to a common sample across gels; how is not stated
