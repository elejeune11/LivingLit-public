    note: >-
      Supplementary Fig. 9b, one bar chart of circular standard deviation (0-70, eight ticks; printed unit "(Deg)");
      label = group. Bars only (mean and upper end of the error bar, SD per Methods); no points drawn, so the legend's
      n = 3 (2D) and 5 (each 3D) cannot be counted. Bars serve several items, so each is returned again under
      <group>_vs_<other> labels linked to its other items. Panel a (angle histograms) is per-image illustration and
      not read.
  f2d_enrichment:
    file: srep29933.pdf
    page: 4
    crop: [300, 228, 555, 362]
    script: figures/f2d_enrichment.py
    unit: F2d
    kind: raster
    groups:
      muscle_structure: {item: F2d_muscle_structure, group: cem, unit_of_value: -log(pValue)}
      cv_system: {item: F2d_cv_system, group: cem, unit_of_value: -log(pValue)}
      cardiac_muscle_tissue: {item: F2d_cardiac_muscle_tissue, group: cem, unit_of_value: -log(pValue)}
      heart_dev: {item: F2d_heart_dev, group: cem, unit_of_value: -log(pValue)}
      myofibril: {item: F2d_myofibril, group: cem, unit_of_value: -log(pValue)}
      cardiac_muscle_cell: {item: F2d_cardiac_muscle_cell, group: cem, unit_of_value: -log(pValue)}
      blood_vessel: {item: F2d_blood_vessel, group: cem, unit_of_value: -log(pValue)}
      cardiac_cell: {item: F2d_cardiac_cell, group: cem, unit_of_value: -log(pValue)}
      muscle_contract: {item: F2d_muscle_contract, group: cem, unit_of_value: -log(pValue)}
      cytoskeleton: {item: F2d_cytoskeleton, group: cem, unit_of_value: -log(pValue)}
      fgf_erbb: {item: F2d_fgf_erbb, group: cem, unit_of_value: -log(pValue)}
      wnt_notch: {item: F2d_wnt_notch, group: cem, unit_of_value: -log(pValue)}
      bmp_tgfb: {item: F2d_bmp_tgfb, group: cem, unit_of_value: -log(pValue)}
    note: >-
      Fig. 2d, two horizontal bar charts of enrichment, axis on top titled "-log(pValue)": left GO processes (ticks
      0-20 by 5), right pathway maps / process networks (ticks 0-6 by 1); label = item without the F2d_ prefix, bars
      top to bottom in record order (labels beside the bars checked). One value per bar, the -log p of the comparison
      CM+EC+MC versus CM+EC, stored as the bar's "mean" (no reading kind for p); it belongs to the comparison, not to
      one group, and is linked to group cem because a link needs one. Bars only; no error bars, nothing countable.
      Ticks are unevenly spaced in the raster (misfit 0.3 and 0.13 axis units), carried in the intervals.
