    asserts_direction: up
    rests_on: [F5B_maximal]
    judgement: *ok
  abs_reserve:
    kind: stated
    quote: and respiratory reserve capability after T3 treatment
    where: Abstract
    direction: respiratory reserve capacity up
    asserts_direction: up
    rests_on: [F5B_reserve]
    judgement: *ok
  abs_driver:
    kind: stated
    quote: we conclude that T3 is a driver for hiPSC-CM maturation
    where: Abstract, Conclusions
    scope: hiPSC-CMs generally
    strength: driver
    rests_on: [F1C_area, F1D_circularity, F1E_sarcomere, F2C_brdu, F3C_force, F4C_upstroke, F4D_decay_velocity, F5B_maximal]
