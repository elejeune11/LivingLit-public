# Derivations of 2021_Silva (formula agent, instructions formulas_v3)
record: 2021_Silva
formula_library_version: 20
agent:
  model: llm
  instructions: formulas_v3
derived:
  # ---------------------------------------------------------------- Fig. 3H / S2G: classifier shares of all cells
  # pct = count / cells classified. The total (3012, the record's n) is printed only in images, so it is rebuilt as the
  # sum of the nine class counts of Fig. S2G (1201+13+6+1322+344+99+4+2+21 = 3012), in three steps.
  F3H_fibroblast.noncm_total:
    item: F3H_fibroblast
    group: ml_d100
    formula: s = fib + smcf + subepi
    anchor: not stated
    library: {formula: sum_of_three_parts, vars: {t: s, a: fib, b: smcf, c: subepi}}
    inputs:
      fib: {value: F3H_fibroblast.values.count_table, kind: constant}
      smcf: {value: F3H_smc_fibroblast.values.count_table, kind: constant}
      subepi: {value: F3H_subepicardial.values.count_table, kind: constant}
    output_unit: cells
    note: partial sum of class counts (fibroblast-like, SMC/fibroblast-like, subepicardial); no printed output
  F3H_cap_endo_peri.minor_total:
    item: F3H_cap_endo_peri
    group: ml_d100
    formula: s = cep + ce + ery
    anchor: not stated
    library: {formula: sum_of_three_parts, vars: {t: s, a: cep, b: ce, c: ery}}
    inputs:
      cep: {value: F3H_cap_endo_peri.values.count_table, kind: constant}
      ce: {value: F3H_cap_endo.values.count_table, kind: constant}
      ery: {value: F3H_erythrocytes.values.count_table, kind: constant}
    output_unit: cells
    note: partial sum of class counts (capillary endothelium/pericytes/adventia, capillary endothelium, erythrocytes); no printed output
  F3H_atrial_cm.cells_total:
    item: F3H_atrial_cm
    group: ml_d100
    formula: total = cm + noncm + minor
    anchor: not stated
    library: {formula: sum_of_three_parts, vars: {t: total, a: cm, b: noncm, c: minor}}
    inputs:
      cm: {derived: F3H_atrial_cm.cm_total, kind: constant}
      noncm: {derived: F3H_fibroblast.noncm_total, kind: constant}
      minor: {derived: F3H_cap_endo_peri.minor_total, kind: constant}
    output_unit: cells
    note: all classified cells; equals the record's n (F3H_*.n, '3012 cells'), which is printed only in images, so it is
      not an output value here
  F3H_atrial_cm.pct_of_cells_fig:
    item: F3H_atrial_cm
    group: ml_d100
    formula: pct = count/total
    anchor: &cellpct
      quote: Data displayed include cell percentage and assignment probability of transcriptomic resemblance with in vivo heart cells.
      where: Fig. 3H legend
    library: &ratio_ct {formula: ratio_def, vars: {r: pct, a: count, b: total}}
    inputs:
      count: {value: F3H_atrial_cm.values.count_table, kind: constant}
      total: &total {derived: F3H_atrial_cm.cells_total, kind: constant}
    output: F3H_atrial_cm.values.pct_of_cells_fig
  F3H_ventricular_cm.pct_of_cells_fig:
    item: F3H_ventricular_cm
    group: ml_d100
    formula: pct = count/total
    anchor: *cellpct
    library: *ratio_ct
    inputs:
      count: {value: F3H_ventricular_cm.values.count_table, kind: constant}
      total: *total
    output: F3H_ventricular_cm.values.pct_of_cells_fig
  F3H_cardiomyocytes.pct_of_cells_fig:
    item: F3H_cardiomyocytes
    group: ml_d100
    formula: pct = count/total
    anchor: *cellpct
    library: *ratio_ct
    inputs:
      count: {value: F3H_cardiomyocytes.values.count_table, kind: constant}
      total: *total
    output: F3H_cardiomyocytes.values.pct_of_cells_fig
  F3H_fibroblast.pct_of_cells_fig:
    item: F3H_fibroblast
    group: ml_d100
    formula: pct = count/total
    anchor: *cellpct
    library: *ratio_ct
    inputs:
      count: {value: F3H_fibroblast.values.count_table, kind: constant}
      total: *total
    output: F3H_fibroblast.values.pct_of_cells_fig
  F3H_fibroblast.pct_of_cells_text:
    item: F3H_fibroblast
    group: ml_d100
    formula: pct = count/total
    anchor: &fib_smc_text
      quote: which represented 44% and 11% of the cells analyzed
      where: Results, Long-term culture
    library: *ratio_ct
    inputs:
      count: {value: F3H_fibroblast.values.count_table, kind: constant}
      total: *total
    output: F3H_fibroblast.values.pct_of_cells_text
  F3H_smc_fibroblast.pct_of_cells_fig:
    item: F3H_smc_fibroblast
    group: ml_d100
    formula: pct = count/total
    anchor: *cellpct
    library: *ratio_ct
    inputs:
      count: {value: F3H_smc_fibroblast.values.count_table, kind: constant}
      total: *total
    output: F3H_smc_fibroblast.values.pct_of_cells_fig
  F3H_smc_fibroblast.pct_of_cells_text:
    item: F3H_smc_fibroblast
    group: ml_d100
    formula: pct = count/total
    anchor: *fib_smc_text
    library: *ratio_ct
    inputs:
      count: {value: F3H_smc_fibroblast.values.count_table, kind: constant}
      total: *total
    output: F3H_smc_fibroblast.values.pct_of_cells_text
  F3H_subepicardial.pct_of_cells_fig:
    item: F3H_subepicardial
    group: ml_d100
    formula: pct = count/total
    anchor: *cellpct
    library: *ratio_ct
    inputs:
      count: {value: F3H_subepicardial.values.count_table, kind: constant}
      total: *total
    output: F3H_subepicardial.values.pct_of_cells_fig
  F3H_cap_endo_peri.pct_of_cells_fig:
    item: F3H_cap_endo_peri
    group: ml_d100
    formula: pct = count/total
    anchor: *cellpct
    library: *ratio_ct
    inputs:
      count: {value: F3H_cap_endo_peri.values.count_table, kind: constant}
      total: *total
    output: F3H_cap_endo_peri.values.pct_of_cells_fig
  F3H_cap_endo_peri.pct_of_cells_text:
    item: F3H_cap_endo_peri
    group: ml_d100
    formula: pct = count/total
    anchor:
      quote: Although the capillary endothelium/pericytes/adventia cells corresponded to only 0.1% of the cells
      where: Results, Long-term culture
    library: *ratio_ct
    inputs:
      count: {value: F3H_cap_endo_peri.values.count_table, kind: constant}
      total: *total
    output: F3H_cap_endo_peri.values.pct_of_cells_text
  F3H_cap_endo.pct_of_cells_fig:
    item: F3H_cap_endo
    group: ml_d100
    formula: pct = count/total
    anchor: *cellpct
    library: *ratio_ct
    inputs:
      count: {value: F3H_cap_endo.values.count_table, kind: constant}
      total: *total
    output: F3H_cap_endo.values.pct_of_cells_fig
  F3H_erythrocytes.pct_of_cells_fig:
    item: F3H_erythrocytes
    group: ml_d100
