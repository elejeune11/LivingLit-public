evidence:
  F1B_rearrangement:
    unit: F1B
    measure: spatial distribution of GFP-tagged cardiomyocytes
    finding: GFP-tagged cardiomyocytes and non-myocytes rearranged from a random distribution to more discrete regions from day 21 to day 42
    groups:
    - d21
    - d42
    method: GFP reporter fluorescence imaging
    anchor:
      quote: the GFP-tagged contractile cardiomyocytes and non-myocytes gradually and spontaneously rearranged within the microtissues from a random distribution to more discrete regions
      where: Results, 2D-to-3D culture switch
  F1C_diam_d21:
    unit: F1C
    measure: microtissue diameter
    finding: diameter 0.9 ± 0.04 mm on day 21
    groups:
    - d21
    n: &id004
      printed: n = 6
      counts: not stated
    values:
      diam_d21_text:
        printed: 0.9 ± 0.04
        unit: mm
        kind: mean
        group: d21
        spread: SD
        spread_source: legend
    anchor:
      quote: The diameter of the microtissues reached up to 0.9 ± 0.04 mm on day 21
      where: Results, 2D-to-3D culture switch
  F1C_diam_d42_vs_d30:
    unit: F1C
    measure: microtissue diameter
    finding: diameter larger on day 42 (1 ± 0.09 mm) than day 30; * in figure
    compares:
    - d42
    - d30
    n: *id004
    values:
      diam_d42_text:
        printed: 1 ± 0.09
        unit: mm
        kind: mean
        group: d42
        spread: SD
        spread_source: legend
    stats:
      test: Tukey’s multiple comparisons test
      p: '*p ≤ 0.05 (Methods)'
    note: asterisk on a bracket between D30 and D42 in Fig. 1C; no other pair marked
    anchor:
      quote: on day 21 and 1 ± 0.09 mm on day 42
      where: Results, 2D-to-3D culture switch
  F1D_viability:
    unit: F1D
    measure: cell viability (Calcein AM/EthD-1)
    finding: no accumulation of non-viable cells at the core of day 50 microtissues
    groups:
    - d50
    method: LIVE/DEAD Viability/Cytotoxicity Kit, Zeiss LSM 780 confocal imaging
    anchor:
      quote: we demonstrated no accumulation of non-viable cells was visible at the core of the constructs
      where: Results, 2D-to-3D culture switch
  F1E_tunel:
    unit: F1E
    measure: apoptotic cells (TUNEL)
    finding: no accumulation of apoptotic cells at edge or core of day 50 microtissues
    groups:
    - d50
    - dnase
    method: Click-iT Plus TUNEL Assay Kit, confocal imaging; DNAse I positive control
    anchor:
      quote: Here we noticed no accumulation of apoptotic cells at either position in the 3D microtissues
      where: Results, 2D-to-3D culture switch
  TXT1_beating_long:
    unit: TXT1
    measure: spontaneous contractile activity
    finding: microtissues beat spontaneously until at least day 100 (video at day 107)
    groups:
    - hocmt
    values:
      beating_day_text:
        printed: '100'
        unit: day
        kind: value
        group: hocmt
        spread: none
    note: rests on Supplementary Video 2, not in the folder
    anchor:
      quote: The microtissues went on displaying spontaneous contractile activity in long-term culture and until at least day 100
      where: Results, 2D-to-3D culture switch
  TXT1_beating_onset:
    unit: TXT1
    measure: spontaneous beating onset
    finding: spontaneous beating began after ROCK inhibitor removal at 48 h
    groups:
    - hocmt
    values:
      onset_text:
        printed: '48'
        unit: h
        kind: value
        group: hocmt
        spread: none
    anchor:
      quote: started to show spontaneous beating behaviour upon removing the ROCK inhibitor after 48 h
      where: Results, 2D-to-3D culture switch
  F2B_tnnt2_d15:
    unit: F2
