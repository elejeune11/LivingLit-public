mappings:
- field: differentiation_factors
  stated: CHIR99021 + IWR
  terms:
  - CHEBI:91091
  - differentiation_factors:iwr_1
  note: The Key Resources table names the Wnt inhibitor as IWR-1 (Selleck S7086); no synonym 'IWR' added, since the bare name
    could stand for other IWR compounds in other papers.
- field: wnt_activation_days
  stated: d0-d2
  flag:
    kind: not a context
    note: 'Not parseable as a quantity: the day range is printed in the paper''s ''d0-d2'' notation; the reader should write
      it as a quantity (e.g. ''days 0-2'').'
- field: wnt_inhibition_days
  stated: d4-d5
  flag:
    kind: not a context
    note: 'Not parseable as a quantity: the day range is printed in the paper''s ''d4-d5'' notation; the reader should write
      it as a quantity (e.g. ''days 4-5'').'
- field: supplements
  stated: lipid-enhanced Cellastium S + L-ascorbic acid + B27 with insulin
  terms:
  - CHEBI:760525
  - CHEBI:29073
  - supplements:b27
  qualifiers:
    insulin: with insulin
  no_ontology_term: lipid-enriched rice-derived recombinant human albumin ('lipid-enhanced Cellastium S', i.e. Cellastim S);
    ChEBI has only the plain recombinant rice-derived albumin, mapped as the nearest broader id
  note: '''B27 with insulin'' is B27 with its insulin formulation as a qualifier, not a separate insulin addition.'
- field: platform
  stated: anisotropic nanowrinkled surface
  terms:
  - platform:nanowrinkled_surface
- field: platform
  stated: aligned electrospun PLGA nanofibers
  terms:
  - platform:electrospun_fibrous_scaffold
  qualifiers:
    orientation: aligned
  split:
  - words: PLGA
    field: substrate
- field: platform
  stated: capillary force lithography PU fibers
  terms:
  - platform:culture_2d
  qualifiers:
    format: capillary force lithography PU fibers
  split:
  - words: PU
    field: substrate
  note: 'Broader term: the legend calls them fibers, the text ''CFL-based PUA substrates''; whether they are grooves or fibres
    is not stated, so neither grooved surface nor electrospun scaffold is assumed.'
- field: replating_coating
  stated: matrix
  flag:
    kind: placeholder
    note: '''matrix'' names the coating only by reference to CMM; the reader should write the ligands the flat ''Ligands''
      surface was coated with, as printed.'
- field: preparation
  stated: RNA isolated
  terms:
  - preparation:rna_extract
- field: preparation
  stated: detached cells
  terms:
  - preparation:dissociated_cells
  note: Cells detached from the culture substrate with TrypLE and measured in suspension (flow cytometry).
- field: pacing
  stated: 0.2 nA stimulation
  terms:
  - pacing:current_clamp_stimulation
  qualifiers:
    protocol: 0.2 nA for 2 ms
  note: Current injected through the patch pipette in whole-cell current clamp (Patch clamp methods).
