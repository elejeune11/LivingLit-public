      isogenic derivative); the paper prints no clone number and uses the uncorrected patient line'
    synonyms:
    - text: LUMC0153iPKP
      anchor: ACM hiPSC line LUMC0153iPKP (female
      see below for mutation): null
  - event: add_synonym
    id: CL:0002548
    text: CFs
