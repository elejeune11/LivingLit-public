    anchor:
      quote: quantifying the sum of the radiant efficiencies of all fluorescent pixels within the region of interest
      where: Methods
    no_formula: 'a sum over the pixels of a region of interest, each pixel converted to normalized radiant efficiency (emission / excitation) inside IVIS Living Image; no sum-over-n entry and no per-pixel values'
  F3i_mono.radiant_efficiency:
    item: F3i_mono
