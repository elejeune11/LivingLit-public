        dimension: text
  - event: add_term
    field: measure
    id: measure:expression_level_agreement
    label: expression level agreement with a reference
    parent: null
    dimension: dimensionless
    definition: Per cent of the proteins shared with a stated reference (qualifier reference) whose expression level class
      (low, medium, high) matches the reference.
    scope: Agreement of binned expression levels of shared proteins; not shared presence (proteome overlap) and not a correlation
      coefficient (correlation of expression profiles).
    qualifiers:
      reference:
        dimension: text
  - event: add_term
    field: measure
    id: measure:annotation_fold_enrichment
    label: annotation fold enrichment
    parent: null
    dimension: dimensionless
    definition: Ratio of the observed to the expected number of members of a stated annotation (qualifier annotation) in a
      gene or protein set (qualifier gene_set).
    scope: Over-representation as a ratio; not its p-value (functional enrichment p-value), not a ranked-list enrichment score
      (normalized enrichment score) and not a count.
    qualifiers:
      annotation:
        dimension: text
      gene_set:
        dimension: text
  - event: add_term
    field: measure
    id: measure:mirna_expression
    label: microRNA expression
    parent: measure:gene_expression
    dimension: dimensionless
    definition: Relative level of one stated microRNA (qualifier gene), as a fold change against a reference.
