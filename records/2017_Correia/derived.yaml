record: 2017_Correia
formula_library_version: 18
agent:
  model: llm
  instructions: formulas_v3
derived:
  F1IK_FA.oa_pa_FAM_d0:
    item: F1IK_FA
    group: FAM_d0
    measure: contribution of FA to labelled TCA cycle pools
    formula: FA = OA + PA
    anchor: &id001
      quote: 18% of the labelled fraction of these metabolites came from [U-13C]PA and [U-13C]OA
      where: Results
    library:
      formula: sum_of_parts
      vars:
        t: FA
        a: OA
        b: PA
    inputs:
      OA:
        value: F1IK_OA.values.OA_FAM_d0_figure
        kind: constant
      PA:
        value: F1IK_PA.values.PA_FAM_d0_figure
        kind: constant
    output: F1IK_FA.values.FA_FAM_d0_text
  F1IK_FA.oa_pa_FAM_d10:
