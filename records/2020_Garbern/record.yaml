evidence:
  F1B_pS6K:
    unit: F1B
    measure: phospho-S6K protein
    method: Western analysis with chemiluminescence
    finding: Phosphorylation of S6K decreased acutely after Torin1.
    groups:
    - t0
    - h0_5
    - h2
    - h4
    - h10
    - h24
    - h48
    anchor:
      quote: Western analysis of phospho-S6 and phospho-Akt at baseline and 30 minutes and 2, 4, 10, 24, and 48 hours
      where: Figure 1 legend, B
      file: journal_version.pdf
    stated_direction:
      direction: down
      anchor:
        quote: treatment with Torin1 led to acutely decreased phosphorylation of both S6K and Akt
        where: Results, quiescence section
        file: journal_version.pdf
    note: representative blot; no densitometry
  F1B_pAkt:
    unit: F1B
    measure: phospho-Akt protein
    method: Western analysis with chemiluminescence
    finding: Phosphorylation of Akt decreased acutely after Torin1.
    groups:
    - t0
    - h0_5
    - h2
    - h4
    - h10
    - h24
    - h48
    anchor:
      quote: Western analysis of phospho-S6 and phospho-Akt at baseline and 30 minutes and 2, 4, 10, 24, and 48 hours
      where: Figure 1 legend, B
      file: journal_version.pdf
    stated_direction:
      direction: down
      anchor:
        quote: treatment with Torin1 led to acutely decreased phosphorylation of both S6K and Akt
        where: Results, quiescence section
        file: journal_version.pdf
    note: representative blot; no densitometry
  F1B_pS6K_48h:
    unit: F1B
    measure: phospho-S6K protein
    method: Western analysis with chemiluminescence
    finding: Phosphorylated S6K recovered within 2 days after a single treatment.
    compares:
    - h48
    - t0
    anchor:
      quote: Western analysis of phospho-S6 and phospho-Akt at baseline and 30 minutes and 2, 4, 10, 24, and 48 hours
      where: Figure 1 legend, B
      file: journal_version.pdf
    stated_direction:
      direction: none
      anchor:
        quote: We observed recovery of the phosphorylated state for S6K, but not Akt, within 2 days after a single treatment with Torin1
        where: Results, quiescence section
        file: journal_version.pdf
  F1B_pAkt_48h:
    unit: F1B
    measure: phospho-Akt protein
    method: Western analysis with chemiluminescence
    finding: Phosphorylated Akt did not recover within 2 days.
    compares:
    - h48
    - t0
    anchor:
      quote: Western analysis of phospho-S6 and phospho-Akt at baseline and 30 minutes and 2, 4, 10, 24, and 48 hours
      where: Figure 1 legend, B
      file: journal_version.pdf
    stated_direction:
      direction: down
      anchor:
        quote: We observed recovery of the phosphorylated state for S6K, but not Akt, within 2 days after a single treatment with Torin1
        where: Results, quiescence section
        file: journal_version.pdf
  F1C_count:
    unit: F1C
    measure: cell count per well
    finding: Nonsignificant trend toward fewer cells per well with Torin1.
    compares:
    - t200
    - ctrl
    n:
      printed: n=3 per group per time point
      counts: wells
    stats:
      test: not stated
      p: nonsignificant
    anchor:
      quote: Cell counts per well of a 12-well plate during differentiation.
      where: Figure 1 legend, C
      file: journal_version.pdf
    stated_direction:
      direction: down
      anchor:
        quote: There was a nonsignificant trend toward decreased absolute numbers of cells per well
        where: Results, quiescence section
        file: journal_version.pdf
    note: plotted over day of differentiation; the 'nonsignificant' is from the text
