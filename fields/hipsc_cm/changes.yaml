- version: 34
  paper: 2020_Giacomelli
  agent:
    model: llm
    instructions: terms_v4
    run: null
  events:
  - event: add_synonym
    id: hipsc_medium:essential_8
    text: E8 medium
    anchor: All hiPSC lines were seeded on vitronectin recombinant human protein and cultured in E8 medium as described previously
  - event: add_term
    field: hipsc_coating
    id: hipsc_coating:vitronectin
    label: vitronectin
    parent: null
    definition: Recombinant human vitronectin used to coat plates for undifferentiated hiPSCs.
    scope: Vitronectin coating; not Matrigel or Geltrex, which are basement-membrane extracts.
  - event: add_term
    field: replating_coating
    id: replating_coating:vitronectin
    label: vitronectin
    parent: null
    definition: Recombinant human vitronectin used to coat plates when cells are replated.
    scope: Vitronectin coating; not Matrigel (a basement-membrane extract), fibronectin or gelatin.
  - event: add_term
    field: cm_medium
    id: cm_medium:bpel
    label: BPEL medium
    parent: null
    definition: The defined BPEL medium (bovine serum albumin, polyvinyl alcohol and essential lipids) used for differentiation
      and for culturing cardiomyocytes and microtissues.
    scope: A medium named BPEL; not RPMI 1640, DMEM, α-MEM, IMDM or a medium named only as EHT medium.
  - event: add_term
    field: cm_medium
    id: cm_medium:fibroblast_growth_medium_3
    label: Fibroblast Growth Medium 3
    parent: null
    definition: PromoCell's Fibroblast Growth Medium 3, a commercial medium for expanding fibroblasts.
    scope: A fibroblast expansion medium, used when a unit's cells are fibroblasts rather than cardiomyocytes; not a cardiomyocyte
      medium such as BPEL, RPMI 1640, DMEM, α-MEM or IMDM.
    synonyms:
    - text: FGM3
      anchor: CFs were expanded by changing BPEL to Fibroblast Growth Medium 3 (FGM3; PromoCell)
  - event: add_qualifier
    id: measurement_medium:culture_medium
    name: medium
    dimension: text
  - event: add_synonym
    id: measurement_medium:assay_medium
    text: assay medium
    anchor: 1 mM L-glutamine (Thermo Fisher Scientific) (assay medium)
  - event: add_term
    field: dissociation_reagent
    id: dissociation_reagent:collagenase
    label: collagenase
    parent: null
    definition: A collagen-digesting enzyme used to dissociate tissues into single cells.
    scope: A collagenase, its type in a qualifier; not trypsin, trypsin-EDTA, TrypLE, Accutase, Accumax or DNase.
    qualifiers:
      type:
        dimension: text
      concentration:
        dimension: text
  - event: add_synonym
    id: preparation:dissociated_cells
    text: single cells
    anchor: Single cells were used for either scRNaseq or seeded on 24-well Matrigel-coated plates on top of glass coverslips
      (10 mm diameter) for immunofluorescence and electrophysiology.
  - event: add_synonym
    id: preparation:intact_tissue
    text: whole MTs
    anchor: were confirmed by sharp electrode electrophysiology on whole MTs (Figures S4B and S4C)
  - event: add_synonym
    id: platform:cell_aggregate
    text: scaffold-free three-dimensional microtissue
    anchor: enhance maturation in easily constructed, scaffold-free, three-dimensional microtissues (MTs)
  - event: adopt
    field: cell_line
    id: CVCL_ZA25
    label: LUMCi028-A
    lookup: 'cellosaurus ''LUMC0020iCTRL'' (exact: synonyms LUMC0020iCTRL06, LUMC0020iCTRL); the paper''s CTRL1'
    synonyms:
    - text: LUMC0020iCTRL-06
      anchor: CTRL1 hiPSC line LUMC0020iCTRL-06 (female
  - event: adopt
    field: cell_line
