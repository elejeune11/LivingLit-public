  F3_force.pct_change:
    item: F3_force
    formula: d = (Fiso - F0)/F0
    anchor:
      quote: (C) Systolic force increases in percentage
      where: Fig. 3 legend
    library:
      formula: relative_change
      vars:
        d: d
        x: Fiso
        x0: F0
    inputs:
      Fiso:
        not_stated: true
        kind: per sample
        note: value after 1 µM ISO stabilised, per tissue; not printed or read
      F0:
        not_stated: true
        kind: per sample
        note: value before ISO at 1 Hz pacing, per tissue; not printed or read
    output_unit: '%'
    alternatives:
    - label: ratio of group means after/before instead of the mean of per-tissue percentages
    note: plotted in % (fraction x 100); the before/after values per tissue are not given
