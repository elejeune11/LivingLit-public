evidence:
  F1ab_asma_paa_vs_glass:
    unit: F1ab
    measure: αSMA/vimentin fluorescence intensity
    method: immunofluorescence for αSMA and vimentin; fluorescence intensity quantified
    software: CellProfiler
    finding: Expression of αSMA normalized by vimentin was 0.5-fold less on polyacrylamide gels than on glass
    compares:
    - paa
    - glass
    n:
      printed: n = 5
      counts: independent experiments
    values:
      ratio_paa_glass_text:
        printed: 0.5-fold less
        unit: fold
        kind: ratio
        between:
        - paa
        - glass
        expressed_as: fold
        normalised_to: glass
    stats:
      test: not stated
      p: P < 0.01
      p_values:
      - p: '**P < 0.01'
        anchor:
          quote: and ﬂuorescence intensity was quantiﬁed
          where: Fig. 1 legend
    anchor:
      quote: Expression of αSMA normalized by vimentin was 0.5-fold less in hCFs cultured on polyacrylamide gels
      where: Results 3.1
    note: Mean ± SD (legend). Substrate stiffness printed as approximately 12 kPa (Methods, Results) and 12.5 kPa (legend).
  F1cd_asma_tgf_vs_ctrl:
    unit: F1cd
    measure: αSMA/vimentin fluorescence intensity
    method: immunofluorescence for αSMA and vimentin; fluorescence intensity quantified
    software: CellProfiler
    finding: TGF-β1-treated hCFs had a 1.2-fold increase in normalized αSMA fluorescence compared to control
    compares:
    - tgf
    - ctrl
    n:
      printed: n = 3 per group
      counts: independent experiments
    values:
      ratio_tgf_ctrl_text:
        printed: 1.2-fold increase
        unit: fold
        kind: ratio
        between:
        - tgf
        - ctrl
        expressed_as: fold
        normalised_to: control
    stats:
      test: not stated
      p: P < 0.01
      p_values:
      - p: '*P < 0.05'
        anchor:
          quote: HCFs cultured on glass were stimulated with 10 ng/mL TGF-β1
          where: Fig. 1 legend
    anchor:
      quote: TGF-β1-treated hCFs had a 1.2-fold increase in normalized αSMA fluorescence compared to control
      where: Results 3.1
    suspected_error:
      what: 'P and n printed differently: text P < 0.01, n = 3 per group; legend *P < 0.05, n ≥ 10'
      why: 'the legend''s n may count fields of view (Methods: three to five fields per group per experiment); the P differs in threshold'
  F1ef_asma_p9_vs_p4:
