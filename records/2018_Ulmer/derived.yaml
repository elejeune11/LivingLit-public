record: 2018_Ulmer
formula_library_version: 7
agent:
  model: llm
  instructions: formulas_v3
derived:
  prot_diff.differed_pct:
    item: prot_diff
    measure: differentially abundant proteins
    formula: p = k/n
    anchor:
      quote: Among these 614 proteins, 256 (41%) significantly differed in abundance between the groups
      where: Results
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: p
        a: k
        b: n
    inputs:
      k:
        value: prot_diff.values.differed
        kind: constant
      n:
        value: prot_identified.values.compared
        kind: constant
    output: prot_diff.values.differed_pct
  prot_diff.differed_sum:
    item: prot_diff
    measure: differentially abundant proteins
    formula: k = u + d
    anchor:
      quote: 256 (41%) significantly differed in abundance between the groups, 133 proteins being more and 123 proteins less abundant in 3D
      where: Results
      file: main.pdf
    library:
      formula: sum_of_parts
      vars:
        t: k
        a: u
        b: d
    inputs:
      u:
        value: prot_diff.values.more_3d
        kind: constant
      d:
        value: prot_diff.values.less_3d
        kind: constant
    output: prot_diff.values.differed
  prot_nuclear.nuclear_lower_pct:
    item: prot_nuclear
    measure: nuclear protein abundance
    formula: p = k/n
    anchor:
      quote: For nuclear proteins, 75% showed lower abundance in 3D than in 2D
      where: Results
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: p
        a: k
        b: n
    inputs:
      k:
        not_stated: true
        kind: constant
        note: number of nuclear proteins lower in 3D not printed
      n:
        not_stated: true
        kind: constant
        note: number of nuclear proteins compared not printed
    output: prot_nuclear.values.nuclear_lower
  s2e_atp_tca.share:
    item: s2e_atp_tca
    measure: share of Panther pathways
    formula: p = k/n
    anchor:
      quote: were involved in ATP synthesis and the tricarboxylic acid (TCA) cycle (10.8% each of total pathways
      where: Results
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: p
        a: k
        b: n
    inputs:
      k:
        not_stated: true
        kind: constant
        note: pathway hits not printed (PANTHER output, Fig. S2E image)
      n:
        not_stated: true
        kind: constant
        note: total pathway hits not printed
    output: s2e_atp_tca.values.atp_tca_share
  s2f_oxidoreductases.share:
    item: s2f_oxidoreductases
    measure: share of Panther protein classes
    formula: p = k/n
    anchor:
      quote: abundant in 3D hiPSC-CMs was annotated to oxidoreductases (21.7% of total protein classes
      where: Results
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: p
        a: k
        b: n
    inputs:
      k:
        not_stated: true
        kind: constant
        note: class hits not printed
      n:
        not_stated: true
        kind: constant
        note: total class hits not printed
    output: s2f_oxidoreductases.values.oxidoreductase_share
  prot_tfam.ratio:
    item: prot_tfam
    measure: TFAM protein abundance
    formula: r = a/b
    anchor:
      quote: TFAM protein abundance was 2.9-fold higher in 3D than in 2D (2.3 in 2D versus 6.6 in 3D; Table S2)
      where: Discussion
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        data: prot_tfam/g3D
        kind: per sample
      b:
        data: prot_tfam/g2D
        kind: per sample
    output: prot_tfam.values.tfam_ratio
    aggregation: of means
    note: 'Fold change of group means: 6.6/2.3 printed; inputs are the released per-replicate counts (mmc2).'
  prot_tfam.ratio_printed:
    item: prot_tfam
    measure: TFAM protein abundance
    formula: r = a/b
    anchor:
      quote: TFAM protein abundance was 2.9-fold higher in 3D than in 2D (2.3 in 2D versus 6.6 in 3D; Table S2)
      where: Discussion
      file: main.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        value: prot_tfam.values.tfam_3d
        kind: constant
      b:
        value: prot_tfam.values.tfam_2d
        kind: constant
    output: prot_tfam.values.tfam_ratio
    note: The same ratio from the printed means.
  f4d_3d.ratio:
    item: f4d_3d
    measure: average intensity of mitochondrial proteins
    formula: r = a/b
    anchor:
      quote: we found a 2.2-fold higher amount of mitochondrial proteins in 3D than in 2D
      where: Results
      file: main.pdf
    library:
      formula: ratio_def
      vars:
