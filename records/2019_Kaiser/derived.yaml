derived:
  T3_stress.stress:
    item: T3_stress
    measure: peak active stress
    formula: sigma = F/A
    anchor: &id001
      quote: Peak active stress is calculated at 0.3 strain, normalized for cross-sectional area
      where: Methods 2.6.2
    library:
      formula: stress_def
      vars:
        sigma: sigma
        F: F
        A: A
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: peak twitch force (Fmax, Fig. S6B) at 30% strain per construct; not printed
      A:
        not_stated: true
        kind: per sample
        note: initial dimensions from bright-field images after mounting; the shape and formula of the cross-sectional area
          are not stated
    aggregation: mean of per-sample
    note: 'Fig. S6 legend: peak force (Fmax) is normalized to cross-sectional area to calculate stress.'
