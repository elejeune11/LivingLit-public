record: 2022_Shen
formula_library_version: 4
agent:
  model: llm
  instructions: formulas_v2
derived:
  F1_ffr_norm.norm_3hz_HC_NP:
    item: F1_ffr_norm
    group: HC_NP
    measure: normalized peak force
    formula: Fn = F/F1
    anchor: &id001
      quote: the FFR with normalized systolic peak forces
      where: Results, p. 2038
    library:
      formula: ratio_def
      vars:
        r: Fn
        a: F
        b: F1
    inputs:
      F:
        reading: f1b/HC-NP
        x: '3.0'
        kind: per sample
        note: systolic peak force at 3 Hz (group-mean curve)
      F1:
        reading: f1b/HC-NP
        x: '1.0'
        kind: per sample
        note: reference not stated in the text; the normalised curve (f1c) reads 1.00 at 1 Hz, the first step of the staircase
    output_unit: dimensionless
    alternatives:
    - label: mean of per-tissue ratios (each EHT normalised to its own 1 Hz force), which differs from the ratio of group
        means read here
      formula: Fn = mean(F_i/F1_i)
    note: no printed value; the rebuilt ratio can be set against the normalised curve f1c/HC-NP at 3 Hz
