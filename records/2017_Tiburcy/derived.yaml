  F2e_prp.prp:
    item: F2e_prp
    group: sf
    measure: post-rest potentiation
    formula: p = (F - F0)/F0
    anchor:
      quote: The last stimulated beat amplitude was compared to the first stimulated beat amplitude after the pause.
      where: Methods, analyses of contractile function
    library:
      formula: relative_change
      vars:
        d: p
        x: F
        x0: F0
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: first stimulated beat amplitude after the 10 s pause
      F0:
        not_stated: true
        kind: per sample
        note: last stimulated beat amplitude before the pause
    output: F2e_prp.values.prp_text
    aggregation: not stated
    note: '''enhanced FOC by +9±1%'' names a % change; the beat amplitudes are not reported.'
  S8e_adrb1.share_cgp:
    item: S8e_adrb1
    measure: fraction of acute inotropic effect mediated via ADRB1
    formula: s = (E - Ec)/E
    anchor: &id003
      quote: 32±6% of the acute inotropic effect in EHM were mediated via ADRB1
      where: Results, heart failure
    library:
      formula: relative_decrease
      vars:
        s: s
        x: Ec
        x0: E
    inputs:
      E:
        reading: S8e/S8e_adrb1/iso
        kind: per sample
        note: ISO alone (n=11)
      Ec:
        reading: S8e/S8e_adrb1/iso_cgp
        kind: per sample
        note: ISO after the beta1 blocker CGP-20712A (n=7)
    output: S8e_adrb1.values.adrb1_text
    aggregation: of means
    alternatives:
    - label: ICI-resistant share
      formula: s = Ei/E
      note: effect remaining under the beta2 blocker ICI-118551; run as S8e_adrb1.share_ici
    note: Which antagonist the 32% comes from is not stated; the record pairs iso_cgp with iso (CGP-sensitive share). ISO
      alone and ISO+CGP are different EHM, so only of means is possible.
  S8e_adrb1.share_ici:
    item: S8e_adrb1
    measure: fraction of acute inotropic effect mediated via ADRB1
    formula: s = Ei/E
    anchor: *id003
    library:
      formula: ratio_def
      vars:
        r: s
        a: Ei
        b: E
    inputs:
      E:
        reading: S8e/S8e_adrb1/iso
        kind: per sample
      Ei:
        reading: S8e/S8e_cgp_ici/iso_ici
        kind: per sample
        note: ISO after the beta2 blocker ICI-118551 (n=7)
    output: S8e_adrb1.values.adrb1_text
    aggregation: of means
    note: 'Labelled alternative to S8e_adrb1.share_cgp: the beta1-mediated share as the effect left under beta2 block.'
