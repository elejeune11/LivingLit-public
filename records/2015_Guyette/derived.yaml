  F1G_BA.modulus:
    item: F1G_BA
    measure: elastic modulus, base/apex axis
    formula: E = sigma/eps
    anchor:
      quote: moduli were calculated as the slope of the linear region of the stress-strain curve
      where: Online Methods, Biaxial Mechanical Testing
      file: NIHMS733623-supplement-306874DR2_Online_Data_Supplement.pdf
    library:
      formula: linear_elastic_stress_strain
      vars:
        sigma: sigma
        E: E
        eps: eps
    inputs:
      sigma:
        not_stated: true
        kind: per sample
        note: stress = force / cross-sectional area; per-sample curves not released
      eps:
        not_stated: true
        kind: per sample
        note: strain = change in length / length at tare load
    aggregation: mean of per-sample
    note: a slope over the linear region, i.e. a change in stress over a change in strain
  F1G_SFW.modulus:
