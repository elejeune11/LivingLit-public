    method: z-discs detected (top-hat filter, adaptive threshold); local orientation from image autocorrelation
    software: custom MATLAB script
    definition: plateau of the exponential decay model (a0 + a1 e^(−x/λ)) fitted to O.P. over distance
    finding: O.P. plateau lower in PKP2tv−/− than WT2
    compares:
    - PKP2tv_hom
    - WT2
    n:
      printed: PKP2tv−/− (n = 11) versus WT2 (n = 8)
      counts: cardiac patches
      per_group:
        PKP2tv_hom: '11'
        WT2: '8'
    stats:
      test: two-tailed, unpaired Student's t test assuming unequal variances
      p: P = 0.01
    anchor:
      quote: significantly lower levels of sarcomere alignment in PKP2tv−/− (n = 11) versus WT2 (n = 8)
      where: Fig. 10E legend
  S3B:
    unit: S3
    measure: number of sarcomeres
    method: z-discs detected (top-hat filter, adaptive threshold); local orientation from image autocorrelation
    software: custom MATLAB script
    definition: number of α-actinin-2–positive sarcomeric z-discs
    finding: more sarcomeres per single cell in PKP2tv+/− than WT1
    compares:
    - PKP2tv_het
    - WT1
    n:
      printed: PKP2tv+/- (n = 20) vs. WT1 (n = 21)
      counts: single CMs
      per_group:
        PKP2tv_het: '20'
        WT1: '21'
    stats:
      test: two-tailed, unpaired Student's t test assuming unequal variances
      p: p<.0001
    anchor:
      quote: shows significantly higher sarcomere content in PKP2tv+/- (n = 20) vs. WT1 (n = 21)
      where: fig. S3B legend
      file: sciadv.abh3995_sm.pdf
  S3C:
    unit: S3
    measure: order parameter over distance
    method: z-discs detected (top-hat filter, adaptive threshold); local orientation from image autocorrelation
    software: custom MATLAB script
    definition: orientational order <3/2 cos²θ − 1/2> of z-discs relative to the director, over neighbourhood radius
    finding: O.P. over distance, means ± SD with exponential decay fit
    groups:
    - WT1
    - PKP2tv_het
    n:
      printed: PKP2tv+/- (n = 20) vs. WT1 (n = 21)
      counts: single CMs
      per_group:
        PKP2tv_het: '20'
        WT1: '21'
    anchor:
      quote: for sarcomere alignment plotted over distance from any sarcomere Z-disc comparing single cardiomyocytes
      where: fig. S3C legend
      file: sciadv.abh3995_sm.pdf
  S3D:
    unit: S3
    measure: order parameter at 50 µm
    method: z-discs detected (top-hat filter, adaptive threshold); local orientation from image autocorrelation
    software: custom MATLAB script
    definition: orientational order <3/2 cos²θ − 1/2> of z-discs relative to the director, over neighbourhood radius
    finding: O.P. at 50 µm comparable in PKP2tv+/− and WT1 single cells
    compares:
    - PKP2tv_het
    - WT1
    n:
      printed: PKP2tv+/- (n = 20) vs. WT1 (n = 21)
      counts: single CMs
      per_group:
        PKP2tv_het: '20'
        WT1: '21'
    stats:
      test: two-tailed, unpaired Student's t test assuming unequal variances
      p: n.s.
    anchor:
      quote: any sarcomere Z-disc shows comparable sarcomere alignment in single cardiomyocytes harboring
      where: fig. S3D legend
      file: sciadv.abh3995_sm.pdf
  S3E:
    unit: S3
    measure: order parameter plateau
    method: z-discs detected (top-hat filter, adaptive threshold); local orientation from image autocorrelation
    software: custom MATLAB script
    definition: plateau of the exponential decay model (a0 + a1 e^(−x/λ)) fitted to O.P. over distance
    finding: O.P. plateau comparable in PKP2tv+/− and WT1 single cells (figure label n.s.)
    compares:
    - PKP2tv_het
    - WT1
    n:
      printed: PKP2tv+/- (n = 20) vs. WT1 (n = 21)
      counts: single CMs
      per_group:
        PKP2tv_het: '20'
        WT1: '21'
    stats:
      test: two-tailed, unpaired Student's t test assuming unequal variances
      p: n.s.
    anchor:
