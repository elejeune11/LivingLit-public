    note: '''increased by ~9 and ~1%'' read as percentage points; a relative increase is the alternative.'
  F5C_force_PLZ_PLZ_SP30_vs_PLZ_D30.normalized_force_PLZ_SP30:
    item: F5C_force_PLZ_PLZ_SP30_vs_PLZ_D30
    group: PLZ_SP30
    formula: fn = F/A
    anchor: &id004
      quote: The force of contraction was normalized by the surface area of the cell
      where: Supplemental Experimental Procedures, Traction force microscopy measurements
      file: mmc1.pdf
    library:
      formula: stress_def
      vars:
        sigma: fn
        F: F
        A: A
    inputs:
      F:
        reading: 'figs5b/PLZ SP vs DMSO: SP'
        kind: per sample
        note: contraction force per cell (Fig. S5B), the same cells as Fig. 5C
      A:
        not_stated: true
        kind: per sample
        note: surface area of each cell; not printed
    aggregation: mean of per-sample
    alternatives:
    - label: area of the micropatterned island (~20 μm x 140 μm) instead of the cell's own area
      formula: fn = F/(20*140)
      note: stated pattern size; the methods say the cell's surface area was used
    note: 'Per cell: force of contraction divided by that cell''s surface area; plotted per cell.'
