    item: F3C_vwf_D10
    formula: r = a/b
    anchor:
      quote: endothelial density was calculated as vWF-positive covered area divided by spheroid area
      where: Methods (Immunofluorescent analysis)
      file: journal_version.pdf
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
