  F2c_hes2_time.foc_csa_hes2_w2:
    item: F2c_hes2_time
    group: hes2_w2
    measure: FOC per cross sectional area
    formula: s = F/A
    anchor: &id001
      quote: we opted to correct FOC by CSA to allow a direct
      where: Results, functional maturation
    library:
      formula: stress_def
      vars:
        sigma: s
        F: F
        A: A
    inputs:
      F:
        reading: S6/S6c_hes2/hes2_w2_4
        x: '4'
        kind: per sample
        note: uncorrected FOC (Suppl. Fig. 6c) at the highest calcium read, 4 mmol/L
      A:
        reading: S6/S6b_hes2_w4_hes2_w2/hes2_w2
        kind: per sample
        note: EHM CSA (Suppl. Fig. 6b)
    output_unit: mN/mm2
    aggregation: not stated
    note: No printed value for this group; rebuilt for the chain. Fig. 2c readings at 4 mmol/L calcium are the paper's own
      per-CSA values for this group. How CSA was measured is not stated.
