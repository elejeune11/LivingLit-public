      x0:
        reading: s1b_ttp_force/gcamp6f
        kind: per sample
        note: TTP80%,force of the same EHTs (force, blue bar); printed mean 0.145 s
    output: F1D_ttp_ratio.values.shorter
    output_unit: '%'
    aggregation: not stated
    note: 'A test between two measures of the same tissues, not a contrast: the paired t-test (Figure 1D and S1B, *p<0.05) compares TTP80%,CaT with TTP80%,force in the same EHTs, and the printed relation
