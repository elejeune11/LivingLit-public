mappings:
- field: cell_line
  stated: in-house reference
  terms:
  - cell_line:mannhardt_inhouse_reference_ipsc
  note: the paper's name for the Moretti et al. 2010 control line; no synonym added because other studies of the lab use the
    same words
- field: purity_method
  stated: FACS (cTNT)
  terms:
  - purity_method:flow_cytometry
  qualifiers:
    marker: cTNT
- field: platform
  stated: fibrin EHT
  terms:
  - platform:tissue_between_pillars
  qualifiers:
    posts: flexible silicone posts
  split:
  - words: fibrin
    field: substrate
  note: strip-format EHT between two flexible silicone posts (unit note); fibrin agrees with substrate
- field: day_of_measurement
  stated: end of differentiation
  flag:
    kind: not a context
    note: a quantity field holding an event, not a day; the legend gives day 21 for the end of differentiation in Fig. S1D,
      the reader should give the day or not stated
- field: platform
  stated: native tissue
  terms:
  - platform:native_tissue
  note: NFH group of Fig. S2D; wording differs from 'non-failing human heart tissue' in S5F
- field: preparation
  stated: skinned preparations
  terms:
  - preparation:skinned_tissue
  note: 'no synonym: the words appear only in the S5F table image, not in the extracted text'
- field: measure
  stated: average contraction peak (force over time)
  terms:
  - measure:force_trace
- field: measure
  stated: spontaneous beating pattern (force trace)
  terms:
  - measure:force_trace
- field: measure
  stated: differentiation efficiency (cTNT-positive cells)
  terms:
  - measure:marker_positive_cells
  qualifiers:
    marker: cTNT
- field: measure
  stated: input/output ratio (hiPSC/hiPSC-CM)
  terms:
  - measure:cardiomyocyte_yield
- field: measure
  stated: onset of spontaneous beating during differentiation
  terms:
  - measure:beating_onset_time
  qualifiers:
    reference: start of differentiation
- field: measure
  stated: onset of spontaneous beating of EHTs
  terms:
  - measure:beating_onset_time
  qualifiers:
    reference: casting
- field: measure
  stated: contraction time T1
  terms:
