    anchor: RNA was generated via a column-free RNA extraction method.
  - event: add_synonym
    id: CHEBI:8093
    field: treatment
    text: PE
    anchor: For phenylephrine (PE)-induced hypertrophy, hiPSC-CMs were treated with 10 µM PE or vehicle (PBS) for 48 hours.
  - event: add_synonym
    id: MONDO:0005045
    field: disease_model
    text: HCM
    anchor: Myofibril mechanics data from human donor and idiopathic hypertrophic cardiomyopathy (HCM) hearts.
  - event: adopt
