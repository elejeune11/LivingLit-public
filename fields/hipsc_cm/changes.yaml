    parent: measure:maximum_capture_rate
    dimension: time
    definition: The shortest pacing cycle length at which a tissue still follows each stimulus one-to-one, the reciprocal
      of the maximum capture rate.
    scope: The capture limit as a cycle length (time); the parent states it as a frequency.
  - event: add_term
    field: measure
    id: measure:tissue_resistivity
    label: tissue resistivity
    parent: null
    dimension: resistivity
    definition: The real part of a tissue's microscopic composite impedance at a stated stimulation frequency (qualifier frequency).
    scope: The resistive (real) component of tissue impedance; not the reactive (imaginary) component (tissue reactivity)
      and not conduction velocity.
    qualifiers:
      frequency:
        dimension: frequency
  - event: add_term
    field: measure
    id: measure:tissue_reactivity
    label: tissue reactivity
    parent: null
    dimension: resistivity
    definition: The imaginary part of a tissue's microscopic composite impedance at a stated stimulation frequency (qualifier
      frequency).
    scope: The reactive (imaginary) component of tissue impedance; not the resistive component (tissue resistivity) and not
      cell capacitance.
    qualifiers:
      frequency:
        dimension: frequency
  - event: add_term
    field: measure
    id: measure:tube_formation
    label: tube formation
    parent: null
    dimension: dimensionless
    definition: Number of tube-like structures that endothelial cells form per microscope field on a gel in an in vitro angiogenesis
      assay.
    scope: Tubes formed by endothelial cells in vitro; not vessels counted in tissue sections (vessel count density) and not
      cells migrating through a membrane (transwell migration).
    synonyms:
    - text: EC tube formation
      anchor: EC tube formation
  - event: add_term
    field: measure
    id: measure:transwell_migration
    label: transwell migration
    parent: null
    dimension: dimensionless
    definition: Number of cells per microscope field that migrate through a porous membrane in a Boyden or transwell chamber.
    scope: Cells crossing a porous membrane; not tubes formed on a gel (tube formation) and not motion of structures within
      cells (structure motion).
  - event: add_term
    field: measure
    id: measure:exosome_diameter
    label: exosome diameter
    parent: null
    dimension: length
    definition: Diameter of extracellular vesicles (exosomes) collected from conditioned medium, by particle tracking or electron
      microscopy.
    scope: Size of secreted vesicles; not the diameter of tissues, tubular structures or embryoid bodies.
  - event: add_term
    field: measure
    id: measure:engraftment_rate
    label: engraftment rate
    parent: measure:engraftment
    dimension: dimensionless
    definition: Number of donor cells found in the host heart divided by the number of cells implanted.
    scope: A cell-count ratio of engrafted to delivered cells; not an area ratio of graft to infarct (engrafted area per infarct
      area) and not the fraction of animals with a graft (engraftment incidence).
  - event: add_term
    field: measure
    id: measure:vessel_count_density
    label: vessel count density
    parent: null
    dimension: number_per_area
    definition: Number of vessel structures positive for a stated marker (qualifier marker) per area or per microscope field
      of a stated region (qualifier region) in tissue sections.
    scope: A count of vessels per area or field; not the vessel area per implant area (blood vessel density) and not the share
      of vessels positive for a marker (marker-positive vessel fraction).
    qualifiers:
      marker:
        dimension: text
      region:
        dimension: text
  - event: add_term
    field: measure
    id: measure:marker_positive_vessel_fraction
    label: marker-positive vessel fraction
    parent: null
    dimension: dimensionless
    definition: Fraction of vessels in a tissue section positive for a stated marker or markers (qualifier marker), such as
      a human-specific or reporter marker.
    scope: A share of vessels; not a share of cells (marker-positive cells) and not a vessel count per area (vessel count
      density).
    qualifiers:
      marker:
        dimension: text
  - event: add_term
    field: measure
    id: measure:lv_end_diastolic_volume
    label: left ventricular end-diastolic volume
    parent: null
    dimension: volume
    definition: Volume of the left ventricular cavity at end diastole in vivo, from imaging.
    scope: A cavity volume; not a cavity area in one imaging plane (left ventricular end diastolic area), not an ejected volume
      (stroke volume) and not a fraction (ejection fraction).
  - event: add_term
    field: measure
    id: measure:infarct_size
    label: infarct size
    parent: null
    dimension: dimensionless
    definition: Size of a myocardial scar as a fraction of the left ventricle, such as scar surface area over total LV surface
      area from delayed-enhancement MRI.
    scope: Scar extent relative to the ventricle; not engrafted area per infarct area and not a tissue area fraction of a
      section taken by cells.
  - event: add_term
    field: measure
    id: measure:wall_thickening_fraction
    label: systolic wall thickening fraction
    parent: null
    dimension: dimensionless
    definition: Fractional increase in ventricular wall thickness from diastole to systole in a stated region (qualifier region),
      from imaging in vivo.
    scope: Thickening of a heart wall segment in vivo; not fractional shortening of an engineered tissue (contractile shortening)
      and not ejection fraction.
    qualifiers:
      region:
        dimension: text
  - event: add_term
    field: measure
    id: measure:lv_systolic_pressure
    label: left ventricular systolic pressure
    parent: null
    dimension: pressure
    definition: Peak pressure in the left ventricle during systole, measured with a catheter in vivo.
    scope: A chamber pressure in vivo; not wall stress (LV wall stress) and not the stress of an engineered tissue (twitch
      stress).
  - event: add_term
    field: measure
    id: measure:lv_wall_stress
    label: left ventricular wall stress
    parent: null
    dimension: stress
    definition: Stress in the left ventricular wall of a stated region (qualifier region) at a stated phase of the cycle (qualifier
      phase), computed from chamber pressure, radius and wall thickness.
    scope: Wall stress of a heart in vivo; not chamber pressure (left ventricular systolic pressure) and not the active or
      resting stress of an engineered tissue (twitch stress, diastolic stress).
    qualifiers:
      region:
        dimension: text
      phase:
        dimension: text
  - event: add_term
    field: measure
    id: measure:lv_weight_body_weight_ratio
    label: left ventricular weight to body weight ratio
    parent: null
    dimension: dimensionless
    definition: Weight of the left ventricle at sacrifice divided by body weight.
    scope: A post-mortem organ-to-body weight ratio; not a clinical mass index from imaging (left ventricular mass index).
  - event: add_term
    field: measure
    id: measure:marker_positive_cells_per_field
