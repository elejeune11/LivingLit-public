  S10C_RAD50.ddct:
    item: S10C_RAD50
    formula: r = 2**(-ddct)
    anchor:
      quote: The 2−ΔΔCt method was used to determine gene expression changes using HRPT1 as a housekeeping gene
      where: SI Methods, qPCR
      file: pnas.201707316si.pdf
    library:
      formula: ddct_relative_expression
      vars:
        r: r
        ddct: ddct
    inputs:
      ddct:
        not_stated: true
        kind: per sample
  F1K_fourfold.fold:
    item: F1K_fourfold
    formula: fold = c/m
    anchor:
      quote: reduced cell cycle activity fourfold relative to the results obtained in
      where: Results
    library:
      formula: ratio_def
      vars:
        r: fold
        a: c
        b: m
    inputs:
      c:
        reading: F1K/ctrl
        kind: per sample
      m:
        reading: F1K/mm
        kind: per sample
    output: F1K_fourfold.values.fold
    aggregation: not stated
    note: '"fourfold" read as CTRL over MM Ki-67 relative intensity (a reduction)'
  F7I_area.increase:
    item: F7I_area
    formula: d = (x - x0)/x0
    anchor:
      quote: 2.5% (Fig. 7I) increase in hCO size after 48 h
      where: Results
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        reading: F7I/d10
        kind: per sample
      x0:
        reading: F7I/d0
        kind: per sample
    output: F7I_area.values.increase
    aggregation: not stated
