        4-fold at each passage, resulting overall in a 241-fold increase in hiPSC-CM number
      where: Results, GSK-3b Inhibition Promotes hiPSC-CM Proliferation
    groups:
    - sparse
    values:
      fold_first:
        printed: '8'
        unit: fold
        kind: ratio
        spread: not stated
        group: sparse
        expressed_as: fold
      fold_second:
        printed: '8'
        unit: fold
        kind: ratio
        spread: not stated
        group: sparse
        expressed_as: fold
      fold_third:
        printed: '4'
        unit: fold
        kind: ratio
        spread: not stated
        group: sparse
        expressed_as: fold
      fold_overall:
        printed: '241'
        unit: fold
        kind: ratio
        spread: not stated
        group: sparse
        expressed_as: fold
