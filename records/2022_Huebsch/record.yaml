evidence:
  F1_motion:
    unit: F1
    measure: "fraction of contraction along the longitudinal axis"
    method: "motion tracking of 8×8 pixel macroblocks"
    software: "open source motion tracking software (huebschlab.wustl.edu)"
    finding: "95% of the contraction coincides with the orientation of the x axis"
    groups: [wtc]
    values:
      x_fraction: {printed: "95%", unit: "%", kind: percent, group: wtc, spread: "not stated"}
    anchor:
      quote: "indicating that 95% of the contraction coincides with the orientation of the X axis"
      where: "Fig. 1 legend"

  ED2B_glucose:
    unit: ED2BF
    measure: "beating interval"
    method: "motion tracking of bright-field videos"
    software: "open source motion tracking software (huebschlab.wustl.edu)"
    finding: "glucose level significantly impacts beating interval"
    compares: [glu25, glu10, glu0]
    test_of: omnibus
    n: {printed: "n = 9 MPS per group", counts: "MPS"}
    stats: {test: "1-way ANOVA", p: "p < 0.05"}
    anchor:
      quote: "glucose levels significantly impact beating interval (p < 0.05) along with spontaneous beat rate, beating prevalence at 1hz, and GCaMP amplitude at 1Hz (p < 0.01)"
      where: "Extended Data Fig. 2 legend"

