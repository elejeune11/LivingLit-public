  S6ad: 'Supplementary Fig. S6A-D (ehy249_Figure_S6.tif): A is a time course of mean OCR with error bars per line; B (basal
    respiration), C (maximal respiration) and D (ATP production) are bars with upper error bars only; no individual points'
  S6gik: 'Supplementary Fig. S6F-K (ehy249_Figure_S6.tif): F, H, J are representative flow-cytometry histograms; G
    (Mitotracker), I (CellROX) and K (MitoSOX) are bars of median relative to WT with upper error bars only; no individual
    points'
  F3b: 'Fig. 3B: stacked bars (% negative, medium, high BNP) with mean and SD error bars per segment, no individual points;
    Supplementary Fig. S4C-E: the same stacked bars for REBL-PAT and HUES7 lines only (no M/M+6W/f or K/K), no individual
    points'
  F4bd: 'first look (small model): Bars, traces and error bars only; no per-sample markers in panels A-D. (ehy249.pdf p. 6)'
  F4gik: 'first look (small model): Histograms (F, H, J) and bars with error bars (G, I, K); no per-sample markers (ehy249.pdf p.
    6)'
  F6eg: 'first look (small model): Panels D-G show mean bars or curves with SD error bars, no per-sample markers. (ehy249.pdf p.
    8)'
  F6lm: 'first look (small model): Panel M plots per-condition mean markers with error bars, not individual samples. (ehy249.pdf
    p. 8)'
  F7d: 'first look (small model): Heatmaps D and E, and bars with error bars in F and G; no per-sample markers. (ehy249.pdf p. 9)'
  F7e: 'first look (small model): Panel E is a heatmap of fold-change tiles, not per-sample points. (ehy249.pdf p. 9)'
  S8k: 'Supplementary Fig. S8K (ehy249_Figure_S8.tif): force-frequency line plot of one mean marker with error bars per
    genotype (W/W, M/W, M/M) at Unpaced, 1.5, 2 and 2.5 Hz joined by dashed lines; no individual points'
