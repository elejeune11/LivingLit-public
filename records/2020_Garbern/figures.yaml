    groups:
      Control:
        item: F4B_Kir21
        group: ctrl
        unit_of_value: MFI (axis prints no unit)
      Torin1 (200 nM):
        item: F4B_Kir21
        group: t200
        unit_of_value: MFI (axis prints no unit)
    note: Raster bars with individual points (n=3 per group). Read from the author manuscript copy (300 dpi image; the journal
      page p. 9 holds the same figure at ~200 dpi). One control circle sits on the bar-top line and two Torin1 squares touch
      the upper error-bar cap; thin lines are removed by a morphological opening, leaving three separate markers per group
      for disc sizes 11-17 px.
  S2:
    file: NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    page: 19
    crop:
    - 100
    - 125
    - 530
    - 600
    script: figures/S2.py
    unit: S2
    kind: vector
    groups:
      PPARGC1a Control (DMSO):
        item: S2_PPARGC1a
        group: ctrl
        unit_of_value: relative mRNA expression (normalized to TBP)
      PPARGC1a Torin1 (200 nM):
        item: S2_PPARGC1a
        group: t200
        unit_of_value: relative mRNA expression (normalized to TBP)
      TP53 Control (DMSO):
        item: S2_TP53
        group: ctrl
        unit_of_value: relative mRNA expression (normalized to TBP)
      TP53 Torin1 (200 nM):
        item: S2_TP53
        group: t200
        unit_of_value: relative mRNA expression (normalized to TBP)
    note: Panels C (PPARGC1a) and G (TP53) only, the item groups figures-needed lists. Vector bars with individual markers
      (black circles for Control, black squares for Torin1), 6 per group in both panels against a printed N=6-12 per group.
      Each panel is located from its title word; axis from the tick lines and their labels. Fetal and adult heart RNA bars
      (single samples, no error bars) are not read.
no_points:
  F1C: 'first look (small model): Time-course means with error bars; markers are per time point, not per sample. (journal_version.pdf
    p. 4)'
  F1E: Bars (mean) with error bars only, control (DMSO) vs Torin1 200 nM for 14 genes on a broken y axis; no individual points
    plotted. Raster figure (journal_version.pdf p. 4; same image in nihms-1549573.pdf p. 18). No table or released data gives
    the values (supplement lists only primers).
  F1FG: 'first look (small model): F is flow dot plots of single cells; G is bars with error bars (journal_version.pdf p. 4)'
  F1HI: 'first look (small model): Panels H and I show bars with error bars only, no per-sample markers. (journal_version.pdf p.
    4)'
  F2A: 'first look (small model): Bar chart with mean and error bars; no per-sample markers (journal_version.pdf p. 6)'
  F2I: 'first look (small model): Panel I shows bars with SEM error bars only; no individual dots. (journal_version.pdf p. 6)'
  F3AB: 'first look (small model): Panels A-B show traces and bars with error bars; no per-sample markers. (journal_version.pdf
    p. 8)'
  F3F: 'first look (small model): Panel F shows bars with error bars only; no per-sample dots visible. (journal_version.pdf p. 8)'
  F4A: 'first look (small model): Panel A shows mean bars with error bars only, no per-sample markers. (journal_version.pdf p. 9)'
  F4C: 'first look (small model): Panel C shows bars with error bars only; no individual data markers visible. (journal_version.pdf
    p. 9)'
  F4DJ: Violin plots (outline with dashed median and dotted quartile lines) per group, control n=531 vs Torin1 n=315 cells;
    no per-cell points. F, H, I and J show only a column of overlapping dots along the upper tails (not every cell, not separable);
    G shows none. D is images, E a single representative trace. Raster (nihms-1549573.pdf p. 24; journal_version.pdf p. 9).
    No table or released data gives the values.
  F5B: 'first look (small model): Bars with error whiskers only; no per-sample markers visible at this resolution (journal_version.pdf
    p. 10)'
  F5CD: 'first look (small model): Panel D is bars with error bars only; panel C is a blot. (nihms-1549573.pdf p. 26)'
  F6B: 'first look (small model): Grouped bars with error bars; no individual sample markers visible. (journal_version.pdf p. 11)'
  F6CE: 'first look (small model): Panels D and E are bars with error bars; no per-sample markers visible. (journal_version.pdf
    p. 11)'
  S3: 'first look (small model): Bar charts with mean and error bars; no per-sample markers. (NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    p. 20)'
  S4: 'first look (small model): Panels C and D are bars with error bars; no per-sample markers visible. (NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    p. 21)'
  S5: 'first look (small model): Line traces and bar charts show means with error bars, no per-sample markers. (NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    p. 22)'
  S7: 'first look (small model): Violin plots with quartile lines; no individual point markers visible. (NIHMS1549573-supplement-Supplemental_Publication_Material.pdf
    p. 24)'
