# The explorer's cover for this field: the review whose citations are the corpus's source.
# Copied into each release (releases/<tag>/cover.yaml). Citation from PubMed (PMID 39516564).
role: LivingLit's papers are drawn from the studies this review cites.
citation:
  authors: Ewoldt JK, DePalma SJ, Jewett ME, Karakan MÇ, Lin YM, Mir Hashemian P, Gao X, Lou L, McLellan MA, Tabares J,
    Ma M, Salazar Coariti AC, He J, Toussaint KC Jr, Bifano TG, Ramaswamy S, White AE, Agarwal A, Lejeune E, Baker BM,
    Chen CS
  title: 'Induced pluripotent stem cell-derived cardiomyocyte in vitro models: benchmarking progress and ongoing challenges'
  journal: Nature Methods
  year: 2025
  volume: 22
  issue: 1
  pages: 24-40
  doi: 10.1038/s41592-024-02480-7
  pmid: '39516564'
summary: The authors systematically analysed 300 studies that build in vitro models from hiPSC-derived cardiomyocytes,
  cataloguing how the models are fabricated, matured and assessed, and compiled the data into an open-access database.
  Across structural maturity, contractile function, electrophysiology and gene expression they map the field's
  diversity and trends, report field-wide improvements over time, and point to the most common and promising
  practices for functional assessment.
