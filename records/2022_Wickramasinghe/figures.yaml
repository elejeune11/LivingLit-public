no_points:
  F2CF: 'Fig. 2C-2E (journal p. 5, raster): mean vector length, circularity SD and cell area as violin plots of per-cell values
    (>15 cells x 3 replicates per condition), hundreds of overlapping markers per violin, no mean or error bar drawn; no marker
    stands alone, and the cells are not the printed n = 3 replicates. Fig. 2F (bars with 4 points each) is read as figure F2F.'
  F3DF: 'Fig. S3C (supplement p. 7, raster): PFKM, MLYCD and HADHA expression (reads) over days of GW0742 as filled line plots of means with
    error bars, control as a dashed line; no individual replicate points. Fig. 3D-3F are a heat map, pathway terms and Venn counts, not group points.'
  F5EF: 'Fig. 5E-5F (journal p. 11, raster) and Fig. S5A (supplement p. 11, raster): mitochondrial area, length and width as swarms of
    per-mitochondrion markers (5-10 images per condition, >99 per condition) with a mean line and error bar; hundreds of markers per group
    overlap in dense bands, so no marker stands alone and none can be counted. Fig. 5D and S5B are TEM micrographs (no group values).'
  F6AB: 'Fig. 6A-6B (journal p. 13, one JPEG image, about 240 dpi): APD20, APD50, CaD20, CaD50, CaD90 and decay time as bars (mean
    + SD) with 25-40 per-cell markers per bar in three shapes (triangle, circle, square: one per replicate). Markers touch and overlap in
    every panel (heaps in CaD20, CaD50, APD50 and decay time), and the navy LCFA + GSK0660 markers sit on a navy bar, so no marker stands
    alone and none can be counted. Fig. 6C-6D and S6A-S6B are representative traces (no group values).'
