      detergent:
        dimension: text
  - event: add_term
    field: measure
    id: measure:tissue_dna_content
    label: tissue DNA content
    dimension: dimensionless
    definition: Mass of DNA per mass of tissue, measured to judge how completely cells were removed.
    scope: Total (nuclear) DNA per tissue mass; not mitochondrial DNA copy number and not DNA staining intensity.
  - event: add_term
    field: measure
    id: measure:ecm_component_content
    label: extracellular matrix component content
    dimension: dimensionless
    definition: Mass of a stated extracellular matrix component (qualifier component), such as collagen, elastin or glycosaminoglycans,
      per mass of tissue by a biochemical assay.
    scope: A biochemical assay of one matrix component per tissue mass; not a proteomic share of the matrisome and not a protein
      level against a loading reference.
    qualifiers:
      component:
        dimension: text
  - event: add_term
    field: measure
    id: measure:matrisome_share
    label: share of the matrisome
    dimension: dimensionless
    definition: Fraction of the total matrisome abundance in a proteomic analysis contributed by a stated protein or protein
      family (qualifier component).
    scope: A protein's or family's share of the matrix proteins; not a biochemical assay per tissue mass (ECM component content)
      and not a protein class's abundance in the whole proteome.
    qualifiers:
      component:
        dimension: text
  - event: add_term
    field: measure
    id: measure:elastic_anisotropy_ratio
    label: anisotropy ratio
    dimension: dimensionless
    definition: Difference of the elastic moduli along two orthogonal axes divided by their sum.
    scope: A number from two moduli; not a categorical structural anisotropy from images and not an orientation order parameter.
  - event: add_term
    field: measure
    id: measure:blood_count_parameter
    label: blood count parameter
    dimension: dimensionless
    definition: A parameter of a haematology analysis of a blood sample; each child names one parameter.
    scope: Blood analysis of a host; not cells of a culture or construct.
  - event: add_term
    field: measure
    id: measure:wbc_differential
    label: white blood cell differential
    parent: measure:blood_count_parameter
    dimension: dimensionless
    definition: Share of white blood cells that are of a stated type (qualifier cell_type).
    scope: Shares among white blood cells; not red cell or platelet parameters.
    qualifiers:
      cell_type:
        dimension: text
  - event: add_term
    field: measure
    id: measure:hematocrit
    label: hematocrit
    parent: measure:blood_count_parameter
    dimension: dimensionless
    definition: Fraction of blood volume occupied by red blood cells.
    scope: Red cell volume fraction; not red cell count, haemoglobin concentration or a white cell share.
  - event: add_term
    field: measure
    id: measure:red_blood_cell_count
    label: red blood cell count
    parent: measure:blood_count_parameter
    dimension: number_per_volume
    definition: Number of red blood cells per volume of blood.
    scope: A red cell count; not hematocrit (a volume fraction) or platelet count.
  - event: add_term
    field: measure
    id: measure:mean_corpuscular_volume
    label: mean corpuscular volume
    parent: measure:blood_count_parameter
    dimension: volume
    definition: Mean volume of one red blood cell.
    scope: Mean red cell volume; not the width of the red cell volume distribution or mean platelet volume.
  - event: add_term
    field: measure
    id: measure:red_cell_distribution_width
    label: red cell distribution width
    parent: measure:blood_count_parameter
    dimension: volume
    definition: Width of the distribution of red blood cell volumes.
    scope: The spread of red cell volumes; not their mean (mean corpuscular volume).
  - event: add_term
    field: measure
    id: measure:hemoglobin_concentration
    label: hemoglobin concentration
    parent: measure:blood_count_parameter
    dimension: mass_per_volume
    definition: Mass of haemoglobin per volume of blood.
    scope: Haemoglobin per blood volume; not per red cell volume (mean corpuscular hemoglobin concentration).
  - event: add_term
    field: measure
    id: measure:mean_corpuscular_hemoglobin_concentration
    label: mean corpuscular hemoglobin concentration
    parent: measure:blood_count_parameter
    dimension: mass_per_volume
    definition: Mass of haemoglobin per volume of packed red blood cells.
    scope: Haemoglobin per red cell volume; not per blood volume (hemoglobin concentration).
  - event: add_term
    field: measure
    id: measure:platelet_count
    label: platelet count
    parent: measure:blood_count_parameter
    dimension: number_per_volume
    definition: Number of platelets per volume of blood.
    scope: A platelet count; not red cell count or mean platelet volume.
  - event: add_term
    field: measure
    id: measure:mean_platelet_volume
    label: mean platelet volume
    parent: measure:blood_count_parameter
    dimension: volume
    definition: Mean volume of one platelet.
    scope: Mean platelet volume; not platelet count or red cell volume.
  - event: add_term
    field: measure
    id: measure:hla_antibody_reactivity
    label: HLA antibody reactivity
    dimension: dimensionless
    definition: Reactivity of a host's serum antibodies against human leukocyte antigens, read on single-antigen beads as
      fluorescence or as the number of reactive beads.
    scope: Host antibodies against HLA; not marker-positive cell fractions in an explant and not blood count parameters.
  - event: add_term
    field: measure
    id: measure:coronary_flow_rate
    label: coronary flow rate
    dimension: volume_rate
    definition: Volume of perfusate flowing through the coronary vasculature per unit time.
    scope: Flow through coronary vessels; not cardiac output (blood pumped by the heart) and not vascular resistance.
  - event: add_term
    field: measure
    id: measure:vascular_resistance
    label: vascular resistance
    dimension: hydraulic_resistance
    definition: Perfusion pressure divided by flow rate through a vascular bed.
    scope: Resistance of a vascular bed to flow; not flow rate itself and not electrical tissue resistivity.
  - event: add_term
    field: measure
    id: measure:vessel_diameter
    label: vessel diameter
    dimension: length
    definition: Diameter of blood vessels in a tissue or matrix, summarised as stated (qualifier statistic, such as a distribution
      or the smallest seen).
    scope: Vessel calibre; not vessel count per area and not the diameter of tubular structures formed in culture.
    qualifiers:
      statistic:
        dimension: text
  - event: add_term
    field: measure
    id: measure:lv_developed_pressure
    label: left ventricular developed pressure
    dimension: pressure
    definition: Rise of left ventricular pressure above its diastolic or preload level during a contraction.
    scope: Peak minus baseline chamber pressure; not peak systolic pressure (left ventricular systolic pressure) and not wall
      stress.
  - event: add_term
    field: measure
    id: measure:lv_pressure_rise_rate_max
    label: maximal rate of left ventricular pressure rise
    dimension: pressure_rate
    definition: Largest positive rate of change of left ventricular pressure (dP/dt max) during a contraction.
    scope: Rate of chamber pressure rise; not the rate of force rise of a tissue and not the rate of pressure decline.
  - event: add_term
    field: measure
    id: measure:lv_pressure_decline_rate_max
    label: maximal rate of left ventricular pressure decline
    dimension: pressure_rate
    definition: Largest rate of fall of left ventricular pressure (dP/dt min) during relaxation.
    scope: Rate of chamber pressure decline; not the rate of force decline of a tissue and not the rate of pressure rise.
  - event: add_term
    field: measure
    id: measure:medium_ph
    label: medium pH
    dimension: dimensionless
    definition: pH of a culture medium or perfusate sample.
    scope: Acidity of a medium sample; not extracellular acidification rate and not a gas partial pressure.
  - event: add_term
    field: measure
    id: measure:medium_gas_partial_pressure
    label: gas partial pressure in medium
    dimension: pressure
    definition: Partial pressure of a stated gas (qualifier gas) dissolved in a medium or perfusate sample.
    scope: A dissolved gas pressure; not oxygen saturation, not a concentration of a solute and not an incubator gas level.
    qualifiers:
