    - a_ww
    n: &id008
      printed: AT1 (n = 9), REBL-PAT (n = 6), and HUES7 (n = 3)
      counts: biological replicates
      per_group:
        a_ww: '9'
        a_mw: '9'
        a_mm: '9'
        a_mm6: '9'
        a_kk: '9'
        r_ww: '6'
        r_mw: '6'
        r_mm: '6'
        h_ww: '3'
