  # ---- TFM work: a field sum of dot products (no closed-form entry)
  F5E_het.work:
    item: F5E_het
    measure: systolic work
    formula: not stated
    anchor: &work
      quote: The work generated by cell contraction was calculated by multiplying force vectors by bead displacement vectors and summing over a user-defined area
      where: Methods, Traction force microscopy
    no_formula: a sum over the traction field of force vector dot bead displacement; the library has no field-sum entry
  F5E_hom.work:
    item: F5E_hom
    measure: systolic work
    formula: not stated
    anchor: *work
    no_formula: a sum over the traction field of force vector dot bead displacement; the library has no field-sum entry
  F6E_het.work:
