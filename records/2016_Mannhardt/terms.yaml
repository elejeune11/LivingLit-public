# Vocabulary agent output for 2016_Mannhardt (03-vocabulary); applied by the orchestrator.
record: 2016_Mannhardt
vocabulary_version: 11
agent:
  model: llm
  instructions: terms_v3
edits:
- add_synonym:
    id: CL:0000746
    text: hiPSC-CM
    anchor: induced pluripotent stem cell-derived cardiomyocytes (hiPSC-CM)
- add_synonym:
    id: purity_method:flow_cytometry
    text: FACS
    anchor: Flow cytometry (FACS) analysis
- add_synonym:
    id: platform:native_tissue
    text: non-failing human heart tissue
    anchor: non-failing human heart tissue has been mainly evaluated
- adopt_own:
    field: cell_line
    id: cell_line:mannhardt_inhouse_reference_ipsc
    label: in-house reference hiPSC control line of the Mannhardt 2016 study (unnamed)
    definition: The undifferentiated hiPSC control line of Moretti et al. 2010 that the Hamburg EHT study calls its in-house
      reference line; no line name or accession is printed.
    scope: The unnamed in-house control line of the 2016 Hamburg EHT study; not another study's unnamed line and not a commercial
      cardiomyocyte product.
    lookup: searched Cellosaurus for 'Moretti', 'in-house reference' and the paper's wording; the paper prints no line name,
      so no accession can be chosen
- adopt_own:
    field: cell_line
    id: cell_line:icell_cardiomyocytes
    label: iCell cardiomyocytes (CDI)
    definition: Commercial hiPSC-derived cardiomyocytes sold by Cellular Dynamics International as iCell Cardiomyocytes; the
      source line is not printed.
    scope: Commercial CDI iCell cardiomyocytes whose source line is not printed; not a study's own unnamed line.
    lookup: 'searched Cellosaurus for ''iCell'', ''iCell Cardiomyocytes'', ''iCell cardiomyocyte'', ''iCell2'', ''CMC-100''
      and ''Cellular Dynamics'': no entry'
    synonyms:
    - text: iCell
      anchor: CM (CDI, iCell; Axiogenesis, Cor.4U) were used for comparison
- adopt:
    field: cell_line
    id: CVCL_Y550
    label: Cor.4U
    lookup: 'Cellosaurus ''Cor.4U'': exact label match (synonym Cor4U)'
- adopt:
    field: differentiation_factors
    id: CHEBI:760509
    label: basic fibroblast growth factor (human)
    lookup: ChEBI 'FGF2' and 'fibroblast growth factor 2' gave nothing; 'basic fibroblast growth factor' gave CHEBI:760509
      (FGF2 is basic FGF)
    synonyms:
    - text: FGF2
      anchor: with 30 ng/ml FGF2
- adopt_own:
    field: differentiation_factors
    id: differentiation_factors:ds_07
    label: DS-07
    definition: The small-molecule Wnt inhibitor DS-07 used in the cardiac stage of differentiation.
    scope: The Wnt inhibitor DS-07; not IWP4, another Wnt inhibitor, and not the growth factor VEGF.
    lookup: 'searched ChEBI for ''DS-07'', ''DS07'' and the printed chemical name fragment ''dioxooctahydro'': no matching
      entry'
- adopt:
    field: supplements
    id: CHEBI:145810
    label: insulin
    lookup: 'ChEBI ''insulin'': exact label match'
- adopt_own:
    field: supplements
    id: supplements:horse_serum
    label: horse serum
    definition: Serum from horses added to culture medium as a supplement.
    scope: Serum from horses; not fetal bovine serum, KnockOut Serum Replacement or a defined supplement such as B27.
    lookup: 'searched ChEBI for ''horse serum'': no entry (serum is a mixture, not a chemical entity)'
- adopt:
    field: supplements
    id: CHEBI:74537
    label: monothioglycerol
    lookup: 'ChEBI ''thioglycerol'': CHEBI:74537 monothioglycerol (1-thioglycerol, 3-mercaptopropane-1,2-diol)'
    synonyms:
    - text: 1-thioglycerol
      anchor: 1-thioglycerol (Sigma, M6145), 1 µM Y-27632
- adopt:
    field: treatment
    id: CHEBI:3385
    label: carbachol
    lookup: 'ChEBI ''carbachol'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:233563
    label: SEA0400
    lookup: 'ChEBI ''SEA-0400'' and ''SEA0400'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:9506
    label: tetrodotoxin
    lookup: 'ChEBI ''tetrodotoxin'': exact label match'
    synonyms:
    - text: TTX
      anchor: Effect of tetrodotoxin (TTX)
- adopt:
    field: treatment
    id: CHEBI:34732
    label: E-4031
    lookup: 'ChEBI ''E-4031'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:34781
    label: HMR1556
    lookup: 'ChEBI ''HMR-1556'': exact label match HMR1556'
- adopt:
    field: treatment
    id: CHEBI:472805
    label: ouabain
    lookup: 'ChEBI ''ouabain'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:104872
    label: rolipram
    lookup: 'ChEBI ''rolipram'': exact label match (racemate; the paper does not name an enantiomer)'
- adopt_own:
    field: treatment
    id: treatment:atx_ii
    label: ATX-II
    definition: Sea anemone toxin II (ATX-II), a peptide that slows inactivation of the fast sodium current.
    scope: The sodium-current toxin ATX-II, a peptide absent from ChEBI; not another compound or a physical exposure.
    lookup: 'searched ChEBI for ''ATX-II'', ''anemone toxin'', ''sea anemone'', ''Anemonia'' and ''anthopleurin'': no entry
      for the toxin'
- adopt_own:
    field: treatment
    id: treatment:ns_1643
    label: NS-1643
    definition: NS-1643, a small-molecule activator of the hERG (IKr) potassium channel.
    scope: The hERG activator NS-1643, absent from ChEBI; not another compound or a physical exposure.
    lookup: 'searched ChEBI for ''NS-1643'', ''NS1643'', ''NS 1643'' and ''1643'': no entry'
- adopt:
    field: treatment
    id: CHEBI:8428
    label: procainamide
    lookup: 'ChEBI ''procainamide'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:3061
    label: bepridil
    lookup: 'ChEBI ''bepridil'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:28462
    label: ajmaline
    lookup: 'ChEBI ''ajmaline'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:6916
    label: mexiletine
    lookup: 'ChEBI ''mexiletine'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:75984
    label: flecainide
    lookup: 'ChEBI ''flecainide'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:4636
    label: diphenhydramine
    lookup: 'ChEBI ''diphenhydramine'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:9122
    label: sertindole
    lookup: 'ChEBI ''sertindole'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:28593
    label: quinidine
    lookup: 'ChEBI ''quinidine'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:5856
    label: Ibutilide
    lookup: 'ChEBI ''ibutilide'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:3720
    label: cisapride
    lookup: 'ChEBI ''cisapride'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:46195
    label: paracetamol
    lookup: 'ChEBI ''paracetamol'': exact label match'
- adopt:
    field: treatment
    id: CHEBI:15365
    label: acetylsalicylic acid
    lookup: ChEBI 'aspirin' gave only salts and derivatives; 'acetylsalicylic acid' is the exact label for aspirin
    synonyms:
    - text: aspirin
      anchor: of four compounds known to be safe (aspirin, paracetamol
- adopt:
    field: treatment
    id: CHEBI:28971
    label: ampicillin
    lookup: 'ChEBI ''ampicillin'': exact label match'
- add_term:
    field: replating_coating
    id: replating_coating:gelatin
    label: gelatin
    parent: null
    definition: Denatured collagen (gelatin) coated on a surface before cells are plated.
    scope: Gelatin coating; not Matrigel, a basement-membrane extract, and not fibronectin, a single purified matrix glycoprotein.
- add_term:
    field: purification
    id: purification:genetic_selection
    label: genetic selection
    parent: null
    definition: Enrichment of cardiomyocytes by a genetically encoded selection marker (such as antibiotic resistance driven
      by a cardiac promoter).
    scope: Selection through a transgene in the cells; not selection by energy substrate (metabolic selection).
- add_term:
    field: preparation
    id: preparation:skinned_tissue
    label: skinned tissue
    parent: null
    definition: Muscle tissue whose cell membranes have been chemically permeabilised so that the myofilaments are exposed
      to the bath.
    scope: Permeabilised (skinned) muscle for myofilament measurements; not intact tissue with membranes intact, and not dissociated,
      fixed or extracted samples.
- add_term:
    field: measure
    id: measure:force_trace
    label: force trace
    parent: null
    definition: Force of a tissue over the time course of contraction and relaxation, shown as a curve (an averaged contraction
      peak or a recording of beating).
    scope: The waveform of force over time; not a single twitch force value and not a stress trace (force per cross-section).
    dimension: force
- add_term:
    field: measure
    id: measure:embryoid_body_diameter
    label: embryoid body diameter
    parent: null
    definition: Diameter of embryoid bodies formed during differentiation.
    scope: Size of embryoid bodies before cardiac differentiation is complete; not cell area or tissue size.
    dimension: length
- add_term:
    field: measure
    id: measure:cardiomyocyte_yield
    label: cardiomyocyte yield per input hiPSC
    parent: null
    definition: Number of cardiomyocytes obtained per hiPSC put into differentiation (input/output ratio).
    scope: A count ratio of output cardiomyocytes to input stem cells; not the fraction of marker-positive cells (purity).
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:beating_onset_time
    label: onset of spontaneous beating
    parent: null
    definition: 'Time at which cells or tissues first beat spontaneously, counted from a stated reference event (qualifier
      reference: start of differentiation, casting).'
    scope: When beating starts; not the beating rate and not whether beating is present at one time.
    dimension: time
    qualifiers:
      reference:
        dimension: text
- add_term:
    field: measure
    id: measure:max_force_rise_rate
    label: maximal rate of force rise
    parent: null
    definition: Maximal rate of change of force (dF/dt) during contraction, in force per time.
    scope: Rate of force development; not contractile velocity (speed of tissue displacement) and not time to peak force.
    dimension: force_rate
- add_term:
    field: measure
    id: measure:max_force_decay_rate
    label: maximal rate of force decline
    parent: null
    definition: Maximal rate of change of force (dF/dt) during relaxation, in force per time.
    scope: Rate of force decline; not relaxation velocity (speed of tissue re-lengthening) and not relaxation time.
    dimension: force_rate
- add_term:
    field: measure
    id: measure:tissue_anisotropy
    label: structural anisotropy
    parent: null
    definition: Qualitative assessment of whether cells in a tissue are aligned along a common axis, from histology.
    scope: Qualitative alignment of cells in a tissue section; not a quantified orientation distribution or order parameter.
    dimension: categorical
- add_term:
    field: measure
    id: measure:tubular_structure_diameter
    label: tubular structure diameter
    parent: null
    definition: Diameter of membrane tubules (t-tubule-like structures) seen in electron micrographs.
    scope: A length of tubular membrane structures; not the presence or organisation of T-tubules as a whole.
    dimension: length
- add_term:
    field: measure
    id: measure:expression_clusters
    label: gene expression clusters
    parent: null
    definition: Groups of genes or probes with similar expression profiles across samples, from a cluster analysis.
    scope: The clustering of many genes or probes; not the expression of one gene and not a count of differentially expressed
      genes.
    dimension: categorical
- add_term:
    field: measure
    id: measure:enrichment_p_value
    label: functional enrichment p-value
    parent: null
    definition: Significance of over-representation of a functional annotation (GO term, pathway, disease) in a gene set.
    scope: Enrichment of annotations in a gene set; not the expression of a gene and not a count of genes.
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:frequency_dependent_acceleration_of_relaxation
    label: frequency-dependent acceleration of relaxation
    parent: null
    definition: Change in relaxation time when pacing frequency is raised over a stated range.
    scope: The shortening of relaxation with pacing rate as a whole; not relaxation time at one frequency and not the force-frequency
      relationship.
    dimension: dimensionless
- add_term:
    field: measure
    id: measure:frank_starling_response
    label: Frank-Starling response
    parent: null
    definition: Increase in twitch force when preload (tissue length) is increased.
    scope: Change of force with preload; not twitch force at one length and not the force-frequency relationship.
    dimension: dimensionless
- standing_key:
    measure: measure:force_trace
    value:
      must_match:
      - platform@1
      - preparation
      - pacing
      - temperature
      - measurement_calcium_mM
      - mechanical_load
      - measure.expressed_as
      may_vary:
      - cell_line
    direction: &id001
      must_match:
      - contrast
      may_vary:
      - cell_line
      - day_of_measurement
- standing_key:
    measure: measure:embryoid_body_diameter
    value:
      must_match: []
