  F1C_width.narrower:
    item: F1C_width
    formula: s = (w0 - w)/w0
    anchor:
      quote: 30% ± 5% narrower in the center
      where: Results 3.1
    library:
      formula: relative_decrease
      vars:
        s: s
        x: w
        x0: w0
    inputs:
      w:
        not_stated: true
        kind: per sample
        note: TDI-CMT width at the centre
      w0:
        not_stated: true
        kind: not stated
        note: control-CMT width at the centre
    output: F1C_width.values.narrower_text
    aggregation: not stated
    alternatives:
    - label: narrower as a fraction of the TDI width
      formula: s = (w0 - w)/w
      note: '''narrower'' does not name its reference; the control is the usual one'
