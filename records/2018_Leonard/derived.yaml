# Formula agent (formulas_v3), 2018_Leonard. Derivations as the methods state them; verdicts are code's.
record: 2018_Leonard
formula_library_version: 12
derived:
  F2_force_text.force_K1:
    item: F2_force_text
    group: K1
    measure: twitch force
    formula: F = k*d
    anchor: &id001
      quote: Twitch force, velocity, power, and work were then calculated from the deflection of the flexible post and its
        bending stiffness
      where: Section 2.3
    library:
      formula: hooke_spring
      vars:
        F: F
        k: k
        x: d
    inputs:
      k:
        value: F1_stiffness_text.values.K1_text
        kind: constant
      d:
        not_stated: true
        kind: per sample
        note: peak deflection of the flexible post per tissue (Δpost); not printed
    output: F2_force_text.values.K1_mean_text
    aggregation: mean of per-sample
    note: one post rigid, so the tissue force is the force on the flexible post; the plotted force is the maximum during contraction
      (Fig. 2 legend)
  F2_force_text.force_K2:
    item: F2_force_text
    group: K2
