vocabulary_version: 52
agent: {model: llm, instructions: terms_v4}
edits:
# ---------------------------------------------------------------- context: cell line, coatings, factors
- add_synonym: {id: CVCL_K054, text: DF19-9-11T.H, anchor: hiPSC line DF19-9-11T.H (WiCell)}
- add_term:
    field: hipsc_coating
    id: hipsc_coating:synthemax_ii_sc
    label: Synthemax II-SC
    definition: A synthetic vitronectin-derived peptide substrate (Corning Synthemax II-SC) coated on plates for undifferentiated pluripotent stem cells.
    scope: A synthetic peptide surface; not Matrigel or Geltrex (basement-membrane extracts) and not recombinant vitronectin protein.
    synonyms:
    - {text: Synthemax II-SC, anchor: hPSCs were routinely expanded in Synthemax II-SC (corning) coated plates}
- adopt:
    field: differentiation_factors
    id: CHEBI:22652
    label: ascorbic acid
    lookup: searched 'ascorbic acid' in ChEBI 257; exact match; already adopted for supplements, added here because the paper gives it with CHIR99021 and Activin A at mesoderm induction
# ---------------------------------------------------------------- context: preparation, medium, bath
- add_synonym: {id: preparation:collected_medium, text: culture supernatants, anchor: concentrations from cell culture supernatants were measured using YSI 7100MBS}
- add_synonym: {id: preparation:rna_extract, text: RNA samples, anchor: 'Human left and right ventricular RNA samples, from a commercial supplier'}
- add_term:
    field: preparation
    id: preparation:metabolite_extract
    label: metabolite extract
    definition: Intracellular metabolites quenched and extracted from cells for mass spectrometry.
    scope: Small-molecule metabolites extracted from the cells; not the collected culture medium, not purified RNA (RNA extract) and not a protein lysate.
    synonyms:
    - {text: metabolite extraction, anchor: 'Metabolic quenching, metabolite extraction and derivatization'}
- add_synonym: {id: measurement_medium:culture_medium, text: culture media, anchor: hiPSC-CMs were imaged in the different culture media}
# ---------------------------------------------------------------- context: treatments (energy substrates)
- adopt:
    field: treatment
    id: CHEBI:18050
    label: L-glutamine
    lookup: searched 'L-glutamine' in ChEBI 257; exact match; already adopted for supplements, added for treatment because the paper's media vary it between groups
    synonyms:
    - {text: Gln, anchor: 1 mM glutamine (Gln)}
- adopt:
    field: treatment
    id: CHEBI:28260
    label: galactose
    lookup: searched 'galactose' in ChEBI 257; exact match (the paper does not say D-); already adopted for supplements, added for treatment because only GFAM contains it
- adopt:
    field: treatment
    id: CHEBI:16196
    label: oleic acid
    lookup: searched 'oleic acid' in ChEBI 257; exact match
- add_synonym: {id: CHEBI:7896, text: palmitic acid, anchor: 'OA: Oleic Acid and PA: Palmitic acid'}
- add_synonym: {id: CHEBI:24996, text: sodium L-Lactate, anchor: 4 mM sodium L-Lactate (Sigma-Aldrich)}
# ---------------------------------------------------------------- context: maturation strategies (Table 1)
- add_term:
    field: maturation_strategy
    id: maturation_strategy:pluricyte_medium
    label: Pluricyte Medium
    parent: maturation_strategy:maturation_medium
    definition: The commercial Pluricyte cardiomyocyte medium, used as a maturation medium.
    scope: The named commercial product, whose formulation the source does not give; not a medium defined by its energy substrates (metabolic maturation medium).
    synonyms:
    - {text: Pluricyte Medium, anchor: Pluricyte Medium (with T3}
- add_term:
    field: maturation_strategy
    id: maturation_strategy:gene_overexpression
    label: gene overexpression
    definition: Overexpression of a gene or microRNA in the cells to promote their maturation.
    scope: Maturation by an introduced gene or microRNA (named in transgene); not electrical stimulation, mechanical loading, a maturation medium, dynamic, static or prolonged culture.
- add_term:
    field: maturation_strategy
    id: maturation_strategy:prolonged_culture
    label: prolonged culture
    definition: Keeping the cells in culture for a long time so that they mature with time alone.
    scope: Maturation by time in culture alone (the duration is day_of_measurement); not electrical stimulation, mechanical loading, a maturation medium, gene overexpression, dynamic or static culture.
    synonyms:
    - {text: time in culture, anchor: 'by increasing time in culture4, applying mechanical and electrical stimulation'}
# ---------------------------------------------------------------- measures: qualifiers on existing terms
- add_qualifier: {id: measure:contractile_velocity, name: statistic, dimension: text}
- add_qualifier: {id: measure:relaxation_velocity, name: statistic, dimension: text}
- add_qualifier: {id: measure:expression_profile_correlation, name: reference, dimension: text}
- add_qualifier: {id: measure:differentially_expressed_gene_count, name: regulation, dimension: text}
- add_qualifier: {id: measure:differentially_expressed_gene_count, name: reference, dimension: text}
# ---------------------------------------------------------------- measures: synonyms on existing terms
- add_synonym: {id: measure:oxygen_consumption_rate, text: basal oxygen consumption rate, anchor: (F) Basal oxygen consumption rate (OCR)}
- add_synonym: {id: measure:oxygen_consumption_rate, text: OCR, anchor: 'hiPSC-CMs displayed a significantly higher oxygen consumption rate (OCR, Fig. 1F)'}
- add_synonym: {id: measure:extracellular_acidification_rate, text: ECAR, anchor: 'lower extracellular acidification rate (ECAR, Fig. 1G)'}
- add_synonym: {id: measure:cell_aspect_ratio, text: length-to-width ratio, anchor: 'length-to-width ratio (I). n > 70 cells per condition'}
- add_synonym: {id: measure:contractile_shortening, text: percentage of shortening, anchor: (F) Percentage of shortening}
- add_synonym: {id: measure:twitch_force, text: maximum contractile force, anchor: (H) Maximum contractile force generated by}
# ---------------------------------------------------------------- measures: new terms
- add_term:
    field: measure
    id: measure:lactate_glucose_yield
    label: lactate yield on glucose
    dimension: dimensionless
    definition: Lactate produced per glucose consumed by the cells over a stated interval, from medium concentrations.
    scope: A ratio of lactate production to glucose consumption; not glucose consumption or lactate production alone, and not an OCR/ECAR ratio.
- add_term:
    field: measure
    id: measure:isotopologue_fraction
    label: mass isotopologue fraction
    dimension: dimensionless
    definition: Share of a metabolite pool (qualifier metabolite) present as one mass isotopologue (qualifier isotopologue) after labelling with a stated 13C tracer (qualifier tracer).
    scope: One isotopologue's share of a labelled pool; not a substrate's computed contribution to a pool, not metabolite abundance and not labelled substrate oxidation.
    qualifiers:
      tracer: {dimension: text}
      metabolite: {dimension: text}
      isotopologue: {dimension: text}
- add_term:
    field: measure
    id: measure:tracer_contribution
    label: substrate contribution to a labelled pool
    dimension: dimensionless
    definition: Fraction of a metabolite pool (qualifier pool) derived from a stated 13C-labelled substrate (qualifier tracer), computed from isotopologue distributions.
    scope: A substrate's share of a pool's carbon; not the fraction of a single isotopologue, not metabolite abundance and not labelled substrate oxidation.
    qualifiers:
      tracer: {dimension: text}
      pool: {dimension: text}
- add_term:
    field: measure
    id: measure:ocr_ecar_ratio
    label: OCR/ECAR ratio
    dimension: dimensionless
    definition: Oxygen consumption rate divided by extracellular acidification rate, an index of oxidative over glycolytic energy production.
    scope: The ratio of the two rates; not the oxygen consumption rate or the acidification rate alone, and not lactate yield on glucose.
- add_term:
    field: measure
    id: measure:cell_concentration
    label: cell concentration
    dimension: number_per_volume
    definition: Number of cells per volume of suspension, counted after harvesting a culture.
    scope: Cells per volume of a harvested culture; not cells in a whole construct (cell number), cells per field of view, or the fraction alive (cell viability).
- add_term:
    field: measure
    id: measure:lipid_droplet_content
    label: lipid droplet content
    dimension: dimensionless
    definition: Amount of intracellular neutral lipid droplets, measured by the fluorescence of a lipid-droplet dye.
    scope: Stored neutral lipid; not fatty acid uptake, fatty acid oxidation or mitochondrial mass.
- add_term:
    field: measure
    id: measure:gene_set_distribution_shift
    label: shift of a gene set's fold-change distribution
    parent: measure:gene_set_expression
    dimension: dimensionless
    definition: Whether the distribution of expression fold changes of a stated gene set (qualifier gene_set) is shifted from that of all genes, tested by a distribution test.
    scope: A test of a set's fold-change distribution against all genes; not the heat map or profile of the set's genes read together (the parent term).
- add_term:
    field: measure
    id: measure:pca_centroid_distance
    label: distance between PCA centroids
    dimension: dimensionless
    definition: Euclidean distance between the centroids of two sample groups in a principal component analysis over stated components (qualifier components) and a stated gene set (qualifier gene_set).
    scope: Distance between groups in principal component space; not one sample's principal component score, the variance a component explains, or a correlation of expression profiles.
    qualifiers:
      components: {dimension: text}
      gene_set: {dimension: text}
- add_term:
    field: measure
    id: measure:binucleated_cell_fraction
    label: binucleated cell fraction
    dimension: dimensionless
    definition: Fraction of cells with two nuclei.
    scope: Share of cells with two nuclei; not the fraction of cells positive for a marker and not the distance between nuclei.
    synonyms:
    - {text: percentage of binucleated cells, anchor: higher (1.6-fold) percentage of binucleated cells}
- add_term:
    field: measure
    id: measure:mitochondrial_membrane_potential
    label: mitochondrial membrane potential
    dimension: dimensionless
    definition: Inner mitochondrial membrane potential, read as the fluorescence of a potential-dependent mitochondrial dye.
    scope: Potential-dependent dye signal; not mitochondrial mass, mitochondrial DNA content or mitochondrial area fraction.
    synonyms:
    - {text: mitochondrial membrane potential, anchor: Measurement of mitochondrial membrane potential}
- add_term:
    field: measure
    id: measure:cell_circularity
    label: cell circularity index
    dimension: dimensionless
    definition: Circularity of a cell's outline (4π·area/perimeter², 1 for a circle).
    scope: Roundness of the outline; not cell area, the length-to-width aspect ratio or the 0-to-1 elongation ratio.
- add_term:
    field: measure
    id: measure:calcium_transient_decay_rate
    label: calcium transient decay velocity
    dimension: rate
    definition: Rate at which the calcium-dye signal falls during the decay of the calcium transient.
    scope: Slope of the decay in signal per time; not the decay time or time constant, and not the rising slope.
- add_term:
    field: measure
    id: measure:metabolic_activity
    label: metabolic activity
    dimension: dimensionless
    definition: Cellular reducing activity measured by the reduction of a resazurin-based reagent.
    scope: Reagent reduction by living cells; not the fraction of cells alive (cell viability), oxygen consumption or cell concentration.
- set_scope:
    id: measure:calcium_transient_rise_rate
    scope: Slope of the rise in signal per time; not the rise time, the amplitude, or the slope of the decay (calcium transient decay velocity).
# ---------------------------------------------------------------- standing keys for the measures this paper adds
