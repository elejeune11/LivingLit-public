    asserts_direction: up
    rests_on: [F1E_sarcomere]
    judgement: *cells
  abs_cellcycle:
    kind: stated
    quote: T3 treatment was associated with reduced cell cycle activity, manifest as reduced DNA synthesis
    where: Abstract
    direction: BrdU incorporation down
    asserts_direction: down
    rests_on: [F2C_brdu]
    judgement: &ok {direction: follows, support: follows, comparison: follows, scope: follows, replication: follows, strength: follows,
      presence: follows}
  abs_p21:
