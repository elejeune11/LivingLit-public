  terms: [measure:calcium_transient_amplitude]
  qualifiers: {expressed_as: '% change'}
  note: Fig. 7C defines the amplitude as ΔF/F0 (per the record reader); the Fig. 7D axis prints mV, which the record marks as a suspected error.
- field: measure
