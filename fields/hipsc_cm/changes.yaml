    definition: Metal braces inserted into hollow posts to stiffen them and stop the tissue from shortening.
    scope: A mechanical intervention on the posts; not a compound or a gene transfer.
    qualifiers:
      phase:
        dimension: text
    lookup: searched 'metal brace' and 'brace' in ChEBI 257; a mechanical intervention, not a chemical
  - event: adopt_own
