  S9F_stiffness:
    unit: S9
    measure: Young's modulus
    method: EHM mounted to a force transducer with vascular clamps, stretched in 15 second intervals
    definition: The linear relationship between stress and strain is the Young's modulus
    finding: Stiffness comparable between human (66 kPa) and rat (160 kPa) EHMs; no statistical difference.
    compares:
    - human
    - rat
    values:
      E_human:
        printed: '66'
        unit: kPa
        kind: value
        group: human
        spread: not stated
      E_rat:
        printed: '160'
        unit: kPa
        kind: value
        group: rat
        spread: not stated
    stats:
      test: unpaired two-tailed Student's t test (Methods, unless otherwise specified)
      p: p < .35
      p_values:
      - p: P < 0.35
        anchor:
          quote: no statistical difference between the stiffness of the human and rat EHMs (P < 0.35)
          where: Supplemental Figure 9 legend
          file: NIHMS926341-supplement-Supplemental.docx
    suspected_error: &id019
      what: rat group described two ways
      why: Results say 'rat neonatal derived-CMs'; the Supplemental Figure 9 legend says 'human vs rat stem cell-derived EHMs'
    anchor:
      quote: There was no statistical difference between the stiffness of the human and rat EHMs (p < .35)
      where: Results, EHM Stress-Strain Relationship
  S9G_force:
    unit: S9
    measure: maximum active force
    method: EHM mounted to a force transducer with vascular clamps, stretched in 15 second intervals
    definition: the difference between systolic force and diastolic force, calculated by the average of the 10 highest active
      forces
    finding: Maximum active force comparable between human (0.5 mN) and rat (0.4 mN) EHMs.
    compares:
    - human
    - rat
    values:
      F_human:
        printed: '0.5'
        unit: mN
        kind: value
        group: human
        spread: not stated
      F_rat:
        printed: '0.4'
        unit: mN
        kind: value
        group: rat
        spread: not stated
    stats:
      test: unpaired two-tailed Student's t test (Methods, unless otherwise specified)
      p: p < .11
      p_values:
      - p: P  < 0.11
        anchor:
          quote: no statistical difference between the maximum active force of the human and rat EHMs (P  < 0.11)
          where: Supplemental Figure 9 legend
          file: NIHMS926341-supplement-Supplemental.docx
    suspected_error: *id019
    anchor:
      quote: no statistical difference between the maximum active force of the human and rat EHMs (p < .11)
