record: 2017_Shadrin
formula_library_version: 10
agent:
  model: llm
  instructions: formulas_v3
derived:
  F3b_cells.fewer_cells:
    item: F3b_cells
    formula: s = (c1 - c05)/c1
    anchor:
      quote: These tissues contained 23% fewer cells per field of view
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: relative_decrease
      vars:
        s: s
        x: c05
        x0: c1
    inputs:
      c05:
        value: F3b_cells.values.cells_mm05
        part: mean
        kind: per sample
      c1:
        value: F3b_cells.values.cells_mm1
        part: mean
        kind: per sample
    output: F3b_cells.values.cells_difference
    note: 'Two unpaired groups: the printed 23 % can only be a difference of group means.'
  F3d_thickness.thinner:
    item: F3d_thickness
    formula: s = (t1 - t05)/t1
    anchor:
      quote: were on average 29% thinner
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: relative_decrease
      vars:
        s: s
        x: t05
        x0: t1
    inputs:
      t05:
        value: F3d_thickness.values.thick_mm05
        part: mean
        kind: per sample
      t1:
        value: F3d_thickness.values.thick_mm1
        part: mean
        kind: per sample
    output: F3d_thickness.values.thick_difference
  F3e_cellnumber.relative_cells:
    item: F3e_cellnumber
    formula: r = (t05*c05)/(t1*c1)
    anchor:
      quote: The relative cell counts estimated from cardiopatch thickness multiplied by cells per field of view
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: ratio_of_products
      vars:
        r: r
        a1: t05
        a2: c05
        b1: t1
        b2: c1
    inputs:
      t05:
        value: F3d_thickness.values.thick_mm05
        part: mean
        kind: per sample
      c05:
        value: F3b_cells.values.cells_mm05
        part: mean
        kind: per sample
      t1:
        value: F3d_thickness.values.thick_mm1
        part: mean
        kind: per sample
      c1:
        value: F3b_cells.values.cells_mm1
        part: mean
        kind: per sample
    output: F3e_cellnumber.values.relative_cells
    aggregation: not stated
    note: Fig. 3e has n = 13/16 patches while thickness (n = 22/25) and cell counts come from their own patch sets; whether
      the product was formed per patch or from group means is not stated. Per-patch values are not printed or read, so only
      the of-means alternative can run.
  F3e_volume.relative_volume:
    item: F3e_volume
    formula: v = t05/t1
    anchor:
      quote: the relative cell numbers and volumes of 0.5 vs. 1MM tissues (54% of cells in 71% volume)
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: ratio_def
      vars:
        r: v
        a: t05
        b: t1
    inputs:
      t05:
        value: F3d_thickness.values.thick_mm05
        part: mean
        kind: per sample
      t1:
        value: F3d_thickness.values.thick_mm1
        part: mean
        kind: per sample
    output: F3e_volume.values.relative_volume
    alternatives:
    - label: volume = patch area x thickness, areas equal
      note: The paper does not state how volume was obtained; a thickness ratio equals the volume ratio only if both patch
        sizes have the same area (both cast in 7 x 7 mm molds).
  F3e_cellsize.size_ratio:
    item: F3e_cellsize
    formula: q = v/n
    anchor:
      quote: suggested that the cell size in 0.5MM cardiopatches was increased by ~30%
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: ratio_def
      vars:
        r: q
        a: v
        b: n
    inputs:
      v:
        value: F3e_volume.values.relative_volume
        kind: constant
      n:
        value: F3e_cellnumber.values.relative_cells
        kind: constant
    note: 'Volume per cell, 0.5MM relative to 1MM: relative volume over relative cell number (no printed output; feeds F3e_cellsize.increase).'
  F3e_cellsize.increase:
    item: F3e_cellsize
    formula: dq = q - 1
    anchor:
      quote: suggested that the cell size in 0.5MM cardiopatches was increased by ~30%
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: relative_change_from_ratio
      vars:
        d: dq
        r: q
    inputs:
      q:
        derived: F3e_cellsize.size_ratio
        kind: constant
    output: F3e_cellsize.values.cellsize_increase
  F3g_force.ratio:
    item: F3g_force
    formula: r = F05/F1
    anchor:
      quote: 0.5MM cardiopatches produced 88% of the active force of 1MM patches
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: ratio_def
      vars:
        r: r
        a: F05
        b: F1
    inputs:
      F05:
        value: F3g_force.values.force_mm05
        part: mean
        kind: per sample
      F1:
        value: F3g_force.values.force_mm1
        part: mean
        kind: per sample
    output: F3g_force.values.force_ratio
  F3g_percell.per_input_cm_mm05:
    item: F3g_percell
    group: mm05
    formula: f = F/N
    anchor:
      quote: contractile force production per input CM
      where: Results, Enhanced hiPSC-CM properties in low-density cardiopatches
    library:
      formula: ratio_def
      vars:
        r: f
        a: F
        b: N
    inputs:
      F:
        value: F3g_force.values.force_mm05
        part: mean
        kind: per sample
      N:
        printed: 0.5 × 106
        unit: cells
        kind: constant
        anchor:
          quote: was mixed with 1 × 106 (1 MM) or 0.5 × 106 (0.5 MM)
          where: Methods, Cardiopatch fabrication and culture
    output: F3g_percell.values.percell_mm05
    output_unit: nN
    alternatives:
    - label: input CMs = seeded cells x cTnT+ fraction
      formula: f = F/(N*p)
      note: The definition is by citation (ref 24). If 'input CM' counts only the cTnT+ share of the seeded cells (86.3 %,
        F1a_purity), the rebuilt values rise by 1/0.863.
    note: 'N is the number of cells seeded per patch (Methods); the paper calls the 0.5MM group ''0.5 million myocytes''.
      Per-patch forces over one constant N: of-means and mean-of-per-sample agree.'
  F3g_percell.per_input_cm_mm1:
    item: F3g_percell
    group: mm1
    formula: f = F/N
