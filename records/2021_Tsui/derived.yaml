  F5j_cv_d14.cv:
    item: F5j_cv_d14
    measure: longitudinal conduction velocity
    formula: v = d/(t2 - t1)
    anchor:
      quote: calculated by measuring the time delay in the onset of depolarization at two regions of interest that were at opposite ends of the
        tissue’s long axis
      where: Methods 2.12
    library:
      formula: conduction_velocity_def
      vars:
        v: v
        d: d
        t1: t1
        t2: t2
    inputs:
      d:
        not_stated: true
        kind: not stated
        note: the regions were 'a known distance apart'; the distance is not printed
      t1:
        not_stated: true
        kind: per sample
        note: onset of depolarization at the first region
      t2:
        not_stated: true
        kind: per sample
        note: onset of depolarization at the second region
    aggregation: not stated
