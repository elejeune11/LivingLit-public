    scope: The Duke DU11 line only; not any other own line (IMR90, ERC018, MR lines, unnamed patient or control lines, commercial
      iCell cardiomyocytes).
    lookup: Cellosaurus (pinned) searched for 'DU11' and 'Duke University clone'; no matching accession.
