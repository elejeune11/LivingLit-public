  F4E_d8_d1:
    unit: F4ae
    measure: conduction velocity
    method: calcium wave propagation imaged at 50 frames per second with Fluo-4; average tissue distance divided by average traverse time
    software: custom-made MATLAB program
    definition: average distance of the tissue in centimeters divided by the average time (in seconds) for the wave to traverse the tissue
    finding: 'Conduction velocity: 8x dyn-EHT greater than 1x dyn-EHT (P < 0.05).'
    compares:
    - d8
    - d1
    n:
      printed: n = 4 for 8× EHT, 8× dyn-EHT, and 1× dyn-EHT and n = 3 for 1× EHT
      counts: not stated
      per_group:
        d8: '4'
        d1: '4'
    stats:
      test: two-way ANOVA with post hoc Holm-Sidak test
      p: '# indicates P < 0.05 compared to both 1× dynamic and 1× constrained loading conditions'
      p_values:
      - p: P < 0.05
        anchor:
          quote: increase in the conduction velocity of 8× dyn-EHTs compared to the 1× conditions
          where: Results, p. 6
    anchor:
      quote: Conduction velocity obtained from calcium transients
      where: Fig. 4 legend (E)
    suspected_error:
      what: Fig 4E conduction velocity values in Data file S1
      why: four values in the Figure 4 sheet (5.6071, 6.8161, 7.4444, 11.062) are identical to diastolic lengths in the Fig 2B columns of the
        Figure 2 sheet
