  S6b_minor:
    unit: S6b
    measure: mitochondrial DNA (minor arc) relative to nuclear DNA
    method: mtND1/mtND4 relative to B2M by TaqMan qPCR
    definition: &id004
      citation: Phillips2014
      anchor:
        quote: using probe-based Taqman Real-Time PCR as described earlier (primer/probes sequence and concentration) (Phillips et al., 2014)
        where: STAR Methods, Mitochondrial number
    finding: Mito DNA fold change (minor arc) rises from d30 to CMM.
    groups:
    - d30
    - d30m
    - plga
    - plgam
    - pu
    - pum
    - anw
    - cmm
    n: not stated
    values:
      minor_d30:
        printed: '1'
        unit: fold change
        kind: mean
        group: d30
        spread: not stated
        expressed_as: fold
        normalised_to: d30
      minor_d30_pm:
        printed: '0.212'
        unit: fold change
        kind: value
        group: d30
        spread: not stated
      minor_d30m:
        printed: '1.21'
        unit: fold change
        kind: mean
        group: d30m
        spread: not stated
        expressed_as: fold
        normalised_to: d30
      minor_d30m_pm:
        printed: '0.2'
        unit: fold change
        kind: value
        group: d30m
        spread: not stated
      minor_plga:
        printed: '1.53'
        unit: fold change
        kind: mean
        group: plga
        spread: not stated
        expressed_as: fold
        normalised_to: d30
      minor_plga_pm:
        printed: '0.14'
        unit: fold change
        kind: value
        group: plga
        spread: not stated
      minor_plgam:
