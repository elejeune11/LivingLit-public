record: 2021_Bliley
formula_library_version: 3
agent:
  model: llm
  instructions: formulas_v3
derived:
  F1D_s8.stiffness_ratio:
    item: F1D_s8
    group: s8
    formula: k8 = k1*(t1/t8)**3
    anchor:
      quote: bending stiffness is proportional to the inverse of the thickness cubed
      where: Results, dyn-EHT platform
      file: scitranslmed.abd1817.pdf
    library:
      formula: strip_stiffness_thickness_ratio
      vars:
        k1: k1
        k2: k8
        t1: t1
        t2: t8
    inputs:
      k1:
        not_stated: true
        kind: constant
        note: bending stiffness of the 1x strip; not printed
      t1:
        printed: ~130
        unit: µm
        kind: constant
        anchor:
          quote: We selected strip thicknesses of ~130 µm (1×) or ~260 µm (8×)
          where: Results
          file: scitranslmed.abd1817.pdf
      t8:
        printed: ~260
        unit: µm
        kind: constant
        anchor:
          quote: We selected strip thicknesses of ~130 µm (1×) or ~260 µm (8×)
          where: Results
          file: scitranslmed.abd1817.pdf
    alternatives:
    - label: as the library states (stiffness proportional to thickness cubed)
      formula: k8 = k1*(t8/t1)**3
      note: gives k8/k1 = 8 for 260/130 µm, the ~8x load the paper states; the stated inverse cube gives 1/8
    note: 'Written exactly as stated; the methods repeat it: "bending resistance of the strip is proportional to the inverse
      of thickness-cubed". The thicker strip is said to carry about eightfold the load.'
  F1E.force:
    item: F1E
    formula: not stated
    anchor:
      quote: Look-up tables relating tissue length to force required to induce PDMS strip bending were created using a FEM
      where: Methods, Tissue contractility assay
      file: scitranslmed.abd1817.pdf
    no_formula: 'force from a finite element model of the strip (ANSYS look-up tables), not a closed-form formula: handed
      to BoxGraph'
    alternatives:
    - label: small-deflection cantilever (not what the paper did)
      formula: F = k*x
      note: hooke_spring with k from cantilever_tip_stiffness and rect_second_moment; the strip is loaded at the tissue attachment
        points, not at its tip
  F2G_c1_d1.stress_c1:
    item: F2G_c1_d1
    group: c1
    formula: sigma = F/A
    anchor: &id001
      quote: Twitch stress measurements were found by dividing average twitch force by average cross-sectional area of cardiomyocytes
        within the tissue
      where: Methods, Tissue contractility assay
      file: scitranslmed.abd1817.pdf
    library:
      formula: stress_def
      vars:
        sigma: sigma
        F: F
        A: A
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: average twitch force; force from strip bending through the FEM look-up tables; per-tissue forces not released
      A:
        data: S23_d8_c1/c1
        kind: per sample
        note: average cardiomyocyte cross-sectional area of the group (fig. S23); one area per tissue in the released data
          (row order assumed to match the force rows)
    aggregation: not stated
    note: '"average twitch force by average cross-sectional area of cardiomyocytes within the tissue" is a per-tissue stress;
      whether the group value is the mean of per-tissue stresses or group-mean force over group-mean area is not stated, so
      code runs both (no printed output: F6I values are released per tissue only)'
  F2G_c1_d1.twitch_c1:
    item: F2G_c1_d1
    group: c1
    formula: s_tw = s_sys - s_dia
    anchor:
      quote: The twitch stress (equivalent to the peak systolic stress minus the diastolic stress)
      where: Results
      file: scitranslmed.abd1817.pdf
    no_formula: a difference of two stresses; the library has no difference entry
    inputs:
      s_sys:
        not_stated: true
        kind: per sample
        note: peak systolic stress; not released
      s_dia:
        data: F2E_c8_c1/c1
        kind: per sample
