    unit: F2gi
    kind: vector
    groups:
      '40':
        item: F2g_velocity_ratio
        group: s40
        unit_of_value: ''
      '60':
        item: F2g_velocity_ratio
        group: s60
        unit_of_value: ''
      '80':
        item: F2g_velocity_ratio
        group: s80
        unit_of_value: ''
      '100':
        item: F2g_velocity_ratio
        group: s100
        unit_of_value: ''
    note: Vector bars (mean) with s.e.m. caps and open circles (individual tissues); y axis Vpara/Vortho, a unitless ratio.
      Legend gives n ≥ 3 only; 4, 3, 3 and 3 circles are drawn.
no_points:
  S1S2: 'first look (small model): Single semilog bar chart with error bars; no per-sample markers. (NIHMS819005-supplement-1.pdf
    p. 5)'
  S14: 'first look (small model): Panels m and n are bars with S.E.M. error bars; no per-sample markers. (NIHMS819005-supplement-1.pdf
    p. 20)'
  F4ac: 'first look (small model): Panel a is traces; b and c are bars with s.e.m. error bars only. (journal_version.pdf p. 5)'
  F4dg: Fig. 4e–g (journal_version.pdf p. 5) are vector bars (grey/blue/red, day 2/14/28) with s.e.m. whisker strokes only;
    no per-tissue markers drawn. Panel d and Supplementary Fig. S19 (supplement p. 23) are immunofluorescence micrographs.
  S16: 'first look (small model): Single continuous force trace over time; no per-sample markers. (NIHMS819005-supplement-1.pdf
    p. 21)'
  S20: 'first look (small model): Both panels are continuous voltage-style traces with no per-sample markers. (NIHMS819005-supplement-1.pdf
    p. 24)'
  S24: 'first look (small model): Single continuous normalized stress traces over time; no per-sample markers. (NIHMS819005-supplement-1.pdf
    p. 27)'
