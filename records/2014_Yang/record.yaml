    where: Abstract
    direction: p21 mRNA and protein up
    asserts_direction: up
    rests_on: [F2D_p21_mrna, F2F_p21_protein]
    judgement: {direction: follows, support: follows, comparison: follows, scope: follows, replication: cannot judge, strength: follows,
      presence: follows}
    note: n = 3 without saying what it counts
  abs_force:
    kind: stated
    quote: revealing an almost two-fold higher force per-beat after T3 treatment
    where: Abstract
    direction: twitch force up
    asserts_direction: up
    rests_on: [F3C_force]
    judgement: {direction: follows, support: follows, comparison: follows, scope: follows, replication: cannot judge, strength: overstated,
      presence: follows}
    note: the printed means (12.3 against 7.5 nN/cell) are about 1.6-fold, worded as 'almost two-fold'
  abs_kinetics:
