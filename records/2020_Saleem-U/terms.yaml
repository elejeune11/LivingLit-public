    value: {must_match: [platform@1, preparation, pacing, temperature, measure.level], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.level], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:calcium_force_time_difference
    value: {must_match: [platform@1, preparation, pacing, temperature, measure.phase], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.phase], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:force_fluorescence_loop
    value: {must_match: [platform@1, preparation, pacing, measure.aspect], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.aspect], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:force_calcium_relation
    value: {must_match: [platform@1, preparation, temperature, culture_calcium_mM, measure.varied_by], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.varied_by], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:beating_presence
    value: {must_match: [platform@1, preparation, pacing], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}

# ================================================================ re-map v3 (vocabulary v7)
# ---------------------------------------------------------------- transgene (new field)
- add_term:
    field: transgene
    id: transgene:calcium_indicator
    label: genetically encoded calcium indicator
    definition: An introduced gene for a fluorescent protein whose signal changes with intracellular calcium.
    scope: A calcium-sensing reporter (GCaMP family and similar); not a fluorescent protein whose signal does not depend on calcium.
    qualifiers:
      vector: {dimension: text}
      MOI: {dimension: text}
    synonyms:
    - text: GECIs
      anchor: genetically encoded calcium sensors (GECIs) for the characterization of EHTs
- add_term:
    field: transgene
    id: transgene:fluorescent_reporter
    label: fluorescent protein reporter
    definition: An introduced gene for a fluorescent protein whose signal does not report calcium or another cellular variable.
    scope: A constitutive fluorescent marker such as GFP; not a calcium-sensing indicator.
    qualifiers:
      vector: {dimension: text}
      MOI: {dimension: text}
- add_term:
    field: transgene
    id: transgene:gcamp5g
    label: GCaMP5G
    parent: transgene:calcium_indicator
    definition: The genetically encoded calcium indicator GCaMP5G.
    scope: GCaMP5G, with slower on and off kinetics; not GCaMP6f.
    synonyms:
    - text: GCaMP5G
      anchor: transduced with lentivirus encoding either GCaMP5G or GCaMP6f
- add_term:
    field: transgene
    id: transgene:gcamp6f
    label: GCaMP6f
    parent: transgene:calcium_indicator
    definition: The fast genetically encoded calcium indicator GCaMP6f.
    scope: GCaMP6f; not GCaMP5G, whose kinetics differ.
    synonyms:
    - text: GCaMP6f
      anchor: transduced with lentivirus encoding either GCaMP5G or GCaMP6f
- add_term:
    field: transgene
    id: transgene:gfp
    label: green fluorescent protein
    parent: transgene:fluorescent_reporter
    definition: Green fluorescent protein expressed as a non-sensing fluorescent marker.
    scope: GFP as a marker on its own; not a GFP-based calcium indicator such as GCaMP.
    synonyms:
    - text: GFP
      anchor: hiPSC-CM EHTs transduced with GFP

# ---------------------------------------------------------------- mechanical_load
- add_qualifier: {id: mechanical_load:auxotonic, name: posts, dimension: text}
- add_term:
    field: mechanical_load
    id: mechanical_load:isometric
    label: isometric load
    definition: Contraction against a load stiff enough to prevent shortening, so the tissue contracts at fixed length.
    scope: Shortening prevented (rigid or stiffened posts, fixed length); not contraction against an elastic, spring-like load (auxotonic).
    qualifiers:
      posts: {dimension: text}

