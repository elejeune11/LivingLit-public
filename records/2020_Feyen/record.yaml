evidence:
  F1B_ic50_mm_text:
    unit: F1B
    measure: TTX concentration at which beating ceased (IC50)
    finding: TTX caused asystole in MM hiPSC-CMs at an IC50 of 3.88 µM
    anchor:
      quote: TTX induced clear and consistent asystole (cessation of beating) in MM-cultured hiPSC-CMs at a half-maximal inhibitory concentration (IC50) dose (3.88 mM)
      where: Results, Physiological Phenotyping of hiPSC-CMs Cultured in MM
    groups:
    - mm
    values:
      ic50_text:
        printed: '3.88'
        unit: µM
        kind: value
        group: mm
        spread: none
        spread_source: sentence
    method: optical action potential recording with the VF2.1.Cl voltage-sensitive dye
    software: Cyteseer (Vala Sciences)
  F1B_ic50_mm_legend:
    unit: F1B
    measure: TTX concentration at which beating ceased (IC50)
    finding: The legend gives the same IC50 as approximately 3.88 µM
    anchor:
      quote: with cessation of beating occurring at IC50 ~3.88 mM
      where: Fig. 1B legend
    groups:
    - mm
    values:
      ic50_legend:
        printed: ~3.88
        unit: µM
        kind: value
        group: mm
        spread: none
        spread_source: legend
  F1B_rpmi:
    unit: F1B
    measure: beating response to TTX
    finding: RPMI/B27 hiPSC-CMs kept beating at the highest TTX concentration tested
    anchor:
      quote: RPMI/B27 hiPSC-CMs were resistant to even the highest TTX concentration (100 mM).
      where: Results, Physiological Phenotyping of hiPSC-CMs Cultured in MM
    groups:
    - rpmi
    values:
      highest_dose:
        printed: '100'
        unit: µM
        kind: value
        group: rpmi
        spread: none
        spread_source: sentence
    note: the printed number is the highest TTX concentration tested, at which the RPMI/B27 cells still beat; no IC50 could be given for this group
  F1C_spare:
    unit: F1C
    measure: spare respiration rate (OCR)
    finding: spare respiration was higher in MM than in RPMI/B27
    anchor:
      quote: 'spare: OCR, MM 172 ± 9 versus RPMI 123 ± 15 pmol/min/cell number'
      where: Results, Physiological Phenotyping of hiPSC-CMs Cultured in MM
    compares:
    - mm
    - rpmi
    values:
      spare_mm:
        printed: 172 ± 9
        unit: pmol/min/cell number
        kind: mean
        group: mm
        spread: SEM
        spread_source: methods
      spare_rpmi:
        printed: 123 ± 15
        unit: pmol/min/cell number
        kind: mean
        group: rpmi
        spread: SEM
        spread_source: methods
      spare_pct:
        printed: 30%
        unit: '%'
        kind: percent
        between:
        - mm
        - rpmi
        expressed_as: '% change'
        spread: none
        spread_source: sentence
    n:
      printed: n = 3 batches
      counts: batches
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    method: Seahorse XF96 extracellular flux analyzer, Mito Stress test; OCR normalized to the number of cells per well by Hoechst staining
    software: Seahorse Wave Software
    note: the printed 30% is stated for the spare and maximal respiration rates together
  F1C_maximal:
    unit: F1C
    measure: maximal respiration rate (OCR)
    finding: maximal respiration was higher in MM than in RPMI/B27
    anchor:
      quote: 'maximal: OCR, MM 202 ± 9 versus RPMI 147 ± 16 pmol/min/cell number'
      where: Results, Physiological Phenotyping of hiPSC-CMs Cultured in MM
    compares:
    - mm
    - rpmi
    values:
      max_mm:
        printed: 202 ± 9
        unit: pmol/min/cell number
        kind: mean
        group: mm
        spread: SEM
        spread_source: methods
      max_rpmi:
        printed: 147 ± 16
        unit: pmol/min/cell number
        kind: mean
        group: rpmi
        spread: SEM
        spread_source: methods
    n:
      printed: n = 3 batches
      counts: batches
    stats:
      test: not stated
      statistic: not stated
      p: not stated
    method: Seahorse XF96 extracellular flux analyzer, Mito Stress test
    software: Seahorse Wave Software
  F1D_ecar:
    unit: F1D
    measure: extracellular acidification rate (ECAR)
    finding: ECAR was higher in MM than in RPMI/B27
    anchor:
      quote: MM enhanced ECAR by 40% (ECAR, MM 12.3 ± 2.3 versus RPMI 6.3 ± 1.2 mpH/min/cell number)
      where: Results, Physiological Phenotyping of hiPSC-CMs Cultured in MM
    compares:
    - mm
    - rpmi
    values:
      ecar_mm:
        printed: 12.3 ± 2.3
        unit: mpH/min/cell number
        kind: mean
        group: mm
        spread: SEM
