  F6c_modulus.change:
    item: F6c_modulus
    measure: change in elastic modulus relative to control
    formula: d = (E - E0)/E0
    anchor:
      quote: Change in elastic modulus relative to the control at D10
      where: Fig. 6c legend
    library:
      formula: relative_change
      vars:
        d: d
        x: E
        x0: E0
    inputs:
      E:
        derived: F4i_modulus.modulus
        kind: per sample
        note: modulus of each infarct or infarct + JQ1 organoid, by the same aspiration relationship
      E0:
        not_stated: true
        kind: not stated
        note: control modulus (group mean or per organoid not stated)
    alternatives:
    - label: ratio to control
      formula: d = E/E0
      note: '''change ... relative to the control'' may be a ratio rather than a relative difference'
  F5f_int_vs_edge.dff0:
    item: F5f_int_vs_edge
    measure: calcium transient amplitude (∆F/F0)
    formula: d = (F - F0)/F0
    anchor: &id002
      quote: Calcium transient amplitude (∆F/F0) was calculated as the difference between peak and baseline calcium fluorescence
        (∆F) divided by the baseline fluorescence level (F0)
      where: Methods, Development of the customized 2PLSM
    library:
      formula: relative_change
      vars:
        d: d
        x: F
        x0: F0
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: peak fluorescence of each ROI, not printed
      F0:
        not_stated: true
        kind: per sample
        note: baseline fluorescence of each ROI, not printed
