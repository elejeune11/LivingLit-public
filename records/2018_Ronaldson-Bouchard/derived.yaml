  ED2f_cv.cv_e_int:
    item: ED2f_cv
    group: e_int
    formula: v = d/(t2 - t1)
    anchor:
      quote: dividing the distance between the centres of these regions by the difference between their peak maxima
      where: Methods, Conduction velocity
    library:
      formula: conduction_velocity_def
      vars:
        v: v
        d: d
        t1: t1
        t2: t2
    inputs:
      d:
        not_stated: true
        kind: per sample
        note: distance between the two region centres; not printed
      t1:
        not_stated: true
        kind: per sample
        note: time of peak maximum in region 1
      t2:
        not_stated: true
        kind: per sample
        note: time of peak maximum in region 2
    output: ED2f_cv.values.e_int
    aggregation: mean of per-sample
    note: 'the printed value is mean ± s.e.m. over n = 4–5 tissues, i.e. a mean of per-tissue velocities; per-tissue d, t1, t2
      are not printed, so code cannot rebuild it'
  ED4d_freq.frequency:
    item: ED4d_freq
    formula: f = 1/T
    anchor: &id002
      quote: Beat frequencies were determined by inverting beat periods
