proposals:
- formula: normalized_absolute_difference
  kind: derived
  statement: The absolute difference of two like quantities divided by their sum, |a - b|/(a + b), is a ratio of the absolute
    difference to the sum.
  equations:
  - r = Abs(a - b)/(a + b)
  variables:
    r: dimensionless
    a: D
    b: D
    dn: D
    sm: D
  assumes:
  - dn = Abs(a - b)
  - sm = a + b
  uses:
  - formula: ratio_def
    subs:
      r: r
      a: dn
      b: sm
  does_not_apply: a signed normalized difference (a - b)/(a + b), or a difference over the mean (a + b)/2
  tests:
  - given:
      a: 3.0
      b: 1.0
    expect:
      r: 0.5
  - given:
      a: 1.0
      b: 3.0
    expect:
      r: 0.5
  - given:
      a: 1.0
      b: 3.0
    does_not_apply: the signed form gives -0.5
- formula: ratio_to_square
  kind: derived
  statement: A quantity divided by the square of another, a/h^2 (e.g. body mass index), is a ratio whose denominator is a
    square.
  equations:
  - r = a/h**2
  variables:
    r: D/D2**2
    a: D
    h: D2
    b: D2**2
  assumes:
  - b = h**2
  uses:
  - formula: ratio_def
    subs:
      r: r
      a: a
      b: b
  does_not_apply: a ratio to the first power of h, or a mean of per-sample ratios compared with the mean of a over the squared
    mean of h
  tests:
  - given:
      a: 81.0
      h: 1.8
    expect:
      r: 25.0
  - given:
      a: 81.0
      h: 1.8
    does_not_apply: a/h gives 45
