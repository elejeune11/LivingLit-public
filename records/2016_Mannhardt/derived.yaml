  F6B_ATX_T2.max_effect:
    item: F6B_ATX_T2
    formula: r = a/b
    anchor:
      quote: ATX-II had the most pronounced effect (556% ± 31% of baseline
      where: Results, Modulators of the Cardiac Ion Channels
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        reading: F6B_ATX_scatter/F6B_ATX_T2|c1e7
        kind: per sample
      b:
        reading: F6B_ATX_scatter/F6B_ATX_T2|bl
        kind: constant
    output: F6B_ATX_T2.values.max_effect
    aggregation: of means
    alternatives:
    - label: effect at 30 nM (c3e8) instead of 100 nM
      note: the text does not name the concentration; 100 nM (c1e7) is the largest effect plotted
    note: 'Fig. 6B values are already % of the baseline mean, so each sample is divided by one constant (the baseline mean): mean of per-sample
      equals the ratio of means (ratio_of_means_constant_denominator)'
  F5A_force.relative:
