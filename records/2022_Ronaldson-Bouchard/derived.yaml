    output: F7m_consistent.values.mix1_pct_figure
    note: the Mixed 1-tissue line of the summary box is not in the extracted text; the denominator 7 is anchored on the line above
  # ---------------------------------------------------------------- normalised values with unstated inputs
  F7f_trap.percent_of_control:
    item: F7f_trap
    measure: TRAP activity (% of control)
    formula: T = x/x0
    anchor:
      quote: TRAP activity (% of control)
      where: Fig. 7f axis
    library: {formula: ratio_def, vars: {r: T, a: x, b: x0}}
    inputs:
      x: {not_stated: true, kind: per sample, note: 'TRAP activity of a doxorubicin-exposed bone tissue; not released'}
      x0: {not_stated: true, kind: not stated, note: 'control: which control (the matching untreated configuration, its mean or a paired chip) is not stated'}
    alternatives:
    - {label: control is the mean of the untreated group of the same configuration, formula: T = x/mean(x0)}
    - {label: control is a paired untreated chip, formula: T = x/x0}
  F4f_trap.per_volume:
    item: F4f_trap
    measure: TRAP activity
    formula: T = Abs/V
    anchor:
      quote: Absorbance normalized to chamber volume
      where: Fig. 4f axis
    library: {formula: ratio_def, vars: {r: T, a: Abs, b: V}}
    inputs:
      Abs: {not_stated: true, kind: per sample, note: 'TRAP assay absorbance; not released'}
      V: {not_stated: true, kind: not stated, note: "chamber volume; not printed (Supplementary Table 3 lists model compartment volumes, not this assay's)"}
  F3m_mono.density:
    item: F3m_mono
    measure: monocytes per mm2 tissue
    formula: rho = N/A
    anchor:
      quote: Cells per mm2 tissue (no.)
      where: Fig. 3m axis
    library: {formula: ratio_def, vars: {r: rho, a: N, b: A}}
    inputs:
      N: {not_stated: true, kind: per sample, note: 'labelled monocytes counted in the confocal field'}
      A: {not_stated: true, kind: not stated, note: 'imaged tissue area; not printed'}
  F5e_go.fold_enrichment:
    item: F5e_go
    measure: fold enrichment of cardiac GO cellular components
    formula: FE = obs/expd
    anchor:
      quote: Fold enrichment
      where: Fig. 5e axis
    library: {formula: ratio_def, vars: {r: FE, a: obs, b: expd}}
    inputs:
      obs: {not_stated: true, kind: per sample, note: 'proteins of the list in the GO term; computed by PANTHER'}
      expd: {not_stated: true, kind: per sample, note: 'proteins expected from the reference list; computed by PANTHER'}
  # ---------------------------------------------------------------- proteome overlap with adult tissue (Fig. 5b)
  F5b_heart_overlap.shared: &overlap
    item: F5b_heart_overlap
    measure: overlap of expressed proteins with adult tissue
    formula: p = s/N
    anchor:
      quote: as a percentage of shared proteins (expressed in both tissues) within the total number of proteins
      where: Methods, Proteomics analysis
    library: {formula: ratio_def, vars: {r: p, a: s, b: N}}
    inputs:
      s: {not_stated: true, kind: constant, note: 'proteins expressed in both the engineered and the adult dataset; not printed'}
      N: {not_stated: true, kind: not stated, note: '"total number of proteins": of the engineered set, the adult set or their union is not stated'}
    output: F5b_heart_overlap.values.overlap_figure
    alternatives:
    - {label: total = engineered tissue proteins, formula: p = s/Ne}
    - {label: total = adult tissue proteins, formula: p = s/Na}
    - {label: total = union of the two sets, formula: p = s/(Ne + Na - s)}
  F5b_liver_overlap.shared:
    <<: *overlap
    item: F5b_liver_overlap
    output: F5b_liver_overlap.values.overlap_figure
  F5b_bone_overlap.shared:
    <<: *overlap
    item: F5b_bone_overlap
    output: F5b_bone_overlap.values.overlap_figure
  F5b_skin_overlap.shared:
    <<: *overlap
    item: F5b_skin_overlap
    output: F5b_skin_overlap.values.overlap_figure
  F5b_heart_correlation.matching: &matching
    item: F5b_heart_correlation
    measure: correlation of expression level with adult tissue
    formula: p = m/s
    anchor:
      quote: were calculated as a percentage over the total number of shared proteins expressed overall
      where: Methods, Proteomics analysis
    library: {formula: ratio_def, vars: {r: p, a: m, b: s}}
    inputs:
      m: {not_stated: true, kind: constant, note: 'shared proteins in the same tertile (Low, Medium or High) in both datasets'}
      s: {not_stated: true, kind: constant, note: 'shared proteins'}
    note: one formula for the three conditions; the outputs per condition (mo, mix, iso) are printed in the figure, the counts are not
  F5b_liver_correlation.matching:
    <<: *matching
    item: F5b_liver_correlation
  F5b_bone_correlation.matching:
    <<: *matching
    item: F5b_bone_correlation
  F5b_skin_correlation.matching:
    <<: *matching
    item: F5b_skin_correlation
  # ---------------------------------------------------------------- headline miR-1 fold changes
  F7i_mir1.fold_change: &fc
    item: F7i_mir1
    measure: miR-1 expression
    formula: FC = xa/xb
    anchor:
      quote: Multi-organ vs Mixed FC = 38.84, P = 0.0015, Fig. 7i
      where: Results, Identification of miRNA biomarkers of doxorubicin cardiotoxicity
    library: {formula: ratio_def, vars: {r: FC, a: xa, b: xb}}
    inputs:
      xa: {not_stated: true, kind: per sample, note: 'miR-1 signal, Multi-organ; array values not released'}
      xb: {not_stated: true, kind: per sample, note: 'miR-1 signal, Mixed'}
    output: F7i_mir1.values.fc_text
    aggregation: not stated
    alternatives:
    - {label: 'from mean log2 signals (array software convention; not stated)', formula: FC = 2**(la - lb)}
  F7j_mir1.fold_change:
    <<: *fc
    item: F7j_mir1
    anchor:
      quote: Multi-organ vs Mixed FC = 18.84, P = 0.0245, Fig. 7j
      where: Results, Identification of miRNA biomarkers of doxorubicin cardiotoxicity
    output: F7j_mir1.values.fc_text
  F7k_mir1.fold_change:
    <<: *fc
    item: F7k_mir1
    anchor:
      quote: Mixed perfusate FC = 4.69, P = 0.0048, Fig. 7k
      where: Results, Identification of miRNA biomarkers of doxorubicin cardiotoxicity
    output: F7k_mir1.values.fc_text
  # ---------------------------------------------------------------- no library formula
  ED3c_force.stress:
    item: ED3c_force
    measure: force
    formula: not stated
    anchor:
      quote: Cardiac excitability, force and beat rate were obtained using our previously established protocols
      where: Methods, Heart function assays
    no_formula: 'stated only by citation (ref38); the axis unit mN/mm2 implies force per area, but the area and the force-from-image method are not stated here'
    inputs:
      F:
        by_reference: {citation: ref38, anchor: {quote: 'Cardiac excitability, force and beat rate were obtained using our previously established protocols', where: 'Methods, Heart function assays'}}
  F3f_cd63.radiant_efficiency:
