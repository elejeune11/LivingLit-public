  F2e_cv.cv_mb:
    item: F2e_cv
    group: mb
    formula: cv = s/m
    anchor: &id002
      quote: coefficient of variation 0.21 vs. 1.58
      where: Results, p. 5
    library:
      formula: cv_def
      vars:
        cv: cv
        sd: s
        m: m
    inputs:
      s:
        value: F2e_fs.values.fs_mb
        part: spread
        kind: constant
      m:
        value: F2e_fs.values.fs_mb
        part: mean
        kind: constant
    output: F2e_cv.values.cv_mb
    note: the ± of the Fig. 2e text values is not named; read here as the SD the CV is built from
