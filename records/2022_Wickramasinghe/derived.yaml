derived:
  F4B_cd36_gw.fold_change:
    item: F4B_cd36_gw
    formula: r = a/b
    anchor:
      quote: PPARd induction increased CD36 expression by 13.36-fold
      where: Results
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        reading: F4B/F4B_cd36_gw/gw
        kind: per sample
        note: '% SIRPA+CD90-CD36+ cells, GW0742 (Fig. 4B)'
      b:
        reading: F4B/F4B_cd36_gw/control
        kind: per sample
        note: '% SIRPA+CD90-CD36+ cells, control (Fig. 4B)'
    output: F4B_cd36_gw.values.fold_text
    aggregation: not stated
    alternatives:
    - label: fold of CD36 transcript (RNA-seq, Fig. 3B) rather than of % CD36+ cells
      note: the sentence opens 'Consistent with the increased CD36 gene expression' and follows Figs. 4A-4B; the record reader placed
        it on Fig. 4B
    note: fold change of the % CD36+ cells, GW0742 over control
  F6G_time.fold_change:
    item: F6G_time
    formula: r = a/b
    anchor:
      quote: with an average 1.48-fold increase across all EHTs
      where: Results
    library:
      formula: ratio_def
      vars:
        r: r
        a: a
        b: b
    inputs:
      a:
        not_stated: true
        kind: per sample
        note: developed force at week 4, all EHTs of all conditions (Fig. 6G; not read)
      b:
        not_stated: true
        kind: per sample
        note: developed force at week 0, same EHTs (Fig. 6G; not read)
    output: F6G_time.values.fold_text
    aggregation: not stated
    note: '''average ... across all EHTs'': mean of per-EHT folds or fold of pooled means is not stated'
  S5D_spare.spare_control:
    item: S5D_spare
    group: control
    formula: spare = maxr - basal
    anchor:
      quote: mitochondrial spare capacity
      where: Results
    library:
      formula: difference_from_reference
      vars:
        d: spare
        x: maxr
        x0: basal
    inputs:
      maxr:
        reading: F5H/F5H_maxresp/control
        kind: per sample
        note: maximal respiration, Fig. 5H (axis pmol/min/cell number)
      basal:
        reading: S5D_basal/S5D_basal/control
        kind: per sample
        note: basal respiration, Fig. S5D left (axis pmol/min)
    output_unit: pmol/min
    note: '''spare capacity'' names the Mito Stress Test operation (maximal minus basal OCR, Seahorse Wave); no printed value: the rebuilt
      value sits beside the Fig. S5D right reading S5D_spare/control'
