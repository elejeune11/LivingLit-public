# ---------------------------------------------------------------- flags
- field: measure
  stated: spontaneous action potentials, calcium transients, beating frequency and amplitude
  flag: {kind: several measures, note: "a no-difference summary over action potentials, calcium transients, beat frequency and amplitude; each is its own measure"}
- field: measure
  stated: expression of maturation, excitation, contractility and metabolism markers
  flag: {kind: several measures, note: "a summary over seven genes (MYL2, MYH7, MYOM2, GJA1, RYR2, COX6A2, CKMT), each recorded as its own item"}
- field: measure
  stated: cells captured, mean reads per cell and median genes per cell
  flag: {kind: several measures, note: "three sequencing quality counts in one item"}
- field: measure
  stated: normalized gene expression of NANOG, MESP1, ISL1, MEF2C, TBX5 and GATA4
  flag: {kind: several measures, note: "six genes in one item; gene expression is keyed per gene"}
- field: measure
  stated: fold increase kinase expression
  flag: {kind: several measures, note: "43 kinases of the phospho-kinase array in one item; protein level is one protein per value"}
