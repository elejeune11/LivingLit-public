  S4_asma.fibrillar_fraction:
    item: S4_asma
    measure: normalized fibrillar αSMA+ covered area
    formula: f = Af/Aa
    anchor:
      quote: calculated by dividing the area covered by positively-stained fibrillar structures (as opposed to blotchy or
        diffuse staining) by the total area that was positively stained for αSMA
      where: Methods, Fluorescence imaging and analysis
    library:
      formula: ratio_def
      vars:
        r: f
        a: Af
        b: Aa
    inputs:
      Af:
        not_stated: true
        kind: per sample
        note: fibrillar αSMA+ area, not printed
      Aa:
        not_stated: true
        kind: per sample
        note: total αSMA+ area, not printed
  S4_asma.per_section_area:
    item: S4_asma
    measure: normalized fibrillar αSMA+ covered area
    formula: q = f/Ao
    anchor:
      quote: and then dividing by the total organoid cross-sectional area
      where: Methods, Fluorescence imaging and analysis
    library:
      formula: ratio_def
      vars:
        r: q
        a: f
        b: Ao
    inputs:
      f:
        derived: S4_asma.fibrillar_fraction
        kind: per sample
      Ao:
        not_stated: true
        kind: per sample
        note: organoid cross-sectional area of each section, not printed
    note: dividing a fraction by an area gives a quantity per area; the final normalisation to the control makes it dimensionless
  S4_asma.normalized:
    item: S4_asma
    measure: normalized fibrillar αSMA+ covered area
    formula: y = q/q0
    anchor:
      quote: These results were then normalized to the average of the control organoid results
      where: Methods, Fluorescence imaging and analysis
    library:
      formula: ratio_def
      vars:
        r: y
        a: q
        b: q0
    inputs:
      q:
        derived: S4_asma.per_section_area
        kind: per sample
      q0:
        not_stated: true
        kind: constant
        note: mean of the control organoids' values, not printed
  F6d_sync.proportion:
    item: F6d_sync
    measure: percentage of organoids with synchronized beating
    formula: f = ns/(ns + nu)
    anchor:
      quote: The proportion of organoids (control, infarct and infarct with anti-fibrotic treatment (JQ1, 10 nM)) that exhibited
        synchronized or unsynchronized
      where: Fig. 6d legend
    library:
      formula: part_of_whole
      vars:
        f: f
        a: ns
        b: nu
    inputs:
