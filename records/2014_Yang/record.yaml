  abs_mtdna:
    kind: stated
    quote: although mitochondrial genomes were not numerically increased
    where: Abstract
    direction: no change in mtDNA/nDNA ratio
    asserts_direction: none
    rests_on: [TXT5_mtdna]
    judgement: {direction: follows, support: cannot judge, comparison: follows, scope: follows, replication: cannot judge, strength: follows,
