no_points:
  F1ab: 'first look (small model): Bars with mean ± SD error bars only; micrographs have no plotted points (SCI2020-9363809.pdf
    p. 5)'
  F1cd: 'first look (small model): Bar graphs (b, d, f) show mean ± SD only; other panels are micrographs. (SCI2020-9363809.pdf
    p. 5)'
  F1ef: 'first look (small model): Bar graphs b, d, f show mean ± SD only; no per-sample markers. (SCI2020-9363809.pdf p. 5)'
  S1A: 'first look (small model): Bars with mean±SD error bars only; panel B is a micrograph (9363809.f1.pdf p. 2)'
  S3: 'first look (small model): Markers are group means ± SEM/SD with regression lines, not per-sample points. (9363809.f1.pdf
    p. 4)'
  F4ab: 'first look (small model): Bars show mean ± SEM with no per-sample markers; other panels are traces or maps. (SCI2020-9363809.pdf
    p. 8)'
  F5: 'first look (small model): Bars, trace, and scatter of group means with SEM bars; no per-sample markers. (SCI2020-9363809.pdf
    p. 10)'
  F5d: 'first look (small model): Panel e markers are mean ± SEM; bar panels show no points (SCI2020-9363809.pdf p. 10)'
  F6e: 'first look (small model): Bars, means ± SEM, heatmaps; scatter points are per-experiment means (SCI2020-9363809.pdf p. 11)'
  S2: 'first look (small model): Bars with SEM error bars, stacked count bars, and micrographs; no per-sample markers (9363809.f1.pdf
    p. 3)'
  F7d: Bars of mean ± SEM per group and frequency, with tissue n printed on each bar (n = 1 for several 4.5 and 5 Hz bars);
    no individual markers. No supplementary table gives alternans amplitude. (SCI2020-9363809.pdf p. 12)
  F7f: 'Bars of mean with upper error bars (12 bars: Control, p4 hCF, p9 hCF at 2.5-4 Hz) with tissue n printed on each bar;
