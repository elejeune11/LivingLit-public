  F3D_maxt_text.pct:
    item: F3D_maxt_text
    formula: d = (x - x0)/x0
    anchor:
      quote: CUSO-2 MPAT hiPSC-CMs demonstrated a nearly 150% increase in maximum tension generation
      where: Results, MPAT Improves Myofibril Force Generation
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        value: F3D_maxt.values.MPAT_table
        part: mean
        kind: not stated
      x0:
        value: F3D_maxt.values.GLUC_table
        part: mean
        kind: not stated
    output: F3D_maxt_text.values.pct_text
    note: CUSO-2 MPAT against GLUC maximum tension (Table S1 group means)
  F3E_maxt_text.pct:
