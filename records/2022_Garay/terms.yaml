record: 2022_Garay
vocabulary_version: 53
agent: {model: llm, instructions: terms_v4}
edits:
# ---------------------------------------------------------------- cell lines
- adopt:
    field: cell_line
    id: CVCL_UK03
    label: WTC-mEGFP-MYL2-cl27
    lookup: "Cellosaurus searched 'MYL2-mEGFP', 'MYL2' and 'AICS-0060': the only MYL2-mEGFP line is the Allen Institute's WTC-mEGFP-MYL2-cl27, described in Roberts et al. 2019, which the paper cites for this line."
    synonyms:
    - {text: MYL2-mEGFP, anchor: "Three hiPSC lines, PLZ (Darabi et al., 2012), MYL2-mEGFP (Roberts et al., 2019), and 19004, were utilized in this study"}
- adopt_own:
    field: cell_line
    id: cell_line:plz
    label: PLZ
    definition: The PLZ hiPSC line of Darabi et al. 2012 (Perlingeiro lab, University of Minnesota).
    scope: Use only for the line named PLZ; every other own cell line term is a different, separately named or unnamed line.
    lookup: "Cellosaurus searched 'PLZ' and 'PLZ iPSC': no hiPSC line of that name (nearest hit 293GP/LZRNL is unrelated)."
- adopt_own:
    field: cell_line
    id: cell_line:line_19004
    label: '19004'
    definition: The 19004 hiPSC line reprogrammed from skin-biopsy fibroblasts with the CytoTune 2.0 Sendai kit at the University of Minnesota (Garay et al. 2022).
    scope: Use only for the line named 19004 in Garay et al. 2022; not the Coriell line GM19004, and not any other own cell line term.
    lookup: "Cellosaurus searched '19004': only GM19004, a Coriell lymphoblastoid line, unrelated; the paper describes 19004 as newly generated."
# ---------------------------------------------------------------- treatments
- adopt:
    field: treatment
    id: CHEBI:90705
    label: SB 203580
    lookup: "ChEBI searched 'SB203580' and 'SB 203580': exact label match."
- adopt:
    field: treatment
    id: CHEBI:88249
    label: PD 0325901
    lookup: "ChEBI searched 'PD0325901' and 'PD 0325901': exact label match."
# ---------------------------------------------------------------- platform
- add_term:
    field: platform
    id: platform:microelectrode_array
    label: microelectrode array culture
    parent: platform:culture_2d
    definition: Cells grown as a layer on a plate with embedded electrodes that record extracellular field potentials.
    scope: Use when cells are cultured on a microelectrode array (MEA); not plain monolayers in plates or on coverslips, micropatterned cultures, microposts, inserts or thin films.
    synonyms:
    - {text: microelectrode arrays, anchor: "Day-25/-55 hiPSC-CMs were plated onto GFR-matrigel-coated microelectrode arrays (MEAs)"}
# ---------------------------------------------------------------- measurement medium
- add_synonym:
    id: measurement_medium:tyrode_solution
    text: Tyrode’s salt solution
    anchor: "Medium was then replaced with Tyrode’s salt solution and incubated for an additional 30 minutes at 37°C"
- add_synonym:
    id: measurement_medium:extracellular_solution
    text: bath solution
    anchor: "The bath solution will consist of (in mM): NaCl 150, KCl 5.4"
# ---------------------------------------------------------------- measures: synonyms
- add_synonym:
    id: measure:shared_de_gene_count
    text: DEGs in common
    anchor: evidence.F1_deg_shared.anchor
- add_synonym:
    id: measure:cell_area
    text: cell surface area
    anchor: evidence.F3C_area_SP30_vs_D30.anchor
- add_synonym:
    id: measure:extracellular_acidification_rate
    text: basal ECAR
    anchor: "(L) basal ECAR."
- add_synonym:
    id: measure:calcium_transient_rise_rate
    text: Ca2+ transient upstroke velocity
    anchor: evidence.F6F_amp_SP40_vs_D40.anchor
- add_synonym:
    id: measure:calcium_transient_decay_rate
    text: Ca2+ transient downstroke velocity
    anchor: evidence.F6F_amp_SP40_vs_D40.anchor
- add_qualifier:
    id: measure:gene_expression
    name: isoform
    dimension: text
# ---------------------------------------------------------------- measures: new terms
- add_term:
    field: measure
    id: measure:differential_histone_mark_locus_count
    label: number of loci with differential histone mark deposition
    definition: Count of genomic loci whose ChIP-seq signal for a stated histone mark (qualifier mark) differs between compared conditions at a stated threshold.
    scope: A count of chromatin loci from ChIP-seq (direction as qualifier regulation); not a count of differentially expressed genes and not the signal at one locus.
    dimension: dimensionless
    qualifiers:
      mark: {dimension: text}
      regulation: {dimension: text}
- add_term:
    field: measure
    id: measure:histone_mark_signal
    label: histone mark signal at a locus
    definition: ChIP-seq signal of a stated histone mark (qualifier mark) at a stated genomic locus (qualifier locus).
    scope: The mark's signal at one locus; not a count of loci with differential deposition and not mRNA expression of the gene.
    dimension: dimensionless
    qualifiers:
      mark: {dimension: text}
      locus: {dimension: text}
- add_term:
    field: measure
    id: measure:gene_set_overlap_count
    label: number of genes shared between two gene sets
    definition: Count of genes found in both of two stated gene sets (qualifier sets) from different analyses or assays.
    scope: The overlap of gene sets from different assays (such as RNA-seq differentially expressed genes and ChIP-seq loci); the overlap of differentially expressed genes between two expression comparisons is shared differentially expressed genes.
    dimension: dimensionless
    qualifiers:
      sets: {dimension: text}
- add_term:
    field: measure
    id: measure:t_tubule_density
    label: T-tubule density
    parent: measure:t_tubules
    definition: Membrane area of transverse tubules per cell volume, from a membrane stain imaged in 3D.
    scope: A quantitative density of T-tubules; the parent covers presence or organisation judged from images.
    dimension: area_per_volume
    synonyms:
    - {text: T-tubule density, anchor: "(H and I) Quantification of T-tubule density (H) and (I) CM volume."}
- add_term:
    field: measure
    id: measure:mitochondrial_cross_sectional_area
    label: mitochondrial cross-sectional area
    definition: Area of single mitochondria in electron micrograph sections.
    scope: Size of individual mitochondria as an area; not the share of image area covered by mitochondria (mitochondrial area fraction), not mitochondrial mass from a dye and not cell area.
    dimension: area
    synonyms:
    - {text: mitochondrial cross-sectional area, anchor: "(P) Quantification of mitochondrial cross-sectional area."}
- add_term:
    field: measure
    id: measure:steady_state_inactivation
    label: steady-state inactivation
    definition: Voltage dependence of steady-state inactivation of a stated ionic current (qualifier current), summarised by a Boltzmann fit's half-inactivation voltage and slope factor (qualifier parameter).
    scope: Gating of a channel current against voltage; not the current's density and not membrane or action potential voltages.
    dimension: voltage
    qualifiers:
      current: {dimension: text}
      parameter: {dimension: text}
- add_term:
    field: measure
    id: measure:field_potential_duration
    label: field potential duration
    definition: Duration of the extracellular field potential recorded by an electrode, from depolarisation spike to repolarisation wave.
    scope: Extracellular repolarisation time on electrodes (a correction such as rate correction is qualifier correction); not the action potential duration of a single cell recorded intracellularly or optically.
    dimension: time
    qualifiers:
      correction: {dimension: text}
    synonyms:
    - {text: FPD, anchor: "monolayer hiPSC-CMs along with the field potential duration (FPD)"}
# ---------------------------------------------------------------- standing keys for the new measures
- standing_key:
    measure: measure:differential_histone_mark_locus_count
    value: {must_match: [platform@1, preparation, contrast, method, measure.mark, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.mark], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:histone_mark_signal
    value: {must_match: [platform@1, preparation, measure.mark, measure.locus, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.mark, measure.locus], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:gene_set_overlap_count
    value: {must_match: [platform@1, preparation, contrast, method, measure.sets, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.sets], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:t_tubule_density
    value: {must_match: [platform@1, preparation, pacing, temperature, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:mitochondrial_cross_sectional_area
    value: {must_match: [platform@1, preparation, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:steady_state_inactivation
    value: {must_match: [platform@1, preparation, temperature, measure.current, measure.parameter, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, measure.current, measure.parameter], may_vary: [cell_line, day_of_measurement]}
- standing_key:
    measure: measure:field_potential_duration
    value: {must_match: [platform@1, preparation, pacing, temperature, measure.correction, treatment, genotype, disease_model], may_vary: [cell_line]}
    direction: {must_match: [contrast, pacing], may_vary: [cell_line, day_of_measurement]}
