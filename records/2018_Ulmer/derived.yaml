        a: a
        b: b
    inputs:
      a:
        reading: F6BC/C 2D
        kind: per sample
      b:
        reading: F6BC/C 3D
        kind: per sample
    output: f6c_lactate.values.fold_high
    note: The range '2- to 3-fold' is printed once for both measures; judged against its upper end, the end nearest the rebuilt ratio.
  f6_fa_3d.pct_increase:
    item: f6_fa_3d
    measure: 14C-CO2 (metabolic flux)
    formula: d = (x - x0)/x0
    anchor:
      quote: from oxidation of glucose (+230%), lactate (+388%), or fatty acid (+214%)
      where: Results
      file: main.pdf
    library:
      formula: relative_change
      vars:
        d: d
        x: x
        x0: x0
    inputs:
      x:
        reading: F6DF/D 3D
        kind: per sample
      x0:
        reading: F6DF/D 2D
        kind: per sample
    output: f6_fa_3d.values.pct_text
    alternatives:
    - label: 3D as percent of 2D
      formula: d = x/x0
      note: ratio_def; the record reader and figures reader suspect this reading of the '+' values
    note: A '+' percentage is a relative increase over 2D, as printed.
