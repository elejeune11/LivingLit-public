evidence:
  F1_deg_adult_fetal:
    unit: F1
    measure: differentially expressed genes
    finding: 10,597 DEGs between adult and fetal hearts
    method: EdgeR (negative binomial); minimum 2x absolute fold change and FDR corrected p < 0.05
    software: CLCGWB (Qiagen)
    compares:
    - adult
    - fetal
    n: not stated
    values:
      degs_text:
        printed: 10,597
        unit: genes
        kind: count
        between:
        - adult
        - fetal
        spread: none
    stats:
      test: EdgeR (negative binomial)
      p: not stated
    anchor:
      quote: Pairwise comparisons identified 10,597 and 11,571 differentially expressed genes (DEGs) between adult versus fetal, and adult versus in vitro,
        respectively
      where: Results, Signaling pathways downregulated in the adult heart
  F1_deg_adult_invitro:
    unit: F1
    measure: differentially expressed genes
    finding: 11,571 DEGs between adult hearts and in vitro CMs
    method: EdgeR (negative binomial); minimum 2x absolute fold change and FDR corrected p < 0.05
    software: CLCGWB (Qiagen)
    compares:
    - adult
    - invitro
    n: not stated
    values:
      degs_text:
        printed: 11,571
        unit: genes
        kind: count
        between:
        - adult
        - invitro
        spread: none
    stats:
      test: EdgeR (negative binomial)
      p: not stated
    anchor:
      quote: Pairwise comparisons identified 10,597 and 11,571 differentially expressed genes (DEGs) between adult versus fetal, and adult versus in vitro,
        respectively
      where: Results, Signaling pathways downregulated in the adult heart
  F1_deg_shared:
    unit: F1
    measure: differentially expressed genes in common
    finding: 7,736 DEGs shared by the two pairwise comparisons
    groups:
    - adult
    - fetal
    - invitro
    n: not stated
    values:
      degs_text:
        printed: 7,736
        unit: genes
        kind: count
        over:
        - adult
        - fetal
        - invitro
        spread: none
    stats:
      test: not stated
      p: not stated
    anchor:
      quote: with 7,736 DEGs in common (Figure 1C)
      where: Results, Signaling pathways downregulated in the adult heart
  F1_h3k27ac_loci:
    unit: F1
    measure: loci with reduced H3K27ac
    finding: 3,998 loci with reduced H3K27ac in adult vs prenatal samples
    method: DEseq2 on ENCODE ChIP-seq pipeline coverage; log2FoldChange>2, q<0.05 and baseMean>400
    software: DEseq2 (R)
    compares:
    - adult
    - fetal
    n: not stated
    values:
      loci_text:
        printed: 3,998
        unit: loci
        kind: count
        between:
        - adult
        - fetal
        spread: none
    stats:
      test: DEseq2
      p: not stated
    anchor:
      quote: We found 3,998 loci with significantly reduced H3K27ac sites in the adult compared with the prenatal samples
      where: Results, Signaling pathways downregulated in the adult heart
    note: The paper's prenatal samples are fetal and embryonic; the embryo group is not named in the pair.
  F1_h3k27ac_all:
    unit: F1
    measure: loci with differential H3K27ac deposition
    finding: 25,149 loci with differential H3K27ac deposition across samples
    groups:
    - adult
