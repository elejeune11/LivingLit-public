      count: {value: F3H_ventricular_cm.values.count_table, kind: constant}
      cm: *cm
    output: F3H_ventricular_cm.values.pct_of_cm_table
  F3H_cardiomyocytes.pct_of_cm_table:
    item: F3H_cardiomyocytes
    group: ml_d100
    formula: pct = count/cm
    anchor: not stated
    library: *ratio_cm
    inputs:
      count: {value: F3H_cardiomyocytes.values.count_table, kind: constant}
      cm: *cm
    output: F3H_cardiomyocytes.values.pct_of_cm_table
    note: the S2G table prints this share of cardiomyocytes with no text naming it
  # ---------------------------------------------------------------- Fig. 4J / S4D: AP amplitude = peak - MDP
  F4J_Amplitude.amp_conv_d30_v: &amp
    item: F4J_Amplitude
    group: conv_d30_v
    formula: amp = peak - mdp
    anchor: &amp_anchor
      quote: MDP, peak, amplitude, frequency, and dV/dTMax
      where: STAR Methods, Patch clamp analysis
    library: &sop {formula: sum_of_parts, vars: {t: peak, a: amp, b: mdp}}
    inputs:
      peak: {value: F4J_Peak.values.conv_d30_v_table, part: mean, kind: per sample}
      mdp: {value: F4J_MDP.values.conv_d30_v_table, part: mean, kind: per sample}
    output: F4J_Amplitude.values.conv_d30_v_table
    aggregation: not stated
    alternatives: &amp_alt
    - label: amplitude from take-off (threshold) potential
      formula: amp = peak - vth
      note: another usage of AP amplitude; the take-off potential is not reported
    note: &amp_note Amplitude, peak and MDP are named action potential parameters (Clampfit); amplitude taken as peak minus
      MDP, the formula itself is not printed. Linear, so mean of per-sample equals the formula of means.
  F4J_Amplitude.amp_conv_d30_an:
    item: F4J_Amplitude
    group: conv_d30_an
    formula: amp = peak - mdp
    anchor: *amp_anchor
    library: *sop
    inputs:
      peak: {value: F4J_Peak.values.conv_d30_an_table, part: mean, kind: per sample}
      mdp: {value: F4J_MDP.values.conv_d30_an_table, part: mean, kind: per sample}
    output: F4J_Amplitude.values.conv_d30_an_table
    aggregation: not stated
    alternatives: *amp_alt
    note: *amp_note
  F4J_Amplitude.amp_ml_d30_v:
