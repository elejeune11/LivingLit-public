    note: Fig. 1G, five bars (mean ± SD) with four black filled markers each (one shape per biological replicate);
      raster at 300 dpi. Only the Control, GW6471 and All Antag. bars are read (the groups the tested items name).
      Labels are <item>/<group>; both items' control groups repeat the readings of the same bar. Markers do not
      touch each other but sit on 1-2 px lines (the control bar's top outline, whiskers, caps), which a 3x3 opening
      removes. Control points are 100 by construction (normalised to control) and the control bar has no error bar.
