    synonyms: []
  - event: add_term
    field: mechanical_load
    id: mechanical_load:unloaded
    label: unloaded
    parent: null
    definition: Culture in which the tissue bears no external load because it is free at one or both ends, so it can shorten
      freely.
    scope: No load (free-floating, or one end cut free); not an elastic load (auxotonic), not fixed length (isometric), not
      a strip load whose regime is not stated, and not externally applied cyclic stretch.
    synonyms:
    - text: no stress
      anchor: whereas no stress (NS) conditions were achieved with one end of the construct cut free of the nylon tab
  - event: add_synonym
    id: mechanical_load:isometric
    text: static stress
    anchor: Static stress (SS) conditioning was achieved by maintaining constructs at a fixed static length
  - event: add_synonym
    id: maturation_strategy:electrical_stimulation
    text: electric stimulation
    anchor: subjected to a second week of electric stimulation with 2 Hz
  - event: add_synonym
    id: CHEBI:4480
    text: 2,3-butanedione monoxime
    anchor: with 2,3-butanedione monoxime (30 mM)
  - event: add_term
    field: measure
    id: measure:cell_viability
    label: cell viability
    parent: null
    definition: Fraction of cells alive at a stated time, by a live/dead stain or similar assay.
    scope: Share of living cells; not the fraction of cells positive for a lineage marker (marker-positive cells).
    dimension: dimensionless
    synonyms: []
  - event: add_term
    field: measure
    id: measure:inverse_angle_dispersion
    label: inverse angle dispersion
    parent: null
    definition: Alignment of a stated structure (qualifier structure) as the reciprocal of the dispersion (standard deviation)
      of its angles in an image.
    scope: Reciprocal of an angle dispersion; not an orientational order parameter (actin or sarcomere) and not the angle
      histogram itself (orientation distribution).
    dimension: dimensionless
    qualifiers:
      structure:
        dimension: text
    synonyms: []
  - event: add_term
    field: measure
    id: measure:tissue_area_fraction
    label: tissue area fraction
    parent: null
    definition: Fraction of a tissue section's area occupied by a stated component (qualifier component), such as cells or
      muscle.
    scope: Share of a tissue section occupied by one component; not the absolute tissue cross-sectional area and not the mitochondrial
      area fraction within cells.
    dimension: dimensionless
    qualifiers:
      component:
        dimension: text
    synonyms: []
  - event: add_term
    field: measure
    id: measure:twitch_stress_strain_slope
    label: slope of twitch stress against strain
    parent: measure:frank_starling_response
    definition: Slope of isometric twitch stress against the tissue's strain (length step over slack length), the active force
      development per unit stretch.
    scope: The length dependence of twitch stress as one slope in stress units; not twitch stress at one length (twitch stress)
      and not passive stiffness (elastic modulus).
    dimension: stress
    synonyms: []
  - event: add_synonym
    id: measure:twitch_force
