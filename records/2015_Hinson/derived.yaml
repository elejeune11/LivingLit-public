  S2I_stress.stress:
    item: S2I_stress
    measure: tissue stress
    formula: sigma = F/A
    anchor: &id006
      quote: tissue stress that normalizes force per tissue cross-sectional area
      where: Methods, Cardiac Microtissue (CMT) platform
      file: NIHMS727908-supplement-Supplemental_text_and_figures.pdf
    library:
      formula: stress_def
      vars:
        sigma: sigma
        F: F
        A: A
    inputs:
      F:
        not_stated: true
        kind: per sample
        note: twitch force of each tissue; which force items share these tissues is not stated (S2I N>25 against Fig. 1D N=5)
      A:
        not_stated: true
        kind: per sample
        note: tissue cross-sectional area; how it was measured is not stated
    aggregation: not stated
  S2J_stress.stress:
    item: S2J_stress
