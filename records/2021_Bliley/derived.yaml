proposals:
- formula: cantilever_tip_stiffness
  kind: model
  statement: The stiffness of a slender elastic cantilever loaded at its free end is three times its modulus times its second
    moment of area over its length cubed.
  equations:
  - k = 3*E*I/L**3
  variables:
    k: stiffness
    E: modulus
    I: second_moment
    L: length
  assumes:
  - small deflection
  - linear elastic material
  - slender beam
  - point load at the free end
  does_not_apply: large deflections, a load applied away from the free end, or a short thick beam where shear deformation
    matters
  tests:
  - given:
      E: 1.0
      I: 1.0
      L: 1.0
    expect:
      k: 3.0
  - given:
      E: 200.0
      I: 2.0
      L: 2.0
    expect:
      k: 150.0
  - given:
      E: 1.0
      I: 1.0
      L: 1.0
    does_not_apply: 'load at mid-length of the cantilever: k = 24EI/L^3 (3EI/(L/2)^3), not 3EI/L^3'
  cites:
    text: Gere and Goodno, Mechanics of Materials, 8th ed., Cengage 2013, Appendix G, Table G-1 (cantilever beam, concentrated
      load at the free end)
    quote: δB = PL^3/3EI
- formula: rect_second_moment
  kind: definition
  statement: The second moment of area of a rectangular cross-section of width w and thickness t, about its centroidal axis
    parallel to the width, is w t^3 / 12.
  equations:
  - I = w*t**3/12
  variables:
    I: second_moment
    w: length
    t: length
  does_not_apply: bending about the other axis (I = t*w^3/12) or a non-rectangular section
  tests:
  - given:
      w: 12.0
      t: 1.0
    expect:
      I: 1.0
  - given:
      w: 3.0
      t: 2.0
    expect:
      I: 2.0
  - given:
      w: 3.0
      t: 2.0
    does_not_apply: 'bending about the width axis swapped: t*w^3/12 = 4.5, not 2'
  cites:
    text: Gere and Goodno, Mechanics of Materials, 8th ed., Cengage 2013, Appendix E (properties of plane areas, rectangle)
    quote: Ix = bh^3/12
- formula: strip_stiffness_thickness_ratio
  kind: derived
  statement: For two cantilever strips of the same modulus, width and length, the bending stiffness scales with the cube of
    the thickness.
  equations:
  - k2 = k1*(t2/t1)**3
  variables:
    k1: stiffness
    k2: stiffness
    E1: modulus
    E2: modulus
    I1: second_moment
    I2: second_moment
    L1: length
    L2: length
    w1: length
    w2: length
    t1: length
    t2: length
  uses:
  - formula: cantilever_tip_stiffness
    subs:
      k: k1
      E: E1
      I: I1
      L: L1
  - formula: cantilever_tip_stiffness
    subs:
      k: k2
      E: E2
      I: I2
      L: L2
  - formula: rect_second_moment
    subs:
      I: I1
      w: w1
      t: t1
  - formula: rect_second_moment
    subs:
      I: I2
      w: w2
      t: t2
  assumes:
  - E2 = E1
  - w2 = w1
  - L2 = L1
  does_not_apply: strips of different modulus, width or free length, where k2/k1 = (E2/E1)(w2/w1)(L1/L2)^3 (t2/t1)^3
  tests:
  - given:
      k1: 1.0
      t1: 1.0
      t2: 2.0
    expect:
      k2: 8.0
  - given:
      k1: 2.0
      t1: 2.0
      t2: 1.0
    expect:
      k2: 0.25
- formula: work_def
  kind: definition
  statement: The work done by a constant force along a straight displacement in its direction is the force times the displacement.
  equations:
  - W = F*d
  variables:
    W: energy
    F: force
    d: length
  does_not_apply: a force not along the displacement (W = F d cos θ) or a force that varies along the path (W is the integral
    of F)
  tests:
  - given:
      F: 2.0
      d: 3.0
    expect:
      W: 6.0
  - given:
      F: 2.0
      d: 3.0
    does_not_apply: 'force at 60° to the displacement: W = 3, not 6'
  cites:
    text: 'ISO 80000-4:2019 Quantities and units, Part 4: Mechanics (work)'
    url: https://www.iso.org/standard/64975.html
