      may_vary: [cell_line, day_of_measurement]
mappings:
# ---------------------------------------------------------------- context
- field: cell_line
  stated: WTC
  terms: [CVCL_IR31]
  note: the paper names the line 'WTC (AICS-0017, Allen Institute)'; AICS-0017 (the record's identifier qualifier) is the WTC-11 subclone
    WTC-mEGFP-DSP-cl65; 'WTC' alone is the parent line, so no synonym is added
- field: disease_model
  stated: arrhythmogenic cardiomyopathy
  terms: [MONDO:0016587]
  no_ontology_term: arrhythmogenic cardiomyopathy as a class covering right-, left-dominant and biventricular forms
  note: the paper says ACM was previously called arrhythmogenic right ventricular cardiomyopathy/dysplasia; mapped to that class, no synonym
    because ACM is now used more broadly
- field: genotype
  stated: PKP2 p.D109Afs*10
  terms: [genotype:pkp2_variant]
  qualifiers:
    gene: PKP2
    variant: p.D109Afs*10
    consequence: truncating
  note: consequence from 'predicting an early truncation of the protein (PKP2 p.D109Afs*10)'; zygosity is the record's own qualifier per group
- field: platform
  stated: cardiac microtissue
  terms: [platform:tissue_between_pillars]
  qualifiers:
    posts: two PDMS micropillars with spherical caps
  note: the paper's CMTs bridge two micropillars ('aligned tissues bridging two micropillars'); no synonym, since 'cardiac microtissue' also
    names spheroids and other formats elsewhere
- field: cm_medium
  stated: high-glucose DMEM
  terms: [cm_medium:dmem]
  qualifiers:
    glucose: high
- field: supplements
  stated: fetal bovine serum + penicillin-streptomycin + nonessential amino acids + GlutaMAX + Y-27632 + aprotinin
  terms: [supplements:fetal_bovine_serum, CHEBI:17334, CHEBI:17076, supplements:nonessential_amino_acids, CHEBI:73788, CHEBI:75393, CHEBI:749537]
  note: penicillin-streptomycin is one printed word for two compounds; Y-27632 is removed 2 days after seeding (record note)
