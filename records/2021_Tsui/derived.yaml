  S8_rmp_d14.tip_corrected:
    item: S8_rmp_d14
    measure: resting membrane potential
    formula: v = vm - vtip
    anchor:
      quote: Membrane potentials were corrected by subtraction of a 20 mV tip potential, calculated using the HEKA software
      where: Methods 2.16
    library:
      formula: difference_from_reference
      vars:
        d: v
        x: vm
        x0: vtip
    inputs:
      vm:
        not_stated: true
        kind: per sample
        note: recorded potential at 0 pA
      vtip:
        printed: '20'
        unit: mV
        kind: constant
        anchor:
          quote: Membrane potentials were corrected by subtraction of a 20 mV tip potential
          where: Methods 2.16
    note: The sign convention of the 20 mV tip potential is not stated (subtracting +20 mV).
